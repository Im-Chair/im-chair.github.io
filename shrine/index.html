<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>珠界：聖林神廟</title>
<link rel="icon" href="../icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#070a14;color:#eef1ff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;border-radius:10px;padding:10px 16px;background:#2b3a67;cursor:pointer}
button:active{filter:brightness(1.25)}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#070a14}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}

/* 標題畫面（按鈕樣式照珠界 #sTitle button） */
#sTitle{background:radial-gradient(circle at 50% 30%,#1d3b34,#0b1022 62%,#070a14)}
.logo{font-size:56px;font-weight:900;letter-spacing:8px;text-shadow:0 0 24px #7aa0ff}
.logo small{display:block;font-size:22px;letter-spacing:10px;margin-top:4px;color:#ffd84a}
.sub{font-size:13px;color:#8a95c0;letter-spacing:4px;margin:6px 0 22px}
#sTitle button,#sEnd button{position:relative;width:min(248px,72vw);height:54px;padding:0 28px;font-weight:700;letter-spacing:.18em;color:#d9dcf0;text-shadow:0 1px 3px #000;border:1px solid #a98a4e;border-radius:6px;background:linear-gradient(#222b57e6,#10163ae6);box-shadow:inset 0 0 0 2px #0a0e27,inset 0 0 0 3px #a98a4e44,0 4px 12px #0009}
#sTitle button.pri,#sEnd button.pri{color:#fff6d8;border-color:#f0cd7a;background:linear-gradient(#5273ec,#2c3fa8 55%,#222f88);box-shadow:inset 0 0 0 2px #141c4e,inset 0 0 0 3px #f0cd7a66,0 0 16px #5a7dff66,0 4px 12px #0009}
#sTitle button::before,#sTitle button::after{content:"";position:absolute;top:50%;width:8px;height:8px;background:linear-gradient(135deg,#ffe9a8,#b98d3e);box-shadow:0 0 0 1px #0a0e27;transform:translateY(-50%) rotate(45deg)}
#sTitle button::before{left:11px}#sTitle button::after{right:11px}
body.btn-art #sTitle button,body.btn-art #sTitle button.pri{height:62px;border:0;box-shadow:none;background:url(../pokemo/art/ui-btn.webp) center/100% 100% no-repeat}
body.btn-art #sTitle button.pri{background-image:url(../pokemo/art/ui-btn-pri.webp)}
body.btn-art #sTitle button::before,body.btn-art #sTitle button::after{display:none}
.ver{font-size:12px;color:#8a95c0;margin-top:10px}

/* 地圖畫面 */
#sMap{background:#0c1a0f}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud button{pointer-events:auto;padding:6px 14px;background:#0009;border:1px solid #fff4;border-radius:20px;font-size:14px}
#hudName{background:#0009;padding:4px 12px;border-radius:20px;font-size:13px}
#hudL{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
#hpCv{display:block;filter:drop-shadow(0 1px 2px #000a)}
#purse{display:flex;align-items:center;gap:6px;background:#0009;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700}
#purse b{min-width:1.5em;font-variant-numeric:tabular-nums}
.gem{display:inline-block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b8ffcc 35%,#2fbf6a);box-shadow:0 0 4px #7dffb0aa}
.keyic{display:inline-block;width:14px;height:8px;position:relative;margin-left:6px}
.keyic::before{content:"";position:absolute;left:0;top:0;width:6px;height:6px;border:2px solid #ffd84a;border-radius:50%}
.keyic::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:2px;background:#ffd84a;box-shadow:4px 2px 0 -0px #ffd84a}
#hudPiece{font-size:12px;color:#ffb8c8;background:#0009;padding:2px 10px;border-radius:12px}
/* 觸控按鈕（右下，圓形；搖桿在左下，不重疊） */
.tbtn{position:absolute;border-radius:50%;padding:0;font-weight:700;display:none;background:#141c3acc;border:2px solid #6f86d6;color:#eef1ff;font-size:15px}
.tbtn.down{filter:brightness(1.4);transform:scale(.95)}
body.touch .tbtn{display:block}
#atkBtn{right:18px;bottom:calc(34px + env(safe-area-inset-bottom));width:84px;height:84px;background:#3a1c1ccc;border-color:#e08a6a;font-size:17px}
#rollBtn{right:116px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px}
#shdBtn{right:28px;bottom:calc(134px + env(safe-area-inset-bottom));width:62px;height:62px;background:#2a2414cc;border-color:#c9a35a}
#hudR{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#dbg{display:none;background:#000b;padding:4px 8px;border-radius:8px;font:11px/1.4 monospace;white-space:pre;color:#bfe}
body.debug #dbg{display:block}
#joy{position:absolute;left:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44;display:none}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#ffffffaa;box-shadow:0 2px 8px #0008;pointer-events:none}
body.touch #joy{display:block}
#actBtn{position:absolute;right:112px;bottom:calc(112px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;padding:0;background:#1c3a2acc;border:2px solid #6fd69a;font-weight:700;font-size:15px;display:none}
body.touch #actBtn.on{display:block}
#hint{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:20px;font-size:13px;color:#dfe6ff;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
body.touch #hint{display:none}
#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100% - 32px);background:#000c;padding:8px 16px;border-radius:14px;font-size:14px;line-height:1.5;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
/* 副道具欄（左上，錢包下方）、聖物、首領血條、道具鈕、結尾畫面 */
#toolBox{display:none;align-items:center;gap:6px;background:#0009;padding:3px 10px 3px 4px;border-radius:20px;font-size:13px;pointer-events:auto;cursor:pointer}
#toolBox.on{display:flex}
#toolCv{width:26px;height:26px;display:block}
#toolBox small{color:#8a95c0;font-size:11px}
#relics{display:none;gap:4px;background:#0009;padding:4px 9px;border-radius:14px}
#relics.on{display:flex}
#relics i{display:block;width:10px;height:14px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#333a50}
#bossBar{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);width:min(440px,46vw);display:none;text-align:center;pointer-events:none;z-index:5}
#bossBar.on{display:block}
#bossName{font-size:14px;font-weight:700;letter-spacing:.12em;text-shadow:0 1px 3px #000,0 0 8px #000}
#bossName small{display:block;font-size:11px;color:#c9b98a;letter-spacing:.2em;font-weight:400}
#bossHp{margin-top:4px;height:10px;border:1px solid #f0cd7a;border-radius:6px;background:#1a0a10cc;overflow:hidden;box-shadow:0 0 8px #000a}
#bossHp b{display:block;height:100%;width:100%;background:linear-gradient(#ff7a6a,#c8283a);transition:width .15s}
#bossBar.p2 #bossHp b{background:linear-gradient(#ffb04a,#e0402a)}
@media (max-width:640px){#bossBar{top:calc(184px + env(safe-area-inset-top));width:calc(100% - 32px)}}   /* 手機：放在左上 HUD（心、錢包、道具、聖物）下面，不重疊 */
#itemBtn{right:112px;bottom:calc(184px + env(safe-area-inset-bottom));width:58px;height:58px;background:#1c2a3acc;border-color:#7ac0e0}
#itemBtn canvas{width:34px;height:34px;display:block;margin:auto;pointer-events:none}
#itemBtn b{position:absolute;right:-2px;bottom:-2px;font-size:11px;background:#000c;border-radius:8px;padding:0 4px}
#cycBtn{right:176px;bottom:calc(196px + env(safe-area-inset-bottom));width:36px;height:36px;font-size:13px;background:#141c3acc}
body.touch #itemBtn:not(.on),body.touch #cycBtn:not(.on){display:none}
#sEnd{background:radial-gradient(circle at 50% 35%,#2a2a4a,#0b1022 62%,#070a14)}
#sEnd h2{font-size:30px;letter-spacing:.3em;margin:0 0 6px;color:#ffe9a8;text-shadow:0 0 18px #ffd84a88}
#sEnd .lines{color:#bfcaf5;font-size:14px;line-height:1.8;max-width:420px}
#endStats{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:15px;margin:10px 0 18px;text-align:left}
#endStats span:nth-child(odd){color:#8a95c0}
#endStats b{font-variant-numeric:tabular-nums}

/* 對話框（照珠界 #dlgBox） */
#dlg{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px 12px calc(16px + env(safe-area-inset-bottom));z-index:20;background:linear-gradient(transparent,#000a 25%)}
#dlg.on{display:block}
#dlgBox{max-width:640px;margin:0 auto;background:#141c3acc;border:2px solid #6f86d6;border-radius:14px;padding:14px;min-height:110px;position:relative;font-size:16px;line-height:1.6}
#dlgName{position:absolute;top:-14px;left:14px;background:#3b55d6;border-radius:10px;padding:2px 12px;font-size:13px;font-weight:700}
#dlgNext{position:absolute;right:12px;bottom:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#dlgNext{animation:none}}

/* 世界地圖 */
#world{position:absolute;inset:0;z-index:30;display:none;background:#070a14e6;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#world.on{display:flex;flex-direction:column}
#worldBox{position:relative;flex:1;min-height:0;max-width:760px;width:100%;margin:0 auto;background:#141c3acc;border:2px solid #6f86d6;border-radius:14px;overflow:hidden}
#worldCv{position:absolute;inset:0;width:100%;height:100%}
#worldClose{position:absolute;right:10px;top:10px;padding:6px 14px;background:#0009;border:1px solid #fff4;border-radius:20px;font-size:14px}

/* 對話選項、面板（背包／商店／鍛造／賞金板，樣式沿用對話框）、挑戰計時 */
#dlgOpts{display:none;flex-direction:column;gap:6px;margin-top:10px}
#dlgOpts.on{display:flex}
#dlgOpts button{text-align:left;padding:8px 12px;background:#0b1230cc;border:1px solid #6f86d688;border-radius:10px;font-size:15px}
#dlgOpts button.sel{background:#3b55d6;border-color:#c9d4ff}
#dlgOpts button:disabled{opacity:.45}
#hudBtns{display:flex;gap:6px}
#dayTag{display:none;background:#0009;padding:2px 10px;border-radius:12px;font-size:12px;color:#ffd9a8}
#dayTag.on{display:block}
#panel{position:absolute;inset:0;z-index:25;display:none;background:#070a14cc;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#panel.on{display:flex;flex-direction:column}
#panelBox{flex:1;min-height:0;max-width:640px;width:100%;margin:0 auto;background:#141c3aee;border:2px solid #6f86d6;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
#panelHead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #6f86d655}
#panelTitle{font-size:17px;letter-spacing:.1em}
#panelSub{flex:1;font-size:13px;color:#bfcaf5;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panelClose{padding:6px 14px;background:#0009;border:1px solid #fff4;border-radius:20px;font-size:14px;flex:none}
#panelTabs{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
#panelTabs:empty{display:none}
#panelTabs button{padding:6px 12px;font-size:13px;background:#0b1230;border:1px solid #6f86d655;border-radius:16px}
#panelTabs button.on{background:#3b55d6;border-color:#c9d4ff}
#panelBody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px;touch-action:pan-y;-webkit-user-select:none}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;background:#0b1230aa;border:1px solid #6f86d633;border-radius:10px}
.prow.on{border-color:#ffd84a;box-shadow:inset 0 0 0 1px #ffd84a55}
.prow .pi{flex:1;min-width:0}
.prow .pn{font-weight:700;font-size:15px}
.prow .pd{font-size:12px;color:#aab4dd;line-height:1.45;margin-top:2px;overflow-wrap:anywhere;white-space:pre-line}
.prow button{flex:none;padding:6px 12px;font-size:13px;background:#2b3a67;border:1px solid #6f86d688;border-radius:10px;min-width:64px}
.prow button:disabled{opacity:.4}
.psec{font-size:12px;color:#ffd84a;letter-spacing:.15em;margin:10px 2px 6px}
.psec:first-child{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pchip{background:#0b1230aa;border:1px solid #6f86d633;border-radius:10px;padding:6px 10px;font-size:13px}
.pchip b{float:right;font-variant-numeric:tabular-nums}
.pchip.dim{opacity:.45}
#chal{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);display:none;background:#000c;border:1px solid #ffd84a88;padding:6px 16px;border-radius:14px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;z-index:6;pointer-events:none;white-space:nowrap}
#chal.on{display:block}
#fade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a95c0;font-size:14px;letter-spacing:2px;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
#fade.on{opacity:1;pointer-events:auto}
</style>
<script>
/* 版號：改了 maps.js 或這個檔就 +1，破除瀏覽器快取 */
const SHRINE_VER='12';
document.write('<script src="maps.js?v='+SHRINE_VER+'"><\/script>');
</script>
</head>
<body>
<div id="app">
  <section id="sTitle" class="screen center on">
    <div class="logo" id="logo"></div>
    <div class="sub">聖林・三座祭壇與失落的神廟</div>
    <button class="pri" id="btnCont" style="display:none">繼續</button>
    <button class="pri" id="btnStart">開始</button>
    <div class="ver" id="verTag">v1.0</div>
    <div class="ver">移動：WASD／方向鍵　攻擊：J 或 Z（按住蓄力，放開旋轉斬）<br>翻滾：K 或 X　舉盾：L 或 C　互動：空白鍵　地圖：M<br>道具：I 或 V 使用，Q／E 或數字鍵 1～4 切換<br>背包：B 或 Tab　手機：左下搖桿移動，右下按鈕攻擊／翻滾／舉盾／道具（長按道具鈕切換）</div>
  </section>
  <section id="sEnd" class="screen center">
    <h2 id="endTitle"></h2>
    <div class="lines" id="endLines"></div>
    <div id="endStats"></div>
    <button class="pri" id="btnEnd">回到標題</button>
  </section>
  <section id="sMap" class="screen">
    <canvas id="cv"></canvas>
    <div id="hud"><div id="hudL"><canvas id="hpCv"></canvas><div id="purse"><span class="gem"></span><b id="hudMoney">0</b><span id="hudKeyWrap" style="display:none"><span class="keyic"></span> <b id="hudKeys">0</b></span></div><div id="hudPiece" style="display:none"></div><div id="toolBox"><canvas id="toolCv" width="52" height="52"></canvas><span id="toolName"></span><b id="toolN"></b></div><div id="relics"><i></i><i></i><i></i></div><div id="hudName"></div></div><div id="hudR"><div id="hudBtns"><button id="bagBtn">背包</button><button id="mapBtn">地圖</button></div><div id="dayTag"></div><div id="dbg"></div></div></div>
    <div id="joy"><div id="knob"></div></div>
    <button id="actBtn">對話</button>
    <button class="tbtn" id="atkBtn">攻擊</button>
    <button class="tbtn" id="rollBtn">翻滾</button>
    <button class="tbtn" id="shdBtn">舉盾</button>
    <button class="tbtn" id="itemBtn"><canvas id="itemCv" width="68" height="68"></canvas><b id="itemN"></b></button>
    <button class="tbtn" id="cycBtn">換</button>
    <div id="bossBar"><div id="bossName"></div><div id="bossHp"><b></b></div></div>
    <div id="hint">空白鍵：對話</div>
    <div id="toast"></div>
    <div id="dlg"><div id="dlgBox"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgOpts"></div><div id="dlgNext">▼</div></div></div>
    <div id="panel"><div id="panelBox"><div id="panelHead"><b id="panelTitle"></b><span id="panelSub"></span><button id="panelClose">關閉</button></div><div id="panelTabs"></div><div id="panelBody"></div></div></div>
    <div id="chal"></div>
    <div id="world"><div id="worldBox"><canvas id="worldCv"></canvas><button id="worldClose">關閉</button></div></div>
  </section>
  <div id="fade"></div>
</div>
<script>
'use strict';
/* ============================================================
   珠界：聖林神廟 — 地圖引擎（先不做戰鬥）
   地圖資料全部在 maps.js（SHRINE_MAPS）；這裡只放引擎。
   地圖不用格子定義，改用「形狀」：輪廓、水、熔岩、鋪面、路都是平滑曲線。
   座標單位：1 單位＝48 CSS px（小數座標）。
   ============================================================ */
const GAME_TITLE='珠界：聖林神廟';   // 暫定標題，之後改這裡
const MAPS=typeof SHRINE_MAPS!=='undefined'?SHRINE_MAPS:{};   // maps.js 用 const 宣告，不在 window 上
const U=48;               // 1 單位的 CSS 像素
const DPR_MAX=2;          // 裝置像素比上限（手機記憶體）
const BLK=512;            // 地面區塊邊長（裝置像素）
const BLK_MIN_CACHE=40;   // 地面區塊快取下限（張；實際上限＝max(這個, 畫面所需＋12)，只淘汰本幀沒用到的）
const BLK_BUILD=2;        // 移動中每幀最多新建幾塊
const EXT=10;             // 地圖外圍種樹的範圍（單位）；樹的密度從 3 單位起往外漸淡，看不到方形外框
const MASK_RES=6;         // 可走遮罩：每單位幾格
const PLAYER_R=.28;       // 玩家碰撞半徑（單位）
const SPEED=4.2;          // 移動速度（單位／秒）
const HERO_H=1.3;         // 英雄身高（單位）
const NPC_K=1.05;         // NPC 圖高＝角色 h × 這個值（單位）
const TALK_DIST=1.3;      // 可對話距離（單位）
const LOCK_DIST=1.4;      // 靠近鎖住的門多近會跳提示（單位）
const TEX_UNITS=5;        // 地面紋理重複週期（單位）
const TILE_INSET=6;       // 圖集取樣內縮（像素），避免吃到相鄰圖格
const DEBUG=/[?&]debug=1/.test(location.search);

/* ===== 美術：沿用珠界的地圖素材（有圖用圖，缺變體用預設版，再不行用程式畫） ===== */
const PK='../pokemo/art/';
const THEMES=['','_coast','_ember','_marsh','_sky','_abyss'];
const ART_SRC={hero:'art/hero.webp'};
for(const t of THEMES)for(const k of ['tiles','tree1','tree2','house','rock','bush','sign'])ART_SRC[k+t]=`${PK}map-${k}${t}.webp`;
// 物件種類 → 用哪張圖、顯示寬度（單位，再乘上各自的縮放）
const PROP_ART={tree1:'tree1',tree2:'tree2',giant:'tree1',house:'house',rock:'rock',bush:'bush',sign:'sign'};
const ARTW={tree1:1.9,tree2:1.55,giant:4.4,house:3.35,rock:1.15,bush:1.25,sign:1.1};
// 英雄圖集 art/hero.webp：4 欄 × 4 列，每格 204×154，腳底貼齊格子底邊、水平置中
// 欄＝幀（0 站立、1/2 走路、3 攻擊），列＝方向（0 下、1 左、2 右、3 上）
const HERO_CW=204,HERO_CH=154,HERO_BODY=150;

}

function ribbonPoly(pts,seed,amp,freq){   // 帶寬度的曲線 → 封閉多邊形（低頻寬窄起伏＋兩側各自擾動，頭尾圓角）

// 形狀可在資料裡用 amp（邊緣起伏幅度，單位）／freq（起伏頻率）覆寫預設值；大湖要給大一點的 amp 才不會像橢圓
const shapePoly=(w,seed,amp,freq)=>{amp=w.amp!=null?w.amp:amp;freq=w.freq!=null?w.freq:freq;return w.type==='stream'||w.type==='strip'?ribbonPoly(w.pts,seed,amp,freq):blobPoly(w.pts,seed,amp,freq)};

const bbHit=(a,b)=>!(a[2]<b[0]||a[0]>b[2]||a[3]<b[1]||a[1]>b[3]);

const ART={},artLoad={},artFail={};
let GEN=1;   // 地面快取的世代：圖集或解析度變了就 +1，舊區塊在新區塊建好前繼續頂著
function needArt(k){
  return artLoad[k]||(artLoad[k]=new Promise(r=>{
    if(!ART_SRC[k]){artFail[k]=1;return r(false)}
    const im=new Image();
    im.onload=()=>{ART[k]=im;delete artFail[k];if(k.startsWith('tiles')&&texNeeds().includes(k)){buildTextures();GEN++}for(const s in SPR)SPR[s]=null;r(true)};
    im.onerror=()=>{artFail[k]=1;setTimeout(()=>{delete artLoad[k]},8000);r(false)};   // 抓失敗：先用預設版，幾秒後允許重抓
    im.src=ART_SRC[k];
  }));
}
// 物件圖：主題版 → 預設版 → null（呼叫端改用程式畫）；並預先縮到需要的解析度
const SPR={};
function sprite(kind){
  const base=PROP_ART[kind];if(!base)return null;
  const th=C?C.theme:'',tk=base+th,key=kind+'|'+th;
  if(SPR[key])return SPR[key];
  let im=ART[tk];
  if(!im){needArt(tk);if(th&&artFail[tk]){im=ART[base];if(!im)needArt(base)}}
  if(!im)return null;
  const S=U*dpr,w=Math.max(8,Math.round((ARTW[kind]||1)*1.3*S)),h=Math.round(w*im.height/im.width),c=mk(w,h),g=c.getContext('2d');
  g.imageSmoothingQuality='high';g.drawImage(im,0,0,w,h);

}

/* ================= 地面紋理（圖集格羽化後隨機旋轉印成可無縫平鋪的紋理） ================= */
const TEX={},TEXP={};
let WATERP=null,LAVAP=null,TEX_THEME=null;
function slotsOf(name,th){return (THEME_SLOTS[th]||THEME_SLOTS[''])[name]||COMMON_SLOTS[name]}
function texNeeds(){const th=C?C.theme:'';return [...new Set(['tiles','tiles'+th,'tiles_ember'])]}
function texSource(name){   // 回傳 {im,slots}；主題圖集缺檔就退回預設圖集
  const th=C?C.theme:'',sl=slotsOf(name,th),suf=sl[0][2]!=null?sl[0][2]:th,ak='tiles'+suf;
  if(ART[ak])return {im:ART[ak],slots:sl};
  if(artFail[ak]&&ART.tiles){const d=slotsOf(name,'');if(d[0][2]==null||d[0][2]==='')return {im:ART.tiles,slots:d}}
  return null;
}
function avgColor(im,[c,r]){
  try{const g=mk(1,1).getContext('2d',{willReadFrequently:true});g.drawImage(im,c*128+TILE_INSET,r*128+TILE_INSET,128-2*TILE_INSET,128-2*TILE_INSET,0,0,1,1);const d=g.getImageData(0,0,1,1).data;return `rgb(${d[0]},${d[1]},${d[2]})`}catch(e){return null}
}
function featherStamp(im,[c,r],sz){
  const cv=mk(sz,sz),g=cv.getContext('2d');
  g.drawImage(im,c*128+TILE_INSET,r*128+TILE_INSET,128-2*TILE_INSET,128-2*TILE_INSET,0,0,sz,sz);
  const gr=g.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);gr.addColorStop(0,'#fff');gr.addColorStop(.5,'#fff');gr.addColorStop(1,'rgba(255,255,255,0)');

  return cv;
}
function buildTextures(){
  const S=U*dpr,N=Math.round(TEX_UNITS*S);
  TEX_THEME=C?C.theme:'';
  for(const k of TEX_NAMES){
    const cv=mk(N,N),g=cv.getContext('2d'),R=rng(hashStr('tex-'+k)),src=texSource(k);
    const wrap=fn=>{for(const ox of [-N,0,N])for(const oy of [-N,0,N])fn(ox,oy)};
    if(src){
      g.fillStyle=avgColor(src.im,src.slots[0])||TEX_FALL[k];g.fillRect(0,0,N,N);
      const ss=TEX_STAMP[k]||1.35,sz=Math.round(ss*S),stamps=src.slots.map(sl=>featherStamp(src.im,sl,sz)),gap=ss*.48,n=Math.ceil(TEX_UNITS/gap),list=[];
      for(let y=0;y<n;y++)for(let x=0;x<n;x++)list.push([(x+.5+(R()-.5)*.9)*gap*S,(y+.5+(R()-.5)*.9)*gap*S,stamps[Math.floor(R()*stamps.length)],R()*Math.PI*2,.9+R()*.25,R()]);
      list.sort((a,b)=>a[5]-b[5]);   // 打亂疊放順序，避免看出由上到下的方向
      for(const [cx,cy,st,a,sc] of list)wrap((ox,oy)=>{const px=cx+ox,py=cy+oy;if(px<-sz||py<-sz||px>N+sz||py>N+sz)return;g.save();g.translate(px,py);g.rotate(a);g.scale(sc,sc);g.drawImage(st,-sz/2,-sz/2);g.restore()});
    }else{   // 圖集還沒到：純色＋雜點
      g.fillStyle=TEX_FALL[k];g.fillRect(0,0,N,N);
      for(let i=0;i<N*N/70;i++){const x=R()*N,y=R()*N,r=(1+R()*2)*dpr;g.fillStyle=R()<.5?'rgba(255,255,230,.13)':'rgba(0,20,0,.16)';wrap((ox,oy)=>{g.beginPath();g.arc(x+ox,y+oy,r,0,7);g.fill()})}
    }
    if(TEX_DARK[k]){g.fillStyle=TEX_DARK[k];g.fillRect(0,0,N,N)}

function pat(cv){   // 紋理樣式：圖樣 1px＝1 裝置像素、原點對齊世界座標
  const p=ctx.createPattern(cv,'repeat'),S=U*dpr;

function compileMap(id){

  const seed=hashStr(id),c={id,M,w:M.w,h:M.h,theme:M.theme||'',indoor:M.kind==='indoor'};
  const R=rng(seed+4242);
  c.outline=blobPoly(M.outline,seed+1,M.outlineAmp!=null?M.outlineAmp:c.indoor?.22:.16,c.indoor?.9:.7);c.outlineBB=bbox(c.outline);c.extBB=bbox(c.outline,2.2);
  const sh=(list,s0,amp,freq)=>(list||[]).map((w,i)=>{const poly=shapePoly(w,seed+s0+i,amp,freq);return {poly,bb:bbox(poly,.2)}});
  c.water=sh(M.water,10,.1,.8);c.lava=sh(M.lava,20,.14,.9);
  c.islands=(M.islands||[]).map((p,i)=>{const poly=blobPoly(p,seed+40+i,.12,.9);return {poly,bb:bbox(poly,.2)}});
  c.forest=(M.forest||[]).map((f,i)=>{const poly=blobPoly(f,seed+30+i,.2,.9);return {poly,bb:bbox(poly,.2)}});
  c.paths=(M.paths||[]).map((p,i)=>{const poly=ribbonPoly(p,seed+50+i,.16,1.1);return {poly,bb:bbox(poly,.6),center:spline(p,false,.25)}});
  c.floor=(M.floor||[]).map((f,i)=>{   // 鋪面：高頻的碎裂邊＋邊緣散落的碎石塊
    const poly=f.type==='strip'?ribbonPoly(f.pts,seed+70+i,.2,2.2):blobPoly(f.pts,seed+70+i,.2,2.2),rub=[];
    for(let j=0;j<poly.length;j+=2){
      if(R()<.55)continue;
      const p=poly[j],q=poly[(j+1)%poly.length];let nx=q[1]-p[1],ny=p[0]-q[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;

      const o=.15+R()*.45,cx=p[0]+nx*o,cy=p[1]+ny*o,s=.07+R()*.15,a=R()*Math.PI;
      rub.push([0,1,2,3].map(k=>{const g=a+k*Math.PI/2+(R()-.5)*.6,rr=s*(.7+R()*.6);return [cx+Math.cos(g)*rr,cy+Math.sin(g)*rr]}));

  });

    const dx=b.b[0]-b.a[0],dy=b.b[1]-b.a[1],L0=Math.hypot(dx,dy),len=L0+.5,ux=dx/L0,uy=dy/L0,cx=(b.a[0]+b.b[0])/2,cy=(b.a[1]+b.b[1])/2;
    const q=hw=>[[cx-ux*len/2-uy*hw,cy-uy*len/2+ux*hw],[cx+ux*len/2-uy*hw,cy+uy*len/2+ux*hw],[cx+ux*len/2+uy*hw,cy+uy*len/2-ux*hw],[cx-ux*len/2+uy*hw,cy-uy*len/2-ux*hw]];
    return {cx,cy,len,w:b.w,ang:Math.atan2(uy,ux),style:b.style||'wood',deck:q(b.w/2-.14),poly:q(b.w/2)};
  });

  (M.chests||[]).forEach(o=>add('chest',o.x,o.y,1,false,{id:o.id,loot:o.loot}));
  (M.pots||[]).forEach(o=>add('pot',o.x,o.y,.9+R()*.2,false));
  (M.braziers||[]).forEach(o=>add('brazier',o.x,o.y,1,false,{id:o.id,lit:!!o.lit}));
  (M.blocks||[]).forEach(o=>add('block',o.x,o.y,1,false));

/* ================= 碰撞 ================= */
function colsNear(x,y){const a=C.cols.get(Math.floor(x/2)+','+Math.floor(y/2));return a||[]}
function colHit(col,x,y,r){
  if(col.off)return false;   // 已打破的陶罐等
  if(col.r!=null)return Math.hypot(x-col.x,y-col.y)<r+col.r;
  const qx=clamp(x,col.x0,col.x1),qy=clamp(y,col.y0,col.y1);return Math.hypot(x-qx,y-qy)<r;
}
function circleFree(x,y,r){
  if(!walkAt(C,x,y))return false;
  if(HOOKS.blocked(x,y,r))return false;   // 首領戰的結界等
  for(const [a,b] of RING16)if(!walkAt(C,x+a*r,y+b*r))return false;
  for(const [a,b] of RING8)if(!walkAt(C,x+a*r*.55,y+b*r*.55))return false;
  const seen=new Set();
  for(const [ox,oy] of [[0,0],[-r,0],[r,0],[0,-r],[0,r]])for(const col of colsNear(x+ox,y+oy)){if(seen.has(col))continue;seen.add(col);if(colHit(col,x,y,r))return false}
  return true;
}
function wallNormal(x,y,r){   // 估計擋住處的法向（遮罩取樣＋碰撞體），用來沿牆滑動；第三個值＝是不是碰撞體擋的
  let nx=0,ny=0,byCol=false;
  for(const [a,b] of RING16)if(!walkAt(C,x+a*r*1.2,y+b*r*1.2)){nx-=a;ny-=b}
  const seen=new Set();
  for(const [ox,oy] of [[0,0],[-r,0],[r,0],[0,-r],[0,r]])for(const col of colsNear(x+ox,y+oy)){
    if(seen.has(col))continue;seen.add(col);
    if(!colHit(col,x,y,r*1.2))continue;
    let qx,qy;if(col.r!=null){qx=col.x;qy=col.y}else{qx=clamp(x,col.x0,col.x1);qy=clamp(y,col.y0,col.y1)}
    const dx=x-qx,dy=y-qy,l=Math.hypot(dx,dy)||1;nx+=dx/l*3;ny+=dy/l*3;byCol=col.r!=null;
  }
  const l=Math.hypot(nx,ny);return l>1e-6?[nx/l,ny/l,byCol]:null;
}
function depenetrate(x,y){   // 沿切線滑動後若稍微陷進曲面，沿法向推出來（最多幾小步）
  for(let k=0;k<6;k++){
    if(circleFree(x,y,PLAYER_R))return [x,y];
    const n=wallNormal(x,y,PLAYER_R);if(!n)return null;
    x+=n[0]*.02;y+=n[1]*.02;
  }
  return null;
}
function moveBy(dx,dy){
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.06));dx/=steps;dy/=steps;
  const stuck=!circleFree(P.x,P.y,PLAYER_R);   // 萬一卡在裡面（例如落點有問題），允許直接走出來
  for(let s=0;s<steps;s++){
    const nx=P.x+dx,ny=P.y+dy;
    if(stuck||circleFree(nx,ny,PLAYER_R)){P.x=nx;P.y=ny;continue}
    const n=wallNormal(nx,ny,PLAYER_R);
    if(n){
      const tx=-n[1],ty=n[0],st=Math.hypot(dx,dy);let d=dx*tx+dy*ty;
      if(n[2]&&Math.abs(d)<st*.35)d=(d>=0?1:-1)*st*.6;   // 正面撞上樹幹、石頭等圓形物：自動往側邊繞過去
      if(Math.abs(d)>1e-5){const q=depenetrate(P.x+tx*d,P.y+ty*d);if(q&&Math.hypot(q[0]-P.x,q[1]-P.y)>st*.15){P.x=q[0];P.y=q[1];continue}}
    }
    if(dx&&circleFree(P.x+dx,P.y,PLAYER_R)){P.x+=dx;continue}
    if(dy&&circleFree(P.x,P.y+dy,PLAYER_R)){P.y+=dy;continue}
    break;
  }
}

  const sp=C.M.spawn;P.x=x!=null?x:sp[0];P.y=y!=null?y:sp[1];if(face)P.face=face;

/* ================= 對話（照珠界 say） ================= */
function say(lines){
  return new Promise(res=>{
    const d=$('#dlg'),txt=$('#dlgText'),nm=$('#dlgName');
    let i=0,timer=null,full='',pos=0;
    dlgOpen=true;d.classList.add('on');
    const showLine=()=>{
      const L=lines[i],name=Array.isArray(L)?L[0]:'';full=Array.isArray(L)?L[1]:L;
      nm.style.display=name?'block':'none';nm.textContent=name;txt.style.color=name?'#fff':'#bfcaf5';
      pos=0;txt.textContent='';clearInterval(timer);
      timer=setInterval(()=>{pos++;txt.textContent=full.slice(0,pos);if(pos>=full.length)clearInterval(timer)},22);
    };
    const next=()=>{
      if(pos<full.length){clearInterval(timer);pos=full.length;txt.textContent=full;return}
      i++;if(i>=lines.length){clearInterval(timer);d.classList.remove('on');d.onclick=null;removeEventListener('keydown',onKey);dlgOpen=false;res()}else showLine();
    };
    const onKey=e=>{if((e.key!=='Enter'&&e.key!==' ')||e.repeat)return;e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();next()};
    d.onclick=next;addEventListener('keydown',onKey);
    showLine();
  });
}
function talk(){
  if(!nearTalk||dlgOpen||lock||worldOpen)return;
  const t=nearTalk;Object.keys(keys).forEach(k=>keys[k]=false);
  if(t.act){t.act();return}   // 寶箱、營火等（game.js）
  if(t.text)say([t.text]);else say(t.lines.map(l=>[t.name,l]));
}
/* 有選項的對話：lines 照 say 的格式，最後一句顯示完後列出 opts（字串或 {t,off}），回傳選到的索引（Esc／取消＝最後一項） */
function ask(lines,opts){
  return new Promise(res=>{
    const d=$('#dlg'),txt=$('#dlgText'),nm=$('#dlgName'),box=$('#dlgOpts'),nx=$('#dlgNext');
    lines=Array.isArray(lines)?lines:[lines];let i=0,timer=null,full='',pos=0,sel=0,btns=[];
    dlgOpen=true;d.classList.add('on');
    const finish=k=>{clearInterval(timer);box.classList.remove('on');box.innerHTML='';nx.style.display='';d.classList.remove('on');d.onclick=null;removeEventListener('keydown',onKey);dlgOpen=false;res(k)};
    const mark=()=>btns.forEach((b,j)=>b.classList.toggle('sel',j===sel));
    const showOpts=()=>{box.innerHTML='';btns=opts.map((o,j)=>{const b=document.createElement('button');b.textContent=(j+1)+'. '+(o.t||o);b.disabled=!!o.off;b.onclick=ev=>{ev.stopPropagation();if(!b.disabled)finish(j)};box.append(b);return b});
      sel=Math.max(0,btns.findIndex(b=>!b.disabled));mark();box.classList.add('on');nx.style.display='none'};
    const showLine=()=>{const L=lines[i],name=Array.isArray(L)?L[0]:'';full=Array.isArray(L)?L[1]:L;
      nm.style.display=name?'block':'none';nm.textContent=name;txt.style.color=name?'#fff':'#bfcaf5';pos=0;txt.textContent='';clearInterval(timer);
      timer=setInterval(()=>{pos++;txt.textContent=full.slice(0,pos);if(pos>=full.length){clearInterval(timer);if(i===lines.length-1)showOpts()}},18)};
    const next=()=>{if(box.classList.contains('on'))return;if(pos<full.length){clearInterval(timer);pos=full.length;txt.textContent=full;if(i===lines.length-1)showOpts();return}if(i<lines.length-1){i++;showLine()}};
    const step=dir=>{for(let k=0;k<btns.length;k++){sel=(sel+dir+btns.length)%btns.length;if(!btns[sel].disabled)break}mark()};
    const onKey=e=>{if(e.repeat)return;const on=box.classList.contains('on');
      if(on&&(e.key==='ArrowDown'||e.key==='s'||e.key==='S')){e.preventDefault();step(1)}
      else if(on&&(e.key==='ArrowUp'||e.key==='w'||e.key==='W')){e.preventDefault();step(-1)}
      else if(on&&/^[1-9]$/.test(e.key)&&btns[+e.key-1]&&!btns[+e.key-1].disabled){e.preventDefault();finish(+e.key-1)}
      else if(on&&e.key==='Escape'){e.preventDefault();finish(opts.length-1)}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(on){if(!btns[sel].disabled)finish(sel)}else next()}};
    d.onclick=next;addEventListener('keydown',onKey);showLine();
  });
}

/* ================= 更新 ================= */
function update(dt){
  if(lock||dlgOpen||worldOpen||panelOpen){P.moving=false;$('#hint').classList.remove('on');$('#actBtn').classList.remove('on');return}
  let ix=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),iy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  ix+=joy.x;iy+=joy.y;
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  const sm=HOOKS.player(dt);   // 攻擊、翻滾、舉盾、擊退時由 game.js 決定能不能走、走多快
  if(lock)return;
  if(m>.15&&sm>0){
    moveBy(ix*SPEED*sm*dt,iy*SPEED*sm*dt);P.moving=true;P.anim+=dt*Math.max(.5,sm);
    const ax=Math.abs(ix),ay=Math.abs(iy);
    if(!HOOKS.faceLock()){
    if(ax>ay*1.15)P.face=ix<0?'left':'right';else if(ay>ax*1.15)P.face=iy<0?'up':'down';
    else{const h=ix<0?'left':'right',v=iy<0?'up':'down';if(P.face!==h&&P.face!==v)P.face=ax>=ay?h:v}
    }
  }else P.moving=false;
  // 出口
  const inside=C.exits.find(e=>inRect(e,P.x,P.y));
  if(!inside)P.exitLock=false;else if(!P.exitLock){useExit(inside);return}
  // 可對話的 NPC／告示牌
  nearTalk=null;let best=TALK_DIST;
  for(const n of C.npcs){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<best){best=d;nearTalk=n}
    n.face=d<3?(Math.abs(P.x-n.x)>Math.abs(P.y-n.y)?(P.x<n.x?2:3):(P.y<n.y?1:0)):0}
  for(const s of C.signs){const d=Math.hypot(s.x-P.x,s.y-.2-P.y);if(d<best){best=d;nearTalk=s}}
  const ex=HOOKS.near(best);if(ex)nearTalk=ex;
  const lab=nearTalk&&nearTalk.label||'對話';
  if($('#actBtn').textContent!==lab){$('#actBtn').textContent=lab;$('#hint').textContent='空白鍵：'+lab}
  $('#actBtn').classList.toggle('on',!!nearTalk);$('#hint').classList.toggle('on',!!nearTalk);
  // 鎖住的門：靠近就提示
  nearLock=C.locks.find(l=>!l.open&&rectDist(l,P.x,P.y)<LOCK_DIST)||null;
  if(nearLock)toast(nearLock.text||LOCK_TEXT[nearLock.need]||'門鎖著。');
  HOOKS.update(dt);
}

function drawBoard(c,n){   // 賞金板（NPC 佔位）

  c.fillStyle='#5a3b22';c.fillRect(x-.55,y-1.3,.1,1.3);c.fillRect(x+.45,y-1.3,.1,1.3);
  c.fillStyle='#8d6038';rr(c,x-.7,y-1.45,1.4,.85,.06);c.fill();
  c.fillStyle='#efe2c0';c.fillRect(x-.5,y-1.32,.42,.5);c.fillRect(x+.02,y-1.28,.44,.36);
}
function drawHero(c){
  const im=ART.hero,fx=P.x,fy=P.y+.12;

  if(!im){c.fillStyle='#2f7a3a';c.beginPath();c.arc(fx,fy-.45,.3,0,7);c.fill();c.fillStyle='#f0c9a0';c.beginPath();c.arc(fx,fy-.95,.22,0,7);c.fill();return}
  const fr=P.moving?1+(Math.floor(P.anim*8)%2):0,row={down:0,left:1,right:2,up:3}[P.face];
  const h=HERO_H*HERO_CH/HERO_BODY,w=h*HERO_CW/HERO_CH;

}
function bubble(c,bx,by){c.fillStyle='#fffffff0';c.beginPath();c.ellipse(bx,by,.32,.2,0,0,7);c.fill();c.beginPath();c.moveTo(bx-.06,by+.16);c.lineTo(bx+.06,by+.16);c.lineTo(bx,by+.28);c.fill();c.fillStyle='#3b55d6';for(const k of [-1,0,1]){c.beginPath();c.arc(bx+k*.11,by,.035,0,7);c.fill()}}
function drawNpc(c,n,now){
  const d=CH[n.ch],im=d&&ART[d.art];let h=1.2;
  drawShadow(c,n.x,n.y+.08,n.ch==='board'?1.2:.6,.22);
  if(n.ch==='board'){drawBoard(c,n);h=1.5}
  else if(!im){if(d)needArt(d.art);c.fillStyle='#5a7dff';c.beginPath();c.arc(n.x,n.y-.4,.3,0,7);c.fill();c.fillStyle='#f0c9a0';c.beginPath();c.arc(n.x,n.y-.9,.22,0,7);c.fill()}
  else{h=d.h*NPC_K;const w=h*d.cw/d.ch;c.drawImage(im,n.face*d.cw,0,d.cw,d.ch,n.x-w/2,n.y+.1-h,w,h)}
  if(n===nearTalk&&!dlgOpen)bubble(c,n.x,n.y-h-.18+Math.sin(now/300)*.04);
}
function drawBridge(c,b){
  c.save();c.translate(b.cx,b.cy);c.rotate(b.ang);
  const L=b.len,w=b.w,stone=b.style==='stone',pl=pal();
  if(b.broken){   // 斷橋：兩端各剩一小截殘樁
    for(const sg of [-1,1]){const xo=sg*L/2,xi=xo-sg*.6;c.fillStyle='rgba(0,0,0,.35)';c.fillRect(Math.min(xo,xi)+.05,-w/2+.16,.6,w);
      c.fillStyle=stone?pl.st:'#8d6038';c.beginPath();c.moveTo(xo,-w/2);c.lineTo(xi,-w/2);for(let k=1;k<6;k++)c.lineTo(xi+sg*(k%2?.14:-.04),-w/2+w*k/6);c.lineTo(xi,w/2);c.lineTo(xo,w/2);c.closePath();c.fill();
      c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=.03;c.stroke()}
    c.restore();return;
  }
  c.fillStyle='rgba(0,18,34,.35)';c.fillRect(-L/2+.05,-w/2+.16,L,w);              // 影子
  c.fillStyle=stone?pl.st:'#8d6038';c.fillRect(-L/2,-w/2,L,w);
  const R=rng(hashStr(CURID+b.cx)),step=stone?.42:.25;
  for(let x=-L/2;x<L/2-.01;x+=step){
    c.fillStyle=stone?`rgba(${R()<.5?'255,255,255':'0,0,0'},${(.05+R()*.12).toFixed(3)})`:`rgba(${R()<.5?'255,230,190':'40,20,5'},${(.04+R()*.1).toFixed(3)})`;c.fillRect(x,-w/2,step,w);
    c.fillStyle=stone?'rgba(0,0,0,.3)':'rgba(55,32,14,.75)';c.fillRect(x,-w/2,.025,w);
  }
  if(stone){c.fillStyle=pl.st;c.globalAlpha=.5;c.fillRect(-L/2,-w/2,L,.1);c.globalAlpha=1;c.fillStyle='rgba(0,0,0,.35)';c.fillRect(-L/2,w/2-.08,L,.08)}
  else{c.fillStyle='#5b3a1e';c.fillRect(-L/2,-w/2,L,.13);c.fillRect(-L/2,w/2-.13,L,.13);
    c.fillStyle='#46301a';for(const x of [-L/2,-.09,L/2-.18])for(const y of [-w/2-.03,w/2-.17])c.fillRect(x,y,.18,.2)}
  c.restore();
}
function drawArena(c,b,now){   // 首領場地：地上淡淡的符文圈
  const r=b.arena||4;c.save();c.strokeStyle='rgba(255,240,210,.16)';c.lineWidth=.06;
  c.beginPath();c.arc(b.x,b.y,r,0,7);c.stroke();c.beginPath();c.arc(b.x,b.y,r-.35,0,7);c.stroke();
  c.lineWidth=.05;for(let k=0;k<24;k++){const a=k/24*Math.PI*2+now/20000;c.beginPath();c.moveTo(b.x+Math.cos(a)*(r-.32),b.y+Math.sin(a)*(r-.32));c.lineTo(b.x+Math.cos(a)*(r-.05),b.y+Math.sin(a)*(r-.05));c.stroke()}
  c.restore();
}

/* ================= 繪製：主畫面 ================= */
let LCV=null,LCTX=null;
function render(now){
  if(!C||!cw||!ch)return;   // 畫面還沒有尺寸（隱藏的分頁）
  const t0=performance.now();
  const S=U*dpr,c=ctx;frameNo++;stat.frameBuilt=0;
  const vw=cw/S,vh=ch/S;
  const cf=HOOKS.camera()||P;
  const camX=C.w>vw?clamp(cf.x-vw/2,0,C.w-vw):(C.w-vw)/2,camY=C.h>vh?clamp(cf.y-vh/2,0,C.h-vh):(C.h-vh)/2;
  camDX=Math.round(camX*S);camDY=Math.round(camY*S);
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.fillStyle=BG;c.fillRect(0,0,cw,ch);
  // 地面區塊：只貼離屏圖
  const i0=Math.floor(camDX/BLK),i1=Math.floor((camDX+cw-1)/BLK),j0=Math.floor(camDY/BLK),j1=Math.floor((camDY+ch-1)/BLK);
  blkMax=Math.max(BLK_MIN_CACHE,(i1-i0+3)*(j1-j0+3)+4);
  const full=forceFull;forceFull=false;
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const e=getBlock(i,j,full||stat.frameBuilt<BLK_BUILD);
    if(e)c.drawImage(e.cv,i*BLK-camDX,j*BLK-camDY);
    else{c.fillStyle=TEX_FALL.grass;c.fillRect(i*BLK-camDX,j*BLK-camDY,BLK,BLK)}
  }
  // 預建：視野外一圈，有剩額度才建（走過去時就不用現場建）
  if(stat.frameBuilt<BLK_BUILD){
    outer:for(let j=j0-1;j<=j1+1;j++)for(let i=i0-1;i<=i1+1;i++){
      if(i>=i0&&i<=i1&&j>=j0&&j<=j1)continue;
      const e=blk.get(i+','+j);if(!e||e.gen!==GEN){getBlock(i,j,true);break outer}else e.used=frameNo;
    }
  }
  trimBlocks();
  // 世界座標（單位）
  c.setTransform(S,0,0,S,-camDX,-camDY);
  const vx0=camDX/S,vy0=camDY/S,vx1=vx0+vw,vy1=vy0+vh,view=[vx0,vy0,vx1,vy1],tt=now/1000;
  // 水面動態：整片同相位，疊一層緩慢漂移的深水紋理（島嶼挖掉）
  if(C.waterBB&&WATERP&&bbHit(C.waterBB,view)){
    if(WATERP.setTransform)WATERP.setTransform(new DOMMatrix([1/S,0,0,1/S,(tt*.18)%TEX_UNITS,(tt*.07)%TEX_UNITS]));
    c.save();c.clip(C.waterPath);
    if(C.islandPaths.length){const p=new Path2D();p.rect(vx0-1,vy0-1,vw+2,vh+2);C.islandPaths.forEach(q=>p.addPath(q));c.clip(p,'evenodd')}
    c.globalAlpha=.2+.12*Math.sin(tt*1.3);c.fillStyle=WATERP;c.fillRect(vx0,vy0,vw,vh);c.restore();
  }
  // 熔岩：緩慢流動＋發亮
  if(C.lavaBB&&LAVAP&&bbHit(C.lavaBB,view)){
    if(LAVAP.setTransform)LAVAP.setTransform(new DOMMatrix([1/S,0,0,1/S,(tt*.12)%TEX_UNITS,(-tt*.09)%TEX_UNITS]));
    c.save();c.clip(C.lavaPath);c.globalCompositeOperation='lighter';c.globalAlpha=.22+.14*Math.sin(tt*1.7);c.fillStyle=LAVAP;c.fillRect(vx0,vy0,vw,vh);c.restore();
  }
  C.bridges.forEach(b=>drawBridge(c,b));
  if(C.M.boss&&bbHit([C.M.boss.x-6,C.M.boss.y-6,C.M.boss.x+6,C.M.boss.y+6],view))drawArena(c,C.M.boss,now);
  HOOKS.ground(c,now);
  // 物件與角色：依 y 排序（人走到樹後會被樹冠遮住）
  const vis=C.props.filter(p=>!p.gone&&p.x+p.w>vx0&&p.x-p.w<vx1&&p.y>vy0-.5&&p.y-p.h<vy1);
  for(const p of vis){const sh=SHADOW_OF[p.k];if(sh)drawShadow(c,p.x,p.y+sh[2]*p.s,p.w*sh[0],p.w*sh[1])}
  const actors=[{sy:P.y+.12,draw:()=>(HOOKS.drawHero||drawHero)(c)},...C.npcs.map(n=>({sy:n.y+.1,draw:()=>drawNpc(c,n,now)}))];
  HOOKS.actors(actors,c,now);actors.sort((a,b)=>a.sy-b.sy);
  let ai=0,ghost=false;
  const hy=P.y+.12,hx0=P.x-.34,hx1=P.x+.34,hy0=hy-HERO_H*.9;
  for(const p of vis){
    while(ai<actors.length&&actors[ai].sy<p.sy)actors[ai++].draw();
    // 英雄被樹冠／屋子擋住時，擋住的那個物件明顯半透明，最後再補一層英雄剪影（看得出人在哪）
    if(p.sy>hy&&(p.k==='tree1'||p.k==='tree2'||p.k==='giant'||p.k==='house'||p.k==='pillar')&&hx1>p.x-p.w*.42&&hx0<p.x+p.w*.42&&hy0<p.y-.25&&hy>p.y-p.h*.95){c.globalAlpha=.32;drawProp(c,p,now);c.globalAlpha=1;ghost=true}
    else drawProp(c,p,now);
    if(p===nearTalk&&!dlgOpen)bubble(c,p.x,p.y-1.25+Math.sin(now/300)*.04);
  }

// 自我檢查：每張地圖的出生點／落點、可到達性、出口成對
function audit(){
  const out={},keep=C,arrivals={};
  for(const a in MAPS)for(const e of MAPS[a].exits||[])(arrivals[e.to]=arrivals[e.to]||[]).push({from:a,x:e.tx,y:e.ty});
  for(const id in MAPS){
    const c=compileMap(id);C=c;const r={problems:[],locked:[]};
    const pts=[{what:'出生點',x:c.M.spawn[0],y:c.M.spawn[1]},...(arrivals[id]||[]).map(a=>({what:'從'+a.from+'來的落點',x:a.x,y:a.y}))];
    for(const p of pts){if(!circleFree(p.x,p.y,PLAYER_R))r.problems.push(p.what+'不在可走區或卡在碰撞體');if(c.exits.some(e=>inRect(e,p.x,p.y)))r.problems.push(p.what+'在出口矩形內')}
    // 洪水填充（以玩家圓能站的格子為準）。第一次：鎖都關著、不用勾爪；第二次：鎖全開＋勾爪樁互連（到得了＝只是被機關擋住）
    const mw=c.mw,mh=c.mh,q=[],lockCols=c.props.filter(p=>p.k==='lock').map(p=>p.col),hooks=c.props.filter(p=>p.k==='hook');
    const flood=(open)=>{
      const keepOff=lockCols.map(l=>l.off);if(open)lockCols.forEach(l=>l.off=true);
      const ok=new Int8Array(mw*mh).fill(-1),seen=new Uint8Array(mw*mh);
      const can=i=>{if(ok[i]<0)ok[i]=circleFree((i%mw+.5)/MASK_RES,(Math.floor(i/mw)+.5)/MASK_RES,PLAYER_R)?1:0;return ok[i]===1};
      const seed=(x,y,rad)=>{const R=Math.ceil(rad*MASK_RES),cx=Math.floor(x*MASK_RES),cy=Math.floor(y*MASK_RES);for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const nx=cx+i,ny=cy+j;if(nx<0||ny<0||nx>=mw||ny>=mh||Math.hypot(i,j)/MASK_RES>rad)continue;const k=ny*mw+nx;if(!seen[k]&&can(k)){seen[k]=1;q.push(k)}}};
      seed(c.M.spawn[0],c.M.spawn[1],.01);
      const done=new Set();
      for(let pass=0;pass<8;pass++){
        while(q.length){const i=q.pop(),x=i%mw,y=(i-x)/mw;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=mw||ny>=mh)continue;const j=ny*mw+nx;if(!seen[j]&&can(j)){seen[j]=1;q.push(j)}}}
        if(!open)break;let more=false;
        for(const a of hooks){if(done.has(a)||!reachIn(seen,a.x,a.y,1.6))continue;done.add(a);
          for(const b of hooks)if(b!==a&&(Math.abs(a.x-b.x)<.6||Math.abs(a.y-b.y)<.6)&&Math.hypot(a.x-b.x,a.y-b.y)<=8.2){seed(b.x,b.y,1.3);more=true}}
        if(!more)break;
      }
      lockCols.forEach((l,i)=>l.off=keepOff[i]);return seen;
    };
    const reachIn=(seen,x,y,rad)=>{const R=Math.ceil(rad*MASK_RES);const cx=Math.floor(x*MASK_RES),cy=Math.floor(y*MASK_RES);for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const nx=cx+i,ny=cy+j;if(nx<0||ny<0||nx>=mw||ny>=mh)continue;if(Math.hypot(i,j)/MASK_RES>rad)continue;if(seen[ny*mw+nx])return true}return false};
    const seen=flood(false),seen2=flood(true);
    const reach=(x,y,rad)=>reachIn(seen,x,y,rad),reach2=(x,y,rad)=>reachIn(seen2,x,y,rad);
    const rectIn=(sn,e)=>{for(let y=Math.max(0,Math.floor(e.y*MASK_RES));y<Math.min(mh,Math.ceil((e.y+e.h)*MASK_RES));y++)for(let x=Math.max(0,Math.floor(e.x*MASK_RES));x<Math.min(mw,Math.ceil((e.x+e.w)*MASK_RES));x++)if(sn[y*mw+x])return true;return false};
    for(const p of pts)if(!reach(p.x,p.y,.2)){if(reach2(p.x,p.y,.2))r.locked.push(p.what+'（機關後）');else r.problems.push(p.what+'和出生點不相連')}
    c.exits.forEach(e=>{if(rectIn(seen,e))return;if(rectIn(seen2,e))r.locked.push('往 '+e.to+' 的出口（機關後）');else r.problems.push('往 '+e.to+' 的出口到不了')});
    const targets=[...(c.M.chests||[]).map(o=>['寶箱 '+o.id,o.x,o.y-.25,.36]),...c.npcs.map(n=>['NPC '+n.name,n.x,n.y,.3]),...c.signs.map(s=>['告示牌',s.x,s.y,.2]),
      ...(c.M.altar?[['祭壇',c.M.altar.x,c.M.altar.y-.45,.8]]:[]),...(c.M.boss?[['首領點',c.M.boss.x,c.M.boss.y,0]]:[]),...(c.M.braziers||[]).map(b=>['火盆 '+b.id,b.x,b.y-.2,.3]),
      ...(c.M.blocks||[]).map(b=>['石塊',b.x,b.y-.45,.45]),...(c.M.spawns||[]).map(s=>['出生點 '+s.k,s.x,s.y,0]),...(c.M.hooks||[]).map((h,i)=>['勾爪樁 '+i,h.x,h.y,.2]),
      ...(c.M.cracks||[]).map(k=>['裂牆 '+k.id,k.x,k.y,.3])];
    for(const [what,x,y,rad] of targets)if(!reach(x,y,rad+PLAYER_R+.4)){
      if(reach2(x,y,rad+PLAYER_R+.4))r.locked.push(what+'（機關後）');else r.problems.push(what+' 到不了');
    }
    // 出口成對：對面地圖有回來的出口、而且回來的落點就在這個出口附近
    c.exits.forEach(e=>{const B=MAPS[e.to];if(!B){r.problems.push('出口指向不存在的地圖 '+e.to);return}
      const back=(B.exits||[]).filter(b=>b.to===id);if(!back.length){r.problems.push(e.to+' 沒有回來的出口');return}
      const near=back.some(b=>rectDist(e,b.tx,b.ty)<3.2);if(!near)r.problems.push('從 '+e.to+' 回來的落點離這個出口太遠');});
    r.props=c.props.length;r.reachCells=seen.reduce((a,b)=>a+b,0);
    out[id]=r;
  }

}

/* ================= 開始 ================= */
async function start(mode){   // mode：'new'｜'continue'（標題按鈕由 game.js 接；沒有 game.js 時直接開始）
  if(running)return;
  const btns=[...document.querySelectorAll('#sTitle button')];btns.forEach(b=>b.disabled=true);
  const el=$('#fade');el.classList.add('on');await sleep(300);
  $('#sTitle').classList.remove('on');$('#sMap').classList.add('on');
  ctx=$('#cv').getContext('2d');
  const s=HOOKS.begin(mode==='continue'?'continue':'new')||{},id=MAPS[s.map]?s.map:'village';
  C=compileMap(id);
  resize();
  await artGate(mapArt(id),6000);   // 網路不通就逾時放行，畫面用程式畫的替代
  go(id,s.x,s.y,s.face);
  running=true;last=performance.now();render(last);requestAnimationFrame(loop);
  await sleep(30);el.classList.remove('on');btns.forEach(b=>b.disabled=false);
}
document.title=GAME_TITLE;
{const [a,b]=GAME_TITLE.split('：');$('#logo').innerHTML='';$('#logo').append(a||GAME_TITLE);if(b){const s=document.createElement('small');s.textContent=b;$('#logo').append(s)}}
Promise.all(['ui-btn','ui-btn-pri'].map(k=>new Promise((ok,no)=>{const im=new Image();im.onload=ok;im.onerror=no;im.src=`${PK}${k}.webp`}))).then(()=>document.body.classList.add('btn-art'),()=>{});
if(DEBUG){
  document.body.classList.add('debug');
  window.__shrine={go:(id,x,y,face)=>{const ok=go(id,x,y,face);if(ok&&running)render(performance.now());return ok},get state(){return {map:CURID,x:P.x,y:P.y,face:P.face,blocks:blk.size,built:stat.built,fps:stat.fps}},
    stat,P,MAPS,PROGRESS,start,audit,openWorld,ask,openPanel,closePanel,get panelOpen(){return panelOpen},
    keys,joy,tick:dt=>{update(dt);render(performance.now());return [CURID,P.x,P.y]},
    /* zoom：看全圖用，暫時改解析度讓視野變大 */
    zoom:z=>{dpr=z;tmpReset();buildTextures();for(const k in SPR)SPR[k]=null;clearBlocks();GEN++;forceFull=true;render(performance.now())},
    move:(dx,dy)=>{moveBy(dx,dy);return [P.x,P.y]},free:(x,y)=>circleFree(x,y,PLAYER_R),
    walk:(x,y)=>walkAt(C,x,y),render:()=>render(performance.now()),update:dt=>update(dt)};
}
