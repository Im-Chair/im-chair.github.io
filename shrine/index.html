<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>珠界：聖林神廟</title>
<link rel="icon" href="../icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#070a14;color:#eef1ff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;border-radius:10px;padding:10px 16px;background:#2b3a67;cursor:pointer}
button:active{filter:brightness(1.25)}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#070a14}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}

/* 標題畫面（按鈕樣式照珠界 #sTitle button） */
#sTitle{background:radial-gradient(circle at 50% 30%,#1d3b34,#0b1022 62%,#070a14)}
.logo{font-size:56px;font-weight:900;letter-spacing:8px;text-shadow:0 0 24px #7aa0ff}
.logo small{display:block;font-size:22px;letter-spacing:10px;margin-top:4px;color:#ffd84a}
.sub{font-size:13px;color:#8a95c0;letter-spacing:4px;margin:6px 0 22px}
#sTitle button,#sEnd button{position:relative;width:min(248px,72vw);height:54px;padding:0 28px;font-weight:700;letter-spacing:.18em;color:#d9dcf0;text-shadow:0 1px 3px #000;border:1px solid #a98a4e;border-radius:6px;background:linear-gradient(#222b57e6,#10163ae6);box-shadow:inset 0 0 0 2px #0a0e27,inset 0 0 0 3px #a98a4e44,0 4px 12px #0009}
#sTitle button.pri,#sEnd button.pri{color:#fff6d8;border-color:#f0cd7a;background:linear-gradient(#5273ec,#2c3fa8 55%,#222f88);box-shadow:inset 0 0 0 2px #141c4e,inset 0 0 0 3px #f0cd7a66,0 0 16px #5a7dff66,0 4px 12px #0009}
#sTitle button::before,#sTitle button::after{content:"";position:absolute;top:50%;width:8px;height:8px;background:linear-gradient(135deg,#ffe9a8,#b98d3e);box-shadow:0 0 0 1px #0a0e27;transform:translateY(-50%) rotate(45deg)}
#sTitle button::before{left:11px}#sTitle button::after{right:11px}
body.btn-art #sTitle button,body.btn-art #sTitle button.pri{height:62px;border:0;box-shadow:none;background:url(../pokemo/art/ui-btn.webp) center/100% 100% no-repeat}
body.btn-art #sTitle button.pri{background-image:url(../pokemo/art/ui-btn-pri.webp)}
body.btn-art #sTitle button::before,body.btn-art #sTitle button::after{display:none}
.ver{font-size:12px;color:#8a95c0;margin-top:10px}

/* 地圖畫面 */
#sMap{background:#0c1a0f;z-index:0;isolation:isolate}   /* 自成一個堆疊脈絡：裡面的 HUD／按鈕再怎麼設層級，都在 #fade 底下 */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud button{pointer-events:auto;padding:6px 14px;background:#0009;border:1px solid #fff4;border-radius:20px;font-size:14px}
#hudName{background:#0009;padding:4px 12px;border-radius:20px;font-size:13px}
#hudL{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
#hpCv{display:block;filter:drop-shadow(0 1px 2px #000a)}
#purse{display:flex;align-items:center;gap:6px;background:#0009;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700}
#purse b{min-width:1.5em;font-variant-numeric:tabular-nums}
.gem{display:inline-block;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b8ffcc 35%,#2fbf6a);box-shadow:0 0 4px #7dffb0aa}
.keyic{display:inline-block;width:14px;height:8px;position:relative;margin-left:6px}
.keyic::before{content:"";position:absolute;left:0;top:0;width:6px;height:6px;border:2px solid #ffd84a;border-radius:50%}
.keyic::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:2px;background:#ffd84a;box-shadow:4px 2px 0 -0px #ffd84a}
#tonics{display:flex;gap:4px;flex-wrap:wrap}
#tonics:empty{display:none}
.tchip{display:flex;align-items:center;gap:3px;background:#0009;border:1px solid;border-radius:12px;padding:1px 8px 1px 4px;font-size:12px;font-variant-numeric:tabular-nums}
.tchip img{width:16px;height:16px}
.tchip i{font-style:normal;width:16px;height:16px;border-radius:50%;color:#000;font-size:11px;font-weight:700;text-align:center;line-height:16px}
.pmore{font-size:12px;color:#7f89b4;text-align:center;margin:10px 0 4px}
/* 黑幕（#fade）蓋著時：HUD 與觸控鈕一律隱藏（淡入結束後才生效）且點不到 */
body.fading #hud,body.fading #joy,body.fading .tbtn,body.fading #actBtn,body.fading #toast,body.fading #chal{visibility:hidden;pointer-events:none;transition:visibility 0s .3s}
#hudPiece{font-size:12px;color:#ffb8c8;background:#0009;padding:2px 10px;border-radius:12px}
/* 觸控按鈕（右下，圓形；搖桿在左下，不重疊） */
.tbtn{position:absolute;border-radius:50%;padding:0;font-weight:700;display:none;background:#141c3acc;border:2px solid #6f86d6;color:#eef1ff;font-size:15px}
.tbtn.down{filter:brightness(1.4);transform:scale(.95)}
body.touch .tbtn{display:block}
#atkBtn{right:18px;bottom:calc(34px + env(safe-area-inset-bottom));width:84px;height:84px;background:#3a1c1ccc;border-color:#e08a6a;font-size:17px}
#rollBtn{right:116px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px}
#shdBtn{right:28px;bottom:calc(134px + env(safe-area-inset-bottom));width:62px;height:62px;background:#2a2414cc;border-color:#c9a35a}
#hudR{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#dbg{display:none;background:#000b;padding:4px 8px;border-radius:8px;font:11px/1.4 monospace;white-space:pre;color:#bfe}
body.debug #dbg{display:block}
#joy{position:absolute;left:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44;display:none;pointer-events:none;opacity:.55}
#joy.act{opacity:1}
/* 搖桿觸控區（浮動搖桿）：透明層，DOM 排在 HUD、按鈕、對話、面板之前，所以它們都蓋在它上面、點擊不受影響；位置與大小由 JS 依畫面比例設定 */
#joyZone{position:absolute;left:0;bottom:0;width:55%;height:60%;display:none}
body.touch #joyZone{display:block}
body.fading #joyZone{pointer-events:none}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#ffffffaa;box-shadow:0 2px 8px #0008;pointer-events:none}
body.touch #joy{display:block}
#actBtn{position:absolute;right:112px;bottom:calc(112px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;padding:0;background:#1c3a2acc;border:2px solid #6fd69a;font-weight:700;font-size:15px;display:none}
body.touch #actBtn.on{display:block}
#hint{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:20px;font-size:13px;color:#dfe6ff;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
body.touch #hint{display:none}
#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100% - 32px);background:#000c;padding:8px 16px;border-radius:14px;font-size:14px;line-height:1.5;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
/* 副道具欄（左上，錢包下方）、聖物、首領血條、道具鈕、結尾畫面 */
#toolBox{display:none;align-items:center;gap:6px;background:#0009;padding:3px 10px 3px 4px;border-radius:20px;font-size:13px;pointer-events:auto;cursor:pointer}
#toolBox.on{display:flex}
#toolCv{width:26px;height:26px;display:block}
#toolBox small{color:#8a95c0;font-size:11px}
#relics{display:none;gap:4px;background:#0009;padding:4px 9px;border-radius:14px}
#relics.on{display:flex}
#relics i{display:block;width:10px;height:14px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#333a50}
#bossBar{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);width:min(440px,46vw);display:none;text-align:center;pointer-events:none;z-index:5}
#bossBar.on{display:block}
#bossName{font-size:14px;font-weight:700;letter-spacing:.12em;text-shadow:0 1px 3px #000,0 0 8px #000}
#bossName small{display:block;font-size:11px;color:#c9b98a;letter-spacing:.2em;font-weight:400}
#bossHp{margin-top:4px;height:10px;border:1px solid #f0cd7a;border-radius:6px;background:#1a0a10cc;overflow:hidden;box-shadow:0 0 8px #000a}
#bossHp b{display:block;height:100%;width:100%;background:linear-gradient(#ff7a6a,#c8283a);transition:width .15s}
#bossBar.p2 #bossHp b{background:linear-gradient(#ffb04a,#e0402a)}
@media (max-width:640px){#bossBar{top:calc(184px + env(safe-area-inset-top));width:calc(100% - 32px)}}   /* 手機：放在左上 HUD（心、錢包、道具、聖物）下面，不重疊 */
#itemBtn{right:112px;bottom:calc(184px + env(safe-area-inset-bottom));width:58px;height:58px;background:#1c2a3acc;border-color:#7ac0e0}
#itemBtn canvas{width:34px;height:34px;display:block;margin:auto;pointer-events:none}
#itemBtn b{position:absolute;right:-2px;bottom:-2px;font-size:11px;background:#000c;border-radius:8px;padding:0 4px}
#cycBtn{right:176px;bottom:calc(196px + env(safe-area-inset-bottom));width:36px;height:36px;font-size:13px;background:#141c3acc}
body.touch #itemBtn:not(.on),body.touch #cycBtn:not(.on){display:none}
#sEnd{background:radial-gradient(circle at 50% 35%,#2a2a4a,#0b1022 62%,#070a14)}
#sEnd h2{font-size:30px;letter-spacing:.3em;margin:0 0 6px;color:#ffe9a8;text-shadow:0 0 18px #ffd84a88}
#sEnd .lines{color:#bfcaf5;font-size:14px;line-height:1.8;max-width:420px}
#sEnd .lines .note{margin-top:16px;font-style:italic;color:#7f8ab5;font-size:13px}   /* 最後一句：筆跡不同的批註 */
#endStats{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:15px;margin:10px 0 18px;text-align:left}
#endStats span:nth-child(odd){color:#8a95c0}
#endStats b{font-variant-numeric:tabular-nums}

/* 對話框（照珠界 #dlgBox） */
#dlg{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px 12px calc(16px + env(safe-area-inset-bottom));z-index:20;background:linear-gradient(transparent,#000a 25%)}
#dlg.on{display:block}
#dlgBox{max-width:640px;margin:0 auto;background:#141c3acc;border:2px solid #6f86d6;border-radius:14px;padding:14px;min-height:110px;position:relative;font-size:16px;line-height:1.6}
#dlgName{position:absolute;top:-14px;left:14px;background:#3b55d6;border-radius:10px;padding:2px 12px;font-size:13px;font-weight:700}
#dlgNext{position:absolute;right:12px;bottom:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#dlgNext{animation:none}}

/* 世界地圖 */
#world{position:absolute;inset:0;z-index:30;display:none;background:#070a14e6;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#world.on{display:flex;flex-direction:column}
#worldBox{position:relative;flex:1;min-height:0;max-width:960px;width:100%;margin:0 auto;background:#1b130acc;border:2px solid #8a6a3a;border-radius:14px;overflow:hidden}
#worldCv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#worldInfo{position:absolute;left:10px;right:10px;bottom:8px;text-align:center;pointer-events:none;color:#efe3c2}
#worldDesc{font-size:13px;line-height:1.45;min-height:38px;text-shadow:0 1px 2px #000}
#worldDesc b{color:#ffe08a}
#worldStat{font-size:12px;color:#c9b98a;margin-top:4px}
#worldStat span{display:inline-block;white-space:nowrap;margin:0 8px}
#worldClose{position:absolute;right:10px;top:10px;padding:6px 14px;background:#0009;border:1px solid #fff4;border-radius:20px;font-size:14px}

/* 對話選項、面板（背包／商店／鍛造／賞金板，樣式沿用對話框）、挑戰計時 */
#dlgOpts{display:none;flex-direction:column;gap:6px;margin-top:10px}
#dlgOpts.on{display:flex}
#dlgOpts button{text-align:left;padding:8px 12px;background:#0b1230cc;border:1px solid #6f86d688;border-radius:10px;font-size:15px}
#dlgOpts button.sel{background:#3b55d6;border-color:#c9d4ff}
#dlgOpts button:disabled{opacity:.45}
#hudBtns{display:flex;gap:6px}
#dayTag{display:none;background:#0009;padding:2px 10px;border-radius:12px;font-size:12px;color:#ffd9a8}
#dayTag.on{display:block}
#panel{position:absolute;inset:0;z-index:25;display:none;background:#070a14cc;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#panel.on{display:flex;flex-direction:column}
#panelBox{flex:1;min-height:0;max-width:640px;width:100%;margin:0 auto;background:#141c3aee;border:2px solid #6f86d6;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
#panelHead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #6f86d655}
#panelTitle{font-size:17px;letter-spacing:.1em}
#panelSub{flex:1;font-size:13px;color:#bfcaf5;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panelClose{padding:6px 14px;background:#0009;border:1px solid #fff4;border-radius:20px;font-size:14px;flex:none}
#panelTabs{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
#panelTabs:empty{display:none}
#panelTabs button{padding:6px 12px;font-size:13px;background:#0b1230;border:1px solid #6f86d655;border-radius:16px}
#panelTabs button.on{background:#3b55d6;border-color:#c9d4ff}
#panelBody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px;touch-action:pan-y;-webkit-user-select:none}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;background:#0b1230aa;border:1px solid #6f86d633;border-radius:10px}
.prow.on{border-color:#ffd84a;box-shadow:inset 0 0 0 1px #ffd84a55}
.prow .pi{flex:1;min-width:0}
.prow .pn{font-weight:700;font-size:15px}
.pic{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:6px}
.pchip .pic{width:20px;height:20px;margin-right:4px}
.prow .pd{font-size:12px;color:#aab4dd;line-height:1.45;margin-top:2px;overflow-wrap:anywhere;white-space:pre-line}
.prow button{flex:none;padding:6px 12px;font-size:13px;background:#2b3a67;border:1px solid #6f86d688;border-radius:10px;min-width:64px}
.prow button:disabled{opacity:.4}
.psec{font-size:12px;color:#ffd84a;letter-spacing:.15em;margin:10px 2px 6px}
.psec:first-child{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pchip{background:#0b1230aa;border:1px solid #6f86d633;border-radius:10px;padding:6px 10px;font-size:13px}
.pchip b{float:right;font-variant-numeric:tabular-nums}
.pchip.dim{opacity:.45}
#chal{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);display:none;background:#000c;border:1px solid #ffd84a88;padding:6px 16px;border-radius:14px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;z-index:6;pointer-events:none;white-space:nowrap}
#chal.on{display:block}
#fade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a95c0;font-size:14px;letter-spacing:2px;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:100}
#fade.on{opacity:1;pointer-events:auto}
#fade{flex-direction:column;gap:12px}
#fadeTxt:empty{display:none}
#fadeTxt.sm{font-size:11px;letter-spacing:1px;opacity:.6}
#fadeBar{display:none;width:min(220px,56vw);height:4px;border-radius:2px;background:#1a2036;overflow:hidden}
#fade.prog #fadeBar{display:block}
#fadeBar b{display:block;height:100%;width:0;background:#8a95c0;transition:width .15s}
</style>
<script>
/* 版號：改了 maps.js 或這個檔就 +1，破除瀏覽器快取 */
const SHRINE_VER='26';
document.write('<script src="maps.js?v='+SHRINE_VER+'"><\/script>');
</script>
</head>
<body>
<div id="app">
  <section id="sTitle" class="screen center on">
    <div class="logo" id="logo"></div>
    <div class="sub">一段被史冊記下的英雄傳說</div>
    <button class="pri" id="btnCont" style="display:none">繼續</button>
    <button class="pri" id="btnStart">開始</button>
    <div class="ver" id="verTag">v1.0</div>
    <div class="ver" style="font-size:11px;opacity:.7">音效：www.casper.tw/sound-effects</div>
    <div class="ver">移動：WASD／方向鍵　攻擊：J 或 Z（按住蓄力，放開旋轉斬）<br>翻滾：K 或 X　舉盾：L 或 C　互動：空白鍵　地圖：M<br>道具：I 或 V 使用，Q／E 或數字鍵 1～4 切換<br>背包：B 或 Tab　手機：左下搖桿移動，右下按鈕攻擊／翻滾／舉盾／道具（長按道具鈕切換）</div>
  </section>
  <section id="sEnd" class="screen center">
    <h2 id="endTitle"></h2>
    <div class="lines" id="endLines"></div>
    <div id="endStats"></div>
    <button class="pri" id="btnEnd">回到標題</button>
  </section>
  <section id="sMap" class="screen">
    <canvas id="cv"></canvas>
    <div id="joyZone"></div>
    <div id="hud"><div id="hudL"><canvas id="hpCv"></canvas><div id="purse"><span class="gem"></span><b id="hudMoney">0</b><span id="hudKeyWrap" style="display:none"><span class="keyic"></span> <b id="hudKeys">0</b></span></div><div id="hudPiece" style="display:none"></div><div id="tonics"></div><div id="toolBox"><canvas id="toolCv" width="52" height="52"></canvas><span id="toolName"></span><b id="toolN"></b></div><div id="relics"><i></i><i></i><i></i></div><div id="hudName"></div></div><div id="hudR"><div id="hudBtns"><button id="bagBtn">背包</button><button id="mapBtn">地圖</button></div><div id="dayTag"></div><div id="dbg"></div></div></div>
    <div id="joy"><div id="knob"></div></div>
    <button id="actBtn">對話</button>
    <button class="tbtn" id="atkBtn">攻擊</button>
    <button class="tbtn" id="rollBtn">翻滾</button>
    <button class="tbtn" id="shdBtn">舉盾</button>
    <button class="tbtn" id="itemBtn"><canvas id="itemCv" width="68" height="68"></canvas><b id="itemN"></b></button>
    <button class="tbtn" id="cycBtn">換</button>
    <div id="bossBar"><div id="bossName"></div><div id="bossHp"><b></b></div></div>
    <div id="hint">空白鍵：對話</div>
    <div id="toast"></div>
    <div id="dlg"><div id="dlgBox"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgOpts"></div><div id="dlgNext">▼</div></div></div>
    <div id="panel"><div id="panelBox"><div id="panelHead"><b id="panelTitle"></b><span id="panelSub"></span><button id="panelClose">關閉</button></div><div id="panelTabs"></div><div id="panelBody"></div></div></div>
    <div id="chal"></div>
    <div id="world"><div id="worldBox"><canvas id="worldCv"></canvas><div id="worldInfo"><div id="worldDesc"></div><div id="worldStat"></div></div><button id="worldClose">關閉</button></div></div>
  </section>
  <div id="fade"><div id="fadeTxt"></div><div id="fadeBar"><b></b></div></div>
</div>
<script>
'use strict';
/* ============================================================
   珠界：聖林神廟 — 地圖引擎（先不做戰鬥）
   地圖資料全部在 maps.js（SHRINE_MAPS）；這裡只放引擎。
   地圖不用格子定義，改用「形狀」：輪廓、水、熔岩、鋪面、路都是平滑曲線。
   座標單位：1 單位＝48 CSS px（小數座標）。

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise1(seed){   // 一維值雜訊，回傳 f(t) ∈ -1~1
  const v=i=>{let h=Math.imul((i|0)^seed,0x27d4eb2d);h^=h>>>15;h=Math.imul(h,0x85ebca6b);h^=h>>>13;return((h>>>0)/4294967296)*2-1};
  return t=>{const i=Math.floor(t),f=t-i,s=f*f*(3-2*f);return v(i)*(1-s)+v(i+1)*s};
}
const cr=(a,b,c,d,t)=>{const t2=t*t,t3=t2*t;return .5*(2*b+(c-a)*t+(2*a-5*b+4*c-d)*t2+(3*b-a-3*c+d)*t3)};
function spline(pts,closed,step){   // Catmull-Rom 取樣：[[x,y,(寬)],…] → [{x,y,w}]
  const n=pts.length,out=[],get=i=>closed?pts[(i%n+n)%n]:pts[clamp(i,0,n-1)];
  for(let i=0;i<(closed?n:n-1);i++){
    const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2),k=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
    for(let j=0;j<k;j++){const t=j/k,s=t*t*(3-2*t);out.push({x:cr(p0[0],p1[0],p2[0],p3[0],t),y:cr(p0[1],p1[1],p2[1],p3[1],t),w:(p1[2]||0)+((p2[2]||0)-(p1[2]||0))*s})}

function blobPoly(pts,seed,amp,freq){   // 封閉形狀：平滑後沿法線加雜訊（頭尾雜訊銜接，不會有接縫）
  const s=spline(pts,true,.15),n=s.length,nz=noise1(seed),f=t=>nz(t)+.5*nz(t*2.3+7),dist=[0];
  for(let i=1;i<=n;i++)dist.push(dist[i-1]+Math.hypot(s[i%n].x-s[i-1].x,s[i%n].y-s[i-1].y));
  const P=dist[n],out=[];
  for(let i=0;i<n;i++){
    const a=s[(i-1+n)%n],b=s[(i+1)%n];let tx=b.x-a.x,ty=b.y-a.y;const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const d=dist[i],w=d/P,o=amp*(f(d*freq)*(1-w)+f((d-P)*freq)*w);
    out.push([s[i].x+ty*o,s[i].y-tx*o]);
  }

}
function ribbonPoly(pts,seed,amp,freq){   // 帶寬度的曲線 → 封閉多邊形（低頻寬窄起伏＋兩側各自擾動，頭尾圓角）
  const s=spline(pts,false,.12),n=s.length,nl=noise1(seed),nr=noise1(seed+99),nw=noise1(seed+57),L=[],R=[];let d=0,hw0=0,hw1=0,a0=0,a1=0;
  for(let i=0;i<n;i++){
    const a=s[Math.max(0,i-1)],b=s[Math.min(n-1,i+1)];let tx=b.x-a.x,ty=b.y-a.y;const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    if(i)d+=Math.hypot(s[i].x-s[i-1].x,s[i].y-s[i-1].y);
    const hw=s[i].w/2*(1+.22*nw(d*.33)),nx=-ty,ny=tx;
    const ol=Math.max(hw*.35,hw+amp*(nl(d*freq)+.5*nl(d*freq*2.7+3))),or=Math.max(hw*.35,hw+amp*(nr(d*freq)+.5*nr(d*freq*2.7+3)));
    L.push([s[i].x+nx*ol,s[i].y+ny*ol]);R.push([s[i].x-nx*or,s[i].y-ny*or]);
    if(i===0){hw0=(ol+or)/2;a0=Math.atan2(ny,nx)}if(i===n-1){hw1=(ol+or)/2;a1=Math.atan2(ny,nx)}
  }

  for(let k=1;k<6;k++){const g=a1-k*Math.PI/6;out.push([e.x+Math.cos(g)*hw1,e.y+Math.sin(g)*hw1])}

  for(let k=1;k<6;k++){const g=a0+Math.PI-k*Math.PI/6;out.push([b0.x+Math.cos(g)*hw0,b0.y+Math.sin(g)*hw0])}

}

  const addCol=col=>{const cx=col.r!=null?col.x:(col.x0+col.x1)/2,cy=col.r!=null?col.y:(col.y0+col.y1)/2,ext=col.r!=null?col.r:Math.max(col.x1-col.x0,col.y1-col.y0)/2;
    let near=false;for(const [a,b] of [[0,0],...RING8])if(walkAt(c,cx+a*(ext+.6),cy+b*(ext+.6))){near=true;break}
    if(!near)return;
    const gx0=Math.floor((cx-ext)/2),gx1=Math.floor((cx+ext)/2),gy0=Math.floor((cy-ext)/2),gy1=Math.floor((cy+ext)/2);
    for(let j=gy0;j<=gy1;j++)for(let i=gx0;i<=gx1;i++){const k=i+','+j;(c.cols.get(k)||c.cols.set(k,[]).get(k)).push(col)}};
  props.forEach(p=>p.col&&addCol(p.col));
  c.npcs.forEach(n=>addCol({x:n.x,y:n.y,r:.3}));
}
function buildPatches(c,seed){   // 草地變化斑塊：指定的＋自動撒的（亮草、帶土斑的草、小花）
  const R=rng(seed+333),list=(c.M.patches||[]).map(p=>({...p,a:p.a||0}));
  const n=Math.round(c.w*c.h/20*(c.M.autoPatches!=null?c.M.autoPatches:1));
  for(let i=0;i<n;i++){const v=R(),t=v<.55?'light':v<.85?'dgrass':'flower',sc=t==='flower'?.6:1;list.push({t,x:R()*c.w,y:R()*c.h,rx:(1+R()*1.4)*sc,ry:(.6+R()*.9)*sc,a:R()*Math.PI})}
  list.forEach(p=>p.bb=[p.x-p.rx-1,p.y-p.rx-1,p.x+p.rx+1,p.y+p.rx+1]);
  c.patches=list;
}

/* ================= 地面區塊（離屏畫布，用到才建） =================
   每塊 BLK×BLK 裝置像素。順序：地面底 → 斑塊 → 土路 → 鋪面 → 水 → 熔岩 → 輪廓外（林地／岩壁）。
   柔邊不用 ctx.filter（Safari 不支援），而是「只畫影子」：形狀畫到畫布外，用 shadowBlur 把模糊的影子投回來。 */
let dpr=1,cw=0,ch=0,ctx=null,TMP=[],PAD=0;
const blk=new Map(),pool=[],stat={built:0,frameBuilt:0,fps:0,renderMs:0};
let frameNo=0,blkMax=BLK_MIN_CACHE;
function tmpReset(){PAD=Math.ceil(1.6*U*dpr);   // 外擴要 ≥ 最大模糊的 3σ（σ＝shadowBlur/2），區塊接縫才不會露餡
  TMP=[0,1,2,3].map(()=>mk(BLK+2*PAD,BLK+2*PAD).getContext('2d'))}
function clr(g){g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.clearRect(0,0,g.canvas.width,g.canvas.height)}
function blurImg(dst,src,blurPx,color){   // 把 src 的不透明區以模糊影子畫到 dst
  const K=src.width+Math.ceil(blurPx*3)+16;
  dst.save();dst.setTransform(1,0,0,1,0,0);dst.shadowColor=color||'#fff';dst.shadowBlur=blurPx;dst.shadowOffsetX=-K;dst.shadowOffsetY=0;dst.drawImage(src,K,0);dst.restore();
}
function inMode(g,mode,fill){g.save();g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation=mode;if(fill instanceof HTMLCanvasElement)g.drawImage(fill,0,0);else{g.fillStyle=fill;g.fillRect(0,0,g.canvas.width,g.canvas.height)}g.restore()}
function buildBlock(i,j,cv){
  const S=U*dpr,Bw=BLK/S,x0=i*Bw,y0=j*Bw,P=PAD/S;
  cv=cv||pool.pop()||mk(BLK,BLK);const c=cv.getContext('2d');
  const box=[x0-P,y0-P,x0+Bw+P,y0+Bw+P],hit=b=>bbHit(b,box);
  const W=g=>g.setTransform(S,0,0,S,PAD-x0*S,PAD-y0*S);
  const texIn=(g,p)=>{g.save();W(g);g.globalCompositeOperation='source-in';g.fillStyle=p;g.fillRect(box[0],box[1],box[2]-box[0],box[3]-box[1]);g.restore()};
  const put=(src,a)=>{c.globalAlpha=a;c.drawImage(src,PAD,PAD,BLK,BLK,0,0,BLK,BLK);c.globalAlpha=1};
  const [t1,t2,t3,t4]=TMP,outTex=C.indoor?TEXP.wall:TEXP.forest;
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  stat.built++;stat.frameBuilt++;
  // 遠離輪廓的區塊：整片林地／岩壁就好
  if(!bbHit(box,C.extBB)){
    c.setTransform(S,0,0,S,-x0*S,-y0*S);c.fillStyle=outTex;c.fillRect(x0,y0,Bw,Bw);
    if(C.indoor){c.fillStyle='rgba(0,0,0,.42)';c.fillRect(x0,y0,Bw,Bw)}
    return cv;
  }
  // 1) 地面底
  c.setTransform(S,0,0,S,-x0*S,-y0*S);c.fillStyle=TEXP[C.M.base||'grass']||TEXP.grass;c.fillRect(x0,y0,Bw,Bw);
  c.setTransform(1,0,0,1,0,0);
  // 2) 斑塊
  for(const t of ['light','dgrass','flower']){
    const ps=C.patches.filter(p=>p.t===t&&hit(p.bb));if(!ps.length)continue;
    clr(t2);W(t2);t2.fillStyle='#fff';for(const p of ps){t2.beginPath();t2.ellipse(p.x,p.y,p.rx,p.ry,p.a,0,7);t2.fill()}
    clr(t1);blurImg(t1,t2.canvas,.8*S);texIn(t1,TEXP[t]);put(t1.canvas,PATCH_A[t]);
  }
  // 3) 土路：先一圈踩禿的暗草，再疊柔邊土
  const pp=C.paths.filter(p=>hit(p.bb));
  if(pp.length){
    clr(t2);W(t2);t2.fillStyle='#fff';pp.forEach(p=>fillPoly(t2,p.poly));
    clr(t1);blurImg(t1,t2.canvas,.5*S);inMode(t1,'source-in','rgb(70,60,24)');put(t1.canvas,.22);
    clr(t1);blurImg(t1,t2.canvas,.15*S);texIn(t1,TEXP.dirt);put(t1.canvas,1);
  }
  // 4) 鋪面：碎裂邊＋碎石，底下一圈陰影
  const ff=C.floor.filter(f=>hit(f.bb));
  if(ff.length){
    clr(t2);W(t2);t2.fillStyle='#fff';ff.forEach(f=>{fillPoly(t2,f.poly);f.rub.forEach(q=>fillPoly(t2,q))});
    clr(t1);blurImg(t1,t2.canvas,.14*S);inMode(t1,'source-in','rgb(20,16,10)');put(t1.canvas,.45);
    clr(t1);inMode(t1,'source-over',t2.canvas);texIn(t1,TEXP.floor);put(t1.canvas,1);
  }
  // 5) 水（濕土、深水、淺水帶、岸線暗邊；島嶼從水裡挖掉）
  const ww=C.water.filter(w=>hit(w.bb));
  if(ww.length){
    clr(t2);W(t2);t2.fillStyle='#fff';ww.forEach(w=>fillPoly(t2,w.poly));
    t2.globalCompositeOperation='destination-out';C.islands.forEach(s=>hit(s.bb)&&fillPoly(t2,s.poly));t2.globalCompositeOperation='source-over';
    clr(t1);blurImg(t1,t2.canvas,.4*S);inMode(t1,'source-in','rgb(30,42,20)');put(t1.canvas,.5);
    clr(t3);inMode(t3,'source-over','#fff');inMode(t3,'destination-out',t2.canvas);
    clr(t1);inMode(t1,'source-over',t2.canvas);texIn(t1,TEXP.deep);
    clr(t4);blurImg(t4,t3.canvas,1.0*S);inMode(t4,'destination-in',t2.canvas);texIn(t4,TEXP.shallow);
    t1.drawImage(t4.canvas,0,0);t1.globalAlpha=.6;t1.drawImage(t4.canvas,0,0);t1.globalAlpha=1;
    clr(t4);blurImg(t4,t3.canvas,.13*S);inMode(t4,'destination-in',t2.canvas);inMode(t4,'source-in','rgb(8,36,56)');
    t1.globalAlpha=.8;t1.drawImage(t4.canvas,0,0);t1.globalAlpha=1;
    put(t1.canvas,1);
  }
  // 6) 熔岩（岸邊焦黑、熔岩面、靠岸的暗色硬殼）
  const lv=C.lava.filter(w=>hit(w.bb));
  if(lv.length){
    clr(t2);W(t2);t2.fillStyle='#fff';lv.forEach(w=>fillPoly(t2,w.poly));
    clr(t1);blurImg(t1,t2.canvas,.7*S);inMode(t1,'source-in','rgb(18,9,5)');put(t1.canvas,.75);
    clr(t3);inMode(t3,'source-over','#fff');inMode(t3,'destination-out',t2.canvas);
    clr(t1);inMode(t1,'source-over',t2.canvas);texIn(t1,TEXP.lava);
    clr(t4);blurImg(t4,t3.canvas,.45*S);inMode(t4,'destination-in',t2.canvas);inMode(t4,'source-in','rgb(48,14,4)');
    t1.globalAlpha=.85;t1.drawImage(t4.canvas,0,0);t1.globalAlpha=1;
    put(t1.canvas,1);
  }
  // 7) 輪廓外與阻擋區：室外是林地，室內是岩壁（多一道亮邊當岩壁收邊）
  if(!(bbInside(box,C.outlineBB)&&fullyWalkish(box))){
    clr(t2);inMode(t2,'source-over','#fff');W(t2);t2.globalCompositeOperation='destination-out';t2.fillStyle='#fff';fillPoly(t2,C.outline);
    C.floor.forEach(f=>hit(f.bb)&&fillPoly(t2,f.poly));
    t2.globalCompositeOperation='source-over';C.forest.forEach(f=>hit(f.bb)&&fillPoly(t2,f.poly));
    clr(t1);blurImg(t1,t2.canvas,(C.indoor?.9:.7)*S);inMode(t1,'source-in',C.indoor?'rgb(0,0,0)':'rgb(6,24,12)');put(t1.canvas,C.indoor?.6:.5);
    clr(t1);blurImg(t1,t2.canvas,(C.indoor?.08:.22)*S);texIn(t1,outTex);put(t1.canvas,1);
    if(C.indoor){
      clr(t1);blurImg(t1,t2.canvas,.08*S);inMode(t1,'source-in','rgb(0,0,0)');put(t1.canvas,.42);   // 岩壁再壓暗，和地面拉開
      clr(t3);inMode(t3,'source-over','#fff');inMode(t3,'destination-out',t2.canvas);   // 可走區
      clr(t4);blurImg(t4,t3.canvas,.3*S);inMode(t4,'destination-in',t2.canvas);inMode(t4,'source-in','rgb(255,236,210)');put(t4.canvas,.32);
    }
  }
  return cv;
}
const bbInside=(a,b)=>a[0]>=b[0]&&a[2]<=b[2]&&a[1]>=b[1]&&a[3]<=b[3];
function fullyWalkish(box){   // 區塊（含外擴）整片都在可走區或水裡、沒碰到林地 → 可跳過最後一層
  if(C.forest.some(f=>bbHit(f.bb,box)))return false;
  for(let y=box[1];y<=box[3];y+=.25)for(let x=box[0];x<=box[2];x+=.25){if(!walkAt(C,x,y)&&!wetAt(C,x,y))return false}
  return true;
}
function getBlock(i,j,canBuild){
  const key=i+','+j;let e=blk.get(key);
  if(!e||e.gen!==GEN){
    if(canBuild){const cv=buildBlock(i,j,e&&e.cv);e={cv,gen:GEN}}
    else if(!e)return null;   // 舊世代的區塊先頂著，等有額度再重建
  }
  e.used=frameNo;blk.delete(key);blk.set(key,e);   // 移到最後＝最近使用
  return e;
}
function trimBlocks(){for(const [k,e] of blk){if(blk.size<=blkMax)break;if(e.used!==frameNo){blk.delete(k);if(pool.length<4)pool.push(e.cv)}}}
function clearBlocks(){blk.forEach(e=>{if(pool.length<4)pool.push(e.cv)});blk.clear()}

/* ================= 狀態 ================= */
const P={x:0,y:0,face:'down',moving:false,anim:0,exitLock:false};
let lock=false,dlgOpen=false,worldOpen=false,forceFull=false,camDX=0,camDY=0,nearTalk=null,nearLock=null;
const keys={};const joy={x:0,y:0};
/* ===== 掛鉤：戰鬥等遊戲規則在 game.js，這裡只留預設（沒載入 game.js 時就是單純的地圖漫遊） ===== */
const HOOKS={
  begin:mode=>null,        // 開始遊戲：mode＝'new'｜'continue'，回傳 {map,x,y,face}
  enter:id=>{},            // 換到某張地圖之後
  art:id=>[],              // 這張地圖額外要先載的圖（ART_SRC 的 key）
  player:dt=>1,            // 每幀移動前：回傳輸入移動的速度倍率（0＝這幀不能用輸入移動）
  faceLock:()=>false,      // true＝移動時不改面向（舉盾、蓄力、攻擊中）
  update:dt=>{},           // 每幀（移動、出口判定之後）
  near:best=>null,         // 比 best 更近的可互動物件（要有 act()、label）
  actors:(list,c,now)=>{}, // 加入要依 y 排序繪製的角色 {sy,draw}
  drawHero:null,           // 取代英雄繪製
  fx:(c,S,now)=>{},        // 最上層特效（世界座標）
  ground:(c,now)=>{},      // 地面層（物件之下：警示圈、壓板、裂牆）
  blocked:(x,y,r)=>false,  // 額外的不可通行判定（首領戰結界）
  light:()=>3.4,           // 室內玩家自身的照明半徑
  shake:()=>null,          // 畫面震動：回傳 [dx,dy]（裝置像素，整數），在鏡頭位置算完之後才加上去（game.js）
  camera:()=>null,         // 鏡頭焦點覆寫 {x,y}（機關開啟、首領登場時看過去）
  ambient:()=>null,        // 室外的日夜：{dark:暗幕濃度 0～1, tint:色調}（village.js 依營火設定的時段）
  bag:()=>{},              // B／Tab／背包鈕：開背包（village.js）
  compass:()=>false,       // 尋寶羅盤：true＝畫面邊緣常駐箭頭指向最近的未開寶箱（village.js：買過藏寶情報）
  hintTargets:()=>[],      // 羅盤額外的目標 [{x,y}]（adventure.js：有炸彈時的裂牆寶箱）
  audit:(c,reach,reach2)=>null   // 開發用：audit() 補充檢查，回傳 {problems,locked}（adventure.js）
};

/* ================= 碰撞 ================= */
function colsNear(x,y){const a=C.cols.get(Math.floor(x/2)+','+Math.floor(y/2));return a||[]}
function colHit(col,x,y,r){
  if(col.off)return false;   // 已打破的陶罐等
  if(col.r!=null)return Math.hypot(x-col.x,y-col.y)<r+col.r;
  const qx=clamp(x,col.x0,col.x1),qy=clamp(y,col.y0,col.y1);return Math.hypot(x-qx,y-qy)<r;
}
function circleFree(x,y,r){
  if(!walkAt(C,x,y))return false;
  if(HOOKS.blocked(x,y,r))return false;   // 首領戰的結界等
  for(const [a,b] of RING16)if(!walkAt(C,x+a*r,y+b*r))return false;
  for(const [a,b] of RING8)if(!walkAt(C,x+a*r*.55,y+b*r*.55))return false;
  const seen=new Set();
  for(const [ox,oy] of [[0,0],[-r,0],[r,0],[0,-r],[0,r]])for(const col of colsNear(x+ox,y+oy)){if(seen.has(col))continue;seen.add(col);if(colHit(col,x,y,r))return false}
  return true;
}
function wallNormal(x,y,r){   // 估計擋住處的法向（遮罩取樣＋碰撞體），用來沿牆滑動；第三個值＝是不是碰撞體擋的
  let nx=0,ny=0,byCol=false;
  for(const [a,b] of RING16)if(!walkAt(C,x+a*r*1.2,y+b*r*1.2)){nx-=a;ny-=b}
  const seen=new Set();
  for(const [ox,oy] of [[0,0],[-r,0],[r,0],[0,-r],[0,r]])for(const col of colsNear(x+ox,y+oy)){
    if(seen.has(col))continue;seen.add(col);
    if(!colHit(col,x,y,r*1.2))continue;
    let qx,qy;if(col.r!=null){qx=col.x;qy=col.y}else{qx=clamp(x,col.x0,col.x1);qy=clamp(y,col.y0,col.y1)}
    const dx=x-qx,dy=y-qy,l=Math.hypot(dx,dy)||1;nx+=dx/l*3;ny+=dy/l*3;byCol=col.r!=null;
  }
  const l=Math.hypot(nx,ny);return l>1e-6?[nx/l,ny/l,byCol]:null;
}
function depenetrate(x,y){   // 沿切線滑動後若稍微陷進曲面，沿法向推出來（最多幾小步）
  for(let k=0;k<6;k++){
    if(circleFree(x,y,PLAYER_R))return [x,y];
    const n=wallNormal(x,y,PLAYER_R);if(!n)return null;
    x+=n[0]*.02;y+=n[1]*.02;
  }
  return null;
}
function moveBy(dx,dy){
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.06));dx/=steps;dy/=steps;
  const stuck=!circleFree(P.x,P.y,PLAYER_R);   // 萬一卡在裡面（例如落點有問題），允許直接走出來
  for(let s=0;s<steps;s++){
    const nx=P.x+dx,ny=P.y+dy;
    if(stuck||circleFree(nx,ny,PLAYER_R)){P.x=nx;P.y=ny;continue}
    const n=wallNormal(nx,ny,PLAYER_R);
    if(n){
      const tx=-n[1],ty=n[0],st=Math.hypot(dx,dy);let d=dx*tx+dy*ty;
      if(n[2]&&Math.abs(d)<st*.35)d=(d>=0?1:-1)*st*.6;   // 正面撞上樹幹、石頭等圓形物：自動往側邊繞過去
      if(Math.abs(d)>1e-5){const q=depenetrate(P.x+tx*d,P.y+ty*d);if(q&&Math.hypot(q[0]-P.x,q[1]-P.y)>st*.15){P.x=q[0];P.y=q[1];continue}}
    }
    if(dx&&circleFree(P.x+dx,P.y,PLAYER_R)){P.x+=dx;continue}
    if(dy&&circleFree(P.x,P.y+dy,PLAYER_R)){P.y+=dy;continue}
    // 矩形牆角／窄門邊：往垂直方向挪 CORNER_SLIP 單位以內就能通過的話，自動滑過去（每步最多滑移動距離那麼多）。圓形物（石塊、樹幹）與推石塊中不套用
    if(!(n&&n[2])&&!(typeof pushP!=='undefined'&&pushP)){
      const st=Math.hypot(dx,dy);
      if(st>1e-6){
        const ux=dx/st,uy=dy/st,qx=-uy,qy=ux;let bo=0,bs=0;
        for(const sg of [1,-1])for(let o=CORNER_STEP;o<=CORNER_SLIP+1e-6;o+=CORNER_STEP){
          const lx=P.x+qx*o*sg,ly=P.y+qy*o*sg;
          if(!circleFree(lx,ly,PLAYER_R))break;   // 橫移途中就被擋：再遠也過不去
          if(circleFree(lx+ux*.14,ly+uy*.14,PLAYER_R)&&circleFree(lx+ux*.3,ly+uy*.3,PLAYER_R)){if(!bo||o<bo){bo=o;bs=sg}break}
        }
        if(bo){const m=Math.min(st,bo),nx=P.x+qx*bs*m,ny=P.y+qy*bs*m;if(circleFree(nx,ny,PLAYER_R)){P.x=nx;P.y=ny;continue}}
      }
    }
    break;
  }
}

/* ================= 地圖切換 ================= */
function go(id,x,y,face){
  if(!MAPS[id])return false;
  const prevTheme=C?C.theme:null;
  CURID=id;C=compileMap(id);clearBlocks();
  if(C.theme!==prevTheme||TEX_THEME!==C.theme){texNeeds().forEach(needArt);buildTextures();GEN++}
  const sp=C.M.spawn;P.x=x!=null?x:sp[0];P.y=y!=null?y:sp[1];if(face)P.face=face;
  P.exitLock=C.exits.some(e=>inRect(e,P.x,P.y));
  PROGRESS.visit(id);
  $('#hudName').textContent=C.M.name;
  forceFull=true;
  HOOKS.enter(id);
  return true;
}
const inRect=(e,x,y)=>x>=e.x&&x<=e.x+e.w&&y>=e.y&&y<=e.y+e.h;
const FADING=()=>$('#fade').classList.contains('on');   // 黑幕蓋著（開場載入、換地圖）：HUD 與按鈕藏起來、不給點
new MutationObserver(()=>document.body.classList.toggle('fading',FADING())).observe($('#fade'),{attributes:true,attributeFilter:['class']});
async function fade(on){$('#fade').classList.toggle('on',on);await sleep(300)}
async function useExit(e){
  lock=true;await fade(true);
  await loadMap(e.to);   // 淡出後先等新地圖的圖到齊，再換地圖、建好視野內的地面，才淡入
  go(e.to,e.tx,e.ty,e.face);
  render(performance.now());await sleep(30);
  await fade(false);lock=false;

/* ===== 載圖等待：只靠 Promise＋setTimeout 推進（隱藏分頁 rAF 不跑也不會卡住） ===== */

let preQ=null;
function startPreload(){
  if(preQ)return;
  const order=[],seen=new Set([CURID]);let qs=[CURID];   // 從目前地圖往外走（相鄰的先載）
  while(qs.length){const nx=[];for(const id of qs)for(const e of (MAPS[id]&&MAPS[id].exits)||[])if(MAPS[e.to]&&!seen.has(e.to)){seen.add(e.to);order.push(e.to);nx.push(e.to)}qs=nx}
  for(const id in MAPS)if(!seen.has(id)){seen.add(id);order.push(id)}
  const pq=new Set();
  for(const a of SART)if(a.startsWith('e-'))pq.add(sKey(a));   // 背包、商店的裝備小圖：第一次開面板才不會閃
  for(const id of order)mapArt(id).forEach(k=>pq.add(k));
  pq.add('worldmap');   // 世界地圖底圖（第一次按 M 才不用等）
  preQ=[...pq].filter(k=>!ART[k]&&!artFail[k]&&!artLoad[k]);
  const idle=fn=>window.requestIdleCallback?requestIdleCallback(fn,{timeout:1500}):setTimeout(fn,200);
  const lane=()=>{
    if(!preQ.length)return;
    if(gating){setTimeout(lane,400);return}
    idle(()=>{
      if(gating){setTimeout(lane,400);return}
      const k=preQ.shift();
      if(!k||ART[k]||artFail[k]||artLoad[k]){lane();return}
      needArt(k).then(()=>setTimeout(lane,PRELOAD_GAP_MS));
    });
  };
  for(let i=0;i<PRELOAD_LANES;i++)setTimeout(lane,i*PRELOAD_GAP_MS);
}

/* 有選項的對話：lines 照 say 的格式，最後一句顯示完後列出 opts（字串或 {t,off}），回傳選到的索引（Esc／取消＝最後一項） */
function ask(lines,opts){

    lines=Array.isArray(lines)?lines:[lines];let i=0,timer=null,full='',pos=0,sel=0,btns=[];
    dlgOpen=true;d.classList.add('on');
    const finish=k=>{clearInterval(timer);box.classList.remove('on');box.innerHTML='';nx.style.display='';d.classList.remove('on');d.onclick=null;removeEventListener('keydown',onKey);dlgOpen=false;res(k)};

    const showLine=()=>{const L=lines[i],name=Array.isArray(L)?L[0]:'';full=Array.isArray(L)?L[1]:L;
      nm.style.display=name?'block':'none';nm.textContent=name;txt.style.color=name?'#fff':'#bfcaf5';pos=0;txt.textContent='';clearInterval(timer);
      timer=setInterval(()=>{pos++;txt.textContent=full.slice(0,pos);if(pos>=full.length){clearInterval(timer);if(i===lines.length-1)showOpts()}},18)};

  });

let stepT=0;
function update(dt){
  if(lock||dlgOpen||worldOpen||panelOpen){P.moving=false;stepT=.2;$('#hint').classList.remove('on');$('#actBtn').classList.remove('on');return}
  let ix=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),iy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  ix+=joy.x;iy+=joy.y;
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  const sm=HOOKS.player(dt);   // 攻擊、翻滾、舉盾、擊退時由 game.js 決定能不能走、走多快
  if(lock)return;
  if(m>.15&&sm>0){

    if(typeof PS!=='undefined'&&!PS.act){stepT+=dt;if(stepT>=.32){stepT=0;sfx('step')}}else stepT=0;   // 腳步：地面上實際移動、沒在攻擊／翻滾時約每 0.32 秒一次
    const ax=Math.abs(ix),ay=Math.abs(iy);
    if(!HOOKS.faceLock()){
    if(ax>ay*1.15)P.face=ix<0?'left':'right';else if(ay>ax*1.15)P.face=iy<0?'up':'down';
    else{const h=ix<0?'left':'right',v=iy<0?'up':'down';if(P.face!==h&&P.face!==v)P.face=ax>=ay?h:v}
    }
  }else{P.moving=false;stepT=.2}   // 停下後再起步，第一步稍早出聲
  // 出口
  const inside=C.exits.find(e=>inRect(e,P.x,P.y));
  if(!inside)P.exitLock=false;else if(!P.exitLock){useExit(inside);return}
  // 可對話的 NPC／告示牌
  nearTalk=null;let best=TALK_DIST;
  for(const n of C.npcs){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<best){best=d;nearTalk=n}
    n.face=d<3?(Math.abs(P.x-n.x)>Math.abs(P.y-n.y)?(P.x<n.x?2:3):(P.y<n.y?1:0)):0}
  for(const s of C.signs){const d=Math.hypot(s.x-P.x,s.y-.2-P.y);if(d<best){best=d;nearTalk=s}}
  const ex=HOOKS.near(best);if(ex)nearTalk=ex;

  if($('#actBtn').textContent!==lab){$('#actBtn').textContent=lab;$('#hint').textContent='空白鍵：'+lab}

  if(nearLock)toast(nearLock.text||LOCK_TEXT[nearLock.need]||'門鎖著。');
  HOOKS.update(dt);
}

function drawChestHints(c,S,now){
  if(worldOpen||panelOpen||!C)return;
  const compass=!!HOOKS.compass();
  let list=C.props.filter(chestLeft).map(p=>({x:p.x,y:p.y-.5}));
  if(compass)list=list.concat(HOOKS.hintTargets()||[]);
  let best=null,bd=1e9;
  for(const t of list){const d=Math.hypot(t.x-P.x,t.y-P.y);if(d<bd){bd=d;best=t}}
  if(!best||(!compass&&bd>CHEST_HINT_DIST))return;
  const k=dpr,pad=20*k,sx=best.x*S-camDX,sy=best.y*S-camDY;
  if(sx>=pad&&sx<=cw-pad&&sy>=pad&&sy<=ch-pad)return;   // 在畫面內：只靠光芒（裂牆有裂痕可看）
  const L=ARROW_INSET[0]*k,T=ARROW_INSET[1]*k,R=cw-ARROW_INSET[2]*k,B=ch-ARROW_INSET[3]*k;
  const px=clamp(P.x*S-camDX,L,R),py=clamp((P.y-HERO_BODY_DY)*S-camDY,T,B);   // 從主角身上射向目標，交在邊緣框上

  let t=1e9;if(dx>1e-6)t=Math.min(t,(R-px)/dx);else if(dx<-1e-6)t=Math.min(t,(L-px)/dx);
  if(dy>1e-6)t=Math.min(t,(B-py)/dy);else if(dy<-1e-6)t=Math.min(t,(T-py)/dy);
  t=Math.max(0,t);const bob=Math.sin(now/260)*3*k,ax=px+dx*(t+bob),ay=py+dy*(t+bob),s=ARROW_SIZE*k;
  c.save();c.setTransform(1,0,0,1,0,0);c.translate(ax,ay);c.rotate(Math.atan2(dy,dx));
  c.globalAlpha=compass?1:.82;
  c.beginPath();c.moveTo(s,0);c.lineTo(-s*.7,-s*.78);c.lineTo(-s*.3,0);c.lineTo(-s*.7,s*.78);c.closePath();
  c.fillStyle=compass?'#ffd23f':'#fff1b8';c.fill();c.lineWidth=2*k;c.strokeStyle=compass?'#5a3a08':'rgba(90,58,8,.8)';c.lineJoin='round';c.stroke();
  c.restore();
}

function drawWorldNodes(g,W,H,now){   // 舊畫法（底圖載入失敗時的回落）
  // 版面：保持大約 1:1 的比例置中（直式手機上不會被拉成細長條）
  const m=Math.min(W,H)*.1,aw0=W-2*m,ah0=H-2.4*m,aw=Math.min(aw0,ah0*1.5),ah=Math.min(ah0,aw0*1.25),ox=(W-aw)/2,oy=m*1.3+(ah0-ah)/2;
  const pos=id=>{const w=MAPS[id].world||[50,50];return [ox+aw*w[0]/100,oy+ah*w[1]/100]};
  g.fillStyle='#dfe6ff';g.font='bold 16px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';g.textAlign='left';g.fillText('世界地圖',14,26);
  // 連線（只畫去過的地圖出去的路；沒去過的那頭畫成虛線＋？）
  const seen=new Set(),unknown=new Set();
  for(const a of Object.keys(MAPS)){if(!PROGRESS.has(a))continue;
    for(const e of MAPS[a].exits||[]){
      const b=e.to;if(!MAPS[b])continue;const key=[a,b].sort().join('|');if(seen.has(key))continue;seen.add(key);
      const known=PROGRESS.has(b);if(!known)unknown.add(b);
      const [x1,y1]=pos(a),[x2,y2]=pos(b),R=rng(hashStr(key)),mx=(x1+x2)/2+(R()-.5)*30,my=(y1+y2)/2+(R()-.5)*30;
      g.save();g.strokeStyle=known?'#c9b98a':'#8a95c0';g.lineWidth=known?3:2;if(!known)g.setLineDash([6,6]);
      g.beginPath();g.moveTo(x1,y1);g.quadraticCurveTo(mx,my,x2,y2);g.stroke();g.restore();
      const lockedHere=(MAPS[a].locks||[]).some(l=>rectDist(l,e.x+e.w/2,e.y+e.h/2)<3);
      if(lockedHere){const lx=.25*x1+.5*mx+.25*x2,ly=.25*y1+.5*my+.25*y2;g.fillStyle='#141c3a';g.beginPath();g.arc(lx,ly,9,0,7);g.fill();g.fillStyle='#ffd84a';g.font='bold 11px sans-serif';g.textAlign='center';g.fillText('鎖',lx,ly+4)}
    }
  }
  // 節點：不規則小圖塊
  const blob=(id,x,y,rad,fill,stroke)=>{const R=rng(hashStr('node-'+id)),n=9,pts=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2,rr=rad*(.78+R()*.4);pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr*.8])}
    g.beginPath();for(let k=0;k<n;k++){const p=pts[k],q=pts[(k+1)%n];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;if(!k)g.moveTo(mx,my);else g.quadraticCurveTo(p[0],p[1],mx,my)}
    const p0=pts[0],q0=pts[1];g.quadraticCurveTo(p0[0],p0[1],(p0[0]+q0[0])/2,(p0[1]+q0[1])/2);g.closePath();g.fillStyle=fill;g.fill();g.lineWidth=2;g.strokeStyle=stroke;g.stroke()};
  const rad=Math.max(14,Math.min(W,H)*.045);
  g.textAlign='center';
  for(const id of Object.keys(MAPS)){
    const [x,y]=pos(id),M=MAPS[id];
    if(PROGRESS.has(id)){
      blob(id,x,y,M.kind==='indoor'?rad*.8:rad,NODE_COL[M.theme||'']||'#4f9a3a',M.kind==='indoor'?'#0a0e27':'#f0e6c8');
      if(M.kind==='indoor'){g.fillStyle='#0a0e27';g.beginPath();g.arc(x,y,rad*.28,Math.PI,0);g.lineTo(x+rad*.28,y+rad*.2);g.lineTo(x-rad*.28,y+rad*.2);g.fill()}
      g.font='13px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';g.fillStyle='#000a';g.fillText(M.name,x+1,y+rad+15);g.fillStyle='#eef1ff';g.fillText(M.name,x,y+rad+14);
      const note=HOOKS.worldNote&&HOOKS.worldNote(id);if(note){g.font='11px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';g.fillStyle='#000a';g.fillText(note,x+1,y+rad+28);g.fillStyle='#ffd84a';g.fillText(note,x,y+rad+27)}   // 藏寶情報（village.js）
    }else if(unknown.has(id)){
      blob(id,x,y,rad*.7,'#2b3a67','#6f86d6');g.fillStyle='#bfcaf5';g.font='bold 15px sans-serif';g.fillText('？',x,y+5);
    }
  }
  // 目前位置
  const [cx,cy]=pos(CURID),pulse=1+.15*Math.sin(now/250);
  g.strokeStyle='#ffd84a';g.lineWidth=3;g.beginPath();g.arc(cx,cy,rad*1.25*pulse,0,7);g.stroke();
  g.fillStyle='#ffd84a';g.beginPath();g.moveTo(cx,cy-rad*.15);g.lineTo(cx-7,cy-rad*.15-12);g.lineTo(cx+7,cy-rad*.15-12);g.closePath();g.fill();
  g.textAlign='left';g.font='12px sans-serif';g.fillStyle='#8a95c0';g.fillText('按 M 或「關閉」回到遊戲',14,H-14);
}

const SPAWN_COL={slime:'#58e070',archer:'#ffd84a',knight:'#9fb6ff',goblin:'#ff8a4a'};

  c.imageSmoothingEnabled=false;c.drawImage(C.dbgMask,0,0,C.w,C.h);c.imageSmoothingEnabled=true;

  c.strokeStyle='#ff4af0';C.exits.forEach(e=>c.strokeRect(e.x,e.y,e.w,e.h));
  c.font='bold .45px sans-serif';c.textAlign='center';
  (C.M.spawns||[]).forEach(s=>{c.fillStyle=SPAWN_COL[s.k]||'#fff';c.beginPath();c.arc(s.x,s.y,.32,0,7);c.fill();c.fillStyle='#000';c.fillText(s.k[0].toUpperCase(),s.x,s.y+.16)});
  if(C.M.boss){const b=C.M.boss;c.strokeStyle='#ff3040';c.lineWidth=.1;c.beginPath();c.moveTo(b.x-.5,b.y-.5);c.lineTo(b.x+.5,b.y+.5);c.moveTo(b.x+.5,b.y-.5);c.lineTo(b.x-.5,b.y+.5);c.stroke()}
  c.strokeStyle='#0ff';c.lineWidth=lw;c.beginPath();c.arc(P.x,P.y,PLAYER_R,0,7);c.stroke();
  $('#dbg').textContent=`${CURID} (${P.x.toFixed(2)}, ${P.y.toFixed(2)})\nfps ${stat.fps}  dpr ${dpr}  render ${stat.renderMs.toFixed(1)}ms\n區塊 ${blk.size}/${blkMax}  本幀新建 ${stat.frameBuilt}  累計 ${stat.built}\n物件 ${C.props.length}`;
}
// 自我檢查：每張地圖的出生點／落點、可到達性、出口成對
function audit(){
  const out={},keep=C,arrivals={};
  for(const a in MAPS)for(const e of MAPS[a].exits||[])(arrivals[e.to]=arrivals[e.to]||[]).push({from:a,x:e.tx,y:e.ty});
  for(const id in MAPS){
    const c=compileMap(id);C=c;const r={problems:[],locked:[]};
    const pts=[{what:'出生點',x:c.M.spawn[0],y:c.M.spawn[1]},...(arrivals[id]||[]).map(a=>({what:'從'+a.from+'來的落點',x:a.x,y:a.y}))];
    for(const p of pts){if(!circleFree(p.x,p.y,PLAYER_R))r.problems.push(p.what+'不在可走區或卡在碰撞體');if(c.exits.some(e=>inRect(e,p.x,p.y)))r.problems.push(p.what+'在出口矩形內')}
    // 洪水填充（以玩家圓能站的格子為準）。第一次：鎖都關著、不用勾爪；第二次：鎖全開＋勾爪樁互連（到得了＝只是被機關擋住）
    const mw=c.mw,mh=c.mh,q=[],lockCols=c.props.filter(p=>p.k==='lock').map(p=>p.col),hooks=c.props.filter(p=>p.k==='hook');
    const flood=(open)=>{
      const keepOff=lockCols.map(l=>l.off);if(open)lockCols.forEach(l=>l.off=true);
      const ok=new Int8Array(mw*mh).fill(-1),seen=new Uint8Array(mw*mh);
      const can=i=>{if(ok[i]<0)ok[i]=circleFree((i%mw+.5)/MASK_RES,(Math.floor(i/mw)+.5)/MASK_RES,PLAYER_R)?1:0;return ok[i]===1};
      const seed=(x,y,rad)=>{const R=Math.ceil(rad*MASK_RES),cx=Math.floor(x*MASK_RES),cy=Math.floor(y*MASK_RES);for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const nx=cx+i,ny=cy+j;if(nx<0||ny<0||nx>=mw||ny>=mh||Math.hypot(i,j)/MASK_RES>rad)continue;const k=ny*mw+nx;if(!seen[k]&&can(k)){seen[k]=1;q.push(k)}}};
      seed(c.M.spawn[0],c.M.spawn[1],.01);
      const done=new Set();
      for(let pass=0;pass<8;pass++){
        while(q.length){const i=q.pop(),x=i%mw,y=(i-x)/mw;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=mw||ny>=mh)continue;const j=ny*mw+nx;if(!seen[j]&&can(j)){seen[j]=1;q.push(j)}}}
        if(!open)break;let more=false;
        for(const a of hooks){if(done.has(a)||!reachIn(seen,a.x,a.y,1.6))continue;done.add(a);
          for(const b of hooks)if(b!==a&&(Math.abs(a.x-b.x)<.6||Math.abs(a.y-b.y)<.6)&&Math.hypot(a.x-b.x,a.y-b.y)<=8.2){seed(b.x,b.y,1.3);more=true}}
        if(!more)break;
      }
      lockCols.forEach((l,i)=>l.off=keepOff[i]);return seen;
    };
    const reachIn=(seen,x,y,rad)=>{const R=Math.ceil(rad*MASK_RES);const cx=Math.floor(x*MASK_RES),cy=Math.floor(y*MASK_RES);for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const nx=cx+i,ny=cy+j;if(nx<0||ny<0||nx>=mw||ny>=mh)continue;if(Math.hypot(i,j)/MASK_RES>rad)continue;if(seen[ny*mw+nx])return true}return false};
    const seen=flood(false),seen2=flood(true);
    const reach=(x,y,rad)=>reachIn(seen,x,y,rad),reach2=(x,y,rad)=>reachIn(seen2,x,y,rad);
    const rectIn=(sn,e)=>{for(let y=Math.max(0,Math.floor(e.y*MASK_RES));y<Math.min(mh,Math.ceil((e.y+e.h)*MASK_RES));y++)for(let x=Math.max(0,Math.floor(e.x*MASK_RES));x<Math.min(mw,Math.ceil((e.x+e.w)*MASK_RES));x++)if(sn[y*mw+x])return true;return false};
    for(const p of pts)if(!reach(p.x,p.y,.2)){if(reach2(p.x,p.y,.2))r.locked.push(p.what+'（機關後）');else r.problems.push(p.what+'和出生點不相連')}
    c.exits.forEach(e=>{if(rectIn(seen,e))return;if(rectIn(seen2,e))r.locked.push('往 '+e.to+' 的出口（機關後）');else r.problems.push('往 '+e.to+' 的出口到不了')});
    const targets=[...(c.M.chests||[]).map(o=>['寶箱 '+o.id,o.x,o.y-.25,.36]),...c.npcs.map(n=>['NPC '+n.name,n.x,n.y,.3]),...c.signs.map(s=>['告示牌',s.x,s.y,.2]),
      ...(c.M.altar?[['祭壇',c.M.altar.x,c.M.altar.y-.45,.8]]:[]),...(c.M.boss?[['首領點',c.M.boss.x,c.M.boss.y,0]]:[]),...(c.M.braziers||[]).map(b=>['火盆 '+b.id,b.x,b.y-.2,.3]),
      ...(c.M.blocks||[]).map(b=>['石塊',b.x,b.y-.45,.45]),...(c.M.spawns||[]).map(s=>['出生點 '+s.k,s.x,s.y,0]),...(c.M.hooks||[]).map((h,i)=>['勾爪樁 '+i,h.x,h.y,.2]),
      ...(c.M.cracks||[]).map(k=>['裂牆 '+k.id,k.x,k.y,.3])];
    for(const [what,x,y,rad] of targets)if(!reach(x,y,rad+PLAYER_R+.4)){
      if(reach2(x,y,rad+PLAYER_R+.4))r.locked.push(what+'（機關後）');else r.problems.push(what+' 到不了');
    }
    {const ax=HOOKS.audit(c,reach,reach2);if(ax){r.problems.push(...(ax.problems||[]));r.locked.push(...(ax.locked||[]))}}   // 石塊獎勵寶箱、裂牆後的寶箱（adventure.js）
    // 出口成對：對面地圖有回來的出口、而且回來的落點就在這個出口附近
    c.exits.forEach(e=>{const B=MAPS[e.to];if(!B){r.problems.push('出口指向不存在的地圖 '+e.to);return}
      const back=(B.exits||[]).filter(b=>b.to===id);if(!back.length){r.problems.push(e.to+' 沒有回來的出口');return}
      const near=back.some(b=>rectDist(e,b.tx,b.ty)<3.2);if(!near)r.problems.push('從 '+e.to+' 回來的落點離這個出口太遠');});
    r.props=c.props.length;r.reachCells=seen.reduce((a,b)=>a+b,0);
    out[id]=r;
  }
  C=keep;return out;
}

let last=0,fpsT=0,fpsN=0,running=false;
function loop(now){
  if(!running)return;
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  fpsN++;if(now-fpsT>1000){stat.fps=fpsN;fpsN=0;fpsT=now}
  update(dt);render(now);
  requestAnimationFrame(loop);
}
function resize(){
  const r=$('#app').getBoundingClientRect(),nd=Math.min(DPR_MAX,window.devicePixelRatio||1),cv=$('#cv');
  cw=Math.round(r.width*nd);ch=Math.round(r.height*nd);cv.width=cw;cv.height=ch;

  const u0=clamp(r.height>r.width?r.width/VIEW_UNITS_PORTRAIT:Math.min(r.width,r.height)/VIEW_UNITS_SHORT,U_MIN,U_MAX),nu=Math.max(1,Math.round(u0*nd))/nd;
  if(nd!==dpr||nu!==U||!TMP.length){dpr=nd;U=nu;tmpReset();buildTextures();for(const k in SPR)SPR[k]=null;SHADOW=SHADOW||shadowSprite();clearBlocks();GEN++;forceFull=true}

  keys[k]=true;
});

(function(){   // 虛擬搖桿
  // 浮動搖桿：在搖桿區按下的位置就是搖桿中心；放開後底座回到左下角待機位置
  const JOY_ZONE_W=0.55;    // 搖桿區寬度占畫面比例（左側）
  const JOY_ZONE_H=0.60;    // 搖桿區高度占畫面比例（下方；上方留給左上角 HUD）
  const JOY_FOLLOW=1.15;    // 手指離中心超過半徑的這個倍數時，底座跟著手指平移（跟隨式）
  const BASE_HALF=65;       // 底座半徑（130px 的一半），用來把底座夾在畫面內
  const el=$('#joy'),kb=$('#knob'),zone=$('#joyZone'),map=$('#sMap'),R=46;
  let id=null,cx=0,cy=0;
  zone.style.width=(JOY_ZONE_W*100)+'%';zone.style.height=(JOY_ZONE_H*100)+'%';
  // safe-area 邊距：用探針元素讀 env() 的實際像素
  const probe=document.createElement('div');
  probe.style.cssText='position:absolute;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  map.appendChild(probe);
  const inset=()=>{const s=getComputedStyle(probe);return {t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0}};
  const place=(x,y)=>{   // x,y：視窗座標的底座中心；夾在畫面內並移動底座
    const m=map.getBoundingClientRect(),s=inset();
    cx=Math.min(Math.max(x,m.left+s.l+BASE_HALF),m.right-s.r-BASE_HALF);
    cy=Math.min(Math.max(y,m.top+s.t+BASE_HALF),m.bottom-s.b-BASE_HALF);
    el.style.left=(cx-m.left-BASE_HALF)+'px';el.style.top=(cy-m.top-BASE_HALF)+'px';el.style.bottom='auto';
  };
  const set=(x,y)=>{
    let dx=x-cx,dy=y-cy;const l=Math.hypot(dx,dy);
    if(l>R*JOY_FOLLOW){place(cx+dx*(1-R/l),cy+dy*(1-R/l));dx=x-cx;dy=y-cy}   // 底座往手指方向平移，讓手指落在半徑邊緣
    const l2=Math.hypot(dx,dy);if(l2>R){dx*=R/l2;dy*=R/l2}
    kb.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/R;joy.y=dy/R;
  };
  const reset=()=>{id=null;joy.x=joy.y=0;kb.style.transform='';el.classList.remove('act');el.style.left=el.style.top=el.style.bottom=''};   // 清掉行內位置＝回到 CSS 的待機位置
  zone.addEventListener('pointerdown',e=>{
    if(id!==null||dlgOpen||panelOpen||worldOpen)return;   // 只跟第一根手指；對話／面板／地圖開著不作用
    id=e.pointerId;try{zone.setPointerCapture(id)}catch(_){}
    el.classList.add('act');place(e.clientX,e.clientY);set(e.clientX,e.clientY);
  });
  zone.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e.clientX,e.clientY)});
  const end=e=>{if(e.pointerId===id)reset()};
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
  zone.addEventListener('lostpointercapture',end);
  addEventListener('blur',reset);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});
})();

async function start(mode){   // mode：'new'｜'continue'（標題按鈕由 game.js 接；沒有 game.js 時直接開始）
  if(running)return;
  const T0=performance.now(),left=()=>Math.max(0,LOAD_MAX_MS-(performance.now()-T0));
  const btns=[...document.querySelectorAll('#sTitle button')];btns.forEach(b=>b.disabled=true);
  const el=$('#fade');fadeProg(0,0);el.classList.add('on');await sleep(300);   // 載入畫面：一直停到第一張地圖的圖都到齊（或失敗／逾時）
  $('#sTitle').classList.remove('on');$('#sMap').classList.add('on');
  ctx=$('#cv').getContext('2d');
  const s=HOOKS.begin(mode==='continue'?'continue':'new')||{},id=MAPS[s.map]?s.map:'village';
  C=compileMap(id);
  resize();
  await Promise.race([SART_READY,sleep(left())]);   // 選配美術清單：這張地圖要用哪些圖由它決定，所以先等它（逾時當沒有）
  const keys=mapArt(id),r=await loadKeys(keys,left(),fadeProg);   // 網路不通就逾時放行，畫面用程式畫的替代
  go(id,s.x,s.y,s.face);
  running=true;last=performance.now();render(last);requestAnimationFrame(loop);   // 先把視野內的地面區塊用圖集建好，再淡入
  LASTLOAD={map:id,...r,...loadState(keys),sartLoaded:SART.size,blocks:blk.size,blocksCurrent:blk.size>0&&[...blk.values()].every(e=>e.gen===GEN),waitMs:Math.round(performance.now()-T0)};
  await sleep(30);el.classList.remove('on');btns.forEach(b=>b.disabled=false);
  fadeMsg('');el.classList.remove('prog');
  LASTLOAD.fadeMs=Math.round(performance.now()-T0);
  startPreload();
}
document.title=GAME_TITLE;
{const [a,b]=GAME_TITLE.split('：');$('#logo').innerHTML='';$('#logo').append(a||GAME_TITLE);if(b){const s=document.createElement('small');s.textContent=b;$('#logo').append(s)}}
Promise.all(['ui-btn','ui-btn-pri'].map(k=>new Promise((ok,no)=>{const im=new Image();im.onload=ok;im.onerror=no;im.src=`${PK}${k}.webp`}))).then(()=>document.body.classList.add('btn-art'),()=>{});
if(DEBUG){
  document.body.classList.add('debug');
  window.__shrine={go:(id,x,y,face)=>{const ok=go(id,x,y,face);if(ok&&running)render(performance.now());return ok},get state(){return {map:CURID,x:P.x,y:P.y,face:P.face,blocks:blk.size,built:stat.built,fps:stat.fps}},
    stat,P,MAPS,PROGRESS,start,audit,get load(){return LASTLOAD},get snd(){return typeof SND!=='undefined'?SND.stat:null},get art(){return {ART:Object.keys(ART).length,fail:Object.keys(artFail),pre:preQ?preQ.length:null,gating}},openWorld,ask,openPanel,closePanel,get panelOpen(){return panelOpen},
    keys,joy,tick:dt=>{update(dt);render(performance.now());return [CURID,P.x,P.y]},
    /* zoom：看全圖用，暫時改解析度讓視野變大 */
    zoom:z=>{dpr=z;tmpReset();buildTextures();for(const k in SPR)SPR[k]=null;clearBlocks();GEN++;forceFull=true;render(performance.now())},
    move:(dx,dy)=>{moveBy(dx,dy);return [P.x,P.y]},free:(x,y)=>circleFree(x,y,PLAYER_R),
    walk:(x,y)=>walkAt(C,x,y),render:()=>render(performance.now()),update:dt=>update(dt)};
