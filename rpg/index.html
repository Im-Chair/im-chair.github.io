<!-- ===== 營地 ===== -->
<div class="screen" id="s-camp">
  <!-- v393b：貨幣／標題／角色從「疊在圖上」改成「獨立頁首」。
       營地圖是 2:3，手機直式一定會留上下黑帶——與其讓它空著，不如把 UI 放進去，
       圖面同時也乾淨了（疊層蓋住美術本來就是負體驗） -->
  <div class="camp-top">
    <div class="ct-bar">
      <div class="ov-gold"><svg class="ic"><use href="#ic-gold"/></svg><span id="camp-gold">0</span></div>
      <div class="ov-title">貪婪深淵</div>
      <div class="ov-gem"><svg class="ic"><use href="#ic-gem"/></svg><span id="camp-gem">0</span></div>
    </div>
    <div class="ov-hero" onclick="openRoster()">
      <span class="ov-hero-ic" id="camp-cls-ic"></span>
      <span class="ov-hero-tx"><span class="ov-hero-cls" id="camp-cls"></span><span class="ov-hero-cert" id="camp-cert"></span></span>
    </div>
  </div>
  <div class="camp-scene">
    <!-- 八個熱區：座標以 camp3.webp（941×1672≈9:16）為基準。.camp-scene 現在是固定比例 + contain，
         所以這些百分比就是「圖片百分比」，在所有裝置上一致，不再需要逐機手調 -->
    <div class="hot" data-fx=".17" data-fy=".175" data-fw=".34" data-fh=".25" onclick="openRunStats()"></div>
    <div class="hot" data-fx=".475" data-fy=".115" data-fw=".28" data-fh=".17" onclick="openBounty()"><span class="hot-badge" id="bounty-badge"></span></div>
    <div class="hot" data-fx=".855" data-fy=".19" data-fw=".29" data-fh=".28" onclick="openSmith()"></div>
    <div class="hot" data-fx=".13" data-fy=".455" data-fw=".28" data-fh=".24" onclick="openGear()"></div>
    <div class="hot" data-fx=".50" data-fy=".46" data-fw=".38" data-fh=".28" onclick="openDivePicker()"></div>
    <div class="hot" id="hot-market" data-fx=".855" data-fy=".60" data-fw=".29" data-fh=".23" onclick="if(G.rec.deep>=30)openMarket();else toast('深入 30 層後解鎖深淵黑市')"></div>
    <div class="hot" data-fx=".21" data-fy=".79" data-fw=".38" data-fh=".21" onclick="openSaveMgr()"></div>
    <!-- 圖鑑：暫時關閉（改建中）。熱區保留，openCodex 內以 CODEX_ENABLED 擋下並回 toast -->
    <div class="hot" id="hot-codex" data-fx=".82" data-fy=".855" data-fw=".34" data-fh=".19" onclick="openCodex()"></div>
  </div>
</div>

</div>

<!-- ===== 深淵黑市 v415：原本是 sheet，改為獨立畫面 =====
     第一列＝貨源輪迴分頁（點任一頁一併回到裝備攤）
     第二列＝攤位（符文／魔符）＋刷新；刷新固定在此，不隨貨量上下移動 -->
<div class="screen" id="s-market">
  <div class="mk-res">
    <span class="back-link" onclick="showScreen('s-camp')">‹ 回營地</span>
    <span class="m" id="mk-gem"></span>
    <span class="g" id="mk-gold"></span>
  </div>
  <div class="mk-stage"><div class="src" id="mk-src"></div></div>
  <div class="mk-tabs" id="mk-tabs"></div>
  <div class="mk-bar" id="mk-bar"></div>
  <div class="mk-goods" id="mk-goods"></div>
</div>

<!-- ===== 懸賞板 v425：原本是 sheet（openBounties），改為獨立畫面 =====
     上半＝木板 ＋ 六張歪斜紙條（摘要只放輪迴／類型／獎勵＋鑽石，樓層不放，放不下）
     下半＝被點那張的詳情卡。紙條底色＝難度帶，圖釘＝狀態。
     ⚠ 詳情卡的描述固定兩行高（.bn-desc），切換紙條時整個版面不得位移 -->
<div class="screen" id="s-bounty">
  <div class="bn-res">
    <span class="back-link" onclick="showScreen('s-camp')">‹ 回營地</span>
    <span class="m" id="bn-gem"></span>
    <span class="g" id="bn-gold"></span>
  </div>
  <div class="bn-board">
    <div class="bn-hd"><span class="t">懸賞板</span><span class="q" id="bn-quota"></span></div>
    <div class="bn-grid" id="bn-grid"></div>
    <div class="bn-key">
      <span><i class="k-hard"></i>難</span><span><i class="k-mid"></i>中</span><span><i class="k-easy"></i>易</span>
      <span class="sp"><i class="k-ready"></i>可回報</span><span><i class="k-active"></i>進行中</span>
    </div>
  </div>
  <div id="bn-detail"></div>
  <div class="bn-re" onclick="refreshBounties()"><svg class="ic"><use href="#ic-refresh"/></svg> 刷新可接委託</div>
</div>

<!-- ===== 抉擇（門）v431 =====
     頂部是「撤退決策條」：血／碎銀／行囊未保管件數。這三個數字決定「現在走還是再貪一層」，
     行囊件數以前藏在角色檢視按鈕的小字裡——那是死了就全沒的東西，不該藏。
     樓層只在 depth-gauge 顯示一次（原本 topbar 又寫了一份，重複）。 -->
<div class="screen" id="s-doors">
  <!-- v437 版面順序：血量 → 祝福 → 深度 → 門 → 委託 → 動作 → 藥水 → 資源四格。
       間距全部固定(10/10/12/12/10/8/8),不再有任何一塊吸收剩餘高度——
       門區以前吃掉所有剩餘再置中,結果剩餘被平均攤成門上下兩條大縫(實測 46 / 44px)。 -->
  <div class="dr-res">
    <span class="hp" id="dr-hp"></span>
  </div>
  <div class="dr-bar"><i id="dr-hpfill"></i></div>
  <!-- 祝福 5 格是**恆定佔位**(BLESSINGS 五種),沒吃到就顯示灰格——版面高度永遠一樣。 -->
  <div class="dr-bless" id="dr-bless"></div>
  <!-- 深度區塊的底是「該域的橫幅」(REALMS[].bg)。那六張圖以前只在進域那一瞬間出現一次,
       之後整趟再也看不到——拿來當底,畫面才有「你人在哪」的實感,而且零新素材。 -->
  <div class="depth-gauge" id="d-depth">
    <div class="lbl"></div>
    <div class="num" id="d-floor-big">1</div>
    <div class="rec" id="d-rec"></div>
    <div class="realm-rule" id="d-rule"></div>
  </div>
  <div class="door-grid" id="door-grid"></div>
  <!-- 委託 2 格同樣是恆定佔位(MAX_ACTIVE=2),沒接就顯示空槽。 -->
  <div class="dr-bounty" id="dr-bounty"></div>
  <!-- 逃脫與角色檢視併成一排、改用 .slim：這兩顆不是主角，主角是門。
       兩顆逃脫鈕同時間只會有一顆顯示，另一顆 display:none，flex 會自動讓剩下的填滿。 -->
  <div class="row dr-acts">
    <button class="btn slim retreat-btn" id="retreat-btn" onclick="retreat()" style="display:none"><svg class="ic"><use href="#ic-rope"/></svg> 逃脫之繩</button>
    <button class="btn slim retreat-btn" id="retreat-gold-btn" onclick="retreatByGold()" style="display:none"><svg class="ic"><use href="#ic-gold"/></svg> 9 成碎銀逃脫</button>
    <button class="btn slim" onclick="openRunStats()"><svg class="ic"><use href="#ic-hero"/></svg> 角色檢視</button>
  </div>
  <div class="potion-row" id="door-potions"></div>
  <!-- 資源四格：碎銀／行囊／符文／魔符。由 renderDoorCells() 填,四格恆定佔位。 -->
  <div class="dr-cells" id="dr-cells"></div>
</div>

<!-- ===== 戰鬥 ===== -->
<div class="screen" id="s-battle">
  <!-- v438：碎銀在戰鬥中無法使用,移除;右邊改放回合數。
       B.turn 從 v1 就存在但從來沒顯示過,而「熔獄：敵人第 5 回合起狂怒」這類域規則靠的就是它。 -->
  <div class="topbar">
    <span class="depth">第 <span id="b-floor">1</span> 層</span>
    <span class="turn" id="b-turn"></span>
  </div>
  <div class="enemy-zone" id="enemy-zone"></div>
  <div id="log"></div>
  <!-- v438 玩家區：三列固定欄位。舊版把名字/格擋/行動點/法力/護盾/咒鈴全塞進一行 13px 的
       .pz-top,實測寬度在 195〜393px 之間擺盪(格擋、護盾一出現整行就左右滑),
       咒鈴武器同時有格擋與護盾時還會溢出 28〜35px。現在每個欄位都有固定席位,0 也留位。 -->
  <div class="player-zone" id="player-zone" style="position:relative">
    <div class="pz-id" onclick="openRunStats()">
      <img class="pz-cls" id="p-cls" alt="">
      <span class="pname" id="p-name"></span>
      <span class="energy" id="p-energy"></span>
    </div>
    <div class="pz-bars">
      <div class="hpbar player"><div class="fill" id="p-hpfill"></div><div class="txt" id="p-hptxt"></div></div>
      <div class="hpbar mana"><div class="fill" id="p-mpfill"></div><div class="txt" id="p-mptxt"></div></div>
    </div>
    <div class="pz-def">
      <span class="dchip" id="p-block"></span>
      <span class="dchip" id="p-shield"></span>
      <span class="status-row" id="p-status"></span>
    </div>
    <div class="skill-grid" id="skill-grid"></div>
    <div class="battle-bottom">
      <button class="btn" style="flex:0 0 30%" onclick="openBattlePotions()"><svg class="ic"><use href="#ic-potion"/></svg> 道具</button>
      <button class="btn primary" id="btn-end" onclick="endTurn()">結束回合</button>
    </div>
  </div>
</div>

<!-- ===== 事件 ===== -->
<div class="screen" id="s-event">
  <div class="topbar">
    <span class="depth">第 <span id="ev-floor">1</span> 層</span>
    <span class="gold-chip"><svg class="ic"><use href="#ic-gold"/></svg> <span id="ev-gold">0</span></span>
  </div>
  <div class="center-box" style="margin:0;padding:8px 0"><div class="big" id="ev-icon"><svg class="ic big"><use href="#ic-unknown"/></svg></div>
  <h2 id="ev-title"></h2></div>
  <div class="ev-text" id="ev-text"></div>
  <div class="choices" id="ev-choices"></div>
</div>

<!-- ===== 戰利品 ===== -->
<div class="screen" id="s-loot">
  <div class="center-box" style="margin:0;padding:8px 0">
    <div class="big" id="loot-icon"><svg class="ic big"><use href="#ic-chest"/></svg></div>
    <h2 id="loot-title">戰利品</h2>
    <p id="loot-sub"></p>
  </div>
  <div id="loot-body"></div>
  <div class="spacer"></div>
  <button class="btn primary" onclick="afterLoot()">繼續</button>
</div>

<!-- ===== 結算 ===== -->
<div class="screen" id="s-result">
  <div class="center-box">
    <div class="big" id="res-icon"><svg class="ic big"><use href="#ic-skull"/></svg></div>
    <h2 id="res-title"></h2>
    <p id="res-sub"></p>
  </div>
  <div id="res-body"></div>
  <div class="spacer"></div>
  <button class="btn primary" onclick="backToCamp()">回到營地</button>
</div>

</div>
<div class="sheet-mask" id="sheet-mask" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var el=document.getElementById('rpg-ver'); if(el) el.textContent='V'+RPG_VER[0]+'.'+RPG_VER.slice(1);
  ['data','core','account','items','battle','run','ui'].forEach(function(m){
    document.write('<script src="'+m+'.js?v='+RPG_VER+'"><\/script>');   // document.write 保證與原本靜態標籤相同的載入順序
  });
})();
</script>
</body>
</html>
