<div id="app">

<!-- ===== 標題 ===== -->
<div class="screen" id="s-title">
  <div class="spacer"></div>
  <img class="title-art" src="ui/title.webp" alt="貪婪深淵 GREEDY ABYSS">
  <div class="subtitle">深入一層，或帶著一切離開</div>
  <div id="rpg-ver" style="text-align:center;color:var(--dim);font-size:12px;letter-spacing:2px;margin-top:8px"></div>
  <div class="spacer"></div>
  <button class="btn primary" onclick="titleStart()">進入深淵</button>
  <div style="height:10px"></div>
  <button class="btn danger" id="btn-wipe" onclick="wipeConfirm()" style="display:none">放棄一切重新開始</button>
  <div class="spacer"></div>
  <div style="text-align:center;color:var(--dim);font-size:10px;line-height:1.6;opacity:.55;padding:0 12px">
    部分圖示來自 <a href="https://game-icons.net" target="_blank" rel="noopener" style="color:inherit">game-icons.net</a><br>
    作者：Lorc、Delapouite、Skoll、DarkZaitzev、Cathelineau、Carl Olsen — 授權 CC BY 3.0
  </div>
</div>

<!-- ===== 職業 ===== -->
<div class="screen" id="s-class">
  <div class="section-title">選擇你的職業</div>
  <div class="class-grid" id="class-grid"></div>
  <div class="spacer"></div>
  <button class="btn primary" onclick="confirmClass()">就是他了</button>
</div>

<!-- ===== 營地 ===== -->
<div class="screen" id="s-camp">
  <!-- v393b：貨幣／標題／角色從「疊在圖上」改成「獨立頁首」。
       營地圖是 2:3，手機直式一定會留上下黑帶——與其讓它空著，不如把 UI 放進去，
       圖面同時也乾淨了（疊層蓋住美術本來就是負體驗） -->
  <div class="camp-top">
    <div class="ct-bar">
      <div class="ov-gold"><svg class="ic"><use href="#ic-gold"/></svg><span id="camp-gold">0</span></div>
      <div class="ov-title">貪婪深淵</div>
      <div class="ov-gem"><svg class="ic"><use href="#ic-gem"/></svg><span id="camp-gem">0</span></div>
    </div>
    <div class="ov-hero" onclick="openRoster()">
      <span class="ov-hero-ic" id="camp-cls-ic"></span>
      <span class="ov-hero-tx"><span class="ov-hero-cls" id="camp-cls"></span><span class="ov-hero-cert" id="camp-cert"></span></span>
    </div>
  </div>
  <div class="camp-scene">
    <!-- 八個熱區：座標以 camp2.webp（2:3）為基準。.camp-scene 現在是固定比例 + contain，
         所以這些百分比就是「圖片百分比」，在所有裝置上一致，不再需要逐機手調 -->
    <div class="hot" data-fx=".17" data-fy=".175" data-fw=".34" data-fh=".25" onclick="openRunStats()"></div>
    <div class="hot" data-fx=".475" data-fy=".115" data-fw=".28" data-fh=".17" onclick="openBounties()"><span class="hot-badge" id="bounty-badge"></span></div>
    <div class="hot" data-fx=".855" data-fy=".19" data-fw=".29" data-fh=".28" onclick="openSmith()"></div>
    <div class="hot" data-fx=".13" data-fy=".455" data-fw=".28" data-fh=".24" onclick="openGear()"></div>
    <div class="hot" data-fx=".50" data-fy=".46" data-fw=".38" data-fh=".28" onclick="openDivePicker()"></div>
    <div class="hot" id="hot-market" data-fx=".855" data-fy=".60" data-fw=".29" data-fh=".23" onclick="if(G.rec.deep>=30)openMarket();else toast('深入 30 層後解鎖深淵黑市')"></div>
    <div class="hot" data-fx=".21" data-fy=".79" data-fw=".38" data-fh=".21" onclick="openSaveMgr()"></div>
    <!-- 圖鑑：暫時關閉（改建中）。熱區保留，openCodex 內以 CODEX_ENABLED 擋下並回 toast -->
    <div class="hot" id="hot-codex" data-fx=".82" data-fy=".855" data-fw=".34" data-fh=".19" onclick="openCodex()"></div>
  </div>
</div>

<!-- ===== 裝備 ===== -->
<div class="screen" id="s-gear">
  <span class="back-link" onclick="showScreen('s-camp')">‹ 回營地</span>
  <div class="section-title">身上裝備</div>
  <div class="slot-row" id="equip-row"></div>
  <div class="section-title">倉庫 <span id="gear-gold" style="float:right;color:var(--gold)"></span></div>
  <div class="item-list" id="stash-list"></div>
</div>

<!-- ===== 鐵匠 ===== -->
<div class="screen" id="s-smith">
  <span class="back-link" onclick="showScreen('s-camp')">‹ 回營地</span>
  <div class="center-box" style="padding:10px 0">
    <div class="big" id="smith-ic"><svg class="ic big"><use href="#ic-anvil"/></svg></div>
    <p>把碎銀交給老鐵匠，他會替你把裝備敲得更兇。</p>
  </div>
  <div class="item-list" id="smith-list"></div>
  <p style="color:var(--dim);font-size:12px;margin-top:12px">強化直接附在該件裝備上；分解裝備時強化不會退款。</p>
</div>

<!-- ===== 抉擇（門）===== -->
<div class="screen" id="s-doors">
  <div class="topbar">
    <span class="depth">第 <span id="d-floor">1</span> 層</span>
    <span id="d-hp"></span>
    <span class="gold-chip"><svg class="ic"><use href="#ic-gold"/></svg> <span id="d-gold">0</span></span>
  </div>
  <div class="depth-gauge">
    <div class="lbl">目前深度</div>
    <div class="num" id="d-floor-big">1</div>
    <div class="bonus" id="d-bonus"></div>
  </div>
  <div class="door-grid" id="door-grid"></div>
  <button class="btn retreat-btn" id="retreat-btn" onclick="retreat()" style="display:none"><svg class="ic"><use href="#ic-rope"/></svg> 使用逃脫之繩——活著離開，記錄這趟深度</button>
  <button class="btn retreat-btn" id="retreat-gold-btn" onclick="retreatByGold()" style="display:none"><svg class="ic"><use href="#ic-gold"/></svg> 花費 9 成碎銀逃脫——活著離開，記錄這趟深度</button>
  <div class="rope-hint" id="rope-hint"></div>
  <div style="height:8px"></div>
  <button class="btn" style="font-size:14px" onclick="openRunStats()"><svg class="ic"><use href="#ic-hero"/></svg> 角色檢視 <span id="bag-hint" style="color:var(--dim);font-size:12px"></span></button>
  <div class="potion-row" id="door-potions"></div>
</div>

<!-- ===== 戰鬥 ===== -->
<div class="screen" id="s-battle">
  <div class="topbar">
    <span class="depth">第 <span id="b-floor">1</span> 層</span>
    <span class="gold-chip"><svg class="ic"><use href="#ic-gold"/></svg> <span id="b-gold">0</span></span>
  </div>
  <div class="enemy-zone" id="enemy-zone"></div>
  <div id="log"></div>
  <div class="player-zone" id="player-zone" style="position:relative">
    <div class="pz-top" onclick="openRunStats()">
      <span class="pname" id="p-name"></span>
      <span class="st blk" id="p-block" style="display:none"></span>
      <span class="energy" id="p-energy"></span>
    </div>
    <div class="hpbar player"><div class="fill" id="p-hpfill"></div><div class="txt" id="p-hptxt"></div></div>
    <div class="status-row" id="p-status"></div>
    <div class="skill-grid" id="skill-grid"></div>
    <div class="battle-bottom">
      <button class="btn" style="flex:0 0 30%" onclick="openBattlePotions()"><svg class="ic"><use href="#ic-potion"/></svg> 道具</button>
      <button class="btn primary" id="btn-end" onclick="endTurn()">結束回合</button>
    </div>
  </div>
</div>

<!-- ===== 事件 ===== -->
<div class="screen" id="s-event">
  <div class="topbar">
    <span class="depth">第 <span id="ev-floor">1</span> 層</span>
    <span class="gold-chip"><svg class="ic"><use href="#ic-gold"/></svg> <span id="ev-gold">0</span></span>
  </div>
  <div class="center-box" style="margin:0;padding:8px 0"><div class="big" id="ev-icon"><svg class="ic big"><use href="#ic-unknown"/></svg></div>
  <h2 id="ev-title"></h2></div>
  <div class="ev-text" id="ev-text"></div>
  <div class="choices" id="ev-choices"></div>
</div>

<!-- ===== 戰利品 ===== -->
<div class="screen" id="s-loot">
  <div class="center-box" style="margin:0;padding:8px 0">
    <div class="big" id="loot-icon"><svg class="ic big"><use href="#ic-chest"/></svg></div>
    <h2 id="loot-title">戰利品</h2>
    <p id="loot-sub"></p>
  </div>
  <div id="loot-body"></div>
  <div class="spacer"></div>
  <button class="btn primary" onclick="afterLoot()">繼續</button>
</div>

<!-- ===== 結算 ===== -->
<div class="screen" id="s-result">
  <div class="center-box">
    <div class="big" id="res-icon"><svg class="ic big"><use href="#ic-skull"/></svg></div>
    <h2 id="res-title"></h2>
    <p id="res-sub"></p>
  </div>
  <div id="res-body"></div>
  <div class="spacer"></div>
  <button class="btn primary" onclick="backToCamp()">回到營地</button>
</div>

</div>
<div class="sheet-mask" id="sheet-mask" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var el=document.getElementById('rpg-ver'); if(el) el.textContent='V'+RPG_VER[0]+'.'+RPG_VER.slice(1);
  ['data','core','account','items','battle','run','ui'].forEach(function(m){
    document.write('<script src="'+m+'.js?v='+RPG_VER+'"><\/script>');   // document.write 保證與原本靜態標籤相同的載入順序
  });
})();
</script>
</body>
</html>
