<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漂流紀元：最後的方舟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: full-bleed top-down sea canvas; HUD floats on top (stats+menu top, joystick left, context button right, sheets slide from bottom). Committed dark sea look. */
:root{
  --sea0:#0a2f3b; --sea1:#12586b; --foam:#d6ece6; --foam2:#9fc3bd;
  --wood:#d2ab6e; --wood-d:#7a5a2b; --coral:#e4684a; --good:#7ccf9a;
  --panel:#0f3440; --panel2:#17505e; --ink:#07191f; --line:rgba(214,236,230,.18);
  --fd:'Noto Serif TC','Songti TC',serif; --fb:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --bs:1; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sea0);color:var(--foam);font-family:var(--fb);font-size:14px;line-height:1.45;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;height:100%;width:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud>*{pointer-events:auto}
#hud .gh{pointer-events:none}

/* top */
#top{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:8px;display:flex;flex-direction:column;gap:6px}
#stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bar{display:flex;align-items:center;gap:6px;background:rgba(7,25,31,.62);border:1px solid var(--line);border-radius:10px;padding:4px 8px;min-width:0;backdrop-filter:blur(4px)}
.bar .lbl{font-family:var(--fd);font-weight:900;font-size:13px;color:var(--wood)}
.bar i{flex:1;height:6px;border-radius:4px;background:rgba(214,236,230,.16);overflow:hidden;min-width:0}
.bar b{display:block;height:100%;width:50%;background:var(--good);border-radius:4px;transition:width .3s}
.bar em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;color:var(--foam2)}
.bar.low b{background:var(--coral)}
#res{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(7,25,31,.62);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{color:var(--foam2);margin-right:4px}
.ic{width:30px;height:30px;flex:0 0 30px;object-fit:contain;display:block}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip .ic{width:20px;height:20px;flex-basis:20px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px}
.tool .ic{width:32px;height:32px;flex-basis:32px}
#menu{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.btn,#menu button{background:linear-gradient(#d8b377,#bb8f50);color:#2a1b08;border:0;border-bottom:3px solid var(--wood-d);border-radius:10px;font-weight:700;min-height:40px;padding:4px 6px}
.btn:active,#menu button:active{transform:translateY(2px);border-bottom-width:1px}
.btn.alt{background:var(--panel2);color:var(--foam);border-bottom-color:#0b2a33;border:1px solid var(--line);border-bottom-width:3px}
.btn[disabled]{opacity:.45}
#menu button{font-size:13px}
#quest{background:rgba(7,25,31,.7);border:1px solid var(--line);border-left:3px solid var(--wood);border-radius:8px;padding:6px 10px;font-size:12.5px;pointer-events:none!important}
#quest b{color:var(--wood);font-family:var(--fd)}

/* bottom controls */
#joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:calc(112px*var(--bs));height:calc(112px*var(--bs));border-radius:50%;background:rgba(7,25,31,.45);border:1px solid var(--line);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:rgba(210,171,110,.85);border:2px solid var(--wood-d)}
#act{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:calc(88px*var(--bs));height:calc(88px*var(--bs));border-radius:50%;background:radial-gradient(circle at 35% 30%,#e2bd80,#b78a4b);border:3px solid var(--wood-d);color:#2a1b08;font-family:var(--fd);font-weight:900;font-size:17px;line-height:1.15;padding:4px;box-shadow:0 4px 0 #5a4120}
#act small{display:block;font-family:var(--fb);font-weight:500;font-size:11px}
#act:active{transform:translateY(3px);box-shadow:0 1px 0 #5a4120}
#btnBuild{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(140px*var(--bs) + 46px + env(safe-area-inset-bottom,0px));min-width:72px}
.lefty #joy{left:auto;right:max(18px,env(safe-area-inset-right,0px))}
.lefty #act{right:auto;left:max(18px,env(safe-area-inset-left,0px))}
.lefty #btnBuild{right:auto;left:max(18px,env(safe-area-inset-left,0px))}
#quick{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
#quick button{width:48px;height:48px;border-radius:10px;background:rgba(7,25,31,.7);border:1px solid var(--line);font-size:11px;line-height:1.1;padding:2px}
#quick button.dim{opacity:.4}
.mode-build #joy,.mode-build #act,.mode-build #quick,.mode-build #menu,.mode-build #btnBuild,.mode-build #quest{display:none}

/* build bar */
#buildbar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(10,47,59,.0),rgba(7,25,31,.94) 22%);padding:22px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
#tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-height:34vh;overflow-y:auto;touch-action:pan-y}
.tool{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 2px 4px;text-align:center;font-size:11px;line-height:1.2;min-width:0}
.tool b{display:block;font-size:11.5px;white-space:nowrap;font-weight:500}
.tool em{position:absolute;inset:auto 0 3px 0;font-style:normal;font-size:10px;color:var(--coral)}
.tool .gl{display:flex;width:30px;height:30px;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;font-size:20px;color:var(--wood)}
.tool.on{border-color:var(--wood);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--wood)}
.tool.lock{opacity:.45}
.tool.poor b{color:var(--coral)}
#binfo{font-size:12.5px;min-height:20px;color:var(--foam)}
#brow{display:flex;gap:8px}
#brow .btn{flex:1}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;height:78%;background:var(--panel);border-top:2px solid var(--wood);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
#sheet[hidden]{display:none}
#stabs{display:flex;gap:4px;padding:10px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));align-items:center;overflow-x:auto;scrollbar-width:thin}
#stabs button{flex:1 0 auto;min-width:48px;background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 6px;font-weight:700;color:var(--foam2)}
#stabs button.on{color:var(--wood);border-bottom-color:var(--wood)}
#sx{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line)!important;background:var(--panel2)!important;color:var(--foam)!important;font-size:20px;padding:0!important}
#sbody{flex:1;overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));touch-action:pan-y;-webkit-overflow-scrolling:touch}
h3{font-family:var(--fd);font-size:15px;margin:14px 0 6px;color:var(--wood);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 small{font-family:var(--fb);font-weight:400;color:var(--foam2);font-size:12px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:14px}
.row .m span{display:block;font-size:12px;color:var(--foam2);overflow-wrap:anywhere}
.row .n{font-variant-numeric:tabular-nums;font-weight:700;min-width:2.4em;text-align:right}
.row .btn{min-height:36px;font-size:12.5px;padding:4px 10px;white-space:nowrap}
/* 背包／倉庫網格：點格子選取，操作在下方詳情卡 */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:6px 0}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;min-width:0;padding:4px 2px 3px;background:rgba(7,25,31,.45);border:1px solid var(--line);border-radius:10px}
.cell .ic{width:34px;height:34px;flex:0 0 auto}
.cell .dot{width:22px;height:22px;flex:0 0 auto;border-radius:6px}
.cell .nm{font-size:11px;line-height:1.2;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--foam2)}
.cell .q{position:absolute;top:2px;right:4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.cell.use{border-color:rgba(124,207,154,.45)}
.cell.junk .nm{color:var(--wood)}
.cell.sel{border-color:var(--wood);background:var(--panel2);box-shadow:0 0 0 1px var(--wood) inset}
.idet{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.idet .m{flex:1;min-width:120px}
.idet .m b{display:block;font-size:15px}
.idet .m span{display:block;font-size:12px;color:var(--foam2)}
.idet .acts{width:100%;margin:2px 0 0}
/* 合成：工作站分頁＋單列五格 */
.stabs2{display:flex;gap:4px;margin:6px 0}
.stabs2 button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;background:rgba(7,25,31,.45);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--foam2)}
.stabs2 button .ic{width:26px;height:26px;flex:0 0 auto}
.stabs2 button .em{font-size:20px;line-height:26px}
.stabs2 button.on{border-color:var(--wood);color:var(--wood);background:var(--panel2)}
.stabs2 button.off{opacity:.55}
.igrid.g5{grid-template-columns:repeat(5,1fr)}
.cell .em{font-size:26px;line-height:34px}
.cell.ready{border-color:rgba(124,207,154,.6)}
.cell.dim{opacity:.5}
.cell.dim.sel{opacity:.8}
.cell .fv{position:absolute;top:1px;left:4px;font-size:11px;color:var(--wood)}
.idet .em{font-size:32px;line-height:40px}
.btn[disabled]{opacity:.45;cursor:default}
/* 科技樹：每條路線一張圖，欄＝層級，線＝前置關係 */
.tt{position:relative;margin:4px 0 2px}
.tt svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tt svg path{fill:none;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
.tt svg path.on{stroke:var(--good)}
.tt svg path.av{stroke:var(--wood)}
.tn{position:absolute;width:28%;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;border-radius:10px;border:1px solid var(--line);background:rgba(7,25,31,.85);font-size:12.5px;font-weight:700;line-height:1.2;text-align:center}
.tn small{font-weight:400;font-size:10.5px;color:var(--foam2)}
.tn.done{border-color:var(--good);background:#143b33}
.tn.done small{color:var(--good)}
.tn.av{border-color:var(--wood);box-shadow:0 0 8px rgba(210,171,110,.35)}
.tn.av small{color:var(--wood)}
.tn.lock{color:var(--foam2)}
.tn.sel{outline:2px solid var(--foam);outline-offset:1px}
.dot{width:14px;height:14px;border-radius:4px;flex:0 0 14px}
.need{color:var(--coral)}
.ok{color:var(--good)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.acts .btn{min-height:38px;font-size:13px;padding:4px 12px}
.note{font-size:12px;color:var(--foam2);margin:4px 0}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:64px}
.seg .btn.sel{outline:2px solid var(--foam);outline-offset:1px}

/* modal + toast */
#modal{position:absolute;inset:0;background:rgba(3,14,18,.66);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:5}
#modal[hidden]{display:none}
#mbox{width:100%;max-width:420px;max-height:86%;overflow-y:auto;background:var(--panel);border:2px solid var(--wood);border-radius:14px;padding:14px 14px 12px;touch-action:pan-y}
#mbox h2{font-family:var(--fd);font-size:18px;margin:0 0 6px;color:var(--wood)}
#mbox p{margin:6px 0}
#mbox .btn{width:100%;margin-top:6px;text-align:left;padding:8px 12px;min-height:44px}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:200px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none!important;width:min(88%,360px)}
.toast{background:rgba(7,25,31,.9);border:1px solid var(--wood);border-radius:999px;padding:5px 14px;font-size:13px;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
:focus-visible{outline:2px solid var(--foam);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar b{transition:none}}
@media (max-height:520px){#quest{display:none}#sheet{height:92%}}

@media (min-width:700px){html{background:#041a22}#app{max-width:520px;margin:0 auto;box-shadow:0 0 0 1px rgba(214,236,230,.12),0 0 60px rgba(0,0,0,.5)}}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div id="hud">
  <div id="top">
    <div id="stats">
      <div class="bar" id="barW"><span class="lbl">水</span><i><b id="bWater"></b></i><em id="tWater"></em></div>
      <div class="bar" id="barF"><span class="lbl">食</span><i><b id="bFood"></b></i><em id="tFood"></em></div>
      <div class="bar" id="barE"><span class="lbl">海</span><i><b id="bEco" style="background:#5fc4d8"></b></i><em id="tEco"></em></div>
    </div>
    <div id="res"></div>
    <nav id="menu">
      <button data-p="bag">背包</button><button data-p="craft">合成</button><button data-p="tech">科技</button><button data-p="sail">出航</button><button data-p="set">設定</button>
    </nav>
    <div id="quest" class="gh"></div>
  </div>
  <div id="quick"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="btnBuild" class="btn">建造</button>
  <button id="act" hidden></button>
  <div id="buildbar" hidden>
    <div id="tools"></div>
    <div id="binfo"></div>
    <div id="brow"><button class="btn alt" id="bUndo">撤銷</button><button class="btn" id="bDone">完成</button></div>
  </div>
  <div id="sheet" hidden>
    <div id="stabs"></div>
    <div id="sbody"></div>
  </div>
  <div id="modal" hidden><div id="mbox"></div></div>
  <div id="toasts"></div>
</div>
</div>

 for(const m of JOBS){const n=Math.min(m.goal,m.progress(j)),done=n>=m.goal,claimed=j.claimed.includes(m.id);h+=`<div class="card"><div class="row" style="border:0;padding:0"><div class="m"><b>${m.n}</b><span>${m.d}</span></div><span class="${claimed?'ok':done?'ok':'note'}">${claimed?'已領取':n+'/'+m.goal}</span></div><div style="height:6px;background:rgba(214,236,230,.14);border-radius:99px;overflow:hidden;margin:8px 0"><div style="height:100%;width:${Math.min(100,n/m.goal*100)}%;background:var(--good)"></div></div><p class="note">獎勵：${mapStr(m.reward)}</p><button class="btn ${done&&!claimed?'':'alt'}" data-a="job" data-id="${m.id}" ${!done||claimed?'disabled':''}>${claimed?'今日已領取':done?'領取獎勵':'委託進行中'}</button></div>`}
 h+='<p class="note">每日委託依裝置當地日期更新。跨日後會產生新進度，不會重置你的基地、圖鑑或科技。</p>';return h}
function claimJob(id){ensureJobs();const m=JOBS.find(x=>x.id===id),j=S.jobs;if(!m||j.claimed.includes(id)||m.progress(j)<m.goal)return false;if(!grantBundle(m.reward)){toast('容量不足：整理背包或倉庫後再領取');return false}j.claimed.push(id);S.rep=(S.rep||0)+1;save();toast('委託完成：'+m.n+'，航海聲望 +1');beep(760,.18);vib('mid');return true}

 h+='</div><p class="note">提示：稀有物資仍需要精準瞄準；圖鑑記錄不會自動把物品轉換成材料以外的額外背包物品。</p>';return h;

/* grant an item to inventory; returns false if full */
function grant(id,source){const d=IT[id];let ok;
 if(id==='crate')return openCrate(source);
 // Converted debris is atomic: never consume the source if its full material yield cannot fit.
 if(d.to){ok=grantBundle({[d.to]:d.q})}
 else ok=give(id,1)>0;
 if(!ok)return false;
 const logChanged=recordSalvage(id);S.picks++;if(d.eco)S.eco=Math.min(100,S.eco+d.eco*(S.tech.c1?1.2:.6));
 if(logChanged)save();
 return true}
function openCrate(source){
 // Roll the reward only once per physical crate. If capacity is insufficient, the same loot stays on it.
 let loot=source&&source.loot;
 if(!loot){loot={};const m=['wood','plastic','metal','cloth','elec'];for(let i=0;i<3;i++){const k=pick(m);loot[k]=(loot[k]||0)+2+Math.floor(Math.random()*4)}
  if(Math.random()<.4)loot.module=1;if(Math.random()<.4)loot.sample=1;if(Math.random()<.15)loot.relic=1;
  if(source)source.loot=loot;
 }
 if(!grantBundle(loot)){toast('背包與倉庫空間不足，貨箱未開啟；獎勵已保留');return false}
 if(source)delete source.loot;
 const logChanged=recordSalvage('crate');S.picks++;if(logChanged)save();toast('貨箱：'+mapStr(loot));vib('rare');beep(880,.3);return true}
function collect(it,sw){if(!grant(it.id,it)){toast('背包已滿：先存入倉庫或拆解雜物');it.st=0;it.vx=-30;it.x+=24;it.dl=1;return false}
 if(sw)S.swipes++;const d=IT[it.id];
 W.fx.push({k:'txt',x:it.x,y:it.y,t:.9,s:'+'+(d.to?d.q+' '+nameOf(d.to):d.n),c:d.rare?'#f0d060':'#d6ece6'});
 vib(d.rare?'rare':'light');beep(d.rare?900:600,.08);return true}

function cast(wx,wy){if(W.cd>0)return;const weak=S.w<=0||S.f<=0;W.cd=weak?1.1:.55;const p=W.p;
 let dx=wx-p.x,dy=wy-p.y,d=Math.hypot(dx,dy);if(d>330){wx=p.x+dx/d*330;wy=p.y+dy/d*330;d=330}
 if(d>8){p.dx=dx/d;p.dy=dy/d}
 W.hook={x:wx,y:wy,t:.35};const R=44+10*S.hook;let n=0;
 for(const it of W.items){if(it.st)continue;const r=IT[it.id].rare?18+3*S.hook:R;if(Math.hypot(it.x-wx,it.y-wy)<=r){it.st=1;it.dl=.18;n++}}
 W.fx.push({k:'ring',x:wx,y:wy,r:R,t:.45});beep(n?420:260,.1)}
function swipe(sx,sy){const [wx,wy]=s2w(sx,sy);for(const it of W.items){if(it.st||it.dl>0)continue;if(Math.hypot(it.x-wx,it.y-wy)<26&&nearRaft(it.x,it.y)){if(collect(it,true))it.gone=1}}W.items=W.items.filter(i=>!i.gone)}

function walkable(x,y){const r=9;for(const [a,b] of [[-r,-r],[r,-r],[-r,r],[r,r]]){const t=tile(Math.round((x+a)/T),Math.round((y+b)/T));if(!t||t.o)return false}return true}
function fixPlayer(){const p=W.p;if(walkable(p.x,p.y))return;let best=null,bd=1e9;for(const k in S.grid){if(S.grid[k].o)continue;const [x,y]=k.split(',').map(Number);const d=Math.hypot(x*T-p.x,y*T-p.y);if(d<bd){bd=d;best=[x*T,y*T]}}if(best){p.x=best[0];p.y=best[1]}}
function findNear(){let best=null,bd=1e9;const p=W.p;eachObj((o,x,y,k)=>{const d=Math.hypot(x*T-p.x,y*T-p.y);if(d<T*1.5&&d<bd){bd=d;best={k,o,x,y}}});return best}
function getAct(){const n=W.near;let a=null;
 if(n){const o=n.o;switch(o.t){
  case 'chest':a={l:'開啟',s:'倉庫',f:()=>openSheet('bag')};break;
  case 'net':{const c=sum(o.buf||{});if(c)a={l:'收網',s:c+' 件',f:()=>{for(const id of Object.keys(o.buf||{})){const count=o.buf[id]||0;for(let i=0;i<count;i++){if(!grant(id)){toast('背包或倉庫空間不足，剩餘物資保留在網中');return}o.buf[id]--}if(o.buf[id]<=0)delete o.buf[id]}toast('已收網');vib('mid');beep(560,.1)}};break}
  case 'rain':if((o.v||0)>=1)a={l:'取水',s:Math.floor(o.v)+' 份',f:()=>{const k=Math.floor(o.v);const got=give('water',k);o.v-=got;if(got){S.drinks++;toast('取得淨水 ×'+got);beep(500,.1);vib('light')}else toast('背包已滿')}};break;
  case 'pur':a=(o.cd||0)>0?{l:'取水',s:Math.ceil(o.cd)+' 秒',f:()=>toast('淨水器還在運作')}:{l:'取水',s:'海水→淨水',f:()=>{const k=S.tech.s2?4:2;const got=give('water',k);if(got){o.cd=15;S.drinks++;toast('取得淨水 ×'+got);beep(500,.1);vib('light')}else toast('背包已滿')}};break;
  case 'rod':if((o.fish||0)>=1)a={l:'收魚',s:Math.floor(o.fish)+' 條',f:()=>{const k=Math.floor(o.fish);const got=give('fish',k);o.fish-=got;if(got){toast('收到魚 ×'+got);vib('light');beep(620,.1)}else toast('背包已滿')}};break;
  case 'stove':a={l:'烹飪',s:'爐灶',f:()=>openSheet('craft')};break;
  case 'bench':a={l:'製作',s:'工作台',f:()=>openSheet('craft')};break;
  case 'furn':a={l:'熔煉',s:'熔爐',f:()=>openSheet('craft')};break;
  case 'sail':a={l:'出航',s:'探索',f:()=>openSheet('sail')};break;
  case 'plant':if(o.g==null)a={l:'種植',s:'種子 ×'+has('seed'),f:()=>{if(!pay({seed:1})){toast('需要種子（拆解椰子可得）');return}o.g=0;toast('已種下種子');beep(480,.1)}};else if(o.g>=90){a={l:'收成',s:'馬鈴薯',f:()=>{const free=room()+sroom();if(free<3){toast('容量不足：先整理背包或倉庫，再收成');return}const seedYield=free>=4&&Math.random()<.5?1:0;const reward={potato:3};if(seedYield)reward.seed=1;if(!grantBundle(reward)){toast('容量不足：先整理背包或倉庫，再收成');return}o.g=null;toast('收成馬鈴薯 ×3'+(seedYield?'，種子 ×1':''));vib('mid');beep(700,.12)}}}break;
  case 'bed':a={l:'休息',s:W.bedCd>0?Math.ceil(W.bedCd)+' 秒':'補充並存檔',f:()=>{if(W.bedCd>0){toast('剛休息過');return}W.bedCd=40;S.w=Math.min(100,S.w+10);S.f=Math.min(100,S.f+10);tickM(30,1);save();toast('休息完成，進度已存檔');vib('mid');beep(400,.3)}};break;
 }}
 if(!a){const p=W.p;if(isEdge(Math.round(p.x/T),Math.round(p.y/T)))a={l:'拋鉤',s:'朝海面',f:()=>cast(p.x+p.dx*150,p.y+p.dy*150)}}
 return a}

/* ---------- update ---------- */
function update(dt){
 W.t+=dt;W.cd=Math.max(0,W.cd-dt);W.bedCd=Math.max(0,W.bedCd-dt);W.cb+=((W.build?1:0)-W.cb)*Math.min(1,dt*8);W.curT-=dt;W.curBoost=Math.max(0,W.curBoost-dt);W.buoyCd=Math.max(0,W.buoyCd-dt);W.curUiT-=dt;if(W.curUiT<=0){W.curUiT=1;if(SP==='log'&&!$('#sheet').hidden)renderSheet(false)}if(W.curT<=0){W.cur=(W.cur+1+Math.floor(Math.random()*(CURRENTS.length-1)))%CURRENTS.length;W.curT=48+Math.random()*22;const c=CURRENTS[W.cur];toast('海流轉變：'+c.n+'｜'+c.desc);if(SP==='log'&&!$('#sheet').hidden)renderSheet(false)}
 const p=W.p;let ix=W.joy.x+(W.keys.ArrowRight||W.keys.d?1:0)-(W.keys.ArrowLeft||W.keys.a?1:0),iy=W.joy.y+(W.keys.ArrowDown||W.keys.s?1:0)-(W.keys.ArrowUp||W.keys.w?1:0);const m=Math.hypot(ix,iy);
 W.mv=m>.2&&!W.build?1:0;
 if(m>.2&&!W.build){const k=Math.min(1,m);const vx=ix/m*95*k*dt,vy=iy/m*95*k*dt;p.dx=ix/m;p.dy=iy/m;if(walkable(p.x+vx,p.y))p.x+=vx;if(walkable(p.x,p.y+vy))p.y+=vy}
 // Exploration choices are intentionally untimed; pause survival drain until the trip ends.
 if(!TR)drain(dt);tickM(dt,W.rain>0?3:1);W.rain=Math.max(0,W.rain-dt);
 W.sp-=dt;if(W.sp<=0){W.sp=1.3+Math.random()*.8;if(W.items.filter(i=>!i.st).length<16)spawn()}
 const lim=-(OX/SC)-50;
 for(const it of W.items){
  if(it.dl>0){it.dl-=dt;if(it.st===1)continue}
  if(it.st===1){const dx=p.x-it.x,dy=p.y-it.y,d=Math.hypot(dx,dy);if(d<14){if(collect(it))it.gone=1;continue}it.x+=dx/d*300*dt;it.y+=dy/d*300*dt;continue}
  const cur=CURRENTS[W.cur||0];it.x+=it.vx*dt;it.y+=(it.vy||0)*dt+Math.sin(W.t*.8+it.ph)*6*dt;
  if(tile(Math.round(it.x/T),Math.round(it.y/T)))it.y+=(it.y>=0?1:-1)*70*dt;
  if(it.x<lim)it.gone=1}
 W.items=W.items.filter(i=>!i.gone);
 if(W.merch){const m=W.merch;m.x+=(m.tx-m.x)*Math.min(1,dt*.8);m.t-=dt;if(m.t<=0){W.merch=null;toast('漂流商人離開了')}}
 W.evT-=dt;if(W.evT<=0){W.evT=70+Math.random()*50;driftEvent()}
 W.near=findNear();
 for(const f of W.fx)f.t-=dt;W.fx=W.fx.filter(f=>f.t>0);
 if(W.hook){W.hook.t-=dt;if(W.hook.t<=0)W.hook=null}
 W.warn-=dt;if(W.warn<=0&&(S.w<20||S.f<20)){W.warn=45;toast(S.w<20?'水分偏低：去淨水器取水':'飽食偏低：吃點東西')}
 W.hudT-=dt;if(W.hudT<=0){W.hudT=.25;updHUD()}
 W.saveT+=dt;if(W.saveT>6){W.saveT=0;save()}
 if(TUT[S.q]&&TUT[S.q].ok()){S.q++;toast('任務完成');vib('mid');beep(780,.2);updQuest()}
}

/* ---------- render ---------- */
function drawItem(it){const d=IT[it.id];g.save();g.translate(it.x,it.y+Math.sin(W.t*2+it.ph)*1.5);g.rotate(it.rot+Math.sin(W.t+it.ph)*.15);g.scale(1.35,1.35);
 if(d.rare){g.globalAlpha=.35+.25*Math.sin(W.t*4);g.fillStyle=d.c;g.beginPath();g.arc(0,0,S.tech.e2?17:12,0,7);g.fill();g.globalAlpha=1}
 const im=ok('i_'+it.id);if(im){const s=(d.rare?48:42)/1.35/Math.max(im.naturalWidth,im.naturalHeight);g.drawImage(im,-im.naturalWidth*s/2,-im.naturalHeight*s/2,im.naturalWidth*s,im.naturalHeight*s);g.restore();return}
 g.fillStyle=d.c;g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1;

  case 'craft':doCraft(RC.find(r=>r.id===id));break;
  case 'fav':{const i=S.fav.indexOf(id);if(i>=0)S.fav.splice(i,1);else{if(S.fav.length>=3)S.fav.shift();S.fav.push(id)}renderQuick();break}
  case 'tech':{const t=TH.find(x=>x.id===id);const miss=(t.req||[]).some(r=>!S.tech[r]);if(miss){toast('需先研究前置科技');break}if(t.eco&&S.eco<t.eco){toast('生態度不足');break}if(!pay(t.cost)){toast('材料不足');break}S.tech[id]=1;toast('研究完成：'+t.n);vib('rare');beep(840,.25);break}
  case 'reg':selReg=id;break;
  case 'steel':useSteel=!useSteel;break;
  case 'go':startTrip();return;
  case 's_vib':S.set.vib^=1;break;
  case 's_snd':S.set.snd^=1;break;
  case 's_hand':S.set.hand=S.set.hand==='r'?'l':'r';applySet();break;
  case 's_bs':S.set.bs=parseFloat(id);applySet();break;
  case 'reset':if(!resetArm){resetArm=true}else{
   try{localStorage.removeItem(KEY)}catch(_){}
   S=defaults();ensureJobs();TR=null;W.mv=0;W.items=[];W.fx=[];W.p={x:0,y:0,dx:0,dy:1};W.hook=null;W.cd=0;W.t=0;W.cb=0;W.build=false;W.rain=0;W.joy={x:0,y:0};W.keys={};W.sp=0;W.evT=45;W.near=null;W.merch=null;W.bedCd=0;W.warn=0;W.hudT=0;W.saveT=0;W.cur=0;W.curT=48;W.curBoost=0;W.buoyCd=0;W.curUiT=1;
   B.tool='floor';B.gh=null;B.undo=[];B.down=false;B.stroke=[];B.hold=null;B.warned=false;B.lastSy=0;useSteel=false;selReg='wreck';resetArm=false;
   $('#app').classList.remove('mode-build');$('#buildbar').hidden=true;closeSheet();updQuest();renderQuick();applySet();updHUD();save();welcome();return
  }break;
 }
 renderSheet();updHUD();renderQuick()});

/* ---------- HUD ---------- */
function updHUD(){
 $('#bWater').style.width=S.w+'%';$('#bFood').style.width=S.f+'%';$('#bEco').style.width=S.eco+'%';
 $('#tWater').textContent=Math.round(S.w);$('#tFood').textContent=Math.round(S.f);$('#tEco').textContent=Math.floor(S.eco);
 $('#barW').classList.toggle('low',S.w<20);$('#barF').classList.toggle('low',S.f<20);
 $('#res').innerHTML=['wood','plastic','metal','cloth','elec'].map(k=>`<span class="chip" title="${nameOf(k)}">${ico(k,20)}${has(k)}</span>`).join('')+`<span class="chip"><small>背包</small>${sum(S.bag)}/${bagCap()}</span>`;
 const a=W.build?null:getAct();const ab=$('#act');if(a){ab.hidden=false;ab.innerHTML=a.l+'<small>'+a.s+'</small>'}else ab.hidden=true;
 document.querySelectorAll('#quick button').forEach(b=>{const r=RC.find(x=>x.id===b.dataset.id);b.classList.toggle('dim',!can(r.cost)||(r.st&&!cntB(r.st)))});
 const tq=TUT[S.q];if(tq){const n=tq.n?'（'+tq.n()+'）':'';$('#quest').innerHTML=`<b>任務 ${S.q+1}/${TUT.length}</b>　${tq.t}${n}`}}
function updQuest(){const tq=TUT[S.q];$('#quest').innerHTML=tq?`<b>任務 ${S.q+1}/${TUT.length}</b>　${tq.t}`:'<b>基地已站穩</b>　繼續擴建、研究科技，前往沉船區與淹沒都市。'}
function renderQuick(){$('#quick').innerHTML=S.fav.map(id=>{const r=RC.find(x=>x.id===id);return `<button data-id="${id}" aria-label="快速製作${r.n}">${r.n}</button>`}).join('')}
$('#quick').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;doCraft(RC.find(r=>r.id===b.dataset.id));updHUD()});
$('#menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.p;if(SP===p&&!$('#sheet').hidden)closeSheet();else openSheet(p)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!M.lock)closeModal()});
function applySet(){document.documentElement.style.setProperty('--bs',S.set.bs);$('#hud').classList.toggle('lefty',S.set.hand==='l')}
const M={lock:false};

/* ---------- events ---------- */
function driftEvent(){const e=pick(DRIFT_EV);
 if(e==='merchant'){if(W.merch)return;const off=[{g:{plastic:6},t:{elec:2}},{g:{wood:8},t:{metal:3}},{g:{fish:3},t:{sample:1}},{g:{metal:6},t:{cloth:6}},{g:{cloth:6},t:{wood:8}},{g:{elec:4},t:{module:1}}].sort(()=>Math.random()-.5).slice(0,3);
  W.merch={x:(VW-OX)/SC+50,y:-200,tx:140,t:50,off};toast('漂流商人靠近了，點一下商船交易')}
 else if(e==='school'){toast('魚群經過木筏');for(let i=0;i<8;i++)setTimeout(()=>{const ys=200+Math.random()*(VH-420);W.items.push({id:'fish',x:(VW-OX)/SC+20+i*14,y:(ys-OY)/SC,vx:-34,ph:i,st:0,rot:0,dl:0})},i*350)}
 else if(e==='rain'){W.rain=40;toast('下雨了：雨水收集器加速運作')}
 else if(e==='crate'){spawn('crate');toast('海面漂來一只貨箱，要瞄準才抓得到')}
 else if(e==='sos'){M.lock=false;modal(`<h2>求救訊號</h2><p>無線電傳來斷斷續續的聲音，有人困在遠處的浮台上。</p><button class="btn" data-ev="sos1">送過去一瓶淨水（消耗淨水 ×1）</button><button class="btn alt" data-ev="sos0">無視訊號</button>`)}}
$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-ev],[data-tr],[data-mx]');if(!b)return;
 if(b.dataset.ev==='sos1'){
  const reward={elec:4,cloth:3};
  if(!can({water:1})){toast('你沒有淨水可以送');closeModal()}
  else if(totalItems(reward)>room()+sroom()+1){toast('容量不足：先整理背包或倉庫，再回應求救訊號')}
  else{
   const bagBefore={...S.bag},storeBefore={...S.store};
   if(!pay({water:1})||!grantBundle(reward)){S.bag=bagBefore;S.store=storeBefore;toast('交易未完成，淨水已退還')}
   else{modal(`<h2>求救訊號</h2><p>對方道謝後留下一些零件與布料。</p><p class="ok">${mapStr(reward)}</p><button class="btn" data-ev="x">關閉</button>`);beep(760,.2);vib('mid')}
  }
 }
 else if(b.dataset.ev==='sos0'||b.dataset.ev==='x'||b.dataset.ev==='ok'){closeModal();if(b.dataset.ev==='x'&&TR&&TR.resumePending){TR.resumePending=false;showStop()}}
 else if(b.dataset.mx!=null){
  const o=W.merch&&W.merch.off[+b.dataset.mx];if(!o)return;
  if(!can(o.g)){toast('材料不足')}
  else if(totalItems(o.t)>room()+sroom()+totalItems(o.g)){toast('容量不足：先整理背包或倉庫，再交易')}
  else{
   const bagBefore={...S.bag},storeBefore={...S.store};
   if(pay(o.g)&&grantBundle(o.t)){toast('交易完成');beep(700,.15);vib('mid');openMerchant()}
   else{S.bag=bagBefore;S.store=storeBefore;toast('交易未完成，物資已退還')}
  }
 }
 else if(b.dataset.tr)tripStep(b.dataset.tr)});
function openMerchant(){if(!W.merch)return;M.lock=false;modal(`<h2>漂流商人</h2><p>船上堆滿雜物，願意用材料交換。</p>${W.merch.off.map((o,i)=>`<button class="btn" data-mx="${i}">${mapStr(o.g)} → ${mapStr(o.t)}${can(o.g)?'':'（材料不足）'}</button>`).join('')}<button class="btn alt" data-ev="x">離開</button>`)}

/* ---------- trips ---------- */
let TR=null;
function startTrip(){const r=REG[selReg];
 if(!cntB('sail')){toast('需要先建造船帆');return}
 if(!S.tech[r.need]){toast('需研究「'+r.tn+'」');return}
 if(has('water')<2||foodCnt()<2){toast('補給不足：淨水 ×2、食物 ×2');return}
 const bagBefore={...S.bag},storeBefore={...S.store};
 if(!pay({water:2})||!takeFood(2)){S.bag=bagBefore;S.store=storeBefore;toast('補給扣除未完成，未開始出航');return}
 let tool=false;if(useSteel&&has('steel')>0){if(!pay({steel:1})){S.bag=bagBefore;S.store=storeBefore;toast('工具準備失敗，未開始出航');return}tool=true}
 TR={r:selReg,tool,stops:STOPS[selReg].slice().sort(()=>Math.random()-.5),i:0,loot:{}};S.trip=TR;save();closeSheet();showStop()}
function showTripReturn(){
 if(!TR)return;
 const l=TR.loot||{};M.lock=true;
 modal(`<h2>${REG[TR.r].n}　探索完成</h2><p>${Object.keys(l).length?'本次探索已取得：'+mapStr(l):'這趟沒有帶回東西，但你記住了航線。'}</p><p class="note">物資已在探索過程中存入背包或倉庫，不會在返航時再次發放。</p><button class="btn" data-tr="end">返航</button>`)
}
function showStop(){
 if(!TR)return;
 if(!REG[TR.r]||!Array.isArray(TR.stops)||!Number.isInteger(TR.i)||TR.i<0||TR.i>TR.stops.length){TR=null;S.trip=null;M.lock=false;save();toast('探索存檔無法辨識，已安全返回木筏');return}
 if(TR.i>=TR.stops.length){showTripReturn();return}
 const s=TR.stops[TR.i];if(!s||!Array.isArray(s.o)){TR=null;S.trip=null;M.lock=false;save();toast('探索站點資料異常，已安全返回木筏');return}
 M.lock=true;
 modal(`<h2>${REG[TR.r].n}　${TR.i+1}/${TR.stops.length}</h2><p><b>${s.t}</b></p><p class="note">${s.s}</p>${s.o.map((o,i)=>{const ok=!o.need||can(o.need)||(TR.tool&&o.need.steel&&Object.keys(o.need).length===1);return `<button class="btn ${ok?'':'alt'}" data-tr="${i}">${o.t}${o.need?`（需要 ${mapStr(o.need)}${ok?'':'，不足'}）`:''}</button>`}).join('')}`)
}
function tripStep(i){
 if(!TR)return;
 if(i==='next'){showStop();return}
 if(i==='end'){
  S.trips++;const l=plainObject(TR.loot)?TR.loot:{};TR=null;S.trip=null;M.lock=false;save();
  modal(`<h2>平安返航</h2><p>${Object.keys(l).length?'帶回：'+mapStr(l):'這趟沒有帶回東西，但你記住了航線。'}</p><p class="note">物資已存入背包或倉庫。</p><button class="btn" data-ev="x">回到木筏</button>`);return;
 }
 const s=TR.stops[TR.i],o=s&&s.o[+i];if(!o)return;
 const need={...(o.need||{})};if(TR.tool&&Object.keys(need).length===1&&need.steel)delete need.steel;
 if(!can(need)){toast('材料不足');return}
 const scaleGain=gain=>{const out={};for(const k in gain)out[k]=TR.tool&&NM[k]&&NM[k][1]==='mat'?Math.ceil(gain[k]*1.5):gain[k];return out};
 const good=scaleGain(o.gain||{}),bad=scaleGain(o.fg||{});
 const possible=Math.max(totalItems(good),totalItems(bad));
 const canLose=!!(o.lose&&can(o.lose));
 const capacity=room()+sroom()+totalItems(need)+(canLose?totalItems(o.lose):0);
 // Check capacity before rolling the random outcome, so a full inventory cannot be used to reroll events.
 if(possible>capacity){toast('容量不足：先整理背包或倉庫，再選擇這個行動');return}
 const success=o.p==null||Math.random()<=Math.min(1,o.p+(TR.tool?.2:0));
 const text=success?o.r:o.f;
 const g2=success?good:bad;
 const lose=(!success&&canLose)?o.lose:{};
 const bagBefore={...S.bag},storeBefore={...S.store};
 if(Object.keys(need).length&&!pay(need)){toast('材料不足');return}
 if(Object.keys(lose).length&&!pay(lose)){S.bag=bagBefore;S.store=storeBefore;toast('材料不足，這次行動已取消');return}
 if(!grantBundle(g2)){S.bag=bagBefore;S.store=storeBefore;toast('容量不足：行動已取消，請先整理物資');return}
 if(o.eco&&success)S.eco=Math.min(100,S.eco+o.eco);
 for(const k in g2)TR.loot[k]=(TR.loot[k]||0)+g2[k];
 beep(Object.keys(g2).length?720:300,.15);vib(Object.keys(g2).some(k=>IT[k]&&IT[k].rare)?'rare':'light');
 TR.i++;S.trip=TR;save();const last=TR.i>=TR.stops.length;
 modal(`<h2>${s.t}</h2><p>${text||'你完成了這次行動。'}</p>${Object.keys(g2).length?`<p class="ok">獲得：${mapStr(g2)}</p>`:''}<button class="btn" data-tr="${last?'end':'next'}">${last?'返航':'繼續前進'}</button>`);
}
/* ---------- welcome / return ---------- */
function welcome(){M.lock=false;modal(`<h2>漂流紀元：最後的方舟</h2><p>洪水淹沒了陸地，你只剩一塊木筏。打撈漂流物、淨化海水、擴建甲板，把它變成自給自足的方舟。</p><p class="note">點擊海面拋鉤，磁吸範圍內的物資一次吸取；靠近木筏時用手指滑過漂流物直接拾取。左下搖桿移動，右下按鈕會隨靠近的設施改變。</p><button class="btn" data-ev="x">開始打撈</button>`)}
function showReturn(r){const h=Math.floor(r.el/3600),m=Math.floor(r.el%3600/60);const parts=[];
 if(r.nets)parts.push(`攔截網（${r.nets} 張）收集：${Object.keys(r.got).length?mapStr(r.got):'網子已滿或沒有新收穫'}`);if(r.fish>0)parts.push('魚竿架累積魚 ×'+r.fish);if(r.water>0)parts.push('雨水收集器累積淨水 ×'+r.water);
 M.lock=false;modal(`<h2>歡迎回來</h2><p class="note">離開了 ${h?h+' 小時 ':''}${m} 分鐘，木筏平安無事。水分與飽食只降到安全下限。</p>${parts.map(p=>`<p>${p}</p>`).join('')||'<p>基地靜靜漂著。蓋一張攔截網，離線時也能累積物資。</p>'}<p class="note">到設施旁按「收網」「收魚」「取水」領取。</p><button class="btn" data-ev="x">繼續</button>`)}

/* ---------- boot ---------- */
(function boot(){
 const had=load();ensureJobs();resize();addEventListener('resize',resize);applySet();
 // S.t is the most recent save time; offlineAt separately records when the app actually went into the background.
 if(had){
  const stamp=Number(S.offlineAt)||0;
  const el=stamp>0?Math.max(0,(Date.now()-stamp)/1000):Math.max(0,(Date.now()-S.t)/1000);
  if(el>60){const result=offline(el);S.offlineAt=0;save();showReturn(result)}
  else if(stamp>0){S.offlineAt=0;save()}
  if(S.trip){TR=S.trip;if($('#modal').hidden)showStop();else TR.resumePending=true}
 }else welcome();
 fixPlayer();updQuest();renderQuick();updHUD();
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(!S.offlineAt)S.offlineAt=Date.now();save()}
  else{
   const stamp=Number(S.offlineAt)||0;
   if(stamp>0){
    const el=Math.max(0,(Date.now()-stamp)/1000);
    S.offlineAt=0;
    if(el>60){const result=offline(el);save();if($('#modal').hidden)showReturn(result)}else save();
   }else save();
  }
 });
 addEventListener('pagehide',()=>{if(!S.offlineAt)S.offlineAt=Date.now();save()});
 let last=performance.now();
 function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){update(dt);render()}requestAnimationFrame(loop)}
 requestAnimationFrame(loop);
})();


</script>
