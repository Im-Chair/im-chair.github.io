<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="霓虹彈幕">
<meta name="theme-color" content="#07060d">
<title>霓虹彈幕狂想曲</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 版面：直式單畫面。上方工具列、中間 3:5 遊戲畫面、觸控裝置在下方多一排按鈕 */
:root {
  --bg: #07060d;
  --panel: #110f1d;
  --line: #2a2546;
  --fg: #ecebf7;
  --dim: #8f8bb0;
  --cyan: #5ee7ff;
  --pink: #ff4fa3;
  --gold: #facc15;
  --font-display: 'Orbitron', 'IBM Plex Mono', monospace;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-ui: system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg); }
body {
  height: 100%;
  margin: 0;
  box-sizing: border-box;
  background: radial-gradient(ellipse at 50% 0%, #1a1030 0%, var(--bg) 60%);
  color: var(--fg);
  font-family: var(--font-ui);
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bar { display: flex; align-items: center; gap: 6px; flex: none; }
.ib {
  width: 40px; height: 40px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--fg);
  font-size: 17px;
  text-decoration: none;
  cursor: pointer;
  padding: 0;
  font-family: var(--font-ui);
}
.ib.off { color: #555070; }
.ib:focus-visible, .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.brand { flex: 1; min-width: 0; line-height: 1.1; padding-left: 4px; }
.brand b {
  display: block;
  font-family: var(--font-display); font-weight: 900; font-size: 14px; letter-spacing: .12em;
  background: linear-gradient(90deg, var(--cyan), var(--pink) 55%, var(--gold));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand span { font-size: 11px; color: var(--dim); }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#wrap {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid rgba(94, 231, 255, .28);
  box-shadow: 0 0 0 3px rgba(17, 15, 29, .8), 0 0 32px rgba(255, 79, 163, .12);
  background: #05030b;
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.scan {
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
  mix-blend-mode: multiply;
}
/* 觸控按鈕：只有觸控裝置顯示（body.touch） */
#pads { display: none; gap: 10px; flex: none; }
body.touch #pads { display: flex; }
.pad {
  flex: 1; height: 56px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--fg);
  font: 700 13px var(--font-display);
  letter-spacing: .08em;
  touch-action: none;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.pad small { font: 500 11px var(--font-ui); color: var(--dim); letter-spacing: 0; }
#bFocus.on { background: rgba(94, 231, 255, .85); color: #041218; border-color: var(--cyan); }
#bFocus.on small { color: #0c3440; }
#bEmp { border-color: rgba(250, 204, 21, .45); color: #fde68a; }
#bEmp:active, #bEmp.hit { background: rgba(250, 204, 21, .85); color: #1a1302; }

/* 疊在畫面上的選單 */
#ov {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 16px;
  overflow-y: auto;
  text-align: center;
  background: linear-gradient(170deg, rgba(10, 6, 22, .88), rgba(5, 3, 11, .95));
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#ov > .panel { margin: auto 0; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.logo { font-family: var(--font-display); font-weight: 900; line-height: .95; letter-spacing: .08em; }
.logo span { display: block; font-size: clamp(30px, 10vw, 44px); }
.logo span:first-child { color: var(--cyan); text-shadow: 0 0 18px rgba(94,231,255,.55); }
.logo span:last-child { color: var(--pink); text-shadow: 0 0 18px rgba(255,79,163,.55); }
.tag { font-size: 13px; letter-spacing: .3em; color: #d9d3ff; margin-top: -2px; }
.lead { margin: 2px 0 4px; font-size: 12.5px; line-height: 1.6; color: var(--dim); text-wrap: balance; }
.kicker { font-family: var(--font-display); font-size: 11px; letter-spacing: .25em; color: var(--cyan); }
.h { font-family: var(--font-display); font-weight: 900; font-size: clamp(24px, 8vw, 32px); letter-spacing: .08em; margin: 0; }
.h.red { color: #ff5577; text-shadow: 0 0 16px rgba(255, 85, 119, .5); }
.h.cy { color: var(--cyan); text-shadow: 0 0 16px rgba(94, 231, 255, .5); }
.h.gold { color: var(--gold); text-shadow: 0 0 16px rgba(250, 204, 21, .45); }
.menu { display: flex; flex-direction: column; gap: 8px; }
.btn {
  min-height: 46px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--fg);
  font: 700 15px var(--font-ui);
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.btn small { font-weight: 500; font-size: 11.5px; color: var(--dim); }
.btn.pri {
  justify-content: center;
  border: 0;
  color: #0a0612;
  background: linear-gradient(90deg, var(--cyan), #a78bfa 50%, var(--pink));
  box-shadow: 0 0 18px rgba(94, 231, 255, .25);
}
.btn.ghost { background: transparent; justify-content: center; color: var(--dim); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(:disabled):active { transform: scale(.98); }
.rec { font: 500 12px var(--font-num); color: var(--dim); }
.rec b { color: var(--gold); font-weight: 600; }
.tbl { width: 100%; border-collapse: collapse; font: 500 13px var(--font-num); }
.tbl td { padding: 5px 4px; border-bottom: 1px dashed var(--line); }
.tbl td:first-child { text-align: left; color: var(--dim); font-family: var(--font-ui); }
.tbl td:last-child { text-align: right; }
.tbl tr.tot td { border-bottom: 0; color: var(--gold); font-weight: 600; font-size: 15px; }
.help { text-align: left; font-size: 12.5px; line-height: 1.65; color: #cfcbe8; margin: 0; padding-left: 18px; }
.help li { margin-bottom: 4px; }
.help b { color: var(--cyan); font-weight: 600; }
.stg { display: grid; grid-template-columns: 34px 1fr; text-align: left; align-items: center; }
.stg .n { font: 900 18px var(--font-display); color: var(--cyan); }
.stg .t small { display: block; }
.ending { text-align: left; font-size: 13.5px; line-height: 1.85; color: #e3def8; margin: 0; }
.ending p { margin: 0 0 8px; }
.ending .q { color: var(--cyan); }

/* 夜鴉的通訊視窗：整個畫面都可以點，框在下方 */
#dlg { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; cursor: pointer; }
.dbox {
  position: relative;
  display: grid; grid-template-columns: 48px 1fr; gap: 10px;
  padding: 12px 12px 14px;
  border-radius: 12px;
  background: linear-gradient(160deg, rgba(14, 10, 30, .94), rgba(6, 4, 14, .96));
  border: 1px solid var(--who, #c084fc);
  box-shadow: 0 0 18px color-mix(in srgb, var(--who, #c084fc) 30%, transparent);
  min-height: 92px;
}
.ava {
  width: 48px; height: 48px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font: 900 20px var(--font-ui);
  color: var(--who, #c084fc);
  border: 1px solid var(--who, #c084fc);
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px);
}
.who { font: 700 12px var(--font-display); letter-spacing: .12em; color: var(--who, #c084fc); margin-bottom: 4px; }
.who small { font-family: var(--font-ui); letter-spacing: 0; color: var(--dim); margin-left: 6px; font-weight: 500; }
.dtxt { font-size: 14px; line-height: 1.6; min-height: 44px; }
.dnext { position: absolute; right: 10px; bottom: 6px; font: 500 10px var(--font-display); color: var(--dim); letter-spacing: .1em; }
#dlgSkip {
  position: absolute; top: 12px; right: 12px;
  font: 600 12px var(--font-ui); color: var(--dim);
  background: rgba(10, 8, 20, .8); border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; cursor: pointer;
}
@media (max-height: 640px) {
  #app { gap: 6px; }
  .ib { width: 36px; height: 36px; }
  .pad { height: 48px; }
}
@media (max-width: 360px) {
  body { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .brand span { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <a class="ib" href="../" aria-label="回首頁">🏠</a>
    <div class="brand"><b>NEON DANMAKU</b><span>霓虹彈幕狂想曲</span></div>
    <button class="ib" id="bBgm" type="button" aria-label="背景音樂開關">♪</button>
    <button class="ib" id="bSfx" type="button" aria-label="音效開關">🔊</button>
    <button class="ib" id="bPause" type="button" aria-label="暫停">⏸</button>
  </div>
  <div id="stage">
    <div id="wrap">
      <canvas id="cv" aria-label="遊戲畫面"></canvas>
      <div class="scan"></div>
      <div id="dlg" hidden>
        <button id="dlgSkip" type="button">跳過 ▸▸</button>
        <div class="dbox" id="dlgBox">
          <div class="ava" id="dlgAva">鴉</div>
          <div>
            <div class="who" id="dlgWho"></div>
            <div class="dtxt" id="dlgTxt"></div>
          </div>
          <div class="dnext">TAP ▸</div>
        </div>
      </div>
      <div id="ov"></div>
    </div>
  </div>
  <div id="pads">
    <button class="pad" id="bFocus" type="button">FOCUS <small>集中</small></button>
    <button class="pad" id="bEmp" type="button">EMP <small id="empN">×3</small></button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 基本設定 ================= */
  var W = 480, H = 800;          // 遊戲邏輯座標（3:5 直式），畫面再依容器縮放
  var STEP = 1000 / 60;          // 固定時間步長：不論螢幕幾 Hz，update 一律每秒 60 次
  var MAX_EB = 900, MAX_PB = 220, MAX_PART = 450, MAX_TXT = 24;
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('wrap'), ov = $('ov');
  var FONT_D = 'Orbitron, "IBM Plex Mono", "PingFang TC", "Microsoft JhengHei", sans-serif';
  var FONT_N = '"IBM Plex Mono", ui-monospace, monospace';
  var FONT_U = 'system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  var rand = Math.random;
  var TAU = Math.PI * 2;
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ================= 存檔（全部包 try/catch：無痕或封鎖網站資料時 localStorage 會丟錯） ================= */
  var STATS_KEY = 'arcade-neon-danmaku-stats';     // { story|endless: { plays, wins, best: { score } } }，分數越大越好
  var PROG_KEY = 'arcade-neon-danmaku-progress';   // { unlocked: 1~5, cleared: 是否通關（解鎖無盡模式） }
  var OPTS_KEY = 'arcade-neon-danmaku-opts';       // { bgm, sfx } 遊戲內的音樂／音效開關
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function loadStats() {
    var st = lsGet(STATS_KEY);
    if (!st || typeof st !== 'object') st = {};
    ['story', 'endless'].forEach(function (m) {
      var s = st[m] && typeof st[m] === 'object' ? st[m] : {};
      s.plays = s.plays | 0; s.wins = s.wins | 0;
      if (!s.best || typeof s.best !== 'object') s.best = {};
      st[m] = s;
    });
    return st;
  }
  var stats = loadStats();
  var prog = (function () {
    var p = lsGet(PROG_KEY) || {};
    return { unlocked: Math.max(1, Math.min(5, p.unlocked | 0)), cleared: !!p.cleared };
  })();
  var opts = (function () {
    var o = lsGet(OPTS_KEY) || {};
    return { bgm: o.bgm === true, sfx: o.sfx !== false };
  })();
  function saveStats() { lsSet(STATS_KEY, stats); }
  function saveProg() { lsSet(PROG_KEY, prog); }
  function bestOf(m) { return (stats[m].best && stats[m].best.score) || 0; }
  function recordBest(m, s) {
    if (s > bestOf(m)) { stats[m].best.score = s; saveStats(); return true; }
    return false;
  }

  /* ================= 音效：WebAudio 即時合成 ================= */
  // 總開關在首頁（localStorage arcade-sound = 'off' 為關），每次出聲前重讀；遊戲內另有 BGM／SFX 開關
  var SFX = (function () {
    var ac = null, noiseBuf = null, lastHit = 0, lastGraze = 0, lastShot = 0;
    function siteOn() { try { return localStorage.getItem('arcade-sound') !== 'off'; } catch (e) { return true; } }
    function ready() {
      try {
        if (!ac) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          ac = new AC();
        }
        if (ac.state === 'suspended') ac.resume();
        return true;
      } catch (e) { return false; }
    }
    function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
    function tone(freq, o, isBgm) {
      o = o || {};
      if (!siteOn() || !(isBgm ? opts.bgm : opts.sfx) || !ready()) return;
      try {
        var t = ac.currentTime + (o.delay || 0), dur = o.dur || 0.06;
        var osc = ac.createOscillator(), gn = ac.createGain();
        osc.type = o.type || 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
        gn.gain.setValueAtTime(o.vol || 0.05, t);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gn); gn.connect(ac.destination);
        osc.start(t); osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    function noise(dur, vol, f0) {
      if (!siteOn() || !opts.sfx || !ready()) return;
      try {
        if (!noiseBuf) { // 白噪音只建一次，重複使用
          noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.6), ac.sampleRate);
          var d = noiseBuf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        var t = ac.currentTime;
        var src = ac.createBufferSource(), fl = ac.createBiquadFilter(), gn = ac.createGain();
        src.buffer = noiseBuf;
        fl.type = 'lowpass';
        fl.frequency.setValueAtTime(f0, t);
        fl.frequency.exponentialRampToValueAtTime(50, t + dur);
        gn.gain.setValueAtTime(vol, t);
        gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.connect(fl); fl.connect(gn); gn.connect(ac.destination);
        src.start(t); src.stop(t + dur + 0.05);
      } catch (e) {}
    }
    return {
      unlock: function () { if (siteOn()) ready(); },
      raw: function (f, o) { tone(f, o, true); },
      shoot: function (focus) {
        var n = now(); if (n - lastShot < 110) return; lastShot = n;
        if (focus) tone(880, { type: 'sine', dur: 0.04, vol: 0.018, slide: 0.5 });
        else tone(620, { dur: 0.05, vol: 0.02, slide: 0.35 });
      },
      hit: function () { var n = now(); if (n - lastHit < 70) return; lastHit = n; tone(230, { type: 'square', dur: 0.03, vol: 0.018, slide: 0.5 }); },
      boom: function (big) { noise(big ? 0.5 : 0.2, big ? 0.28 : 0.12, big ? 420 : 900); },
      graze: function () { var n = now(); if (n - lastGraze < 45) return; lastGraze = n; tone(1300, { type: 'sine', dur: 0.03, vol: 0.05, slide: 1.4 }); },
      item: function () { [523, 659, 784].forEach(function (f, i) { tone(f, { type: 'sine', dur: 0.08, vol: 0.07, delay: i * 0.05 }); }); },
      shield: function () { tone(400, { type: 'sine', dur: 0.16, vol: 0.12, slide: 2.4 }); },
      bomb: function () { noise(0.6, 0.3, 500); tone(150, { type: 'sawtooth', dur: 0.6, vol: 0.14, slide: 0.27 }); },
      warn: function () { [0, 0.32, 0.64].forEach(function (d) { tone(780, { type: 'sawtooth', dur: 0.22, vol: 0.09, slide: 0.55, delay: d }); }); },
      phase: function () { noise(0.4, 0.2, 700); tone(300, { type: 'square', dur: 0.3, vol: 0.06, slide: 2 }); },
      die: function () { noise(0.7, 0.3, 600); tone(440, { type: 'sawtooth', dur: 0.5, vol: 0.09, slide: 0.15 }); },
      blip: function () { tone(980, { type: 'square', dur: 0.025, vol: 0.02 }); },
      clear: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, { dur: 0.12, vol: 0.06, delay: i * 0.08 }); }); },
      over: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, { dur: 0.2, vol: 0.06, delay: i * 0.14 }); }); }
    };
  })();

  // 背景音樂：每關一段合成器循環，頭目戰加速
  var BGM = (function () {
    var SONGS = [
      { ms: 130, bass: [110, 110, 130.81, 110, 146.83, 110, 130.81, 98], lead: [440, 523.25, 659.25, 587.33, 659.25, 783.99, 659.25, 523.25] },
      { ms: 120, bass: [73.42, 73.42, 87.31, 73.42, 98, 73.42, 110, 87.31], lead: [293.66, 349.23, 440, 349.23, 392, 466.16, 440, 392] },
      { ms: 150, bass: [82.41, 82.41, 98, 82.41, 123.47, 110, 98, 73.42], lead: [329.63, 392, 493.88, 440, 392, 329.63, 293.66, 329.63] },
      { ms: 112, bass: [92.5, 92.5, 110, 92.5, 123.47, 92.5, 138.59, 110], lead: [369.99, 440, 554.37, 493.88, 440, 554.37, 659.25, 554.37] },
      { ms: 125, bass: [65.41, 65.41, 77.78, 65.41, 87.31, 98, 77.78, 58.27], lead: [523.25, 622.25, 783.99, 698.46, 622.25, 783.99, 932.33, 783.99] }
    ];
    var timer = null, step = 0, song = 0, fast = false;
    function tick() {
      var s = SONGS[song];
      SFX.raw(s.bass[step % 8], { type: 'sawtooth', dur: 0.11, vol: 0.032 });
      if (step % 2 === 0) SFX.raw(s.lead[(step >> 1) % 8], { type: 'square', dur: 0.08, vol: 0.016 });
      if (fast && step % 4 === 2) SFX.raw(s.lead[(step >> 2) % 8] * 2, { type: 'sine', dur: 0.05, vol: 0.012 });
      step++;
    }
    function stop() { if (timer) clearInterval(timer); timer = null; }
    function play() {
      stop();
      if (!opts.bgm) return;
      timer = setInterval(tick, Math.round(SONGS[song].ms * (fast ? 0.85 : 1)));
    }
    return {
      set: function (i, f) { var ch = song !== i || fast !== !!f; song = i; fast = !!f; if (ch || !timer) play(); },
      play: play,
      stop: stop
    };
  })();

  /* ================= 配色主題（每關一套） ================= */

  function windowShot(cx, cy, half, per, a, s, c) {
    var vx = Math.cos(a) * s, vy = Math.sin(a) * s;
    for (var side = 0; side < 4; side++) for (var i = 0; i < per; i++) {
      var u = -half + 2 * half * i / per, x, y;
      if (side === 0) { x = cx + u; y = cy - half; }

      else if (side === 2) { x = cx - u; y = cy + half; }

  }

        if (P.inv <= 0 && !god) { eBul.splice(i, 1); playerHit(); if (P.dead) return; continue; }
      } else if (!b.g && d2 < gr * gr) {
        b.g = true; score += gm; grazeStage++; grazeTotal++; SFX.graze();
        if (parts.length < MAX_PART) parts.push({ x: P.x + dx * 0.5, y: P.y + dy * 0.5, vx: dx * 0.08, vy: dy * 0.08, s: 2, c: '#e0f2fe', life: 10, max: 10 });
      }
    }
  }

  /* ================= 頭目流程 ================= */
  function spawnBoss(key, isMid) {
    var def = BOSSES[key], ph = def.phases[0];
    boss = { def: def, key: key, mid: isMid, x: W / 2, y: -70, ty: isMid ? 140 : 150, r: def.r, ph: 0,
      hp: ph.hp * hpMul, max: ph.hp * hpMul, t: 0, tl: ph.time * 60, inv: 0, flash: 0, cap: true, enter: true,
      mx: W / 2, my: 150, rot: 0, sa: 0, sn: 0, dead: false };
    if (!isMid) BGM.set(cur.theme, true);
  }
  function updateBoss() {
    var b = boss;
    if (!b) return;
    b.rot += 0.02;
    if (b.flash > 0) b.flash--;
    if (b.enter) {
      b.y += 2.2;
      if (b.y >= b.ty) {
        b.y = b.ty; b.enter = false; b.inv = 50;
        phaseBanner();
        if (!b.mid && mode === 'story' && !retried && cur.intro) {
          showDialog(cur.intro, function () { state = 'playing'; });
        }
      }
      return;
    }
    var ph = b.def.phases[b.ph];
    if (b.inv > 0) {
      b.inv--;
      b.x += (W / 2 - b.x) * 0.04; b.y += (b.ty - b.y) * 0.04;
      return;
    }
    b.t++;
    var m = ph.move;
    if (m === 'sway') { b.x += (W / 2 + Math.sin(b.t * 0.013) * 130 - b.x) * 0.05; b.y += (b.ty - b.y) * 0.05; }
    else if (m === 'drift') {
      if (b.t % 150 === 1) { b.mx = 90 + rand() * (W - 180); b.my = 110 + rand() * 90; }
      b.x += (b.mx - b.x) * 0.03; b.y += (b.my - b.y) * 0.03;
    } else if (m === 'center') { b.x += (W / 2 - b.x) * 0.04; b.y += (b.ty - b.y) * 0.04; }
    ph.fire(b, b.t);
    if (!P.dead && hitTest(b.x, b.y, b.r * 0.75)) playerHit();
    if (b.hp <= 0) endPhase(true);
    else if (b.t >= b.tl) endPhase(false);
  }
  function phaseBanner() {
    var t = boss.def.phases[boss.ph].title;
    if (t) { phaseName = t; phaseT = 150; }
  }
  function endPhase(killed) {
    var b = boss;
    if (killed && b.cap && !b.mid) {
      var pts = 3000 * (stageIdx + 1) * (mode === 'endless' ? loop : 1);
      score += pts; popText(W / 2, 250, 'PHASE BONUS +' + pts.toLocaleString(), '#fde68a', true);
    } else if (!killed) popText(W / 2, 250, 'TIME OUT', '#94a3b8', true);
    cancelBullets(true);
    SFX.phase(); shake(24, 7);
    burst(b.x, b.y, b.def.color, 30);
    b.ph++;
    if (b.ph >= b.def.phases.length) { bossDie(); return; }
    var ph = b.def.phases[b.ph];
    b.hp = b.max = ph.hp * hpMul; b.t = 0; b.tl = ph.time * 60; b.inv = 90; b.cap = true;
    phaseBanner();
  }
  function bossDie() {
    var b = boss;
    b.dead = true;
    SFX.boom(true); shake(45, 12); flash = 14;
    burst(b.x, b.y, b.def.color, 60); burst(b.x, b.y, '#ffffff', 30);
    var pts = (b.mid ? 3000 : 10000) * (stageIdx + 1) * (mode === 'endless' ? loop : 1);
    score += pts; killStage++;
    popText(b.x, b.y, '+' + pts.toLocaleString(), '#ffffff', true);
    dropItem(b.x - 24, b.y, 'P'); dropItem(b.x + 24, b.y, 'B');
    if (!b.mid) {
      dropItem(b.x, b.y - 20, 'S');
      if (P.lives < 3 || mode === 'endless') dropItem(b.x, b.y + 24, 'L');
    }
    var wasMid = b.mid;
    boss = null; phaseT = 0;
    if (wasMid) return;
    clearSeq = 1;
    enemies.forEach(function (e) { if (!e.wait) e.hp = 0; });
    BGM.set(cur.theme, false);
  }

  /* ================= 時間軸 ================= */
  function runTimeline() {
    if (pending) {
      if (pending.phase === 'clear') {
        // 等場上雜兵走光（最多 4 秒）再發警報
        if (--pending.wait <= 0 || enemies.length === 0) {
          pending.phase = 'warn'; warn = pending.mid ? 100 : 150; warnMid = pending.mid; SFX.warn();
          cancelBullets(true);
        }
      } else if (--warn <= 0) {
        spawnBoss(pending.key, pending.mid); pending = null;
      }
      return;
    }
    if (boss || clearSeq) return;
    clock++;
    while (tlPos < tl.length && tl[tlPos][0] <= clock) {
      var ev = tl[tlPos++];
      if (ev[1] === 'mid' || ev[1] === 'boss') {
        var isMid = ev[1] === 'mid';
        pending = { key: isMid ? cur.mid : cur.boss, mid: isMid, phase: 'clear', wait: 240 };
        break;
      }
      spawnWave(ev[1], ev[2], ev[3], ev[4]);
    }
  }
  function genEndless(lp) {
    var F = ['line', 'sweepL', 'sweepR', 'vee', 'rand', 'col', 'line', 'rand'];
    var pool = ['drone', 'drone', 'drone', 'sniper', 'heavy', 'spinner'];
    var out = [], t = 60, gap = Math.max(110, 175 - lp * 10);
    for (var i = 0; i < 16; i++) {
      if (i === 8) { out.push([t, 'mid']); t += 60; continue; }
      var ty = pool[rand() * pool.length | 0], f = F[rand() * F.length | 0], n;
      if (ty === 'heavy' || ty === 'spinner') { f = rand() < 0.5 ? 'stop' : 'line'; n = 1 + (rand() * Math.min(3, 1 + lp / 2) | 0); }
      else n = Math.min(12, 4 + (rand() * (3 + lp) | 0));
      out.push([t, f, ty, n, 0.2 + rand() * 0.6]);
      t += gap;
    }
    out.push([t + 120, 'boss']);
    return out;
  }

  /* ================= 主更新（固定 1/60 秒） ================= */
  function update() {
    tick++;
    if (shakeT > 0) shakeT--;
    if (flash > 0) flash--;
    if (banner > 0) banner--;
    if (phaseT > 0) phaseT--;
    if (empT > 0) empT--;
    updatePlayer();
    runTimeline();
    if (state !== 'playing') return;
    updatePBullets();
    updateEnemies();
    updateBoss();
    if (state !== 'playing') return;
    updateEBullets();
    updateItems();
    updateFx();
    if (clearSeq > 0 && ++clearSeq > 170) { clearSeq = 0; finishStage(); return; }
    if (P.dead > 0 && --P.dead === 0) {
      if (P.lives <= 0) gameOver(); else respawn();
    }
  }

  /* ================= 流程 ================= */
  function resetField() {
    eBul.length = 0; pBul.length = 0; enemies.length = 0; items.length = 0; parts.length = 0; texts.length = 0;
    boss = null; pending = null; clearSeq = 0; warn = 0; phaseT = 0; empT = 0; flash = 0; shakeT = 0;
    bombQueued = false; dragDX = dragDY = 0;
    P.x = W / 2; P.y = H - 110; P.inv = 90; P.dead = 0; P.cd = 0;
  }
  function startRun(m, si) {
    mode = m; runActive = true;
    stats[m].plays++; saveStats();
    score = 0; grazeTotal = 0; loop = 1;
    P.lives = 3; P.bombs = 3; P.shield = false;
    P.lv = m === 'story' ? STAGES[si].lv : 2;
    beginStage(m === 'story' ? si : 0, false);
  }
  function beginStage(si, isRetry) {
    stageIdx = si; retried = isRetry;
    if (mode === 'story') {
      var s = STAGES[si];
      cur = { D: s.D, theme: s.theme, mid: s.mid, boss: s.boss, name: s.name, en: s.en, sub: s.sub, intro: s.intro, tag: 'STAGE ' + (si + 1) };
      tl = s.tl; bulletMul = 1; fireMul = 1; hpMul = 1;
    } else {
      var k = (loop - 1) % 5, base = STAGES[k];
      cur = { D: Math.min(5, 2 + loop), theme: base.theme, mid: MID_ORDER[k], boss: BOSS_ORDER[k], name: base.name, en: base.en, sub: '無盡模式', intro: null, tag: 'LOOP ' + loop };
      tl = genEndless(loop);
      bulletMul = Math.min(1.4, 1 + 0.05 * (loop - 1));
      fireMul = Math.max(0.7, 1 - 0.04 * (loop - 1));
      hpMul = 1 + 0.15 * (loop - 1);
    }
    theme = THEMES[cur.theme];
    tlPos = 0; clock = 0; tick = 0; grazeStage = 0; killStage = 0;
    resetField();
    if (!isRetry) P.bombs = Math.max(P.bombs, 3);
    snapshot = { score: score, lv: P.lv, grazeTotal: grazeTotal };
    banner = 200;
    ovHide();
    BGM.set(cur.theme, false);
    updatePads();
    if (mode === 'story' && !isRetry && STAGES[si].pre) showDialog(STAGES[si].pre, function () { state = 'playing'; });
    else state = 'playing';
  }
  function retryStage() {
    if (mode !== 'story' || !snapshot) return;
    score = snapshot.score; grazeTotal = snapshot.grazeTotal; P.lv = snapshot.lv;
    P.lives = 3; P.bombs = 3; P.shield = false;
    beginStage(stageIdx, true);
  }
  function finishStage() {
    if (mode === 'endless') {
      popText(W / 2, H / 2, 'LOOP ' + loop + ' CLEAR', '#5ee7ff', true);
      loop++;
      beginStage(0, false);
      return;
    }
    var bonus = { lives: P.lives * 5000, bombs: P.bombs * 2000, graze: grazeStage * 10 };
    bonus.total = bonus.lives + bonus.bombs + bonus.graze;
    score += bonus.total;
    lastBonus = bonus;
    SFX.clear();
    if (stageIdx + 2 > prog.unlocked) prog.unlocked = Math.min(5, stageIdx + 2);
    if (stageIdx === 4) prog.cleared = true;
    saveProg();
    var post = STAGES[stageIdx].post;
    showDialog(post, stageIdx < 4 ? showResult : showEnding);
  }
  function nextStage() {
    if (mode !== 'story' || stageIdx >= 4) return;
    beginStage(stageIdx + 1, false);
  }
  function gameOver() {
    state = 'over'; runActive = false;

      '<table class="tbl"><tr><td>分數</td><td>' + score.toLocaleString() + '</td></tr><tr><td>擦彈</td><td>' + grazeTotal + '</td></tr>' +
      '<tr class="tot"><td>' + (nb ? '新紀錄！' : '最高分') + '</td><td>' + bestOf(mode).toLocaleString() + '</td></tr></table><div class="menu">';
    if (mode === 'story') html += '<button class="btn pri" data-act="retry" data-primary>從第 ' + (stageIdx + 1) + ' 關重來</button>';
    else html += '<button class="btn pri" data-act="endless" data-primary>再來一局</button>';
    html += '<button class="btn ghost" data-act="title">回到選單</button></div></div>';

  }
  function showResult() {
    state = 'result';

    ovShow('<div class="panel"><div class="kicker">' + esc(cur.tag) + ' ・ ' + esc(cur.name) + '</div><h2 class="h cy">STAGE CLEAR</h2>' +
      '<table class="tbl"><tr><td>擊破</td><td>' + killStage + '</td></tr><tr><td>擦彈 ' + grazeStage + ' × 10</td><td>+' + b.graze.toLocaleString() + '</td></tr>' +
      '<tr><td>殘機 ' + P.lives + ' × 5,000</td><td>+' + b.lives.toLocaleString() + '</td></tr><tr><td>EMP ' + P.bombs + ' × 2,000</td><td>+' + b.bombs.toLocaleString() + '</td></tr>' +
      '<tr class="tot"><td>總分</td><td>' + score.toLocaleString() + '</td></tr></table>' +
      '<div class="menu"><button class="btn pri" data-act="next" data-primary>前往第 ' + (stageIdx + 2) + ' 關 ・ ' + esc(STAGES[stageIdx + 1].name) + '</button>' +
      '<button class="btn ghost" data-act="title">回到選單（進度已存）</button></div></div>');
  }
  function showEnding() {
    state = 'ending'; runActive = false;

    ovShow('<div class="panel"><div class="kicker">MISSION COMPLETE</div><h2 class="h gold">ENDING</h2><div class="ending">' +
      ENDING.map(function (l) { return '<p>' + l + '</p>'; }).join('') + '</div>' +
      '<table class="tbl"><tr><td>最終分數</td><td>' + score.toLocaleString() + '</td></tr><tr class="tot"><td>' + (nb ? '新紀錄！' : '最高分') + '</td><td>' + bestOf('story').toLocaleString() + '</td></tr></table>' +
      '<p class="lead">無盡模式已解鎖。新霓市的病毒碎片會一波一波回來，看你能撐多久。</p>' +
      '<div class="menu"><button class="btn pri" data-act="endless" data-primary>進入無盡模式</button><button class="btn ghost" data-act="title">回到選單</button></div></div>');
  }
  function toTitle() {
    if (runActive && (state === 'paused' || state === 'result')) recordBest(mode, score);
    runActive = false;

    state = 'title';
    BGM.stop();

  function pause() {

    ovShow('<div class="panel"><h2 class="h cy">PAUSE</h2><p class="lead">' + esc(cur.tag) + ' ・ ' + esc(cur.name) + ' ・ 分數 ' + score.toLocaleString() + '</p><div class="menu">' +
      '<button class="btn pri" data-act="resume" data-primary>繼續</button>' +
      (mode === 'story' ? '<button class="btn" data-act="retry">重來本關</button>' : '') +
      '<button class="btn ghost" data-act="title">回到選單</button></div></div>');
  }
  function resume() {

  }
  function togglePause() { if (state === 'playing') pause(); else if (state === 'paused') resume(); }

  /* ================= 選單畫面 ================= */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ovShow(html) { ov.innerHTML = html; ov.hidden = false; }

  function showTitle() {

      '<div class="menu"><button class="btn pri" data-act="story" data-primary>開始任務</button>' +

  function act(a) {

  /* ================= 通訊視窗（對話） ================= */
  var dlg = null;
  function showDialog(lines, done) {

  }
  function drawLine() {
    var l = dlg.lines[dlg.i], sp = SPEAKERS[l[0]] || { c: '#c084fc', en: l[0], a: l[0].charAt(0) };
    $('dlgBox').style.setProperty('--who', sp.c);
    $('dlgAva').textContent = sp.a;
    $('dlgWho').innerHTML = esc(sp.en) + '<small>' + esc(l[0]) + '</small>';
    $('dlgTxt').textContent = l[1].slice(0, dlg.ch);
  }
  function hideDialog() { dlg = null; $('dlg').hidden = true; }
  function dlgAdvance() {
    if (!dlg) return;
    var l = dlg.lines[dlg.i];
    if (dlg.ch < l[1].length) { dlg.ch = l[1].length; drawLine(); return; }
    SFX.blip();
    dlg.i++; dlg.ch = 0; dlg.acc = 0;
    if (dlg.i >= dlg.lines.length) { var f = dlg.done; hideDialog(); if (f) f(); }
    else drawLine();
  }
  function dlgSkip() { if (!dlg) return; var f = dlg.done; hideDialog(); if (f) f(); }
  function typeTick(dt) {
    var l = dlg.lines[dlg.i];
    if (dlg.ch >= l[1].length) return;
    dlg.acc += dt;
    var n = Math.floor(dlg.acc / 28);
    if (n > 0) { dlg.acc -= n * 28; dlg.ch = Math.min(l[1].length, dlg.ch + n); $('dlgTxt').textContent = l[1].slice(0, dlg.ch); }
  }
  $('dlg').addEventListener('pointerdown', function (e) {
    if (e.target && e.target.id === 'dlgSkip') return;
    if (e.pointerType === 'touch') setTouch(true);

  });
  $('dlgSkip').addEventListener('click', function (e) { e.stopPropagation(); SFX.blip(); dlgSkip(); });

  /* ================= 輸入：鍵盤 ================= */
  var GAME_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Space: 1 };
  document.addEventListener('keydown', function (e) {
    var k = e.code;
    if (GAME_KEYS[k]) e.preventDefault();     // 空白鍵與方向鍵不捲動頁面
    keys[k] = true;
    if (e.repeat) return;                     // 按住不連發（EMP、暫停、對話）
    if (k === 'KeyP' || k === 'Escape') { togglePause(); return; }
    if (state === 'dialog') { if (k === 'Space' || k === 'Enter' || k === 'KeyZ') { e.preventDefault(); dlgAdvance(); } return; }
    if (state === 'playing') { if (k === 'KeyX' || k === 'Space') bombQueued = true; return; }
    if ((k === 'Enter' || k === 'Space') && !ov.hidden) {
      var b = ov.querySelector('[data-primary]');
      if (b && !b.disabled) { e.preventDefault(); act(b.getAttribute('data-act')); }
    }
  });
  document.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  /* ================= 輸入：觸控／滑鼠拖曳（pointer 事件，只追蹤第一根手指） ================= */
  var drag = null;
  function toLogical(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  cv.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') setTouch(true);
    if (state !== 'playing' || drag) return;  // 已經有一指在拖，其他手指忽略
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    var p = toLogical(e);
    drag = { id: e.pointerId, x: p.x, y: p.y };
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var p = toLogical(e);
    if (state === 'playing') { dragDX += (p.x - drag.x) * 1.1; dragDY += (p.y - drag.y) * 1.1; }
    drag.x = p.x; drag.y = p.y;
  });
  function endDrag(e) { if (drag && e.pointerId === drag.id) drag = null; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // 觸控按鈕：觸控裝置才顯示（含平板），第一次摸到螢幕也會打開
  function setTouch(on) {
    if (on === document.body.classList.contains('touch')) return;
    document.body.classList.toggle('touch', on);
    layout();
  }
  (function () {
    var t = false;
    try { t = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || (navigator.maxTouchPoints > 0 && 'ontouchstart' in window); } catch (e) {}
    if (t) document.body.classList.add('touch');
  })();
  function updatePads() {
    $('bFocus').classList.toggle('on', touchFocus);
    $('empN').textContent = '×' + P.bombs;
  }
  $('bFocus').addEventListener('pointerdown', function (e) {
    e.preventDefault(); touchFocus = !touchFocus; updatePads();
  });
  $('bEmp').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state === 'playing') bombQueued = true;
  });
  ['bFocus', 'bEmp'].forEach(function (id) { $(id).addEventListener('contextmenu', function (e) { e.preventDefault(); }); });

  // 工具列
  function syncAudioBtns() {
    $('bBgm').classList.toggle('off', !opts.bgm);
    $('bSfx').classList.toggle('off', !opts.sfx);
    $('bSfx').textContent = opts.sfx ? '🔊' : '🔇';
  }
  $('bBgm').addEventListener('click', function () {
    opts.bgm = !opts.bgm; lsSet(OPTS_KEY, opts); syncAudioBtns(); SFX.unlock();
    if (opts.bgm && (state === 'playing' || state === 'dialog') && cur) BGM.play(); else BGM.stop();
    this.blur();
  });
  $('bSfx').addEventListener('click', function () {
    opts.sfx = !opts.sfx; lsSet(OPTS_KEY, opts); syncAudioBtns(); SFX.unlock(); SFX.blip();
    this.blur();
  });
  $('bPause').addEventListener('click', function () { togglePause(); this.blur(); });

  // 切到背景分頁、手機來電：自動暫停
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (state === 'playing') pause(); else BGM.stop(); keys = {}; drag = null; }
    else if (state === 'dialog' && cur) BGM.play();
  });

  /* ================= 繪圖 ================= */
  var dpr = 1, scaleK = 1;
  function layout() {
    var st = $('stage'), aw = st.clientWidth, ah = st.clientHeight;
    if (!aw || !ah) return;
    var w = Math.floor(Math.min(aw, ah * W / H)), h = Math.floor(w * H / W);
    wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    scaleK = cv.width / W;
  }
  window.addEventListener('resize', layout);
  try { if (window.ResizeObserver) new ResizeObserver(layout).observe($('stage')); } catch (e) {}

  // 子彈貼圖快取：預先畫好發光圓點，避免每顆子彈都開 shadowBlur（手機很吃效能）
  var sprites = {};
  function sprite(c, r) {
    var key = c + '|' + r, s = sprites[key];
    if (s) return s;
    var pad = r * 1.6, size = Math.ceil((r + pad) * 2), sc = 2;
    var cn = document.createElement('canvas');
    cn.width = cn.height = size * sc;
    var g = cn.getContext('2d');
    g.scale(sc, sc);
    var m = size / 2;
    var gr = g.createRadialGradient(m, m, r * 0.4, m, m, m);
    gr.addColorStop(0, c); gr.addColorStop(0.45, c); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 0.45; g.fillStyle = gr; g.beginPath(); g.arc(m, m, m, 0, TAU); g.fill();
    g.globalAlpha = 1; g.fillStyle = c; g.beginPath(); g.arc(m, m, r, 0, TAU); g.fill();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(m, m, r * 0.5, 0, TAU); g.fill();
    s = sprites[key] = { c: cn, size: size };
    return s;
  }

  function drawBg() {
    var th = theme;
    var gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, th.bg[0]); gr.addColorStop(1, th.bg[1]);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    // 往下捲的網格
    var off = (bgT * 1.2) % 40;
    ctx.strokeStyle = 'rgba(' + th.grid + ',0.10)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var y = off; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    for (var x = 0; x <= W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    ctx.stroke();
    // 資料流
    ctx.fillStyle = 'rgba(' + th.grid + ',0.22)';
    for (var i = 0; i < streaks.length; i++) {
      var s = streaks[i], sy = (s.y + bgT * s.s) % (H + s.l) - s.l;
      ctx.fillRect(s.x, sy, 1.5, s.l);
    }
  }
  function poly(x, y, r, n, rot) {
    ctx.beginPath();
    for (var i = 0; i < n; i++) { var a = rot + i * TAU / n; if (i) ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); else ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    ctx.closePath();
  }
  function drawEnemy(e) {
    var c = theme.enemy[EN[e.type].ci];
    ctx.save();
    ctx.shadowColor = c; ctx.shadowBlur = 10;
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : 'rgba(10,6,20,0.85)';
    ctx.strokeStyle = c; ctx.lineWidth = 2.5;
    if (e.type === 'drone') poly(e.x, e.y, e.r, 4, Math.PI / 2);
    else if (e.type === 'heavy') poly(e.x, e.y, e.r, 6, 0);
    else if (e.type === 'sniper') poly(e.x, e.y, e.r, 3, Math.PI / 2);
    else poly(e.x, e.y, e.r, 4, e.spin);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.3, 0, TAU); ctx.fill();
    if (e.type === 'heavy' || e.type === 'spinner') {
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(e.x - e.r, e.y + e.r + 5, e.r * 2, 3);
      ctx.fillStyle = c; ctx.fillRect(e.x - e.r, e.y + e.r + 5, e.r * 2 * Math.max(0, e.hp / e.max), 3);
    }
    ctx.restore();
    if (e.tele > 0) {
      ctx.save();
      ctx.strokeStyle = c; ctx.globalAlpha = 0.25 + 0.5 * (1 - e.tele / 30); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.lockA) * 900, e.y + Math.sin(e.lockA) * 900); ctx.stroke();
      ctx.restore();
    }
  }
  function drawBoss(b) {
    var d = b.def, c = d.color;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.shadowColor = c; ctx.shadowBlur = 22;
    ctx.strokeStyle = c; ctx.lineWidth = 3;
    poly(0, 0, b.r + 12, d.sides, b.rot); ctx.stroke();
    ctx.lineWidth = 2; ctx.globalAlpha = 0.6;
    poly(0, 0, b.r + 22, d.sides, -b.rot * 1.5); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = b.flash > 0 ? '#ffffff' : 'rgba(12,8,24,0.92)';
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    // 核心：階段越後面越亮
    var pr = (b.ph + 1) / d.phases.length;
    ctx.fillStyle = c; ctx.globalAlpha = 0.35 + 0.5 * pr;
    ctx.beginPath(); ctx.arc(0, 0, b.r * (0.35 + 0.2 * pr) * (1 + 0.06 * Math.sin(bgT * 0.2)), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    if (b.inv > 0 || b.enter) {
      ctx.strokeStyle = '#5ee7ff'; ctx.lineWidth = 2; ctx.setLineDash([7, 7]);
      ctx.beginPath(); ctx.arc(0, 0, b.r + 30, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
  }
  function drawPlayer() {
    if (P.dead) return;
    if (P.inv > 0 && (tick >> 2) % 2) return;
    ctx.save();
    if (P.shield) {
      ctx.strokeStyle = 'rgba(96,165,250,0.8)'; ctx.lineWidth = 2; ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(P.x, P.y, P.graze + 4, 0, TAU); ctx.stroke();
    }
    ctx.shadowColor = '#5ee7ff'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#0b1d2a'; ctx.strokeStyle = '#5ee7ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(P.x, P.y - 16); ctx.lineTo(P.x + 13, P.y + 11); ctx.lineTo(P.x + 4, P.y + 6);
    ctx.lineTo(P.x, P.y + 12); ctx.lineTo(P.x - 4, P.y + 6); ctx.lineTo(P.x - 13, P.y + 11);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 尾焰
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,79,163,0.8)';
    ctx.fillRect(P.x - 2, P.y + 12, 4, 4 + (tick % 4));
    if (P.focus) {
      ctx.strokeStyle = 'rgba(94,231,255,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(P.x, P.y, P.graze, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 1.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff4fa3'; ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 4, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(P.x, P.y, 2.5, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  function drawHUD() {
    ctx.fillStyle = 'rgba(6,4,14,0.78)'; ctx.fillRect(0, 0, W, 42);
    ctx.strokeStyle = 'rgba(' + theme.grid + ',0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 42.5); ctx.lineTo(W, 42.5); ctx.stroke();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = '600 15px ' + FONT_N; ctx.fillStyle = '#e0f2fe';
    ctx.fillText(score.toLocaleString(), 12, 15);
    ctx.font = '500 10px ' + FONT_D; ctx.fillStyle = '#8f8bb0';
    ctx.fillText('HI ' + Math.max(bestOf(mode), score).toLocaleString() + '   GRAZE ' + grazeTotal, 12, 32);
    ctx.textAlign = 'center';
    ctx.font = '700 11px ' + FONT_D; ctx.fillStyle = theme.acc;
    ctx.fillText(cur ? cur.tag : '', W / 2, 15);
    ctx.font = '500 10px ' + FONT_D; ctx.fillStyle = '#8f8bb0';
    ctx.fillText('PWR ' + (P.lv >= 5 ? 'MAX' : P.lv), W / 2, 32);
    // 殘機（右上）與 EMP
    ctx.textAlign = 'right';
    var x, i;
    for (i = 0; i < P.lives; i++) {
      x = W - 16 - i * 17;
      ctx.fillStyle = '#5ee7ff';
      ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x + 6, 21); ctx.lineTo(x - 6, 21); ctx.closePath(); ctx.fill();
    }
    for (i = 0; i < P.bombs; i++) {
      x = W - 16 - i * 17;
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.moveTo(x, 26); ctx.lineTo(x + 5, 32); ctx.lineTo(x, 38); ctx.lineTo(x - 5, 32); ctx.closePath(); ctx.fill();
    }
    if (P.shield) { ctx.fillStyle = '#60a5fa'; ctx.font = '700 9px ' + FONT_D; ctx.fillText('S', W - 16 - P.lives * 17 + 2, 15); }
    // 頭目血條
    if (boss && !boss.enter) {
      var b = boss, bw = W - 24, pct = Math.max(0, b.hp / b.max);
      ctx.fillStyle = 'rgba(6,4,14,0.8)'; ctx.fillRect(12, 48, bw, 22);
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(14, 62, bw - 4, 5);
      ctx.fillStyle = b.inv > 0 ? '#5ee7ff' : b.def.color; ctx.fillRect(14, 62, (bw - 4) * pct, 5);
      ctx.textAlign = 'left'; ctx.font = '700 10px ' + FONT_D; ctx.fillStyle = b.def.color;
      var nm = b.def.name + '  ' + b.def.zh;
      ctx.fillText(nm, 16, 55);
      // 剩餘階段
      for (i = 0; i < b.def.phases.length - b.ph - 1; i++) { ctx.fillRect(16 + ctx.measureText(nm).width + 8 + i * 9, 52, 6, 6); }
      ctx.textAlign = 'right'; ctx.fillStyle = '#e0f2fe'; ctx.font = '600 11px ' + FONT_N;
      var left = Math.max(0, Math.ceil((b.tl - b.t) / 60));
      ctx.fillStyle = left <= 10 ? '#ff5577' : '#e0f2fe';
      ctx.fillText(String(left), W - 16, 55);
    }
  }
  function drawBanners() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (banner > 0 && cur) {
      var a = Math.min(1, banner / 30, (200 - banner) / 20);
      ctx.save(); ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = 'rgba(6,4,14,0.6)'; ctx.fillRect(0, H * 0.36, W, 110);
      ctx.font = '900 34px ' + FONT_D; ctx.fillStyle = theme.acc2; ctx.shadowColor = theme.acc2; ctx.shadowBlur = 16;
      ctx.fillText(cur.tag, W / 2, H * 0.36 + 34);
      ctx.shadowBlur = 0;
      ctx.font = '700 18px ' + FONT_U; ctx.fillStyle = '#ffffff';
      ctx.fillText(cur.name + '　—　' + cur.sub, W / 2, H * 0.36 + 70);
      ctx.font = '500 11px ' + FONT_D; ctx.fillStyle = theme.acc;
      ctx.fillText(cur.en, W / 2, H * 0.36 + 92);
      ctx.restore();
    }
    if (pending && pending.phase === 'warn') {
      var blink = (tick >> 3) % 2;
      ctx.save();
      ctx.fillStyle = warnMid ? 'rgba(250,204,21,0.16)' : 'rgba(239,68,68,0.22)';
      ctx.fillRect(0, H / 2 - 44, W, 88);
      ctx.strokeStyle = warnMid ? '#facc15' : '#ef4444'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, H / 2 - 44); ctx.lineTo(W, H / 2 - 44); ctx.moveTo(0, H / 2 + 44); ctx.lineTo(W, H / 2 + 44); ctx.stroke();
      if (blink) {
        ctx.font = '900 38px ' + FONT_D; ctx.fillStyle = warnMid ? '#facc15' : '#ff4d5e';
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18;
        ctx.fillText(warnMid ? 'CAUTION' : 'WARNING', W / 2, H / 2 - 6);
      }
      ctx.shadowBlur = 0;
      ctx.font = '700 12px ' + FONT_D; ctx.fillStyle = '#ffffff';
      var bd = BOSSES[pending.key];
      ctx.fillText((warnMid ? 'GUARDIAN ' : 'VIRUS CORE ') + bd.name + ' APPROACHING', W / 2, H / 2 + 26);
      ctx.restore();
    }
    if (phaseT > 0 && boss) {
      var pa = Math.min(1, phaseT / 20, (150 - phaseT) / 15);
      ctx.save(); ctx.globalAlpha = Math.max(0, pa);
      ctx.textAlign = 'right';
      ctx.font = '700 15px ' + FONT_U; ctx.fillStyle = boss.def.color;
      ctx.fillText('「' + phaseName + '」', W - 14, 88);
      ctx.restore();
    }
  }
  function render() {
    ctx.setTransform(scaleK, 0, 0, scaleK, 0, 0);
    ctx.save();
    if (shakeT > 0 && state === 'playing') ctx.translate((rand() - 0.5) * shakeI, (rand() - 0.5) * shakeI);
    drawBg();
    var i;
    // 道具
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '900 11px ' + FONT_D;
    for (i = 0; i < items.length; i++) {
      var it = items[i], ic = ITEM_C[it.t];
      ctx.fillStyle = ic; ctx.globalAlpha = 0.25;
      ctx.fillRect(it.x - 13, it.y - 13, 26, 26);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = ic; ctx.lineWidth = 2; ctx.strokeRect(it.x - 10, it.y - 10, 20, 20);
      ctx.fillStyle = '#ffffff'; ctx.fillText(it.t === 'L' ? '♥' : it.t, it.x, it.y + 1);
    }
    // 玩家子彈
    for (i = 0; i < pBul.length; i++) {
      var pb = pBul[i];
      ctx.fillStyle = pb.beam ? 'rgba(94,231,255,0.85)' : 'rgba(125,211,252,0.75)';
      ctx.fillRect(pb.x - (pb.beam ? 1.5 : 2), pb.y - (pb.beam ? 12 : 8), pb.beam ? 3 : 4, pb.beam ? 24 : 16);
    }
    for (i = 0; i < enemies.length; i++) if (!enemies[i].wait) drawEnemy(enemies[i]);
    if (boss) drawBoss(boss);
    drawPlayer();
    // 粒子
    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    // 敵彈畫在最上層，永遠看得清楚
    for (i = 0; i < eBul.length; i++) {
      var b = eBul[i], s = sprite(b.c, b.r);
      ctx.drawImage(s.c, b.x - s.size / 2, b.y - s.size / 2, s.size, s.size);
    }
    // 浮動文字
    for (i = 0; i < texts.length; i++) {
      var t = texts[i];
      ctx.globalAlpha = Math.min(1, t.life / 15);
      ctx.font = (t.big ? '900 16px ' : '700 11px ') + FONT_D;
      ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flash / 40) + ')'; ctx.fillRect(0, 0, W, H); }
    if (cur && state !== 'title') { drawHUD(); drawBanners(); }
    else drawTitleDeco();
  }
  function drawTitleDeco() {
    // 選單底下的裝飾：幾圈慢慢轉的彈幕
    for (var k = 0; k < 3; k++) {
      for (var i = 0; i < 18; i++) {
        var a = i * TAU / 18 + bgT * 0.004 * (k % 2 ? -1 : 1), rr = 90 + k * 60 + Math.sin(bgT * 0.02 + k) * 10;
        var s = sprite(THEMES[k].shot[0], 4);
        ctx.drawImage(s.c, W / 2 + Math.cos(a) * rr - s.size / 2, H * 0.5 + Math.sin(a) * rr - s.size / 2, s.size, s.size);
      }
    }
  }

  /* ================= 主迴圈：rAF 只負責累積時間，邏輯固定 60 步／秒 ================= */
  var lastTs = 0, accum = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!lastTs) lastTs = ts;
    var dt = ts - lastTs; lastTs = ts;
    if (dt > 250 || dt < 0) dt = STEP;  // 分頁剛切回來時不要一次補一大堆步
    if (state === 'playing') {
      accum += dt;
      var n = 0;
      while (accum >= STEP && state === 'playing') {
        update(); accum -= STEP;
        if (++n >= 6) { accum = 0; break; }
      }
      bgT += dt / STEP;
    } else {
      accum = 0;
      if (state === 'title') bgT += dt / STEP;
    }
    if (dlg) typeTick(dt);
    render();
  }

  /* ================= 啟動 ================= */
  syncAudioBtns();
  updatePads();
  layout();
  showTitle();
  requestAnimationFrame(frame);

  // 自動測試用掛勾（只有測試環境預先放了 __NEON_TEST__ 才會出現）
  if (window.__NEON_TEST__) {
    window.__NEON_TEST__.api = {
      update: update, render: render, frame: frame, act: act, dlgAdvance: dlgAdvance, startRun: startRun, retryStage: retryStage,
      setGod: function (v) { god = v; }, keys: function () { return keys; }, P: P,
      field: function () { return { eBul: eBul, enemies: enemies, boss: boss, tick: tick }; },
      get: function () {
        return { state: state, mode: mode, stageIdx: stageIdx, loop: loop, score: score, boss: boss && { key: boss.key, ph: boss.ph, hp: boss.hp, x: boss.x }, pending: !!pending, clock: clock, tlPos: tlPos, tlLen: tl.length,
          eBul: eBul.length, pBul: pBul.length, enemies: enemies.length, items: items.length, parts: parts.length, texts: texts.length, sprites: Object.keys(sprites).length, prog: prog, stats: stats, lives: P.lives };
      }
    };
  }
})();
</script>
