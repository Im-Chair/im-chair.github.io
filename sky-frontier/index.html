<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>天穹拓荒</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#080808; --panel:#121414; --panel2:#1b1e1e; --line:#2e3333; --fg:#ece9e2; --dim:#8c918c; --accent:#c8f135; --bad:#ff6b5e; --gold:#f5c542; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.5 'DM Mono','Microsoft JhengHei',monospace; user-select:none; }
canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
[hidden] { display:none !important; }
button { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--line); padding:5px 10px; border-radius:4px; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
button.main { background:var(--accent); color:#111; border-color:var(--accent); font-weight:500; }
button.main:hover:not(:disabled) { color:#111; filter:brightness(1.1); }
h1,h2,h3 { font-family:Syne,'Microsoft JhengHei',sans-serif; margin:0; }

/* HUD */
#hud { position:fixed; inset:0; pointer-events:none; }
#status { position:absolute; top:12px; left:12px; width:230px; }
.bar { height:12px; background:#000a; border:1px solid #fff3; border-radius:2px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--bad); }
#status .row { margin-top:5px; text-shadow:0 1px 2px #000; }
#status b { color:var(--gold); font-weight:500; }
#info { position:absolute; top:12px; right:12px; text-align:right; text-shadow:0 1px 2px #000; }
#info .era { font-family:Syne,'Microsoft JhengHei',sans-serif; font-weight:800; font-size:16px; color:var(--accent); }
#cpbar { width:190px; height:5px; background:#000a; margin:3px 0 3px auto; }
#cpbar i { display:block; height:100%; background:var(--accent); }
#hotbar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:3px; pointer-events:auto; }
.slot { position:relative; width:42px; height:42px; background:#111c; border:1px solid var(--line); border-radius:3px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.slot.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.slot img { width:30px; height:30px; image-rendering:pixelated; pointer-events:none; }
body.art .slot img, body.art .line img, body.art #cursorItem img { image-rendering:auto; }
.slot span { position:absolute; right:2px; bottom:0; font-size:11px; text-shadow:0 1px 1px #000,0 0 2px #000; pointer-events:none; }
.slot:hover { border-color:#fff8; }
#feed { position:absolute; left:12px; bottom:66px; display:flex; flex-direction:column; gap:2px; max-width:440px; text-shadow:0 1px 2px #000; }
#feed div { transition:opacity .6s; }
#feed .good { color:var(--accent); } #feed .bad { color:var(--bad); } #feed .gold { color:var(--gold); }
#tip { position:absolute; left:50%; bottom:62px; transform:translateX(-50%); text-shadow:0 1px 2px #000; color:#fffc; }
#boss { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:360px; text-align:center; text-shadow:0 1px 2px #000; }
#boss .bar i { background:#c04dff; }

/* 面板 */
#panel { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0007; z-index:5; }
#panelBox { background:var(--panel); border:1px solid var(--line); border-radius:6px; width:min(920px,94vw); max-height:88vh; display:flex; flex-direction:column; }
#panelHead { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); }
#panelHead h2 { font-size:17px; }
#panelBody { padding:12px 14px; overflow:auto; }
.cols { display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:start; }
.grid { display:grid; grid-template-columns:repeat(9,42px); gap:3px; }
.grid + .grid { margin-top:8px; }
.label { color:var(--dim); margin:8px 0 4px; }
.label:first-child { margin-top:0; }
.list { display:flex; flex-direction:column; gap:4px; }
.line { display:flex; align-items:center; gap:8px; padding:5px 7px; background:var(--panel2); border-radius:4px; }
.line img { width:24px; height:24px; image-rendering:pixelated; flex:none; }
.line .grow { flex:1; min-width:0; }
.line small { color:var(--dim); display:block; font-size:11px; }
.line.off { opacity:.45; }
.gold { color:var(--gold); } .good { color:var(--accent); } .bad { color:var(--bad); } .dim { color:var(--dim); }
.tabs { display:flex; gap:4px; margin-bottom:10px; }
.tabs button.on { border-color:var(--accent); color:var(--accent); }
#cursorItem { position:fixed; pointer-events:none; z-index:9; width:34px; height:34px; }
#cursorItem img { width:30px; height:30px; image-rendering:pixelated; }
#cursorItem span { position:absolute; right:0; bottom:0; text-shadow:0 1px 1px #000; }
#itemTip { position:fixed; z-index:10; pointer-events:none; background:#000e; border:1px solid var(--line); padding:3px 7px; border-radius:3px; max-width:260px; }
textarea { width:100%; height:190px; background:#0b0c0c; color:var(--fg); border:1px solid var(--line); font:12px/1.5 'DM Mono',monospace; padding:8px; user-select:text; }
canvas#mapC { display:block; max-width:100%; image-rendering:pixelated; background:#000; }

/* 標題 */
#title { position:fixed; inset:0; z-index:8; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 30%,#1a2a22 0,#080808 65%); }
#titleBox { width:min(480px,92vw); }
#titleBox h1 { font-size:44px; font-weight:800; color:var(--accent); letter-spacing:.04em; }
#titleBox .sub { color:var(--dim); margin:0 0 18px; }
.save { display:flex; align-items:center; gap:6px; padding:9px 10px; background:var(--panel); border:1px solid var(--line); border-radius:5px; margin-bottom:6px; }
.save .grow { flex:1; }
.save small { color:var(--dim); display:block; }
.keys { margin-top:14px; color:var(--dim); font-size:12px; line-height:1.8; }
.keys b { color:var(--fg); font-weight:500; }
#back { color:var(--dim); text-decoration:none; font-size:12px; }
#back:hover { color:var(--accent); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" hidden>
  <div id="status">
    <div class="bar"><i id="hpBar"></i></div>
    <div class="row"><span id="hpText"></span>　<b id="money"></b></div>
    <div class="row dim" id="pos"></div>
  </div>
  <div id="info">
    <div class="era" id="eraName"></div>
    <div id="cpbar"><i id="cpFill"></i></div>
    <div id="cpText"></div>
    <div id="clock" class="dim"></div>
  </div>
  <div id="boss" hidden><div id="bossName"></div><div class="bar"><i id="bossFill"></i></div></div>
  <div id="feed"></div>
  <div id="tip"></div>
  <div id="hotbar"></div>
</div>
<div id="panel" hidden><div id="panelBox"><div id="panelHead"><h2 id="panelTitle"></h2><button id="panelClose">關閉 Esc</button></div><div id="panelBody"></div></div></div>
<div id="cursorItem" hidden></div>
<div id="itemTip" hidden></div>
<div id="title"><div id="titleBox">
  <a id="back" href="../">← ARCADE</a>
  <h1>天穹拓荒</h1>
  <p class="sub">打怪、探坑、建造、接機關，把世界推進到星辰時代。</p>
  <div id="saves"></div>
  <input type="file" id="importFile" accept=".json" hidden>
  <div class="keys"><b>A D</b> 移動　<b>W S</b> 爬梯　<b>空白</b> 跳　<b>左鍵</b> 挖／打　<b>右鍵</b> 放置／互動<br><b>E</b> 背包與合成　<b>J</b> 懸賞與時代　<b>M</b> 地圖　<b>R</b> 轉向　<b>1–9／滾輪</b> 換物品　<b>Esc</b> 存檔選單<br>需要滑鼠與鍵盤。</div>
</div></div>

<script>
'use strict';
/* ========== 常數 ========== */
const TS = 16, W = 800, H = 300, SURF = 95, SEAL_Y = 225, DAY = 600;
const SAVE_KEY = 'arcade-sky-frontier-save', STATS_KEY = 'arcade-sky-frontier-stats', WORLD_KEY = n => `arcade-sky-frontier-world-${n}`;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const fmt = n => Math.floor(n).toLocaleString('en-US');
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ========== 方塊 ========== */
// key, 名稱, 實心, 硬度(0=不可挖), 需要鎬階級, 掉落(null=自己；''=無), 其他
const TILE_DEFS = [
  ['air','',0,0,0,''],
  ['dirt','泥土',1,.45,0,null], ['moss','青苔土',1,.5,0,'dirt'], ['sand','赤砂',1,.45,0,null], ['frost','霜土',1,.5,0,'dirt'],
  ['stone','岩石',1,1.1,1,'cobble'], ['cobble','碎岩',1,1.1,1,null], ['deep','深岩',1,2,3,null], ['seal','封印岩',1,0,9,''], ['bedrock','基岩',1,0,9,''],
  ['log','原木',0,.7,0,null], ['leaves','葉叢',0,.12,0,''], ['plank','木板',1,.6,0,null], ['brick','磚塊',1,1.2,1,null], ['glass','玻璃',1,.3,0,null,{clear:1}],
  ['cloud','雲岩',1,1,2,null], ['ruin','古代磚',1,2.4,3,null],
  ['o_coal','煤礦',1,1.2,1,'coal'], ['o_iron','鐵礦',1,1.5,2,'iron_ore'], ['o_gold','金礦',1,1.7,2,'gold_ore'], ['o_crystal','晶簇',1,1.8,3,'crystal',{light:.8,clear:1}],
  ['o_blue','蒼鋼礦',1,2.4,3,'blue_ore'], ['o_aether','天穹礦',1,2.8,4,'aether_ore',{light:.45}], ['o_star','星鐵礦',1,3,4,'star_ore',{light:.6}],
  ['lava','熔岩',0,0,9,'',{light:.95,clear:1}], ['mushroom','螢光菇',0,.1,0,null,{light:.55,clear:1,floor:1}],
  ['torch','火把',0,.05,0,null,{light:1,clear:1}], ['ladder','梯子',0,.3,0,null,{clear:1}],
  ['door','木門',1,.6,0,null,{clear:1,logic:1}], ['dooropen','木門',0,.6,0,'door',{clear:1,logic:1}],
  ['gate','機關門',1,2.4,3,null,{logic:1}], ['gateopen','機關門',0,2.4,3,'gate',{clear:1,logic:1}],
  ['chest','箱子',0,.7,0,null,{clear:1,floor:1}], ['bench','工作台',0,.7,0,null,{clear:1,floor:1}], ['furnace','熔爐',0,1.2,1,null,{clear:1,floor:1,light:.35}], ['anvil','鐵砧',0,1.5,1,null,{clear:1,floor:1}],
  ['bed','床',0,.5,0,null,{clear:1,floor:1}], ['boundary','界碑石',0,1.2,1,null,{clear:1,floor:1,light:.3}], ['board','懸賞板',0,.8,0,null,{clear:1,floor:1}], ['stele','古代石碑',0,0,9,'',{clear:1,floor:1,light:.35}],
  ['wire','靈脈線',0,.05,0,null,{clear:1,logic:1}], ['lever','拉桿',0,.1,0,null,{clear:1,logic:1}], ['plate','壓力板',0,.1,0,null,{clear:1,floor:1,logic:1}], ['lamp','靈燈',1,.3,0,null,{logic:1,clear:1}],
  ['notgate','反相閘',0,.2,0,null,{clear:1,logic:1,dir:1}], ['delay','延遲閘',0,.2,0,null,{clear:1,logic:1,dir:1}], ['clock','脈衝器',0,.2,0,null,{clear:1,logic:1}],
  ['drill','採掘機',1,1.5,1,null,{logic:1,dir:1}], ['seller','收購機',1,1.5,1,null,{logic:1}],
  ['sapling','樹苗',0,.05,0,null,{clear:1,floor:1}], ['crop','地薯苗',0,.05,0,'potato',{clear:1,floor:1}], ['altar','星門',0,3,4,null,{clear:1,floor:1,light:.9}],
];
const T = {}, TD = [];
TILE_DEFS.forEach((d, i) => { T[d[0]] = i; TD[i] = { id:i, key:d[0], name:d[1], solid:!!d[2], hard:d[3], tier:d[4], drop:d[5] === null ? d[0] : d[5], ...(d[6] || {}) }; });
const WALLS = [null, { key:'wall_wood', name:'木牆', c:'#4a3626' }, { key:'wall_stone', name:'石牆', c:'#343b4a' }, { key:'wall_brick', name:'磚牆', c:'#55343a' }];

/* ========== 物品 ========== */
const ITEMS = {};
function item(id, name, o = {}) { ITEMS[id] = { id, name, max:99, ...o }; }
TD.forEach(d => { if (d.name && !['moss','frost','seal','bedrock','lava','stele','dooropen','gateopen','crop','log','leaves'].includes(d.key) && !d.key.startsWith('o_')) item(d.key, d.name, { tile:d.id }); });
item('log', '原木', { tile:T.log });
WALLS.forEach((w, i) => { if (w) item(w.key, w.name, { wall:i }); });
const mat = (id, name, c, shape = 'lump') => item(id, name, { c, shape });
mat('coal','煤塊','#2a2a30'); mat('iron_ore','鐵礦石','#c79a7a'); mat('gold_ore','金礦石','#e8c14a'); mat('crystal','晶石','#7ff0ff','gem');
mat('blue_ore','蒼鋼礦石','#4f8fe0'); mat('aether_ore','天穹礦石','#c8f135','gem'); mat('star_ore','星鐵礦石','#ff9ee8','gem');
mat('iron_bar','鐵錠','#c5ccd6','bar'); mat('gold_bar','金錠','#f5c542','bar'); mat('blue_bar','蒼鋼錠','#4f8fe0','bar'); mat('aether_bar','天穹錠','#c8f135','bar'); mat('star_bar','星鐵錠','#ff9ee8','bar');
mat('stick','木棒','#a07a4e','stick'); mat('gel','苔泥膠','#62d6a0','drop'); mat('hide','腐皮','#8a6d55','lump'); mat('wing','蝠翼','#6d5a80','lump'); mat('bone','骨片','#ded8c4','stick'); mat('powder','爆囊粉','#e07a3a','drop'); mat('ember','餘燼','#ff7a3d','gem'); mat('feather','蒼羽','#a8e6ff','stick');
const food = (id, name, heal, c) => item(id, name, { heal, c, shape:'food' });
food('potato','地薯',6,'#b08a50'); food('baked','烤地薯',22,'#d9a860'); food('stew','菇湯',35,'#c98ad9'); item('mushroom','螢光菇',{ tile:T.mushroom, heal:10 });
const pick = (id, name, tier, speed, dmg, c) => item(id, name, { max:1, pick:tier, speed, dmg, c, shape:'pick' });
pick('pick_wood','木鎬',1,1,5,'#a07a4e'); pick('pick_stone','石鎬',2,1.5,7,'#7a8496'); pick('pick_iron','鐵鎬',3,2.2,10,'#c5ccd6'); pick('pick_blue','蒼鋼鎬',4,3.2,14,'#4f8fe0'); pick('pick_aether','天穹鎬',5,4.5,20,'#c8f135');
const sword = (id, name, dmg, c) => item(id, name, { max:1, sword:1, dmg, c, shape:'sword' });
sword('sword_wood','木劍',9,'#a07a4e'); sword('sword_stone','石劍',14,'#7a8496'); sword('sword_iron','鐵劍',22,'#c5ccd6'); sword('sword_blue','蒼鋼劍',36,'#4f8fe0'); sword('sword_aether','天穹劍',58,'#c8f135'); sword('sword_star','星鐵劍',90,'#ff9ee8');
item('bow','短弓',{ max:1, bow:1, dmg:12, c:'#a07a4e', shape:'bow' }); mat('arrow','箭','#ded8c4','stick');
const armor = (id, name, def, c) => item(id, name, { max:1, def, c, shape:'armor' });
armor('armor_hide','皮甲',.1,'#8a6d55'); armor('armor_iron','鐵甲',.22,'#c5ccd6'); armor('armor_blue','蒼鋼甲',.36,'#4f8fe0'); armor('armor_aether','天穹甲',.5,'#c8f135'); armor('armor_star','星鐵甲',.62,'#ff9ee8');
item('life','生命結晶',{ c:'#ff6b5e', shape:'gem', life:10 }); item('glider','滑翔翼',{ max:1, c:'#a8e6ff', shape:'armor' });

// 合成：st＝需要在旁邊的工作站；era＝最低時代
const R = (out, n, need, st, era = 0) => ({ out, n, need, st, era });
const RECIPES = [
  R('plank',4,{log:1}), R('stick',4,{plank:2}), R('bench',1,{plank:8}), R('torch',6,{coal:1,stick:1}), R('ladder',4,{stick:6}), R('door',1,{plank:6}), R('chest',1,{plank:12}),
  R('wall_wood',4,{plank:1}), R('pick_wood',1,{plank:6,stick:2},'bench'), R('sword_wood',1,{plank:6,stick:1},'bench'), R('furnace',1,{cobble:20},'bench'),
  R('pick_stone',1,{cobble:8,stick:3},'bench'), R('sword_stone',1,{cobble:8,stick:1},'bench'), R('wall_stone',4,{cobble:1},'bench'), R('bow',1,{stick:6,hide:4},'bench'), R('arrow',8,{stick:2,bone:1},'bench'),
  R('bed',1,{plank:10,hide:6},'bench'), R('armor_hide',1,{hide:12},'bench'), R('stew',1,{mushroom:3},'bench'), R('board',1,{plank:10,stick:4},'bench'),
  R('brick',2,{cobble:2},'furnace'), R('glass',2,{sand:2},'furnace'), R('baked',1,{potato:1},'furnace'), R('wall_brick',4,{brick:1},'bench'),
  R('iron_bar',1,{iron_ore:2,coal:1},'furnace'), R('gold_bar',1,{gold_ore:2,coal:1},'furnace'), R('anvil',1,{iron_bar:8},'bench'),
  R('pick_iron',1,{iron_bar:8,stick:3},'anvil'), R('sword_iron',1,{iron_bar:7,stick:1},'anvil'), R('armor_iron',1,{iron_bar:16},'anvil'),
  R('boundary',1,{cobble:20,gold_bar:1},'anvil',1),
  R('wire',8,{iron_bar:1,coal:1},'anvil',2), R('lever',1,{stick:1,cobble:1},'bench',2), R('plate',1,{plank:2},'bench',2), R('lamp',1,{glass:2,coal:1},'bench',2), R('gate',1,{iron_bar:4},'anvil',2),
  R('blue_bar',1,{blue_ore:2,coal:2},'furnace',3), R('pick_blue',1,{blue_bar:10,stick:3},'anvil',3), R('sword_blue',1,{blue_bar:8,stick:1},'anvil',3), R('armor_blue',1,{blue_bar:18},'anvil',3),
  R('notgate',1,{wire:2,iron_bar:1},'anvil',3), R('delay',1,{wire:2,iron_bar:1},'anvil',3), R('clock',1,{wire:2,gold_bar:1},'anvil',3), R('drill',1,{iron_bar:8,blue_bar:2},'anvil',3), R('seller',1,{chest:1,gold_bar:4},'anvil',3),
  R('aether_bar',1,{aether_ore:2,coal:2},'furnace',4), R('pick_aether',1,{aether_bar:10,stick:3},'anvil',4), R('sword_aether',1,{aether_bar:8,stick:1},'anvil',4), R('armor_aether',1,{aether_bar:18},'anvil',4),
  R('star_bar',1,{star_ore:2,coal:3},'furnace',4), R('sword_star',1,{star_bar:10,aether_bar:4},'anvil',5), R('armor_star',1,{star_bar:18},'anvil',5), R('altar',1,{star_bar:20,aether_bar:10},'anvil',5),
];

/* ========== 時代、階級、經濟 ========== */
const ERAS = [
  { name:'拓荒時代', cp:0 }, { name:'開墾時代', cp:300, on:'工匠搬來了。界碑石可以合成。' }, { name:'商業時代', cp:1500, on:'市場開張，價格開始每天浮動。靈脈線可以合成。' },
  { name:'工業時代', cp:5000, on:'地底的封印岩崩解了。機械可以合成。' }, { name:'天穹時代', cp:15000, on:'浮空島從雲層裡現身了。' }, { name:'星辰時代', cp:40000, on:'星門可以合成。' },
];

/* ========== 雜訊與世界生成 ========== */
function makeNoise(seed) {
  const r = mulberry(seed), P = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) P[i] = r() * 2 - 1;
  const h = (x, y) => P[(Math.imul(x, 374761) ^ Math.imul(y, 668265)) >>> 3 & 1023];
  const s = t => t * t * (3 - 2 * t);
  const n2 = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), u = s(x - xi), v = s(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
  return { n2, fbm:(x, y, o = 3) => { let t = 0, f = 1, a = 1, m = 0; for (let i = 0; i < o; i++) { t += n2(x * f + i * 37, y * f - i * 11) * a; m += a; f *= 2; a *= .5; } return t / m; } };
}

const tile = new Uint8Array(W * H), wall = new Uint8Array(W * H), seen = new Uint8Array(W * H);
const skyH = new Int16Array(W), surf = new Int16Array(W);
const ID = (x, y) => y * W + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const get = (x, y) => inB(x, y) ? tile[ID(x, y)] : T.bedrock;
const opaque = id => id !== T.air && TD[id].solid && !TD[id].clear;
// 從 y=60 往下算：高空的浮空島不遮地面的天光
function recomputeSky(x) { for (let y = 60; y < H; y++) if (opaque(tile[ID(x, y)])) { skyH[x] = y; return; } skyH[x] = H; }

let S = null;      // 存檔裡的世界狀態
let meta = new Map();  // 方塊索引 → 資料（箱子內容、拉桿狀態、方向…）
const logic = new Set();

function setRaw(x, y, id) { tile[ID(x, y)] = id; }
function blob(rng, x, y, r, fn) { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + rng() * r && inB(x + dx, y + dy)) fn(x + dx, y + dy); }

function lootFor(depth, rng) {
  const inv = [], add = (id, a, b = a) => inv.push({ id, n:a + Math.floor(rng() * (b - a + 1)) });
  add('torch', 4, 10);
  if (rng() < .7) add('coal', 3, 8);
  if (depth < 130) { add('iron_ore', 2, 6); if (rng() < .4) add('baked', 2, 4); if (rng() < .3) add('arrow', 8, 16); }
  else if (depth < 190) { add('iron_bar', 2, 5); add('gold_ore', 2, 6); if (rng() < .5) add('stew', 1, 3); if (rng() < .3) add('life', 1); }
  else if (depth < SEAL_Y) { add('gold_bar', 2, 5); add('crystal', 1, 3); if (rng() < .45) add('life', 1); }
  else { add('blue_ore', 3, 8); add('crystal', 2, 5); if (rng() < .6) add('life', 1); }
  while (inv.length < 27) inv.push(null);
  return inv;
}

function generate(seed) {
  const rng = mulberry(seed * 7 + 3), N = makeNoise(seed), N2 = makeNoise(seed + 991);
  tile.fill(0); wall.fill(0); seen.fill(0); meta = new Map();
  const biome = x => { const b = N.fbm(x / 240, 5, 2); return b < -.18 ? 'sand' : b > .22 ? 'frost' : 'moss'; };
  const camp = W >> 1;
  for (let x = 0; x < W; x++) {
    let h = SURF + N.fbm(x / 95, 1.5) * 34 + N.fbm(x / 22, 9.5, 2) * 7;
    const d = Math.abs(x - camp); if (d < 34) h = SURF + (h - SURF) * clamp((d - 18) / 16, 0, 1);
    surf[x] = Math.round(h);
  }
  for (let x = 0; x < W; x++) {
    const h = surf[x], b = biome(x), soil = 6 + Math.floor((N.n2(x / 8, 2) + 1) * 3);
    for (let y = h; y < H; y++) {
      let t;
      if (y === h) t = b === 'sand' ? T.sand : b === 'frost' ? T.frost : T.moss;
      else if (y < h + soil) t = b === 'sand' ? T.sand : T.dirt;
      else if (y < SEAL_Y) t = T.stone;
      else if (y < SEAL_Y + 3) t = T.seal;
      else t = T.deep;
      if (y >= H - 4) t = T.bedrock;
      setRaw(x, y, t);
    }
  }
  // 洞穴：兩層脊狀雜訊的交會形成長隧道，另加大型空腔
  for (let x = 0; x < W; x++) for (let y = surf[x] + 2; y < H - 5; y++) {
    if (y >= SEAL_Y && y < SEAL_Y + 3) continue;
    const a = Math.abs(N.fbm(x / 46, y / 26)), b = Math.abs(N2.fbm(x / 58, y / 30));
    const big = N2.fbm(x / 34 + 90, y / 22 + 90, 2);
    const near = y < surf[x] + 9;
    if ((a < .045 && b < .16 && (!near || N.n2(x / 20, 77) > .15)) || (big > .34 && y > surf[x] + 22)) setRaw(x, y, T.air);
  }
  // 礦脈
  const ores = [[T.o_coal,SURF+6,SEAL_Y,620,2],[T.o_iron,SURF+22,SEAL_Y,460,2],[T.o_gold,150,SEAL_Y,170,2],[T.o_crystal,178,SEAL_Y,80,1],[T.o_blue,SEAL_Y+3,H-5,340,2]];
  for (const [t, y0, y1, count, r] of ores) for (let i = 0; i < count; i++) {
    blob(rng, Math.floor(rng() * W), y0 + Math.floor(rng() * (y1 - y0)), r, (x, y) => { const c = tile[ID(x, y)]; if ((c === T.stone || c === T.deep) && rng() < .75) setRaw(x, y, t); });
  }
  // 熔岩
  for (let x = 0; x < W; x++) for (let y = 190; y < H - 4; y++) if (tile[ID(x, y)] === T.air && y !== SEAL_Y && N.n2(x / 26, y / 9 + 40) > (y > SEAL_Y + 3 ? .35 : .58)) setRaw(x, y, T.lava);
  // 晶洞
  for (let i = 0; i < 16; i++) { const cx = 20 + Math.floor(rng() * (W - 40)), cy = 180 + Math.floor(rng() * 38), r = 4 + Math.floor(rng() * 4);
    blob(rng, cx, cy, r, (x, y) => { if (y < SEAL_Y) setRaw(x, y, T.air); });
    blob(rng, cx, cy, r + 2, (x, y) => { if (y < SEAL_Y && tile[ID(x, y)] === T.stone && rng() < .55) setRaw(x, y, T.o_crystal); }); }
  // 菌林：空腔地面長螢光菇
  for (let x = 0; x < W; x++) for (let y = SURF + 28; y < 200; y++) if (tile[ID(x, y)] === T.air && TD[tile[ID(x, y + 1)]].solid && N2.n2(x / 40 + 5, y / 26 + 5) > .22 && rng() < .28) setRaw(x, y, T.mushroom);
  // 遺跡
  S.ruins = [];
  for (let i = 0; i < 34; i++) placeRuin(rng, 15 + Math.floor(rng() * (W - 30)), SURF + 36 + Math.floor(rng() * (H - SURF - 60)));
  // 樹與地表植物
  for (let x = 3; x < W - 3; x++) {
    const h = surf[x]; if (Math.abs(x - camp) < 22) continue;
    if (tile[ID(x, h)] === T.moss || tile[ID(x, h)] === T.frost) { if (rng() < .1) { growTree(x, h - 1, rng); x += 3; } }
    else if (tile[ID(x, h)] === T.sand && rng() < .02) growTree(x, h - 1, rng, true);
  }
  // 營地
  for (let x = camp - 16; x <= camp + 16; x++) { const h = surf[x]; for (let y = h - 8; y < h; y++) if (inB(x, y)) setRaw(x, y, T.air); }
  const gy = surf[camp] - 1;
  for (let x = camp - 7; x <= camp + 7; x++) setRaw(x, surf[x], T.plank);
  setRaw(camp, gy, T.stele); setRaw(camp - 3, gy, T.board); setRaw(camp + 6, surf[camp + 6] - 1, T.torch); setRaw(camp - 6, surf[camp - 6] - 1, T.torch); setRaw(camp + 3, gy, T.chest);
  meta.set(ID(camp + 3, gy), { inv:[{ id:'plank',n:16 },{ id:'torch',n:12 },{ id:'baked',n:4 },...Array(24).fill(null)] });
  S.camp = { x:camp, y:gy };
  S.npcs = [{ type:'scrap', name:'回收員', x:(camp + 5.5) * TS, y:surf[camp + 5] * TS - 28 }];
  // 地窟之主的石室
  const wx = camp + (rng() < .5 ? -1 : 1) * (130 + Math.floor(rng() * 120)), wy = H - 26;
  for (let y = wy - 12; y < wy + 12; y++) for (let x = wx - 26; x < wx + 26; x++) { const edge = y < wy - 10 || y >= wy + 10 || x < wx - 24 || x >= wx + 24; setRaw(x, y, edge ? T.ruin : T.air); if (!edge) wall[ID(x, y)] = 3; }
  for (const dx of [-16, 0, 16]) { setRaw(wx + dx, wy + 9, T.torch); }
  S.lair = { x:wx, y:wy, cool:0 };
  for (let x = 0; x < W; x++) recomputeSky(x);
}

function placeRuin(rng, cx, cy) {
  if (cy > H - 14 || (cy > SEAL_Y - 10 && cy < SEAL_Y + 9)) return;
  const w = 9 + Math.floor(rng() * 8), h = 6 + Math.floor(rng() * 3), locked = rng() < .4;
  const x0 = cx - (w >> 1), y0 = cy;
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
    if (!inB(x, y)) return;
    const edge = x === x0 || x === x0 + w - 1 || y === y0 || y === y0 + h - 1;
    setRaw(x, y, edge ? T.ruin : T.air); if (!edge) wall[ID(x, y)] = 3;
  }
  const fy = y0 + h - 2;
  const chestX = locked ? x0 + w - 3 : cx;
  setRaw(chestX, fy, T.chest); meta.set(ID(chestX, fy), { inv:lootFor(cy, rng), ruin:1 });
  setRaw(x0 + 1, fy, T.torch);
  S.ruins.push([x0 + (w >> 1), cy]);
  // 門在兩側開口
  const ex = rng() < .5 ? x0 : x0 + w - 1;
  for (let i = 0; i < 2; i++) { setRaw(ex, fy - i, T.air); }
  for (const dx of [-1, 1]) for (let i = 0; i < 2; i++) { const ox = ex + dx; if (ox < x0 || ox > x0 + w - 1) if (inB(ox, fy - i)) setRaw(ox, fy - i, T.air); }
  // 機關室：一道隔牆加機關門，拉桿在外室，用靈脈線連到門上
  if (locked && w >= 11) {
    const px = x0 + w - 5;
    for (let y = y0 + 1; y < y0 + h - 1; y++) setRaw(px, y, T.ruin);
    setRaw(px, fy, T.gate); logic.add(ID(px, fy));
    setRaw(px, fy - 1, T.gate); logic.add(ID(px, fy - 1));
    setRaw(px - 1, fy - 1, T.wire); setRaw(px - 2, fy - 1, T.wire); setRaw(px - 1, fy, T.wire);
    setRaw(px - 3, fy - 1, T.lever); meta.set(ID(px - 3, fy - 1), { on:false });
  }
}

function growTree(x, y, rng, dry) {
  const h = dry ? 2 + Math.floor(rng() * 2) : 4 + Math.floor(rng() * 4);
  for (let i = 0; i < h; i++) if (inB(x, y - i)) setRaw(x, y - i, T.log);
  if (dry) return;
  blob(rng, x, y - h, 2 + (rng() < .4 ? 1 : 0), (a, b) => { if (tile[ID(a, b)] === T.air) setRaw(a, b, T.leaves); });
}

/* ========== 紋理 ========== */
const VAR = 3;
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const c = s => clamp(Math.round((n >> s & 255) * f), 0, 255); return `rgb(${c(16)},${c(8)},${c(0)})`; }
function speck(g, r, base, n = 20, amp = .14) { g.fillStyle = base; g.fillRect(0, 0, TS, TS); for (let i = 0; i < n; i++) { g.fillStyle = shade(base, 1 + (r() - .5) * amp * 2); const s = r() < .3 ? 2 : 1; g.fillRect(Math.floor(r() * TS), Math.floor(r() * TS), s, s); } }
function ore(g, r, base, c) { speck(g, r, base); for (let i = 0; i < 7; i++) { g.fillStyle = i % 3 ? c : shade(c, 1.3); g.fillRect(2 + Math.floor(r() * 11), 2 + Math.floor(r() * 11), 2, 2); } }
function courses(g, c1, line) { g.fillStyle = c1; g.fillRect(0, 0, TS, TS); g.fillStyle = line; for (let y = 3; y < TS; y += 5) g.fillRect(0, y, TS, 1); for (let y = 0, o = 0; y < TS; y += 5, o ^= 1) { g.fillRect(o ? 3 : 10, y, 1, 3); } }
const PAINT = {
  dirt:(g, r) => speck(g, r, '#5a4254', 26), moss:(g, r) => { speck(g, r, '#5a4254', 26); g.fillStyle = '#3fc79a'; g.fillRect(0, 0, TS, 3); for (let i = 0; i < 16; i += 2) g.fillRect(i, 3, 1, 1 + Math.floor(r() * 3)); g.fillStyle = '#7cf0c4'; for (let i = 0; i < 5; i++) g.fillRect(Math.floor(r() * 15), 0, 2, 1); },
  sand:(g, r) => speck(g, r, '#b5653f', 26), frost:(g, r) => { speck(g, r, '#5a4254', 26); g.fillStyle = '#d6edf3'; g.fillRect(0, 0, TS, 4); for (let i = 0; i < 16; i += 3) g.fillRect(i, 4, 2, 1 + Math.floor(r() * 2)); },
  stone:(g, r) => { speck(g, r, '#4b5568', 28); g.fillStyle = '#3e4757'; for (let i = 0; i < 3; i++) g.fillRect(Math.floor(r() * 12), Math.floor(r() * 15), 3 + Math.floor(r() * 3), 1); },
  cobble:(g, r) => { g.fillStyle = '#39414f'; g.fillRect(0, 0, TS, TS); for (const [x, y, w, h] of [[1,1,6,6],[8,1,7,4],[8,6,4,5],[1,8,6,7],[13,6,2,5],[8,12,7,3]]) { g.fillStyle = shade('#667082', .9 + r() * .25); g.fillRect(x, y, w, h); } },
  deep:(g, r) => speck(g, r, '#2d3044', 26, .2), seal:(g, r) => { speck(g, r, '#3d1d66', 18); g.fillStyle = '#a45cff'; for (let i = 0; i < 4; i++) g.fillRect(Math.floor(r() * 13), 2 + i * 4, 3, 1); },

function openMenu() { paused = true; saveGame(true); openPanel('選單', `<div class="list"><div class="dim">已自動存檔。</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="main" data-menu="resume">繼續</button><button data-menu="save">存檔</button><button data-menu="export">匯出存檔</button><button data-menu="title">回標題</button></div></div>`, 'menu'); }
$('panelBody').addEventListener('click', e => { const b = e.target.closest('[data-menu]'); if (!b) return; const m = b.dataset.menu; if (m === 'resume') closePanel(); else if (m === 'save') saveGame(); else if (m === 'export') exportSave(slotNo); else if (m === 'title') { saveGame(true); closePanel(); running = false; showTitle(); } });

/* ========== 輸入 ========== */
addEventListener('keydown', e => {
  if (!running) return; const inText = e.target.tagName === 'TEXTAREA';
  if (inText && e.code !== 'Escape') return;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') { e.preventDefault(); if (panelKind) closePanel(); else openMenu(); return; }
  if (e.code === 'KeyE') { if (panelKind === 'bag' || panelKind === 'chest') closePanel(); else if (!panelKind) openBag(); return; }
  if (e.code === 'KeyJ') { if (panelKind === 'journal') closePanel(); else if (!panelKind) openJournal(curTab); return; }
  if (e.code === 'KeyM') { if (panelKind === 'map') closePanel(); else if (!panelKind) openMap(); return; }
  if (paused) return;
  keys[e.code] = true;
  if (/^Digit[1-9]$/.test(e.code)) { slot = +e.code.slice(5) - 1; mine = null; hudDirty = true; }
  if (e.code === 'KeyR') { const a = aimTile(); if (inB(a.x, a.y)) { const t = get(a.x, a.y); if (TD[t].dir) { const m = mOf(ID(a.x, a.y), { dir:0 }); m.dir = ((m.dir || 0) + 1) % 4; SFX.click(); } } }
  if (e.code === 'KeyS' && e.ctrlKey) { e.preventDefault(); saveGame(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { keys = {}; mouse.l = mouse.r = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { mouse.x = e.clientX; mouse.y = e.clientY; if (e.button === 0) { mouse.l = true; mouse.lq = true; } if (e.button === 2) { mouse.r = true; mouse.rq = true; placeCD = 0; } });
addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { if (paused) return; slot = (slot + (e.deltaY > 0 ? 1 : 8)) % 9; mine = null; hudDirty = true; e.preventDefault(); }, { passive:false });
$('hotbar').addEventListener('click', e => { const s = e.target.closest('.slot'); if (s) { slot = +s.dataset.i; hudDirty = true; } });
addEventListener('pagehide', () => { if (running) saveGame(true); });
addEventListener('visibilitychange', () => { if (document.hidden && running) saveGame(true); });

/* ========== 主迴圈與標題 ========== */
function frame(ts) {
  requestAnimationFrame(frame); if (!running) return;
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (!paused) update(dt);
  draw();
}
function startRunning() { running = true; paused = false; panelKind = null; $('title').hidden = true; $('hud').hidden = false; $('panel').hidden = true; last = performance.now(); saveT = 0; keys = {}; hudDirty = true; lightT = 0; updateHud(); }
function newGame(n) { slotNo = n; newState((Date.now() ^ Math.floor(Math.random() * 1e9)) & 0x7fffffff); saveGame(true); startRunning(); note('右鍵石碑看時代，懸賞板在左邊。'); }
function loadGame(n) { const raw = (() => { try { return JSON.parse(localStorage.getItem(WORLD_KEY(n))); } catch { return null; } })(); slotNo = n; if (!raw || !deserialize(raw)) { alert('存檔損毀，無法讀取。'); return; } startRunning(); note('歡迎回來', 'good'); }
function exportSave(n) { const s = (() => { try { return localStorage.getItem(WORLD_KEY(n)); } catch { return null; } })(); if (!s) return; const url = URL.createObjectURL(new Blob([s], { type:'application/json' })), a = document.createElement('a'); a.href = url; a.download = `sky-frontier-${n}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
let importTo = 1;
$('importFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { let d; try { d = JSON.parse(t); } catch { alert('不是有效的存檔檔案。'); return; } if (d?.S?.v !== 1 || !d.tile) { alert('不是天穹拓荒的存檔。'); return; } try { localStorage.setItem(WORLD_KEY(importTo), t); } catch { alert('瀏覽器儲存空間不足。'); return; } renderSaves(); }); e.target.value = ''; });
function renderSaves() { let h = ''; for (let n = 1; n <= 3; n++) { const i = slotInfo(n);
  if (i && !i.broken) h += `<div class="save"><div class="grow">存檔 ${n}　<span class="good">${ERAS[i.era].name}</span><small>第 ${i.day} 天　${fmt(i.money)} 元　${new Date(i.at).toLocaleString('zh-TW', { hour12:false })}${i.won ? '　已討伐墜星' : ''}</small></div><button class="main" data-load="${n}">繼續</button><button data-exp="${n}">匯出</button><button data-del="${n}">刪除</button></div>`;
  else h += `<div class="save"><div class="grow">存檔 ${n}<small>${i?.broken ? '檔案損毀' : '空白'}</small></div><button class="main" data-new="${n}">新世界</button><button data-imp="${n}">匯入</button></div>`; }
  $('saves').innerHTML = h; }
$('saves').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const D = b.dataset;
  if (D.load) loadGame(+D.load); else if (D.new) newGame(+D.new); else if (D.exp) exportSave(+D.exp); else if (D.imp) { importTo = +D.imp; $('importFile').click(); }
  else if (D.del && confirm(`確定刪除存檔 ${D.del}？這個動作無法復原。`)) { try { localStorage.removeItem(WORLD_KEY(+D.del)); } catch {} let any = false; for (let n = 1; n <= 3; n++) if (slotInfo(n)) any = true; if (!any) try { localStorage.removeItem(SAVE_KEY); } catch {} renderSaves(); } });
function showTitle() { $('title').hidden = false; $('hud').hidden = true; renderSaves(); }
showTitle(); requestAnimationFrame(frame);

// 測試用入口（不影響遊戲）
window.SF = { get S() { return S; }, get P() { return P; }, get mobs() { return mobs; }, T, TD, ITEMS, get, setTile, addCp, give, signalTick, count, spawnMob, saveGame, loadGame, newGame, get power() { return power; }, meta, get metaMap() { return meta; }, serialize, deserialize, tile, wall, surf, ID, W, H, RECIPES, surveyScore, openJournal, openBag, closePanel, update, mouse, get keys() { return keys; }, breakTile, aimTile, trySpawn, get slot() { return slot; }, set slot(v) { slot = v; } };
</script>
