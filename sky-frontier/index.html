<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="天穹拓荒">
<meta name="theme-color" content="#111923">
<title>天穹拓荒</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 版面：直式一屏。上方狀態列與「下一步」、中間地圖、下方訊息與操作（左道具、右方向鍵） */
:root {
  --bg: #111923;
  --panel: #1b2735;
  --panel2: #223144;
  --line: #3a4d61;
  --ink: #f4e8cf;
  --muted: #9fb0c2;
  --gold: #ffd166;
  --good: #8fdc8a;
  --warn: #ffb347;
  --bad: #ff7a66;
  --ts: 26px;
  --font-px: 'Silkscreen', 'Courier New', monospace;
  --font-ui: system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#app { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; }
button { font: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation; }

/* 頂列 */
.top { display: flex; align-items: center; gap: 8px; }
.icon {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  font-size: 18px; text-decoration: none; color: var(--ink); padding: 0;
}
.title { flex: 1; min-width: 0; }
.title h1 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: .04em; white-space: nowrap; }
.title .sub { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 狀態列 */
.stats { display: grid; grid-template-columns: 1fr 1.35fr 1fr 1.1fr; gap: 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 4px 7px 5px; min-width: 0; }
.stat small { display: block; font-size: 10px; color: var(--muted); }
.stat b { display: block; font-family: var(--font-px); font-size: 14px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ebar { height: 4px; background: #0b121a; border-radius: 2px; margin-top: 2px; overflow: hidden; }
.ebar i { display: block; height: 100%; background: linear-gradient(90deg, #6fd36a, #c6f06b); width: 100%; transition: width .15s; }
.ebar.low i { background: linear-gradient(90deg, #ff6b5b, #ffb347); }
.stat.full b { color: var(--warn); }

/* 地圖 */
.map-wrap { position: relative; padding: 4px; background: #070b10; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
#map { display: grid; gap: 0; justify-content: center; touch-action: manipulation; }
.map-wrap.hit { animation: hit .35s; }
.map-wrap.boom { animation: shake .35s; }
@keyframes hit { 0%, 100% { box-shadow: none; } 30% { box-shadow: inset 0 0 0 4px var(--bad); } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translate(-3px, 1px); } 50% { transform: translate(3px, -1px); } 75% { transform: translate(-2px, 0); } }
#banner {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: rgba(10, 14, 20, .86); border: 1px solid var(--gold); color: var(--gold);
  padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .4s;
}
#banner.show { opacity: 1; }

.tile {
  width: var(--ts); height: var(--ts); position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--ts) * .6); line-height: 1; overflow: hidden;
  background: #05080c;
}
/* 各層岩石色（--rk 底色、--rk2 斑點、--tn 挖空後的通道色） */
.L0 { --rk: #3d6b43; --rk2: #2f5735; --tn: #2a2119; }
.L1 { --rk: #7a5537; --rk2: #64432a; --tn: #2c1f16; }
.L2 { --rk: #9b958a; --rk2: #7f7a70; --tn: #2b2a28; }
.L3 { --rk: #45606c; --rk2: #344b56; --tn: #182329; }
.L4 { --rk: #54457a; --rk2: #42365f; --tn: #1c1729; }
.L5 { --rk: #3e2d2d; --rk2: #2c2020; --tn: #1a1010; }
.L6 { --rk: #7b6e4f; --rk2: #5f5439; --tn: #221e15; }
.L7 { --rk: #262a3c; --rk2: #1a1d2b; --tn: #0c0d14; }
.k-rock, .k-ore, .k-boulder, .k-gp, .k-page {
  background:
    radial-gradient(circle at 28% 30%, var(--rk2) 0 11%, transparent 12%),
    radial-gradient(circle at 72% 68%, var(--rk2) 0 9%, transparent 10%),
    var(--rk);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.06);
}
.k-rock.v1 {
  background:
    radial-gradient(circle at 66% 26%, var(--rk2) 0 10%, transparent 11%),
    radial-gradient(circle at 30% 74%, var(--rk2) 0 12%, transparent 13%),
    var(--rk);
}
.L6.k-rock { background: linear-gradient(var(--rk2) 0 2px, transparent 2px) 0 48% / 100% 50%, linear-gradient(90deg, var(--rk2) 0 2px, transparent 2px) 45% 0 / 50% 50%, var(--rk); }
.k-empty { background: var(--tn); }
.k-mem { background: var(--tn); filter: brightness(.45); }
.k-dark { background: #05080c; }
.dim { filter: brightness(.5) saturate(.7); }
.k-ore { color: var(--oc, #fff); text-shadow: 0 0 2px rgba(0,0,0,.8); font-weight: 700; }
.o-coal { --oc: #15171a; text-shadow: 0 0 2px rgba(255,255,255,.35); }
.o-copper { --oc: #ff8a3d; }
.o-iron { --oc: #d9c7b4; }
.o-silver { --oc: #e8f1ff; }
.o-jade { --oc: #57e0a3; }
.o-quartz { --oc: #f4f9ff; }
.o-amethyst { --oc: #c58bff; }
.o-obsidian { --oc: #8a6cff; text-shadow: 0 0 3px #000; }
.o-gold { --oc: #ffd23f; }
.o-ruby { --oc: #ff3b5c; }
.o-starsilver { --oc: #bfe8ff; text-shadow: 0 0 5px #bfe8ff; }
.o-abyssal { --oc: #40f0e0; text-shadow: 0 0 6px #40f0e0; }
.k-boulder::after {
  content: ''; position: absolute; inset: 13%; border-radius: 46% 52% 44% 50%;
  background: radial-gradient(circle at 34% 30%, #d8d1c4, #8c8478 55%, #5a544c);
  box-shadow: inset -2px -2px 0 rgba(0,0,0,.28), 0 1px 0 rgba(0,0,0,.4);
}
.k-boulder::before { content: ''; position: absolute; left: 44%; top: 22%; width: 2px; height: 34%; background: #3d3832; transform: rotate(18deg); z-index: 1; }
.k-boulder.wob::before { content: '!'; left: auto; top: 0; right: 2px; width: auto; height: auto; background: none; transform: none; z-index: 2; }
.k-gp::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 35% 40%, #8bdc5a 0 9%, transparent 10%), radial-gradient(circle at 68% 62%, #8bdc5a 0 7%, transparent 8%), radial-gradient(circle at 60% 25%, #6fbf45 0 6%, transparent 7%);
  opacity: .85;
}
.wob { animation: wob .22s infinite; }
.wob::before { content: '!'; position: absolute; top: 0; right: 2px; font-family: var(--font-px); font-size: calc(var(--ts) * .38); color: #ffdd55; text-shadow: 0 0 2px #000; z-index: 2; }
@keyframes wob { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1.5px); } }
.k-water { background: linear-gradient(#4b8fcb, #2b5f92); color: #cfe9ff; font-weight: 700; }
.k-gas { background: var(--tn); color: #b6f08a; }
.k-gas::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(150, 230, 90, .55), rgba(110, 190, 60, .25) 70%); animation: gas 1.4s infinite alternate; }
@keyframes gas { from { opacity: .55; } to { opacity: .95; } }
.k-lava { background: radial-gradient(circle at 50% 45%, #ffe08a, #ff7a1a 55%, #b4330c); animation: glow 1.1s infinite alternate; }
@keyframes glow { from { filter: brightness(.9); } to { filter: brightness(1.2); } }
.k-station { background: var(--tn); box-shadow: inset 0 0 0 2px #e0c46c, 0 0 8px #e0c46c; }
.k-camp { background: radial-gradient(circle, #6d7582, var(--tn) 75%); }
.k-glowfloor { background: radial-gradient(circle, rgba(200, 205, 215, .22), transparent 70%), var(--tn); }
.k-beam { background: var(--tn); }
.k-beam::after { content: ''; position: absolute; left: 14%; right: 14%; top: 6%; bottom: 0; border: 3px solid #b07a43; border-bottom: none; border-radius: 2px 2px 0 0; }
.k-page { animation: glow 1.4s infinite alternate; }
.k-glim { background: #05080c; color: #ffe9a8; font-size: calc(var(--ts) * .45); animation: glim 1.6s infinite alternate; }
@keyframes glim { from { opacity: .25; } to { opacity: .9; } }
.k-sky { background: linear-gradient(#7f8d9a, #95a2ad); }
.k-sky.hi { background: linear-gradient(#66737f, #7f8d9a); }
.k-house { background: linear-gradient(#95a2ad, #a7b2ba); font-size: calc(var(--ts) * .78); cursor: pointer; }
.k-grass { background: #4a3626; box-shadow: inset 0 calc(var(--ts) * .28) 0 #5d9a52, inset 0 calc(var(--ts) * .34) 0 #3d6b43; }
.me { z-index: 1; }
.me::after { content: ''; position: absolute; inset: 1px; border: 2px solid var(--gold); border-radius: 3px; }
.me.hurt::after { border-color: var(--bad); }

/* 訊息 */
.log {
  background: #0b121a; border: 1px solid var(--line); border-radius: 9px;
  padding: 6px 9px; font-size: 12.5px; line-height: 1.5; height: calc(1.5em * 3 + 14px); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log div:not(:last-child) { opacity: .5; }
.log .good { color: var(--good); }
.log .warn { color: var(--warn); }
.log .bad { color: var(--bad); }
.log .layer { color: var(--gold); }
.log .page { color: #ffe9a8; }

/* 下一步 */
.next { background: #1f2b1d; border: 1px solid #3f5a3a; border-radius: 9px; padding: 4px 9px; font-size: 12.5px; color: #cfe8c4; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; cursor: pointer; }
.next b { color: var(--good); margin-right: 4px; }

/* 背包列 / 小鎮列 */
.strip { display: flex; gap: 5px; min-height: 34px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; font-size: 12px; white-space: nowrap; }
.chip .g { font-weight: 700; margin-right: 3px; }
.chip.empty { color: var(--muted); border-style: dashed; }
.town { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; width: 100%; }
.town button { background: #2b3b4c; border: 1px solid #52677e; border-bottom: 3px solid #405267; border-radius: 9px; padding: 5px 2px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.town button.new { border-color: var(--gold); box-shadow: 0 0 6px rgba(255, 209, 102, .45); }

/* 操作 */
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.items, .pad { display: grid; gap: 5px; grid-template-rows: 44px 44px; }
.items { grid-template-columns: 1fr 1fr; }
.pad { grid-template-columns: repeat(3, 1fr); }
.btn {
  background: #2b3b4c; border: 1px solid #52677e; border-bottom: 3px solid #405267; border-radius: 9px;
  padding: 0 4px; font-size: 13px; line-height: 1.1; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.btn:active { transform: translateY(1px); border-bottom-width: 2px; }
.btn[disabled] { opacity: .45; }
.btn .n { font-family: var(--font-px); font-size: 12px; color: var(--gold); }
.pad .btn { font-size: 18px; }
.pad .up { grid-column: 2; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; background: #6b4a2c; border-color: #a77649; border-bottom-color: #7e5631; }
.pad .right { grid-column: 3; grid-row: 2; }
.btn.ctx { background: #3b3424; border-color: #7a6a3f; border-bottom-color: #5f522f; }

/* 對話框 */
dialog {
  background: #1a2634; color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
  width: min(460px, calc(100% - 24px)); max-height: 86vh; padding: 0; overflow: hidden;
}
dialog::backdrop { background: rgba(0, 0, 0, .62); }
.sheet-in { display: flex; flex-direction: column; max-height: 86vh; }
.sheet-in h2 { margin: 0; padding: 14px 16px 8px; font-size: 18px; color: var(--gold); }
#shBody { padding: 0 16px 6px; overflow-y: auto; font-size: 14px; line-height: 1.7; user-select: text; -webkit-user-select: text; }
#shFoot { padding: 10px 16px 14px; display: flex; gap: 8px; }
#shFoot button { flex: 1; padding: 11px 6px; border-radius: 10px; background: #2b3b4c; border: 1px solid #52677e; border-bottom: 3px solid #405267; }
#shFoot button.primary { background: #6b4a2c; border-color: #a77649; border-bottom-color: #7e5631; }
#shBody p { margin: 8px 0; }
#shBody h3 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; letter-spacing: .05em; }
.letter { background: #f2e6c9; color: #3a2c1a; border-radius: 6px; padding: 12px 14px; white-space: pre-line; font-size: 14px; line-height: 1.85; box-shadow: inset 0 0 18px rgba(120, 90, 40, .25); }
.letter .date { display: block; font-weight: 700; margin-bottom: 4px; }
.narr { color: #d6cbb3; white-space: pre-line; }
.npc { display: flex; gap: 12px; align-items: flex-start; }
.npc .face { font-size: 40px; line-height: 1; flex: none; width: 46px; text-align: center; }
.npc .face img { width: 46px; height: 64px; object-fit: contain; display: block; }
.npc b { color: var(--gold); }
.npc small { color: var(--muted); margin-left: 6px; }
.npc .say { margin: 4px 0 0; }
.row {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  background: #223144; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 5px 0;
}
.row[disabled] { opacity: .5; }
.row .ri { font-size: 22px; flex: none; width: 28px; text-align: center; }
.row .rt { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.4; }
.row .rt small { display: block; color: var(--muted); font-size: 11.5px; }
.row .rp { font-family: var(--font-px); color: var(--gold); font-size: 13px; white-space: nowrap; }
.link { background: none; border: none; color: #8fc3ff; padding: 6px 0; font-size: 13px; min-height: 40px; min-width: 44px; }
.jlist .row .rt { font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13.5px; }
.kv span:nth-child(odd) { color: var(--muted); }
.seed { font-family: var(--font-px); font-size: 11px; color: var(--muted); }
.ver { text-align: right; font-size: 11px; color: var(--muted); margin-top: 6px; }
/* 行情條：綠 → 黃 → 紅，寬度＝目前價格占全價的比例 */
.mk { display: block; height: 5px; background: #0b121a; border-radius: 3px; margin-top: 3px; overflow: hidden; }
.mk i { display: block; height: 100%; border-radius: 3px; }
.sellrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; background: #223144; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 5px 0; }
.sellrow .nm { font-size: 13.5px; line-height: 1.35; min-width: 0; }
.sellrow .nm small { display: block; color: var(--muted); font-size: 11.5px; }
.sellrow .bt { display: flex; gap: 5px; }
.sellrow .bt button { background: #2b3b4c; border: 1px solid #52677e; border-bottom: 2px solid #405267; border-radius: 8px; padding: 5px 8px; font-size: 12.5px; white-space: nowrap; }
.sellrow .bt button[disabled] { opacity: .45; }
.cap { background: #0b121a; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 13px; margin: 6px 0; }
.cap .mk { height: 6px; }
.req { margin: 6px 0; font-size: 13px; }
.req .mk { height: 7px; }
.req.ok { color: var(--good); }
.opens { margin: 6px 0 0; padding-left: 20px; }
.opens li { margin: 3px 0; }
.big { font-size: 34px; text-align: center; margin: 6px 0 2px; }
.tag { display: inline-block; font-size: 11px; color: #1b2735; background: var(--gold); border-radius: 5px; padding: 0 5px; margin-left: 5px; vertical-align: 1px; }
.ledger { font-size: 12.5px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; }
.ledger .p { color: var(--good); text-align: right; font-family: var(--font-px); }
.ledger .m { color: var(--bad); text-align: right; font-family: var(--font-px); }

/* =====================================================================
 * 美術圖（sky-frontier/art/，與原版即時沙盒同一套）
 * 全部包在 html.art 底下：預載成功才加上 .art；缺任何一張就不加，維持上面的 CSS／emoji 畫法
 * 地層貼圖：256 px 的無縫材質鋪在 4×4 格上（.tx0~3／.ty0~3 依世界座標取材質的哪一塊），
 *          整片岩壁是連續的，再用 --tint 疊色分出各層色調；礦物是 64 px 去背圖疊在岩石上
 * 圖都是縮小顯示（64→26~40 px），不用 pixelated，縮小時讓瀏覽器平滑
 * ===================================================================== */
.art #map { position: relative; z-index: 1; }
.art .tile { --bx: 0px; --by: 0px; }
.art .tx1 { --bx: calc(var(--ts) * -1); } .art .tx2 { --bx: calc(var(--ts) * -2); } .art .tx3 { --bx: calc(var(--ts) * -3); }
.art .ty1 { --by: calc(var(--ts) * -1); } .art .ty2 { --by: calc(var(--ts) * -2); } .art .ty3 { --by: calc(var(--ts) * -3); }
/* 各層：--tex 岩石材質、--tint 疊色、--cave 挖空後的通道底圖 */
.art .L0, .art .L1 { --tex: url(art/tile-dirt.webp); --tint: rgba(120, 66, 28, .32); --cave: url(art/cave-dirt.webp); }
.art .L2 { --tex: url(art/tile-stone.webp); --tint: rgba(236, 226, 206, .3); --cave: url(art/cave-stone.webp); }
.art .L3 { --tex: url(art/tile-cobble.webp); --tint: rgba(30, 90, 140, .3); --cave: url(art/cave-stone.webp); }
.art .L4 { --tex: url(art/tile-deep.webp); --tint: rgba(125, 70, 200, .3); --cave: url(art/cave-stone.webp); }
.art .L5 { --tex: url(art/tile-bedrock.webp); --tint: rgba(160, 45, 15, .3); --cave: url(art/cave-deep.webp); }
.art .L6 { --tex: url(art/tile-ruin.webp); --tint: rgba(0, 0, 0, .05); --cave: url(art/cave-deep.webp); }
.art .L7 { --tex: url(art/tile-seal.webp); --tint: rgba(5, 10, 30, .38); --cave: url(art/cave-deep.webp); }
.art .tile.k-rock, .art .tile.k-ore, .art .tile.k-boulder, .art .tile.k-gp, .art .tile.k-page {
  background: linear-gradient(var(--tint), var(--tint)), var(--tex) var(--bx) var(--by) / calc(var(--ts) * 4) calc(var(--ts) * 4);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3), inset 1px 1px 0 rgba(255, 255, 255, .1);
}
.art .tile.k-empty, .art .tile.k-mem, .art .tile.k-gas, .art .tile.k-beam {
  background: linear-gradient(rgba(0, 0, 0, .4), rgba(0, 0, 0, .4)), var(--cave) var(--bx) var(--by) / calc(var(--ts) * 4) calc(var(--ts) * 4);
}
.art .tile.k-glowfloor { background: radial-gradient(circle, rgba(220, 210, 180, .25), transparent 70%), var(--cave) var(--bx) var(--by) / calc(var(--ts) * 4) calc(var(--ts) * 4); }
.art .tile.k-water { background: linear-gradient(rgba(70, 140, 205, .78), rgba(35, 85, 145, .88)), var(--cave) var(--bx) var(--by) / calc(var(--ts) * 4) calc(var(--ts) * 4); }

<script>
/* =====================================================================
 * 天穹拓荒（v2：回合制直向；以深掘礦工為底，經濟照「經濟模組規格書 v4.1」）
 * 結構：
 *   Miner —— 核心規則（地形生成、挖掘、落石／積水／岩漿／毒氣、經濟與時代），不碰 DOM，node 也能跑
 *            （sky-frontier/_sim.js 會把這段抽出來跑平衡模擬）
 *   下方 UI 區 —— 畫面、輸入、音效、存檔、劇情文字（只呼叫 Miner，不自己算錢）
 * 存檔：arcade-sky-frontier-save（整個狀態，v:2）。舊版即時沙盒留下的 {slot, era} 指標視同沒有存檔；
 *       沒有新存檔但有 arcade-deep-miner-save（v:1）時，開新局前問一次要不要接續（Miner.migrateV1）
 * 紀錄：arcade-sky-frontier-stats = { best: { era }, won, story: { plays, wins, best: { days, digs }, deepest } }
 *       best.era：到過的最高時代索引（0 起）；won：到過星辰時代（全破）
 *       story.best 內越小越好（全破天數、全破挖掘次數）；deepest 為到過的最深公尺數
 * ===================================================================== */

var Miner = (function () {
  'use strict';

  var W = 13;              // 地圖寬（格）
  var START_X = 6;         // 坑口所在的欄
  var CAMP_Y = 118;        // 爺爺營地的深度（格）
  var MAIN_END = 120;      // 主線結束；再往下是無盡的裂谷
  var M_PER_CELL = 2;      // 一格 = 2 公尺
  var SIM = 18;            // 只模擬玩家上下這麼多格內的落石與液體
  var PAGE_ROWS = [9, 25, 44, 64, 86, 106, 113];   // 七張散落的日記殘頁（第八張在營地）
  var MAIN_STATIONS = [14, 32, 54, 77, 102];       // 每層開頭附近的舊升降站

  // ---- 地層 ----
  // ores：[礦物, 機率, 最淺出現深度(可省)]；dark：越深越暗，從燈的半徑扣掉的格數
  var LAYERS = [
    { id: 'surface', name: '地表', from: 0, rock: 'soil', dark: 0, ores: [] },
    { id: 'soil', name: '表土層', from: 1, rock: 'soil', dark: 0,
      ores: [['stone', 0.17], ['coal', 0.12], ['copper', 0.05, 5]],
      intro: '鬆軟的泥土，偶爾夾著煤。這裡還聽得到上面的鳥叫。' },
    { id: 'lime', name: '石灰岩層', from: 13, rock: 'lime', dark: 0, boulder: 0.05,
      ores: [['copper', 0.11], ['iron', 0.07], ['coal', 0.05], ['fossil', 0.015]],
      intro: '灰白的岩壁。裂開的大石頭底下一空就會掉，看到它在晃就快閃開。' },
    { id: 'river', name: '地下河', from: 31, rock: 'shale', dark: 1, boulder: 0.03, water: 0.2,
      ores: [['silver', 0.08], ['iron', 0.06], ['copper', 0.04], ['jade', 0.02]],
      intro: '岩壁又濕又滑，到處是積水。從下面挖穿水囊，水會整個灌下來。' },
    { id: 'geode', name: '晶洞', from: 53, rock: 'crust', dark: 1, boulder: 0.02, gas: 0.045,
      ores: [['quartz', 0.1], ['amethyst', 0.05], ['silver', 0.04]],
      intro: '滿牆的晶石在燈下發亮。帶綠斑的岩塊是毒氣囊，敲開前先想好退路。' },
    { id: 'lava', name: '熔岩帶', from: 76, rock: 'basalt', dark: 2, boulder: 0.03, lava: 0.16,
      ores: [['gold', 0.06], ['obsidian', 0.05], ['ruby', 0.03]],
      intro: '空氣燙得刺鼻。發光的是岩漿，底下或旁邊一挖空，它就會流過來。' },
    { id: 'ruins', name: '遠古遺跡', from: 101, rock: 'brick', dark: 2, boulder: 0.03, gas: 0.02,
      ores: [['relic', 0.05], ['starsilver', 0.03], ['gold', 0.03]],
      intro: '整齊的石磚、磨平的台階……這不是灰燈鎮的礦工挖出來的。' },
    { id: 'abyss', name: '無底裂谷', from: 121, rock: 'abyss', dark: 3, boulder: 0.04, lava: 0.1, gas: 0.02,
      ores: [['abyssal', 0.04], ['starsilver', 0.03], ['ruby', 0.03]],
      intro: '連爺爺都沒來過的地方。越往下，石頭越硬。' }
  ];

  // ---- 礦物（放背包，回地表賣或捐） ----
  // v ＝ 規格書的「基準價值 V」（希爾）。回收商只付 V 的三成，所以 V 大約是深掘礦工舊售價的 3.3 倍，
  // 讓「全價回收」跟舊版手感差不多。每種礦自成一個「物品族」（收購飽和、捐獻遞減都按礦種累計）
  var ORES = {
    coal:       { name: '煤炭',   v: 20,   g: '●' },
    copper:     { name: '銅礦',   v: 40,   g: '●' },
    iron:       { name: '鐵礦',   v: 60,   g: '●' },
    fossil:     { name: '化石',   v: 120,  g: '🐚' },
    silver:     { name: '銀礦',   v: 150,  g: '●' },
    jade:       { name: '河玉',   v: 260,  g: '◆' },
    quartz:     { name: '石英',   v: 200,  g: '◆' },
    amethyst:   { name: '紫水晶', v: 400,  g: '◆' },
    obsidian:   { name: '黑曜石', v: 160,  g: '◆' },
    gold:       { name: '金礦',   v: 600,  g: '●' },
    ruby:       { name: '紅寶石', v: 1000, g: '◆' },
    relic:      { name: '古代遺物', v: 1500, g: '🏺' },
    starsilver: { name: '星銀',   v: 2200, g: '✦' },
    abyssal:    { name: '深淵晶', v: 3000, g: '◆' }
  };
  var ORE_IDS = Object.keys(ORES);

  // ---- 硬度（每敲一下扣掉十字鎬的挖掘力） ----
  var HARD = {
    soil: 1, stone: 2, lime: 3, shale: 6, crust: 9, basalt: 13, brick: 18, abyss: 22,
    coal: 2, copper: 3, iron: 4, fossil: 3, silver: 6, jade: 7, quartz: 8, amethyst: 10,
    obsidian: 14, gold: 13, ruby: 15, relic: 18, starsilver: 20, abyssal: 24
  };
  var NAMES = {
    soil: '泥土', stone: '碎石', lime: '石灰岩', shale: '頁岩', crust: '晶殼岩', basalt: '玄武岩',
    brick: '遺跡石磚', abyss: '深淵岩', boulder: '鬆動的大石', gaspocket: '帶綠斑的岩塊',
    page: '夾著紙頁的岩縫', lava: '岩漿', lavaf: '岩漿', water: '積水', gas: '毒氣',
    empty: '通道', station: '舊升降站', camp: '營地', beam: '支撐木', surface: '地面'
  };
  for (var on in ORES) NAMES[on] = ORES[on].name;

  // 玩家能站的格子
  var PASS = { empty: 1, surface: 1, station: 1, camp: 1, beam: 1, water: 1, gas: 1 };
  // 大石頭可以掉進去的格子
  var FALL_INTO = { empty: 1, water: 1, gas: 1 };

  // ---- 升級（索引 0 是初始）。能升到第幾級由時代決定：時代索引 e 最多到索引 e+1（UP_CAP） ----
  // 費用調整（節奏調參）：原值 → 這裡的值：原因
  //   十字鎬 Lv.2／Lv.3：120／450 → 80／300：開墾時代一天只帶回幾十希爾，原價要存半個多月才買得起第一把鎬子
  //   體力 Lv.2／Lv.3：100／380 → 70／260：同上，前期體力上限是另一個卡點
  var UP = {
    pick: { name: '十字鎬', unit: '挖掘力', lv: [1, 2, 3, 5, 7, 10], cost: [0, 80, 300, 1400, 3800, 8500] },
    bag:  { name: '背包',   unit: '容量',   lv: [8, 14, 22, 32, 46, 64], cost: [0, 90, 350, 1100, 2900, 6500] },
    lamp: { name: '礦燈',   unit: '照明',   lv: [2, 3, 4, 5, 6, 7], cost: [0, 70, 300, 900, 2300, 5000] },
    stam: { name: '體力',   unit: '上限',   lv: [30, 45, 65, 90, 120, 160], cost: [0, 70, 260, 1200, 3100, 7000] }
  };
  var ITEMS = {
    bomb: { name: '炸藥',     price: 35, max: 9 },
    beam: { name: '支撐木',   price: 12, max: 9 },
    rope: { name: '回城繩索', price: 40, max: 5 }
  };

  // =====================================================================
  // 經濟（照「經濟模組規格書 v4.1」的公式；常數為單機回合制節奏調整）
  // 每個常數註解寫「規格書原值 → 這裡的值：原因」。單機：活躍人數 N = 1，人數係數 S(N) = 0.15，
  // 下面的門檻直接寫單機值，不再另外乘 S(N)

    // 升級等級可以高於時代上限（從深掘礦工接續時），保留但不能再升
    for (var u in UP) S.up[u] = Math.max(0, Math.min(UP[u].lv.length - 1, S.up[u] | 0));
    for (var it in ITEMS) S.items[it] = Math.max(0, Math.min(ITEMS[it].max, S.items[it] | 0));
    S.bag = numMap(S.bag, ORES);
    for (var b in S.bag) S.bag[b] = Math.floor(S.bag[b]);
    // 第二版早期存檔沒有 donN：用目前的捐獻量 D ÷ V 估回顆數（D 有衰減，只會估少不會估多）
    if (!S.donN || typeof S.donN !== 'object') { S.donN = {}; for (var dk in (S.don || {})) if (ORES[dk]) S.donN[dk] = Math.round((+S.don[dk] || 0) / ORES[dk].v); }
    S.sat = numMap(S.sat, ORES); S.don = numMap(S.don, ORES); S.donN = numMap(S.donN, ORES);
    S.museum = numMap(S.museum, ORES);
    ['mod', 'hp', 'wob', 'gas', 'gear', 'wings', 'tut'].forEach(function (g) { if (!S[g] || typeof S[g] !== 'object' || Array.isArray(S[g])) S[g] = {}; });
    if (!S.today || typeof S.today !== 'object') S.today = d.today;
    S.today.sold = +S.today.sold || 0; S.today.specSold = +S.today.specSold || 0;
    if (!S.today.spec || typeof S.today.spec !== 'object') S.today.spec = {};
    if (!S.spec || typeof S.spec !== 'object') S.spec = d.spec;
    if (!S.spec.cool || typeof S.spec.cool !== 'object') S.spec.cool = {};
    ['a', 'b'].forEach(function (s) { var v = S.spec[s]; if (!v || !ORES[v.id] || typeof v.until !== 'number') S.spec[s] = null; });
    S.pages = Array.isArray(S.pages) ? S.pages.filter(function (p) { return p === (p | 0) && p >= 0 && p < 8; }) : [];
    S.stations = Array.isArray(S.stations) ? S.stations.filter(function (p) { return p === (p | 0) && p >= 0; }) : [];
    S.honor = Array.isArray(S.honor) ? S.honor.slice(0, HONOR_SLOTS) : [];
    S.ledger = Array.isArray(S.ledger) ? S.ledger.slice(-20) : [];
    S.era = Math.max(0, Math.min(ERAS.length - 1, S.era | 0));
    S.ciel = Math.max(0, Math.floor(+S.ciel || 0));
    S.eraCp = Math.max(0, +S.eraCp || 0); S.eraCiel = Math.max(0, S.eraCiel | 0);
    S.day = Math.max(1, S.day | 0);
    if (!Array.isArray(S.book) || !S.book.length) S.book = [];
    for (var e = 0; e <= S.era; e++) if (!S.book[e] || typeof S.book[e] !== 'object') S.book[e] = newBook(S.day);
    S.en = Math.max(0, Math.min(maxEnergy(S), S.en | 0));
    S.x = Math.max(0, Math.min(W - 1, S.x | 0));
    S.y = Math.max(0, S.y | 0);
    if (!isPassable(tileAt(S, S.x, S.y))) { S.x = START_X; S.y = 0; }
    rollSpec(S);
    return S;
  }
  // 深掘礦工（v:1）的存檔轉成天穹拓荒：地圖、升級、日記、升降站照搬；金幣 → 希爾；經濟欄位用預設
  function migrateV1(raw) {
    if (!raw || typeof raw !== 'object' || raw.v !== 1 || typeof raw.seed !== 'number' || !isFinite(raw.seed)) return null;
    try {
      var S = newState(raw.seed);
      ['x', 'y', 'en', 'bag', 'up', 'items', 'mod', 'hp', 'wob', 'gas', 'pages', 'stations', 'layer', 'maxY',
       'day', 'digs', 'tick', 'faints', 'glow', 'introSeen'].forEach(function (k) {
        if (k in raw && raw[k] !== null && typeof raw[k] === typeof S[k] && Array.isArray(raw[k]) === Array.isArray(S[k])) S[k] = raw[k];
      });
      S.ciel = Math.max(0, Math.floor(+raw.gold || 0));
      if (raw.won) { S.camp = true; S.campDay = raw.wonDay | 0; S.campDigs = raw.wonDigs | 0; if (S.pages.indexOf(7) < 0) S.pages.push(7); }
      S.tut = { sold: true, firstDay: true, migrated: true };
      S.book = [newBook(S.day | 0 || 1)];
      return fixup(S);
    } catch (e) { return null; }
  }

  // ---- 一次動作的事件收集（給 UI 顯示訊息、放音效、跳對話框） ----
  var CTX = null;
  var TR = { wet: false, hinted: {} };   // 不存檔的暫時狀態（提示只講一次）
  function log(text, cls) { if (CTX) CTX.ev.push({ k: 'log', text: text, cls: cls || '' }); }
  function sfx(name) { if (CTX) CTX.ev.push({ k: 'sfx', name: name }); }
  function ev(o) { if (CTX) CTX.ev.push(o); }
  function near(S, x, y) { return Math.abs(x - S.x) <= 6 && Math.abs(y - S.y) <= 6; }

  // soft：只扣到 0、不會昏倒（泡水只是讓人變慢，不該害人回不了家）
  function hurt(S, n, cause, soft) {
    if (S.en - n < 0) { S.en = 0; if (!soft && !CTX.faint) CTX.faint = cause; }
    else S.en -= n;
    CTX.hurt = true;
    ev({ k: 'hurt' });
  }

  function addOre(S, o) {
    if (bagCount(S) >= bagCap(S)) {
      log('背包塞不下了，只好把' + ORES[o].name + '留在原地敲碎。', 'warn');
      return false;
    }
    S.bag[o] = (S.bag[o] || 0) + 1;
    var full = bagCount(S) >= bagCap(S);
    log('拿到' + ORES[o].name + '（回收約 ' + Math.max(1, Math.round(unitPrice(S, o, SELL_RATE))) + ' 希爾）' + (full ? '——背包滿了！' : ''), full ? 'warn' : 'good');
    sfx(ORES[o].v >= 300 ? 'gem' : 'ore');
    return true;
  }

  function pageIndexAt(S, x, y) {
    var sp = specials(S.seed);
    for (var i = 0; i < sp.pages.length; i++) if (sp.pages[i].x === x && sp.pages[i].y === y) return i;
    return -1;
  }
  function getPage(S, i) {
    if (i < 0 || S.pages.indexOf(i) >= 0) return;

    sfx('page');
    ev({ k: 'page', i: i });
  }

  function releaseGas(S, x, y) {
    var q = [[x, y]], seen = {}, n = 0;
    seen[key(x, y)] = 1;
    while (q.length && n < 7) {
      var c = q.shift();
      var t = tileAt(S, c[0], c[1]);
      if (!(c[0] === x && c[1] === y) && t !== 'empty') continue;
      setT(S, c[0], c[1], 'gas');
      S.gas[key(c[0], c[1])] = 9;
      n++;
      [[1, 0], [-1, 0], [0, -1], [0, 1]].forEach(function (d) {
        var nx = c[0] + d[0], ny = c[1] + d[1], nk = key(nx, ny);
        if (!seen[nk] && ny >= 1 && nx >= 0 && nx < W) { seen[nk] = 1; q.push([nx, ny]); }
      });
    }
    log('噗——岩塊裂開，一股黃綠色的毒氣冒了出來！先退開幾步，走動一下它就散了。', 'bad');
    sfx('gas');
  }

  // 敲碎一格。moveIn：是否走進去（用鎬子挖會走進去，炸藥不會）
  function breakTile(S, x, y, t, moveIn) {
    if (t === 'gaspocket') { setT(S, x, y, 'empty'); releaseGas(S, x, y); return; }
    setT(S, x, y, 'empty');
    if (ORES[t]) addOre(S, t);
    else if (t === 'page') getPage(S, pageIndexAt(S, x, y));
    else if (t === 'boulder') log('大石頭碎成一地石屑。');
    if (moveIn) { S.x = x; S.y = y; onEnter(S); }
  }

  // 這趟用掉的體力夠不夠「收工過夜」
  function tiredEnough(S) { return S.en <= maxEnergy(S) * DAY_SPENT; }
  function arriveSurface(S, how) {
    if (how !== 'walk') S.x = START_X;
    S.y = 0;
    S.wob = {};
    TR.wet = false;
    TR.hinted = {};
    var rest = how === 'faint' || how === 'rescue' || tiredEnough(S);
    if (rest) {
      S.en = maxEnergy(S);
      newDay(S);
      // 引導：解釋過飽和的隔天開放集資箱；一直沒碰到飽和的話，第 3 天也先解釋一次
      if (S.tut.sold && !S.tut.sat && S.day >= 3) { S.tut.sat = true; S.tut.satDay = S.day; ev({ k: 'teach', what: 'sat' }); }
      else if (S.tut.sat && !S.tut.donate && S.day > (S.tut.satDay || 0)) { S.tut.donate = true; ev({ k: 'teach', what: 'donate' }); }
    }
    ev({ k: 'surface', how: how, rest: rest });
    var tail = rest ? '（第 ' + S.day + ' 天）' : '';
    if (how === 'walk') log('你爬出坑口，外面還起著霧。' + (rest ? '周伯遞來一杯熱茶。' : '') + tail, 'good');
    else if (how === 'elev') log('升降籃嘎吱嘎吱往上爬，坑口的光越來越亮。' + tail, 'good');
    else if (how === 'rope') log('你拉了拉腰間的繩索——三長兩短。沒多久就被拉回坑口了。' + tail, 'good');
    if (!rest) log('體力還剩一半以上，只是上來透口氣，還沒收工（日期不變）。');
    sfx('surface');
    checkEra(S);
  }

  // ---- 新的一天：飽和與捐獻慢慢恢復、每日額度重置、投機品換貨、財富持有稅 ----
  function newDay(S) {
    S.day++;
    S.book[S.era].days++;
    for (var o in S.sat) { S.sat[o] *= SAT_DECAY; if (S.sat[o] < 0.5) delete S.sat[o]; }
    for (var d in S.don) { S.don[d] *= DONATE_DECAY; if (S.don[d] < 0.5) delete S.don[d]; }
    S.today = { sold: 0, spec: {}, specSold: 0 };
    rollSpec(S);
    if (S.era >= TAX_FROM_ERA && S.day % WEALTH_PERIOD === 0) {
      var th = WEALTH_TH[S.era], over = S.ciel - th;
      if (th > 0 && over > 0) {
        var tax = Math.floor(Math.min(over, th * (WEALTH_MULT2 - 1)) * WEALTH_RATE1 + Math.max(0, S.ciel - th * WEALTH_MULT2) * WEALTH_RATE2);
        if (tax > 0) { spend(S, tax, 'wealth'); log('財富持有稅：存款超過 ' + th + ' 希爾的部分課稅，扣 ' + tax + ' 希爾。', 'warn'); }
      }
    }
  }
  // 投機品：兩個欄位錯開更換（奇數天換 a、偶數天換 b），每種擺 SPEC_DAYS 天；同一天、同一張地圖結果固定
  function rollSpec(S) {
    if (S.era < TAX_FROM_ERA || !S.gear.contract) return;
    ['a', 'b'].forEach(function (slot, si) {
      var cur = S.spec[slot];
      if (cur && cur.until > S.day) return;
      if (cur) S.spec.cool[cur.id] = S.day + SPEC_COOLDOWN;
      if (!cur && si === 1 && !S.spec.a) return;
      var other = S.spec[slot === 'a' ? 'b' : 'a'];
      var pool = SPEC_POOL.filter(function (id) { return !(S.spec.cool[id] > S.day) && !(other && other.id === id); });
      if (!pool.length) pool = SPEC_POOL.filter(function (id) { return !(other && other.id === id); });
      var id = pool[Math.floor(hash(S.seed, S.day, si, 31) * pool.length)];
      // 第一次開張時 b 欄只擺 2 天，之後兩欄就自然錯開
      S.spec[slot] = { id: id, until: S.day + (cur || si === 0 ? SPEC_DAYS : SPEC_DAYS - 1) };
    });
  }

  // ---- 錢包：所有加減錢都走這兩個函式並記帳（規格書 01 §1.2 唯一入口） ----
  var REASON = {
    sell: '回收', bm: '黑市收購', spec: '投機品', museum: '博物館獎金', wing: '收齊一館',
    tax: '交易稅', wealth: '財富持有稅', up: '升級', item: '雜貨', gear: '工匠', donate: '捐獻希爾', honor: '榮譽展位', debug: '測試'
  };
  function entry(S, n, why) {
    S.ledger.push([S.day, n, why]);
    if (S.ledger.length > 20) S.ledger.shift();
  }
  function earn(S, n, why) {
    n = Math.floor(n);
    if (n <= 0) return;
    S.ciel += n;
    var b = S.book[S.era]; b.inc[why] = (b.inc[why] || 0) + n;
    entry(S, n, why);
  }
  function spend(S, n, why) {
    n = Math.floor(n);
    if (n <= 0 || S.ciel < n) return false;
    S.ciel -= n;
    var b = S.book[S.era]; b.out[why] = (b.out[why] || 0) + n;
    entry(S, -n, why);
    return true;
  }

  // ---- 收購飽和與回收報價 ----
  function satOf(S, o) { return Math.exp(-(S.sat[o] || 0) / (SAT_K * ORES[o].v)); }
  function unitPrice(S, o, rate) { return ORES[o].v * rate * satOf(S, o); }
  function capOf(S) { return DAILY_CAP[S.era]; }
  function capLeft(S) { return Math.max(0, capOf(S) - S.today.sold); }
  // 這次賣出 gross（稅前）要扣多少交易稅：依當日已賣出（稅前）分段累進
  function taxFor(S, gross) {
    if (S.era < TAX_FROM_ERA || gross <= 0) return 0;
    var base = S.today.sold + S.today.specSold, lo = base, hi = base + gross, t = 0, prev = 0;
    for (var i = 0; i < TAX_TIERS.length; i++) {
      var top = TAX_TIERS[i][0], r = TAX_TIERS[i][1];
      var a = Math.max(lo, prev), b = Math.min(hi, top);
      if (b > a) t += (b - a) * r;
      prev = top;
    }
    return Math.floor(t);
  }
  // 連續遞減報價：從近期回收量 A 開始一顆一顆賣，每顆收入 ＝ rate × K × (e^(−A/K) − e^(−(A+V)/K))；
  // 一顆超過今天剩下的額度就停（規格書：超過上限的數量不收）。capUsed：同一批前面已經佔掉的額度
  function quote(S, o, n, rate, capUsed, satAdd) {
    var V = ORES[o].v, K = SAT_K * V, A = (S.sat[o] || 0) + (satAdd || 0);
    var room = capLeft(S) - (capUsed || 0), got = 0, k = 0;
    for (; k < n; k++) {
      var p = rate * K * (Math.exp(-(A + k * V) / K) - Math.exp(-(A + (k + 1) * V) / K));
      if (got + p > room + 1e-9) break;
      got += p;
    }
    return { id: o, n: k, gross: got, full: k * V * rate, capped: k < n };
  }
  // 整批報價：先賣單價高的（剩下便宜的比較適合拿去捐）
  function quoteAll(S, rate, only) {
    var ids = Object.keys(S.bag).filter(function (o) { return !only || only[o]; });
    ids.sort(function (a, b) { return unitPrice(S, b, rate) - unitPrice(S, a, rate); });
    var used = 0, list = [], n = 0, gross = 0, full = 0, capped = false;
    ids.forEach(function (o) {
      var q = quote(S, o, S.bag[o], rate, used);
      used += q.gross; gross += q.gross; full += q.full; n += q.n;
      if (q.capped) capped = true;
      list.push(q);
    });
    gross = Math.floor(gross);
    var tax = taxFor(S, gross);
    return { list: list, n: n, gross: gross, full: Math.round(full), tax: tax, net: gross - tax, capped: capped };
  }
  function doSell(S, o, n, rate, why) {
    if (!S.bag[o]) return null;
    var q = quote(S, o, Math.min(n, S.bag[o]), rate, 0);
    if (!q.n) return q;
    var gross = Math.floor(q.gross), tax = taxFor(S, gross);
    S.bag[o] -= q.n; if (!S.bag[o]) delete S.bag[o];
    S.sat[o] = (S.sat[o] || 0) + q.n * ORES[o].v;
    S.today.sold += gross;
    var b = S.book[S.era]; b.full += q.full; b.got += gross;
    earn(S, gross, why);
    if (tax) spend(S, tax, 'tax');
    q.gross = gross; q.tax = tax; q.net = gross - tax;
    return q;
  }
  // 投機品：固定 3V，不受飽和影響，每種每天 10 個、另有獨立每日上限
  function specList(S) {
    var out = [];
    if (S.era < TAX_FROM_ERA || !S.gear.contract) return out;
    ['a', 'b'].forEach(function (s) { var v = S.spec[s]; if (v && v.until > S.day) out.push(v); });
    return out;
  }
  function specQuote(S, o, n) {
    var on = specList(S).some(function (v) { return v.id === o; });
    if (!on || S.era < TAX_FROM_ERA || !S.gear.contract) return { n: 0, gross: 0 };
    var left = Math.min(n, SPEC_PER_DAY - (S.today.spec[o] || 0), S.bag[o] || 0);
    var price = ORES[o].v * SPEC_MULT, room = SPEC_CAP - S.today.specSold;
    var k = Math.max(0, Math.min(left, Math.floor(room / price)));
    return { n: k, gross: k * price, price: price };
  }
  // ---- 捐獻遞減與報價 ----
  function donateRate(S, o) { return Math.exp(-(S.don[o] || 0) / (DONATE_K * ORES[o].v)); }
  function cpQuote(S, o, n) {
    var T = DONATE_K * ORES[o].v, D = S.don[o] || 0, x = n * ORES[o].v;
    return T * (Math.exp(-D / T) - Math.exp(-(D + x) / T));
  }
  function eraNeed(S) { return ERAS[S.era + 1] || null; }
  // 捐滿 DONATE_MIN 顆的礦種數
  function donKinds(S) { var n = 0; for (var o in S.donN) if (ORES[o] && S.donN[o] >= DONATE_MIN) n++; return n; }
  function cpLeft(S) { var E = eraNeed(S); return E ? Math.max(0, E.cp - S.eraCp) : 0; }
  function cielLeft(S) { var E = eraNeed(S); return E ? Math.max(0, E.ciel - S.eraCiel) : 0; }
  // 下一個時代的各項條件：[{ k, label, have, need, ok }]
  function eraReqs(S) {
    var E = eraNeed(S);
    if (!E) return [];
    var r = [
      { k: 'cp', label: '文明點數', have: Math.floor(S.eraCp), need: E.cp },
      { k: 'ciel', label: '捐獻希爾', have: S.eraCiel, need: E.ciel }
    ];
    if (E.kinds) r.push({ k: 'kinds', label: '捐過的礦種（每種滿 ' + DONATE_MIN + ' 顆）', have: Math.min(E.kinds, donKinds(S)), need: E.kinds });
    if (E.pages) r.push({ k: 'pages', label: '日記殘頁', have: Math.min(E.pages, S.pages.filter(function (p) { return p < 7; }).length), need: E.pages });
    if (E.depth) r.push({ k: 'depth', label: '到過' + LAYERS[layerIndex(E.depth)].name + '（' + E.depth * M_PER_CELL + ' m）', have: Math.min(E.depth, S.maxY) * M_PER_CELL, need: E.depth * M_PER_CELL });
    if (E.camp) r.push({ k: 'camp', label: '找到爺爺的營地', have: S.camp ? 1 : 0, need: 1 });
    r.forEach(function (q) { q.ok = q.have >= q.need; });
    return r;
  }
  function checkEra(S) {
    var E = eraNeed(S);
    if (!E || !S.tut.era) return false;
    if (!eraReqs(S).every(function (q) { return q.ok; })) return false;
    S.era++;
    S.eraCp = 0; S.eraCiel = 0;
    S.book[S.era] = newBook(S.day);
    rollSpec(S);
    ev({ k: 'era', i: S.era });
    log('【' + ERAS[S.era].name + '】灰燈鎮進入了新的時代！', 'layer');
    sfx('era');
    if (S.era === ERAS.length - 1 && !S.won) {
      S.won = true; S.wonDay = S.day; S.wonDigs = S.digs;
      ev({ k: 'won' });
    }
    return true;
  }

  // ---- 引導：常駐一行「下一步」，一次只開放一個系統 ----
  function guide(S) {
    var t = S.tut, n = bagCount(S);
    if (!t.sold) {
      if (S.y > 0) return n ? '背包有礦了。往上走回坑口，或拉繩索回鎮上' : '往下挖，把礦石帶回地表';
      return n ? '到桂記（🏪）把礦石賣掉' : '點腳下的泥土，往下挖礦';
    }
    if (!t.sat) return S.ciel >= UP.bag.cost[1] && S.up.bag === 0 ? '錢夠了：到桂記把背包換大一點' : '多挖幾種礦帶回來賣，存錢升級鎬子和背包';
    if (!t.donate) return '同一種礦別一次賣太多。挖點不一樣的礦，明天行情會回來一些';
    if (!t.era) return '賣不動的礦拿去集資箱（🏛️）捐，換文明點數';
    var E = eraNeed(S);
    if (!E) return S.camp ? '星辰時代。裂谷底下還有更深的地方' : '去找爺爺的營地';
    var miss = eraReqs(S).filter(function (q) { return !q.ok; });
    if (!miss.length) return S.y > 0 ? '條件都齊了，回鎮上就能進入' + E.name : '條件都齊了';
    // 礦種不夠時先提示礦種（點數多半也是卡在這裡）
    var m = miss.filter(function (q) { return q.k === 'kinds'; })[0] || miss[0];
    var pre = '往' + E.name + '：';
    if (m.k === 'cp') return pre + '還差 ' + (m.need - m.have) + ' 文明點數——捐不同種類的礦最划算';
    if (m.k === 'ciel') return pre + '到集資箱捐 ' + (m.need - m.have) + ' 希爾';
    if (m.k === 'kinds') return pre + '再捐 ' + (m.need - m.have) + ' 種沒捐過的礦（每種 ' + DONATE_MIN + ' 顆）';
    if (m.k === 'pages') return pre + '再找 ' + (m.need - m.have) + ' 張日記殘頁（📖 看大概位置）';
    if (m.k === 'depth') return pre + '往下挖到 ' + m.need + ' 公尺';
    if (m.k === 'camp') return pre + '找到爺爺在最深處的營地';
    return pre;
  }

  function loseHalf(S) {
    var lost = 0;
    for (var o in S.bag) {
      var n = Math.ceil(S.bag[o] / 2);
      S.bag[o] -= n; lost += n;
      if (S.bag[o] <= 0) delete S.bag[o];
    }
    return lost;
  }
  function doFaint(S, cause) {
    var lost = loseHalf(S);
    S.faints++;
    arriveSurface(S, 'faint');
    ev({ k: 'faint', cause: cause, lost: lost });
    log('你昏了過去……醒來時躺在周伯的小屋裡。' + (lost ? '背包裡的礦石少了 ' + lost + ' 個。' : ''), 'bad');
    sfx('faint');
  }

  function onEnter(S) {
    var t = tileAt(S, S.x, S.y);
    if (S.y > S.maxY) S.maxY = S.y;
    var li = layerIndex(S.y);
    if (li > S.layer) {
      S.layer = li;
      if (LAYERS[li].intro) {
        log('【' + LAYERS[li].name + '】' + LAYERS[li].intro, 'layer');
        ev({ k: 'layer', i: li });
        sfx('layer');
      }
    }
    if (t === 'station') {
      var i = stationIndexOfRow(S.y);
      if (i >= 0 && S.stations.indexOf(i) < 0) {
        S.stations.push(i);
        S.stations.sort(function (a, b) { return a - b; });
        log('找到舊升降站！拉一下鈴，周伯那頭就知道了。之後可以從坑口直接搭下來。', 'good');
        sfx('bell');
      }
    }
    if (t === 'camp' && !S.camp) {
      S.camp = true;
      S.campDay = S.day;
      S.campDigs = S.digs;
      S.glow = true;
      if (S.pages.indexOf(7) < 0) S.pages.push(7);
      ev({ k: 'ending' });
      sfx('win');
    }
  }

  // ---- 世界的一個回合：落石、積水、岩漿、毒氣 ----
  function tick(S) {
    S.tick++;
    var y0 = Math.max(1, S.y - SIM), y1 = S.y + SIM;
    stepBoulders(S, y0, y1);
    stepLiquid(S, y0, y1, false);
    if (S.tick % 2 === 0) stepLiquid(S, y0, y1, true);   // 岩漿比水慢一半
    stepGas(S);
    if (tileAt(S, S.x, S.y) === 'water') {
      if (S.gear.boots) { if (!TR.wet) log('防水長靴擋住了冰水，腳還是乾的。'); }
      else {
        if (S.en > 0) hurt(S, 1, 'wade', true);
        if (!TR.wet) log('泡在冰冷的水裡，手腳不太聽使喚（每個動作多耗 1 體力）。', 'warn');
      }
      TR.wet = true;
    } else TR.wet = false;
    hints(S);
  }

  function stepBoulders(S, y0, y1) {
    var moved = {};
    for (var y = y1; y >= y0; y--) {
      for (var x = 0; x < W; x++) {
        var k = key(x, y);
        if (moved[k]) continue;
        if (tileAt(S, x, y) !== 'boulder') continue;
        var bt = tileAt(S, x, y + 1);
        var under = S.x === x && S.y === y + 1;
        if (!FALL_INTO[bt]) { delete S.wob[k]; continue; }
        if (!S.wob[k]) {
          // 第一回合只會晃，給玩家反應時間
          S.wob[k] = 1;
          if (under) log('頭頂的大石頭喀喀作響，細粉一直掉下來——快閃開！', 'warn');
          if (near(S, x, y)) sfx('creak');
          continue;
        }
        if (under) {
          setT(S, x, y, 'empty');
          var rd = S.gear.heat ? 5 : 10;
          hurt(S, rd, 'rock');
          log('砰！大石頭砸在你身上，碎成好幾塊。體力 -' + rd, 'bad');
          sfx('crash');
          ev({ k: 'shake' });
          continue;
        }
        setT(S, x, y, bt === 'water' ? 'water' : 'empty');
        setT(S, x, y + 1, 'boulder');
        S.wob[key(x, y + 1)] = 2;    // 還在往下掉，下一回合不再晃、直接掉
        moved[key(x, y + 1)] = 1;
        if (near(S, x, y)) sfx('thud');
      }
    }
  }

  function canFlow(S, x, y, lava) {
    if (x < 0 || x >= W || y < 1) return false;
    var t = tileAt(S, x, y);
    return t === 'empty' || t === 'gas' || (lava && t === 'water');
  }
  // 液體規則（刻意簡單、好預測）：能往下就往下；下面擋住時，旁邊空著而且旁邊的下面也空著才會流過去
  function stepLiquid(S, y0, y1, lava) {
    var moved = {};
    var first = (lava ? (S.tick >> 1) : S.tick) % 2 ? 1 : -1;
    for (var y = y1; y >= y0; y--) {
      for (var i = 0; i < W; i++) {
        var x = first > 0 ? i : W - 1 - i;
        var k = key(x, y);
        if (moved[k]) continue;
        var t = tileAt(S, x, y);
        if (lava ? (t !== 'lava' && t !== 'lavaf') : t !== 'water') continue;
        var tx = -1, ty = -1;
        if (canFlow(S, x, y + 1, lava)) { tx = x; ty = y + 1; }
        else {
          for (var j = 0; j < 2; j++) {
            var sx = x + (j ? -first : first);
            if (canFlow(S, sx, y, lava) && tileAt(S, sx, y) !== 'water' && canFlow(S, sx, y + 1, lava)) { tx = sx; ty = y; break; }
          }
        }
        if (tx < 0) {
          if (t === 'lavaf') setT(S, x, y, 'obsidian');   // 流出來的岩漿停下就冷成黑曜石
          continue;
        }
        var tt = tileAt(S, tx, ty);
        var hitMe = S.x === tx && S.y === ty;
        if (lava) {
          if (tt === 'water' && !hitMe) {
            setT(S, tx, ty, 'obsidian');
            if (near(S, tx, ty)) { log('滋——岩漿碰到水，冒出一大團白煙，凝成了黑曜石。'); sfx('hiss'); }
            continue;
          }
          if (hitMe) {
            setT(S, x, y, 'obsidian');
            var ld = S.gear.heat ? 5 : 15;
            hurt(S, ld, 'lava');
            log('岩漿漫到身上！' + (S.gear.heat ? '隔熱護具擋掉了大半熱度' : '你痛得大叫') + '，岩漿也冷成了黑曜石。體力 -' + ld, 'bad');
            sfx('burn');
            continue;
          }
          setT(S, x, y, 'empty');
          setT(S, tx, ty, 'lavaf');
          moved[key(tx, ty)] = 1;
        } else {
          setT(S, x, y, 'empty');
          setT(S, tx, ty, 'water');
          moved[key(tx, ty)] = 1;
          if (hitMe) {
            hurt(S, 2, 'flood', true);
            log('冰冷的水從頭頂灌下來！體力 -2', 'bad');
            sfx('splash');
          }
        }
      }
    }
  }

  function stepGas(S) {
    for (var k in S.gas) {
      S.gas[k]--;
      if (S.gas[k] <= 0) {
        delete S.gas[k];
        if (S.mod[k] === 'gas') {
          var p = k.split(',');
          setT(S, +p[0], +p[1], 'empty');
        }
      }
    }
    if (tileAt(S, S.x, S.y) === 'gas' && !S.gear.mask) {
      hurt(S, 2, 'gas');
      log('咳、咳……毒氣嗆得你眼淚直流！體力 -2', 'bad');
      sfx('cough');
    }
  }

  // 靠近危險時的提示（每個地點只講一次）
  function hints(S) {
    for (var dy = -1; dy <= 1; dy++) {
      for (var dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        var x = S.x + dx, y = S.y + dy, k = key(x, y);
        if (TR.hinted[k]) continue;
        var t = tileAt(S, x, y);
        if (t === 'gaspocket' && (dx === 0 || dy === 0)) {
          TR.hinted[k] = 1;
          log('空氣裡有股甜甜的怪味，像放爛的水果……旁邊那塊帶綠斑的岩塊是毒氣囊。', 'warn');
        } else if (t === 'lava' || t === 'lavaf') {
          TR.hinted[k] = 1;
          log('一陣熱風撲在臉上——岩漿就在旁邊。別把它下面挖空。', 'warn');
        } else if (t === 'water' && dy === -1 && dx === 0) {
          TR.hinted[k] = 1;
          log('頭頂的岩縫在滴水，上面是積水。', 'warn');
        }
      }
    }
  }

  // ---- 玩家動作 ----
  function cmdMove(S, dx, dy) {
    var nx = S.x + dx, ny = S.y + dy;
    if (nx < 0 || nx >= W) { log('再過去是整片花崗岩壁，鎬子敲上去只冒火花。'); sfx('nope'); return; }
    if (ny < 0) return;
    if (S.y === 0 && ny === 0) { S.x = nx; sfx('step'); return; }           // 在鎮上走動
    if (ny === 0) { S.x = nx; arriveSurface(S, 'walk'); return; }           // 爬出坑口
    var t = tileAt(S, nx, ny);
    if (t === 'lava' || t === 'lavaf') { log('那是岩漿！熱氣燙得你縮回手。', 'warn'); sfx('hiss'); return; }
    if (PASS[t]) {
      S.x = nx; S.y = ny;
      sfx('step');
      onEnter(S);
      tick(S);
      return;
    }
    var h = hardness(t, ny);
    if (!h) { log('這裡挖不動。'); return; }
    if (S.en <= 0) {
      log('你累得抬不起鎬子了。可以走回升降站、拉繩索，或吹哨子請周伯拉你上去。', 'warn');
      sfx('nope');
      ev({ k: 'tired' });
      return;
    }
    S.en -= 1;
    S.digs++;
    var k = key(nx, ny);
    var first = !(k in S.hp);
    var left = (first ? h : S.hp[k]) - power(S);
    if (left > 0) {
      S.hp[k] = left;
      if (first) log(NAMES[t] + '很硬，還要再敲 ' + Math.ceil(left / power(S)) + ' 下。');
      sfx('dig');
    } else {
      sfx(t === 'boulder' ? 'crash' : 'break');
      breakTile(S, nx, ny, t, true);
    }
    tick(S);
  }

  function cmdBomb(S) {
    if (S.y === 0) { log('在鎮上點炸藥？阿桂姨會拿掃把追著你打。'); return; }
    if (S.items.bomb <= 0) { log('身上沒有炸藥了。阿桂姨的店裡有賣。', 'warn'); return; }
    S.items.bomb--;
    sfx('boom');
    ev({ k: 'shake' });
    var n = 0;
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      var x = S.x + dx, y = S.y + dy;
      if (y < 1 || x < 0 || x >= W) continue;
      var t = tileAt(S, x, y);
      if (PASS[t] || t === 'lava' || t === 'lavaf' || !hardness(t, y)) continue;
      breakTile(S, x, y, t, false);
      n++;
    }
    log('轟！炸藥炸開了周圍 ' + n + ' 格。', 'good');
    tick(S);
  }

  function cmdBeam(S) {
    if (S.y === 0) return;
    var t = tileAt(S, S.x, S.y);
    if (S.items.beam <= 0) { log('支撐木用完了。', 'warn'); return; }
    if (t !== 'empty' && t !== 'gas') { log(t === 'water' ? '泡在水裡架不穩支撐木。' : '這裡不用架支撐木。'); return; }
    S.items.beam--;
    setT(S, S.x, S.y, 'beam');
    log('你把支撐木牢牢卡在頭頂，上面的石頭掉不下來了。', 'good');
    sfx('beam');
    tick(S);
  }

  function act(S, cmd) {
    CTX = { ev: [], faint: null, hurt: false };
    var ctx = CTX;
    var ok = true;
    switch (cmd.t) {
      case 'move': cmdMove(S, cmd.dx, cmd.dy); break;
      case 'bomb': cmdBomb(S); break;
      case 'beam': cmdBeam(S); break;
      case 'rope':
        if (S.y === 0) { ok = false; break; }
        if (S.items.rope <= 0) { log('沒有繩索了。', 'warn'); ok = false; break; }
        S.items.rope--;
        arriveSurface(S, 'rope');
        break;
      case 'rescue':
        if (S.y === 0) { ok = false; break; }
        var lost = loseHalf(S);
        log('你吹響爺爺的銅哨。過了好久，繩子從上面垂下來，周伯把你一路拉了上去。' + (lost ? '背包太重，只好丟掉 ' + lost + ' 個礦石。' : ''), 'warn');
        arriveSurface(S, 'rescue');
        break;
      case 'elevUp':
        if (tileAt(S, S.x, S.y) !== 'station') { ok = false; break; }
        arriveSurface(S, 'elev');
        break;
      case 'elevDown':
        if (S.y !== 0 || S.stations.indexOf(cmd.i) < 0) { ok = false; break; }
        var st = stationPos(S.seed, cmd.i);
        S.x = st.x; S.y = st.y;
        log('升降籃晃啊晃地往下降，停在 ' + st.y * M_PER_CELL + ' 公尺的舊升降站。', 'good');
        sfx('elev');
        onEnter(S);
        break;
      case 'sell':      // { id, n, shop: 'scrap' | 'bm' }
      case 'sellAll':   // { shop }
        ok = cmdSell(S, cmd);
        break;
      case 'spec':      // { id, n }
        if (S.y !== 0) { ok = false; break; }
        var sq = specQuote(S, cmd.id, cmd.n || 1);
        if (!sq.n) { log('今天這種投機品收不了了（每種每天 ' + SPEC_PER_DAY + ' 個、總額 ' + SPEC_CAP + ' 希爾）。', 'warn'); ok = false; break; }
        var stx = taxFor(S, sq.gross);
        S.bag[cmd.id] -= sq.n; if (!S.bag[cmd.id]) delete S.bag[cmd.id];
        S.today.spec[cmd.id] = (S.today.spec[cmd.id] || 0) + sq.n;
        S.today.specSold += sq.gross;
        earn(S, sq.gross, 'spec');
        if (stx) spend(S, stx, 'tax');
        log('老韓收走 ' + sq.n + ' 個' + ORES[cmd.id].name + '，' + sq.gross + ' 希爾' + (stx ? '（稅 ' + stx + '）' : '') + '。', 'good');
        sfx('coin');
        break;
      case 'donate':    // { id, n } 或 { all: true }
        ok = cmdDonate(S, cmd);
        break;
      case 'donateCiel':   // { n }
        if (S.y !== 0 || !S.tut.era || !eraNeed(S)) { ok = false; break; }
        var dn = Math.min(cmd.n | 0, cielLeft(S), S.ciel);
        if (dn <= 0) { ok = false; break; }
        spend(S, dn, 'donate');
        S.eraCiel += dn;
        log('捐了 ' + dn + ' 希爾給拓荒團。', 'good');
        sfx('buy');
        checkEra(S);
        break;
      case 'museum':    // { id }
        ok = cmdMuseum(S, cmd.id);
        break;
      case 'honor':
        if (S.y !== 0 || S.era < HONOR_FROM_ERA || S.honor.length >= HONOR_SLOTS) { ok = false; break; }
        var hp = honorPrice(S);
        if (!spend(S, hp, 'honor')) { log('還差 ' + (hp - S.ciel) + ' 希爾。', 'warn'); ok = false; break; }
        S.honor.push({ day: S.day, ore: bestOre(S) });
        log('博物館牆上多了一塊刻著你名字的銅牌。', 'good');
        sfx('win');
        break;
      case 'gear':      // { id }
        var g = GEAR[cmd.id];
        if (!g || S.y !== 0 || S.era < 1 || S.gear[cmd.id] || S.era < g.era) { ok = false; break; }
        if (!spend(S, g.price, 'gear')) { log('還差 ' + (g.price - S.ciel) + ' 希爾。', 'warn'); ok = false; break; }
        S.gear[cmd.id] = true;
        if (cmd.id === 'contract') rollSpec(S);
        log('買下' + g.name + '：' + g.desc + '。', 'good');
        sfx('buy');
        break;
      case 'up':
        var u = UP[cmd.id], lv = S.up[cmd.id];
        if (!u || S.y !== 0 || lv >= upCap(S, cmd.id)) { ok = false; break; }
        var cost = u.cost[lv + 1];
        if (!spend(S, cost, 'up')) { log('還差 ' + (cost - S.ciel) + ' 希爾。', 'warn'); ok = false; break; }
        S.up[cmd.id] = lv + 1;
        if (cmd.id === 'stam') S.en = maxEnergy(S);
        log(u.name + '升到 Lv.' + (lv + 2) + '！' + u.unit + ' ' + u.lv[lv] + ' → ' + u.lv[lv + 1], 'good');
        sfx('buy');
        break;
      case 'buy':
        var it = ITEMS[cmd.id];
        if (!it || S.y !== 0) { ok = false; break; }
        if (S.items[cmd.id] >= it.max) { log(it.name + '最多帶 ' + it.max + ' 個。'); ok = false; break; }
        if (!spend(S, it.price, 'item')) { log('還差 ' + (it.price - S.ciel) + ' 希爾。', 'warn'); ok = false; break; }
        S.items[cmd.id]++;
        log('買了一個' + it.name + '。', 'good');
        sfx('buy');
        break;
      default: ok = false;
    }
    if (ctx.faint) doFaint(S, ctx.faint);
    CTX = null;
    ctx.ok = ok;
    return ctx;
  }

  function cmdSell(S, cmd) {
    if (S.y !== 0) return false;
    var bm = cmd.shop === 'bm';
    if (bm && !(S.era >= TAX_FROM_ERA && S.gear.contract)) return false;
    var rate = bm ? BM_RATE : SELL_RATE, why = bm ? 'bm' : 'sell';
    if (!bagCount(S)) { log('背包是空的。'); return false; }
    if (capLeft(S) <= 0) { log('今天的回收額度用完了（' + capOf(S) + ' 希爾）。賣不掉的可以留著明天賣，或拿去捐。', 'warn'); return false; }
    var ids;
    if (cmd.t === 'sellAll') {
      ids = Object.keys(S.bag).sort(function (a, b) { return unitPrice(S, b, rate) - unitPrice(S, a, rate); });
    } else {
      if (!S.bag[cmd.id]) return false;
      ids = [cmd.id];
    }
    var n = 0, gross = 0, tax = 0, left = false;
    ids.forEach(function (o) {
      var q = doSell(S, o, cmd.t === 'sellAll' ? S.bag[o] : (cmd.n || 1), rate, why);
      if (!q) return;
      n += q.n; gross += q.gross || 0; tax += q.tax || 0;
      if (q.capped) left = true;
    });
    if (!n) { log('今天剩下的額度不夠賣這個了。', 'warn'); return false; }
    log((bm ? '老韓' : '阿桂姨') + '收走 ' + n + ' 個礦石，' + gross + ' 希爾' + (tax ? '（交易稅 ' + tax + '）' : '') + '。' + (left ? '今天的額度滿了，剩下的留著。' : ''), 'good');
    sfx('coin');
    var first = !S.tut.sold;
    S.tut.sold = true;
    if (first) ev({ k: 'teach', what: 'sold' });
    // 第一次有一種礦行情掉到六成以下：解釋行情條與多樣化
    if (!S.tut.sat && ids.some(function (o) { return satOf(S, o) < 0.6; })) { S.tut.sat = true; S.tut.satDay = S.day; ev({ k: 'teach', what: 'sat' }); }
    return true;
  }
  function cmdDonate(S, cmd) {
    if (S.y !== 0 || !S.tut.donate) return false;
    var ids = cmd.all ? Object.keys(S.bag) : (S.bag[cmd.id] ? [cmd.id] : []);
    if (!ids.length) return false;
    var cp = 0, n = 0;
    ids.forEach(function (o) {
      var k = cmd.all ? S.bag[o] : Math.min(cmd.n || 1, S.bag[o]);
      var got = cpQuote(S, o, k);
      S.don[o] = (S.don[o] || 0) + k * ORES[o].v;
      S.donN[o] = (S.donN[o] || 0) + k;
      S.bag[o] -= k; if (!S.bag[o]) delete S.bag[o];
      cp += got; n += k;
    });
    if (eraNeed(S)) S.eraCp += cp;
    S.book[S.era].cp += cp;
    log('捐了 ' + n + ' 個礦石，文明點數 +' + Math.round(cp) + '。', 'good');

  // ---------------- 狀態與存檔 ----------------
  var S = null;
  var saveTimer = null;
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (!S || S === PLACEHOLDER) return;
    lsSet(SAVE_KEY, S);
    var dirty = false;
    var dm = meters(S.maxY);
    if (dm > (stats.story.deepest || 0)) { stats.story.deepest = dm; dirty = true; }
    if (S.era > (stats.best.era | 0)) { stats.best.era = S.era; dirty = true; }
    if (dirty) saveStats();
  }
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }

  function newSeed() {
    var a = new Uint32Array(1);
    try { crypto.getRandomValues(a); } catch (e) { a[0] = Math.floor(Math.random() * 4294967296); }
    return a[0] >>> 0;
  }
  function startNewGame() {
    S = M.newState(newSeed());
    M.resetTransient();
    stats.story.plays++;
    saveStats();
    logs = [];
    pushLog('坑口的霧很濃。點腳下的泥土，開始往下挖吧。');
    saveNow();
    layout();
    openPrologue();
  }

  function preloadArt(done) {
    if (DEBUG && /[?&]noart=1/.test(location.search)) { done(false); return; }   // 測試退路：?debug=1&noart=1
    var left = ART_LIST.length, failed = false, finished = false;

    var timer = setTimeout(function () { finish(false); }, 8000);
    ART_LIST.forEach(function (n) {
      var im = new Image();
      im.onload = function () { if (--left === 0 && !failed) { clearTimeout(timer); finish(true); } };
      im.onerror = function () { failed = true; clearTimeout(timer); finish(false); };
      im.src = 'art/' + n + '.webp';
      artImgs.push(im);
    });
  }

  // 鎮上的房子：時代開放到哪裡，就蓋到哪裡。[建築種類（對應 CSS .b-*）, 沒有圖時的 emoji]
  function townIcons() {
    var t = { 1: ['tree', '🌲'], 2: ['shop', '🏪'], 4: ['smith', '⚒️'], 6: ['zhou', '🏚️'], 8: ['home', '🏡'], 11: ['tree', '🌲'], 12: ['tree', '🌲'] };
    if (S.tut.donate) t[0] = ['office', '🏛️'];
    if (S.era >= 1) { t[3] = ['artisan', '🔨']; t[9] = ['museum', '🏺']; }
    if (S.era >= M.TAX_FROM_ERA && S.gear.contract) t[10] = ['bm', '🎒'];
    else t[10] = ['tree', '🌲'];
    return t;
  }
  var TOWN_NPC = { 0: 'office', 2: 'guei', 3: 'artisan', 4: 'bing', 6: 'zhou', 8: 'home', 9: 'museum', 10: 'bm' };
  function npcOpen(id) {
    if (id === 'office') return !!S.tut.donate;
    if (id === 'artisan' || id === 'museum') return S.era >= 1;
    if (id === 'bm') return S.era >= M.TAX_FROM_ERA && !!S.gear.contract;
    return true;
  }

  function buildGrid() {
    var map = $('map');
    map.innerHTML = '';
    map.style.gridTemplateColumns = 'repeat(' + COLS + ', var(--ts))';
    cells = []; lastCls = []; lastTxt = [];
    var frag = document.createDocumentFragment();
    for (var i = 0; i < COLS * ROWS; i++) {
      var d = document.createElement('div');
      d.className = 'tile';
      d.dataset.i = i;
      frag.appendChild(d);
      cells.push(d); lastCls.push(''); lastTxt.push('');
    }
    map.appendChild(frag);
  }

  var inLayout = false;
  function layout() {
    if (inLayout) return;
    inLayout = true;
    var wrap = $('mapWrap');
    var w = wrap.clientWidth - 12;
    var ts = Math.max(18, Math.min(40, Math.floor(w / COLS)));
    document.documentElement.style.setProperty('--ts', ts + 'px');
    if (S) renderStrip();
    // 先用最少列數算出其他元件的高度，剩下的空間給地圖
    var map = $('map');
    var oldRows = ROWS;
    var appH = $('app').offsetHeight - map.offsetHeight;
    var bodyPad = 24;
    var avail = window.innerHeight - appH - bodyPad;
    var rows = Math.max(8, Math.min(16, Math.floor(avail / ts)));
    if (rows !== oldRows || !cells.length) { ROWS = rows; buildGrid(); }
    inLayout = false;
    render();
  }

  // 一格要畫成什麼：回傳 [class, 文字]
  function look(wx, wy, R) {
    if (wy < 0) {
      if (wy === -1) { var ti = townIcons(); if (ti[wx]) return ['k-house b-' + ti[wx][0], ART_OK ? '' : ti[wx][1]]; }
      // 有圖時房子會往上長到第 -2 列，時代旗子改放高一列；雲改由背景圖的天空表現
      if (wy === (ART_OK ? -3 : -2) && wx === 6 && S.era > 0) return ['k-sky hi', M.ERAS[S.era].icon];
      if (!ART_OK && wy === -2 && (wx === 3 || wx === 9)) return ['k-sky hi', '☁️'];
      return [wy <= -2 ? 'k-sky hi' : 'k-sky', ''];
    }
    var t = M.tileAt(S, wx, wy);
    if (t === 'wall') return ['k-dark', ''];
    var me = wx === S.x && wy === S.y;
    var TX = ' tx' + (wx & 3) + ' ty' + (wy & 3);   // 材質取 4×4 的哪一塊（有圖時用）
    var ME_TXT = ART_OK ? '' : '👷';
    if (wy === 0) return ['L0 k-grass' + TX + (me ? ' me' : ''), me ? ME_TXT : ''];
    var li = M.layerIndex(wy);
    var L = ' L' + li + TX;
    var dx = wx - S.x, dy = wy - S.y, d2 = dx * dx + dy * dy;
    var lit = d2 <= R * R + R;
    var dim = !lit && d2 <= (R + 1) * (R + 1) + R + 1;
    var known = !!S.mod[wx + ',' + wy];
    var sp = M.specials(S.seed);
    var nearCamp = Math.abs(wx - sp.camp.x) <= 3 && wy >= M.CAMP_Y - 3 && wy <= M.CAMP_Y + 1;
    // 自己會發光的東西：岩漿、升降站、營地附近的灰光
    var glow = t === 'lava' || t === 'lavaf' || t === 'station' || t === 'camp' || nearCamp;
    if (!lit && !dim && !glow) {
      if (t === 'page' && d2 <= (R + 3) * (R + 3)) return ['k-glim', '✦'];
      // 礦脈探測器：燈光外兩格內的礦石微微發亮
      if (S.gear.scope && M.ORES[t] && d2 <= (R + 2) * (R + 2) + R) return ['k-glim', M.ORES[t].g];
      if (known && M.isPassable(t)) return [L + ' k-mem', ''];
      return ['k-dark', ''];
    }
    var cls, txt = '';
    switch (t) {
      case 'empty': cls = nearCamp ? 'k-glowfloor' : 'k-empty'; break;
      case 'water': cls = 'k-water'; txt = '≈'; break;
      case 'gas': cls = 'k-gas'; txt = '∴'; break;
      case 'lava': case 'lavaf': cls = 'k-lava'; break;
      case 'station': cls = 'k-station'; txt = ART_OK ? '' : '🚡'; break;
      case 'camp': cls = 'k-camp'; txt = ART_OK ? '' : '⛺'; break;
      case 'beam': cls = 'k-beam'; break;
      case 'boulder': cls = 'k-boulder' + (S.wob[wx + ',' + wy] ? ' wob' : ''); break;
      case 'gaspocket': cls = 'k-gp'; break;
      case 'page': cls = 'k-page'; txt = '📜'; break;
      default:
        if (M.ORES[t]) { cls = 'k-ore o-' + t; txt = ART_OK && ORE_ART[t] ? '' : M.ORES[t].g; }
        else cls = 'k-rock' + (M.hash(S.seed, wx, wy, 5) < 0.5 ? ' v1' : '');
    }
    cls += L;
    if (me) { cls += ' me' + (hurtFlash ? ' hurt' : ''); txt = ME_TXT; }
    else if (dim && !glow) cls += ' dim';
    return [cls, txt];
  }

  var hurtFlash = false;
  var face = 1;        // 礦工朝向：1 向右、-1 向左（最後一次左右移動的方向）
  var stripH = -1;
  function render() {
    if (!S) return;
    var R = M.lightRadius(S);
    // 有圖時地表上方多留兩列天空（房子有高度、背景才看得到山）
    camTop = Math.max(ART_OK ? -4 : -2, S.y - Math.floor(ROWS * 0.42));
    if (ART_OK) {
      var wrapEl = $('mapWrap'), skyEl = $('sky');
      wrapEl.style.setProperty('--skyH', Math.max(0, -camTop) * cells[0].offsetHeight + 'px');
      skyEl.classList.toggle('aether', S.era >= 3);
      $('map').style.setProperty('--face', face);
    }
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var i = r * COLS + c;
        var lk = look(c, camTop + r, R);
        var cls = 'tile ' + lk[0];
        if (cls !== lastCls[i]) { cells[i].className = cls; lastCls[i] = cls; }
        if (lk[1] !== lastTxt[i]) { cells[i].textContent = lk[1]; lastTxt[i] = lk[1]; }
      }
    }
    // 狀態列
    var maxE = M.maxEnergy(S);
    $('vDepth').textContent = meters(S.y) + ' m';
    $('vEnergy').textContent = S.en + '/' + maxE;
    $('eFill').style.width = Math.round(S.en / maxE * 100) + '%';
    $('eBar').classList.toggle('low', S.en <= maxE * 0.25);
    var bc = M.bagCount(S), cap = M.bagCap(S);
    $('vBag').textContent = bc + '/' + cap;
    $('bagStat').classList.toggle('full', bc >= cap);
    $('vGold').textContent = S.ciel;
    var L = M.LAYERS[M.layerIndex(S.y)];
    $('vWhere').textContent = S.y === 0 ? '灰燈鎮 · ' + M.ERAS[S.era].name + ' · 第 ' + S.day + ' 天' : L.name + ' · 日記 ' + S.pages.length + '/8';
    var g = M.guide(S);
    $('vNext').innerHTML = '<b>下一步</b>' + esc(g);
    $('vNext').title = g;
    $('nBomb').textContent = S.items.bomb;
    $('nBeam').textContent = S.items.beam;
    $('nRope').textContent = S.items.rope;
    $('bBomb').disabled = S.y === 0 || !S.items.bomb;
    $('bBeam').disabled = S.y === 0 || !S.items.beam;
    $('bRope').disabled = S.y === 0 || !S.items.rope;
    var ctxBtn = $('bCtx');
    if (S.y === 0) ctxBtn.textContent = '🚡 升降籃';
    else if (M.tileAt(S, S.x, S.y) === 'station') ctxBtn.textContent = '🚡 回地表';
    else ctxBtn.textContent = '📯 求救';
    renderStrip();
    renderLog();
    // 小鎮列與背包列高度不同（房子越蓋越多會變兩排）：高度變了就重新分配地圖列數
    var h = $('strip').offsetHeight;
    if (stripH >= 0 && h !== stripH && !inLayout) { stripH = h; setTimeout(layout, 0); }
    stripH = h;
  }

  function townList() {
    var list = [['guei', '🏪 桂記'], ['bing', '⚒️ 阿炳'], ['zhou', '👴 周伯']];
    if (npcOpen('office')) list.push(['office', '🏛️ 集資箱']);
    if (npcOpen('artisan')) list.push(['artisan', '🔨 工匠']);
    if (npcOpen('museum')) list.push(['museum', '🏺 博物館']);
    if (npcOpen('bm')) list.push(['bm', '🎒 老韓']);
    return list;
  }
  function renderStrip() {
    var el = $('strip');
    if (S.y === 0) {
      el.innerHTML = '<div class="town">' + townList().map(function (b) {
        var fresh = b[0] !== 'guei' && b[0] !== 'bing' && b[0] !== 'zhou' && !S.tut['v_' + b[0]];
        return '<button type="button" data-npc="' + b[0] + '"' + (fresh ? ' class="new"' : '') + '>' + b[1] + '</button>';
      }).join('') + '</div>';
      return;
    }
    var keys = Object.keys(S.bag);
    if (!keys.length) { el.innerHTML = '<span class="chip empty">背包空空的</span>'; return; }
    keys.sort(function (a, b) { return M.ORES[b].v - M.ORES[a].v; });
    el.innerHTML = keys.map(function (o) {
      return '<span class="chip">' + oreIcon(o) +
        M.ORES[o].name + '×' + S.bag[o] + '</span>';
    }).join('') + '<span class="chip">回收估 ' + M.quoteAll(S, M.SELL_RATE).gross + ' 希爾</span>';
  }

  var bannerTimer = null;
  function banner(text) {
    var b = $('banner');
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { b.classList.remove('show'); }, 2200);
  }
  function flash(cls) {
    var w = $('mapWrap');
    w.classList.remove(cls); void w.offsetWidth; w.classList.add(cls);
    setTimeout(function () { w.classList.remove(cls); }, 400);
  }

  // ---------------- 執行一個動作 ----------------
  var pendingSheets = [];
  function doAct(cmd) {
    if (!S) return null;
    if (cmd.t === 'move' && cmd.dx) face = cmd.dx < 0 ? -1 : 1;
    var ctx = M.act(S, cmd);
    var stop = false;
    ctx.ev.forEach(function (e) {
      if (e.k === 'log') { pushLog(e.text, e.cls); if (e.cls === 'warn' || e.cls === 'bad' || e.cls === 'layer' || e.cls === 'page') stop = true; }
      else if (e.k === 'sfx') SFX.play(e.name);
      else if (e.k === 'hurt') { hurtFlash = true; flash('hit'); buzz(60); setTimeout(function () { hurtFlash = false; render(); }, 300); stop = true; }
      else if (e.k === 'shake') flash('boom');
      else if (e.k === 'layer') banner(M.LAYERS[e.i].name + ' · ' + meters(M.LAYERS[e.i].from) + ' m');
      else if (e.k === 'page') pendingSheets.push(function () { openPage(e.i, true); });
      else if (e.k === 'ending') { saveNow(); pendingSheets.push(openEnding); }
      else if (e.k === 'faint') { stop = true; pendingSheets.push(function () { openFaint(e); }); }
      else if (e.k === 'teach') { SFX.play('teach'); pendingSheets.push(function () { openTeach(e.what); }); }
      else if (e.k === 'era') { banner(M.ERAS[e.i].icon + ' ' + M.ERAS[e.i].name); saveNow(); pendingSheets.push(function () { openEra(e.i); }); }
      else if (e.k === 'won') { recordWin(); pendingSheets.push(openWon); }
      else if (e.k === 'surface') stop = true;
      else if (e.k === 'tired') stop = true;
    });
    ctx.stop = stop;
    render();
    scheduleSave();
    if (pendingSheets.length && !sheetOpen()) { stopWalk(); stopHold(); pendingSheets.shift()(); }
    return ctx;
  }
  // 在店裡按的動作：有說明要跳出來就先看說明，看完回到同一家店
  function panelAct(cmd) {
    doAct(cmd);
    if (pendingSheets.length) {
      var id = curNpc;
      pendingSheets.push(function () { openNpc(id); });
      pendingSheets.shift()();
    } else renderNpc();
  }

  function recordWin() {
    var st = stats.story;
    st.wins++;
    if (st.best.days == null || S.wonDay < st.best.days) st.best.days = S.wonDay;
    if (st.best.digs == null || S.wonDigs < st.best.digs) st.best.digs = S.wonDigs;
    stats.won = true;
    saveStats();
    saveNow();
  }

  // ---------------- 自動走路（點遠處的通道） ----------------
  var walkTimer = null;
  function stopWalk() { if (walkTimer) { clearInterval(walkTimer); walkTimer = null; } }
  function findPath(tx, ty) {
    var sk = S.x + ',' + S.y, tk = tx + ',' + ty;
    var prev = {}; prev[sk] = null;
    var q = [[S.x, S.y]], n = 0;
    var yMin = Math.min(S.y, ty) - 40, yMax = Math.max(S.y, ty) + 40;
    while (q.length && n < 4000) {
      var c = q.shift(); n++;
      var ck = c[0] + ',' + c[1];
      if (ck === tk) {
        var path = [];
        while (ck !== sk) { var p = ck.split(','); path.unshift([+p[0], +p[1]]); ck = prev[ck]; }
        return path;
      }
      var dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
      for (var j = 0; j < 4; j++) {
        var nx = c[0] + dirs[j][0], ny = c[1] + dirs[j][1];
        if (nx < 0 || nx >= COLS || ny < 0 || ny < yMin || ny > yMax) continue;
        var nk = nx + ',' + ny;
        if (nk in prev) continue;
        var t = M.tileAt(S, nx, ny);
        if (!M.isPassable(t)) continue;
        prev[nk] = ck;
        q.push([nx, ny]);
      }
    }
    return null;
  }
  function walkTo(tx, ty) {
    stopWalk();
    var path = findPath(tx, ty);
    if (!path) { pushLog('那裡走不過去。'); renderLog(); return; }
    walkTimer = setInterval(function () {
      var p = path.shift();
      if (!p || sheetOpen()) { stopWalk(); return; }
      var ex = p[0], ey = p[1];
      var r = doAct({ t: 'move', dx: ex - S.x, dy: ey - S.y });
      if (!r || r.stop || S.x !== ex || S.y !== ey) stopWalk();
    }, 75);
  }

  // ---------------- 輸入 ----------------
  $('map').addEventListener('click', function (e) {
    var el = e.target.closest('.tile');
    if (!el || !S || sheetOpen()) return;
    var i = +el.dataset.i;
    var wx = i % COLS, wy = camTop + Math.floor(i / COLS);
    stopWalk();
    if (wy === -1 && TOWN_NPC[wx] && S.y === 0 && npcOpen(TOWN_NPC[wx])) { openNpc(TOWN_NPC[wx]); return; }
    if (wy < 0) return;
    var dist = Math.abs(wx - S.x) + Math.abs(wy - S.y);
    if (dist === 0) {
      if (M.tileAt(S, S.x, S.y) === 'station') openStationUp();
      return;
    }
    if (dist === 1) { doAct({ t: 'move', dx: wx - S.x, dy: wy - S.y }); return; }
    var t = M.tileAt(S, wx, wy);
    if (M.isPassable(t) || wy === 0) walkTo(wx, wy);
    else { pushLog('點礦工旁邊的格子才能挖；點遠處已挖開的通道可以走過去。'); renderLog(); }
  });

  // 方向鍵：按住會連續動作（挖長隧道比較不累手）
  var holdTimer = null;
  function stopHold() { clearTimeout(holdTimer); holdTimer = null; }
  function padStep(dx, dy) {
    var r = doAct({ t: 'move', dx: dx, dy: dy });
    return r && !r.stop;
  }
  $('pad').addEventListener('pointerdown', function (e) {
    var b = e.target.closest('[data-dir]');
    if (!b || !S || sheetOpen()) return;
    e.preventDefault();
    stopWalk(); stopHold();
    var d = b.dataset.dir.split(',').map(Number);
    if (!padStep(d[0], d[1])) return;
    holdTimer = setTimeout(function rep() {
      if (padStep(d[0], d[1])) holdTimer = setTimeout(rep, 140);
    }, 320);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { $('pad').addEventListener(n, stopHold); });
  $('pad').addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('keydown', function (e) {
    if (!S || sheetOpen()) return;
    var map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (map[k]) { e.preventDefault(); stopWalk(); doAct({ t: 'move', dx: map[k][0], dy: map[k][1] }); }
    else if (k === 'b') doAct({ t: 'bomb' });
    else if (k === 'v') doAct({ t: 'beam' });
  });

  $('bBomb').addEventListener('click', function () { stopWalk(); doAct({ t: 'bomb' }); });
  $('bBeam').addEventListener('click', function () { stopWalk(); doAct({ t: 'beam' }); });
  $('bRope').addEventListener('click', function () {
    stopWalk();
    confirmSheet('拉回城繩索？', '<p>周伯會把你直接拉回坑口，背包裡的東西都保得住。（剩 ' + S.items.rope + ' 條）</p>' + restNote(), '拉繩索', function () { doAct({ t: 'rope' }); });
  });
  $('bCtx').addEventListener('click', function () {
    stopWalk();
    if (S.y === 0) { openNpc('zhou'); return; }
    if (M.tileAt(S, S.x, S.y) === 'station') { doAct({ t: 'elevUp' }); return; }
    var n = M.bagCount(S);
    confirmSheet('吹哨子求救？',
      '<p>周伯會把你拉回地面，不管你卡在哪裡。' + (n ? '<br>不過背包太重拉不上來，要丟掉一半的礦石（約 ' + Math.ceil(n / 2) + ' 個）。' : '') + '</p>' +
      (S.items.rope ? '<p>你身上還有繩索，用繩索就不必丟東西。</p>' : ''),
      '吹哨子', function () { doAct({ t: 'rescue' }); });
  });
  $('strip').addEventListener('click', function (e) {
    var b = e.target.closest('[data-npc]');
    if (b) openNpc(b.dataset.npc);
  });
  $('bJournal').addEventListener('click', openJournal);
  $('bMenu').addEventListener('click', openMenu);
  $('vNext').addEventListener('click', openGuide);
  // 回地表前提醒：體力還很多的話不算收工
  function restNote() {
    return M.tiredEnough(S) ? '' : '<p style="color:var(--muted)">體力還剩一半以上，上去只是透口氣，不會過夜（日期與每日額度不變）。</p>';
  }

  // ---------------- 對話框 ----------------
  var sheet = $('sheet');
  var sheetActs = {};
  var sheetLocked = false;   // 一定要選一邊的對話框（例如要不要接續舊進度）：不能按 Esc 關掉
  function sheetOpen() { return sheet.open; }
  function openSheet(title, html, foot) {
    $('shTitle').textContent = title;
    $('shBody').innerHTML = html;
    $('shBody').scrollTop = 0;
    var f = $('shFoot');
    f.innerHTML = '';
    (foot || [{ label: '關閉' }]).forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button';
      el.textContent = b.label;
      if (b.primary) el.className = 'primary';
      el.addEventListener('click', function () {
        if (b.keep) { b.fn(); return; }
        closeSheet();
        if (b.fn) b.fn();
      });
      f.appendChild(el);
    });
    if (!sheet.open) { try { sheet.showModal(); } catch (e) { sheet.setAttribute('open', ''); } }
  }
  function closeSheet() {
    if (sheet.open) { try { sheet.close(); } catch (e) { sheet.removeAttribute('open'); } }
    drainSoon();
  }
  // 排隊中的對話框（日記頁、說明、回到店裡）：關掉一個就開下一個。
  // 不只靠 dialog 的 close 事件（有些內嵌瀏覽器不發），closeSheet 自己也排一次
  function drainSoon() {
    if (pendingSheets.length) setTimeout(function () { if (!sheetOpen() && pendingSheets.length) pendingSheets.shift()(); }, 60);
  }
  sheet.addEventListener('close', drainSoon);
  sheet.addEventListener('cancel', function (e) { if (sheetLocked) e.preventDefault(); });
  $('shBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var fn = sheetActs[b.dataset.act];
    if (fn) fn(b.dataset.arg);
  });
  function confirmSheet(title, html, okLabel, fn) {
    openSheet(title, html, [{ label: '取消' }, { label: okLabel, primary: true, fn: fn }]);
  }

  function openPrologue() {
    openSheet('灰燈鎮', '<p class="narr">' + esc(PROLOGUE) + '</p>', [{
      label: '聽周伯說', primary: true, fn: function () {
        S.introSeen = true; scheduleSave();
        openSheet('周伯的叮嚀',

  function sellHtml(shop) {
    var rate = shop === 'bm' ? M.BM_RATE : M.SELL_RATE;

    if (!keys.length) return html + '<p style="color:var(--muted)">背包是空的。</p>';

      var g1 = Math.floor(q1.gross), ga = Math.floor(qa.gross);
      var n1 = g1 - M.taxFor(S, g1), na = ga - M.taxFor(S, ga);
      // 明天的行情：累積量每天 ×SAT_DECAY（小於 0.5 就清掉），與核心 newDay 同一規則
      var a0 = (S.sat[o] || 0) * M.SAT_DECAY;
      var tom = a0 < 0.5 ? 1 : Math.exp(-a0 / (M.SAT_K * M.ORES[o].v));

        '<div class="bt"><button type="button" data-act="sell" data-arg="' + shop + ':' + o + ':1"' + (q1.n && n1 > 0 ? '' : ' disabled') + '>賣 1<br>+' + n1 + '</button>' +
