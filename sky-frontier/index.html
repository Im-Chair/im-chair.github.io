    else if (id === 'bm') html += bmHtml();
    var keepScroll = sheetOpen() && $('shTitle').textContent === npc.name ? $('shBody').scrollTop : 0;
    openSheet(npc.name, html, [{ label: '離開' }]);
    $('shBody').scrollTop = keepScroll;
  }
  sheetActs.talk = function () { talkIdx[curNpc]++; renderNpc(); };
  sheetActs.sell = function (arg) { var a = arg.split(':'); panelAct({ t: 'sell', shop: a[0], id: a[1], n: +a[2] }); };
  sheetActs.sellAll = function (shop) { panelAct({ t: 'sellAll', shop: shop }); };
  sheetActs.donate = function (arg) { var a = arg.split(':'); panelAct({ t: 'donate', id: a[0], n: +a[1] }); };
  sheetActs.donateAll = function () { panelAct({ t: 'donate', all: true }); };
  sheetActs.ciel = function (n) { panelAct({ t: 'donateCiel', n: +n }); };
  sheetActs.gear = function (id) { panelAct({ t: 'gear', id: id }); };
  sheetActs.museum = function (id) { panelAct({ t: 'museum', id: id }); };
  sheetActs.honor = function () { panelAct({ t: 'honor' }); };
  sheetActs.spec = function (id) { panelAct({ t: 'spec', id: id, n: S.bag[id] || 0 }); };
  sheetActs.up = function (id) { panelAct({ t: 'up', id: id }); };
  sheetActs.buy = function (id) { panelAct({ t: 'buy', id: id }); };
  sheetActs.down = function (i) { closeSheet(); doAct({ t: 'elevDown', i: +i }); };
  sheetActs.page = function (i) { if (i === 'pre') openSheet(PREFACE.title, '<p class="narr">' + esc(PREFACE.text) + '</p>', [{ label: '返回', fn: openJournal }]); else openSheet('爺爺的日記', letterHtml(+i), [{ label: '返回', fn: openJournal }]); };
  sheetActs.help = function () { openSheet('玩法說明', HELP_BASIC + helpEcon(), [{ label: '返回', fn: openMenu }]); };
  sheetActs.stats = function () { openStatsSheet(); };
  sheetActs.ledger = function () { openLedger(); };
  sheetActs.newgame = function () {
    confirmSheet('開始新的旅程？', '<p>會換一座全新的礦坑（新的地形），鎮子也回到拓荒時代，目前的進度會清掉。紀錄不受影響。</p>', '重新開始', function () {
      lsDel(SAVE_KEY);
      startNewGame();
    });
  };
  sheetActs.prologue = function () { openSheet('灰燈鎮', '<p class="narr">' + esc(PROLOGUE) + '</p>', [{ label: '返回', fn: openMenu }]); };

  function openJournal() {
    var html = '<div class="jlist">' + rowHtml('📕', PREFACE.title, '爺爺的筆跡', null, 'page', 'pre');
    for (var i = 0; i < JOURNAL.length; i++) {
      if (S.pages.indexOf(i) >= 0) html += rowHtml('📜', '第 ' + (i + 1) + ' 頁 · ' + JOURNAL[i].date, JOURNAL[i].text.slice(0, 22) + '……', null, 'page', i);
      else {
        var hint = i < 7 ? '大約在 ' + meters(M.PAGE_ROWS[i]) + ' 公尺附近（' + M.LAYERS[M.layerIndex(M.PAGE_ROWS[i])].name + '）' : '在最深的地方';
        html += rowHtml('▫️', '第 ' + (i + 1) + ' 頁 · 還沒找到', hint, null, 'noop', '', true);
      }
    }
    html += '</div>';
    openSheet('爺爺的日記（' + S.pages.length + '/8）', html, [{ label: '關閉' }]);
  }

  function openMenu() {
    var html = rowHtml('❔', '玩法說明', '操作、危險、收工與已開放的經濟規則', null, 'help') +
      rowHtml('🧾', '帳本', '最近 20 筆收支', null, 'ledger') +
      rowHtml('🌫️', '重看序章', '灰燈鎮的故事', null, 'prologue') +
      rowHtml('🏆', '紀錄', '全破天數、最高時代、最深紀錄', null, 'stats') +
      rowHtml('🆕', '新的旅程', '換一座新的礦坑重新開始', null, 'newgame') +
      '<a class="row" href="./classic/"><span class="ri">🕹️</span><span class="rt">原版（即時沙盒）›<small>橫向即時的舊版天穹拓荒，進度與這裡分開</small></span></a>' +
      '<p class="seed">礦坑編號 ' + S.seed.toString(16).toUpperCase() + ' · 第 ' + S.day + ' 天 · 敲了 ' + S.digs + ' 下</p>' +
      '<div class="ver">天穹拓荒 v' + SF_VER + '</div>';
    openSheet('選單', html, [{ label: '關閉' }]);
  }
  function openLedger() {
    var html = S.ledger.length ? '<div class="ledger">' + S.ledger.slice().reverse().map(function (l) {
      return '<span>第 ' + l[0] + ' 天</span><span>' + (M.REASON[l[2]] || l[2]) + '</span><span class="' + (l[1] >= 0 ? 'p' : 'm') + '">' + (l[1] >= 0 ? '+' : '') + l[1] + '</span>';
    }).join('') + '</div>' : '<p style="color:var(--muted)">還沒有任何收支。</p>';
    openSheet('帳本', html, [{ label: '返回', fn: openMenu }]);
  }
  function openStatsSheet() {
    var st = stats.story;
    var html = '<div class="kv">' +
      '<span>開始過的旅程</span><span>' + st.plays + '</span>' +
      '<span>走到星辰時代</span><span>' + st.wins + ' 次</span>' +
      '<span>最少天數</span><span>' + (st.best.days != null ? st.best.days + ' 天' : '—') + '</span>' +
      '<span>最少挖掘</span><span>' + (st.best.digs != null ? st.best.digs + ' 下' : '—') + '</span>' +
      '<span>最高時代</span><span>' + M.ERAS[stats.best.era | 0].name + '</span>' +
      '<span>最深到過</span><span>' + (st.deepest ? st.deepest + ' m' : '—') + '</span>' +
      '</div><h3>這一趟</h3><div class="kv">' +
      '<span>時代</span><span>' + M.ERAS[S.era].name + '</span>' +
      '<span>天數</span><span>' + S.day + '</span><span>挖掘</span><span>' + S.digs + ' 下</span>' +
      '<span>最深</span><span>' + meters(S.maxY) + ' m</span><span>昏倒</span><span>' + S.faints + ' 次</span>' +
      '<span>營地</span><span>' + (S.camp ? '第 ' + S.campDay + ' 天找到' : '還沒找到') + '</span></div>';
    openSheet('紀錄', html, [{ label: '返回', fn: openMenu }]);
  }

  // ---------------- 測試入口（網址加 ?debug=1） ----------------
  if (DEBUG) {
    window.__sf = {
      M: M,
      get S() { return S; },
      era: function (e) { M.debugEra(S, e); saveNow(); render(); return S.era; },
      ciel: function (n) { M.debugEarn(S, n | 0); saveNow(); render(); return S.ciel; },
      depth: function (y) {
        y = Math.max(1, y | 0);
        S.x = M.START_X; S.y = y; S.mod[S.x + ',' + y] = 'empty';
        if (y > S.maxY) S.maxY = y;
        saveNow(); render(); return meters(y) + ' m';
      },
      days: function (n) { for (var i = 0; i < (n | 0); i++) M.debugNewDay(S); saveNow(); render(); return S.day; },
      ore: function (id, n) { S.bag[id] = (S.bag[id] || 0) + (n | 0 || 1); render(); return S.bag; },
      save: saveNow
    };
    console.log('[天穹拓荒] 測試入口：window.__sf（era(n)／ciel(n)／depth(格)／days(n)／ore(id, n)）');
  }

  // ---------------- 啟動 ----------------
  window.addEventListener('resize', function () { clearTimeout(layout._t); layout._t = setTimeout(layout, 120); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && S) saveNow(); });
  window.addEventListener('pagehide', function () { if (S) saveNow(); });

  var PLACEHOLDER = null;
  // 先預載美術圖再開畫面（避免先看到一堆沒貼圖的色塊）；載不到就用 CSS 畫法照常開
  preloadArt(function (ok) {
    ART_OK = ok;
    if (ok) document.documentElement.classList.add('art');
    document.body.classList.remove('booting');
    boot();
  });
  function boot() {
  var raw = lsGet(SAVE_KEY);
  S = raw ? M.normalize(raw) : null;   // 舊版即時沙盒的 {slot, era} 指標沒有 v:2，視同沒有存檔
  if (S) {
    pushLog('歡迎回來。現在在 ' + (S.y === 0 ? '灰燈鎮' : meters(S.y) + ' 公尺深的' + M.LAYERS[M.layerIndex(S.y)].name) + '。');
    buildGrid();
    layout();
    if (!S.introSeen) openPrologue();
  } else {
    buildGrid();
    S = PLACEHOLDER = M.newState(0);   // 先放個佔位，避免 layout 時沒有狀態（佔位不會存檔）
    layout();
    var conv = M.migrateV1(lsGet(OLD_DM_KEY));
    if (conv) askMigrate(conv);
    else startNewGame();
  }
  }
})();
</script>
</body>
</html>
