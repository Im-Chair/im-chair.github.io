 if(rank>=3){if(rank>=6)names.push(l[1],l[2]);else names.push(l[1+Math.floor(H(id+3)*2)]);}

 t.fxs=(type==='攻擊'||type==='神識')?(g?buildGen(rank,id):buildFx(sc,rank,id)):{};TECHS.push(t);};

  [null,"氣海初定，凡塵微火亦能照亮前路。","百脈歸一，凝得一顆不滅道心。","神識離體，方知天地廣闊無垠。","神遊太虛，一念可通萬物靈機。","窺破虛妄，真假之間皆為我用。","天人相印，身與道合無分彼此。","道果圓滿，一步踏在登仙門檻。","九霄雷落，以凡身硬撼天威。","凡骨已蛻，天地之間，再無可束你之物。"],
  [null,"雜氣入爐，駁雜亦能築起萬丈基。","多元交融，斑斕金丹反生無盡變。","萬象同修，元嬰眉目盡是容納之量。","不拘一格，駁雜神識更能容萬道。","裂隙皆路，殘缺之身反見虛空真形。","百川匯海，衝突之力盡化合體底蘊。","雜而不亂，凡骨亦可承載大乘之重。","雷霆萬鈞，駁雜之軀偏能引劫淬鋒。","駁雜了一生，終成雜而不亂的真仙之身。"]
 ],
 /* G 殘卷《納墟訣》：碎片數 n 顯現前 n 行 */
 scroll:["裂穹納殘響，","百脈承異氣，","衝突化熔爐，","萬象歸一器，","碎星補天缺，","逆道問長生，","器成之日，身亦為薪。"]
};

/* ===== 狀態 ===== */
let p=null,B=null,mode='act',tab='act',ev=null,bt=null,selReg=null,intro=null,techF=-1,techUnk=false,showCode='',showSty=false;
const KEY='tianlie_xiuxian_v1';
const rIdx=()=>Math.floor(p.lv/4);
const maxLv=()=>p.ending?39:35;
let toastT=null;
function toast(m,c){try{let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}
 el.textContent=m;el.className=c||'';el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none';},3200);}catch(e){}}
const L=(m,c)=>{p.log.push({m,c:c||''});if(p.log.length>70)p.log.shift();if(tab!=='act'&&c!=='b')toast(m,c);};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(p));}catch(e){}};
/* 靈根參數（集中一處，方便調整）：修煉倍率／同屬攻擊加成倍率／心法同屬修煉加成／突破加成 */
const ROOT_MUL={天:1.8,變異:1.8,真:1.3,偽:0.85};
const ROOT_SAME={天:1.35,變異:1.35,真:1.2,偽:1.08};
const ROOT_HEART={天:.2,變異:.2,真:.1,偽:.04};
const ROOT_BRK={天:.08,變異:.08,真:.03,偽:0};
const rootMultOf=t=>ROOT_MUL[t];
const rootMult=()=>rootMultOf(p.root.type);
const elNorm=e=>e==='冰'?'水':e;/* 變異靈根的「冰」視同「水」 */
const hasRoot=e=>e&&p.root.els.map(elNorm).includes(e);
/* 偽靈根當萬金油：跨流派功法威力折扣／心法身法效果折扣放寬 */
const offPen=()=>p.root.type==='偽'?.8:.6;
const offRel=()=>p.root.type==='偽'?.7:.5;
/* 靈根白話說明與對照（開局與角色頁共用） */
function rootLine(t){
 const trait={天:'五行純粹',變異:'異種靈根（冰視同水）',真:'五行尚可',偽:'五行駁雜'}[t];
 const brk=ROOT_BRK[t]?'突破成功率+'+Math.round(ROOT_BRK[t]*100)+'%':'突破無加成';
 const same=Math.round((ROOT_SAME[t]-1)*100);
 const off=t==='偽'?'學別派功法只打八折（其他靈根六折）':'學別派功法打六折（偽靈根為八折）';
 return `${t}靈根：修煉 ×${ROOT_MUL[t]}、${brk}；${trait}，同屬加成${t==='偽'?'只有':''} ${same}%（心法同屬修煉另加 ${Math.round(ROOT_HEART[t]*100)}%），${off}`;}
function rootCmp(t){
 if(t==='天'||t==='變異')return `同樣閉關一年，你的修為約是偽靈根的 ${(rootMultOf(t)/rootMultOf('偽')).toFixed(1)} 倍`;
 return `同樣閉關一年，天靈根的修為約是你的 ${(rootMultOf('天')/rootMultOf(t)).toFixed(1)} 倍`;}
function rollRoot(){const x=rnd(),E=['金','木','水','火','土'];
 if(x<.05)return{type:'天',els:[pick(E)]};
 if(x<.10)return{type:'變異',els:[pick(['雷','冰','風'])]};
 if(x<.40)return{type:'真',els:shuffle(E).slice(0,R(2,3))};
 return{type:'偽',els:shuffle(E).slice(0,R(4,5))};}
const rootTxt=r=>r.type+'靈根（'+r.els.join('')+'）';


/* ===== 劇情邏輯（文案在 STORY_TXT；p.sty＝{seen:已看過的鍵, list:依解鎖順序的 [{k,t,m}]，供「問道紀事」重看}）===== */
const STY_MEET_P=0.5,PEI_SC=0;/* 角色偶遇每次探索的觸發機率（碎片數 0 的那段改為第 2 次探索必出）；裴玄機的流派＝劍修 */
function story(key,title,text,quiet){
 if(!p.sty)p.sty={seen:{},list:[]};
 if(p.sty.seen[key])return false;
 p.sty.seen[key]=1;p.sty.list.push({k:key,t:title,m:text});
 if(!quiet)L(`【${title}】${text}`,'sty');
 return true;}
const storyRegion=(k,quiet)=>STORY_TXT.region[k]?story('B:'+k,'初到・'+k,STORY_TXT.region[k],quiet):false;
function storyBoss(reg,quiet){const b=reg==='天裂淵'?'天道殘影':REG[reg].boss;return STORY_TXT.boss[b]?story('C:'+b,'擊敗・'+b,STORY_TXT.boss[b],quiet):false;}
const storyEnd=(n,quiet)=>STORY_TXT.end[n]?story('D:'+n,'結局・'+n,STORY_TXT.end[n],quiet):false;
/* 探索時的角色偶遇：碎片數達到該段數字、尚未看過；每次探索最多一段，依碎片數由小到大補看。回傳 true＝已進入事件 */
function storyMeet(){
 const sh=p.shards.length,pend=STORY_TXT.meet.filter(e=>e.n<=sh&&!p.sty.seen['E:'+e.k]).sort((a,b)=>a.n-b.n);
 if(!pend.length)return false;
 const e=pend[0],cnt=Object.keys(p.explored).reduce((a,k)=>a+p.explored[k],0);
 if(!(e.n===0?cnt>=2:ch(STY_MEET_P)))return false;
 story('E:'+e.k,'偶遇・'+e.who,e.t);/* 先標記已看過（戰敗或逃跑也算看過） */
 const ent=p.sty.list[p.sty.list.length-1];
 showEv(e.t,e.c.map(c=>({l:c[0],f:()=>{L(c[1],'sty');ent.m+='\n你答：'+c[0]+'\n'+c[1];if(e.fight)meetPei();}})),true);
 return true;}
/* 裴玄機（執律使、劍修）：略強於玩家的修士，贏了的獎勵略高於一般修士（寶箱等級、加成 1 級） */
function meetPei(){
 const lv=cl(p.lv+1,0,39),e=mkRival(lv,PEI_SC);e.n='裴玄機';e.hp*=1.15;e.atk*=1.1;
 L('裴玄機長劍出鞘，劍意鎖住了你！','r');
 fight(e,{canFlee:true,win:()=>{p.pk++;give(mkBundle(lv,'box',2));}});}
/* 舊存檔補欄位；沒有劇情欄位的舊檔：已到過的地區、已擊敗的守關者、已有的結局只靜默記為已看過（不補播），
   角色偶遇則從目前碎片數對應的那段開始（碎片數更小的視為已看過） */
function fixSave(){
 if(p.srNext==null)p.srNext=0;
 if(!p.liqBuy)p.liqBuy={m:0,n:0};
 if(!p.sty){
  p.sty={seen:{},list:[]};
  const regs=['中州',p.reg];for(const k in p.explored)if(p.explored[k]>0)regs.push(k);
  for(const k in p.bossDown)if(p.bossDown[k]&&REG[k]){regs.push(k);}
  if(p.ending)regs.push('天裂淵');
  REGKEYS.forEach(k=>{if(regs.includes(k))storyRegion(k,true);});
  REGKEYS.forEach(k=>{if(p.bossDown[k]&&REG[k].boss)storyBoss(k,true);});
  if(p.ending){storyBoss('天裂淵',true);storyEnd(p.ending,true);}
  STORY_TXT.meet.forEach(e=>{if(p.ending||e.n<p.shards.length)p.sty.seen['E:'+e.k]=1;});
 }}
const REGKEYS=Object.keys(REG);
/* 讀檔後的模式：壽元已盡就進入坐化（避免重新整理後回到可操作畫面）；有秘境進度回到秘境 */
function resumeMode(){if(16+p.month/12>=LIFE[rIdx()]+p.extra){p.sr=null;return'dead';}return p.sr?'sr':'act';}

function newGame(name,sc,root){
 p={name:name||'無名道友',sc,root,lv:0,exp:0,month:0,reg:'中州',st:300,hp:1,mp:1,
  eq:{武器:mkEq(0,'武器',0,sc),衣甲:null,飾品:null,法寶:null},bag:[],techs:[],mas:{},heart:null,foot:null,slots:[null,null,null,null],
  inv:{liq:2,heal:3,mp:2,brk:0,life:0},shards:[],bossDown:{},explored:{},sr:null,pk:0,log:[],ending:null,extra:0,shop:null,srNext:0,liqBuy:{m:0,n:0},sty:{seen:{},list:[]}};
 const base=sc*12;
 learn(base);learn(base+1);p.heart=base;p.slots[0]=base+1;
 const c=calc();p.hp=c.hp;p.mp=c.mp;
 STORY_TXT.prologue.forEach((t,i)=>story('A-'+(i+1),'序章（'+'一二三'[i]+'）',t));storyRegion('中州');
 L('天道崩裂已逾千年，九州靈氣日漸稀薄，傳說集齊七塊天道碎片，便可補全飛升之路。','y');
 L(`你是${p.name}，${rootTxt(root)}，在宗門覆滅之夜撿到一卷殘破功法，從此踏上問道之路。`);
 L('提示：先「閉關」修煉，再到中州附近探索歷練。');
 mode='act';tab='act';selReg=p.reg;save();render();
}
function learn(id){if(!p.techs.includes(id))p.techs.push(id);if(!p.mas[id])p.mas[id]=1;}

/* ===== 數值 ===== */
function calc(){
 const b=S(p.lv);const o={atk:b,def:b*.6,sense:b*.9,hp:b*6,mp:b*5,spd:10+p.lv*3,dodge:.03,crit:.08,exp:1};
 for(const sl in p.eq){const q=p.eq[sl];if(!q)continue;const v=S(q.tier*4+2)*QM[q.q];
  if(sl==='武器')o.atk+=v*.5;else if(sl==='衣甲'){o.def+=v*.4;o.hp+=v*2;}else if(sl==='飾品'){o.sense+=v*.4;o.spd+=q.tier*2+2;}else{o.atk+=v*.2;o.def+=v*.15;o.sense+=v*.2;o.hp+=v;}}
 const X={crit:0,critd:0,hpPct:0,defPct:0,senseP:0,atkP:0,spdP:0,lifesteal:0,dodge:0,regen:0,dotUp:0,exp:0};
 for(const sl in p.eq){const q=p.eq[sl];if(!q)continue;const x=eqX(q);if(x)X[x[0]]+=x[1];}
 if(p.heart!=null){const h=TECHS[p.heart],m=1+0.1*((p.mas[h.id]||1)-1),f=relF(h);
  o.exp+=(0.1+0.08*h.rank)*m*f+(hasRoot(h.e)?ROOT_HEART[p.root.type]:0);
  if(h.sc<12)X[SCX[h.sc][0]]+=SCX[h.sc][1]*(h.rank+1)*m*f;}
 if(p.foot!=null){const t=TECHS[p.foot],f=relF(t);o.spd*=1+0.05*(t.rank+1)*f;o.dodge+=(0.03+0.025*t.rank)*f;
  if(t.sc<12)X[SCX[t.sc][0]]+=SCX[t.sc][1]*(t.rank+1)*.5*f;}
 o.atk*=1+X.atkP;o.sense*=1+X.senseP;o.hp*=1+X.hpPct;o.def*=1+X.defPct;o.spd*=1+X.spdP;
 o.crit+=X.crit;o.critd=X.critd;o.lifesteal=X.lifesteal;o.regen=X.regen;o.dotUp=X.dotUp;o.exp+=X.exp;o.dodge+=X.dodge;
 o.dodge=Math.min(o.dodge,.5);return o;}
/* ===== 流派規則：本流派／交好／武器共鳴／通用／跨流派 ===== */
function wpnMatch(sc){return['武器','法寶'].some(s=>p.eq[s]&&eqSc(p.eq[s])===sc);}
function rel(t){if(t.sc===12)return'gen';if(t.sc===p.sc)return'own';if(ALLY[p.sc].includes(t.sc))return'ally';if(wpnMatch(t.sc))return'wpn';return'off';}
const RELTXT={gen:'通用',own:'本流派',ally:'交好流派',wpn:'武器共鳴',off:'跨流派'};
const penOf=t=>({gen:.9,own:1,ally:1,wpn:1,off:offPen()})[rel(t)];
const relF=t=>({gen:.9,own:1,ally:1,wpn:1,off:offRel()})[rel(t)];
/* ===== 流派相剋（常數集中於此，方便調整）=====
   兩個環，「A → B」表示 A 剋 B；每派剋下一個、被上一個剋。索引對應 SCHOOLS。
   五行環：劍修(0)→丹修(5)→體修(1)→陣修(4)→器修(6)→劍修(0)
   另一環：符修(3)→鬼修(9)→音修(2)→御獸(7)→毒蠱(11)→佛修(10)→魔修(8)→符修(3) */
const CTR_RINGS=[[0,5,1,4,6],[3,9,2,7,11,10,8]];
const CTR_UP=1.25,CTR_DOWN=0.8;/* 剋制 ×1.25、被剋 ×0.8 */
const CTR_SUMMON=7,CTR_SUMMON_UP=1.15;/* 御獸流派功法打妖獸／首領的額外倍率 */
const ELSC={金:0,木:5,土:1,水:4,火:6};/* 五行屬性 → 對應五行環的流派（妖獸屬性用） */
const CTR_NEXT={};/* CTR_NEXT[a]＝a 所剋的流派 */
CTR_RINGS.forEach(r=>r.forEach((a,i)=>{CTR_NEXT[a]=r[(i+1)%r.length];}));
const CTR_PREV=s=>Object.keys(CTR_NEXT).map(Number).filter(a=>CTR_NEXT[a]===s);/* 剋 s 的流派 */
function ctrOf(a,d){if(a==null||d==null||a>=12||d>=12)return 1;if(CTR_NEXT[a]===d)return CTR_UP;if(CTR_NEXT[d]===a)return CTR_DOWN;return 1;}
const isBeastE=e=>e&&(e.kind==='beast'||e.kind==='boss');
/* 玩家流派 asc 打敵人 t 的相剋倍率（御獸對妖獸另有加成；妖獸的 sc 是其五行屬性對應流派） */
function ctrVs(asc,t){let m=ctrOf(asc,t.sc);if(asc===CTR_SUMMON&&isBeastE(t))m*=CTR_SUMMON_UP;return m;}
const ctrTag=m=>m>1?'<span class="g">剋制</span>':m<1?'<span class="r">被剋</span>':'';
function affOf(t){if(t.sc===12)return 0;let c=0;for(const s in p.eq){const q=p.eq[s];if(q&&eqSc(q)===t.sc)c++;}return Math.min(.4,c*.1);}
function canUse(t){if(rIdx()<t.req)return`境界不足，需${REALMS[t.req]}期。`;
 if(t.rank>=9&&t.sc!==12&&t.sc!==p.sc)return'天階功法只有本流派才能修煉。';
 if(t.rank>=6&&t.rank<9&&rel(t)==='off')return'地階功法需本流派、交好流派，或裝備該流派的武器／法寶才能修煉。';return'';}
function fixTechs(){const bad=id=>{const t=TECHS[id];return t.rank>=6&&t.rank<9&&rel(t)==='off';};
 p.slots=p.slots.map(id=>{if(id!=null&&bad(id)){L(`失去條件，《${TECHS[id].name}》已自動卸下。`,'r');return null;}return id;});
 if(p.heart!=null&&bad(p.heart)){L(`失去條件，心法《${TECHS[p.heart].name}》已自動卸下。`,'r');p.heart=null;}
 if(p.foot!=null&&bad(p.foot)){L(`失去條件，身法《${TECHS[p.foot].name}》已自動卸下。`,'r');p.foot=null;}}
const regen=f=>{const c=calc();p.hp=Math.min(c.hp,p.hp+c.hp*f);p.mp=Math.min(c.mp,p.mp+c.mp*f);};

function gainExp(x){p.exp+=x;checkLevel();}
function checkLevel(){
 while(p.lv<maxLv()&&p.lv%4!==3&&p.exp>=need(p.lv)){p.exp-=need(p.lv);p.lv++;L('修為提升！你已達到「'+lvName(p.lv)+'」。','y');const c=calc();p.hp=c.hp;p.mp=c.mp;}
 if(p.lv%4===3||p.lv>=maxLv()){if(p.exp>need(p.lv))p.exp=need(p.lv);}
}
const canBreak=()=>p.lv%4===3&&p.lv<maxLv()&&p.exp>=need(p.lv);
function tick(m){p.month+=m;if(16+p.month/12>=LIFE[rIdx()]+p.extra){mode='dead';}}

function cultivate(n){
 if(mode!=='act')return;
 const c=calc();let tot=0;
 for(let i=0;i<n;i++){
  if(p.lv>=maxLv()&&p.exp>=need(p.lv)){L('此境界修為已到瓶頸，需有所機緣方能再進。','r');break;}
  if(p.lv%4===3&&p.exp>=need(p.lv)){L('修為圓滿，可以嘗試突破了！','y');break;}
  const g=need(p.lv)/(6+p.lv*1.2)*c.exp*rootMult()*REG[p.reg].qi;
  const before=p.lv;p.exp+=g;tot+=g;checkLevel();tick(1);regen(0.25);
  if(mode==='dead')break;
  if(p.lv!==before)c.exp=calc().exp;
 }
 if(mode!=='dead'){const mo=moToNext();L(`閉關${n>1?n+'個月':'一月'}，修為 +${nf(tot)}。`+(mo?`照目前速度約再 ${mo} 個月${p.lv%4===3?'修為圓滿':'升到下一階'}。`:''),'g');}
 render();
}
/* 照目前速度，約再幾個月升到下一階（圓滿待突破或到瓶頸時回傳 0） */
function moToNext(){
 if(p.lv>=maxLv()||p.exp>=need(p.lv))return 0;
 const g=need(p.lv)/(6+p.lv*1.2)*calc().exp*rootMult()*REG[p.reg].qi;
 return g>0?Math.max(1,Math.ceil((need(p.lv)-p.exp)/g)):0;
}
/* 剩餘壽元（年）；真仙回傳 Infinity */
function lifeLeft(){const m=LIFE[rIdx()]+p.extra;return m>9999?Infinity:m-(16+p.month/12);}
function rest(){if(mode!=='act')return;tick(1);regen(0.6);L('你運功調息，傷勢與靈力恢復了不少。','g');render();}

/* ===== 突破 ===== */
const btRate=(liq,brk)=>{const r=rIdx();return cl(0.62-r*0.045+ROOT_BRK[p.root.type]+liq*0.08+(brk?0.15:0),0.05,0.95);};
function doBreak(){
 const rate=btRate(bt.liq,bt.brk);p.inv.liq-=bt.liq;if(bt.brk)p.inv.brk--;
 const r=rIdx();
 if(r>=3&&ch(0.5))L('天空雷雲匯聚，劫雷落下！','r');
 if(ch(rate)){p.lv++;p.exp=0;const c=calc();p.hp=c.hp;p.mp=c.mp;L(`突破成功！你踏入了「${lvName(p.lv)}」！`,'y');const bl_=STORY_TXT.brk[p.root.type==='偽'?1:0][rIdx()];if(bl_)L(`【${REALMS[rIdx()]}】${bl_}`,'sty');}
 else{p.exp=Math.floor(p.exp*0.6);p.hp=Math.max(1,Math.floor(calc().hp*0.4));L('突破失敗，靈力反噬，修為倒退了一些。','r');}
 bt=null;mode='act';render();
}

/* ===== 技能 / 戰鬥 ===== */
const cost=(a,k)=>Math.max(3,Math.round(a.mpMax*tCost(k)));
const bl=m=>L(m,'b');
function actorP(){const c=calc();return{n:p.name,pl:true,hp:Math.min(p.hp,c.hp),hpMax:c.hp,mp:Math.min(p.mp,c.mp),mpMax:c.mp,atk:c.atk,def:c.def,sense:c.sense,spd:c.spd,dodge:c.dodge,crit:c.crit,critd:c.critd,lifesteal:c.lifesteal,regen:c.regen,dotUp:c.dotUp,els:p.root.els.map(elNorm),rt:p.root.type,sc:p.sc,
 skills:p.slots.filter(x=>x!=null).map(id=>{const t=TECHS[id];return Object.assign({},t,{pen:penOf(t),aff:affOf(t)});}),mas:p.mas,st:{stun:0,dot:0,dotT:0,sh:0,weak:0,weakV:0,curse:0,curseV:0}};}

  skills:[pseudo(pick(['撕咬','猛撲','衝撞','噴吐']),r),pseudo(pick(['嘶吼','妖氣衝擊','狂暴']),r+1,pick(['','stun','burn']))],st:{stun:0,dot:0,dotT:0,sh:0}};

function mkRival(lv,fixSc){

 let pool=TECHS.filter(t=>t.sc===si&&t.type!=='心法'&&t.type!=='身法'&&t.rank<=maxR&&t.req<=realm);
 pool=shuffle(pool).slice(0,3);
 return{n:pick(SURN)+pick(GIV)+pick(GIV),school:sc.n,sc:si,el:sc.e,lv,kind:'cult',hp:b*6*1.1,mp:b*5,mpMax:b*5,atk:b*1.1,def:b*.65,sense:b,spd:10+lv*3,dodge:.06,crit:.08,els:sc.e?[sc.e]:[],mas:{},skills:pool,st:{stun:0,dot:0,dotT:0,sh:0}};

function startBattle(o){
 const e=o.e;e.hpMax=e.hp;B={e,o,P:actorP(),over:false,fled:false};

function attack(a,t,k){
 const A=a.pl?'你':a.n,T=t.pl?'你':t.n;
 if(a.st.stun>0){a.st.stun--;bl(`${A}被震懾，無法行動！`);return;}
 const fx=(k&&k.fxs)||{},pen=k&&k.pen!=null?k.pen:1,aff=(k&&k.aff)||0,wk=a.st.weak>0?1-a.st.weakV:1;
 let mult=1,nm='普攻',stat=a.atk*wk,defE=t.def*(t.st.curse>0?1-t.st.curseV:1),sense=false;
 if(k){const m=1+0.1*((a.mas[k.id]||1)-1);sense=k.type==='神識';
  mult=tMult(k)*m*pen*(1+aff);
  stat=(sense||k.stat==='sense')?a.sense*wk:a.atk*wk;
  if(sense)defE*=0.3;else if(k.stat==='sense')defE*=0.6;
  if(fx.pierce)defE*=1-fx.pierce;
  if(fx.selfdmg){a.hp=Math.max(1,a.hp-a.hpMax*0.04);mult*=1+fx.selfdmg;}
  a.mp-=cost(a,k);nm=k.name;if(k.e&&a.els.includes(k.e))mult*=ROOT_SAME[a.rt||'真'];}
 /* 流派相剋：玩家用功法所屬流派打敵人；敵人用自己的流派打玩家（通用功法不參與） */
 const cm=a.pl?(k?ctrVs(k.sc,t):1):ctrOf(a.sc,p.sc);mult*=cm;const ctag=cm>1?'（剋制）':cm<1?'（被剋）':'';
 if(!sense&&!fx.seek&&ch(t.dodge)){bl(`${A}${k?'施展「'+nm+'」':'出手'}，但${T}閃開了！`);return;}
 let d=stat*mult*(0.9+rnd()*0.2)*stat/(stat+defE);
 const crit=ch(a.crit+(fx.crit||0));if(crit)d*=1.6+(a.critd||0)+(fx.critd||0);
 if(fx.burst)d*=1+fx.burst;
 if(fx.hpd)d+=t.hpMax*fx.hpd;
 if(t.st.sh>0){const ab=Math.min(t.st.sh,d);t.st.sh-=ab;d-=ab;}
 d=Math.max(1,Math.floor(d));t.hp-=d;
 bl(`${A}${k?'施展「'+nm+'」':'發動普攻'}${pen<1&&a.pl?'（跨流派，威力減弱）':''}${ctag}，${crit?'暴擊！':''}對${T}造成 ${nf(d)} 傷害。`);
 const up=1+(a.dotUp||0);
 if(fx.multi){const n=k.rank>=6?2:1;for(let i=0;i<n;i++){const d2=Math.max(1,Math.floor(d*fx.multi));t.hp-=d2;bl(`  追擊再造成 ${nf(d2)} 傷害。`);}}
 if(fx.drain){const h=Math.floor(d*fx.drain);a.hp=Math.min(a.hpMax,a.hp+h);bl(`  ${A}吸取了 ${nf(h)} 氣血。`);}
 if(a.lifesteal){a.hp=Math.min(a.hpMax,a.hp+Math.floor(d*a.lifesteal));}
 if(fx.heal){const h=Math.floor(a.hpMax*fx.heal);a.hp=Math.min(a.hpMax,a.hp+h);bl(`  ${A}回復了 ${nf(h)} 氣血。`);}
 if(fx.shield){a.st.sh+=a.def*fx.shield;bl(`  ${A}身周浮現護盾。`);}
 if(fx.stun&&ch(fx.stun)){t.st.stun=1;bl(`  ${T}被震懾住了！`);}
 if(fx.burn){t.st.dot=Math.floor(d*fx.burn*up);t.st.dotT=3;bl(`  ${T}被灼燒。`);}
 if(fx.poison){t.st.dot=(t.st.dotT>0?t.st.dot:0)+Math.floor(d*fx.poison*up);t.st.dotT=4;bl(`  ${T}中了劇毒。`);}
 if(fx.weaken){t.st.weak=3;t.st.weakV=fx.weaken;bl(`  ${T}的攻擊被削弱。`);}
 if(fx.curse){t.st.curse=3;t.st.curseV=fx.curse;bl(`  ${T}的防禦被削弱。`);}
}
function dot(a){if(a.st.dotT>0){a.hp-=a.st.dot;a.st.dotT--;bl(`${a.pl?'你':a.n}受到持續傷害 ${nf(a.st.dot)}。`);}
 if(a.st.weak>0)a.st.weak--;if(a.st.curse>0)a.st.curse--;
 if(a.regen&&a.hp>0)a.hp=Math.min(a.hpMax,a.hp+a.hpMax*a.regen);}
function enemyTurn(){const E=B.e,Pl=B.P,av=E.skills.filter(k=>E.mp>=cost(E,k));attack(E,Pl,av.length&&ch(0.65)?pick(av):null);}
function checkEnd(){if(B.e.hp<=0){endBattle(true);return true;}if(B.P.hp<=0){endBattle(false);return true;}return false;}
function syncP(){p.hp=Math.max(1,Math.min(B.P.hp,calc().hp));p.mp=Math.max(0,B.P.mp);}
function endBattle(w){
 B.over=true;syncP();const o=B.o,E=B.e;B=null;mode=p.sr?'sr':'act';
 if(w){L(`你擊敗了${E.n}！`,'y');if(o.win)o.win(E);}
 else{L(`你被${E.n}擊敗……`,'r');if(o.lose)o.lose(E);else defLose();}
 render();
}
function defLose(){
 if(p.sr){L('你在秘境中重傷，被傳送出去，所有暫存的收穫都丟失了。','r');p.hp=1;p.sr=null;mode='act';return;}
 const pen=Math.floor(p.st*0.15);p.st-=pen;p.hp=Math.max(1,Math.floor(calc().hp*0.1));L(`你狼狽逃回，損失靈石 ${fmt(pen)}。`,'r');mode='act';
}
function useHeal(){if(p.inv.heal<=0){L('沒有療傷丹了。');return false;}p.inv.heal--;return true;}
const G={};
G.bt=(k,i)=>{
 if(!B||B.over)return;const Pl=B.P,E=B.e;let act;
 if(k==='atk')act=()=>attack(Pl,E,null);
 else if(k==='sk'){const s=Pl.skills[i];act=()=>attack(Pl,E,s);}
 else if(k==='heal'){if(p.inv.heal<=0){L('沒有療傷丹了。');render();return;}p.inv.heal--;act=()=>{Pl.hp=Math.min(Pl.hpMax,Pl.hp+Pl.hpMax*0.5);L('你服下療傷丹，恢復了氣血。','g');};}
 else if(k==='mp'){if(p.inv.mp<=0){L('沒有回靈丹了。');render();return;}p.inv.mp--;act=()=>{Pl.mp=Math.min(Pl.mpMax,Pl.mp+Pl.mpMax*0.6);L('你服下回靈丹，靈力回復。','g');};}
 else if(k==='flee'){const c=cl(0.45+(Pl.spd-E.spd)/(Pl.spd+E.spd),0.1,0.9);act=()=>{if(ch(c)){B.fled=true;L('你成功脫身。');}else L('你沒能逃走！','r');};}
 const pf=Pl.spd*(0.9+rnd()*0.2)>=E.spd*(0.9+rnd()*0.2);
 const seq=(pf||k==='heal'||k==='mp')?[act,enemyTurn]:[enemyTurn,act];
 for(const f of seq){f();
  if(B.fled){syncP();const o=B.o;B=null;mode=p.sr?'sr':'act';if(o.onFlee)o.onFlee();render();return;}
  if(checkEnd())return;}
 dot(Pl);dot(E);if(checkEnd())return;render();
};

function rollTech(lv,bias){
 const maxR=cl(Math.floor(lv/4*1.35)+2+bias,0,11);let r=maxR;
 for(let i=0;i<8;i++){const x=pickW([55,30,12,3])*3+pickW([50,35,15]);if(x<=maxR){r=x;break;}}
 let pool=TECHS.filter(t=>t.rank===r);
 if(r>=9)pool=pool.filter(t=>t.sc===p.sc);
 else if(ch(r>=6?0.75:0.5)){const q=pool.filter(t=>t.sc===12||t.sc===p.sc||ALLY[p.sc].includes(t.sc));if(q.length)pool=q;}
 return pick(pool).id;
}
const qroll=b=>pickW([Math.max(10,55-b*12),28,13+b*5,4+b*3]);
const newInv=()=>({liq:0,heal:0,mp:0,brk:0,life:0});
function mkBundle(lv,kind,bias){
 bias=bias||0;const m={beast:1,cult:2.2,boss:6,box:3}[kind]||1;
 const b={st:Math.round(P(lv)*(0.5+rnd())*m),exp:Math.round(need(lv)*0.04*m*(0.8+rnd()*0.4)),inv:newInv(),eq:[],techs:[]};
 if(ch(0.2*m))b.inv.liq+=R(1,2);if(ch(0.18*m))b.inv.heal++;if(ch(0.12*m))b.inv.mp++;if(ch(0.04*m))b.inv.brk++;if(ch(0.015*m))b.inv.life++;
 const realm=Math.floor(lv/4);
 if(ch(kind==='boss'?1:0.1*m))b.eq.push(mkEq(realm,null,kind==='boss'?Math.max(2,qroll(bias)):qroll(bias)));
 if(ch(kind==='boss'?0.85:0.05*m*(1+bias*0.5)))b.techs.push(rollTech(lv,bias+(kind==='boss'?2:0)));
 return b;
}
function mergeB(a,b){a.st+=b.st;a.exp+=b.exp;for(const k in b.inv)a.inv[k]+=b.inv[k];a.eq.push(...b.eq);a.techs.push(...b.techs);}
function addTech(id){
 const t=TECHS[id];
 if(p.techs.includes(id)){if(p.mas[id]<5){p.mas[id]++;return`獲得《${t.name}》殘卷，熟練度提升至 ${p.mas[id]}。`;}const s=Math.round(P(t.req*4)*(t.rank+1)*.5);p.st+=s;return`獲得《${t.name}》殘卷（已圓滿），折成靈石 ${fmt(s)}。`;}
 learn(id);return`領悟新功法《${t.name}》（${rk(t.rank)}${t.school}${t.type}）！`;
}
function commit(b){p.st+=b.st;if(b.exp)gainExp(b.exp);for(const k in b.inv)p.inv[k]+=b.inv[k];b.eq.forEach(e=>p.bag.push(e));const ms=b.techs.map(addTech);return ms;}
function bText(b){const a=[`靈石 +${fmt(b.st)}`,`修為 +${nf(b.exp)}`];const N={liq:'靈液',heal:'療傷丹',mp:'回靈丹',brk:'破境丹',life:'延壽丹'};for(const k in b.inv)if(b.inv[k])a.push(`${N[k]}×${b.inv[k]}`);b.eq.forEach(e=>a.push(`【${QN[e.q]}${e.name}】`));return a.join('、');}
function give(b){
 if(p.sr){b.exp=Math.round(b.exp*srExpScale());/* 秘境修為縮水（唯一入口，見 srExpScale） */mergeB(p.sr.loot,b);L('（暫存於秘境）'+bText(b)+(b.techs.length?'、功法殘卷×'+b.techs.length:''),'g');}

   {l:'重鑄天道',f:()=>ending('重鑄天道','你以七塊碎片為薪，重鑄天道。靈氣復甦，後世修士再無飛升之苦，而你化為新的法則，守望人間。')},
   {l:'自己成道',f:()=>ending('自成一道','你吞下碎片，以己身為道，天地以你之名運轉。你是第一個，也是唯一一個。')},
   {l:'斬斷天道',f:()=>ending('斬斷天道','你一劍斬斷天道，世間從此再無天劫，亦無飛升。眾生各憑本事求生，一切由人自己決定。')}]);}});
}
function ending(n,t){p.ending=n;L('【結局：'+n+'】'+t,'y');storyEnd(n);L('你可繼續修煉，突破至「真仙」境界，並前往浮空仙域。','y');}

function genShop(){
 if(p.shop&&p.shop.reg===p.reg&&p.month-p.shop.m<3)return p.shop;
 const r=rIdx(),lv=p.lv;
 const eq=[0,1,2].map((_,i)=>mkEq(clamp0(r+R(-1,1)),i===0?pick(['武器','法寶']):null,pickW([50,32,15,3]),i===0?p.sc:undefined));
 const maxR=cl(Math.floor(r*1.2)+3,0,5);
 const techs=[];for(let i=0;i<4;i++){const t=pick(TECHS.filter(t=>t.rank<=maxR&&(t.sc===12||t.sc===p.sc||ALLY[p.sc].includes(t.sc)||ch(0.12))));if(!techs.includes(t.id))techs.push(t.id);}
 p.shop={reg:p.reg,m:p.month,eq,techs};return p.shop;
}
const clamp0=v=>cl(v,0,9);
const POTS=[['liq','靈液',4,'修煉或突破用'],['heal','療傷丹',0.8,'回復50%氣血'],['mp','回靈丹',0.6,'回復60%靈力'],['brk','破境丹',8,'突破成功率+15%'],['life','延壽丹',30,'壽元+20年']];
G.shop=()=>{if(mode!=='act')return;genShop();mode='shop';render();};
G.leaveShop=()=>{mode='act';render();};
/* 靈液進貨上限：全角色共用（不隨坊市／地區重置，避免來回跑坊市洗貨）。每 LIQ_WIN 個月最多買 LIQ_CAP 瓶，
   否則秘境賺來的靈石可無限換成靈液（每瓶 need×0.1），比閉關划算很多 */
const LIQ_CAP=2,LIQ_WIN=12;
const liqLeft=()=>{const b=p.liqBuy;if(!b||p.month-b.m>=LIQ_WIN)return LIQ_CAP;return Math.max(0,LIQ_CAP-b.n);};
G.buyPot=k=>{const d=POTS.find(x=>x[0]===k),c=Math.round(P(p.lv)*d[2]);
 if(k==='liq'&&!liqLeft()){L(`靈液進貨有限，每 ${LIQ_WIN} 個月最多買 ${LIQ_CAP} 瓶，約 ${LIQ_WIN-(p.month-p.liqBuy.m)} 個月後再來。`,'r');render();return;}
 if(p.st<c){L('靈石不足。','r');render();return;}p.st-=c;p.inv[k]++;
 if(k==='liq'){if(!p.liqBuy||p.month-p.liqBuy.m>=LIQ_WIN)p.liqBuy={m:p.month,n:0};p.liqBuy.n++;}L(`購買了${d[1]}。`,'g');render();};
G.buyEq=i=>{const q=p.shop.eq[i];if(!q)return;const c=eqPrice(q);if(p.st<c){L('靈石不足。','r');render();return;}p.st-=c;p.bag.push(q);p.shop.eq[i]=null;L(`購買了【${QN[q.q]}${q.name}】。`,'g');render();};
G.buyTech=i=>{const id=p.shop.techs[i];if(id==null)return;const t=TECHS[id],c=Math.round(P(t.req*4)*(2+t.rank*3));if(p.st<c){L('靈石不足。','r');render();return;}p.st-=c;L(addTech(id),'y');p.shop.techs[i]=null;render();};
G.sell=i=>{const q=p.bag[i];if(!q)return;const v=Math.round(eqPrice(q)*0.4);p.st+=v;p.bag.splice(i,1);L(`賣出【${q.name}】，得靈石 ${fmt(v)}。`,'g');render();};

/* ===== 秘境 ===== */
/* 秘境的時間與修為參數（集中一處）：
   耗時＝入場 1 個月＋每通過一層 1 個月（5 層共約 6 個月）；冷卻自入場那個月起算 12 個月。
   修為縮水：秘境內所有「修為」收穫統一乘 srExpScale＝SR_EXP_K/(6+境界*1.2)×靈根倍率。
   6+境界*1.2 正是閉關每月修為公式的分母，所以縮水後約等於「同等級閉關 SR_EXP_K×(原修為/need) 個月」，且與境界無關；
   靈石、功法、法器、丹藥不受影響（秘境的定位是拿東西，修為只是順帶）。 */
const SR_MONTHS=6,SR_CD=12,SR_EXP_K=2.8,SR_VAULT_LIQ=2;/* SR_VAULT_LIQ：寶庫「靈液」選項的瓶數（原 5 瓶＝need×0.5，高境界時比整趟縮水後的修為還多，故降為 2） */
const srExpScale=()=>SR_EXP_K/(6+p.lv*1.2)*rootMult();
const srCdLeft=()=>Math.max(0,(p.srNext||0)-p.month);
function srFee(){return P(p.lv)*3;}
/* 秘境中過一個月；壽元耗盡就坐化（暫存收穫全丟，p.sr 清掉避免卡死），回傳 true */
function srTick(){tick(1);if(mode==='dead'){p.sr=null;L('你在秘境中耗盡了壽元……','r');return true;}return false;}
G.enterSR=()=>{if(mode!=='act')return;
 const cd=srCdLeft();if(cd>0){L(`秘境封閉中，約 ${cd} 個月後重開。`,'r');render();return;}
 const f=srFee();if(p.st<f){L(`入場需要靈石 ${fmt(f)}。`,'r');render();return;}p.st-=f;
 const m0=p.month;p.srNext=m0+SR_CD;tick(1);
 if(mode==='dead'){L('你還沒踏入秘境，壽元就已耗盡……','r');render();return;}
 p.sr={floor:1,step:0,m0,tier:rIdx(),name:pick(SRN)+'秘境',loot:{st:0,exp:0,inv:newInv(),eq:[],techs:[]}};
 L(`你繳納靈石，踏入「${p.sr.name}」。此處只允許${REALMS[p.sr.tier]}期修士進入，裡面的其他修士都與你同境，寶物與危險並存。收穫須「撤離」才能帶出，戰敗則全部丟失。全程約 ${SR_MONTHS} 個月（入場與每通過一層各耗 1 個月），秘境內的修為收穫會折損，主要是來拿功法、法器與靈石。`,'y');mode='sr';render();};
const srLv=()=>{const s=p.sr,lo=s.tier*4,hi=s.tier*4+3;return cl(p.lv+R(-1,1)+(s.floor>3?1:0),lo,hi);};
G.srGo=()=>{
 if(mode!=='sr')return;const s=p.sr;s.step++;const lv=srLv();
 if(s.step>=4){const e=mkBoss(Math.min(lv+1,s.tier*4+3),pick(['秘境守衛','上古傀儡','護寶靈獸','殘魂劍靈']),pick(['中州','東荒古林','東海']));e.hp*=0.8;L(`第 ${s.floor} 層的守護者擋住了去路！`,'r');
  fight(e,{canFlee:false,win:()=>{give(mkBundle(lv,'boss',2));s.floor++;s.step=0;if(srTick())return;if(s.floor>5)vault();}});render();return;}
 const x=rnd();
 if(x<0.40)meetCult(lv);else if(x<0.70)fightBeast(lv,pick(['中州','東荒古林','東海','南疆']));
 else if(x<0.90)relic(lv);else{regen(0.3);L('你找到一處靈泉，稍作休整。','g');}
 render();
};
function vault(){
 const lv=p.sr.tier*4+3;
 showEv('你穿過最後一道禁制，來到秘境核心。三件寶物懸於半空，你只能取走一件。',[
  {l:`靈液×${SR_VAULT_LIQ} 與大量靈石`,f:()=>{const b={st:P(lv)*8,exp:Math.round(need(lv)*0.2),inv:newInv(),eq:[],techs:[]};b.inv.liq=SR_VAULT_LIQ;give(b);srLeave();}},
  {l:'一卷高階功法',f:()=>{const b={st:0,exp:0,inv:newInv(),eq:[],techs:[rollTech(lv,3)]};give(b);srLeave();}},
  {l:'一件上品法器',f:()=>{const b={st:0,exp:0,inv:newInv(),eq:[mkEq(p.sr.tier,null,Math.max(2,qroll(2)))],techs:[]};give(b);srLeave();}}]);
}
function srLeave(){
 const lt=p.sr.loot,mo=p.month-(p.sr.m0==null?p.month:p.sr.m0);p.sr=null;mode='act';
 L(`你撤離秘境，歷時 ${mo} 個月，實得修為 +${nf(lt.exp)}（已折損並計入靈根倍率）。帶出了收穫：`+bText(lt),'y');commit(lt).forEach(m=>L(m,'y'));
}
G.srOut=()=>{if(mode!=='sr')return;srLeave();render();};

 else if(k==='mp'&&p.inv.mp>0){p.inv.mp--;p.mp=Math.min(c.mp,p.mp+c.mp*.6);L('服下回靈丹，靈力恢復。','g');}
 else if(k==='liq'&&p.inv.liq>0){p.inv.liq--;const x=Math.round(need(p.lv)*0.1);gainExp(x);L(`煉化靈液，修為 +${nf(x)}。`,'g');}
 else if(k==='life'&&p.inv.life>0){p.inv.life--;p.extra+=20;L('服下延壽丹，壽元增加二十年。','y');}
 render();};
G.equip=i=>{const q=p.bag[i];if(!q)return;if(rIdx()<q.tier){L(`境界不足，需${REALMS[q.tier]}期才能使用。`,'r');render();return;}
 const old=p.eq[q.slot];p.eq[q.slot]=q;p.bag.splice(i,1);if(old)p.bag.push(old);L(`裝備了【${QN[q.q]}${q.name}】。`);fixTechs();render();};
G.unequip=s=>{if(p.eq[s]){p.bag.push(p.eq[s]);p.eq[s]=null;fixTechs();}render();};
G.eqTech=id=>{const t=TECHS[id];const bad=canUse(t);if(bad){L(bad,'r');render();return;}
 if(t.type==='心法')p.heart=p.heart===id?null:id;
 else if(t.type==='身法')p.foot=p.foot===id?null:id;
 else{const i=p.slots.indexOf(id);if(i>=0)p.slots[i]=null;else{const j=p.slots.indexOf(null);if(j<0)L('戰鬥技能欄已滿（最多4個），請先卸下一個。','r');else p.slots[j]=id;}}
 render();};
G.techF=v=>{techF=+v;render();};
G.techUnk=()=>{techUnk=!techUnk;render();};
G.selReg=k=>{selReg=k;render();};
const isLocked=k=>(k==='天裂淵'&&p.shards.length<7)||(k==='浮空仙域'&&!p.ending);
G.travel=k=>{if(mode!=='act')return;if(!REG[p.reg].adj.includes(k))return;
 if(isLocked(k)){L(k==='天裂淵'?'天裂淵結界封鎖，需集齊七塊天道碎片才能進入。':'浮空仙域尚未開啟。','r');tab='act';render();return;}
 p.reg=k;tick(1);L(`你抵達了「${k}」。`,'b');tab='act';if(mode==='dead'){render();return;}
 storyRegion(k);
 if(ch(0.3)){const rg=REG[k];fightBeast(R(rg.lv[0],rg.lv[1]));}render();};

/* ===== 畫面 ===== */
function bar(v,m,c){return`<div class="bar"><i class="${c}" style="width:${cl(v/m*100,0,100)}%"></i></div>`;}
function topHTML(){
 const age=Math.floor(16+p.month/12);
 return`<div class="row"><span><b>${p.name}</b> ${lvName(p.lv)}</span><span>靈石 <b>${fmt(p.st)}</b></span></div>
 <div class="row dim"><span>${p.reg}｜修行第${Math.floor(p.month/12)+1}年${p.month%12+1}月｜壽元 ${age}/${LIFE[rIdx()]+p.extra>9999?'∞':LIFE[rIdx()]+p.extra}</span><span>靈液 ${p.inv.liq}</span></div>`;
}
function expBar(){const n=need(p.lv);return`<div class="dim">修為 ${nf(p.exp)} / ${nf(n)}${p.lv%4===3&&p.lv<maxLv()?(p.exp>=n?'（可突破！）':'（圓滿）'):''}</div>${bar(p.exp,n,'xp')}`;}
function actHTML(){

  <div class="row"><b>你</b><span class="dim">氣血 ${nf(Pl.hp)}/${nf(Pl.hpMax)}　靈力 ${nf(Pl.mp)}/${nf(Pl.mpMax)}</span></div>${bar(Pl.hp,Pl.hpMax,'hp')}${bar(Pl.mp,Pl.mpMax,'mp')}</div>`;
 }else{

 }
 if(p.sr&&mode!=='battle')h+=`<div class="card y">「${p.sr.name}」第 ${p.sr.floor}/5 層，探索進度 ${p.sr.step}/4　已耗時 ${p.month-(p.sr.m0==null?p.month:p.sr.m0)} 個月<br>暫存修為 <b>+${nf(p.sr.loot.exp)}</b>（已折損）　暫存收穫：${bText(p.sr.loot)}</div>`;
 h+='<div id="log">'+p.log.slice(-40).map(x=>`<p class="${x.c}">${x.m}</p>`).join('')+'</div>';

  h+=`<button onclick="G.bt('heal')">療傷丹(${p.inv.heal})</button><button onclick="G.bt('mp')">回靈丹(${p.inv.mp})</button>`;

 }else if(mode==='ev'){

}
function shopHTML(){

 POTS.forEach(d=>{const lq=d[0]==='liq',ll=lq?liqLeft():1;
  h+=`<div class="card row"><span>${d[1]}<span class="dim">　${d[3]}（持有${p.inv[d[0]]}）${lq?`<br>進貨有限：每 ${LIQ_WIN} 個月最多 ${LIQ_CAP} 瓶，目前還可買 ${ll} 瓶`:''}</span></span><button class="btn sm" ${ll?'':'disabled'} onclick="G.buyPot('${d[0]}')">${c(P(p.lv)*d[2])}</button></div>`;});
 h+='<h3>裝備（每3個月更新）</h3>';
 s.eq.forEach((q,i)=>{if(!q)return;h+=`<div class="card"><div class="row"><span style="color:${QCOL[q.q]}">【${QN[q.q]}】${q.name}</span><button class="btn sm" onclick="G.buyEq(${i})">${c(eqPrice(q))}</button></div><div class="dim">需${REALMS[q.tier]}期　${eqDesc(q)}</div></div>`;});
 h+='<h3>功法卷軸</h3>';
 s.techs.forEach((id,i)=>{if(id==null)return;const t=TECHS[id];h+=`<div class="card"><div class="row"><span style="color:${GCOL[Math.floor(t.rank/3)]}">《${t.name}》</span><button class="btn sm" onclick="G.buyTech(${i})">${c(Math.round(P(t.req*4)*(2+t.rank*3)))}</button></div><div class="dim">${rk(t.rank)}｜${t.school}｜${t.type}｜需${REALMS[t.req]}期${p.techs.includes(id)?'｜已學（買入為殘卷）':''}</div></div>`;});
 h+='<h3>出售背包裝備</h3>';
 if(!p.bag.length)h+='<div class="dim">背包是空的。</div>';
 p.bag.forEach((q,i)=>{h+=`<div class="card row"><span style="color:${QCOL[q.q]}">${q.name}<span class="dim">（需${REALMS[q.tier]}期）</span></span><button class="btn sm" onclick="G.sell(${i})">賣 ${c(Math.round(eqPrice(q)*0.4))}</button></div>`;});
 return h+'<button class="btn" style="width:100%;margin-top:6px" onclick="G.leaveShop()">離開</button>';

function mapHTML(){
 const k=selReg||p.reg,r=REG[k],adj=REG[p.reg].adj.includes(k);
 let h='<canvas id="map" width="360" height="400" style="width:100%;border-radius:8px;border:1px solid #2a3140"></canvas>';
 h+=`<div class="card"><div class="row"><b>${k}</b><span class="dim">靈氣 ×${r.qi}</span></div>
 <div class="dim">妖獸屬性：${r.el}（對應${SCHOOLS[ELSC[r.el]].n}）</div>
 <div class="dim">建議境界：${lvName(r.lv[0])} ～ ${lvName(r.lv[1])}${r.city?'｜有坊市與秘境入口':''}${r.boss&&k!=='天裂淵'?'｜守關者：'+r.boss+(p.bossDown[k]?'（已擊敗）':''):''}</div>
 <div class="dim">${isLocked(k)?'🔒 '+(k==='天裂淵'?'需集齊七塊天道碎片':'完成主線結局後開啟'):(k===p.reg?'你目前所在地':adj?'相鄰，可前往（耗時1個月）':'不相鄰，需先前往中間區域')}</div>
 ${k!==p.reg&&adj&&!isLocked(k)?`<button class="btn" style="width:100%;margin-top:6px" onclick="G.travel('${k}')">前往${k}</button>`:''}</div>`;

}
function drawMap(){
 const cv=$('#map');if(!cv)return;const c=cv.getContext('2d'),W=360,H=400;
 const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1020');g.addColorStop(1,'#16101e');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.fillStyle='#ffffff30';for(let i=0;i<50;i++)c.fillRect((i*97)%W,(i*53)%H,1.5,1.5);
 c.strokeStyle='#3a4358';c.setLineDash([4,4]);
 for(const k in REG)REG[k].adj.forEach(a=>{if(k<a){c.beginPath();c.moveTo(REG[k].x,REG[k].y);c.lineTo(REG[a].x,REG[a].y);c.stroke();}});
 c.setLineDash([]);
 for(const k in REG){const r=REG[k],lk=isLocked(k),rad=k==='天裂淵'?36:30;
  const rg=c.createRadialGradient(r.x,r.y,4,r.x,r.y,rad);rg.addColorStop(0,r.col);rg.addColorStop(1,r.col+'33');
  c.globalAlpha=lk?0.45:1;c.fillStyle=rg;c.beginPath();c.arc(r.x,r.y,rad,0,7);c.fill();c.globalAlpha=1;
  c.lineWidth=k===p.reg?3:1;c.strokeStyle=k===p.reg?'#e6c35a':'#555f73';c.stroke();
  if(k===(selReg||p.reg)){c.lineWidth=2;c.strokeStyle='#ffffff';c.beginPath();c.arc(r.x,r.y,rad+5,0,7);c.stroke();}
  c.fillStyle='#e8ecf2';c.font='13px sans-serif';c.textAlign='center';c.fillText((lk?'🔒':'')+k,r.x,r.y+rad+15);
  if(k===p.reg){c.fillStyle='#e6c35a';c.font='15px sans-serif';c.fillText('★',r.x,r.y+5);}
  if(p.bossDown[k]){c.fillStyle='#7fcf9a';c.font='12px sans-serif';c.fillText('✔',r.x+rad-8,r.y-rad+12);}
 }
 cv.onclick=e=>{const rc=cv.getBoundingClientRect(),x=(e.clientX-rc.left)*W/rc.width,y=(e.clientY-rc.top)*H/rc.height;let best=null,bd=1e9;
  for(const k in REG){const d=Math.hypot(REG[k].x-x,REG[k].y-y);if(d<bd){bd=d;best=k;}}if(bd<45){selReg=best;render();}};
}
function techHTML(){
 const own=p.techs.length;
 let h=`<div class="dim">已領悟 ${own}/${TECHS.length} 種。你的流派：<b class="y">${SCHOOLS[p.sc].n}</b>，交好：${ALLY[p.sc].map(i=>SCHOOLS[i].n).join('、')}。<br>天階只有本流派能修；地階限本流派、交好流派或有該流派武器／法寶；玄黃階可跨流派但威力×${offPen()}（心法身法×${offRel()}）${p.root.type==='偽'?'（偽靈根萬金油）':''}；通用功法威力×0.9。</div>`;
 h+=`<div class="card"><b>相剋一覽</b><div class="dim">你是${SCHOOLS[p.sc].n}：剋 <span class="g">${CTR_NEXT[p.sc]!=null?SCHOOLS[CTR_NEXT[p.sc]].n:'—'}</span>（傷害×${CTR_UP}），被 <span class="r">${CTR_PREV(p.sc).map(i=>SCHOOLS[i].n).join('、')||'—'}</span> 剋（傷害×${CTR_DOWN}）。以功法所屬流派判定，通用功法不參與。</div>
 ${CTR_RINGS.map(r=>`<div class="dim">${r.concat(r[0]).map(i=>SCHOOLS[i].n).join('→')}</div>`).join('')}
 <div class="dim">「A→B」＝A 剋 B。妖獸與首領依地區有五行屬性（金＝劍修、木＝丹修、土＝體修、水＝陣修、火＝器修），只與五行環互剋；御獸功法打妖獸另有×${CTR_SUMMON_UP}。</div></div>`;
 h+=`<div class="card"><b>當前配置</b><div class="dim">心法：${p.heart!=null?TECHS[p.heart].name:'無'}　身法：${p.foot!=null?TECHS[p.foot].name:'無'}</div><div class="dim">技能：${p.slots.map(i=>i!=null?TECHS[i].name:'—').join('｜')}</div></div>`;
 h+=`<div class="row"><select onchange="G.techF(this.value)"><option value="-1">全部流派</option>${SCHOOLS.map((s,i)=>`<option value="${i}" ${techF===i?'selected':''}>${s.n}</option>`).join('')}<option value="12" ${techF===12?'selected':''}>通用</option></select><button class="btn sm" style="white-space:nowrap" onclick="G.techUnk()">${techUnk?'隱藏未習得':'顯示未習得'}</button></div><div style="height:6px"></div>`;
 const list=TECHS.filter(t=>(techF<0||t.sc===techF)&&(techUnk||p.techs.includes(t.id))).sort((a,b)=>b.rank-a.rank||a.id-b.id);
 if(!list.length)h+='<div class="dim">這個分類還沒有領悟的功法。</div>';
 list.forEach(t=>{
  const has=p.techs.includes(t.id),col=GCOL[Math.floor(t.rank/3)];
  if(!has){h+=`<div class="card dim row"><span>？？？？　<span style="color:${col}">${rk(t.rank)}</span>・${t.school}${t.type}</span></div>`;return;}
  const on=p.heart===t.id||p.foot===t.id||p.slots.includes(t.id),r=rel(t),bad=canUse(t);
  const rc=bad?'r':r==='off'?'r':r==='gen'?'dim':'g';
  h+=`<div class="card"><div class="row"><span><b style="color:${col}">《${t.name}》</b> <span class="tag" style="color:${col}">${rk(t.rank)}</span></span><button class="btn sm" onclick="G.eqTech(${t.id})">${on?'卸下':'裝備'}</button></div>
  <div class="dim">${t.school}${t.e?'（'+t.e+'屬性）':''}・${t.type}｜需${REALMS[t.req]}期｜熟練 ${p.mas[t.id]}/5｜<span class="${rc}">${bad&&rIdx()>=t.req?'無法修煉':RELTXT[r]}</span></div><div class="dim">${techEff(t)}</div></div>`;});
 return h;
}
function bagHTML(){
 let h='<h3>身上裝備</h3>';
 SLOTS.forEach(s=>{const q=p.eq[s];h+=`<div class="card row"><span>${s}：${q?`<span style="color:${QCOL[q.q]}">${q.name}</span><div class="dim">${QN[q.q]}・${eqDesc(q)}</div>`:'<span class="dim">空</span>'}</span>${q?`<button class="btn sm" onclick="G.unequip('${s}')">卸下</button>`:''}</div>`;});
 h+='<h3>背包裝備</h3>';
 if(!p.bag.length)h+='<div class="dim">背包是空的。</div>';
 p.bag.forEach((q,i)=>{h+=`<div class="card row"><span><span style="color:${QCOL[q.q]}">${q.name}</span> <span class="dim">${q.slot}・${QN[q.q]}・需${REALMS[q.tier]}期<br>${eqDesc(q)}</span></span><button class="btn sm" onclick="G.equip(${i})">裝備</button></div>`;});
 h+='<h3>道具</h3>';
 [['liq','靈液','直接煉化，獲得修為；突破時也可增加成功率'],['heal','療傷丹','回復50%氣血'],['mp','回靈丹','回復60%靈力'],['brk','破境丹','突破時使用'],['life','延壽丹','壽元+20年']].forEach(d=>{
  h+=`<div class="card row"><span>${d[1]} ×${p.inv[d[0]]}<div class="dim">${d[2]}</div></span>${d[0]!=='brk'&&mode!=='battle'?`<button class="btn sm" onclick="G.use('${d[0]}')">使用</button>`:''}</div>`;});
 h+=`<div class="card">靈石：${fmt(p.st)}<div class="dim">（100下品＝1中品，100中品＝1上品）</div></div>`;

}

function roleHTML(){
 const c=calc();
 let h=`<div class="card"><b>${p.name}</b>　${lvName(p.lv)}<div class="dim">${rootTxt(p.root)}</div><div class="dim">${rootLine(p.root.type)}</div><div class="dim">${rootCmp(p.root.type)}</div>
 <div class="dim">修煉速度：靈根 ×${rootMult()}　心法加成 ×${c.exp.toFixed(2)}　地區靈氣 ×${REG[p.reg].qi}　＝ 總 ×${(rootMult()*c.exp*REG[p.reg].qi).toFixed(2)}</div>${expBar()}</div>

 <div class="card">歲數：${Math.floor(16+p.month/12)}　壽元上限：${LIFE[rIdx()]+p.extra>9999?'∞':LIFE[rIdx()]+p.extra}<div class="dim">秘境擊敗修士：${p.pk} 人</div>

 ${scrollHTML()}${styHTML()}

function deadHTML(){return`<div class="card"><h3>坐化</h3><p>你的壽元已盡，於${p.reg}盤膝坐化，一生修至「${lvName(p.lv)}」，擊敗秘境修士 ${p.pk} 人，集得天道碎片 ${p.shards.length} 塊。</p><button class="btn" onclick="G.restart()">轉世重修</button></div>`;}

 if(!intro)intro={name:'',sc:0,root:rollRoot()};
 return`<a href="../" style="display:inline-block;color:#e6c35a;font-size:13px;text-decoration:none;opacity:.8;margin-bottom:6px">← ARCADE</a><h3 style="font-size:20px">${GAME_NAME}</h3><p class="y" style="margin:2px 0 6px">${GAME_SUB}</p><p class="dim">天道崩裂，九州分裂。集齊七塊碎片，補全飛升之路——或者另做選擇。</p>

 <div class="card"><div class="dim">靈根</div><div style="font-size:17px" class="y">${rootTxt(intro.root)}</div><div class="dim">${rootLine(intro.root.type)}</div><div class="dim">${rootCmp(intro.root.type)}</div><button class="btn sm" style="margin-top:6px" onclick="G.reroll()">重擲靈根</button></div>

function render(){
 if(!p){$('#top').innerHTML='';$('#view').innerHTML=introHTML();$('#tabs').innerHTML='';return;}
 if(mode==='battle'||mode==='ev'||mode==='shop'&&tab!=='act')tab='act';
 $('#top').innerHTML=topHTML();
 const T=[['act','行動'],['map','地圖'],['tech','功法'],['bag','裝備'],['role','角色']];
 $('#tabs').innerHTML=T.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="G.tab('${x[0]}')">${x[1]}</button>`).join('');
 let v;
 if(mode==='dead')v=deadHTML();else if(tab==='act')v=actHTML();else if(tab==='map')v=mapHTML();else if(tab==='tech')v=techHTML();else if(tab==='bag')v=bagHTML();else v=roleHTML();
 $('#view').innerHTML=v;
 if(tab==='map'&&mode!=='dead')drawMap();
 const lg=$('#log');if(lg)lg.scrollTop=lg.scrollHeight;
 save();
}
(function boot(){
 try{const raw=localStorage.getItem(KEY);if(raw){p=JSON.parse(raw);selReg=p.reg;for(const k in p.eq)if(p.eq[k]&&p.eq[k].sc==null)p.eq[k].sc=12;p.bag.forEach(q=>{if(q.sc==null)q.sc=12;});fixSave();mode=resumeMode();}}catch(e){p=null;}
 try{document.title=GAME_NAME;}catch(e){}
 render();
})();
