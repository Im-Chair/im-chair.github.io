<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="深掘礦工">
<meta name="theme-color" content="#111923">
<title>深掘！像素礦工</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 版面：直式一屏。上方狀態列、中間地圖、下方訊息與操作（左道具、右方向鍵） */
:root {
  --bg: #111923;
  --panel: #1b2735;
  --panel2: #223144;
  --line: #3a4d61;
  --ink: #f4e8cf;
  --muted: #9fb0c2;
  --gold: #ffd166;
  --good: #8fdc8a;
  --warn: #ffb347;
  --bad: #ff7a66;
  --ts: 26px;
  --font-px: 'Silkscreen', 'Courier New', monospace;
  --font-ui: system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#app { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; }
button { font: inherit; color: var(--ink); cursor: pointer; touch-action: manipulation; }

/* 頂列 */
.top { display: flex; align-items: center; gap: 8px; }
.icon {
  flex: none; width: 38px; height: 38px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  font-size: 18px; text-decoration: none; color: var(--ink); padding: 0;
}
.title { flex: 1; min-width: 0; }
.title h1 { margin: 0; font-size: 18px; color: var(--gold); letter-spacing: .04em; white-space: nowrap; }
.title .sub { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 狀態列 */
.stats { display: grid; grid-template-columns: 1fr 1.35fr 1fr 1.1fr; gap: 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 4px 7px 5px; min-width: 0; }
.stat small { display: block; font-size: 10px; color: var(--muted); }
.stat b { display: block; font-family: var(--font-px); font-size: 14px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ebar { height: 4px; background: #0b121a; border-radius: 2px; margin-top: 2px; overflow: hidden; }
.ebar i { display: block; height: 100%; background: linear-gradient(90deg, #6fd36a, #c6f06b); width: 100%; transition: width .15s; }
.ebar.low i { background: linear-gradient(90deg, #ff6b5b, #ffb347); }
.stat.full b { color: var(--warn); }

/* 地圖 */
.map-wrap { position: relative; padding: 4px; background: #070b10; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
#map { display: grid; gap: 0; justify-content: center; touch-action: manipulation; }
.map-wrap.hit { animation: hit .35s; }
.map-wrap.boom { animation: shake .35s; }
@keyframes hit { 0%, 100% { box-shadow: none; } 30% { box-shadow: inset 0 0 0 4px var(--bad); } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translate(-3px, 1px); } 50% { transform: translate(3px, -1px); } 75% { transform: translate(-2px, 0); } }
#banner {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: rgba(10, 14, 20, .86); border: 1px solid var(--gold); color: var(--gold);
  padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .4s;
}
#banner.show { opacity: 1; }

.tile {
  width: var(--ts); height: var(--ts); position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--ts) * .6); line-height: 1; overflow: hidden;
  background: #05080c;
}
/* 各層岩石色（--rk 底色、--rk2 斑點、--tn 挖空後的通道色） */
.L0 { --rk: #3d6b43; --rk2: #2f5735; --tn: #2a2119; }
.L1 { --rk: #7a5537; --rk2: #64432a; --tn: #2c1f16; }
.L2 { --rk: #9b958a; --rk2: #7f7a70; --tn: #2b2a28; }
.L3 { --rk: #45606c; --rk2: #344b56; --tn: #182329; }
.L4 { --rk: #54457a; --rk2: #42365f; --tn: #1c1729; }
.L5 { --rk: #3e2d2d; --rk2: #2c2020; --tn: #1a1010; }
.L6 { --rk: #7b6e4f; --rk2: #5f5439; --tn: #221e15; }
.L7 { --rk: #262a3c; --rk2: #1a1d2b; --tn: #0c0d14; }
.k-rock, .k-ore, .k-boulder, .k-gp, .k-page {
  background:
    radial-gradient(circle at 28% 30%, var(--rk2) 0 11%, transparent 12%),
    radial-gradient(circle at 72% 68%, var(--rk2) 0 9%, transparent 10%),
    var(--rk);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.22), inset 2px 2px 0 rgba(255,255,255,.06);
}
.k-rock.v1 {
  background:
    radial-gradient(circle at 66% 26%, var(--rk2) 0 10%, transparent 11%),
    radial-gradient(circle at 30% 74%, var(--rk2) 0 12%, transparent 13%),
    var(--rk);
}
.L6.k-rock { background: linear-gradient(var(--rk2) 0 2px, transparent 2px) 0 48% / 100% 50%, linear-gradient(90deg, var(--rk2) 0 2px, transparent 2px) 45% 0 / 50% 50%, var(--rk); }
.k-empty { background: var(--tn); }
.k-mem { background: var(--tn); filter: brightness(.45); }
.k-dark { background: #05080c; }
.dim { filter: brightness(.5) saturate(.7); }
.k-ore { color: var(--oc, #fff); text-shadow: 0 0 2px rgba(0,0,0,.8); font-weight: 700; }
.o-coal { --oc: #15171a; text-shadow: 0 0 2px rgba(255,255,255,.35); }
.o-copper { --oc: #ff8a3d; }
.o-iron { --oc: #d9c7b4; }
.o-silver { --oc: #e8f1ff; }
.o-jade { --oc: #57e0a3; }
.o-quartz { --oc: #f4f9ff; }
.o-amethyst { --oc: #c58bff; }
.o-obsidian { --oc: #8a6cff; text-shadow: 0 0 3px #000; }
.o-gold { --oc: #ffd23f; }
.o-ruby { --oc: #ff3b5c; }
.o-starsilver { --oc: #bfe8ff; text-shadow: 0 0 5px #bfe8ff; }
.o-abyssal { --oc: #40f0e0; text-shadow: 0 0 6px #40f0e0; }
.k-boulder::after {
  content: ''; position: absolute; inset: 13%; border-radius: 46% 52% 44% 50%;
  background: radial-gradient(circle at 34% 30%, #d8d1c4, #8c8478 55%, #5a544c);
  box-shadow: inset -2px -2px 0 rgba(0,0,0,.28), 0 1px 0 rgba(0,0,0,.4);
}
.k-boulder::before { content: ''; position: absolute; left: 44%; top: 22%; width: 2px; height: 34%; background: #3d3832; transform: rotate(18deg); z-index: 1; }
.k-boulder.wob::before { content: '!'; left: auto; top: 0; right: 2px; width: auto; height: auto; background: none; transform: none; z-index: 2; }
.k-gp::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 35% 40%, #8bdc5a 0 9%, transparent 10%), radial-gradient(circle at 68% 62%, #8bdc5a 0 7%, transparent 8%), radial-gradient(circle at 60% 25%, #6fbf45 0 6%, transparent 7%);
  opacity: .85;
}
.wob { animation: wob .22s infinite; }
.wob::before { content: '!'; position: absolute; top: 0; right: 2px; font-family: var(--font-px); font-size: calc(var(--ts) * .38); color: #ffdd55; text-shadow: 0 0 2px #000; z-index: 2; }
@keyframes wob { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1.5px); } }
.k-water { background: linear-gradient(#4b8fcb, #2b5f92); color: #cfe9ff; font-weight: 700; }
.k-gas { background: var(--tn); color: #b6f08a; }
.k-gas::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(150, 230, 90, .55), rgba(110, 190, 60, .25) 70%); animation: gas 1.4s infinite alternate; }
@keyframes gas { from { opacity: .55; } to { opacity: .95; } }
.k-lava { background: radial-gradient(circle at 50% 45%, #ffe08a, #ff7a1a 55%, #b4330c); animation: glow 1.1s infinite alternate; }
@keyframes glow { from { filter: brightness(.9); } to { filter: brightness(1.2); } }
.k-station { background: var(--tn); box-shadow: inset 0 0 0 2px #e0c46c, 0 0 8px #e0c46c; }
.k-camp { background: radial-gradient(circle, #6d7582, var(--tn) 75%); }
.k-glowfloor { background: radial-gradient(circle, rgba(200, 205, 215, .22), transparent 70%), var(--tn); }
.k-beam { background: var(--tn); }
.k-beam::after { content: ''; position: absolute; left: 14%; right: 14%; top: 6%; bottom: 0; border: 3px solid #b07a43; border-bottom: none; border-radius: 2px 2px 0 0; }
.k-page { animation: glow 1.4s infinite alternate; }
.k-glim { background: #05080c; color: #ffe9a8; font-size: calc(var(--ts) * .45); animation: glim 1.6s infinite alternate; }
@keyframes glim { from { opacity: .25; } to { opacity: .9; } }
.k-sky { background: linear-gradient(#7f8d9a, #95a2ad); }
.k-sky.hi { background: linear-gradient(#66737f, #7f8d9a); }
.k-house { background: linear-gradient(#95a2ad, #a7b2ba); font-size: calc(var(--ts) * .78); cursor: pointer; }
.k-grass { background: #4a3626; box-shadow: inset 0 calc(var(--ts) * .28) 0 #5d9a52, inset 0 calc(var(--ts) * .34) 0 #3d6b43; }
.me { z-index: 1; }
.me::after { content: ''; position: absolute; inset: 1px; border: 2px solid var(--gold); border-radius: 3px; }
.me.hurt::after { border-color: var(--bad); }

/* 訊息 */
.log {
  background: #0b121a; border: 1px solid var(--line); border-radius: 9px;
  padding: 6px 9px; font-size: 12.5px; line-height: 1.5; height: calc(1.5em * 3 + 14px); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log div:not(:last-child) { opacity: .5; }
.log .good { color: var(--good); }
.log .warn { color: var(--warn); }
.log .bad { color: var(--bad); }
.log .layer { color: var(--gold); }
.log .page { color: #ffe9a8; }

/* 背包列 / 小鎮列 */
.strip { display: flex; gap: 5px; min-height: 34px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; font-size: 12px; white-space: nowrap; }
.chip .g { font-weight: 700; margin-right: 3px; }
.chip.empty { color: var(--muted); border-style: dashed; }
.town { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
.town button { background: #2b3b4c; border: 1px solid #52677e; border-bottom: 3px solid #405267; border-radius: 9px; padding: 6px 2px; font-size: 13px; }

/* 操作 */
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.items, .pad { display: grid; gap: 5px; grid-template-rows: 44px 44px; }
.items { grid-template-columns: 1fr 1fr; }
.pad { grid-template-columns: repeat(3, 1fr); }
.btn {
  background: #2b3b4c; border: 1px solid #52677e; border-bottom: 3px solid #405267; border-radius: 9px;
  padding: 0 4px; font-size: 13px; line-height: 1.1; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.btn:active { transform: translateY(1px); border-bottom-width: 2px; }
.btn[disabled] { opacity: .45; }
.btn .n { font-family: var(--font-px); font-size: 12px; color: var(--gold); }
.pad .btn { font-size: 18px; }
.pad .up { grid-column: 2; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; background: #6b4a2c; border-color: #a77649; border-bottom-color: #7e5631; }
.pad .right { grid-column: 3; grid-row: 2; }
.btn.ctx { background: #3b3424; border-color: #7a6a3f; border-bottom-color: #5f522f; }

/* 對話框 */
dialog {
  background: #1a2634; color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
  width: min(460px, calc(100% - 24px)); max-height: 86vh; padding: 0; overflow: hidden;
}
dialog::backdrop { background: rgba(0, 0, 0, .62); }
.sheet-in { display: flex; flex-direction: column; max-height: 86vh; }
.sheet-in h2 { margin: 0; padding: 14px 16px 8px; font-size: 18px; color: var(--gold); }
#shBody { padding: 0 16px 6px; overflow-y: auto; font-size: 14px; line-height: 1.7; user-select: text; -webkit-user-select: text; }
#shFoot { padding: 10px 16px 14px; display: flex; gap: 8px; }
#shFoot button { flex: 1; padding: 11px 6px; border-radius: 10px; background: #2b3b4c; border: 1px solid #52677e; border-bottom: 3px solid #405267; }
#shFoot button.primary { background: #6b4a2c; border-color: #a77649; border-bottom-color: #7e5631; }
#shBody p { margin: 8px 0; }
#shBody h3 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; letter-spacing: .05em; }
.letter { background: #f2e6c9; color: #3a2c1a; border-radius: 6px; padding: 12px 14px; white-space: pre-line; font-size: 14px; line-height: 1.85; box-shadow: inset 0 0 18px rgba(120, 90, 40, .25); }
.letter .date { display: block; font-weight: 700; margin-bottom: 4px; }
.narr { color: #d6cbb3; white-space: pre-line; }
.npc { display: flex; gap: 12px; align-items: flex-start; }
.npc .face { font-size: 40px; line-height: 1; flex: none; }
.npc b { color: var(--gold); }
.npc small { color: var(--muted); margin-left: 6px; }
.npc .say { margin: 4px 0 0; }
.row {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  background: #223144; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 5px 0;
}
.row[disabled] { opacity: .5; }
.row .ri { font-size: 22px; flex: none; width: 28px; text-align: center; }
.row .rt { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.4; }
.row .rt small { display: block; color: var(--muted); font-size: 11.5px; }
.row .rp { font-family: var(--font-px); color: var(--gold); font-size: 13px; white-space: nowrap; }
.link { background: none; border: none; color: #8fc3ff; padding: 6px 0; font-size: 13px; }
.jlist .row .rt { font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13.5px; }
.kv span:nth-child(odd) { color: var(--muted); }
.seed { font-family: var(--font-px); font-size: 11px; color: var(--muted); }

@media (min-width: 600px) {
  body { padding-top: 18px; }
  .title h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <a class="icon" href="../" aria-label="回首頁">🏠</a>
    <div class="title">
      <h1>深掘！像素礦工</h1>
      <div class="sub" id="vWhere">灰燈鎮 · 地表</div>
    </div>
    <button class="icon" id="bJournal" type="button" aria-label="爺爺的日記">📖</button>
    <button class="icon" id="bMenu" type="button" aria-label="選單">☰</button>
  </header>

  <section class="stats">
    <div class="stat"><small>深度</small><b id="vDepth">0 m</b></div>
    <div class="stat"><small>體力</small><b id="vEnergy">30/30</b><div class="ebar" id="eBar"><i id="eFill"></i></div></div>
    <div class="stat" id="bagStat"><small>背包</small><b id="vBag">0/8</b></div>
    <div class="stat"><small>金幣</small><b id="vGold">0 G</b></div>
  </section>

  <div class="map-wrap" id="mapWrap">
    <div id="map" role="grid" aria-label="礦坑地圖：點相鄰的格子挖掘或移動，點遠處的通道可自動走過去"></div>
    <div id="banner"></div>
  </div>

  <div class="log" id="log" role="status" aria-live="polite"></div>

  <div class="strip" id="strip"></div>

  <div class="controls">
    <div class="items">
      <button class="btn" id="bBomb" type="button">💣 炸藥 <span class="n" id="nBomb">0</span></button>
      <button class="btn" id="bBeam" type="button">🏗️ 支撐 <span class="n" id="nBeam">0</span></button>
      <button class="btn" id="bRope" type="button">➰ 繩索 <span class="n" id="nRope">0</span></button>
      <button class="btn ctx" id="bCtx" type="button">📯 求救</button>
    </div>
    <div class="pad" id="pad">
      <button class="btn up" type="button" data-dir="0,-1" aria-label="上">▲</button>
      <button class="btn left" type="button" data-dir="-1,0" aria-label="左">◀</button>
      <button class="btn down" type="button" data-dir="0,1" aria-label="下（挖）">⛏</button>
      <button class="btn right" type="button" data-dir="1,0" aria-label="右">▶</button>
    </div>
  </div>
</div>

<dialog id="sheet">
  <div class="sheet-in">
    <h2 id="shTitle"></h2>
    <div id="shBody"></div>
    <div id="shFoot"></div>
  </div>
</dialog>

<script>
/* =====================================================================
 * 深掘！像素礦工
 * 結構：
 *   Miner —— 核心規則（地形生成、挖掘、落石／積水／岩漿／毒氣、經濟），不碰 DOM，node 也能跑
 *   下方 UI 區 —— 畫面、輸入、音效、存檔、劇情文字
 * 存檔：arcade-deep-miner-save（進行中的局）
 * 紀錄：arcade-deep-miner-stats = { story: { plays, wins, best: { days, digs }, deepest } }
 *       best 內越小越好（通關天數、通關挖掘次數）；deepest 為到過的最深公尺數（越大越好，放在 best 外）
 * ===================================================================== */

var Miner = (function () {
  'use strict';

  var W = 13;              // 地圖寬（格）
  var START_X = 6;         // 坑口所在的欄
  var CAMP_Y = 118;        // 爺爺營地的深度（格）
  var MAIN_END = 120;      // 主線結束；再往下是無盡的裂谷
  var M_PER_CELL = 2;      // 一格 = 2 公尺
  var SIM = 18;            // 只模擬玩家上下這麼多格內的落石與液體
  var PAGE_ROWS = [9, 25, 44, 64, 86, 106, 113];   // 七張散落的日記殘頁（第八張在營地）
  var MAIN_STATIONS = [14, 32, 54, 77, 102];       // 每層開頭附近的舊升降站

  // ---- 地層 ----
  // ores：[礦物, 機率, 最淺出現深度(可省)]；dark：越深越暗，從燈的半徑扣掉的格數
  var LAYERS = [
    { id: 'surface', name: '地表', from: 0, rock: 'soil', dark: 0, ores: [] },
    { id: 'soil', name: '表土層', from: 1, rock: 'soil', dark: 0,
      ores: [['stone', 0.17], ['coal', 0.12], ['copper', 0.05, 5]],
      intro: '鬆軟的泥土，偶爾夾著煤。這裡還聽得到上面的鳥叫。' },
    { id: 'lime', name: '石灰岩層', from: 13, rock: 'lime', dark: 0, boulder: 0.05,
      ores: [['copper', 0.11], ['iron', 0.07], ['coal', 0.05], ['fossil', 0.015]],
      intro: '灰白的岩壁。裂開的大石頭底下一空就會掉，看到它在晃就快閃開。' },
    { id: 'river', name: '地下河', from: 31, rock: 'shale', dark: 1, boulder: 0.03, water: 0.2,
      ores: [['silver', 0.08], ['iron', 0.06], ['copper', 0.04], ['jade', 0.02]],
      intro: '岩壁又濕又滑，到處是積水。從下面挖穿水囊，水會整個灌下來。' },
    { id: 'geode', name: '晶洞', from: 53, rock: 'crust', dark: 1, boulder: 0.02, gas: 0.045,
      ores: [['quartz', 0.1], ['amethyst', 0.05], ['silver', 0.04]],
      intro: '滿牆的晶石在燈下發亮。帶綠斑的岩塊是毒氣囊，敲開前先想好退路。' },
    { id: 'lava', name: '熔岩帶', from: 76, rock: 'basalt', dark: 2, boulder: 0.03, lava: 0.16,

  ];

  // ---- 礦物（放背包，回地表賣） ----
  var ORES = {

    iron:       { name: '鐵礦',   v: 20,  g: '●' },

    silver:     { name: '銀礦',   v: 45,  g: '●' },

  // ---- 硬度（每敲一下扣掉十字鎬的挖掘力） ----
  var HARD = {

    obsidian: 14, gold: 13, ruby: 15, relic: 18, starsilver: 20, abyssal: 24

  var NAMES = {
    soil: '泥土', stone: '碎石', lime: '石灰岩', shale: '頁岩', crust: '晶殼岩', basalt: '玄武岩',
    brick: '遺跡石磚', abyss: '深淵岩', boulder: '鬆動的大石', gaspocket: '帶綠斑的岩塊',

  // ---- 升級（索引 0 是初始） ----
  var UP = {
    pick: { name: '十字鎬', unit: '挖掘力', lv: [1, 2, 3, 5, 7, 10], cost: [0, 120, 400, 1000, 2400, 5200] },
    bag:  { name: '背包',   unit: '容量',   lv: [8, 14, 22, 32, 46, 64], cost: [0, 90, 300, 780, 1800, 3900] },
    lamp: { name: '礦燈',   unit: '照明',   lv: [2, 3, 4, 5, 6, 7], cost: [0, 70, 260, 650, 1500, 3200] },
    stam: { name: '體力',   unit: '上限',   lv: [30, 45, 65, 90, 120, 160], cost: [0, 100, 330, 840, 1900, 4200] }
  };
  var ITEMS = {
    bomb: { name: '炸藥',     price: 35, max: 9 },
    beam: { name: '支撐木',   price: 12, max: 9 },
    rope: { name: '回城繩索', price: 40, max: 5 }
  };

  // ---- 種子亂數：同一個 (seed, x, y, k) 永遠得到同一個 0~1 的值 ----
  function hash(seed, x, y, k) {
    var h = (seed >>> 0) ^ 0x9e3779b9;
    h = Math.imul(h ^ (x + 0x632be5ab), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13) ^ (y + 0x7f4a7c15), 0xc2b2ae35);
    h = Math.imul(h ^ (h >>> 16) ^ Math.imul(k + 1, 0x27d4eb2f), 0x165667b1);
    h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d);
    h ^= h >>> 12; h = Math.imul(h, 0x297a2d39);
    h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  }
  function key(x, y) { return x + ',' + y; }

  function layerIndex(y) {
    for (var i = LAYERS.length - 1; i >= 0; i--) if (y >= LAYERS[i].from) return i;
    return 0;
  }
  function stationRow(i) { return i < MAIN_STATIONS.length ? MAIN_STATIONS[i] : 145 + (i - MAIN_STATIONS.length) * 25; }
  function stationIndexOfRow(y) {
    var i = MAIN_STATIONS.indexOf(y);
    if (i >= 0) return i;
    if (y >= 145 && (y - 145) % 25 === 0) return MAIN_STATIONS.length + (y - 145) / 25;
    return -1;
  }
  function stationPos(seed, i) {
    return { x: 2 + Math.floor(hash(seed, i, 0, 22) * (W - 4)), y: stationRow(i) };
  }

  // ---- 固定的特殊地點（日記頁、升降站、營地），每個種子算一次 ----
  var SP = { seed: null };
  function specials(seed) {
    if (SP.seed === seed) return SP;
    var sp = { seed: seed, pages: [], stations: [], camp: null, map: {} };
    PAGE_ROWS.forEach(function (y, i) {
      var p = { x: 1 + Math.floor(hash(seed, i, y, 21) * (W - 2)), y: y };
      sp.pages.push(p);
      sp.map[key(p.x, p.y)] = 'page';
    });
    for (var i = 0; i < MAIN_STATIONS.length; i++) sp.stations.push(stationPos(seed, i));
    var cx = 3 + Math.floor(hash(seed, 0, 0, 23) * (W - 6));
    sp.camp = { x: cx, y: CAMP_Y };
    for (var yy = CAMP_Y - 2; yy <= CAMP_Y; yy++)
      for (var xx = cx - 2; xx <= cx + 2; xx++) sp.map[key(xx, yy)] = 'empty';
    sp.map[key(cx, CAMP_Y)] = 'camp';
    for (xx = cx - 2; xx <= cx + 2; xx++) sp.map[key(xx, CAMP_Y + 1)] = 'brick';
    SP = sp;
    CACHE = { seed: seed, m: {} };
    return sp;
  }

  // 特殊地點附近不放危險，保證拿得到
  function isSafe(sp, x, y) {
    if (y <= 3) return true;
    if (y >= CAMP_Y - 5 && y <= MAIN_END) return true;
    for (var i = 0; i < sp.pages.length; i++) {
      var p = sp.pages[i];
      if (Math.abs(p.x - x) <= 1 && Math.abs(p.y - y) <= 2) return true;
    }
    for (var d = -2; d <= 2; d++) {
      var si = stationIndexOfRow(y + d);
      if (si >= 0) {
        var s = si < sp.stations.length ? sp.stations[si] : stationPos(sp.seed, si);
        if (Math.abs(s.x - x) <= 3) return true;
      }
    }
    return false;
  }

  // ---- 地形生成（種子決定，不存檔；玩家改動另存在 S.mod） ----
  var CACHE = { seed: null, m: {} };
  function genTile(seed, x, y) {
    if (CACHE.seed !== seed) CACHE = { seed: seed, m: {} };
    var k = key(x, y);
    var c = CACHE.m[k];
    if (c) return c;
    c = genRaw(seed, x, y);
    CACHE.m[k] = c;
    return c;
  }
  function genRaw(seed, x, y) {
    var sp = specials(seed);
    var k = key(x, y);
    if (sp.map[k]) return sp.map[k];
    var si = stationIndexOfRow(y);
    if (si >= 0) {
      var s = si < sp.stations.length ? sp.stations[si] : stationPos(seed, si);
      if (x === s.x) return 'station';
      if (Math.abs(x - s.x) === 1) return 'empty';
    }
    var L = LAYERS[layerIndex(y)];
    if (y <= 2) return 'soil';
    if (!isSafe(sp, x, y)) {
      // 積水與岩漿成團出現（3×3 的大格子決定有沒有、小格子決定填滿程度）
      if (L.water && hash(seed, Math.floor(x / 3), Math.floor(y / 3), 7) < L.water && hash(seed, x, y, 8) < 0.8) return 'water';
      if (L.lava && hash(seed, Math.floor((x + 1) / 3), Math.floor(y / 3), 9) < L.lava && hash(seed, x, y, 10) < 0.75) return 'lava';
      if (L.gas && hash(seed, x, y, 11) < L.gas) return 'gaspocket';
      if (L.boulder && hash(seed, x, y, 12) < L.boulder) return 'boulder';
    }
    var r = hash(seed, x, y, 1), acc = 0;
    for (var i = 0; i < L.ores.length; i++) {
      var e = L.ores[i];
      if (e[2] && y < e[2]) continue;
      acc += e[1];
      if (r < acc) return e[0];
    }
    return L.rock;
  }

  function tileAt(S, x, y) {
    if (x < 0 || x >= W) return 'wall';
    if (y < 0) return 'sky';
    if (y === 0) return 'surface';
    var k = key(x, y);
    var m = S.mod[k];
    if (m) return m;
    return genTile(S.seed, x, y);
  }
  function setT(S, x, y, t) {
    var k = key(x, y);
    // 跟原始地形一樣就不必記，存檔比較小
    if (t === genTile(S.seed, x, y)) delete S.mod[k]; else S.mod[k] = t;
    delete S.hp[k];
    if (t !== 'gas') delete S.gas[k];
    if (t !== 'boulder') delete S.wob[k];
  }

  function rockHardness(y) {
    var L = LAYERS[layerIndex(y)];
    var h = HARD[L.rock];
    if (y > MAIN_END) h += 2 * Math.floor((y - MAIN_END - 1) / 25);
    return h;
  }
  function hardness(t, y) {
    if (t === 'boulder') return Math.max(4, rockHardness(y));
    if (t === 'gaspocket' || t === 'page') return rockHardness(y);
    var h = HARD[t];
    if (h == null) return 0;
    if (y > MAIN_END) h = Math.max(h, rockHardness(y));
    return h;
  }
  function isPassable(t) { return !!PASS[t]; }
  function power(S) { return UP.pick.lv[S.up.pick]; }
  function bagCap(S) { return UP.bag.lv[S.up.bag]; }
  function maxEnergy(S) { return UP.stam.lv[S.up.stam]; }
  function bagCount(S) { var n = 0; for (var o in S.bag) n += S.bag[o]; return n; }
  function bagValue(S) { var n = 0; for (var o in S.bag) n += S.bag[o] * ORES[o].v; return n; }
  function lightRadius(S) {
    var r = UP.lamp.lv[S.up.lamp] + (S.glow ? 2 : 0) - LAYERS[layerIndex(S.y)].dark;

  }

  // ---- 狀態 ----
  function newState(seed) {
    specials(seed);
    return {
      v: 1, seed: seed >>> 0,
      x: START_X, y: 0, en: UP.stam.lv[0], gold: 0,
      bag: {}, up: { pick: 0, bag: 0, lamp: 0, stam: 0 },
      items: { bomb: 1, beam: 2, rope: 1 },
      mod: {},     // 被改過的格子 "x,y" -> 類型（取代原稿的 dug 陣列）
      hp: {},      // 敲到一半的格子剩下的硬度
      wob: {},     // 正在晃／正在掉的大石頭
      gas: {},     // 毒氣剩下幾回合
      pages: [], stations: [], layer: 0, maxY: 0,

  // 讀檔時補齊欄位、擋掉壞資料
  function normalize(raw) {
    if (!raw || typeof raw !== 'object' || raw.v !== 1 || typeof raw.seed !== 'number') return null;

    for (var k in S) if (k in raw && typeof raw[k] === typeof S[k]) S[k] = raw[k];

    if (!Array.isArray(S.stations)) S.stations = [];

  // ---- 一次動作的事件收集（給 UI 顯示訊息、放音效、跳對話框） ----
  var CTX = null;

  function log(text, cls) { if (CTX) CTX.ev.push({ k: 'log', text: text, cls: cls || '' }); }
  function sfx(name) { if (CTX) CTX.ev.push({ k: 'sfx', name: name }); }
  function ev(o) { if (CTX) CTX.ev.push(o); }
  function near(S, x, y) { return Math.abs(x - S.x) <= 6 && Math.abs(y - S.y) <= 6; }

  // soft：只扣到 0、不會昏倒（泡水只是讓人變慢，不該害人回不了家）
  function hurt(S, n, cause, soft) {

  }

  function addOre(S, o) {
    if (bagCount(S) >= bagCap(S)) {

      return false;

    var full = bagCount(S) >= bagCap(S);
    log('拿到' + ORES[o].name + '（' + ORES[o].v + ' G）' + (full ? '——背包滿了！' : ''), full ? 'warn' : 'good');
    sfx(ORES[o].v >= 100 ? 'gem' : 'ore');
    return true;
  }

  function pageIndexAt(S, x, y) {
    var sp = specials(S.seed);

    if (i < 0 || S.pages.indexOf(i) >= 0) return;

    sfx('page');
    ev({ k: 'page', i: i });
  }

  function releaseGas(S, x, y) {
    var q = [[x, y]], seen = {}, n = 0;

  // 敲碎一格。moveIn：是否走進去（用鎬子挖會走進去，炸藥不會）

  }

  function arriveSurface(S, how) {
    if (how !== 'walk') S.x = START_X;

    S.day++;
    S.wob = {};
    TR.wet = false;
    TR.hinted = {};
    ev({ k: 'surface', how: how });
    if (how === 'walk') log('你爬出坑口，外面還起著霧。周伯遞來一杯熱茶。（第 ' + S.day + ' 天）', 'good');
    else if (how === 'elev') log('升降籃嘎吱嘎吱往上爬，坑口的光越來越亮。（第 ' + S.day + ' 天）', 'good');
    else if (how === 'rope') log('你拉了拉腰間的繩索——三長兩短。沒多久就被拉回坑口了。（第 ' + S.day + ' 天）', 'good');

  function loseHalf(S) {

    log('你昏了過去……醒來時躺在周伯的小屋裡。' + (lost ? '背包裡的礦石少了 ' + lost + ' 個。' : ''), 'bad');
    sfx('faint');
  }

  function onEnter(S) {
    var t = tileAt(S, S.x, S.y);

    var li = layerIndex(S.y);
    if (li > S.layer) {
      S.layer = li;

        sfx('layer');

    }
    if (t === 'station') {
      var i = stationIndexOfRow(S.y);
      if (i >= 0 && S.stations.indexOf(i) < 0) {

        S.stations.sort(function (a, b) { return a - b; });
        log('找到舊升降站！拉一下鈴，周伯那頭就知道了。之後可以從坑口直接搭下來。', 'good');

    }

      S.won = true;
      S.wonDay = S.day;
      S.wonDigs = S.digs;
      S.glow = true;
      if (S.pages.indexOf(7) < 0) S.pages.push(7);

      sfx('win');
    }
  }

  // ---- 世界的一個回合：落石、積水、岩漿、毒氣 ----
  function tick(S) {
    S.tick++;
    var y0 = Math.max(1, S.y - SIM), y1 = S.y + SIM;
    stepBoulders(S, y0, y1);
    stepLiquid(S, y0, y1, false);
    if (S.tick % 2 === 0) stepLiquid(S, y0, y1, true);   // 岩漿比水慢一半
    stepGas(S);
    if (tileAt(S, S.x, S.y) === 'water') {
      if (S.en > 0) hurt(S, 1, 'wade', true);
      if (!TR.wet) log('泡在冰冷的水裡，手腳不太聽使喚（每個動作多耗 1 體力）。', 'warn');
      TR.wet = true;
    } else TR.wet = false;
    hints(S);
  }

  function stepBoulders(S, y0, y1) {
    var moved = {};
    for (var y = y1; y >= y0; y--) {
      for (var x = 0; x < W; x++) {
        var k = key(x, y);
        if (moved[k]) continue;
        if (tileAt(S, x, y) !== 'boulder') continue;
        var bt = tileAt(S, x, y + 1);
        var under = S.x === x && S.y === y + 1;
        if (!FALL_INTO[bt]) { delete S.wob[k]; continue; }
        if (!S.wob[k]) {

          if (near(S, x, y)) sfx('creak');
          continue;
        }
        if (under) {

  // ---------------- 狀態與存檔 ----------------
  var S = null;
  var saveTimer = null;
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (S) lsSet(SAVE_KEY, S);
    var dm = meters(S ? S.maxY : 0);
    if (dm > (stats.story.deepest || 0)) { stats.story.deepest = dm; saveStats(); }
  }
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }

  function newSeed() {
    var a = new Uint32Array(1);
    try { crypto.getRandomValues(a); } catch (e) { a[0] = Math.floor(Math.random() * 4294967296); }
    return a[0] >>> 0;
  }
  function startNewGame() {
    S = M.newState(newSeed());
    M.resetTransient();
    stats.story.plays++;
    saveStats();
    logs = [];
    pushLog('坑口的霧很濃。點腳下的泥土，開始往下挖吧。');
    saveNow();
    render();
    openPrologue();
  }

  // ---------------- 訊息列 ----------------
  var logs = [];
  function pushLog(text, cls) {
    logs.push({ text: text, cls: cls || '' });
    if (logs.length > 40) logs.shift();
  }
  function renderLog() {
    var box = $('log');
    var last = logs.slice(-3);
    box.innerHTML = last.map(function (l) { return '<div class="' + l.cls + '">' + esc(l.text) + '</div>'; }).join('');
    box.title = last.length ? last[last.length - 1].text : '';
  }

  // ---------------- 地圖格子（建一次，之後只更新 class 與文字；點擊用事件委派） ----------------
  var COLS = M.W, ROWS = 11, camTop = 0;
  var cells = [], lastCls = [], lastTxt = [];
  var TOWN = { 1: '🌲', 2: '🏪', 4: '⚒️', 6: '🏚️', 8: '🏡', 10: '🌲', 11: '🌲' };
  var TOWN_NPC = { 2: 'guei', 4: 'bing', 6: 'zhou', 8: 'home' };

  function buildGrid() {
    var map = $('map');
    map.innerHTML = '';
    map.style.gridTemplateColumns = 'repeat(' + COLS + ', var(--ts))';
    cells = []; lastCls = []; lastTxt = [];
    var frag = document.createDocumentFragment();
    for (var i = 0; i < COLS * ROWS; i++) {
      var d = document.createElement('div');
      d.className = 'tile';
      d.dataset.i = i;
      frag.appendChild(d);
      cells.push(d); lastCls.push(''); lastTxt.push('');
    }
    map.appendChild(frag);
  }

  function layout() {
    var wrap = $('mapWrap');
    var w = wrap.clientWidth - 12;
    var ts = Math.max(18, Math.min(40, Math.floor(w / COLS)));
    document.documentElement.style.setProperty('--ts', ts + 'px');
    // 先用最少列數算出其他元件的高度，剩下的空間給地圖
    var map = $('map');
    var oldRows = ROWS;
    var appH = $('app').offsetHeight - map.offsetHeight;
    var bodyPad = 24;
    var avail = window.innerHeight - appH - bodyPad;
    var rows = Math.max(8, Math.min(16, Math.floor(avail / ts)));
    if (rows !== oldRows || !cells.length) { ROWS = rows; buildGrid(); }
    render();
  }

  // 一格要畫成什麼：回傳 [class, 文字]
  function look(wx, wy, R) {
    if (wy < 0) {
      if (wy === -1 && TOWN[wx]) return ['k-house', TOWN[wx]];
      if (wy === -2 && (wx === 3 || wx === 9)) return ['k-sky hi', '☁️'];
      return [wy <= -2 ? 'k-sky hi' : 'k-sky', ''];
    }
    var t = M.tileAt(S, wx, wy);
    if (t === 'wall') return ['k-dark', ''];
    var me = wx === S.x && wy === S.y;
    if (wy === 0) return ['L0 k-grass' + (me ? ' me' : ''), me ? '👷' : ''];
    var li = M.layerIndex(wy);
    var L = ' L' + li;
    var dx = wx - S.x, dy = wy - S.y, d2 = dx * dx + dy * dy;
    var lit = d2 <= R * R + R;
    var dim = !lit && d2 <= (R + 1) * (R + 1) + R + 1;
    var known = !!S.mod[wx + ',' + wy];
    var sp = M.specials(S.seed);
    var nearCamp = Math.abs(wx - sp.camp.x) <= 3 && wy >= M.CAMP_Y - 3 && wy <= M.CAMP_Y + 1;
    // 自己會發光的東西：岩漿、升降站、營地附近的灰光
    var glow = t === 'lava' || t === 'lavaf' || t === 'station' || t === 'camp' || nearCamp;
    if (!lit && !dim && !glow) {
      if (t === 'page' && d2 <= (R + 3) * (R + 3)) return ['k-glim', '✦'];
      if (known && M.isPassable(t)) return [L + ' k-mem', ''];
      return ['k-dark', ''];
    }
    var cls, txt = '';
    switch (t) {
      case 'empty': cls = nearCamp ? 'k-glowfloor' : 'k-empty'; break;
      case 'water': cls = 'k-water'; txt = '≈'; break;
      case 'gas': cls = 'k-gas'; txt = '∴'; break;
      case 'lava': case 'lavaf': cls = 'k-lava'; break;
      case 'station': cls = 'k-station'; txt = '🚡'; break;
      case 'camp': cls = 'k-camp'; txt = '⛺'; break;
      case 'beam': cls = 'k-beam'; break;
      case 'boulder': cls = 'k-boulder' + (S.wob[wx + ',' + wy] ? ' wob' : ''); break;
      case 'gaspocket': cls = 'k-gp'; break;
      case 'page': cls = 'k-page'; txt = '📜'; break;
      default:
        if (M.ORES[t]) { cls = 'k-ore o-' + t; txt = M.ORES[t].g; }
        else cls = 'k-rock' + (M.hash(S.seed, wx, wy, 5) < 0.5 ? ' v1' : '');
    }
    cls += L;
    if (me) { cls += ' me' + (hurtFlash ? ' hurt' : ''); txt = '👷'; }
    else if (dim && !glow) cls += ' dim';
    return [cls, txt];
  }

  var hurtFlash = false;
  function render() {
    if (!S) return;
    var R = M.lightRadius(S);
    camTop = Math.max(-2, S.y - Math.floor(ROWS * 0.42));
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var i = r * COLS + c;
        var lk = look(c, camTop + r, R);
        var cls = 'tile ' + lk[0];
        if (cls !== lastCls[i]) { cells[i].className = cls; lastCls[i] = cls; }
        if (lk[1] !== lastTxt[i]) { cells[i].textContent = lk[1]; lastTxt[i] = lk[1]; }
      }
    }
    // 狀態列
    var maxE = M.maxEnergy(S);
    $('vDepth').textContent = meters(S.y) + ' m';
    $('vEnergy').textContent = S.en + '/' + maxE;
    $('eFill').style.width = Math.round(S.en / maxE * 100) + '%';
    $('eBar').classList.toggle('low', S.en <= maxE * 0.25);
    var bc = M.bagCount(S), cap = M.bagCap(S);
    $('vBag').textContent = bc + '/' + cap;
    $('bagStat').classList.toggle('full', bc >= cap);

  // ---------------- 執行一個動作 ----------------
  var pendingSheets = [];
  function doAct(cmd) {
    if (!S) return null;
    var ctx = M.act(S, cmd);
    var stop = false;
    ctx.ev.forEach(function (e) {
      if (e.k === 'log') { pushLog(e.text, e.cls); if (e.cls === 'warn' || e.cls === 'bad' || e.cls === 'layer' || e.cls === 'page') stop = true; }
      else if (e.k === 'sfx') SFX.play(e.name);
      else if (e.k === 'hurt') { hurtFlash = true; flash('hit'); buzz(60); setTimeout(function () { hurtFlash = false; render(); }, 300); stop = true; }
      else if (e.k === 'shake') flash('boom');
      else if (e.k === 'layer') banner(M.LAYERS[e.i].name + ' · ' + meters(M.LAYERS[e.i].from) + ' m');
      else if (e.k === 'page') pendingSheets.push(function () { openPage(e.i, true); });
      else if (e.k === 'ending') { recordWin(); pendingSheets.push(openEnding); }
      else if (e.k === 'faint') { stop = true; pendingSheets.push(function () { openFaint(e); }); }
      else if (e.k === 'surface') stop = true;
      else if (e.k === 'tired') stop = true;
    });
    ctx.stop = stop;
    render();
    scheduleSave();
    if (pendingSheets.length && !sheetOpen()) { stopWalk(); stopHold(); pendingSheets.shift()(); }
    return ctx;

  function recordWin() {

    st.wins++;
    if (st.best.days == null || S.wonDay < st.best.days) st.best.days = S.wonDay;

    saveStats();
    saveNow();

  // ---------------- 自動走路（點遠處的通道） ----------------
  var walkTimer = null;
  function stopWalk() { if (walkTimer) { clearInterval(walkTimer); walkTimer = null; } }
  function findPath(tx, ty) {
    var sk = S.x + ',' + S.y, tk = tx + ',' + ty;
    var prev = {}; prev[sk] = null;
    var q = [[S.x, S.y]], n = 0;
    var yMin = Math.min(S.y, ty) - 40, yMax = Math.max(S.y, ty) + 40;
    while (q.length && n < 4000) {
      var c = q.shift(); n++;
      var ck = c[0] + ',' + c[1];
      if (ck === tk) {
        var path = [];
        while (ck !== sk) { var p = ck.split(','); path.unshift([+p[0], +p[1]]); ck = prev[ck]; }
        return path;
      }
      var dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
      for (var j = 0; j < 4; j++) {
        var nx = c[0] + dirs[j][0], ny = c[1] + dirs[j][1];
        if (nx < 0 || nx >= COLS || ny < 0 || ny < yMin || ny > yMax) continue;
        var nk = nx + ',' + ny;
        if (nk in prev) continue;
        var t = M.tileAt(S, nx, ny);
        if (!M.isPassable(t)) continue;
        // 從地面只能從坑口那一格往下（其實任何一格都行，這裡不限制）
        prev[nk] = ck;
        q.push([nx, ny]);
      }
    }
    return null;
  }
  function walkTo(tx, ty) {
    stopWalk();
    var path = findPath(tx, ty);
    if (!path) { pushLog('那裡走不過去。'); renderLog(); return; }
    walkTimer = setInterval(function () {
      var p = path.shift();
      if (!p || sheetOpen()) { stopWalk(); return; }
      var ex = p[0], ey = p[1];
      var r = doAct({ t: 'move', dx: ex - S.x, dy: ey - S.y });
      if (!r || r.stop || S.x !== ex || S.y !== ey) stopWalk();
    }, 75);
  }

  // ---------------- 輸入 ----------------
  $('map').addEventListener('click', function (e) {
    var el = e.target.closest('.tile');
    if (!el || !S || sheetOpen()) return;
    var i = +el.dataset.i;
    var wx = i % COLS, wy = camTop + Math.floor(i / COLS);
    stopWalk();
    if (wy === -1 && TOWN_NPC[wx] && S.y === 0) { openNpc(TOWN_NPC[wx]); return; }
    if (wy < 0) return;
    var dist = Math.abs(wx - S.x) + Math.abs(wy - S.y);
    if (dist === 0) {
      if (M.tileAt(S, S.x, S.y) === 'station') openStationUp();
      return;
    }
    if (dist === 1) { doAct({ t: 'move', dx: wx - S.x, dy: wy - S.y }); return; }
    var t = M.tileAt(S, wx, wy);
    if (M.isPassable(t) || wy === 0) walkTo(wx, wy);
    else { pushLog('點礦工旁邊的格子才能挖；點遠處已挖開的通道可以走過去。'); renderLog(); }
  });

    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

      rowHtml('🏆', '紀錄', '通關天數、挖掘次數、最深紀錄', null, 'stats') +
      rowHtml('🆕', '新的旅程', '換一座新的礦坑重新開始', null, 'newgame') +
      '<p class="seed">礦坑編號 ' + S.seed.toString(16).toUpperCase() + ' · 第 ' + S.day + ' 天 · 敲了 ' + S.digs + ' 下</p>';
    openSheet('選單', html, [{ label: '關閉' }]);
  }
  function openStatsSheet() {
    var st = stats.story;
    var html = '<div class="kv">' +
      '<span>開始過的旅程</span><span>' + st.plays + '</span>' +
      '<span>找到營地</span><span>' + st.wins + ' 次</span>' +
      '<span>最少天數</span><span>' + (st.best.days != null ? st.best.days + ' 天' : '—') + '</span>' +
      '<span>最少挖掘</span><span>' + (st.best.digs != null ? st.best.digs + ' 下' : '—') + '</span>' +
      '<span>最深到過</span><span>' + (st.deepest ? st.deepest + ' m' : '—') + '</span>' +
      '</div><h3>這一趟</h3><div class="kv">' +
      '<span>天數</span><span>' + S.day + '</span><span>挖掘</span><span>' + S.digs + ' 下</span>' +
      '<span>最深</span><span>' + meters(S.maxY) + ' m</span><span>昏倒</span><span>' + S.faints + ' 次</span></div>';
    openSheet('紀錄', html, [{ label: '返回', fn: openMenu }]);
  }

  // ---------------- 啟動 ----------------
  window.addEventListener('resize', function () { clearTimeout(layout._t); layout._t = setTimeout(layout, 120); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && S) saveNow(); });
  window.addEventListener('pagehide', function () { if (S) saveNow(); });

  var raw = lsGet(SAVE_KEY);
  S = raw ? M.normalize(raw) : null;
  if (S) {
    pushLog('歡迎回來。現在在 ' + (S.y === 0 ? '灰燈鎮' : meters(S.y) + ' 公尺深的' + M.LAYERS[M.layerIndex(S.y)].name) + '。');
    buildGrid();
    layout();
    if (!S.introSeen) openPrologue();
  } else {
    buildGrid();
    S = M.newState(0);   // 先放個佔位，避免 layout 時沒有狀態
    layout();
    startNewGame();
  }
})();
</script>
</body>
</html>
