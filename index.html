<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ARCADE">
  <meta name="theme-color" content="#080808">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <title>ARCADE</title>
  <link rel="icon" href="/icon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #080808;
      --ink: #f2f0ea;
      --ink2: rgba(242,240,234,0.45);
      --ink3: rgba(242,240,234,0.18);
      --accent: #c8f135;
      --accent2: #f1c135;
      --card: #111110;
      --card-border: rgba(242,240,234,0.08);
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      overflow-x: hidden;
    }

    /* grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header-title {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      color: var(--ink);
    }
    .header-title span {
      color: var(--accent);
      display: inline-block;
      animation: flicker 6s infinite 2s;
    }
    @keyframes flicker {
      0%,95%,97%,100% { opacity: 1; }
      96% { opacity: 0.2; }
    }
    /* 音效總開關（各小遊戲讀 localStorage arcade-sound） */
    .sound-toggle {
      width: 44px;
      height: 44px;
      font-size: 18px;
      color: inherit;
      background: var(--card);
      border: 0.5px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
    }
    .sound-toggle:active { transform: scale(0.94); }
    .sound-toggle.off { opacity: 0.5; }

    /* ── Game grid：像手機桌面的圖示格，遊戲變多也一眼看得完 ── */
    .games {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 10px;
      margin-bottom: 24px;
      animation: fadeUp 0.35s ease both;
    }
    @media (min-width: 560px) { .games { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (min-width: 760px) { .games { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

    /* ── Game card ── */
    .game-card {
      display: block;
      position: relative;
      min-width: 0;
      text-decoration: none;
      transition: transform 0.15s;
    }
    .game-card:active { transform: scale(0.96); }
    .card-icon {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: var(--card);
      border: 0.5px solid var(--card-border);
      transition: border-color 0.2s;
    }
    .game-card:hover .card-icon { border-color: var(--accent); }
    /* 有自製圖示（icons/<遊戲>.webp）時取代 emoji */
    .card-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-name {
      margin-top: 7px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 類型；有紀錄時換成最佳紀錄 */
    .card-meta {
      margin-top: 1px;
      font-size: 11px;
      color: var(--ink2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta.record { color: var(--accent); }
    /* 圖示右上角：進行中／每日挑戰狀態 */
    .card-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 2px 7px;
      font-size: 10px;
      line-height: 1.5;
      border-radius: 10px;
      color: #080808;
      background: var(--accent);
    }
    .card-badge.resume { background: var(--accent2); }
    .card-badge.done { color: var(--accent); background: rgba(8,8,8,0.82); }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      font-size: 11px;
      color: var(--ink3);
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div id="app">

  <header class="header">
    <div class="header-title">ARC<span>A</span>DE</div>
    <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true" aria-label="音效">🔊</button>
  </header>

  <div class="games">
    <a class="game-card" href="./sudoku/" data-game="sudoku" data-icon="icons/sudoku.webp">
      <div class="card-icon">⊞</div>
      <div class="card-name">數獨</div>
      <div class="card-meta">益智</div>
    </a>
    <a class="game-card" href="./minesweeper/" data-game="minesweeper" data-icon="icons/minesweeper.webp">
      <div class="card-icon">💣</div>
      <div class="card-name">掃雷</div>
      <div class="card-meta">邏輯推理</div>
    </a>
    <a class="game-card" href="./bulls-cows/" data-game="bulls-cows" data-icon="icons/bulls-cows.webp">
      <div class="card-icon">🔢</div>
      <div class="card-name">幾A幾B</div>
      <div class="card-meta">猜數字</div>
    </a>
    <a class="game-card" href="./solitaire/" data-game="solitaire" data-icon="icons/solitaire.webp">
      <div class="card-icon">🃏</div>
      <div class="card-name">接龍</div>
      <div class="card-meta">紙牌</div>
    </a>
    <a class="game-card" href="./rpg/" data-icon="icons/rpg.webp">
      <div class="card-icon">🕳️</div>
      <div class="card-name">貪婪深淵</div>
      <div class="card-meta">Roguelite</div>
    </a>
    <a class="game-card" href="./rpg-next/" data-icon="icons/rpg.webp">
      <div class="card-icon">🕳️</div>
      <div class="card-name">貪婪深淵 重製版</div>
      <div class="card-meta">Roguelite</div>
    </a>
    <a class="game-card" href="./tower-orbs/" data-icon="icons/tower-orbs.webp">
      <div class="card-icon">🔮</div>
      <div class="card-name">轉珠之塔</div>
      <div class="card-meta">轉珠養成</div>
    </a>
    <a class="game-card" href="./drift-ark/" data-icon="icons/drift-ark.webp">
      <div class="card-icon">🛟</div>
      <div class="card-name">漂流方舟</div>
      <div class="card-meta">海上生存</div>
    </a>
    <a class="game-card" href="./tetris/" data-game="tetris" data-icon="icons/tetris.webp">
      <div class="card-icon">🧱</div>
      <div class="card-name">俄羅斯方塊</div>
      <div class="card-meta">消行對戰</div>
    </a>
    <a class="game-card" href="./pokemo/" data-icon="icons/pokemo.webp">
      <div class="card-icon">🔮</div>
      <div class="card-name">珠界</div>
      <div class="card-meta">珠獸 RPG</div>
    </a>
    <a class="game-card" href="./outpost/" data-game="outpost" data-icon="icons/outpost.webp">
      <div class="card-icon">🛰️</div>
      <div class="card-name">晨昏線前哨</div>
      <div class="card-meta">殖民經營</div>
    </a>
    <a class="game-card" href="./deep-miner/" data-game="deep-miner" data-icon="icons/deep-miner.webp">
      <div class="card-icon">⛏️</div>
      <div class="card-name">深掘礦工</div>
      <div class="card-meta">挖礦探險</div>
    </a>
    <a class="game-card" href="./neon-danmaku/" data-game="neon-danmaku" data-icon="icons/neon-danmaku.webp">
      <div class="card-icon">⚡</div>
      <div class="card-name">霓虹彈幕</div>
      <div class="card-meta">彈幕射擊</div>
    </a>
    <a class="game-card" href="./sky-frontier/" data-game="sky-frontier" data-icon="icons/sky-frontier.webp">
      <div class="card-icon">🏝️</div>
      <div class="card-name">天穹拓荒</div>
      <div class="card-meta">沙盒</div>
    </a>
  </div>

  <footer class="footer"><span id="game-count"></span> 個遊戲 · 玩了 <span id="play-count">0</span> 次</footer>

</div>

<script>
  document.getElementById('game-count').textContent = document.querySelectorAll('.game-card').length;

  // 遊玩次數（localStorage）
  // 儲存被封鎖（無痕、擋網站資料）時 getItem 會丟錯，包起來免得整段腳本中斷
  let plays = 0;
  try { plays = parseInt(localStorage.getItem('arcade-plays')) || 0; } catch (e) {}
  document.getElementById('play-count').textContent = plays;

  // 卡片上的最佳紀錄＋「進行中」標記（資料由各遊戲寫入：arcade-<遊戲>-stats / -save）
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  // 有紀錄的最高難度
  function hardestBest(stats, levels) {
    for (const [k, name] of levels.slice().reverse())
      if (stats[k]?.best?.time != null) return `🏆 ${name} ${fmt(stats[k].best.time)}`;
    return '';
  }
  const RECORD = {
    'sudoku': st => hardestBest(st, [['easy','簡單'],['medium','中等'],['hard','困難'],['expert','專家']]),
    'minesweeper': st => hardestBest(st, [['easy','簡單'],['medium','中等'],['hard','困難']]),
    'bulls-cows': st => st.classic?.best?.guesses != null ? `🏆 最少 ${st.classic.best.guesses} 次` : '',
    'solitaire': st => {
      const ms = ['draw1', 'draw3'].map(k => st[k]).filter(Boolean);
      const wins = ms.reduce((n, r) => n + r.wins, 0);
      const times = ms.map(r => r.best?.time).filter(t => t != null);
      return wins ? `🏆 ${wins} 勝 · ${fmt(Math.min(...times))}` : '';
    },
    'tetris': st => {
      const parts = [];
      if (st.solo?.best?.score) parts.push(`🏆 ${st.solo.best.score} 分`);
      if (st.vs?.wins) parts.push(`⚔️ ${st.vs.wins} 勝`);
      return parts.join(' · ');
    },
    'outpost': st => {
      return st.story?.wins ? `🏆 最少損失 ${st.story.best?.lost ?? 0} 人` : '';
    },
    'deep-miner': st => {
      if (st.story?.best?.days != null) return `🏆 ${st.story.best.days} 天通關`;
      return st.story?.deepest ? `⛏️ 最深 ${st.story.deepest} m` : '';
    },
    'neon-danmaku': st => {
      const best = Math.max(st.story?.best?.score || 0, st.endless?.best?.score || 0);
      return best ? `🏆 ${best.toLocaleString()} 分` : '';
    },
    'sky-frontier': st => {
      if (st.won) return '🏆 已討伐墜星';
      return st.best?.era ? `${['拓荒','開墾','商業','工業','天穹','星辰'][st.best.era]}時代` : '';
    },
  };
  // 每日挑戰（各遊戲寫入 arcade-<遊戲>-daily：{ last: { date, won }, streak, lastWin }）
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = ymd(new Date());
  const yesterday = ymd(new Date(Date.now() - 864e5));
  const DAILY_GAMES = ['sudoku', 'minesweeper', 'bulls-cows'];
  // 圖示右上角的標記：今日未玩／今日完成（含連勝）
  function dailyBadge(g) {
    const d = lsGet(`arcade-${g}-daily`);
    const streak = d && (d.lastWin === today || d.lastWin === yesterday) ? d.streak : 0;
    if (d?.last?.date === today) return { text: (d.last.won ? '✓' : '✗') + (streak ? ` 🔥${streak}` : ''), cls: 'done' };
    return { text: '今日' + (streak ? ` 🔥${streak}` : ''), cls: '' };
  }

  document.querySelectorAll('.game-card[data-game]').forEach(card => {
    const g = card.dataset.game;
    // 沒在 RECORD 登記的遊戲就不顯示紀錄（避免整段首頁腳本中斷）
    const text = RECORD[g] ? RECORD[g](lsGet(`arcade-${g}-stats`) || {}) : '';
    if (text) {
      const meta = card.querySelector('.card-meta');
      meta.textContent = text;
      meta.classList.add('record');
    }
    let badge = null;
    if (lsGet(`arcade-${g}-save`) || DAILY_GAMES.includes(g) && lsGet(`arcade-${g}-daily-save`)?.daily === today) badge = { text: '進行中', cls: 'resume' };
    else if (DAILY_GAMES.includes(g)) badge = dailyBadge(g);
    if (badge) {
      const el = document.createElement('span');
      el.className = 'card-badge ' + badge.cls;
      el.textContent = badge.text;
      card.appendChild(el);
    }
  });

  // 卡片圖示：icons/<遊戲>.webp 存在就換掉 emoji，不存在就維持 emoji（圖可以一張一張補）
  document.querySelectorAll('.game-card[data-icon]').forEach(card => {
    const img = new Image();
    img.alt = '';
    img.onload = () => {
      const box = card.querySelector('.card-icon');
      box.textContent = '';
      box.appendChild(img);
    };
    img.src = card.dataset.icon;
  });

  // 音效總開關：預設開，'off' 才關。各遊戲每次出聲前都會讀這個 key
  const soundBtn = document.getElementById('sound-toggle');
  function soundOn() { try { return localStorage.getItem('arcade-sound') !== 'off'; } catch { return true; } }
  function renderSound() {
    const on = soundOn();
    soundBtn.textContent = on ? '🔊' : '🔇';
    soundBtn.classList.toggle('off', !on);
    soundBtn.setAttribute('aria-pressed', on);
  }
  soundBtn.addEventListener('click', () => {
    try { localStorage.setItem('arcade-sound', soundOn() ? 'off' : 'on'); } catch {}
    renderSound();
    if (soundOn()) {
      // 打開時給一聲提示，順便確認手機沒有靜音
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [659, 988].forEach((f, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.09;
          o.type = 'triangle'; o.frequency.value = f;
          g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
          o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.17);
        });
        setTimeout(() => ctx.close(), 600);
      } catch {}
    }
  });
  renderSound();

  // 點進遊戲時記錄
  document.querySelectorAll('.game-card').forEach(card => {
    card.addEventListener('click', () => {
      try {
        const n = (parseInt(localStorage.getItem('arcade-plays')) || 0) + 1;
        localStorage.setItem('arcade-plays', n);
      } catch (e) {}
    });
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    navigator.serviceWorker.ready.then(r => r.active && r.active.postMessage('fill'));   // 背景補離線快取
  }
</script>
</body>
</html>
