<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARCADE">
  <meta name="theme-color" content="#0a0e1c">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <title>ARCADE</title>
  <link rel="icon" href="/icon.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* 配色集中在這裡：深藍灰底＋暖金強調，對齊站上 RPG 遊戲的介面色 */
    :root {
      --bg: #0a0e1c;            /* 頁面底色 */
      --bg-top: #0e1430;        /* 頁面頂端漸層色 */
      --bg-bottom: #080b17;     /* 頁面底端漸層色 */
      --card: #141a30;          /* 卡片底 */
      --card-hover: #1a2140;    /* 卡片 hover 底 */
      --line: #2a3358;          /* 邊框 */
      --ink: #eef1ff;           /* 主要文字 */
      --ink2: rgba(238,241,255,0.6);   /* 次要文字 */
      --ink3: rgba(238,241,255,0.32);  /* 更淡（頁尾） */
      --accent: #e8c46a;        /* 強調：暖金（徽章、hover 邊框、Logo 重點字、紀錄） */
      --on-accent: #1a1405;     /* 金底上的文字 */
      --chip: rgba(10,14,28,0.78);     /* 封面上的半透明深色膠囊 */
      --font-display: 'Syne', 'Noto Sans TC', sans-serif;
      --font-body: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    html { background: var(--bg); }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 360px, var(--bg-bottom) 100%) no-repeat, var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    /* 細微紋理 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .header-title {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      color: var(--ink);
    }
    .header-title span { color: var(--accent); }
    /* 音效總開關（各小遊戲讀 localStorage arcade-sound） */
    .sound-toggle {
      width: 44px;
      height: 44px;
      font-size: 18px;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .sound-toggle:active { transform: scale(0.94); }
    .sound-toggle.off { opacity: 0.5; }
    @media (hover: hover) { .sound-toggle:hover { border-color: var(--accent); } }

    /* ── 區塊 ── */
    .sec { margin-bottom: 26px; }
    .sec-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--ink);
    }
    .sec-title::before {
      content: '';
      width: 4px;
      height: 15px;
      border-radius: 2px;
      background: var(--accent);
    }

    /* 大作：手機 2 欄（落單的最後一張橫跨整列）、平板以上 3 欄；小品：手機 3 欄、桌機 6 欄 */
    .grid { display: grid; gap: 12px; }
    .grid.big-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.big-grid > .big:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .grid.small-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 640px) {
      .grid { gap: 16px; }
      .grid.big-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid.big-grid > .big:last-child:nth-child(odd) { grid-column: auto; }
    }
    @media (min-width: 760px) {
      .grid.small-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
    }

    /* ── 卡片 ── */
    .game-card {
      display: block;
      position: relative;
      min-width: 0;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: transform 0.18s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
      /* 只用 backwards：結束後不鎖住 transform，:active 的縮放才會生效 */
      animation: rise 0.45s ease backwards;
      animation-delay: calc(min(var(--i, 0), 12) * 35ms);
    }
    .game-card:active { transform: scale(0.97); }
    @media (hover: hover) {
      .game-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        background: var(--card-hover);
        box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      }
      .game-card:active { transform: scale(0.97); }
    }

    /* 封面框：固定長寬比，圖載入前後高度一致。底層是帶漸層的色塊（色相由 --h 決定） */
    .card-cover {
      position: relative;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 90% at 30% 20%, hsl(var(--h, 220) 45% 34% / 0.9), transparent 70%),
        linear-gradient(150deg, hsl(var(--h, 220) 38% 24%), hsl(calc(var(--h, 220) + 28) 44% 12%));
    }
    .big .card-cover { aspect-ratio: 3 / 2; font-size: 52px; }
    .small .card-cover { aspect-ratio: 1; font-size: 40px; }
    .cv-emoji { line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); }
    .card-cover img { display: block; opacity: 0; transition: opacity 0.3s; user-select: none; -webkit-user-drag: none; }
    /* 沒有封面時退回圖示：置中放在色塊上 */
    .card-cover img.cv-icon {
      position: absolute;
      top: 50%; left: 50%;
      border-radius: 20%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    .big .card-cover img.cv-icon { height: 74%; aspect-ratio: 1; }
    .small .card-cover img.cv-icon { width: 66%; aspect-ratio: 1; }
    .card-cover.has-icon img.cv-icon { opacity: 1; }
    .card-cover.has-icon .cv-emoji { opacity: 0; }
    /* 彩色封面：滿版蓋在最上面 */
    .card-cover img.cv-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-cover.has-cover img.cv-cover { opacity: 1; }
    .card-cover.has-cover img.cv-icon, .card-cover.has-cover .cv-emoji { opacity: 0; }

    /* 封面底部的暗角，讓徽章與邊緣更穩 */
    .card-cover::after {
      content: '';
      position: absolute;
      inset: auto 0 0 0;
      height: 28%;
      background: linear-gradient(180deg, transparent, rgba(8,11,23,0.35));
      pointer-events: none;
    }

    .card-body { padding: 9px 11px 11px; }
    .small .card-body { padding: 7px 8px 9px; }
    .card-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .small .card-name { font-size: 13px; }
    /* 類型；有紀錄時換成最佳紀錄 */
    .card-meta {
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--ink2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .small .card-meta { font-size: 11px; }
    .card-meta.record { color: var(--accent); font-family: var(--font-num); font-size: 11.5px; letter-spacing: -0.2px; }

    /* 封面左上：系列小字條；右上：進行中／每日挑戰狀態（半透明深色膠囊，彩色封面上也讀得清） */
    .series-tag, .card-badge {
      position: absolute;
      z-index: 2;
      top: 7px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.5;
      border-radius: 999px;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    .series-tag { left: 7px; color: var(--accent); background: var(--chip); border: 1px solid rgba(232,196,106,0.4); }
    .card-badge { right: 7px; color: var(--ink); background: var(--chip); border: 1px solid rgba(238,241,255,0.28); }
    .card-badge.resume { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
    .card-badge.done { color: var(--accent); border-color: rgba(232,196,106,0.5); }
    .small .card-badge { top: 5px; right: 5px; padding: 1px 6px; font-size: 10px; }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      padding-top: 6px;
      font-size: 12px;
      color: var(--ink3);
      text-align: center;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .game-card { animation: none; }
      .game-card, .card-cover img { transition: none; }
    }
  </style>
</head>

<script>
  document.getElementById('game-count').textContent = document.querySelectorAll('.game-card').length;

  // 遊玩次數（localStorage）
  // 儲存被封鎖（無痕、擋網站資料）時 getItem 會丟錯，包起來免得整段腳本中斷
  let plays = 0;
  try { plays = parseInt(localStorage.getItem('arcade-plays')) || 0; } catch (e) {}
  document.getElementById('play-count').textContent = plays;

  // 卡片上的最佳紀錄＋「進行中」標記（資料由各遊戲寫入：arcade-<遊戲>-stats / -save）
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
  function lsHas(k) { try { return localStorage.getItem(k) !== null; } catch { return false; } }
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  // 有紀錄的最高難度
  function hardestBest(stats, levels) {
    for (const [k, name] of levels.slice().reverse())
      if (stats[k]?.best?.time != null) return `🏆 ${name} ${fmt(stats[k].best.time)}`;
    return '';
  }
  const RECORD = {
    'sudoku': st => hardestBest(st, [['easy','簡單'],['medium','中等'],['hard','困難'],['expert','專家']]),
    'minesweeper': st => hardestBest(st, [['easy','簡單'],['medium','中等'],['hard','困難']]),
    'bulls-cows': st => st.classic?.best?.guesses != null ? `🏆 最少 ${st.classic.best.guesses} 次` : '',
    'solitaire': st => {
      const ms = ['draw1', 'draw3'].map(k => st[k]).filter(Boolean);
      const wins = ms.reduce((n, r) => n + r.wins, 0);
      const times = ms.map(r => r.best?.time).filter(t => t != null);
      return wins ? `🏆 ${wins} 勝 · ${fmt(Math.min(...times))}` : '';
    },
    'tetris': st => {
      const parts = [];
      if (st.solo?.best?.score) parts.push(`🏆 ${st.solo.best.score} 分`);
      if (st.vs?.wins) parts.push(`⚔️ ${st.vs.wins} 勝`);
      return parts.join(' · ');
    },
    'outpost': st => {
      return st.story?.wins ? `🏆 最少損失 ${st.story.best?.lost ?? 0} 人` : '';
    },
    'deep-miner': st => {
      if (st.story?.best?.days != null) return `🏆 ${st.story.best.days} 天通關`;
      return st.story?.deepest ? `⛏️ 最深 ${st.story.deepest} m` : '';
    },
    'neon-danmaku': st => {
      const best = Math.max(st.story?.best?.score || 0, st.endless?.best?.score || 0);
      return best ? `🏆 ${best.toLocaleString()} 分` : '';
    },
    'sky-frontier': st => {
      if (st.won) return '🏆 已討伐墜星';
      return st.best?.era ? `${['拓荒','開墾','商業','工業','天穹','星辰'][st.best.era]}時代` : '';
    },
    'shrine': st => st.story?.wins ? `🏆 ${fmt(st.story.best?.time ?? 0)} · 倒下 ${st.story.best?.deaths ?? 0} 次` : '',
  };
  // 每日挑戰（各遊戲寫入 arcade-<遊戲>-daily：{ last: { date, won }, streak, lastWin }）
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = ymd(new Date());
  const yesterday = ymd(new Date(Date.now() - 864e5));
  const DAILY_GAMES = ['sudoku', 'minesweeper', 'bulls-cows'];
  // 封面右上角的標記：今日未玩／今日完成（含連勝）
  function dailyBadge(g) {
    const d = lsGet(`arcade-${g}-daily`);
    const streak = d && (d.lastWin === today || d.lastWin === yesterday) ? d.streak : 0;
    if (d?.last?.date === today) return { text: (d.last.won ? '✓' : '✗') + (streak ? ` 🔥${streak}` : ''), cls: 'done' };
    return { text: '今日' + (streak ? ` 🔥${streak}` : ''), cls: '' };
  }

  document.querySelectorAll('.game-card').forEach(card => {
    const g = card.dataset.game;
    // 沒在 RECORD 登記的遊戲就不顯示紀錄（避免整段首頁腳本中斷）
    const text = g && RECORD[g] ? RECORD[g](lsGet(`arcade-${g}-stats`) || {}) : '';
    if (text) {
      const meta = card.querySelector('.card-meta');
      meta.textContent = text;
      meta.classList.add('record');
    }
    let badge = null;
    // data-save：沒有 data-game 的遊戲（珠界、貪婪深淵、轉珠之塔、漂流方舟）直接指定它們的存檔 key，有存檔就算進行中
    const resume = g ? lsGet(`arcade-${g}-save`) : lsHas(card.dataset.save || '');
    if (resume || DAILY_GAMES.includes(g) && lsGet(`arcade-${g}-daily-save`)?.daily === today) badge = { text: '進行中', cls: 'resume' };
    else if (DAILY_GAMES.includes(g)) badge = dailyBadge(g);
    if (badge) {
      const el = document.createElement('span');
      el.className = 'card-badge ' + badge.cls;
      el.textContent = badge.text;
      card.querySelector('.card-cover').appendChild(el);
    }
  });

  // 封面：covers/<遊戲>.webp 載得到就用封面；否則退回 icons/<遊戲>.webp（置中放在漸層色塊上）；再不行維持 emoji。
  // 圖可以一張一張補。封面框有固定長寬比，所以圖載入前後版面不會跳動；前 4 張大作先載，其餘 lazy
  document.querySelectorAll('.game-card').forEach((card, i) => {
    const box = card.querySelector('.card-cover');
    const loading = card.classList.contains('big') && i < 4 ? 'eager' : 'lazy';
    function layer(src, cls, onok, onfail) {
      const img = new Image();
      img.alt = ''; img.className = cls; img.decoding = 'async'; img.loading = loading; img.draggable = false;
      img.onload = () => { box.classList.add(onok); };
      img.onerror = () => { img.remove(); if (onfail) onfail(); };
      box.appendChild(img);
      img.src = src;   // 先掛上 DOM 再設 src，lazy 才會以版面位置決定要不要載
    }
    const tryIcon = () => { if (card.dataset.icon) layer(card.dataset.icon, 'cv-icon', 'has-icon'); };
    if (card.dataset.cover) layer(card.dataset.cover, 'cv-cover', 'has-cover', tryIcon);
    else tryIcon();
    card.style.setProperty('--i', i);
  });

  // 音效總開關：預設開，'off' 才關。各遊戲每次出聲前都會讀這個 key
  const soundBtn = document.getElementById('sound-toggle');
  function soundOn() { try { return localStorage.getItem('arcade-sound') !== 'off'; } catch { return true; } }
  function renderSound() {
    const on = soundOn();
    soundBtn.textContent = on ? '🔊' : '🔇';
    soundBtn.classList.toggle('off', !on);
    soundBtn.setAttribute('aria-pressed', on);
  }
  soundBtn.addEventListener('click', () => {
    try { localStorage.setItem('arcade-sound', soundOn() ? 'off' : 'on'); } catch {}
    renderSound();
    if (soundOn()) {
      // 打開時給一聲提示，順便確認手機沒有靜音
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [659, 988].forEach((f, i) => {
          const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.09;
          o.type = 'triangle'; o.frequency.value = f;
          g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
          o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.17);
        });
        setTimeout(() => ctx.close(), 600);
      } catch {}
    }
  });
  renderSound();

  // 點進遊戲時記錄
  document.querySelectorAll('.game-card').forEach(card => {
    card.addEventListener('click', () => {
      try {
        const n = (parseInt(localStorage.getItem('arcade-plays')) || 0) + 1;
        localStorage.setItem('arcade-plays', n);
      } catch (e) {}
    });
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    navigator.serviceWorker.ready.then(r => r.active && r.active.postMessage('fill'));   // 背景補離線快取
  }
</script>
</body>
</html>
