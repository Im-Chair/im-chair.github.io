<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>珠界：歸一之子</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#070a14;color:#eef1ff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;border-radius:10px;padding:10px 16px;background:#2b3a67;cursor:pointer}
button:active{filter:brightness(1.25)}
button.pri{background:linear-gradient(#5a7dff,#3b55d6);font-weight:700}
button.warn{background:#7a2b3a}
input,textarea{-webkit-user-select:text;user-select:text;touch-action:auto;font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid #3b4a7c;background:#0e1430;color:#fff}
textarea{height:90px;font-size:12px}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:#101728}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.scroll *,#modal .box *{touch-action:pan-y}
#bagTabs *{touch-action:pan-x}
#modal input,#modal textarea{touch-action:auto}

/* title */

.logo{font-size:56px;font-weight:900;letter-spacing:8px;text-shadow:0 0 24px #7aa0ff}
.logo small{display:block;font-size:22px;letter-spacing:10px;margin-top:4px;color:#ffd84a}
.orbrow{display:flex;gap:10px;margin:8px 0 18px}
.orbdot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;box-shadow:inset 0 -4px 8px #0005,0 0 10px #0006}
#sTitle button{width:210px}
.ver{font-size:12px;color:#8a95c0;margin-top:10px}

/* map */
#sMap{background:#000}
#mapCv{width:100%;height:100%;display:block}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#hud *{pointer-events:auto}
#hudName{background:#0009;padding:6px 12px;border-radius:20px;font-size:14px}
#hud button{padding:8px 16px;background:#0009;border:1px solid #fff4}
#joy{position:absolute;left:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#ffffffaa;box-shadow:0 2px 8px #0008}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

/* starter */
#sStarter{background:radial-gradient(circle at 50% 20%,#25407a,#0b1022 75%)}
.stwrap{display:flex;gap:8px;width:100%}
.stcard{flex:1;background:#1a2547;border:2px solid #34447f;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.stcard.sel{border-color:#ffd84a;background:#2a3a6f;box-shadow:0 0 14px #ffd84a66}

/* sprite */
.spr{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 2px 4px #000a;flex:none;box-shadow:inset 0 -6px 10px #0006,0 3px 8px #0006}
.spr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:0}

/* battle */
#sBattle{background:linear-gradient(#1c2a55,#101728 55%)}
#bTop{position:relative;flex:1;min-height:0;padding:calc(10px + env(safe-area-inset-top)) 12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px}
#eInfo{width:100%;font-size:14px}
#eSprWrap{position:relative;margin:2px 0}
#foeWrap{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0a0e27cc;z-index:5}
#foeWrap.on{display:flex}
.foes{display:flex;gap:8px;justify-content:center;align-items:flex-end}
.foe{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.foe.tgt{border-color:#ffd84a;background:#ffd84a1a}
.foe.dead{opacity:.18;pointer-events:none}
.fhp{display:block;width:90%;height:5px;background:#0008;border-radius:3px;overflow:hidden}
.fhp b{display:block;height:100%;background:linear-gradient(#ff7a7a,#e03b3b)}
.fcd{position:absolute;right:-4px;top:-4px;background:#d63b4b;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.fcd:empty{display:none}
#foeBoard{width:min(62vw,250px);aspect-ratio:6/5;border-radius:10px;background:#141a3a}
#foeCombo{margin-top:6px;font-size:22px;font-weight:900;color:#ffd84a;min-height:30px;text-shadow:0 2px 4px #000}
#eCd{position:absolute;right:-26px;top:-4px;background:#d63b4b;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #fff}
#bMsg{min-height:38px;font-size:14px;text-align:center;color:#dfe6ff;display:flex;align-items:center}
.bar{height:10px;background:#0a0f20;border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(#ff7a7a,#e03b3b);transition:width .35s}
.bar.green i{background:linear-gradient(#7dff8c,#2bb24a)}
.bar.pink i{background:linear-gradient(#ffb0e0,#ff5ab8)}
.bar.exp i{background:linear-gradient(#8ac0ff,#3b7bff)}
.bar.sm{height:6px;margin-top:3px}
.barRow{display:flex;align-items:center;gap:6px;font-size:12px}
.barRow label{width:46px}
.barRow small{width:86px;text-align:right}
#bTeamRow .sk{font-size:9px;color:#9aa8d8;white-space:nowrap}
#bTeamRow .skb{display:block;width:40px;height:4px;background:#0006;border-radius:2px;overflow:hidden}
#bTeamRow .skb b{display:block;height:100%;background:#ffd84a}
#bTeamRow .tm.rdy{background:#3a4a1a;outline:1.5px solid #ffd84a;animation:rdy 1s infinite alternate}
#bTeamRow .tm.rdy .sk{color:#ffd84a;font-weight:bold}
@keyframes rdy{from{filter:brightness(1)}to{filter:brightness(1.35)}}
#bTeamRow{display:flex;gap:3px;padding:4px 0;justify-content:center;min-height:56px;flex:1}
.tm{width:46px;cursor:pointer;border-radius:8px;padding:1px 0;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:1px}
#bBars{padding:2px 12px;display:flex;flex-direction:column;gap:3px}
#bTimerBox{height:8px;margin:4px 8px 4px;background:#0a0f20;border-radius:6px;overflow:hidden}
#bTimer{display:block;height:100%;width:100%;background:linear-gradient(#ffe27a,#ff9d2e)}
.boardWrap{margin:auto auto 0;width:100%;max-width:calc((100vh - 330px)*1.2);max-width:calc((100dvh - 330px)*1.2);min-width:280px;padding:0 0 calc(6px + env(safe-area-inset-bottom));position:relative}
#bBoard{display:block;width:100%}
#bTeamWrap{display:flex;align-items:center;gap:4px;padding:0 6px}
#bRun{padding:8px 10px;font-size:13px;background:#5a2b3a;flex:none}
.pop{position:absolute;left:50%;font-weight:900;font-size:26px;text-shadow:0 2px 4px #000;pointer-events:none;animation:popup .9s ease-out forwards;z-index:5}
@keyframes popup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.flash{animation:flash .35s}
@keyframes flash{50%{filter:brightness(2.4)}}

/* dialog / modal */
#dlg{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px 12px calc(16px + env(safe-area-inset-bottom));z-index:20;background:linear-gradient(transparent,#000a 25%)}
#dlg.on{display:block}
#dlgBox{background:#141c3acc;border:2px solid #6f86d6;border-radius:14px;padding:14px;min-height:110px;position:relative;font-size:16px;line-height:1.6}
#dlgName{position:absolute;top:-14px;left:14px;background:#3b55d6;border-radius:10px;padding:2px 12px;font-size:13px;font-weight:700}
#dlgP{position:absolute;right:14px;bottom:calc(100% - 4px);height:150px;display:none;pointer-events:none;filter:drop-shadow(0 3px 5px #000b)}
#dlgNext{position:absolute;right:12px;bottom:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
#modal.on{display:flex}
#modal .box{background:#17213f;border:2px solid #5d74c8;border-radius:16px;padding:16px;width:100%;max-height:88%;overflow-y:auto;touch-action:pan-y}
#modal .box h3{margin:0 0 8px}
#modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#modal .row{display:flex;width:100%;gap:8px;align-items:center;text-align:left;margin-top:6px;background:#26325d}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
#fade.on{opacity:1;pointer-events:auto}

/* bag */
#sBag{background:#0e1428}
#bagTabs{display:flex;gap:2px;padding:calc(8px + env(safe-area-inset-top)) 6px 0;overflow-x:auto;touch-action:pan-x;flex:none}
#bagTabs button{flex:1;min-width:54px;padding:8px 4px;border-radius:10px 10px 0 0;background:#1a2447;font-size:13px}
#bagTabs button.on{background:#3b55d6;font-weight:700}
#bagBody{flex:1;padding:10px;background:#17213f}
#bagClose{margin:8px;padding:12px}
.mrow{display:flex;gap:10px;align-items:center;background:#202c55;border-radius:12px;padding:8px;margin-bottom:8px}
.mi{flex:1;font-size:13px;line-height:1.5}
.ma{display:flex;flex-direction:column;gap:4px}
.ma button{padding:4px 10px;font-size:12px}
.tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:11px;color:#fff;margin:0 3px}
.rar{color:#ffd84a;font-size:12px}
.dimm{opacity:.45}
.note{font-size:12px;color:#9aa8d8;margin:6px 0}

/* ===== 素材（沿用《轉珠之塔》） ===== */
:root{--bosses:url(__BOSSES__);--bg-water:url(__BG_WATER__);--bg-fire:url(__BG_FIRE__);--bg-wood:url(__BG_WOOD__);--bg-light:url(__BG_LIGHT__);--bg-dark:url(__BG_DARK__);--bg-coast:url(__BG_COAST__);--bg-ember:url(__BG_EMBER__);--bg-title:url(__BG_TITLE__)}
.s-water{background-image:url(__S_WATER__)}.s-fire{background-image:url(__S_FIRE__)}.s-wood{background-image:url(__S_WOOD__)}.s-light{background-image:url(__S_LIGHT__)}.s-dark{background-image:url(__S_DARK__)}
.sp{display:block;flex:none;background-repeat:no-repeat;background-size:600% 400%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.sp.sb{background-image:var(--bosses);background-size:400% 200%}
#sTitle{background:linear-gradient(#0a0e27b0,#0a0e27f0),var(--bg-title) center/cover}
#bTop{background-size:cover;background-position:center 70%}
#bTop[data-bg=water]{background-image:linear-gradient(#0a0e2755,#101728 96%),var(--bg-water)}
#bTop[data-bg=fire]{background-image:linear-gradient(#0a0e2755,#101728 96%),var(--bg-fire)}
#bTop[data-bg=wood]{background-image:linear-gradient(#0a0e2755,#101728 96%),var(--bg-wood)}
#bTop[data-bg=light]{background-image:linear-gradient(#0a0e2755,#101728 96%),var(--bg-light)}
#bTop[data-bg=dark]{background-image:linear-gradient(#0a0e2755,#101728 96%),var(--bg-dark)}
#bTop[data-bg=coast]{background-image:linear-gradient(#0a0e2755,#101728 96%),var(--bg-coast)}
#bTop[data-bg=ember]{background-image:linear-gradient(#0a0e2755,#101728 96%),var(--bg-ember)}
#bMsg{background:#0008;border-radius:10px;padding:4px 10px}
.tunebox{background:#202c55;border-radius:12px;padding:10px;margin:8px 0;font-size:13px;line-height:1.7}
.tunebox input{width:76px;display:inline-block;padding:4px 6px;margin:0 4px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="sTitle" class="screen on center">
    <div class="logo">珠界<small>歸一之子</small></div>
    <div class="orbrow" id="titleOrbs"></div>
    <button class="pri" id="btnCont" style="display:none">繼續遊戲</button>
    <button class="pri" id="btnNew">新遊戲</button>
    <button id="btnImp">匯入存檔碼</button>
    <div class="ver">原型 v1.11 ・ 110 種怪物 ・ 前三章可玩</div>
  </div>

  <div id="sMap" class="screen">
    <canvas id="mapCv"></canvas>
    <div id="hud"><span id="hudName"></span><button id="btnBag">背包</button></div>
    <div id="joy"><i id="knob"></i></div>
    <div id="toast"></div>
  </div>

  <div id="sStarter" class="screen center">
    <h2 style="margin:0">選擇你的夥伴</h2>
    <div class="note">老周替你保管多年的三位夥伴</div>
    <div class="stwrap" id="stwrap"></div>
    <button class="pri" id="stOk" style="width:80%;opacity:.4">就決定是你了</button>
  </div>

  <div id="sBattle" class="screen">
    <div id="bTop">
      <div id="eInfo">
        <div><b id="eName"></b> <span id="eLv"></span> <span id="eAttr"></span> <span class="rar" id="eRar"></span></div>
        <div class="barRow"><div class="bar"><i id="eHp"></i></div><small id="eHpTxt"></small></div>
      </div>
      <div id="eSprWrap"><div id="eSpr"></div><div id="eCd">2</div></div>
      <div id="bMsg"></div>
      <div id="foeWrap"><canvas id="foeBoard"></canvas><div id="foeCombo"></div></div>
    </div>
    <div id="bTeamWrap"><div id="bTeamRow"></div><button id="bRun">逃跑</button></div>
    <div id="bBars">
      <div class="barRow"><label>隊伍HP</label><div class="bar green"><i id="tHp"></i></div><small id="tHpTxt"></small></div>
      <div class="barRow" id="charmRow"><label>符</label><div class="bar pink"><i id="cBar" style="width:0"></i></div><small id="cTxt"></small></div>
    </div>
    <div id="bTimerBox"><i id="bTimer"></i></div>
    <div class="boardWrap"><canvas id="bBoard"></canvas></div>
  </div>

  <div id="sBag" class="screen">
    <div id="bagTabs"></div>
    <div id="bagBody" class="scroll"></div>
    <button id="bagClose" class="pri">返回地圖</button>
  </div>

  <div id="dlg"><div id="dlgBox"><img id="dlgP" alt=""><div id="dlgName"></div><div id="dlgText"></div><div id="dlgNext">▼</div></div></div>
  <div id="modal"></div>
  <div id="fade"></div>
</div>

<script>
'use strict';
/* ================= 基礎 ================= */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const ATTR=['水','火','木','光','暗'];
const ATTRC=['#3da5ff','#ff5a3c','#43c05a','#ffd84a','#9b5de5','#ff7ac8'];
const RAR=Array.from({length:8},(_,i)=>'★'.repeat(i));   // 稀有度＝星數（★2～★7）
const SAVE_KEY='orbrpg_save_v3';
const AK=['water','fire','wood','light','dark'];

/* ===== 平衡參數（可在 背包→存檔 頁面即時調整，存在這支手機上） ===== */
const TUNE_DEF={cap:9,cw:1.5,need:20};
const TUNE=Object.assign({},TUNE_DEF);
try{Object.assign(TUNE,JSON.parse(localStorage.getItem('orbrpg_tune2')||'{}'))}catch(e){}
const saveTune=()=>{try{localStorage.setItem('orbrpg_tune2',JSON.stringify(TUNE))}catch(e){}};

/* 屬性相剋：水>火>木>水，光<->暗 */
const adv=(a,d)=>(a===0&&d===1)||(a===1&&d===2)||(a===2&&d===0)||(a===3&&d===4)||(a===4&&d===3);
const dis=(a,d)=>adv(d,a)&&!(a>=3&&d>=3);
const relOut=(a,d)=>adv(a,d)?1.5:dis(a,d)?0.5:1;   // 我方打敵方
const relIn=(e,m)=>adv(e,m)?1.25:dis(e,m)?0.8:1;   // 敵方打我方

/* ================= 怪物資料：5 屬性 × 3 系 × 6 階 = 90 隻（名稱與進化線沿用《轉珠之塔》） ================= */
const FAM={
 water:[
  {race:'妖精',n:['水滴史萊姆','迷你水母','碧波水母','珊瑚冠水母','深海水母王','星海水母女皇·莉維亞'],s:[1,1,1]},
  {race:'獸類',n:['小海龜','青甲龜','金紋海龜','珊瑚甲龜','蒼海守護龜','滄海巨甲·阿特拉斯'],s:[1.15,.85,1.1]},
  {race:'龍類',n:['小藍魚','彩鰭魚','飛鰭魚龍','白鱗海蛟','金角海龍','滄海龍帝·瀾'],s:[.95,1,1.2]}],
 fire:[
  {race:'龍類',n:['小火蜥','烈尾火蜥','炎角蜥龍','熔岩蜥將','炎獄龍','煉獄雙首龍·伊格'],s:[1,1,1]},
  {race:'神族',n:['火雛鳥','炎羽鳥','赤焰鷹','烈焰鳳雛','業火鳳凰','浴火神鳳·朱焰'],s:[.9,1.2,.9]},
  {race:'魔族',n:['熔岩球','熔岩石偶','熔岩岩怪','赤岩魔像','火山巨像','熔核巨神·伏爾甘'],s:[1.2,.95,.85]}],
 wood:[
  {race:'妖精',n:['嫩葉小狐','翠葉狐','青葉鹿狐','森之靈鹿','金角翠鹿','世界樹聖鹿·艾爾'],s:[1,1,1]},
  {race:'獸類',n:['葉雛','翠羽鳥','風葉鷹','綠翼獅鷲','翠翼獅鷲王','蒼風神鷲·賽芙'],s:[1,1,1.2]},
  {race:'獸類',n:['雲絨獸','葉雲犬','雲嵐狼','翠嵐狼','青雲狼王','嵐林天狼·菲洛'],s:[1.15,.9,1]}],
 light:[
  {race:'妖精',n:['光暈小兔','聖耳兔','星耳靈兔','聖光狐兔','金翼靈獸','聖輝天兔王·露米'],s:[1,1,1]},
  {race:'神族',n:['光雛鳥','聖光梟','金羽梟鷲','光翼獅鷲','曙光聖鷲','天耀神鷲·海里'],s:[1,.95,1.3]},
  {race:'獸類',n:['光鬃幼獅','星尾獅','聖鬃獅','白金獅將','翼獅聖獸','日冕聖獅王·阿斯'],s:[.95,1.15,1]}],
 dark:[
  {race:'魔族',n:['暗影小貓','紫焰影貓','暗角影獸','夜煉影狼','紫炎魔狼','冥焰龍狼王·諾克'],s:[1,1,1]},
  {race:'龍類',n:['暗影蝙蝠','紫焰飛蝠','夜翼蝠龍','暗翼飛龍','夜幕翼龍','暗淵魔龍·維爾'],s:[.95,1.15,1]},
  {race:'魔族',n:['骷髏小靈','幽冥骷髏','骨披幽靈獸','骸骨魔犬','死靈骨龍','冥界骸龍王·戈爾'],s:[1.15,.9,1]}]
};
const LETTER=['A','B','C'];
const baseStats=(r,s)=>({hp:Math.round(80*Math.pow(r-1,.6)*s[0]),atk:Math.round(16*Math.pow(r-1,.6)*s[1]),rec:Math.round(9*Math.pow(r-1,.5)*s[2])});
const NEWMON=__NEWMON__;     // true＝使用 monsters/roster.json 的新怪物（需搭配新的 5 張屬性圖）
const ROSTER=__ROSTER__;

function buildGrass(){ // 第 1 章：翠風草原（程式產生，保留原本的配置）
  const MW=28,MH=36;
  const m=Array.from({length:MH},()=>Array(MW).fill(T.G));
  const rect=(x1,y1,x2,y2,t)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)m[y][x]=t};
  // 邊界與側邊樹林
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(x<=1||x>=MW-2||y<=1||y>=MH-2)m[y][x]=T.TREE;
    else if((x<=4||x>=23)&&hash(x,y)<38)m[y][x]=T.TREE;
  }
  // 高草區
  const patches=[[3,20,11,25],[16,17,24,24],[4,9,10,15],[16,6,23,13],[8,15,12,19]];
  patches.forEach(([a,b,c,d])=>{for(let y=b;y<=d;y++)for(let x=a;x<=c;x++)if(m[y][x]===T.G&&hash(x+3,y+7)<88)m[y][x]=T.TG});
  rect(18,14,21,16,T.WATER);
  // 野花點綴
  for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++)if(m[y][x]===T.G&&hash(x*3,y*5)<5)m[y][x]=T.FLOWER;
  // 散置灌木、石頭（實心裝飾）
  const npcPos=[[11,31],[17,26],[11,16],[13,8],[6,18]];
  for(let y=10;y<=33;y++)for(let x=5;x<=22;x++){
    if(m[y][x]!==T.G||Math.abs(x-13.5)<3.2||npcPos.some(([a,b])=>Math.abs(a-x)<=1&&Math.abs(b-y)<=1))continue;
    const h=hash(x*7+1,y*11+3);if(h<2)m[y][x]=T.BUSH;else if(h<4)m[y][x]=T.ROCK;
  }
  // 主道
  rect(13,10,14,33,T.PATH);rect(12,26,15,33,T.PATH);rect(13,2,13,9,T.PATH);
  // 關口：封住兩側
  for(let x=2;x<=25;x++){m[5][x]=T.TREE;m[4][x]=T.TREE}
  rect(13,5,13,9,T.PATH);rect(12,6,12,9,T.TREE);rect(14,6,14,9,T.TREE);
  m[4][13]=T.GATE; // 關門
  rect(2,2,25,3,T.TREE);
  m[31][16]=T.FOUNT;
  return m;
}

function buildMapData(d){
  const m=d.build?d.build():parseRows(d.rows,d.w,d.h);
  (d.houses||[]).forEach(([x,y])=>addHouse(m,x,y));
  if(d.state&&P)d.state(m,P.flags);
  return m;
}
function loadMap(id){
  if(!MAPS[id])id='grass';

  if(P)P.map=id;
}

function drawTileOld(c,t,x,y,tx,ty,now){
  const h=hash(tx,ty),S=TS;
  const base=(col)=>{c.fillStyle=col;c.fillRect(x,y,S+1,S+1)};
  if(t===T.G||t===T.FLOWER||t===T.TREE||t===T.TG){base(h%2?'#5aa85e':'#54a058')}
  if(t===T.G){if(h%6===0){c.fillStyle='#6cbc6f';c.fillRect(x+S*.3,y+S*.4,3,3)}}
  else if(t===T.FLOWER){c.fillStyle=['#ff8ad0','#fff27a','#8ad0ff'][h%3];c.beginPath();c.arc(x+S*.35,y+S*.4,3,0,7);c.arc(x+S*.7,y+S*.7,3,0,7);c.fill()}
  else if(t===T.TG){
    base('#3c8a47');c.strokeStyle='#2a6c37';c.lineWidth=2;c.beginPath();
    for(let i=0;i<4;i++){const ax=x+S*(.15+.22*i),ay=y+S*.85;c.moveTo(ax,ay);c.quadraticCurveTo(ax+(i%2?5:-5),y+S*.5,ax+(i%2?2:-2),y+S*.2+(h%5))}

  else if(t===T.WATER){base('#3a86d6');c.strokeStyle='#9bd0ff';c.lineWidth=1.5;c.beginPath();const o=Math.sin(now/500+tx)*4;c.moveTo(x+4,y+S*.4+o/2);c.quadraticCurveTo(x+S/2,y+S*.3+o,x+S-4,y+S*.4);c.stroke()}
  else if(t===T.PATH){base('#cbb37c');if(h%4===0){c.fillStyle='#b29a63';c.fillRect(x+S*.3,y+S*.5,4,3)}}
  else if(t===T.HOUSE||t===T.DOOR){
    const up=ty>0&&(map[ty-1][tx]===T.HOUSE||map[ty-1][tx]===T.DOOR);
    base(up?'#c79a68':'#c0453a');
    if(up&&t===T.HOUSE&&h%2){c.fillStyle='#a8d8ff';c.fillRect(x+S*.3,y+S*.3,S*.4,S*.35)}

    if(!up){c.fillStyle='#8c2f27';c.fillRect(x,y+S*.8,S,S*.2)}
  }
  else if(t===T.FOUNT){base('#5aa85e');c.fillStyle='#9aa0ad';c.beginPath();c.arc(x+S/2,y+S/2,S*.45,0,7);c.fill();c.fillStyle='#5ab4ff';c.beginPath();c.arc(x+S/2,y+S/2,S*.32+Math.sin(now/300)*1.5,0,7);c.fill()}
  else if(t===T.GATE){base('#8b8f9c');c.strokeStyle='#5d6070';c.lineWidth=1.5;c.strokeRect(x+.5,y+.5,S-1,S/2);c.strokeRect(x+.5,y+S/2,S/2,S/2);c.strokeRect(x+S/2,y+S/2,S/2,S/2)}
  else if(t===T.SIGN){base('#cbb37c');c.fillStyle='#7a5430';c.fillRect(x+S*.45,y+S*.4,S*.1,S*.5);c.fillRect(x+S*.2,y+S*.18,S*.6,S*.3)}
}

function dirVec(){
  let x=G.joy.x,y=G.joy.y;
  const k=G.keys;
  if(k.ArrowLeft||k.a)x-=1;if(k.ArrowRight||k.d)x+=1;if(k.ArrowUp||k.w)y-=1;if(k.ArrowDown||k.s)y+=1;
  const l=Math.hypot(x,y);
  if(l>1){x/=l;y/=l}
  return[x,y];
}
function update(dt){
  G.bump-=dt;G.saveT+=dt;
  G.moving=false;
  if(G.lock)return;
  const[dx,dy]=dirVec();
  if(Math.abs(dx)+Math.abs(dy)<0.15)return;
  const sp=3.6,mx=dx*sp*dt,my=dy*sp*dt;
  let moved=0;
  G.face=Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0);
  if(canStand(P.x+mx,P.y)){P.x+=mx;moved+=Math.abs(mx)}
  if(canStand(P.x,P.y+my)){P.y+=my;moved+=Math.abs(my)}
  G.moving=moved>0;
  // 碰撞互動
  const l=Math.hypot(dx,dy)||1,px=P.x+dx/l*0.55,py=P.y+dy/l*0.55;
  if(G.bump<=0){
    const n=npcNear(px,py,0.85);
    const itx=clamp(Math.floor(px),0,MW-1),ity=clamp(Math.floor(py),0,MH-1),tt=map[ity][itx];

  // 傳送點（換地圖）
  const ftx=Math.floor(P.x),fty=Math.floor(P.y);
  const wp=(CUR.warps||[]).find(w=>w.x===ftx&&w.y===fty&&(!w.need||P.flags[w.need]));
  if(wp&&!G.lock){changeMap(wp.to,wp.tx,wp.ty,wp.face);return}
  // 草叢遇敵
  if(moved>0&&map[Math.floor(P.y)][Math.floor(P.x)]===T.TG){
    G.stepAcc+=moved;
    if(G.stepAcc>=1){G.stepAcc-=1;if(G.grace>0)G.grace--;else if(Math.random()<(CUR.encRate??ENC_RATE)){startWild();return}}
  }
  if(G.saveT>20){G.saveT=0;save()}
  $('#hudName').textContent=areaName();
}

    let dx=e.clientX-cx,dy=e.clientY-cy;const R=r.width/2,l=Math.hypot(dx,dy);
    if(l>R){dx=dx/l*R;dy=dy/l*R}

    const nx=dx/R,ny=dy/R;G.joy.x=Math.hypot(nx,ny)<0.2?0:nx;G.joy.y=Math.hypot(nx,ny)<0.2?0:ny;
  }
  joy.addEventListener('pointerdown',e=>{id=e.pointerId;joy.setPointerCapture(id);set(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e)});
  const end=e=>{if(e.pointerId===id){id=null;G.joy.x=G.joy.y=0;knob.style.transform=''}};
  joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);

/* ================= 戰鬥：盤面 ================= */
const COLS=6,ROWS=5,LIMIT=6000;
const bc=$('#bBoard'),bx=bc.getContext('2d');
let grid=[],cell=60,held=null,moved=false,dragStart=0,timerRAF=0,boardRun=false,B=null;
function resizeBoard(){
  const w=bc.parentElement.clientWidth||320,dpr=Math.min(2,window.devicePixelRatio||1),h=w*ROWS/COLS;
  bc.style.width=w+'px';bc.style.height=h+'px';bc.width=w*dpr;bc.height=h*dpr;cell=w/COLS;bx.setTransform(dpr,0,0,dpr,0,0);
}
function pickType(){
  const w=B.weights,tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return 0;
}
const mkOrb=(t,r,c)=>({t,x:c,y:r,a:1,fade:false});
function initGrid(){
  grid=Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>mkOrb(pickType(),r,c)));
  for(let k=0;k<80;k++){
    const gs=findGroups();if(!gs.length)break;
    gs.forEach(g=>g.cells.forEach(([r,c])=>{grid[r][c]=mkOrb(pickType(),r,c)}));
  }
}
function findGroups(){
  const m=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  for(let r=0;r<ROWS;r++){let run=1;for(let c=1;c<=COLS;c++){
    if(c<COLS&&grid[r][c]&&grid[r][c-1]&&grid[r][c].t===grid[r][c-1].t)run++;
    else{if(run>=3)for(let k=1;k<=run;k++)m[r][c-k]=true;run=1}}}
  for(let c=0;c<COLS;c++){let run=1;for(let r=1;r<=ROWS;r++){
    if(r<ROWS&&grid[r][c]&&grid[r-1][c]&&grid[r][c].t===grid[r-1][c].t)run++;
    else{if(run>=3)for(let k=1;k<=run;k++)m[r-k][c]=true;run=1}}}
  const seen=Array.from({length:ROWS},()=>Array(COLS).fill(false)),gs=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!m[r][c]||seen[r][c])continue;
    const t=grid[r][c].t,cells=[],q=[[r,c]];seen[r][c]=true;
    while(q.length){const[a,b]=q.pop();cells.push([a,b]);
      for(const[da,db]of[[1,0],[-1,0],[0,1],[0,-1]]){const na=a+da,nb=b+db;
        if(na>=0&&nb>=0&&na<ROWS&&nb<COLS&&m[na][nb]&&!seen[na][nb]&&grid[na][nb].t===t){seen[na][nb]=true;q.push([na,nb])}}}
    gs.push({t,cells});
  }
  return gs;
}
const ORBIMG=new Image();let ORB_OK=false;ORBIMG.onload=()=>{ORB_OK=true};ORBIMG.src='__ORBS__';
function drawOrb(c,o,x,y,scale){
  const R=cell*.43*scale;c.save();c.globalAlpha=o.a;
  const px=x*cell+cell/2,py=y*cell+cell/2,col=ATTRC[o.t];
  if(ORB_OK){
    const d=R*2.3;
    c.drawImage(ORBIMG,o.t*160,0,160,160,px-d/2,py-d/2,d,d);
    if(o.t===5){ // 心形珠蓋上「符」字
      c.font=`900 ${R*1.05}px "Noto Sans TC","PingFang TC",sans-serif`;c.textAlign='center';c.textBaseline='middle';
      c.lineWidth=R*.2;c.strokeStyle='#8a1450';c.lineJoin='round';c.strokeText('符',px,py-R*.08);c.fillStyle='#fff';c.fillText('符',px,py-R*.08);
    }
  }else if(o.t===5){
    c.fillStyle=col;const w=R*1.5,h=R*1.8;c.beginPath();c.roundRect?c.roundRect(px-w/2,py-h/2,w,h,6):c.rect(px-w/2,py-h/2,w,h);c.fill();
    c.fillStyle='#fff';c.font=`bold ${R*1.0}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('符',px,py+1);
  }else{
    const g=c.createRadialGradient(px-R*.35,py-R*.4,R*.1,px,py,R);g.addColorStop(0,'#fff');g.addColorStop(.25,col);g.addColorStop(1,'#0008');
    c.fillStyle=g;c.beginPath();c.arc(px,py,R,0,7);c.fill();
    c.fillStyle='#fffd';c.font=`bold ${R*.95}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(ATTR[o.t],px,py+1);
  }
  c.restore();
}
function drawBoard(){
  bx.clearRect(0,0,cell*COLS,cell*ROWS);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){bx.fillStyle=(r+c)%2?'#151c33':'#1c2542';bx.fillRect(c*cell,r*cell,cell,cell)}
  let top=null;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const o=grid[r][c];if(!o)continue;
    if(held&&held.o===o){top=o;continue}
    o.x+=(c-o.x)*0.35;o.y+=(r-o.y)*0.35;
    if(Math.abs(c-o.x)<.01)o.x=c;if(Math.abs(r-o.y)<.01)o.y=r;
    if(o.fade)o.a=Math.max(0,o.a-0.09);
    drawOrb(bx,o,o.x,o.y,o.fade?o.a:1);
  }
  if(top)drawOrb(bx,top,top.x,top.y,1.12);
}
function boardLoop(){if(cur!=='sBattle'){boardRun=false;return}drawBoard();requestAnimationFrame(boardLoop)}
function settled(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const o=grid[r][c];if(o&&(Math.abs(o.x-c)>.03||Math.abs(o.y-r)>.03))return false}return true}
async function settle(){for(let i=0;i<60;i++){await sleep(30);if(settled())return}}
async function resolveBoard(){
  const all=[];
  while(true){
    const gs=findGroups();if(!gs.length)break;
    gs.forEach(g=>g.cells.forEach(([r,c])=>{grid[r][c].fade=true}));
    await sleep(260);
    all.push(...gs);
    gs.forEach(g=>g.cells.forEach(([r,c])=>{grid[r][c]=null}));
    for(let c=0;c<COLS;c++){
      let w=ROWS-1;
      for(let r=ROWS-1;r>=0;r--)if(grid[r][c]){if(w!==r){grid[w][c]=grid[r][c];grid[r][c]=null}w--}
      for(let r=w;r>=0;r--)grid[r][c]=mkOrb(pickType(),r,c),grid[r][c].y=-(w-r+1);
    }
    await settle();await sleep(100);
  }
  return all;
}
/* 拖曳 */
function bpos(e){const r=bc.getBoundingClientRect();return[(e.clientX-r.left)/cell,(e.clientY-r.top)/cell]}
bc.addEventListener('pointerdown',e=>{
  if(!B||B.busy||B.over)return;
  const[px,py]=bpos(e),c=clamp(Math.floor(px),0,COLS-1),r=clamp(Math.floor(py),0,ROWS-1);
  bc.setPointerCapture(e.pointerId);
  held={o:grid[r][c],r,c};held.o.x=px-.5;held.o.y=py-.5;moved=false;dragStart=0;
});
bc.addEventListener('pointermove',e=>{
  if(!held)return;
  const[px,py]=bpos(e),c=clamp(Math.floor(px),0,COLS-1),r=clamp(Math.floor(py),0,ROWS-1);
  if(c!==held.c||r!==held.r){
    const other=grid[r][c];grid[held.r][held.c]=other;grid[r][c]=held.o;held.r=r;held.c=c;
    if(!moved){moved=true;dragStart=performance.now();runTimer()}
  }
  held.o.x=clamp(px-.5,-.2,COLS-.8);held.o.y=clamp(py-.5,-.2,ROWS-.8);
});
function releaseHeld(){
  if(!held)return;held=null;cancelAnimationFrame(timerRAF);$('#bTimer').style.width='100%';
  if(moved)afterMove();
}
bc.addEventListener('pointerup',releaseHeld);bc.addEventListener('pointercancel',releaseHeld);
function runTimer(){
  const f=()=>{
    if(!held)return;
    const left=1-(performance.now()-dragStart)/LIMIT;
    $('#bTimer').style.width=Math.max(0,left*100)+'%';
    if(left<=0){releaseHeld();return}
    timerRAF=requestAnimationFrame(f);
  };f();
}

/* ================= 戰鬥：流程 ================= */
function mkEnemy(id,lv,hpMul,atkMul){
  const sp=SP[id],s=st({id,lv});
  const cd=hpMul===3?3:2;return{sp,lv,attr:sp.attr,maxHp:Math.round(s.hp*hpMul),hp:Math.round(s.hp*hpMul),atk:Math.round(s.atk*atkMul),cd,cdMax:cd};
}
function encWeights(tx,ty){   // 目前位置的 [水,火,木,光,暗] 權重
  const w=[0,0,0,0,0];(CUR.encBase||[1,1,1,0,0]).forEach((v,k)=>w[k]=v);
  for(let y=ty-ENC_RADIUS;y<=ty+ENC_RADIUS;y++)for(let x=tx-ENC_RADIUS;x<=tx+ENC_RADIUS;x++)if(tileAt(x,y)===T.WATER)w[0]+=ENC_WATER_W;
  (CUR.edges||[]).forEach(e=>{
    const d=e.side==='n'?ty:e.side==='s'?MH-1-ty:e.side==='w'?tx:MW-1-tx;
    w[e.attr]+=ENC_EDGE_W*Math.max(0,1-d/ENC_EDGE_RANGE);
  });
  return w;
}
function encAttrProbs(tx,ty){   // 轉成機率；光暗各保底 ENC_LD
  const w=encWeights(tx,ty),tot=w.reduce((a,b)=>a+b,0)||1;
  return w.map((v,k)=>(1-2*ENC_LD)*v/tot+(k>=3?ENC_LD:0));
}
function encPool(attr,hi){
  const c=CUR.ch,cfg=CHAPTERS[c];
  return Object.values(SP).filter(sp=>sp.head&&!sp.guardOnly&&sp.attr===attr&&(hi?(sp.rar>=3&&sp.rar<=cfg.starMax&&sp.zone&&sp.zone.includes(c)):sp.rar===2));
}
function pickWild(){
  const cfg=CHAPTERS[CUR.ch];
  if(!NEWMON){const E=legacyZone1(),tot=E.reduce((a,z)=>a+z[1],0);let r=Math.random()*tot;
    for(const z of E){r-=z[1];if(r<=0)return mkEnemy(z[0],ri(z[2],z[3]),3,0.8)}}
  const pr=encAttrProbs(Math.floor(P.x),Math.floor(P.y));let attr=4,r=Math.random();
  for(let k=0;k<5;k++){if(r<pr[k]){attr=k;break}r-=pr[k]}
  let hi=Math.random()<ENC_HI,pool=encPool(attr,hi);
  if(!pool.length){hi=false;pool=encPool(attr,false)}
  if(!pool.length)pool=encPool(2,false);
  const sp=pool[Math.floor(Math.random()*pool.length)],L=hi?cfg.lvHi:cfg.lv2;
  return mkEnemy(sp.id,ri(L[0],L[1]),3,0.8);
}
function weightsFor(canCap){
  const w=[1,1,1,1,1];P.team.forEach(m=>{w[SP[m.id].attr]=1.35});
  w.push(canCap?TUNE.cw:0);return w;
}

/* ===== 對手轉珠（各自的盤面，只演給玩家看） ===== */
const FOE_T=5;   // 對手盤面只有水火木光暗 5 種珠
function foeGroups(g){   // 回傳相連的同色消除組（每組＝1 Combo）
  const m=g.map(r=>r.map(()=>false));
  for(let r=0;r<ROWS;r++)for(let c=0;c+2<COLS;c++)if(g[r][c]>=0&&g[r][c]===g[r][c+1]&&g[r][c]===g[r][c+2])m[r][c]=m[r][c+1]=m[r][c+2]=true;
  for(let c=0;c<COLS;c++)for(let r=0;r+2<ROWS;r++)if(g[r][c]>=0&&g[r][c]===g[r+1][c]&&g[r][c]===g[r+2][c])m[r][c]=m[r+1][c]=m[r+2][c]=true;
  const seen=g.map(r=>r.map(()=>false)),out=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(m[r][c]&&!seen[r][c]){
    const t=g[r][c],st=[[r,c]],grp=[];seen[r][c]=true;
    while(st.length){const[y,x]=st.pop();grp.push([y,x]);for(const[dy,dx]of[[1,0],[-1,0],[0,1],[0,-1]]){const ny=y+dy,nx=x+dx;if(ny>=0&&nx>=0&&ny<ROWS&&nx<COLS&&m[ny][nx]&&!seen[ny][nx]&&g[ny][nx]===t){seen[ny][nx]=true;st.push([ny,nx])}}}
    out.push(grp);
  }
  return out;
}
function foeBoardInit(planned){   // 先產生沒有現成消除的盤面，再排好 planned 組三連
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(-1));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let t,n=0;do{t=(ri(0,FOE_T-1)+n)%FOE_T;n++}while(n<FOE_T&&((c>=2&&g[r][c-1]===t&&g[r][c-2]===t)||(r>=2&&g[r-1][c]===t&&g[r-2][c]===t)));g[r][c]=t}
  const slots=[];for(let r=0;r<ROWS;r++)for(const c of[0,3])slots.push([r,c]);
  for(let i=slots.length-1;i>0;i--){const j=ri(0,i);[slots[i],slots[j]]=[slots[j],slots[i]]}
  slots.slice(0,Math.min(planned,slots.length)).forEach(([r,c])=>{const t=ri(0,FOE_T-1);g[r][c]=g[r][c+1]=g[r][c+2]=t});
  return g;
}
function foeDraw(g,fade){
  const cv=$('#foeBoard'),c=cv.getContext('2d'),W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2,s=W/COLS;
  c.clearRect(0,0,W,H);
  for(let r=0;r<ROWS;r++)for(let x=0;x<COLS;x++){const t=g[r][x];if(t<0)continue;
    const a=fade&&fade.has(r*COLS+x)?.25:1,px=x*s+s/2,py=r*s+s/2,d=s*.92;c.globalAlpha=a;
    if(ORB_OK)c.drawImage(ORBIMG,t*160,0,160,160,px-d/2,py-d/2,d,d);else{c.fillStyle=ATTRC[t];c.beginPath();c.arc(px,py,s*.4,0,7);c.fill()}}
  c.globalAlpha=1;
}
async function foeTurn(range){   // 演出對手轉珠，回傳總 Combo 數
  const w=$('#foeWrap'),lab=$('#foeCombo');w.classList.add('on');lab.textContent='';
  const g=foeBoardInit(ri(range[0],range[1]));foeDraw(g);await sleep(450);
  let combo=0;
  for(let round=0;round<=FOE_SKYFALL_MAX;round++){
    const gs=foeGroups(g);if(!gs.length)break;
    for(const grp of gs){combo++;foeDraw(g,new Set(grp.map(([r,c])=>r*COLS+c)));lab.textContent=(round?'天降 ':'')+combo+' Combo';await sleep(FOE_STEP_MS);grp.forEach(([r,c])=>g[r][c]=-1);foeDraw(g)}
    for(let c=0;c<COLS;c++){const col=[];for(let r=ROWS-1;r>=0;r--)if(g[r][c]>=0)col.push(g[r][c]);for(let r=ROWS-1,k=0;r>=0;r--,k++)g[r][c]=k<col.length?col[k]:ri(0,FOE_T-1)}
    foeDraw(g);await sleep(FOE_STEP_MS);
  }
  if(!combo)combo=1;
  lab.textContent=combo+' Combo！';await sleep(500);w.classList.remove('on');
  return combo;
}
function calcHits(groups,combo){   // 每一下攻擊：[我方屬性, 未算相剋的傷害]
  const info=teamInfo(),cm=1+.25*(combo-1),hits=[];
  groups.forEach(g=>{
    if(g.t>=5)return;
    const sz=1+.25*(g.cells.length-3);
    info.filter(t=>t.sp.attr===g.t).forEach(t=>hits.push([t.sp.attr,t.s.atk*sz*cm]));  // 只有同屬性的珠子才會造成傷害
  });
  return hits;
}
function calcDamage(groups,combo){   // 對目前目標的總傷害（測試與顯示用）
  const e=B.enemy;return Math.round(calcHits(groups,combo).reduce((a,[at,v])=>a+v*relOut(at,e.attr),0));
}
const aliveFoes=()=>B.foes.filter(f=>f.hp>0);
function retarget(){if(B.enemy&&B.enemy.hp>0)return;const i=B.foes.findIndex(f=>f.hp>0);if(i>=0){B.tgt=i;B.enemy=B.foes[i]}}
async function handleDowns(){   // 處理倒下的對手；全部倒下就結束戰鬥（回傳 true）
  for(const f of B.foes)if(f.hp<=0&&!f.down){f.down=true;B.exp+=Math.floor((6+f.lv*5)*rarMul(f.sp.rar));msg(`${f.sp.name} 倒下了！`);renderBattle();await sleep(700)}
  if(!aliveFoes().length){await sleep(200);await endBattle('win');return true}
  retarget();renderBattle();return false;
}
async function afterMove(){
  if(!B||B.busy||B.over)return;
  B.busy=true;
  const groups=await resolveBoard();
  if(!groups.length){B.busy=false;return}
  const combo=groups.length,e=B.enemy;
  P.team.forEach((m,i)=>{let n=0;groups.forEach(g=>{if(g.t===SP[m.id].attr)n+=g.cells.length});B.skch[i]=Math.min(skCost(m),(B.skch[i]||0)+n)});
  // 符
  let charmGain=0;groups.forEach(g=>{if(g.t===5)charmGain+=g.cells.length});
  if(B.canCap)B.charm+=charmGain;
  // 傷害
  let dmg=0,capped=false;const ampUsed=B.amp>1;
  let capLeft=B.canCap?Math.max(1,Math.round(e.maxHp*TUNE.cap/100*B.amp)):Infinity;   // 野生珠獸單回合最多承受 TUNE.cap% 最大血量
  for(const[at,v]of calcHits(groups,combo)){
    retarget();const t=B.enemy;if(!t||t.hp<=0)break;
    let d=Math.round(v*relOut(at,t.attr)*B.amp);if(d>capLeft){d=capLeft;capped=true}
    d=Math.min(d,t.hp);t.hp-=d;dmg+=d;capLeft-=d;
  }
  B.amp=1;
  $('#eSpr').classList.remove('flash');void $('#eSpr').offsetWidth;$('#eSpr').classList.add('flash');
  pop('-'+dmg,'#ffe27a',true);
  msg(`${combo} Combo！造成 ${dmg} 傷害`+(capped?'（已達傷害上限）':'')+(charmGain&&B.canCap?`，符 +${charmGain}`:''));
  // 回復
  renderBattle();await sleep(700);
  if(await handleDowns())return;
  // 收服判定
  if(B.canCap&&B.charm>=needNow()){
    B.charm-=needNow();
    const p=capChance();msg(`符之力達到 ${needNow()}！收服判定中…（${Math.round(p*100)}%）`);renderBattle();await sleep(1100);
    if(Math.random()<p){await onCapture();return}
    msg('收服失敗……牠掙脫了！');pop('失敗','#ff8a8a',true);await sleep(900);
  }
  // 敵方行動：倒數到 0 的一起出手
  const alive=aliveFoes();alive.forEach(f=>f.cd--);
  const atk=alive.filter(f=>f.cd<=0);
  if(atk.length){
    const info=teamInfo(),who=B.foeName||atk[0].sp.name;
    let combo=0,mul=1;
    if(B.foeCombo){msg(`${who} 轉珠中……`);combo=await foeTurn(B.foeCombo);mul=FOE_COMBO_BASE*(1+FOE_COMBO_STEP*(combo-1))}
    let d=0;atk.forEach(f=>{const m=info.reduce((a,t)=>a+relIn(f.attr,t.sp.attr),0)/Math.max(1,info.length);d+=f.atk*rnd(.85,1.15)*m});
    d=Math.max(1,Math.round(d*mul*B.foeScale));if(B.shield>0)d=Math.max(1,Math.round(d*(1-B.shieldV)));
    B.teamHp=Math.max(0,B.teamHp-d);atk.forEach(f=>f.cd=f.cdMax);
    $('#bTop').classList.remove('shake');void $('#bTop').offsetWidth;$('#bTop').classList.add('shake');
    msg(combo?`${who} ${combo} Combo！隊伍受到 ${d} 傷害`:`${who} 發動攻擊！隊伍受到 ${d} 傷害`);
  }
  if(B.shield>0)B.shield--;
  renderBattle();await sleep(500);
  if(B.teamHp<=0){await onDefeat();return}
  B.busy=false;
}

async function useSkill(i){
  if(!B||B.busy||B.over)return;
  const m=P.team[i];if(!m)return;
  const id=skillOf(m),k=SKILLS[id],sp=SP[m.id],s=st(m),e=B.enemy;
  const cost=skCost(m);if((B.skch[i]||0)<cost){toast(`【${k.n}】還需消除 ${cost-(B.skch[i]||0)} 顆${ATTR[sp.attr]}珠`);return}
  if(k.t==='charm'&&!B.canCap){toast('這場戰鬥沒有符，無法使用');return}
  if((k.t==='lure'||k.t==='seal')&&!B.canCap){toast('只對野生珠獸有效');return}
  B.busy=true;
  const cells=(f)=>{const a=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]&&f(grid[r][c]))a.push(grid[r][c]);return a};
  const shuffle=a=>{for(let j=a.length-1;j>0;j--){const q=Math.floor(Math.random()*(j+1));[a[j],a[q]]=[a[q],a[j]]}return a};
  let note='';
  if(k.t==='charm'){const l=shuffle(cells(o=>o.t<5)).slice(0,k.v);l.forEach(o=>o.t=5);note=`${l.length} 顆珠變成了符`}
  else if(k.t==='purify'){const l=shuffle(cells(o=>o.t===5)).slice(0,k.v);l.forEach(o=>o.t=sp.attr);note=`${l.length} 顆符被淨化成${ATTR[sp.attr]}珠`}
  else if(k.t==='recolor'){const l=shuffle(cells(o=>o.t<5&&o.t!==sp.attr)).slice(0,k.v);l.forEach(o=>o.t=sp.attr);note=`${l.length} 顆珠變成了${ATTR[sp.attr]}珠`}
  else if(k.t==='strike'||k.t==='drain'){
    let d=Math.max(1,Math.round(s.atk*k.v*relOut(sp.attr,e.attr)));
    if(B.canCap)d=Math.min(d,Math.max(0,e.hp-1));
    d=Math.min(d,e.hp);e.hp-=d;
    $('#eSpr').classList.remove('flash');void $('#eSpr').offsetWidth;$('#eSpr').classList.add('flash');
    pop('-'+d,'#ffe27a',true);note=`造成 ${d} 傷害`;
    if(k.t==='drain'){const h=Math.round(d*(id==='drn2'?.6:.5));B.teamHp=Math.min(B.teamMax,B.teamHp+h);note+=`，隊伍回復 ${h}`}
  }
  else if(k.t==='heal'){
    const f=clamp(s.rec/(s.hp*.11),.7,1.4),h=Math.round(B.teamMax*k.v*f);
    B.teamHp=Math.min(B.teamMax,B.teamHp+h);pop('+'+h,'#7dff8c',false);note=`隊伍回復 ${h} 體力`;
  }
  else if(k.t==='freeze'){e.cd=Math.min(e.cdMax+3,e.cd+k.v);note=`敵人行動倒數 +${k.v}`}
  else if(k.t==='shield'){B.shield=2;B.shieldV=k.v;note=`2 回合內受到傷害 -${Math.round(k.v*100)}%`}
  else if(k.t==='amp'){B.amp=k.v;note=`下一次消珠傷害 ×${k.v}`}
  else if(k.t==='seal'){const before=needNow();B.cut=(B.cut||0)+k.v;note=`所需符 ${before} → ${needNow()}`}
  else if(k.t==='lure'){B.lure+=k.v;note=`收服率 +${Math.round(k.v*100)}%`}
  B.skch[i]=0;
  msg(`${sp.name} 的【${k.n}】：${note}`);
  renderBattle();await sleep(650);
  if(await handleDowns())return;
  B.busy=false;renderBattle();
}

async function endBattle(res,extra){

    const ups=[];P.team.forEach(m=>ups.push(...addExp(m,B.exp)));

    report=`<h3>${res==='capture'?'收服成功！':'戰鬥勝利！'}</h3>${extra?`<p>${extra}</p>`:''}<p>全隊獲得 ${B.exp} 經驗值${drop?'<br>'+drop:''}</p>${ups.length?'<p style="color:#ffd84a">'+ups.join('<br>')+'</p>':''}`;
  }else if(res==='lose'){
    P.hpFrac=1;P.x=CUR.home.x;P.y=CUR.home.y;
    report=`<h3>戰敗……</h3><p>你被送回了${CUR.homeName}，夥伴們在療癒泉旁恢復了體力。</p>`;
  }else if(res==='run'){
    P.hpFrac=clamp(B.teamHp/B.teamMax,0.05,1);
  }
  if(report)await modal(report);
  save();

  const onWin=res==='win'&&B.onWin;
  B=null;G.grace=WARP_GRACE;G.stepAcc=0;

}

  if(bagTab==='team'){
    h=`<div class="note">隊伍 ${P.team.length}/6　全隊總 HP ${teamMax()}　目前體力 ${Math.round(P.hpFrac*100)}%</div>`;
    P.team.forEach((m,i)=>{h+=monRow(m,i,`${i>0?`<button data-act="up" data-i="${i}">↑ 前移</button>`:''}${P.team.length>1?`<button data-act="tobox" data-i="${i}">存入倉庫</button>`:''}`)});
  }else if(bagTab==='box'){
    h=`<div class="note">倉庫 ${P.box.length} 隻</div>`;
    if(!P.box.length)h+='<div class="note">還沒有存放的珠獸。隊伍滿 6 隻後收服的會自動送來這裡。</div>';
    P.box.forEach((m,i)=>{h+=monRow(m,i,P.team.length<6?`<button data-act="join" data-i="${i}">加入隊伍</button>`:`<button data-act="swap" data-i="${i}">換入隊伍</button>`)+''});
  }else if(bagTab==='dex'){
    const list=Object.values(SP).filter(s=>!s.guardOnly),caught=list.filter(s=>P.dex[s.id]===2).length;
    h=`<div class="note">已收服 ${caught}／${list.length} 種</div>`;
    list.forEach(sp=>{const d=P.dex[sp.id]||0;
      h+=`<div class="mrow ${d?'':'dimm'}">${d?spr(sp,40):'<div class="spr" style="width:40px;height:40px;background:#333">？</div>'}<div class="mi"><b>No.${String(sp.no).padStart(3,'0')} ${d?sp.name:'？？？'}</b>${d?`<span class="tag" style="background:${ATTRC[sp.attr]}">${ATTR[sp.attr]}</span><span class="rar">${RAR[sp.rar]}</span>`:''}<br><small>${d===2?'已收服':d===1?'已遇見':'未發現'}</small></div></div>`});
  }else if(bagTab==='item'){
    h=`<div class="mrow"><div class="mi"><b>回復藥</b> ×${P.items.potion}<br><small>回復隊伍 50% 體力</small></div><div class="ma"><button data-act="potion" ${P.items.potion?'':'disabled'}>使用</button></div></div>
       <div class="mrow"><div class="mi"><b>經驗糖</b> ×${P.items.candy}<br><small>讓一隻珠獸升 1 級</small></div><div class="ma"><button data-act="candy" ${P.items.candy?'':'disabled'}>使用</button></div></div>
       <div class="note">沒有商店。道具靠探索、戰鬥掉落與劇情取得。</div>`;
  }else if(bagTab==='scroll'){
    h=`<div class="note">史冊殘卷 ${P.scrolls.length}／${SCROLLS.length}</div><div class="note" style="border-color:#ffd54a">📌 ${questHint()}</div>`;
    SCROLLS.forEach((s,i)=>{const got=P.scrolls.includes(i);
      h+=`<div class="mrow ${got?'':'dimm'}"><div class="mi"><b>${s.t}</b><br><small>${got?s.x:'？？？（尚未取得）'}</small></div></div>`});
    h+=`<div class="note">珠核：${(P.cores||[]).length?P.cores.map(c=>CORE_NAMES[c]).join('、'):'無'}</div>`;if(P.flags.fireFragment)h+='<div class="note">火核碎片：由燼交付。它不能替誰的責任作證。</div>';
    (P.letters||[]).forEach(i=>{const L=LETTERS[i];h+=`<div class="mrow"><div class="mi"><b>${L.t}</b><br><small>${L.x.join('<br>')}</small></div></div>`});
  }else{
    h=`<div class="note">遊戲會自動存檔（儲存在這支手機的瀏覽器）。換手機或清除資料前，請先匯出存檔碼。</div>
       <button class="pri" data-act="save" style="width:100%;margin-bottom:8px">立即存檔</button>
       <button data-act="export" style="width:100%;margin-bottom:8px">匯出存檔碼</button>
       <textarea id="codeBox" placeholder="匯出的存檔碼會顯示在這裡；要匯入時貼上後按下面的按鈕"></textarea>
       <button data-act="import" style="width:100%;margin:8px 0">匯入存檔碼</button>
       <div class="tunebox"><b>平衡測試</b>（調整後立刻生效，下一場戰鬥套用）<br>
         野生怪每回合最多承受 <input id="tCap" type="number" inputmode="decimal" value="${TUNE.cap}">% 最大血量<br>
         符珠出現權重 <input id="tCw" type="number" inputmode="decimal" step="0.1" value="${TUNE.cw}">（其他珠約為 1～1.35）<br>
         收服判定所需符數 <input id="tNeed" type="number" inputmode="numeric" value="${TUNE.need}"><br>
         <button data-act="tuneReset" style="margin-top:6px;padding:6px 12px">恢復預設</button></div>
       <button class="warn" data-act="reset" style="width:100%">清除存檔並重新開始</button>`;
  }
  b.innerHTML=h;
}
$('#bagBody').onchange=e=>{
  const id=e.target.id,v=parseFloat(e.target.value);if(!['tCap','tCw','tNeed'].includes(id)||!Number.isFinite(v))return;
  if(id==='tCap')TUNE.cap=clamp(v,2,100);if(id==='tCw')TUNE.cw=clamp(v,0.2,3);if(id==='tNeed')TUNE.need=Math.round(clamp(v,5,99));
  saveTune();renderBag();toast('已套用');
};
$('#bagTabs').onclick=e=>{const t=e.target.closest('[data-tab]');if(t){bagTab=t.dataset.tab;renderBag()}};
$('#bagBody').onclick=async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==='up'){[P.team[i-1],P.team[i]]=[P.team[i],P.team[i-1]]}
  else if(a==='tobox'){P.box.push(P.team.splice(i,1)[0]);P.hpFrac=clamp(P.hpFrac,0,1)}
  else if(a==='join'){P.team.push(P.box.splice(i,1)[0])}
  else if(a==='swap'){const k=await pickMon('要換下哪一隻？',P.team);if(k>=0){const t=P.team[k];P.team[k]=P.box[i];P.box[i]=t}}
  else if(a==='potion'){P.items.potion--;P.hpFrac=Math.min(1,P.hpFrac+.5);toast('隊伍體力回復了')}
  else if(a==='candy'){const k=await pickMon('讓誰升級？',P.team);if(k>=0){P.items.candy--;const u=addExp(P.team[k],expNeed(P.team[k].lv)-P.team[k].exp);toast(u[0]||'經驗值增加了')}}
  else if(a==='skill'){
    const m=[...P.team,...P.box].find(x=>x.uid===+b.dataset.uid);
    if(m){
      const sp=SP[m.id],cur=skillOf(m),L=skillList(sp);
      const rows=L.map(([lv,id],j)=>{const k=SKILLS[id],ok=m.lv>=lv;
        return `<button class="row" data-i="${j}" ${ok?'':'disabled style="opacity:.45"'}><div class="mi"><b>${k.n}</b>${id===cur?' <span style="color:#ffd84a">（使用中）</span>':''}<br><small>${ok?`需消除 ${skCostId(id)} 顆${ATTR[sp.attr]}珠　${k.d}`:`Lv${lv} 學會　${k.d}`}</small></div></button>`}).join('');
      const r=await modal(`<h3>${sp.name} 的技能</h3><div class="note">每隻珠獸戰鬥時只能使用 1 個技能。點選要裝備的技能。</div>${rows}`,[{t:'關閉'}]);
      if(r<L.length&&m.lv>=L[r][0]){m.sk=L[r][1];toast(`已裝備【${SKILLS[L[r][1]].n}】`)}
    }
  }
  else if(a==='tuneReset'){Object.assign(TUNE,TUNE_DEF);saveTune();toast('已恢復預設')}
  else if(a==='save'){save();toast('已存檔')}
  else if(a==='export'){$('#codeBox').value=exportCode();$('#codeBox').select()}
  else if(a==='import'){const c=$('#codeBox').value;if(importCode(c)){toast('匯入成功');await sleep(500);location.reload()}else toast('存檔碼無效')}
  else if(a==='reset'){const r=await modal('<h3>確定清除？</h3><p>所有進度將消失，無法復原。</p>',[{t:'取消'},{t:'清除',c:'warn'}]);if(r===1){localStorage.removeItem(SAVE_KEY);location.reload()}}
  if(['up','tobox','join','swap','potion','candy','skill'].includes(a))save();
  renderBag();
};
$('#bagClose').onclick=()=>{save();show('sMap');startMapLoop();G.lock=false};
$('#btnBag').onclick=()=>{if(!G.lock)openBag()};

/* ================= 開場 ================= */
async function newGame(){
  P=freshPlayer();loadMap('grass');
  await fade(true);show('sMap');resizeMap();$('#hudName').textContent=areaName();drawMap(0);await fade(false);
  G.lock=true;
  await say([
    '千年前，五色珠核的力量引發了大戰。',
    '初代珠師艾瑟爾擊敗暴君「歸一王」，封印了珠核——世人尊他為「守界英雄」。',
    '此後，「守界盟」守護著珠界的和平；而「歸一會」，則被寫進史冊，成為永遠的惡名。',
    '十六年前，歸一會最後的據點陷落。有人抱著一個嬰兒，逃進偏遠的初芽鎮——',
    '今天，是你十六歲的成年禮。'
  ]);
  await modal(`<h3>你的名字</h3><input id="nameIn" maxlength="6" placeholder="最多 6 個字" value="夜">`,[{t:'決定',c:'pri'}]);
  P.name=($('#nameIn').value||'旅人').trim().slice(0,6)||'旅人';
  await say([
    ['老周',`來了啊，${P.name}。滿十六歲了呢。`],
    ['老周','鎮上的規矩，成年的孩子可以從我這領走一位夥伴。這三隻，我替你保管很久了。'],
    ['老周','還有……這個你收好。'],
    '老周遞給你一枚舊吊墜，上面刻著五色交織的圓環。',
    ['老周','記住——在外頭，絕對不要讓守界盟的人看見它。'],
    [P.name,'為什麼？'],
    ['老周','……等你走得夠遠，自然會明白。']
  ]);
  const id=await chooseStarter();
  P.team.push(newMon(id,5));P.dex[id]=2;P.flags.intro=1;save();
  await fade(true);show('sMap');await fade(false);
  await say([
    ['老周','消掉盤面上的「符」，就能與野生的珠獸締結羈絆——這是我們這一脈教你的第一件事。'],
    ['老周','往北穿過草原，就是守界盟的關口。路上多練練，累了就來廣場的療癒泉。']
  ]);
  startMapLoop();G.lock=false;
}
function chooseStarter(){
  return new Promise(async res=>{
    await fade(true);show('sStarter');
    let sel=0;
    $('#stwrap').innerHTML=STARTERS.map(id=>{const sp=SP[id],s=st({id,lv:5});
      return `<div class="stcard" data-id="${id}">${spr(sp,72)}<b>${sp.name}</b><span class="tag" style="background:${ATTRC[sp.attr]}">${ATTR[sp.attr]}屬性</span><small>HP ${s.hp}<br>攻擊 ${s.atk}<br>回復 ${s.rec}</small></div>`}).join('');
    $('#stOk').style.opacity=.4;
    await fade(false);
    $('#stwrap').onclick=e=>{const c=e.target.closest('.stcard');if(!c)return;sel=c.dataset.id;document.querySelectorAll('.stcard').forEach(x=>x.classList.toggle('sel',x===c));$('#stOk').style.opacity=1};
    $('#stOk').onclick=async()=>{
      if(!sel)return;
      const sp=SP[sel];
      const r=await modal(`<h3>就決定是 ${sp.name} 嗎？</h3><p>${ATTR[sp.attr]}屬性。其他屬性的夥伴，之後可以靠收服來湊齊。</p>`,[{t:'再想想'},{t:'決定',c:'pri'}]);
      if(r===1){$('#stOk').onclick=null;res(sel)}
    };
  });
}
async function continueGame(){
  loadMap(P.map||'grass');   // 舊存檔沒有 map 欄位：視為第 1 張地圖
  await fade(true);show('sMap');resizeMap();$('#hudName').textContent=areaName();drawMap(0);await fade(false);
  G.lock=false;startMapLoop();
}

/* ================= 啟動 ================= */
(function boot(){
  loadMap('grass');
  $('#titleOrbs').innerHTML=ATTR.map((a,i)=>`<div class="orbdot" style="background:radial-gradient(circle at 35% 30%,#fff9,${ATTRC[i]} 60%,#0007)">${a}</div>`).join('')+`<div class="orbdot" style="background:${ATTRC[5]};border-radius:8px">符</div>`;
  const sv=loadSave();
  if(sv&&sv.flags&&sv.flags.intro&&sv.team.length)$('#btnCont').style.display='block';
  $('#btnCont').onclick=()=>{P=sv;continueGame()};
  $('#btnNew').onclick=async()=>{
    if(sv&&sv.flags&&sv.flags.intro){const r=await modal('<h3>開始新遊戲？</h3><p>目前的存檔會被覆蓋。</p>',[{t:'取消'},{t:'開始',c:'warn'}]);if(r!==1)return}
    newGame();
  };
  $('#btnImp').onclick=async()=>{
    await modal('<h3>匯入存檔碼</h3><textarea id="impBox" placeholder="貼上存檔碼"></textarea>',[{t:'取消'},{t:'匯入',c:'pri'}]).then(r=>{
      if(r===1){if(importCode($('#impBox').value)){location.reload()}else toast('存檔碼無效')}
    });
  };
  addEventListener('resize',()=>{if(cur==='sMap')resizeMap();if(cur==='sBattle')resizeBoard()});
  window.__dbg={get P(){return P},get B(){return B},G,findGroups:()=>findGroups(),setGrid:g=>{grid=g}};
})();
</script>
