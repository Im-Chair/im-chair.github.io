<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>暴雪求生：20關破屋大改造</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #060911 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-shell {
      width: 100%;
      max-width: 540px;
      height: 100dvh;
      max-height: 960px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.92), 0 0 0 2px rgba(251, 191, 36, 0.25);
    }

    @media (min-width: 560px) {
      #game-shell {
        height: 96dvh;
        border-radius: 28px;
      }
    }

    /* 立體三選一工具卡片 */
    .tool-card {
      background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 55%, #fde68a 100%);
      border: 3px solid #f59e0b;
      box-shadow: 0 5px 0 #b45309, 0 8px 16px rgba(0, 0, 0, 0.55);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
      position: relative;
      overflow: hidden;
      pointer-events: auto;
    }

    .tool-card:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      border-color: #fbbf24;
      box-shadow: 0 7px 0 #b45309, 0 0 20px rgba(251, 191, 36, 0.65);
    }

    .tool-card:active:not(:disabled) {
      transform: translateY(3px) scale(0.96);
      box-shadow: 0 1px 0 #b45309;
    }

    .tool-card:disabled {
      opacity: 0.45;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 4px) rotate(-0.9deg); }
      40% { transform: translate(8px, -4px) rotate(0.9deg); }
      60% { transform: translate(-5px, -3px) rotate(-0.4deg); }
      80% { transform: translate(5px, 3px) rotate(0.4deg); }
    }

    .shake {
      animation: screenShake 0.42s ease-in-out;
    }

    @keyframes flashFade {
      0% { opacity: 0.72; }
      100% { opacity: 0; }
    }

    .flash-anim {
      pointer-events: none !important;
      animation: flashFade 0.55s ease-out forwards;
    }

    .frost-vignette {
      pointer-events: none !important;
      box-shadow: inset 0 0 54px 16px rgba(125, 211, 252, 0.78), inset 0 0 18px 6px rgba(255, 255, 255, 0.85);
      transition: opacity 0.35s ease;
    }

    .cta-btn {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      border: 2px solid #86efac;
      box-shadow: 0 4px 0 #14532d, 0 8px 18px rgba(0, 0, 0, 0.5);
    }
    .cta-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #14532d;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .map-scroll::-webkit-scrollbar { width: 5px; }
    .map-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .map-scroll::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.65); border-radius: 999px; }
  </style>

<body>
  <div id="game-shell">
    <!-- ========================================================================
         1. 頂部狀態儀表板 (室溫生命線 + 豪華改造度 + 狂風預警)
         ======================================================================== -->
    <header class="relative z-20 px-3 pt-2.5 pb-2 bg-slate-950 border-b border-slate-800 shrink-0">
      <div class="flex items-center justify-between gap-1.5 mb-2">
        <!-- 返回 20 關地圖按鈕 -->
        <button id="btn-open-map" type="button" class="bg-gradient-to-r from-amber-500 to-orange-600 border border-amber-200 px-2.5 py-1 rounded-xl flex items-center gap-1.5 shrink-0 shadow cursor-pointer active:translate-y-0.5">
          <span class="text-xs">🗺️</span>
          <div class="leading-none text-left">
            <div id="hud-level-badge" class="text-[10px] font-black text-amber-100">第 1 關</div>
            <div id="hud-level-name" class="text-[11px] font-black text-white max-w-[88px] truncate">漏風破木屋</div>
          </div>
        </button>

        <!-- 暴風雪狂風預警條 -->
        <div id="gale-hud" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1 flex items-center justify-between gap-1 min-w-0">
          <div class="flex items-center gap-1 min-w-0">
            <span id="gale-icon" class="text-xs shrink-0">🌨️</span>
            <span id="gale-label" class="text-[10px] font-black text-slate-300 truncate">暴風雪平穩</span>
          </div>
          <span id="gale-timer" class="text-[10px] font-black px-1.5 py-0.5 rounded bg-slate-800 text-cyan-300 tabular-nums shrink-0">無狂風</span>
        </div>

        <!-- 音效與重來按鈕 -->
        <div class="flex items-center gap-1 shrink-0">
          <button id="btn-sound" type="button" title="音效開關" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 flex items-center justify-center text-xs text-white cursor-pointer">
            🔊
          </button>
          <button id="btn-quick-restart" type="button" title="重玩本關" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 flex items-center justify-center text-xs text-white cursor-pointer">
            🔄
          </button>
        </div>
      </div>

      <!-- 室溫生命線 & 豪華改造進度 -->
      <div class="grid grid-cols-12 gap-1.5 items-stretch">
        <!-- 左側：室內溫度計 (降到 0°C 凍死，升到目標溫度過關) -->
        <div class="col-span-7 bg-slate-900 border border-slate-700/90 rounded-2xl px-2.5 py-1.5 flex flex-col justify-between">
          <div class="flex items-center justify-between gap-1 mb-1">
            <div class="flex items-center gap-1">
              <span id="temp-emoji" class="text-base leading-none">🥶</span>
              <span id="temp-value" class="text-sm font-black text-cyan-300 tabular-nums">12.0°C</span>
            </div>
            <span id="leak-badge" class="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-red-950 text-red-300 border border-red-500/70">
              冷風滲入中
            </span>
          </div>
          <div class="relative w-full h-2.5 bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-700">
            <div id="temp-bar" class="h-full rounded-full transition-all duration-100 bg-gradient-to-r from-cyan-500 to-sky-300" style="width: 45%;"></div>
            <div id="target-temp-marker" class="absolute top-0 bottom-0 w-0.5 bg-emerald-400 shadow-[0_0_6px_#34d399]" style="left: 78%;"></div>
          </div>
          <div class="flex justify-between text-[9px] font-bold text-slate-400 mt-0.5">
            <span>0°C 凍僵</span>
            <span id="target-temp-text" class="text-emerald-400">目標 22°C</span>
          </div>
        </div>

        <!-- 右側：破屋變豪宅星級進度 -->
        <div class="col-span-5 bg-slate-900 border border-slate-700/90 rounded-2xl px-2.5 py-1.5 flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold text-amber-300">豪宅改造度</span>
            <span id="luxury-stars-preview" class="text-[11px] tracking-tighter">☆☆☆</span>
          </div>
          <div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-700 my-0.5">
            <div id="luxury-bar" class="h-full rounded-full transition-all duration-200 bg-gradient-to-r from-amber-500 via-yellow-400 to-emerald-400" style="width: 0%;"></div>
          </div>
          <div class="flex items-center justify-between text-[9px] font-bold">
            <span class="text-slate-400">已修繕</span>
            <span id="repair-count-text" class="text-amber-300 font-black">0 / 6 處</span>
          </div>
        </div>
      </div>

      <!-- 材料點數 / 本關天氣 / 章節規則 -->
      <div id="info-row" class="mt-1.5 flex flex-col gap-1">
        <div class="flex items-start gap-1.5">
          <span id="budget-chip" class="shrink-0 px-2 py-0.5 rounded-md text-[10px] font-black tabular-nums bg-amber-950 text-amber-200 border border-amber-500/70">🧰 材料 0 / 0</span>
          <span id="weather-chip" class="flex-1 min-w-0 px-2 py-0.5 rounded-md text-[10px] font-bold leading-tight bg-slate-900 text-sky-200 border border-sky-600/60"></span>
        </div>
        <div id="rule-chip" class="hidden px-2 py-0.5 rounded-md text-[10px] font-bold leading-tight bg-slate-900 text-amber-200 border border-amber-600/50"></div>
      </div>
    </header>

    <!-- ========================================================================
         2. 中央 Canvas 互動舞台 (可直接點擊場景破洞 + 破屋變豪宅即時演變)
         ======================================================================== -->
    <main id="canvas-wrapper" class="relative flex-1 w-full min-h-[240px] overflow-hidden bg-slate-800">
      <canvas id="game-canvas" class="block w-full h-full cursor-pointer"></canvas>

      <!-- 低於 5°C 結霜邊框 -->
      <div id="frost-layer" class="pointer-events-none absolute inset-0 z-10 frost-vignette opacity-0"></div>

      <!-- 浮動事件反饋提示 -->

  <script>
    /**
     * ============================================================================
     * 1. Web Audio API 合成音效引擎 (風雪聲 / 敲打修繕 / 豪華叮咚 / 搞笑失誤音)
     * ============================================================================
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.windGain = null;
        this.windFilter = null;
        this.currentWindLevel = 0.04;
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();
            this.startWindLoop();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {}
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.windGain && this.ctx) {
          this.windGain.gain.setTargetAtTime(this.enabled ? this.currentWindLevel : 0, this.ctx.currentTime, 0.1);
        }
        return this.enabled;
      }

      startWindLoop() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        this.windFilter = this.ctx.createBiquadFilter();
        this.windFilter.type = 'bandpass';
        this.windFilter.frequency.value = 390;
        this.windFilter.Q.value = 3.2;

        this.windGain = this.ctx.createGain();
        this.windGain.gain.value = this.enabled ? this.currentWindLevel : 0;

        noise.connect(this.windFilter);
        this.windFilter.connect(this.windGain);
        this.windGain.connect(this.ctx.destination);
        noise.start();
      }

      setWindIntensity(level, isGale = false) {
        this.currentWindLevel = level;
        if (this.windGain && this.ctx) {
          this.windGain.gain.setTargetAtTime(this.enabled ? level : 0, this.ctx.currentTime, 0.2);
          if (this.windFilter) {
            this.windFilter.frequency.setTargetAtTime(isGale ? 680 : 380, this.ctx.currentTime, 0.2);
          }
        }
      }

      playClick() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.065);
        } catch (e) {}
      }

      playLuxurySuccess() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          // 兩下木槌敲擊聲
          [0, 0.11].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, now + offset);
            osc.frequency.exponentialRampToValueAtTime(65, now + offset + 0.075);
            gain.gain.setValueAtTime(0.13, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.085);
          });

          // 華麗和弦叮咚
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const t = now + 0.20 + idx * 0.065;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.14, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.23);
          });
        } catch (e) {}
      }

      playMakeshiftSuccess() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.linearRampToValueAtTime(560, now + 0.14);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        } catch (e) {}
      }

      playFail() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [0, 0.14, 0.28].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now + offset);
            osc.frequency.linearRampToValueAtTime(75, now + offset + 0.12);
            gain.gain.setValueAtTime(0.18, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.13);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.135);
          });
        } catch (e) {}
      }

      playAlarm() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [0, 0.18].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(760, now + offset);
            osc.frequency.linearRampToValueAtTime(520, now + offset + 0.14);
            gain.gain.setValueAtTime(0.11, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.16);
          });
        } catch (e) {}
      }

      playVictory() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [
            { f: 523.25, t: 0.0, d: 0.12 },
            { f: 659.25, t: 0.13, d: 0.12 },
            { f: 783.99, t: 0.26, d: 0.12 },
            { f: 1046.5, t: 0.39, d: 0.38 }
          ].forEach((n) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, now + n.t);
            gain.gain.setValueAtTime(0.18, now + n.t);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.t);
            osc.stop(now + n.t + n.d + 0.02);
          });
        } catch (e) {}
      }

      playGameOver() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [392.0, 349.23, 311.13, 261.63].forEach((freq, idx) => {
            const t = now + idx * 0.22;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.16, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.28);
          });
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    /**
     * ============================================================================
     * 2. 材料特性 / 天氣 / 場景破洞道具池 (純資料)
     *    每個破洞有 5~6 張一般道具 (含 1 張陷阱)，每次打開從中抽 3 張。
     *    道具特性會與「本關天氣」互相作用，沒有任何一張卡在所有天氣下都最好。
     * ============================================================================
     */
    // ==CORE-BEGIN== (以下到 CORE-END 為純資料與純邏輯，不碰 DOM，可在 node 下載入模擬)

    // 道具特性標籤：卡片上直接顯示
    const TRAIT_INFO = {
      windproof: { label: '抗風', tip: '狂風吹不掉' },
      galefear:  { label: '怕狂風', tip: '狂風來必被吹掉，連豪華材料也一樣' },
      warm:      { label: '保暖', tip: '每秒加溫較多' },
      damp:      { label: '怕潮', tip: '濕雪天或剛除冰的破洞，效果打折' },
      dry:       { label: '烘乾', tip: '除冰後不留潮氣' }
    };

    // 材料類別 (第四章「缺料」規則使用)
    const CATEGORIES = { wood: '木材', soft: '布紙', hard: '五金石材' };

    // 本關天氣：所有數值都在這裡，方便日後調整
    //   leakMul 漏風倍率、baseMul 基礎失溫倍率、dampMul 怕潮材料的效果倍率、
    //   warmMul 保暖材料的每秒加溫倍率、galeLeakMul 狂風來襲那 5 秒的漏風倍率
    const WEATHERS = {
      normal: { id: 'normal', name: '一般', icon: '🌨️', leakMul: 1, baseMul: 1, dampMul: 1, warmMul: 1,
        desc: '一般：暴雪平穩，沒有額外影響，材料照常發揮。' },
      gale:   { id: 'gale', name: '狂風', icon: '🌪️', leakMul: 1, baseMul: 1, dampMul: 1, warmMul: 1, galeLeakMul: 2.1,
        desc: '狂風：每 {N} 秒吹掉不抗風的修補，怕狂風的材料即使豪華也一樣。' },
      wet:    { id: 'wet', name: '濕雪', icon: '💧', leakMul: 1, baseMul: 1, dampMul: 0.5, warmMul: 1,
        desc: '濕雪：怕潮的材料效果減半。' },
      cold:   { id: 'cold', name: '酷寒', icon: '🥶', leakMul: 1.35, baseMul: 1.35, dampMul: 1, warmMul: 2,
        desc: '酷寒：降溫更快，保暖材料的加溫加倍。' }
    };
    // 結冰剛除掉的破洞是濕的：怕潮材料沿用濕雪的折扣
    const WET_HOTSPOT_DAMP_MUL = WEATHERS.wet.dampMul;

    // 道具建構小工具 (純資料)：陷阱 / 湊合 / 豪華
    const TRAP = (icon, name, tag, delta, fail, say, fx) =>
      ({ tier: 'trap', icon, name, tag, delta, fail, say, fx, cost: 0 });
    const MS = (icon, name, cost, delta, seal, traits, cat, say, heat) =>
      ({ tier: 'makeshift', icon, name, cost, delta, seal, traits, cat, say, heat: heat || 0 });
    const LX = (icon, name, cost, delta, seal, heat, traits, cat, say) =>
      ({ tier: 'luxury', icon, name, cost, delta, seal, heat, traits, cat, say });
    // 除冰道具 (第一階段)：tier 只決定費用與烘乾；traits 含 'dry' 代表除冰後乾燥
    const DEICE = (tier, icon, name, cost, delta, traits, cat, say) =>
      ({ tier, icon, name, cost, delta, traits, cat, say, stage1: true });

    const HOTSPOT_LIBRARY = {
      // 1. 屋頂破洞 (最大冷風口)
      roof: {
        id: 'roof', name: '屋頂破洞', icon: '🏚️', coldLevel: 3, leakPerSec: 0.65,
        pos: { x: 0.50, y: 0.11 },
        brokenDesc: '屋頂大破洞：暴雪與寒流正從頭頂瘋狂灌入！',
        makeshiftDesc: '臨時遮蓋：勉強擋風，沒有抗風的材料遇狂風會被掀飛！',
        luxuryDesc: '隔熱屋頂完工：溫暖氣密，垂掛金色聖誕花環！',
        choices: [
          TRAP('💨', '吹風機往上吹', '越吹越冷', -3.2, '吹風機把屋頂積雪全吹進屋裡！', '哇啊！雪全被吹進屋裡啦！', 'snow_dump'),
          MS('⛺', '塑膠帆布蓋住', 1, 1.5, 0.75, [], 'soft', '暫時擋住雪了，不過帆布被風吹得啪啪響…'),
          LX('🧱', '紅瓦片+原木樑', 3, 3.5, 1, null, ['damp'], 'wood', '太棒了！屋頂變得又堅固又漂亮！'),
          MS('🪨', '壓石防水布', 1, 0.9, 0.5, ['windproof'], 'hard', '石頭壓著，風再大也掀不動。'),
          MS('🌾', '稻草保溫層', 1, 1.0, 0.6, ['warm', 'damp'], 'soft', '稻草鋪厚一點，屋裡像窩一樣暖。', 0.15),
          LX('🔲', '鍍鋁隔熱板', 2, 2.4, 0.85, 0.2, ['warm', 'galefear'], 'hard', '亮晶晶的隔熱板，就是怕大風。')
        ]
      },

    /**
     * ============================================================================
     * 3b. 核心規則 (純邏輯)：抽牌、情境效果、溫度變化、狂風、結算、星等
     *     所有函式只讀寫傳入的狀態物件 g，與畫面無關。
     * ============================================================================
     */
    function hasTrait(it, t) { return (it.traits || []).indexOf(t) >= 0; }
    function blownByGale(it) {
      return hasTrait(it, 'galefear') || (it.tier === 'makeshift' && !hasTrait(it, 'windproof'));
    }
    function levelWeather(lvl) { return WEATHERS[lvl.weather] || WEATHERS.normal; }
    function chapterRule(lvl) {
      const chap = CHAPTERS.find((c) => c.id === lvl.chapter);
      return (chap && chap.rule) || { type: 'none', text: '' };
    }
    function weatherText(lvl) { return levelWeather(lvl).desc.replace('{N}', String(lvl.galeCycle)); }
    function itemHeat(def, it) {
      const raw = it.heat != null ? it.heat : (it.tier === 'luxury' ? (def.heatPerSec || 0.12) : 0);
      return raw * ITEM_HEAT_SCALE;
    }

    function initLevel(g, lvl, rng) {
      g.level = lvl;
      g.rng = rng || Math.random;
      g.maxTemp = g.maxTemp || 28.0;
      g.temp = lvl.startTemp;
      g.mistakes = 0;
      g.budget = lvl.budget;
      g.spent = 0;
      g.playTime = 0;
      g.galePhase = 'calm';
      g.galeTimer = (lvl.weather === 'gale' ? lvl.galeCycle : 0) || 0;
      g.rule = chapterRule(lvl);
      g.shortageCat = null;
      if (g.rule.type === 'shortage' && g.rule.cats && g.rule.cats.length) {
        g.shortageCat = g.rule.cats[Math.floor(g.rng() * g.rule.cats.length)];
      }
      g.hotspotStates = {};
      lvl.hotspots.forEach((spec) => {
        if (!HOTSPOT_LIBRARY[spec.id]) return;
        g.hotspotStates[spec.id] = {
          id: spec.id, tier: 'broken', iced: Boolean(spec.iced), wet: false,
          item: null, seal: 0, heat: 0, pts: 0, rank: -1, brokenSecs: 0,
          hand: null, hand1: null
        };
      });
      return g;
    }

    // 道具在當前情境下的實際效果 (卡片顯示與結算共用)
    function effOf(g, hsId, it, stage1) {
      const def = HOTSPOT_LIBRARY[hsId];
      const st = g.hotspotStates[hsId];
      const w = levelWeather(g.level);
      const cost = it.cost || 0;
      const oos = Boolean(it.cat && g.shortageCat && it.cat === g.shortageCat);
      const base = { delta: it.delta || 0, seal: 0, heat: 0, dampHit: false, warmUp: false, blown: false, oos, cost, afford: cost <= g.budget };
      if (stage1 || it.tier === 'trap') return base;
      let delta = it.delta || 0;
      let seal = it.seal || 0;
      let heat = itemHeat(def, it);
      const dampHit = hasTrait(it, 'damp') && (g.level.weather === 'wet' || Boolean(st && st.wet));
      const warmUp = hasTrait(it, 'warm') && w.warmMul > 1;
      if (dampHit) {
        delta *= WET_HOTSPOT_DAMP_MUL;
        seal *= WET_HOTSPOT_DAMP_MUL;
        heat *= WET_HOTSPOT_DAMP_MUL;
      }
      if (warmUp) heat *= w.warmMul;
      const blown = g.level.weather === 'gale' && blownByGale(it);
      return { delta, seal, heat, dampHit, warmUp, blown, oos, cost, afford: cost <= g.budget };
    }

    // 「有效修補」：不是陷阱、沒缺貨、不會被狂風吹掉、不受潮氣打折
    function isGoodCard(g, hsId, it, stage1) {
      if (it.tier === 'trap') return false;
      const e = effOf(g, hsId, it, stage1);
      return !e.oos && !e.blown && !e.dampHit;
    }

    // 抽 3 張：至少 1 張有效修補、最多 1 張陷阱、不會三張全是豪華
    function drawHand(g, hsId, stage1) {
      const def = HOTSPOT_LIBRARY[hsId];
      const pool = stage1 ? def.stage1Choices : def.choices;
      const n = pool.length;
      const valid = (hand) => {
        const traps = hand.filter((c) => c.tier === 'trap').length;
        const lux = hand.filter((c) => c.tier === 'luxury').length;
        return traps <= 1 && lux < 3 && hand.some((c) => isGoodCard(g, hsId, c, stage1));
      };
      for (let tries = 0; tries < 400; tries++) {
        const idx = [];
        while (idx.length < 3) {
          const k = Math.floor(g.rng() * n);
          if (idx.indexOf(k) < 0) idx.push(k);
        }
        const hand = idx.map((k) => pool[k]);
        if (valid(hand)) return hand;
      }
      // 保底 (理論上不會走到)：強制放入一張有效修補
      const good = pool.find((c) => isGoodCard(g, hsId, c, stage1)) || pool[1];
      const rest = pool.filter((c) => c !== good && c.tier !== 'trap').slice(0, 2);
      return [good].concat(rest);
    }

    function ensureHand(g, hsId) {
      const st = g.hotspotStates[hsId];
      if (st.iced) {
        if (!st.hand1) st.hand1 = drawHand(g, hsId, true);
        return st.hand1;
      }
      if (!st.hand) st.hand = drawHand(g, hsId, false);
      return st.hand;
    }

    function expandMul(g, st) {
      const r = g.rule;
      if (!r || r.type !== 'expand' || st.tier !== 'broken') return 1;
      return Math.min(r.cap, 1 + r.rate * st.brokenSecs);
    }

    // 即時溫度變化速度 (每秒)
    function tempRate(g) {
      const lvl = g.level;
      const w = levelWeather(lvl);
      const sc = lvl.leakScale == null ? 1 : lvl.leakScale;
      const galeMul = g.galePhase === 'gale' ? (w.galeLeakMul || 2.1) : 1.0;
      let delta = -0.18 * sc * w.baseMul * galeMul;
      lvl.hotspots.forEach((h) => {
        const def = HOTSPOT_LIBRARY[h.id];
        const st = g.hotspotStates[h.id];
        if (!def || !st) return;
        const leak = (def.leakPerSec || 0.3) * sc * w.leakMul * galeMul;
        if (st.tier === 'broken') {
          delta -= leak * expandMul(g, st);
        } else {
          delta -= leak * (1 - st.seal);
          delta += st.heat;
        }
      });
      return delta;
    }

    // 狂風循環。回傳事件陣列：{type:'warning'|'gale'|'galeEnd', ripped:[破洞id]}
    function galeStep(g, dt, events) {
      const lvl = g.level;
      if (lvl.weather !== 'gale' || lvl.galeCycle <= 0) return;
      g.galeTimer -= dt;
      if (g.galePhase === 'calm' && g.galeTimer <= 3.0) {
        g.galePhase = 'warning';
        events.push({ type: 'warning' });
      } else if (g.galePhase === 'warning' && g.galeTimer <= 0) {
        g.galePhase = 'gale';
        g.galeTimer = 5.0;
        const ripped = [];
        lvl.hotspots.forEach((h) => {
          const st = g.hotspotStates[h.id];
          if (st && st.item && blownByGale(st.item)) {
            st.tier = 'broken'; st.item = null; st.seal = 0; st.heat = 0; st.pts = 0; st.rank = -1; st.brokenSecs = 0;
            ripped.push(h.id);
          }
        });
        events.push({ type: 'gale', ripped });
      } else if (g.galePhase === 'gale' && g.galeTimer <= 0) {
        g.galePhase = 'calm';
        g.galeTimer = lvl.galeCycle;
        events.push({ type: 'galeEnd' });
      }
    }

    // 時間流逝 dt 秒：狂風 -> 破洞擴大計時 -> 溫度
    function stepGame(g, dt) {
      const events = [];
      galeStep(g, dt, events);
      g.level.hotspots.forEach((h) => {
        const st = g.hotspotStates[h.id];
        if (st && st.tier === 'broken') st.brokenSecs += dt;
      });
      const rate = tempRate(g);
      g.temp = Math.max(0, Math.min(g.maxTemp, g.temp + rate * dt));
      g.playTime += dt;
      return events;
    }

    // 這張卡現在能不能選。回傳 null 代表可以，否則是原因
    function blockReason(g, hsId, it) {
      const st = g.hotspotStates[hsId];
      if (!st) return 'none';
      const stage1 = Boolean(st.iced);
      if (!stage1 && st.rank >= 2) return 'maxed';
      if (!stage1 && it.tier !== 'trap' && it.rank <= st.rank) return 'used';
      const e = effOf(g, hsId, it, stage1);
      if (e.oos) return 'oos';
      if (!e.afford) return 'budget';
      return null;
    }

    // 套用選擇。回傳事件 {ok, kind:'trap'|'deice'|'repair', delta, eff}
    function applyChoice(g, hsId, it) {
      const st = g.hotspotStates[hsId];
      const why = blockReason(g, hsId, it);
      if (why) return { ok: false, reason: why };
      const stage1 = Boolean(st.iced);
      const e = effOf(g, hsId, it, stage1);
      g.budget -= e.cost;
      g.spent += e.cost;
      if (it.tier === 'trap') {
        g.mistakes += 1;
        g.temp = Math.max(0, g.temp + it.delta);
        return { ok: true, kind: 'trap', delta: it.delta, eff: e };
      }
      if (stage1) {
        st.iced = false;
        st.wet = !hasTrait(it, 'dry');
        g.temp = Math.min(g.maxTemp, g.temp + it.delta);
        return { ok: true, kind: 'deice', delta: it.delta, eff: e };
      }
      st.tier = it.tier;
      st.item = it;
      st.seal = e.seal;
      st.heat = e.heat;
      st.pts = it.pts;
      st.rank = it.rank;
      st.brokenSecs = 0;
      g.temp = Math.min(g.maxTemp, g.temp + e.delta);
      return { ok: true, kind: 'repair', delta: e.delta, eff: e };
    }

    // 豪華改造度與星等
    function calcProgress(g) {
      const total = g.level.hotspots.length;
      let points = 0;
      let repairedCount = 0;
      g.level.hotspots.forEach((h) => {
        const st = g.hotspotStates[h.id];
        if (!st || st.tier === 'broken') return;
        points += st.pts || (st.tier === 'luxury' ? 1.0 : 0.45);
        repairedCount += 1;
      });
      const pct = Math.round((points / Math.max(1, total)) * 100);
      const th = g.level.stars || { two: 55, three: 85 };
      let stars = 1;
      if (pct >= th.three && g.mistakes <= 1) stars = 3;
      else if (pct >= th.two) stars = 2;
      return { pct, stars, repairedCount, total };
    }

    // 勝負判定：'win' | 'lose' | null
    function endCheck(g) {
      if (g.temp <= 0) return 'lose';
      const lvl = g.level;
      const allRepaired = lvl.hotspots.every((h) => {
        const st = g.hotspotStates[h.id];
        return st.tier !== 'broken' && !st.iced;
      });
      if (g.temp >= lvl.targetTemp || (allRepaired && g.temp >= lvl.targetTemp - 2.0)) return 'win';
      return null;
    }
    // ==CORE-END==

    /**
     * ============================================================================
     * 4. LocalStorage 存檔系統
     * ============================================================================
     */
    const STORAGE_KEY = 'blizzard_cabin_fix_v1';
    const LEGACY_STORAGE_KEY = 'gossip_harbor_ad_makeover_20_v5'; // 舊版進度：只讀取轉移，不刪除
    let saveData = {
      unlockedLevel: 1,
      stars: {}
    };

    function loadSaveData() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        let migrated = false;
        // 新 key 沒資料、舊 key 有資料：把舊的星等與解鎖進度轉過來
        if (!raw) {
          raw = localStorage.getItem(LEGACY_STORAGE_KEY);
          migrated = Boolean(raw);
        }
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed.unlockedLevel === 'number') {
            saveData.unlockedLevel = Math.min(LEVELS.length, Math.max(1, parsed.unlockedLevel));
            saveData.stars = parsed.stars || {};
            if (migrated) writeSaveData();
          }
        }
      } catch (e) {}
    }

    function writeSaveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
      } catch (e) {}
    }

    function getTotalStars() {
      return Object.values(saveData.stars).reduce((acc, s) => acc + (Number(s) || 0), 0);
    }

    /**
     * ============================================================================
     * 5. 遊戲狀態機與 DOM 參照
     * ============================================================================
     */
    const state = {
      status: 'map',
      currentLevel: LEVELS[0],
      // hotspotStates[id] = { id, tier: 'broken'|'makeshift'|'luxury', iced, wet, item, seal, heat, rank, brokenSecs, hand, hand1 }
      // (欄位由核心規則 initLevel 建立；level / budget / spent / rule / shortageCat / playTime 也由核心維護)
      level: LEVELS[0],
      budget: LEVELS[0].budget,
      spent: 0,
      rule: null,
      shortageCat: null,
      playTime: 0,
      warnedBudget: false,
      hotspotStates: {},
      selectedId: 'roof',
      temp: 13.0,
      maxTemp: 28.0,
      mistakes: 0,
      galePhase: 'calm', // 'calm' | 'warning' | 'gale' (只有狂風天氣會輪替)
      galeTimer: 0,
      bubble: {
        text: '好冷啊！快點破洞選工具把屋子補好！',
        mood: 'cold'
      },
      flyingTool: null,
      snowParticles: [],
      fxParticles: [],
      floatingTexts: [],
      time: 0,
      lastFrameTime: 0
    };

    const dom = {
      shell: document.getElementById('game-shell'),
      canvas: document.getElementById('game-canvas'),
      canvasWrapper: document.getElementById('canvas-wrapper'),
      hudLevelBadge: document.getElementById('hud-level-badge'),
      hudLevelName: document.getElementById('hud-level-name'),

      leakBadge: document.getElementById('leak-badge'),
      tempBar: document.getElementById('temp-bar'),
      targetTempMarker: document.getElementById('target-temp-marker'),
      targetTempText: document.getElementById('target-temp-text'),
      luxuryStarsPreview: document.getElementById('luxury-stars-preview'),
      luxuryBar: document.getElementById('luxury-bar'),
      repairCountText: document.getElementById('repair-count-text'),
      frostLayer: document.getElementById('frost-layer'),
      feedbackToast: document.getElementById('feedback-toast'),
      feedbackToastInner: document.getElementById('feedback-toast-inner'),
      feedbackTitle: document.getElementById('feedback-title'),

      flashLayer: document.getElementById('flash-layer'),
      hotspotTabs: document.getElementById('hotspot-tabs'),

      endBadge: document.getElementById('end-badge'),
      endStarsRow: document.getElementById('end-stars-row'),
      endEmoji: document.getElementById('end-emoji'),
      endTitle: document.getElementById('end-title'),

      statFinalTemp: document.getElementById('stat-final-temp'),

      btnEndMap: document.getElementById('btn-end-map'),
      btnEndNext: document.getElementById('btn-end-next'),
      btnOpenMap: document.getElementById('btn-open-map'),
      btnQuickRestart: document.getElementById('btn-quick-restart'),
      btnSound: document.getElementById('btn-sound'),
      confirmModal: document.getElementById('confirm-modal'),
      btnCancelReset: document.getElementById('btn-cancel-reset'),
      btnConfirmReset: document.getElementById('btn-confirm-reset'),
