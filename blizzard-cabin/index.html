        setBubble(option.say || '冰塊清除了！快繼續把這裡修好！', 'happy');
        addFloatingText(tx, ty - 18, `❄️ 除冰完成 ${dStr}`, '#38bdf8');
        spawnFxParticles(tx, ty, 'sparkles', 8);
        addRing(tx, ty, '#7dd3fc');
      }
      // 情況 C / D：修補 (湊合或豪華)
      else {
        const isLux = option.tier === 'luxury';
        if (isLux) {
          sound.playLuxurySuccess();
          triggerScreenFlash('bg-amber-300/35');
        } else {
          sound.playMakeshiftSuccess();
          triggerScreenFlash('bg-sky-400/25');
        }
        const notes = [];
        if (res.eff.dampHit) notes.push('受潮打折');
        if (res.eff.warmUp) notes.push('酷寒加倍保暖');
        if (res.eff.blown) notes.push('狂風來時會被吹掉');
        showToast(isLux ? 'success' : 'info', `${option.icon} 「${option.name}」${isLux ? '豪華完工！' : '補上了！'}`,
          `${option.say}（${dStr}${notes.length ? '，' + notes.join('、') : ''}）`);
        setBubble(option.say || (isLux ? '太豪華了！屋子變得又暖又漂亮！' : '勉強補上了！'), isLux ? 'happy' : 'cold');
        addFloatingText(tx, ty - 18, `${isLux ? '👑 ' : ''}${dStr}`, isLux ? '#fde047' : '#7dd3fc');
        spawnFxParticles(tx, ty, 'sparkles', isLux ? 16 : 10);
        addRing(tx, ty, isLux ? '#fde047' : '#7dd3fc');
        if (isLux) addRing(tx, ty, '#fef3c7');
      }

      // 不論成功、除冰或陷阱，都把游標移到下一個還沒修好的破洞（自己還沒修好就留在原處）
      autoSelectNextBroken(hotspotId);
      renderDecisionPanel();

      // 依據剩餘破損調整風聲大小
      const openCount = state.currentLevel.hotspots.filter((h) => state.hotspotStates[h.id].tier === 'broken').length;
      sound.setWindIntensity(Math.max(0.008, 0.015 + openCount * 0.012), state.galePhase === 'gale');

      // 點數用完仍有破洞：提醒玩家還有免費保底
      if (state.budget <= 0 && openCount > 0 && !state.warnedBudget && res.kind !== 'trap') {
        state.warnedBudget = true;
        setTimeout(() => {
          if (token === runToken && state.status === 'playing') showToast('info', '🧰 材料點數用完了！', '剩下的破洞可以用免費的「就地取材」先頂著，溫度才撐得住。', 4200);
        }, 700);
      }

      updateHUD();

      setTimeout(() => {
        if (token !== runToken) return; // 期間已重來或回地圖
        const verdict = endCheck(state);
        if (verdict === 'lose') {
          finishLevel(false);
          return;
        }
        if (verdict === 'win') {
          finishLevel(true);
          return;
        }
        state.status = 'playing';
        renderDecisionPanel();
      }, CHOICE_SETTLE_MS);
    }

    // 輕震動：遵守音效開關（關音效時也不震），裝置不支援就略過
    function haptic(pattern) {
      try {
        if (!sound.enabled) return;
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (e) {}
    }

    // 自動將遊標移往下一個尚未修好的破洞：fromId 自己還沒修好（除冰後、陷阱後）就留在原處，
    // 否則從 fromId 往後找（繞一圈），先找破損／結冰的，再找只有湊合修補的
    function autoSelectNextBroken(fromId) {
      const list = state.currentLevel.hotspots;
      const needsFix = (h) => state.hotspotStates[h.id].tier === 'broken' || state.hotspotStates[h.id].iced;
      const idx = list.findIndex((h) => h.id === fromId);
      if (idx >= 0 && needsFix(list[idx])) {
        state.selectedId = fromId;
        return;
      }
      const ordered = idx >= 0 ? list.slice(idx + 1).concat(list.slice(0, idx + 1)) : list;
      const brokenNext = ordered.find(needsFix);
      if (brokenNext) {
        state.selectedId = brokenNext.id;
        return;
      }
      const makeshiftNext = ordered.find((h) => state.hotspotStates[h.id].tier === 'makeshift');
      if (makeshiftNext) {
        state.selectedId = makeshiftNext.id;
      }
    }

    // 提示：新訊息直接取代舊的；點一下可關掉。
    // 目前選中的破洞在畫布下半部 → toast 顯示在畫布上緣，反之顯示在下緣（不蓋住要修的洞）
    function showToast(type, title, desc, duration) {
      if (toastTimeout) clearTimeout(toastTimeout);
      dom.feedbackTitle.textContent = safeText(title);
      dom.feedbackDesc.textContent = safeText(desc);
      dom.feedbackDesc.style.display = desc ? '' : 'none';

      const tone = type === 'success' ? 'bz-t-success' : type === 'info' ? 'bz-t-info' : 'bz-t-error';
      dom.feedbackToastInner.className = `bz-toast-inner ${tone}`;
      let onTop = false;
      const sdef = HOTSPOT_LIBRARY[state.selectedId];
      if (sdef && state.hotspotStates[state.selectedId] && (state.status === 'playing' || state.status === 'animating')) {
        onTop = pinPos(sdef).y > canvasH * 0.5;
      }
      if (onTop) dom.feedbackToast.classList.add('bz-top');
      else dom.feedbackToast.classList.remove('bz-top');
      dom.feedbackToast.classList.add('bz-on');
      state.lastToastAt = state.time;

      toastTimeout = setTimeout(hideToast, duration || 2600);
    }

    function hideToast() {
      if (toastTimeout) {
        clearTimeout(toastTimeout);
        toastTimeout = null;
      }
      dom.feedbackToast.classList.remove('bz-on');
    }

    function triggerScreenFlash(colorClass) {
      dom.flashLayer.className = `absolute inset-0 z-10 pointer-events-none flash-anim ${colorClass}`;
      setTimeout(() => {
        dom.flashLayer.className = 'hidden pointer-events-none';
      }, 550);
    }

    function triggerScreenShake() {
      if (REDUCED) return; // 減少動態：不抖動
      dom.shell.classList.remove('shake');
      void dom.shell.offsetWidth;
      dom.shell.classList.add('shake');
    }

    function setBubble(text, mood) {
      state.bubble.text = text;
      state.bubble.mood = mood;
      state.bubble.t = state.time;
      state.bubble.key = '';
      state.bubble.toasted = false;
    }

    function addFloatingText(x, y, text, color) {
      if (state.floatingTexts.length >= FLOAT_MAX) state.floatingTexts.shift();
      state.floatingTexts.push({ x, y, text: safeText(text), color, alpha: 1, vy: -1.3 });
    }

    // 擴散光環（修補成功／陷阱）：數量有上限
    function addRing(x, y, color) {
      if (state.rings.length >= RING_MAX) state.rings.shift();
      state.rings.push({ x, y, color, life: 1 });
    }

    function spawnFxParticles(x, y, type, count) {
      let n = count || 22;
      if (REDUCED) n = Math.ceil(n / 2);
      // 總量上限：超過就丟掉最舊的
      const room = FX_MAX - state.fxParticles.length;
      if (room < n) state.fxParticles.splice(0, n - room);

      // 冷風：陷阱時從洞口往屋內橫向吹出的白藍細粒（有方向、拖尾）
      if (type === 'cold_wind') {
        const dir = x < canvasW * 0.5 ? 1 : -1;
        for (let i = 0; i < n; i++) {
          state.fxParticles.push({
            x, y: y + (Math.random() - 0.5) * 26,
            vx: dir * (3 + Math.random() * 4.5), vy: (Math.random() - 0.5) * 1.4,
            size: 1.6 + Math.random() * 1.6, color: '#e0f2fe', char: null, life: 0.9, streak: true, star: false
          });
        }
        return;
      }

      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.4;
        const speed = 1.6 + Math.random() * 4.0;
        let color = '#fde047';
        let char = null;
        let star = false;

        if (type === 'sparkles') {
          color = i % 2 === 0 ? '#fde047' : '#fef3c7';
          star = i % 2 === 0; // 一半畫成四角星屑
        } else if (type === 'snow_dump' || type === 'ice_blast') {
          color = '#bae6fd';
          char = i % 3 === 0 ? '❄️' : null;
        } else if (type === 'paper_fly') {
          color = '#e2e8f0';
          char = i % 3 === 0 ? '📄' : null;
        } else if (type === 'poison_cloud') {
          color = '#86efac';
          char = i % 3 === 0 ? '🌫️' : null;
        } else {
          color = '#fca5a5';
          char = i % 3 === 0 ? '💥' : null;
        }

        state.fxParticles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.1,
          size: star ? 5 + Math.random() * 3 : 4 + Math.random() * 4,
          color, char, life: 1.0, streak: false, star
        });
      }
    }

    /**
     * ============================================================================
     * 10. 雙結局結算 (1星勉強遮風屋 / 2星溫馨木屋 / 3星夢幻豪華別墅)
     * ============================================================================
     */
    // 三星結算：十四片金色雪花（純 CSS 動畫，DOM 節點數固定）
    function buildGoldSnow() {
      dom.endFx.textContent = '';
      const n = REDUCED ? 0 : 14;
      for (let i = 0; i < n; i++) {
        const f = document.createElement('span');
        f.className = 'bz-gold';
        const size = 4 + Math.round(((i * 7) % 5) * 1.2);
        f.style.left = `${(i * 37 + 8) % 96}%`;
        f.style.width = `${size}px`;
        f.style.height = `${size}px`;
        f.style.animationDuration = `${(4.2 + ((i * 13) % 7) * 0.45).toFixed(2)}s`;
        f.style.animationDelay = `${((i * 29) % 40) / 10}s`;
        f.style.setProperty('--dx', `${((i % 2) ? 1 : -1) * (14 + (i % 4) * 8)}px`);
        dom.endFx.appendChild(f);
      }
    }

    function finishLevel(isVictory) {
      if (state.status === 'victory' || state.status === 'gameover') return;
      state.status = isVictory ? 'victory' : 'gameover';
      dom.frostLayer.style.opacity = '0';
      updateHUD();
      dom.endOverlay.classList.remove('bz-end-3', 'bz-end-lose');
      dom.endFx.textContent = '';

      const lvl = state.currentLevel;
      const lux = getLuxuryProgress();

      if (isVictory) {
        sound.playVictory();
        const prevStars = saveData.stars[lvl.id] || 0;
        saveData.stars[lvl.id] = Math.max(prevStars, lux.stars);
        if (lvl.id < LEVELS.length && saveData.unlockedLevel <= lvl.id) {
          saveData.unlockedLevel = lvl.id + 1;
        }
        writeSaveData();

        // 星星逐顆彈出（已得的依序延遲 0.28 秒）；三星時加暖光與飄落金色雪花
        dom.endStarsRow.innerHTML = [1, 2, 3].map((n) => (n <= lux.stars
          ? `<span class="bz-star bz-star-on" style="animation-delay:${(0.2 + n * 0.28).toFixed(2)}s">⭐</span>`
          : '<span class="bz-star bz-star-off">☆</span>')).join('');
        if (lux.stars === 3) {
          dom.endOverlay.classList.add('bz-end-3');
          buildGoldSnow();
        }

        if (lux.stars === 3) {
          dom.endBadge.textContent = `👑 第 ${lvl.id} 關 夢幻豪宅完美結局！`;
          dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-amber-950 border-amber-400 text-amber-300';
          dom.endEmoji.textContent = '🏰';
          dom.endTitle.textContent = '破屋奇蹟蛻變為夢幻豪華別墅！';
          dom.endSubtitle.textContent = `在有限的材料點數下把全屋改造得又豪華又暖（豪華度 ${lux.pct}%，剩餘 ${state.budget} 點），母子三人換上新衣享用大餐！`;
        } else if (lux.stars === 2) {
          dom.endBadge.textContent = `🏡 第 ${lvl.id} 關 溫馨小木屋結局`;
          dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-emerald-950 border-emerald-400 text-emerald-300';
          dom.endEmoji.textContent = '🏡';
          dom.endTitle.textContent = '成功打造溫暖避風港！';
          dom.endSubtitle.textContent = `屋內暖呼呼的！剩餘 ${state.budget} 點。若點數允許，把湊合材料升級成豪華材料並少選錯，就能拿 3 星！`;
        } else {
          dom.endBadge.textContent = `📎 第 ${lvl.id} 關 勉強遮風避雨結局`;
          dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-sky-950 border-sky-400 text-sky-300';
          dom.endEmoji.textContent = '🏚️';
          dom.endTitle.textContent = '勉強撐過暴風雪之夜…';
          dom.endSubtitle.textContent = `雖然保住了性命，但屋子只是勉強補上。重玩一次，看天氣挑對材料、多補幾個破洞衝擊更高星等吧！`;
        }

        dom.statFinalTemp.textContent = `${state.temp.toFixed(1)}°C`;
        dom.statFinalTemp.className = 'text-sm font-black text-emerald-400 mt-0.5';

        if (lvl.id < LEVELS.length) {
          dom.btnEndNext.textContent = `➡️ 挑戰第 ${lvl.id + 1} 關`;
          dom.btnEndNext.onclick = () => {
            sound.playClick();
            startLevel(lvl.id + 1);
          };
        } else {
          dom.btnEndNext.textContent = '🔄 重玩最終關';
          dom.btnEndNext.onclick = () => {
            sound.playClick();
            startLevel(lvl.id);
          };
        }
      } else {
        sound.playGameOver();
        dom.endBadge.textContent = `💀 第 ${lvl.id} 關 救援失敗`;
        dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-red-950 border-red-400 text-red-300';
        dom.endStarsRow.innerHTML = '<span class="bz-star bz-star-off">☆</span><span class="bz-star bz-star-off">☆</span><span class="bz-star bz-star-off">☆</span>';
        dom.endOverlay.classList.add('bz-end-lose'); // 失敗：畫面結霜
        dom.endEmoji.textContent = '🥶';
        dom.endTitle.textContent = '室內降至 0°C，母子被暴雪凍僵！';
        dom.endSubtitle.textContent = state.budget <= 0
          ? '材料點數用完了！下次挑便宜又合天氣的卡，別把點數花在陷阱與會被吹掉的材料上。'
          : '提示：先補「❄️❄️❄️」最大的漏風口，再靠保暖材料與壁爐升溫；留意天氣標籤！';
        dom.statFinalTemp.textContent = '0.0°C';
        dom.statFinalTemp.className = 'text-sm font-black text-cyan-400 mt-0.5';

        dom.btnEndNext.textContent = '🔄 重新挑戰本關';
        dom.btnEndNext.onclick = () => {
          sound.playClick();
          startLevel(lvl.id);
        };
      }

      dom.statLuxuryPct.textContent = `${lux.pct}%`;
      dom.statMistakes.textContent = `${state.mistakes} 次`;
      dom.endOverlay.classList.remove('hidden', 'pointer-events-none');
      dom.endOverlay.classList.add('pointer-events-auto');
    }

    /**
     * ============================================================================
     * 11. HTML5 Canvas 2D 破屋變豪宅即時視覺繪圖引擎 + 場景直接點擊偵測
     * ============================================================================
     */
    const THEME_PALETTES = {
      cabin:      { coldTop: '#26354d', coldBot: '#3b4f6e', warmTop: '#92400e', warmBot: '#b45309', roof: '#5c2408' },
      barn:       { coldTop: '#3a3330', coldBot: '#57534e', warmTop: '#991b1b', warmBot: '#b91c1c', roof: '#571111' },
      train:      { coldTop: '#1e293b', coldBot: '#334155', warmTop: '#9a3412', warmBot: '#c2410c', roof: '#292524' },
      mansion:    { coldTop: '#293548', coldBot: '#475569', warmTop: '#92400e', warmBot: '#d97706', roof: '#4c1d95' },
      lighthouse: { coldTop: '#1e3a5f', coldBot: '#1d4ed8', warmTop: '#c2410c', warmBot: '#ea580c', roof: '#1e3a8a' },
      church:     { coldTop: '#29384e', coldBot: '#475569', warmTop: '#854d0e', warmBot: '#ca8a04', roof: '#1e1b4b' },
      glacier:    { coldTop: '#0e7490', coldBot: '#0284c7', warmTop: '#0369a1', warmBot: '#0ea5e9', roof: '#083344' },
      ship:       { coldTop: '#1e293b', coldBot: '#334155', warmTop: '#475569', warmBot: '#64748b', roof: '#0f172a' },
      station:    { coldTop: '#1e293b', coldBot: '#334155', warmTop: '#0284c7', warmBot: '#0ea5e9', roof: '#0c4a6e' },
      clocktower: { coldTop: '#2e2a6b', coldBot: '#4c1d95', warmTop: '#92400e', warmBot: '#d97706', roof: '#1e1b4b' },
      summit:     { coldTop: '#1e3a8a', coldBot: '#2563eb', warmTop: '#b45309', warmBot: '#d97706', roof: '#172554' },
      palace:     { coldTop: '#312e81', coldBot: '#4338ca', warmTop: '#6d28d9', warmBot: '#86198f', roof: '#1e1b4b' }
    };

    function drawRoundRect(x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function getHotspotState(id) {
      return state.hotspotStates[id] || { tier: 'luxury', iced: false };
    }

    function drawScene() {
      const w = Math.max(240, canvasW);
      const h = Math.max(120, canvasH);
      const pal = THEME_PALETTES[state.currentLevel.theme] || THEME_PALETTES.cabin;
      const lux = getLuxuryProgress();
      const isLuxuryRoom = lux.pct >= 55;

      // 1. 室內背景牆壁 (隨著豪華改造度從冷暗藍灰蛻變為溫暖蜂蜜金木牆)
      const wallGrad = ctx.createLinearGradient(0, 0, 0, h * 0.72);
      if (!isLuxuryRoom) {
        wallGrad.addColorStop(0, pal.coldTop);
        wallGrad.addColorStop(1, pal.coldBot);
      } else {
        wallGrad.addColorStop(0, pal.warmTop);
        wallGrad.addColorStop(1, pal.warmBot);
      }
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, w, h * 0.72);

      // 木牆水平紋理
      ctx.strokeStyle = isLuxuryRoom ? 'rgba(254, 243, 199, 0.25)' : 'rgba(148, 163, 184, 0.24)';
      ctx.lineWidth = 2;
      for (let y = 30; y < h * 0.72; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // 豪華度 >= 75% 時出現金色吊燈與節慶彩旗！
      if (lux.pct >= 75) {
        drawChandelierAndGarland(w, h);
      }

      // 2. 屋頂區域
      drawRoofVisual(w, h, pal, getHotspotState('roof'));

      // 3. 地板區域
      const floorY = h * 0.70;
      const floorSt = getHotspotState('floor');
      const floorGrad = ctx.createLinearGradient(0, floorY, 0, h);
      if (floorSt.tier === 'luxury' || isLuxuryRoom) {
        floorGrad.addColorStop(0, '#b45309');
        floorGrad.addColorStop(1, '#78350f');
      } else {
        floorGrad.addColorStop(0, '#475569');
        floorGrad.addColorStop(1, '#1e293b');
      }
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, floorY, w, h - floorY);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, floorY - 3, w, 6);

      // 地板狀態視覺：結冰 / 舊草蓆 / 豪華波斯紅絨地毯
      if (floorSt.tier === 'broken') {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.beginPath();
        ctx.ellipse(w * 0.48, h * 0.87, w * 0.35, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(224, 242, 254, 0.9)';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (floorSt.tier === 'makeshift') {
        ctx.fillStyle = '#a16207';
        drawRoundRect(w * 0.20, h * 0.81, w * 0.56, 26, 6);
        ctx.fill();
      } else if (floorSt.tier === 'luxury') {
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.ellipse(w * 0.48, h * 0.87, w * 0.38, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // 4. 窗戶區域
      drawWindowVisual(w * 0.08, h * 0.21, w * 0.23, h * 0.23, getHotspotState('window'));

      // 5. 東側牆壁破洞區域
      if (state.hotspotStates['wall']) {
        drawWallVisual(w * 0.67, h * 0.22, w * 0.25, h * 0.25, getHotspotState('wall'));
      }

      // 6. 大門區域
      if (state.hotspotStates['door']) {
        drawDoorVisual(w * 0.87, h * 0.44, w * 0.11, h * 0.26, getHotspotState('door'));
      }

      // 7. 壁爐區域
      drawFireplaceVisual(w * 0.72, h * 0.68, getHotspotState('fireplace'));

      // 8. 暖床區域
      drawBedVisual(w * 0.08, h * 0.63, w * 0.40, h * 0.22, getHotspotState('bed'));

      // 9. 母子三人角色與對話框
      drawFamilyVisual(w * 0.30, h * 0.73);

      // 10. 餐桌區域
      if (state.hotspotStates['feast']) {
        drawFeastVisual(w * 0.54, h * 0.77, getHotspotState('feast'));
      }

      // 10b. 室內環境光（隨室溫：冷藍灰 → 暖橘）＋壁爐火光
      drawAmbientAndFire(w, h);

      // 10c. 對話泡泡（約 3 秒後淡出；矮畫布時避開圖釘，放不下就改用 toast）
      drawBubbleLayer(w * 0.30, h * 0.73);

      // 10d. 修補完成狀態：湊合＝虛線補丁環、豪華＝柔光＋閃星、已除冰＝水光
      drawStateMarks();

      // 11. 場景上所有可點擊破損的互動圓形徽章 (直接點擊提示)
      drawInteractiveHotspotPins(w, h);
    }

    // 屋外天空色（破洞／窗外看到的顏色）：酷寒更暗、濕雪灰藍、狂風偏深
    function skyColor() {
      const wid = state.currentLevel.weather;
      if (wid === 'cold') return '#06243a';
      if (wid === 'wet') return '#2b4a63';
      if (wid === 'gale') return '#0a3b5c';
      return '#0c4a6e';
    }

    // 四角星（星屑、豪華閃星）：只建路徑，呼叫端自己 fill
    function drawStar4(x, y, r) {
      const q = r * 0.32;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + q, y - q);
      ctx.lineTo(x + r, y);
      ctx.lineTo(x + q, y + q);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - q, y + q);
      ctx.lineTo(x - r, y);
      ctx.lineTo(x - q, y - q);
      ctx.closePath();
    }

    // 湊合補丁：虛線邊（和豪華的實線金邊區隔）
    function dashedOutline(x, y, w, h, r) {
      ctx.save();
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = 'rgba(254, 243, 199, 0.95)';
      ctx.lineWidth = 1.6;
      drawRoundRect(x + 2, y + 2, w - 4, h - 4, r);
      ctx.stroke();
      ctx.restore();
    }

    // 豪華：外圈柔光（三層半透明描邊，不用漸層物件）
    function softGlow(x, y, w, h, r) {
      ctx.save();
      ctx.strokeStyle = 'rgba(254, 240, 138, 0.14)';
      for (let k = 3; k >= 1; k--) {
        ctx.lineWidth = k * 5;
        drawRoundRect(x - k * 2, y - k * 2, w + k * 4, h + k * 4, r + k * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 漸層快取：只在畫布尺寸改變時重建（不要每幀 createRadialGradient）
    const gradCache = { key: '', fire: null };
    function fireGradient(w, h) {
      const key = `${Math.round(w)}x${Math.round(h)}`;
      if (gradCache.key !== key) {
        gradCache.key = key;
        const g = ctx.createRadialGradient(w * 0.72, h * 0.62, 6, w * 0.72, h * 0.62, w * 0.62);
        g.addColorStop(0, 'rgba(255, 176, 72, 0.55)');
        g.addColorStop(0.5, 'rgba(251, 146, 60, 0.2)');
        g.addColorStop(1, 'rgba(251, 146, 60, 0)');
        gradCache.fire = g;
      }
      return gradCache.fire;
    }

    // 室內環境光：冷時藍灰、接近目標時暖橘（一層半透明覆蓋）；壁爐修好後有搖曳火光
    function drawAmbientAndFire(w, h) {
      const tgt = state.currentLevel.targetTemp;
      const k = Math.max(0, Math.min(1, (state.temp - 4) / Math.max(4, tgt - 4)));
      let r, g, b, a;
      if (k < 0.55) {
        r = 40; g = 74; b = 128; a = 0.3 * (1 - k / 0.55);
      } else {
        r = 251; g = 146; b = 60; a = 0.17 * ((k - 0.55) / 0.45);
      }
      if (a > 0.004) {
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a.toFixed(3)})`;
        ctx.fillRect(0, 0, w, h);
      }

      const fp = state.hotspotStates['fireplace'];
      if (fp && !fp.iced && (fp.tier === 'luxury' || fp.tier === 'makeshift')) {
        const base = fp.tier === 'luxury' ? 1 : 0.55;
        const fl = REDUCED ? 1 : 0.86 + 0.14 * Math.sin(state.time * 13) * Math.sin(state.time * 5.3 + 1);
        ctx.save();
        ctx.globalAlpha = Math.min(1, base * fl);
        ctx.fillStyle = fireGradient(w, h);
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }
    }

    // 各破洞的完成狀態標記（畫在圖釘底下；豪華的圖釘會收起來，所以靠這圈柔光看得出來）
    function drawStateMarks() {
      if (state.status !== 'playing' && state.status !== 'animating') return;
      const tm = REDUCED ? 0 : state.time;
      state.currentLevel.hotspots.forEach((hs) => {
        const def = HOTSPOT_LIBRARY[hs.id];
        const st = state.hotspotStates[hs.id];
        if (!def || !st) return;
        const p = pinPos(def);
        if (st.tier === 'makeshift') {
          ctx.save();
          ctx.setLineDash([5, 4]);
          ctx.strokeStyle = 'rgba(186, 230, 253, 0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, PIN_R + 9, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (let k = 0; k < 4; k++) {
            const an = k * Math.PI / 2 + Math.PI / 4;
            ctx.moveTo(p.x + Math.cos(an) * (PIN_R + 4), p.y + Math.sin(an) * (PIN_R + 4));
            ctx.lineTo(p.x + Math.cos(an) * (PIN_R + 12), p.y + Math.sin(an) * (PIN_R + 12));
          }
          ctx.stroke();
          ctx.restore();
        } else if (st.tier === 'luxury') {
          const pulse = 0.75 + 0.25 * Math.sin(tm * 3 + p.x);
          ctx.save();
          ctx.fillStyle = `rgba(254, 240, 138, ${(0.1 * pulse).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 42, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(254, 240, 138, ${(0.16 * pulse).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 32, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = REDUCED ? 0.9 : 0.5 + 0.5 * Math.sin(tm * 4 + p.y);
          ctx.fillStyle = '#fef9c3';
          drawStar4(p.x + 24, p.y - 22, 6);
          ctx.fill();
          ctx.restore();
        } else if (!st.iced && st.wet) {
          ctx.save();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
          ctx.strokeStyle = 'rgba(125, 211, 252, 0.9)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y + PIN_R + 6, 22, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      });
    }

    function drawChandelierAndGarland(w, h) {
      // 節慶彩帶
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.14);
      ctx.quadraticCurveTo(w * 0.25, h * 0.21, w * 0.5, h * 0.13);
      ctx.quadraticCurveTo(w * 0.75, h * 0.21, w, h * 0.14);
      ctx.stroke();

      // 金色吊燈
      const cx = w * 0.5;
      const cy = h * 0.18;
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(cx - 2, h * 0.08, 4, h * 0.10);
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0, Math.PI * 2);
      ctx.fill();

      const aura = ctx.createRadialGradient(cx, cy, 2, cx, cy, 65);
      aura.addColorStop(0, 'rgba(254, 240, 138, 0.65)');
      aura.addColorStop(1, 'rgba(254, 240, 138, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(cx, cy, 65, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRoofVisual(w, h, pal, st) {
      ctx.fillStyle = pal.roof;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(w, 0);
      ctx.lineTo(w, h * 0.15);
      ctx.lineTo(w * 0.5, h * 0.05);
      ctx.lineTo(0, h * 0.15);
      ctx.closePath();
      ctx.fill();

      if (st.tier === 'broken') {
        ctx.fillStyle = skyColor();
        ctx.beginPath();
        ctx.ellipse(w * 0.50, h * 0.08, 46, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 2;
        ctx.stroke();
        drawWindStreaks(w * 0.50, h * 0.11, 0);
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#0284c7';
        drawRoundRect(w * 0.36, h * 0.04, w * 0.28, 18, 5);
        ctx.fill();
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        dashedOutline(w * 0.36, h * 0.04, w * 0.28, 18, 5);
      } else {
        softGlow(w * 0.34, h * 0.035, w * 0.32, 20, 6);
        ctx.fillStyle = '#d97706';
        drawRoundRect(w * 0.34, h * 0.035, w * 0.32, 20, 6);
        ctx.fill();
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function drawWindowVisual(x, y, w, h, st) {
      ctx.fillStyle = skyColor();
      drawRoundRect(x, y, w, h, 8);
      ctx.fill();

      if (st.tier === 'luxury') {
        softGlow(x, y, w, h, 8);
        ctx.fillStyle = 'rgba(254, 243, 199, 0.36)';
        drawRoundRect(x, y, w, h, 8);
        ctx.fill();

        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 5;
        drawRoundRect(x, y, w, h, 8);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + w / 2, y);
        ctx.lineTo(x + w / 2, y + h);
        ctx.moveTo(x, y + h / 2);
        ctx.lineTo(x + w, y + h / 2);
        ctx.stroke();

        // 紅絲絨窗簾
        ctx.fillStyle = '#dc2626';
        drawRoundRect(x - 6, y - 3, 14, h + 6, 4);
        ctx.fill();
        drawRoundRect(x + w - 8, y - 3, 14, h + 6, 4);
        ctx.fill();
      } else if (st.tier === 'makeshift') {
        // 舊報紙＋膠帶封窗
        ctx.fillStyle = '#cbd5e1';
        drawRoundRect(x + 3, y + 3, w - 6, h - 6, 4);
        ctx.fill();
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 6);
        ctx.lineTo(x + w - 6, y + h - 6);
        ctx.moveTo(x + w - 6, y + 6);
        ctx.lineTo(x + 6, y + h - 6);
        ctx.stroke();
        dashedOutline(x + 3, y + 3, w - 6, h - 6, 4);
      } else {
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 4;
        drawRoundRect(x, y, w, h, 6);
        ctx.stroke();

        ctx.fillStyle = 'rgba(186, 230, 253, 0.85)';
        ctx.beginPath();
        ctx.moveTo(x + 3, y + 3);
        ctx.lineTo(x + w * 0.42, y + 3);
        ctx.lineTo(x + w * 0.14, y + h * 0.35);
        ctx.closePath();
        ctx.fill();

        if (st.iced) {
          // 結冰冰柱視覺
          ctx.fillStyle = '#bae6fd';
          for (let i = 0; i < 4; i++) {
            const ix = x + 10 + i * (w * 0.22);
            ctx.beginPath();
            ctx.moveTo(ix, y);
            ctx.lineTo(ix + 10, y);
            ctx.lineTo(ix + 5, y + 24);
            ctx.closePath();
            ctx.fill();
          }
        }
        drawWindStreaks(x + w * 0.5, y + h * 0.5, -1);
      }
    }

    function drawWallVisual(x, y, w, h, st) {
      if (st.tier === 'luxury') {
        // 豪華木牆＋暖光壁燈
        softGlow(x, y, w, h, 8);
        ctx.fillStyle = '#d97706';
        drawRoundRect(x, y, w, h, 8);
        ctx.fill();
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, 9, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      ctx.fillStyle = skyColor();
      ctx.beginPath();
      ctx.moveTo(x + w * 0.15, y);
      ctx.lineTo(x + w * 0.85, y + h * 0.08);
      ctx.lineTo(x + w, y + h * 0.55);
      ctx.lineTo(x + w * 0.82, y + h);
      ctx.lineTo(x + w * 0.1, y + h * 0.92);
      ctx.lineTo(x, y + h * 0.45);
      ctx.closePath();
      ctx.fill();

      if (st.tier === 'makeshift') {
        ctx.fillStyle = '#b45309';
        drawRoundRect(x + 2, y + 4, w - 4, h - 8, 5);
        ctx.fill();
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 2;
        ctx.stroke();
        dashedOutline(x + 2, y + 4, w - 4, h - 8, 5);
      } else {
        drawWindStreaks(x + w * 0.45, y + h * 0.5, 1);
      }
    }

    function drawDoorVisual(x, y, w, h, st) {
      if (st.tier === 'luxury') {
        softGlow(x, y, w, h, 6);
        ctx.fillStyle = '#92400e';
        drawRoundRect(x, y, w, h, 6);
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        // 聖誕花圈
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h * 0.35, 10, 0, Math.PI * 2);
        ctx.stroke();
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#64748b';
        drawRoundRect(x, y, w, h, 4);
        ctx.fill();
        dashedOutline(x, y, w, h, 4);
      } else {
        ctx.fillStyle = skyColor();
        drawRoundRect(x, y, w, h, 4);
        ctx.fill();
        drawWindStreaks(x + w * 0.3, y + h * 0.5, 1);
      }
    }

    function drawFireplaceVisual(cx, cy, st) {
      ctx.fillStyle = st.iced ? '#38bdf8' : '#991b1b';
      ctx.fillRect(cx - 18, cy - 92, 36, 38);

      ctx.fillStyle = st.tier === 'luxury' ? '#b91c1c' : '#64748b';
      drawRoundRect(cx - 46, cy - 56, 92, 64, 10);
      ctx.fill();
      ctx.strokeStyle = st.tier === 'luxury' ? '#fbbf24' : '#cbd5e1';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      drawRoundRect(cx - 31, cy - 40, 62, 46, 8);
      ctx.fill();

      if (st.iced) {
        ctx.fillStyle = 'rgba(125, 211, 252, 0.85)';
        drawRoundRect(cx - 35, cy - 44, 70, 52, 10);
        ctx.fill();
        ctx.strokeStyle = '#f0f9ff';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (st.tier === 'luxury') {
        const flicker = REDUCED ? 0 : Math.sin(state.time * 15) * 4.5;
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(cx - 21, cy - 5);
        ctx.quadraticCurveTo(cx - 24, cy - 32, cx + flicker, cy - 46);
        ctx.quadraticCurveTo(cx + 24, cy - 32, cx + 21, cy - 5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.moveTo(cx - 11, cy - 5);
        ctx.quadraticCurveTo(cx - 13, cy - 22, cx - flicker * 0.6, cy - 32);
        ctx.quadraticCurveTo(cx + 13, cy - 22, cx + 11, cy - 5);
        ctx.closePath();
        ctx.fill();

        ctx.font = '16px sans-serif';
        ctx.fillText('🎄', cx - 26, cy - 64);
        ctx.fillText('🧦', cx + 22, cy - 64);
      } else if (st.tier === 'makeshift') {
        // 微弱小火苗
        const wob = REDUCED ? 0 : Math.sin(state.time * 11);
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.arc(cx, cy - 12, 8 + wob * 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(cx, cy - 10, 4 + wob * 0.6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#78350f';
        drawRoundRect(cx - 18, cy - 12, 36, 8, 3);
        ctx.fill();
      }
    }

    function drawBedVisual(x, y, w, h, st) {
      if (st.tier === 'luxury') {
        ctx.fillStyle = '#92400e';
        drawRoundRect(x - 6, y - 14, w * 0.78, 50, 8);
        ctx.fill();

        ctx.fillStyle = '#fef3c7';
        drawRoundRect(x, y - 6, w * 0.70, 36, 10);
        ctx.fill();

        ctx.fillStyle = '#ef4444';
        drawRoundRect(x + w * 0.18, y - 6, w * 0.48, 36, 10);
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#64748b';
        drawRoundRect(x + 6, y + 14, w * 0.68, 22, 8);
        ctx.fill();
      } else {
        ctx.fillStyle = '#475569';
        drawRoundRect(x + 10, y + 18, w * 0.62, 16, 6);
        ctx.fill();
      }
    }

    function drawFeastVisual(cx, cy, st) {
      ctx.fillStyle = '#78350f';
      ctx.fillRect(cx - 5, cy + 4, 10, 22);

      if (st.tier === 'luxury') {
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 48, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍗', cx - 14, cy - 5);
        ctx.fillText('☕', cx + 15, cy - 4);
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 38, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🥔', cx, cy - 4);
      } else {
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 34, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 心情四段：0 凍僵發抖（<5°C）／1 冷／2 還行／3 溫暖開心（接近目標）
    function moodLevel() {
      const tgt = state.currentLevel.targetTemp;
      const tm = state.temp;
      let m = tm < 5.0 ? 0 : tm < tgt * 0.62 ? 1 : tm < tgt * 0.86 ? 2 : 3;
      if (m < 2 && getHotspotState('fireplace').tier === 'luxury') m = 2; // 壁爐旺，至少不會太慘
      return m;
    }

    function drawFamilyVisual(baseX, baseY) {
      const mood = moodLevel();
      const isLuxuryClothes = getHotspotState('bed').tier === 'luxury';
      // 發抖：小幅位移（減少動態時不抖）
      let shiverAmp = mood === 0 ? 2.4 + (5 - Math.max(0, state.temp)) * 0.3 : mood === 1 ? 1.1 : 0;
      if (REDUCED) shiverAmp = 0;
      const sx = Math.sin(state.time * 42) * shiverAmp;
      const sy = Math.cos(state.time * 36) * (shiverAmp * 0.4);
      // 呼出白氣：很冷、或酷寒天氣且還沒暖起來
      const breath = !REDUCED && (mood <= 1 || (state.currentLevel.weather === 'cold' && mood < 3));

      ctx.save();
      ctx.translate(baseX + sx, baseY + sy);

      ctx.fillStyle = isLuxuryClothes ? '#ef4444' : '#64748b';
      ctx.beginPath();
      ctx.ellipse(0, 8, 50, 20, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      drawPerson({ x: 0, y: -25, headR: 16, hairColor: '#713f12', coatColor: isLuxuryClothes ? '#f59e0b' : '#64748b', mood, breath, seed: 0 });
      drawPerson({ x: -27, y: -11, headR: 12.5, hairColor: '#92400e', coatColor: isLuxuryClothes ? '#ec4899' : '#94a3b8', mood, breath, seed: 1 });
      drawPerson({ x: 27, y: -9, headR: 12, hairColor: '#451a03', coatColor: isLuxuryClothes ? '#3b82f6' : '#94a3b8', mood, breath, seed: 2 });

      ctx.restore();
    }

    function drawPerson({ x, y, headR, hairColor, coatColor, mood, breath, seed }) {
      ctx.fillStyle = coatColor;
      ctx.beginPath();
      ctx.ellipse(x, y + headR + 13, headR * 1.15, headR * 1.25, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hairColor;
      ctx.beginPath();
      ctx.arc(x, y - 2, headR + 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = mood >= 2 ? '#fed7aa' : mood === 1 ? '#e2e8f0' : '#c7d9ee';
      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hairColor;
      ctx.beginPath();
      ctx.arc(x, y - 3, headR, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();

      const eo = headR * 0.36;
      ctx.strokeStyle = '#0f172a';
      ctx.fillStyle = '#0f172a';
      ctx.lineWidth = 1.8;
      if (mood === 0) {
        // 凍僵：眼睛擠成 > <
        ctx.beginPath();
        ctx.moveTo(x - eo - 2.5, y - 1);
        ctx.lineTo(x - eo + 1.5, y + 1);
        ctx.lineTo(x - eo - 2.5, y + 3);
        ctx.moveTo(x + eo + 2.5, y - 1);
        ctx.lineTo(x + eo - 1.5, y + 1);
        ctx.lineTo(x + eo + 2.5, y + 3);
        ctx.stroke();
      } else if (mood === 3) {
        // 開心：笑瞇瞇的弧形眼
        ctx.beginPath();
        ctx.arc(x - eo, y + 2, 2.6, Math.PI * 1.1, Math.PI * 1.9);
        ctx.moveTo(x + eo + 2.6, y + 2);
        ctx.arc(x + eo, y + 2, 2.6, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(x - eo, y + 1, 2, 0, Math.PI * 2);
        ctx.arc(x + eo, y + 1, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.lineWidth = 2;
      if (mood === 0) {
        // 牙齒打顫：鋸齒嘴
        ctx.strokeStyle = '#1d4ed8';
        ctx.beginPath();
        ctx.moveTo(x - 5, y + 8);
        ctx.lineTo(x - 2.5, y + 6);
        ctx.lineTo(x, y + 8);
        ctx.lineTo(x + 2.5, y + 6);
        ctx.lineTo(x + 5, y + 8);
        ctx.stroke();
      } else if (mood === 1) {
        ctx.strokeStyle = '#2563eb';
        ctx.beginPath();
        ctx.arc(x, y + 8, 3.8, 1.15 * Math.PI, 1.85 * Math.PI);
        ctx.stroke();
      } else if (mood === 2) {
        ctx.strokeStyle = '#7c2d12';
        ctx.beginPath();
        ctx.moveTo(x - 3.5, y + 6);
        ctx.lineTo(x + 3.5, y + 6);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#991b1b';
        ctx.beginPath();
        ctx.arc(x, y + 4, 4.2, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
        ctx.fillStyle = 'rgba(251, 113, 133, 0.5)';
        ctx.beginPath();
        ctx.arc(x - headR * 0.62, y + 4, 2.6, 0, Math.PI * 2);
        ctx.arc(x + headR * 0.62 + 2.6, y + 4, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }

      if (breath) {
        // 呼出白氣：從嘴邊飄起、擴大、淡出
        const ph = (state.time * 0.6 + seed * 0.37) % 1;
        if (ph < 0.75) {
          const k = ph / 0.75;
          ctx.save();
          ctx.globalAlpha = (1 - k) * 0.6;
          ctx.fillStyle = '#f1f5f9';
          ctx.beginPath();
          ctx.arc(x + headR * 0.8 + k * 16, y + 6 - k * 14, 2 + k * 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // ---- 對話泡泡：約 3 秒後淡出；矮畫布時避開圖釘 ----
    function bubbleBox(x, y, text) {
      ctx.save();
      ctx.font = 'bold 11px "Noto Sans TC", sans-serif';
      const textW = ctx.measureText(text).width;
      ctx.restore();
      const boxW = Math.min(canvasW - 22, textW + 20);
      const boxH = 28;
      return {
        boxW, boxH,
        bx: Math.max(11, Math.min(canvasW - boxW - 11, x - boxW * 0.42)),
        by: Math.max(10, y - boxH)
      };
    }

    function drawBubbleBox(bx, by, boxW, boxH, text, mood) {
      ctx.save();
      ctx.font = 'bold 11px "Noto Sans TC", sans-serif';
      ctx.fillStyle = mood === 'happy' ? '#fef3c7' : mood === 'pain' ? '#fee2e2' : '#f8fafc';
      ctx.strokeStyle = mood === 'happy' ? '#f59e0b' : mood === 'pain' ? '#ef4444' : '#38bdf8';
      ctx.lineWidth = 2;
      drawRoundRect(bx, by, boxW, boxH, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = mood === 'pain' ? '#991b1b' : '#0f172a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, bx + boxW / 2, by + boxH / 2 + 1, boxW - 10);
      ctx.restore();
    }

    function drawSpeechBubble(x, y, text, mood) {
      const bb = bubbleBox(x, y, text);
      drawBubbleBox(bb.bx, bb.by, bb.boxW, bb.boxH, text, mood);
    }

    // 決定泡泡位置（有快取：文字、畫布尺寸、可見圖釘沒變就不重算）。
    // 畫布高度 <260px 時，位置若壓到圖釘就找一塊不重疊的地方；找不到就不畫（b.none），改由 toast 顯示
    function layoutBubble(ax, ay) {
      const b = state.bubble;
      const small = canvasH < BUBBLE_MIN_H;
      let vis = [];
      if (small) {
        vis = state.currentLevel.hotspots.filter((h) => {
          const st = state.hotspotStates[h.id];
          return st && HOTSPOT_LIBRARY[h.id] && (st.tier !== 'luxury' || h.id === state.selectedId);
        });
      }
      const key = `${canvasW}x${canvasH}|${state.currentLevel.id}|${b.text}|${vis.map((h) => h.id).join(',')}`;
      if (b.key === key) return;
      b.key = key;
      const bb = bubbleBox(ax, ay, b.text);
      b.w = bb.boxW; b.h = bb.boxH; b.x = bb.bx; b.y = bb.by; b.none = false;
      if (!small) return;

      const pins = vis.map((h) => pinPos(HOTSPOT_LIBRARY[h.id]));
      const R = PIN_R_SEL + 8;
      const hits = (x, y) => pins.some((p) => {
        const dx = Math.max(x - p.x, 0, p.x - (x + b.w));
        const dy = Math.max(y - p.y, 0, p.y - (y + b.h));
        return dx * dx + dy * dy < R * R;
      });
      if (!hits(b.x, b.y)) return;
      const cands = [];
      for (let yy = 6; yy <= canvasH - b.h - 4; yy += 8) {
        [11, (canvasW - b.w) / 2, canvasW - b.w - 11].forEach((xx) => cands.push([xx, yy]));
      }
      cands.sort((p, q) => (Math.abs(p[0] - b.x) + Math.abs(p[1] - b.y)) - (Math.abs(q[0] - b.x) + Math.abs(q[1] - b.y)));
      const ok = cands.find((c) => !hits(c[0], c[1]));
      if (ok) { b.x = ok[0]; b.y = ok[1]; } else { b.none = true; }
    }

    function drawBubbleLayer(baseX, baseY) {
      const b = state.bubble;
      if (!b.text || state.status === 'map' || state.status === 'briefing') return;
      const age = state.time - b.t;
      if (age >= BUBBLE_SHOW_SEC + BUBBLE_FADE_SEC) return;
      layoutBubble(baseX + 16, baseY - 78);
      if (b.none) {
        // 放不下：不畫泡泡；若近 3 秒內沒有別的提示，就改用 toast 顯示這句話
        if (!b.toasted) {
          b.toasted = true;
          if (state.time - state.lastToastAt > 3) showToast('info', b.text, '', 2400);
        }
        return;
      }
      const alpha = age <= BUBBLE_SHOW_SEC ? 1 : 1 - (age - BUBBLE_SHOW_SEC) / BUBBLE_FADE_SEC;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      drawBubbleBox(b.x, b.y, b.w, b.h, b.text, b.mood);
      ctx.restore();
    }

    // 狂風來襲／預警時，破洞周圍的風痕。狂風 5 秒內畫橫向長風痕；平時是斜斜的短風痕
    function drawWindStreaks(cx, cy, dir) {
      const gale = state.galePhase === 'gale';
      const tm = REDUCED ? 0 : state.time;
      ctx.save();
      ctx.strokeStyle = gale ? 'rgba(224, 242, 254, 0.95)'
        : state.galePhase === 'warning' ? 'rgba(254, 243, 199, 0.8)' : 'rgba(186, 230, 253, 0.55)';
      ctx.lineWidth = gale ? 2.6 : 1.6;
      const spd = gale ? 220 : 90;
      const len = gale ? 48 : 24;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const offset = ((tm * spd + i * 26) % 65);
        const startX = dir === 0 ? cx - 14 + i * 14 : cx - dir * offset;
        const startY = dir === 0 ? cy + offset : cy - 16 + i * 15;
        ctx.moveTo(startX, startY);
        ctx.lineTo(dir === 0 ? startX - 6 : startX - dir * len, startY + (gale && dir !== 0 ? 2 : 12));
      }
      ctx.stroke();
      ctx.restore();
    }

    // 狂風來襲那 5 秒：整個畫面的橫向風痕（物件池，重複使用，不配置新陣列）
    function drawGaleStreaks(dt) {
      const pool = state.streaks;
      if (!pool.length) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(224, 242, 254, 0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < pool.length; i++) {
        const s = pool[i];
        s.x -= s.sp * dt;
        if (s.x + s.len < 0) {
          s.x = canvasW + Math.random() * 80;
          s.y = Math.random() * canvasH;
          s.len = 50 + Math.random() * 90;
          s.sp = 900 + Math.random() * 700;
        }
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + s.len, s.y + s.len * 0.04);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 狂風時，未修的破洞把雪吹進屋內（物件池：只重複使用死掉的格子，總數不會超過 WIND_MAX）
    function emitWind(dt) {
      const pool = state.windParticles;
      const rate = dt * (REDUCED ? 5 : 11);
      state.currentLevel.hotspots.forEach((hs) => {
        const st = state.hotspotStates[hs.id];
        const def = HOTSPOT_LIBRARY[hs.id];
        if (!st || !def || st.tier !== 'broken') return;
        if (Math.random() > rate) return;
        for (let i = 0; i < pool.length; i++) {
          if (pool[i].life > 0) continue;
          const p = pool[i];
          const pp = pinPos(def);
          const dirX = pp.x < canvasW * 0.5 ? 1 : -1;
          p.x = pp.x;
          p.y = pp.y + (Math.random() - 0.5) * 16;
          if (def.id === 'roof') {
            p.vx = (Math.random() - 0.5) * 90;
            p.vy = 130 + Math.random() * 120;
          } else {
            p.vx = dirX * (240 + Math.random() * 220);
            p.vy = (Math.random() - 0.5) * 80 + 20;
          }
          p.r = 1.4 + Math.random() * 1.8;
          p.life = 0.8 + Math.random() * 0.7;
          return;
        }
      });
    }

    function drawWindParticles(dt) {
      const pool = state.windParticles;
      ctx.save();
      ctx.fillStyle = 'rgba(240, 249, 255, 0.85)';
      ctx.beginPath();
      for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (p.life <= 0) continue;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) continue;
        ctx.moveTo(p.x + p.r, p.y);
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.restore();
    }

    // 怕潮的修補處（濕雪天、或剛除冰還潮濕）偶爾滴水
    function emitDrips(dt) {
      const lim = REDUCED ? 2 : DRIP_MAX;
      if (state.drips.length >= lim) return;
      if (Math.random() > dt * 0.5) return;
      const wetAll = state.currentLevel.weather === 'wet';
      const cands = state.currentLevel.hotspots.filter((h) => {
        const st = state.hotspotStates[h.id];
        return st && HOTSPOT_LIBRARY[h.id] && st.item && hasTrait(st.item, 'damp') && (wetAll || st.wet);
      });
      if (!cands.length) return;
      const pp = pinPos(HOTSPOT_LIBRARY[cands[Math.floor(Math.random() * cands.length)].id]);
      state.drips.push({ x: pp.x + (Math.random() - 0.5) * 14, y: pp.y + 12, vy: 0, end: pp.y + 38 + Math.random() * 10, splash: 0 });
    }

    function drawDrips(dt) {
      const arr = state.drips;
      if (!arr.length) return;
      ctx.save();
      for (let i = arr.length - 1; i >= 0; i--) {
        const d = arr[i];
        if (d.splash > 0) {
          d.splash -= dt * 3.2;
          if (d.splash <= 0) { arr.splice(i, 1); continue; }
          ctx.strokeStyle = `rgba(186, 230, 253, ${(d.splash * 0.8).toFixed(2)})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(d.x, d.end, 3 + (1 - d.splash) * 6, 1.5 + (1 - d.splash) * 2, 0, 0, Math.PI * 2);
          ctx.stroke();
          continue;
        }
        d.vy += 520 * dt;
        d.y += d.vy * dt;
        if (d.y >= d.end) { d.splash = 1; continue; }
        ctx.fillStyle = 'rgba(147, 197, 253, 0.9)';
        ctx.beginPath();
        ctx.ellipse(d.x, d.y, 2, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 圖釘的實際位置：依比例換算後夾在邊緣內側，矮畫布也不會被擠出邊緣（繪製、命中、飛行目標共用）
    function pinPos(def) {
      const x = def.pos.x * canvasW;
      const y = def.pos.y * canvasH;
      return {
        x: Math.max(PIN_PAD, Math.min(canvasW - PIN_PAD, x)),
        y: Math.max(PIN_PAD, Math.min(canvasH - PIN_PAD, y))
      };
    }

    // 在畫布上直接繪製可點擊的破損圓形圖釘 (點擊畫布即可直接選中！)
    function drawInteractiveHotspotPins(w, h) {
      if (state.status !== 'playing' && state.status !== 'animating') return;
      const warning = state.galePhase === 'warning';

      state.currentLevel.hotspots.forEach((hSpec) => {
        const def = HOTSPOT_LIBRARY[hSpec.id];
        const st = state.hotspotStates[hSpec.id];
        if (!def || !st) return;

        // 狂風預警：會被吹掉的修補（不抗風）圖釘輕微晃動＋警示環，讓玩家看出哪裡有危險
        const atRisk = warning && Boolean(st.item) && blownByGale(st.item);
        // 已經豪華完成且非當前選中的點位收起來（但預警時有危險的要顯示）
        const isSelected = state.selectedId === hSpec.id;
        if (st.tier === 'luxury' && !isSelected && !atRisk) return;

        const pp = pinPos(def);
        const cx = pp.x + (atRisk && !REDUCED ? Math.sin(state.time * 40 + pp.y) * 3 : 0);
        const cy = pp.y;
        // 按下當下：圖釘瞬間放大再回彈
        const pr = state.pinPress;
        const press = pr && pr.id === hSpec.id ? Math.max(0, 1 - (state.time - pr.t) / PIN_PRESS_SEC) : 0;
        const pulse = (isSelected ? PIN_R_SEL + Math.sin(state.time * 7) * 2.5 : PIN_R + Math.sin(state.time * 4) * 2) + press * 7;

        ctx.save();
        // 外圈發光環
        ctx.beginPath();
        ctx.arc(cx, cy, pulse + 4, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? 'rgba(251, 191, 36, 0.35)' : 'rgba(15, 23, 42, 0.45)';
        ctx.fill();

        // 圓形徽章底色
        ctx.beginPath();
        ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
        if (isSelected) {
          ctx.fillStyle = '#f59e0b';
          ctx.strokeStyle = '#fef08a';
        } else if (st.iced) {
          ctx.fillStyle = '#0284c7';
          ctx.strokeStyle = '#bae6fd';
        } else if (st.tier === 'makeshift') {
          ctx.fillStyle = '#334155';
          ctx.strokeStyle = '#38bdf8';
        } else if (st.tier === 'luxury') {
          ctx.fillStyle = '#065f46';
          ctx.strokeStyle = '#6ee7b7';
        } else {
          ctx.fillStyle = '#991b1b';
          ctx.strokeStyle = '#fca5a5';
        }
        ctx.lineWidth = isSelected ? 3 : 2;
        ctx.fill();
        ctx.stroke();

        if (atRisk) {
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.95)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(cx, cy, pulse + 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 徽章圖示（新版 emoji 換成舊手機也有的）
        ctx.font = `${(isSelected ? 22 : 18) + Math.round(press * 4)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const badgeIcon = st.iced ? '❄️' : st.tier === 'luxury' ? '👑' : st.tier === 'makeshift' ? '📎' : safeIcon(def.icon);
        ctx.fillText(badgeIcon, cx, cy);
        if (atRisk) {
          ctx.font = 'bold 15px sans-serif';
          ctx.fillStyle = '#fbbf24';
          ctx.fillText('⚠', cx + pulse * 0.75, cy - pulse * 0.8);
        }
        ctx.restore();
      });
    }

    /**
     * ============================================================================
     * 12. 畫布點擊互動偵測 (直接點破洞就能切換！)
     * ============================================================================
     */
    // 命中判定：取最近的破洞（兩個很近時也只會選到較近的那個），沒命中回傳 null
    function hitTestHotspot(clientX, clientY) {
      const rect = dom.canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      const px = (clientX - rect.left) * (canvasW / rect.width);
      const py = (clientY - rect.top) * (canvasH / rect.height);

      let closestId = null;
      let minDist = PIN_HIT_R; // 寬鬆好點的觸控半徑

      state.currentLevel.hotspots.forEach((hSpec) => {
        const def = HOTSPOT_LIBRARY[hSpec.id];
        if (!def) return;
        const pp = pinPos(def);
        const dist = Math.hypot(px - pp.x, py - pp.y);
        if (dist < minDist) {
          minDist = dist;
          closestId = hSpec.id;
        }
      });
      return closestId;
    }

    // 手指一按下就選取並有回饋（不用等放開）
    dom.canvas.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return; // 滑鼠右鍵／中鍵不處理
      if (state.status !== 'playing' || uiPaused) return;
      const id = hitTestHotspot(e.clientX, e.clientY);
      if (!id) return; // 點在沒有破洞的地方：什麼都不做
      lastPointerAt = performance.now();
      state.pinPress = { id, t: state.time };
      selectHotspot(id);
    });

    // click 保留給鍵盤／滑鼠相容；剛由 pointerdown 處理過的同一次點擊會略過，避免重複觸發
    dom.canvas.addEventListener('click', (e) => {
      if (performance.now() - lastPointerAt < POINTER_CLICK_GUARD_MS) return;
      if (state.status !== 'playing' || uiPaused) return;
      const id = hitTestHotspot(e.clientX, e.clientY);
      if (id) selectHotspot(id);
    });

    /**
     * ============================================================================
     * 13. 主遊戲迴圈與暴風雪狂風週期
     * ============================================================================
     */
    function resizeCanvas() {
      if (!dom.canvasWrapper || !dom.canvas) return;
      const rect = dom.canvasWrapper.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      // 下限只是保險：實際高度由版面決定（最少約 200px），別讓下限比真實尺寸大，否則畫面會被壓扁
      canvasW = Math.max(240, rect.width || dom.shell.clientWidth || 420);
      canvasH = Math.max(120, rect.height || 440);
      dom.canvas.width = Math.floor(canvasW * dpr);
      dom.canvas.height = Math.floor(canvasH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // 各天氣的雪花：一般（稍微柔化）／狂風（斜飛）／濕雪（大而重、帶水滴感）／酷寒（少而細）
    function snowProfile(wid) {
      switch (wid) {
        case 'gale': return { n: 110, r0: 1.3, r1: 3.4, vx0: -3.0, vx1: -6.0, vy0: 1.2, vy1: 2.8, indoor: 0.3, out: 'rgba(255, 255, 255, 0.5)', inn: 'rgba(224, 242, 254, 0.5)', kind: 'flake' };
        case 'wet': return { n: 64, r0: 2.6, r1: 4.8, vx0: -0.9, vx1: -2.0, vy0: 2.6, vy1: 4.4, indoor: 0.3, out: 'rgba(190, 215, 240, 0.55)', inn: 'rgba(186, 230, 253, 0.5)', kind: 'wet' };
        case 'cold': return { n: 52, r0: 0.8, r1: 1.7, vx0: -1.2, vx1: -2.4, vy0: 1.0, vy1: 2.0, indoor: 0.2, out: 'rgba(255, 255, 255, 0.62)', inn: 'rgba(224, 242, 254, 0.55)', kind: 'flake' };
        default: return { n: 110, r0: 1.3, r1: 3.4, vx0: -1.4, vx1: -3.0, vy0: 1.3, vy1: 2.8, indoor: 0.35, out: 'rgba(255, 255, 255, 0.34)', inn: 'rgba(224, 242, 254, 0.5)', kind: 'flake' };
      }
    }

    function initSnowParticles() {
      const prof = snowProfile(state.currentLevel ? state.currentLevel.weather : 'normal');
      const n = Math.min(SNOW_MAX, Math.max(8, Math.round(prof.n * (REDUCED ? 0.5 : 1))));
      const sp = REDUCED ? 0.6 : 1;
      state.snowParticles = [];
      for (let i = 0; i < n; i++) {
        state.snowParticles.push({
          x: Math.random() * Math.max(400, canvasW),
          y: Math.random() * Math.max(400, canvasH),
          r: prof.r0 + Math.random() * (prof.r1 - prof.r0),
          vx: (prof.vx0 + Math.random() * (prof.vx1 - prof.vx0)) * sp,
          vy: (prof.vy0 + Math.random() * (prof.vy1 - prof.vy0)) * sp,
          indoor: i < n * prof.indoor
        });
      }
      state.snowKind = prof.kind;
      state.snowCol = [prof.out, prof.inn];

      // 物件池：固定長度，之後只重複使用
      state.windParticles = [];
      const wn = REDUCED ? 12 : WIND_MAX;
      for (let i = 0; i < wn; i++) state.windParticles.push({ x: 0, y: 0, vx: 0, vy: 0, r: 2, life: 0 });
      state.streaks = [];
      const sn = REDUCED ? 6 : STREAK_MAX;
      for (let i = 0; i < sn; i++) {
        state.streaks.push({
          x: Math.random() * Math.max(400, canvasW), y: Math.random() * Math.max(200, canvasH),
          len: 50 + Math.random() * 90, sp: 900 + Math.random() * 700
        });
      }
    }

    // 處理核心規則回傳的狂風事件 (音效、提示、畫面)
    function handleGameEvents(events) {
      events.forEach((ev) => {
        if (ev.type === 'warning') {
          sound.playAlarm();
          showToast('error', '⚠️ 暴雪狂風即將來襲！', '不抗風的修補會被吹飛，標示「抗風」或高級材料才撐得住！');
        } else if (ev.type === 'gale') {
          sound.setWindIntensity(0.085, true);
          triggerScreenShake();
          ev.ripped.forEach((rid) => {
            const rdef = HOTSPOT_LIBRARY[rid];
            if (!rdef) return;
            const rp = pinPos(rdef);
            spawnFxParticles(rp.x, rp.y, 'cold_wind', 10);
            addRing(rp.x, rp.y, '#f87171');
          });
          if (ev.ripped.length > 0) {
            showToast('error', `🌪️ 狂風吹飛了 ${ev.ripped.length} 處修補！`, '修補被吹掉要重新花材料點數，下次挑「抗風」的材料。');
            setBubble('哇啊！有的修補被狂風整片吹走了！', 'pain');
            renderDecisionPanel();
          }
        } else if (ev.type === 'galeEnd') {
          sound.setWindIntensity(0.035, false);
        }
      });
    }

    function renderCanvasFrame(dt = 0.016) {
      try {
        if (dom.canvas.width === 0 || dom.canvas.height === 0) {
          resizeCanvas();
        }

        ctx.clearRect(0, 0, canvasW, canvasH);
        drawScene();

        const gale = state.galePhase === 'gale';
        const live = dt > 0 && !uiPaused && (state.status === 'playing' || state.status === 'animating');
        if (live) {
          if (gale) emitWind(dt);
          emitDrips(dt);
        }

        // 雪花（兩批次畫：屋外／屋內，每批只一次 fill）
        const mx = gale ? 2.6 : 1.0;
        const my = gale ? 1.15 : 1.0;
        const sn = state.snowParticles;
        const wet = state.snowKind === 'wet';
        for (let i = 0; i < sn.length; i++) {
          const p = sn[i];
          p.x += p.vx * mx;
          p.y += p.vy * my;
          if (p.x < -10) { p.x = canvasW + 10; p.y = Math.random() * canvasH; }
          if (p.y > canvasH + 10) { p.y = -10; p.x = Math.random() * (canvasW + 40); }
        }
        for (let pass = 0; pass < 2; pass++) {
          ctx.fillStyle = state.snowCol[pass];
          ctx.beginPath();
          for (let i = 0; i < sn.length; i++) {
            const p = sn[i];
            if ((p.indoor ? 1 : 0) !== pass) continue;
            if (wet) {
              ctx.moveTo(p.x + p.r * 0.8, p.y);
              ctx.ellipse(p.x, p.y, p.r * 0.8, p.r * 1.2, 0, 0, Math.PI * 2);
            } else {
              ctx.moveTo(p.x + p.r, p.y);
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            }
          }
          ctx.fill();
        }

        if (gale) {
          drawGaleStreaks(dt);
          drawWindParticles(dt);
        } else {
          // 狂風結束後還飛著的雪粒讓它自然落完
          const wp = state.windParticles;
          for (let i = 0; i < wp.length; i++) { if (wp[i].life > 0) { drawWindParticles(dt); break; } }
        }
        drawDrips(dt);

        if (state.flyingTool) {
          const ft = state.flyingTool;
          ft.progress += dt * CHOICE_FLY_SPEED;
          const t = Math.min(1, ft.progress);
          const ease = 1 - Math.pow(1 - t, 3);
          const curX = ft.startX + (ft.targetX - ft.startX) * ease;
          const curY = ft.startY + (ft.targetY - ft.startY) * ease - Math.sin(t * Math.PI) * 65;
          const scale = 1 + Math.sin(t * Math.PI) * 0.5;

          ctx.save();
          ctx.translate(curX, curY);
          ctx.scale(scale, scale);
          ctx.rotate(Math.sin(t * Math.PI * 4) * 0.22);
          ctx.font = '42px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ft.icon, 0, 0);
          ctx.restore();

          if (ft.progress >= 1) {
            const { hotspotId, option } = ft;
            state.flyingTool = null;
            resolveChoiceImpact(hotspotId, option);
          }
        }

        // 修補成功／陷阱的擴散光環
        for (let i = state.rings.length - 1; i >= 0; i--) {
          const rg = state.rings[i];
          rg.life -= dt * 1.7;
          if (rg.life <= 0) { state.rings.splice(i, 1); continue; }
          ctx.save();
          ctx.globalAlpha = Math.min(1, rg.life * 0.9);
          ctx.strokeStyle = rg.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(rg.x, rg.y, REDUCED ? 34 : 8 + (1 - rg.life) * 44, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (let i = state.fxParticles.length - 1; i >= 0; i--) {
          const fp = state.fxParticles[i];
          fp.x += fp.vx;
          fp.y += fp.vy;
          fp.vy += fp.streak ? 0.02 : 0.12;
          fp.life -= dt * 1.45;
          if (fp.life <= 0) {
            state.fxParticles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, fp.life));
          if (fp.char) {
            ctx.font = '18px sans-serif';
            ctx.fillText(fp.char, fp.x, fp.y);
          } else if (fp.streak) {
            ctx.strokeStyle = fp.color;
            ctx.lineWidth = fp.size;
            ctx.beginPath();
            ctx.moveTo(fp.x, fp.y);
            ctx.lineTo(fp.x - fp.vx * 3.5, fp.y - fp.vy * 3.5);
            ctx.stroke();
          } else if (fp.star) {
            ctx.fillStyle = fp.color;
            drawStar4(fp.x, fp.y, fp.size * 1.3);
            ctx.fill();
          } else {
            ctx.fillStyle = fp.color;
            ctx.beginPath();
            ctx.arc(fp.x, fp.y, fp.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
          const ft = state.floatingTexts[i];
          ft.y += ft.vy;
          ft.alpha -= dt * 0.85;
          if (ft.alpha <= 0) {
            state.floatingTexts.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.font = '900 18px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#090d16';
          ctx.lineWidth = 4;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }
      } catch (err) {
        console.error('Canvas render recovered:', err);
      }
    }

    function gameLoop(timestamp) {
      // 分頁在背景：不推進計時與動畫，回來時重設時間基準，避免一口氣補扣溫度
      if (pageHidden) {
        state.lastFrameTime = 0;
        requestAnimationFrame(gameLoop);
        return;
      }
      if (!state.lastFrameTime) state.lastFrameTime = timestamp;
      const dt = Math.min((timestamp - state.lastFrameTime) / 1000, 0.1);
      state.lastFrameTime = timestamp;
      state.time += dt;

      if (state.status === 'playing' && !uiPaused) {
        handleGameEvents(stepGame(state, dt));
        updateHUD();

        const verdict = endCheck(state);
        if (verdict === 'lose') {
          finishLevel(false);
        } else if (verdict === 'win') {
          finishLevel(true);
        }
      }

      renderCanvasFrame(dt);
      requestAnimationFrame(gameLoop);
    }

    /**
     * ============================================================================
     * 14. 事件綁定與初始化啟動
     * ============================================================================
     */
    window.addEventListener('resize', () => {
      resizeCanvas();
      renderCanvasFrame();
      updateTabFade();
    });

    // 版面高度會因 chip 換行、保底鈕出現等改變，舞台尺寸變了就重算 Canvas
    if (window.ResizeObserver) {
      new ResizeObserver(() => {
        resizeCanvas();
        renderCanvasFrame(0);
      }).observe(dom.canvasWrapper);
    }

    // 切到背景：暫停計時與動畫（同時暫停聲音）；回來：重設時間基準
    document.addEventListener('visibilitychange', () => {
      pageHidden = document.hidden;
      state.lastFrameTime = 0;
      try {
        if (sound.ctx) {
          if (pageHidden) sound.ctx.suspend();
          else sound.ctx.resume();
        }
      } catch (e) {}
    });

    dom.hotspotTabs.addEventListener('scroll', updateTabFade, { passive: true });

    // 提示點一下就關掉（只關提示；提示不在 Canvas 裡，不會穿透去點到破洞）
    // 點在 toast 上時：關掉提示，並用同一個座標對破洞做命中判定（被 toast 蓋住的圖釘一點就選到）
    dom.feedbackToast.addEventListener('click', (e) => {
      e.stopPropagation();
      hideToast();
      if (state.status !== 'playing' || uiPaused) return;
      const id = hitTestHotspot(e.clientX, e.clientY);
      if (!id) return;
      lastPointerAt = performance.now(); // 同一次點擊不會再被 canvas 的 click 重複處理
      state.pinPress = { id, t: state.time };
      selectHotspot(id);
    });

    // 天氣／章節規則 chip：點一下再看完整說明
    dom.weatherChip.addEventListener('click', () => {
      if (state.status !== 'playing' && state.status !== 'animating') return;
      sound.init();
      sound.playClick();
      const lvl = state.currentLevel;
      const wx = levelWeather(lvl);
      showToast('info', `${wx.icon} 本關天氣：${wx.name}`, weatherText(lvl), 6000);
    });

    dom.ruleChip.addEventListener('click', () => {
      if (state.status !== 'playing' && state.status !== 'animating') return;
      const rl = ruleLineOf(state);
      if (!rl) return;
      sound.init();
      sound.playClick();
      showToast('info', '📌 章節規則', rl, 6000);
    });

    dom.btnBriefStart.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      beginPlaying();
    });

    dom.btnBriefMap.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      showMapOverlay();
    });

    // 確認視窗（清除進度、關卡中重來共用）；開著的時候暫停計時
    function openConfirm(opts) {
      dom.confirmTitle.textContent = opts.title;
      dom.confirmDesc.textContent = opts.desc;
      dom.btnConfirmReset.textContent = opts.okText;
      pendingConfirm = opts.onOk;
      uiPaused = true;
      dom.confirmModal.classList.remove('hidden', 'pointer-events-none');
      dom.confirmModal.classList.add('pointer-events-auto');
    }

    function closeConfirm() {
      pendingConfirm = null;
      uiPaused = false;
      dom.confirmModal.classList.add('hidden', 'pointer-events-none');
      dom.confirmModal.classList.remove('pointer-events-auto');
    }

    // 關卡進行中、而且已經修過至少一個破洞，才算有進度
    function hasRepairProgress() {
      if (state.status !== 'playing' && state.status !== 'animating') return false;
      return Object.keys(state.hotspotStates).some((id) => state.hotspotStates[id].tier !== 'broken');
    }

    dom.btnContinueLatest.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      startLevel(saveData.unlockedLevel);
    });

    dom.btnOpenMap.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      showMapOverlay();
    });

    dom.btnEndMap.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      showMapOverlay();
    });

    dom.btnQuickRestart.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      const lvlId = state.currentLevel.id;
      if (hasRepairProgress()) {
        // 防手滑：已經修過破洞再按「重來」要先確認
        openConfirm({
          title: '要重玩本關嗎？',
          desc: '目前的修補進度與材料點數會全部清掉，從頭開始。',
          okText: '確定重來',
          onOk: () => startLevel(lvlId)
        });
      } else {
        startLevel(lvlId);
      }
    });

    dom.btnSound.addEventListener('click', () => {
      sound.init();
      const isOn = sound.toggle();
      dom.btnSound.textContent = isOn ? '🔊' : '🔇';
    });

    dom.btnDevUnlock.addEventListener('click', () => {
      sound.init();
      sound.playVictory();
      saveData.unlockedLevel = LEVELS.length;
      writeSaveData();
      renderLevelMap();
    });

    dom.btnResetSave.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      openConfirm({
        title: '確定要清除所有關卡進度？',
        desc: '所有星級評價與已解鎖地圖將重置回第 1 關。',
        okText: '確定重置',
        onOk: () => {
          saveData = { unlockedLevel: 1, stars: {} };
          writeSaveData();
          renderLevelMap();
        }
      });
    });

    dom.btnCancelReset.addEventListener('click', () => {
      sound.playClick();
      closeConfirm();
    });

    dom.btnConfirmReset.addEventListener('click', () => {
      sound.playClick();
      const fn = pendingConfirm;
      closeConfirm();
      if (fn) fn();
    });

    window.onload = () => {
      loadSaveData();
      resizeCanvas();
      initSnowParticles();
      initLevel(state, LEVELS[0], Math.random);
      renderCanvasFrame();
      showMapOverlay();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
