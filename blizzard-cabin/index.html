    };

    const ctx = dom.canvas.getContext('2d');
    let canvasW = 420;
    let canvasH = 440;
    let toastTimeout = null;

    /**
     * ============================================================================
     * 6. 20 關地圖渲染
     * ============================================================================
     */
    function renderLevelMap() {
      dom.totalStarsDisplay.textContent = `⭐ ${getTotalStars()} / ${LEVELS.length * 3}`;
      dom.mapListContainer.innerHTML = '';

      CHAPTERS.forEach((chap) => {
        const chapLevels = LEVELS.filter((l) => l.chapter === chap.id);
        const section = document.createElement('div');
        section.className = 'space-y-2.5';

        const colorMap = {
          emerald: 'text-emerald-300 border-emerald-500/40 bg-emerald-950/60',
          sky: 'text-sky-300 border-sky-500/40 bg-sky-950/60',
          amber: 'text-amber-300 border-amber-500/40 bg-amber-950/60',
          rose: 'text-rose-300 border-rose-500/40 bg-rose-950/60'
        };

        section.innerHTML = `
          <div class="flex items-center justify-between px-3 py-1.5 rounded-xl border ${colorMap[chap.color]}">
            <span class="text-xs font-black tracking-wide">${chap.name}</span>
            <span class="text-[10px] font-bold opacity-90">${chap.badge}</span>
          </div>
          <div class="px-1 text-[10px] font-bold text-slate-300 leading-snug">📌 ${chap.rule.text}</div>
          <div class="grid grid-cols-1 gap-2" id="chap-grid-${chap.id}"></div>
        `;
        dom.mapListContainer.appendChild(section);

        const grid = section.querySelector(`#chap-grid-${chap.id}`);

        chapLevels.forEach((lvl) => {
          const isUnlocked = lvl.id <= saveData.unlockedLevel;
          const earnedStars = saveData.stars[lvl.id] || 0;
          const isCurrent = lvl.id === saveData.unlockedLevel;

          const card = document.createElement('button');
          card.type = 'button';
          card.disabled = !isUnlocked;

          if (!isUnlocked) {
            card.className = 'w-full rounded-2xl p-3 bg-slate-900/60 border border-slate-800 flex items-center justify-between text-left opacity-50 cursor-not-allowed';
            card.innerHTML = `
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-base">🔒</div>
                <div>
                  <div class="text-xs font-black text-slate-400">第 ${lvl.id} 關 • ${lvl.name}</div>
                  <div class="text-[10px] text-slate-500 mt-0.5">通關上一關解鎖</div>
                </div>
              </div>
              <span class="text-[10px] font-bold text-slate-600">未解鎖</span>
            `;
          } else {
            card.className = `w-full rounded-2xl p-3 border-2 flex items-center justify-between text-left transition-transform active:scale-98 cursor-pointer ${
              isCurrent
                ? 'bg-gradient-to-r from-amber-950/85 to-slate-900 border-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.25)]'
                : 'bg-slate-900 hover:bg-slate-800 border-slate-700'
            }`;

            const starStr = [1, 2, 3].map((n) => (n <= earnedStars ? '⭐' : '☆')).join('');
            const wx = levelWeather(lvl);
            const tags = [
              `${wx.icon} ${wx.name}`,
              `初始 ${lvl.startTemp}°C`,
              `${lvl.hotspots.length} 處破損`,
              `🧰 材料 ${lvl.budget}`
            ];
            if (lvl.hotspots.some((h) => h.iced)) tags.push('結冰');
            const ruleType = chapterRule(lvl).type;
            if (ruleType === 'expand') tags.push('破洞擴大');
            if (ruleType === 'shortage') tags.push('缺料');

            card.innerHTML = `
              <div class="flex items-center gap-3 min-w-0 pr-2">
                <div class="w-10 h-10 rounded-xl ${isCurrent ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-amber-300'} font-black text-sm flex items-center justify-center shrink-0">
                  ${lvl.id}
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="text-sm font-black text-white truncate">${lvl.name}</span>
                    ${isCurrent ? '<span class="text-[9px] px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-black shrink-0">最新</span>' : ''}
                  </div>
                  <div class="text-[10px] text-slate-300 line-clamp-1 mt-0.5">${lvl.desc}</div>
                  <div class="flex flex-wrap gap-1 mt-1">
                    ${tags.map((t) => `<span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-amber-200 border border-slate-700">${t}</span>`).join('')}
                  </div>
                </div>
              </div>
              <div class="flex flex-col items-end shrink-0">
                <div class="text-xs tracking-tighter">${starStr}</div>
                <span class="mt-1 px-2.5 py-1 rounded-lg text-[10px] font-black ${isCurrent ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-white'}">
                  ${earnedStars > 0 ? '重玩' : '開始'}
                </span>
              </div>
            `;

            card.addEventListener('click', () => {
              sound.init();
              sound.playClick();
              startLevel(lvl.id);
            });
          }

          grid.appendChild(card);
        });
      });
    }

    function showMapOverlay() {
      state.status = 'map';
      dom.endOverlay.classList.add('hidden', 'pointer-events-none');
      renderLevelMap();
      dom.mapOverlay.classList.remove('hidden', 'pointer-events-none');
      dom.mapOverlay.classList.add('pointer-events-auto');
      sound.setWindIntensity(0.02, false);
    }

    /**
     * ============================================================================
     * 7. 關卡初始化與熱量/豪宅改造度計算
     * ============================================================================
     */
    // 本關開場公告：天氣、章節規則、新機制提示
    function ruleLineOf(g) {
      const r = g.rule || { type: 'none' };
      if (r.type === 'shortage') {
        return g.shortageCat ? `缺料：本關「${CATEGORIES[g.shortageCat]}」缺貨，標示缺貨的卡不能用。` : r.text;
      }
      if (r.type === 'none') return '';
      return r.text;
    }

    function renderInfoRow() {
      const lvl = state.currentLevel;
      const wx = levelWeather(lvl);
      dom.weatherChip.textContent = `${wx.icon} ${weatherText(lvl)}`;
      const rl = ruleLineOf(state);
      if (rl) {
        dom.ruleChip.textContent = `📌 ${rl}`;
        dom.ruleChip.classList.remove('hidden');
      } else {
        dom.ruleChip.classList.add('hidden');
      }
    }

    function announceLevel(lvl) {
      const wx = levelWeather(lvl);
      const parts = [weatherText(lvl)];
      const rl = ruleLineOf(state);
      if (rl) parts.push(rl);
      if (lvl.hint) parts.push(`💡 ${lvl.hint}`);
      showToast('info', `${wx.icon} 本關天氣：${wx.name}（材料 ${lvl.budget} 點）`, parts.join('　'), 7000);
    }

    function startLevel(levelId) {
      const lvl = LEVELS.find((l) => l.id === levelId) || LEVELS[0];
      state.currentLevel = lvl;
      state.status = 'playing';
      initLevel(state, lvl, Math.random); // 核心規則：溫度、點數、天氣、各破洞狀態都在這裡重置
      state.warnedBudget = false;

      state.flyingTool = null;
      state.fxParticles = [];
      state.floatingTexts = [];

      state.selectedId = lvl.hotspots[0].id;

      dom.hudLevelBadge.textContent = `第 ${lvl.id} 關`;
      dom.hudLevelName.textContent = lvl.name;

      dom.mapOverlay.classList.add('hidden', 'pointer-events-none');
      dom.mapOverlay.classList.remove('pointer-events-auto');
      dom.endOverlay.classList.add('hidden', 'pointer-events-none');
      dom.endOverlay.classList.remove('pointer-events-auto');
      hideToast();

      resizeCanvas();
      initSnowParticles();

      const targetPct = Math.min(95, Math.max(10, (lvl.targetTemp / state.maxTemp) * 100));
      dom.targetTempMarker.style.left = `${targetPct}%`;
      dom.targetTempText.textContent = `目標 ${lvl.targetTemp.toFixed(0)}°C`;

      setBubble('好冷！先看天氣與卡片標籤，再選最合適的材料！', 'cold');
      sound.setWindIntensity(0.05, false);

      renderInfoRow();
      renderDecisionPanel();
      updateHUD();
      renderCanvasFrame();
      announceLevel(lvl);
    }

    // 豪華改造度與星等 (計算在核心規則 calcProgress)
    function getLuxuryProgress() {
      return calcProgress(state);
    }

    // 即時溫度變化速度 (核心規則 tempRate)
    function computeTempDeltaPerSec() {
      return tempRate(state);
    }

    /**
     * ============================================================================
     * 8. HUD 與底部「道具三選一」面板渲染
     * ============================================================================
     */
    function updateHUD() {
      const clampedTemp = Math.max(0, Math.min(state.maxTemp, state.temp));
      dom.tempValue.textContent = `${clampedTemp.toFixed(1)}°C`;

      const rate = computeTempDeltaPerSec();
      if (rate >= 0.35) {
        dom.leakBadge.textContent = '🔥 溫暖升溫中';
        dom.leakBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-emerald-950 text-emerald-300 border border-emerald-400';
      } else if (rate >= -0.25) {
        dom.leakBadge.textContent = '🌤️ 溫度漸穩';
        dom.leakBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-amber-950 text-amber-300 border border-amber-400';
      } else if (rate > -1.2) {
        dom.leakBadge.textContent = '❄️ 冷風滲入中';
        dom.leakBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-orange-950 text-orange-300 border border-orange-500';
      } else {
        dom.leakBadge.textContent = '🚨 寒流狂灌！';
        dom.leakBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-red-950 text-red-300 border border-red-500 animate-pulse';
      }

      const pct = (clampedTemp / state.maxTemp) * 100;
      dom.tempBar.style.width = `${pct}%`;

      if (clampedTemp < 5.0 && state.status === 'playing') {
        dom.frostLayer.style.opacity = String(Math.min(1, (5.0 - clampedTemp) / 3.8));
      } else {
        dom.frostLayer.style.opacity = '0';
      }

      if (clampedTemp <= 5.5) {
        dom.tempEmoji.textContent = '🥶';
        dom.tempValue.className = 'text-sm font-black text-red-400 tabular-nums animate-pulse';
        dom.tempBar.className = 'h-full rounded-full transition-all duration-100 bg-gradient-to-r from-red-600 to-rose-400';
      } else if (clampedTemp < state.currentLevel.targetTemp * 0.72) {
        dom.tempEmoji.textContent = '😨';
        dom.tempValue.className = 'text-sm font-black text-cyan-300 tabular-nums';
        dom.tempBar.className = 'h-full rounded-full transition-all duration-100 bg-gradient-to-r from-cyan-500 to-sky-300';
      } else if (clampedTemp < state.currentLevel.targetTemp) {
        dom.tempEmoji.textContent = '😊';
        dom.tempValue.className = 'text-sm font-black text-amber-300 tabular-nums';
        dom.tempBar.className = 'h-full rounded-full transition-all duration-100 bg-gradient-to-r from-amber-500 to-yellow-300';
      } else {
        dom.tempEmoji.textContent = '🥰';
        dom.tempValue.className = 'text-sm font-black text-emerald-300 tabular-nums';
        dom.tempBar.className = 'h-full rounded-full transition-all duration-100 bg-gradient-to-r from-emerald-500 to-lime-300';
      }

      // 材料點數
      dom.budgetChip.textContent = `🧰 材料 ${state.budget} / ${state.currentLevel.budget}`;
      dom.budgetChip.className = `shrink-0 px-2 py-0.5 rounded-md text-[10px] font-black tabular-nums border ${
        state.budget <= 0
          ? 'bg-red-950 text-red-300 border-red-500'
          : state.budget <= 3
          ? 'bg-orange-950 text-orange-300 border-orange-500'
          : 'bg-amber-950 text-amber-200 border-amber-500/70'
      }`;

      // 豪華改造度更新
      const lux = getLuxuryProgress();
      dom.luxuryBar.style.width = `${lux.pct}%`;
      dom.repairCountText.textContent = `${lux.repairedCount} / ${lux.total} 處`;
      dom.luxuryStarsPreview.textContent = [1, 2, 3].map((n) => (n <= lux.stars ? '⭐' : '☆')).join('');

      // 狂風預警條
      const hudWeather = levelWeather(state.currentLevel);
      if (hudWeather.id !== 'gale') {
        dom.galeHud.className = 'flex-1 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1 flex items-center justify-between gap-1 min-w-0';
        dom.galeIcon.textContent = hudWeather.icon;
        dom.galeLabel.textContent = `本關天氣：${hudWeather.name}`;
        dom.galeLabel.className = 'text-[10px] font-black text-slate-300 truncate';
        dom.galeTimer.textContent = '無狂風';
      } else if (state.galePhase === 'calm') {
        dom.galeHud.className = 'flex-1 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1 flex items-center justify-between gap-1 min-w-0';
        dom.galeIcon.textContent = '🌨️';
        dom.galeLabel.textContent = '下波狂風';
        dom.galeLabel.className = 'text-[10px] font-black text-cyan-200 truncate';
        dom.galeTimer.textContent = `${Math.ceil(state.galeTimer)}s`;
      } else if (state.galePhase === 'warning') {
        dom.galeHud.className = 'flex-1 bg-amber-950/90 border border-amber-400 rounded-xl px-2 py-1 flex items-center justify-between gap-1 min-w-0 animate-pulse';
        dom.galeIcon.textContent = '⚠️';
        dom.galeLabel.textContent = '狂風要吹飛不抗風的修補！';
        dom.galeLabel.className = 'text-[10px] font-black text-amber-200 truncate';
        dom.galeTimer.textContent = `${state.galeTimer.toFixed(1)}s`;
      } else {
        dom.galeHud.className = 'flex-1 bg-red-950/95 border border-red-400 rounded-xl px-2 py-1 flex items-center justify-between gap-1 min-w-0 animate-pulse';
        dom.galeIcon.textContent = '🌪️';
        dom.galeLabel.textContent = '狂風猛襲中！';
        dom.galeLabel.className = 'text-[10px] font-black text-red-200 truncate';
        dom.galeTimer.textContent = `${state.galeTimer.toFixed(1)}s`;
      }
    }

    function selectHotspot(hotspotId) {
      if (state.status !== 'playing') return;
      sound.init();
      sound.playClick();
      state.selectedId = hotspotId;

      const def = HOTSPOT_LIBRARY[hotspotId];
      if (def) {
        addFloatingText(def.pos.x * canvasW, def.pos.y * canvasH - 18, `👆 ${def.name}`, '#fde047');
      }
      renderDecisionPanel();
    }

    function renderDecisionPanel() {
      const hotspots = state.currentLevel.hotspots;

      // 1. 頂部快捷破損目標分頁
      dom.hotspotTabs.innerHTML = '';
      hotspots.forEach((hSpec) => {
        const def = HOTSPOT_LIBRARY[hSpec.id];
        const st = state.hotspotStates[hSpec.id];
        if (!def || !st) return;

        const isSelected = state.selectedId === hSpec.id;
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.addEventListener('click', () => selectHotspot(hSpec.id));

        let statusIcon = st.iced ? '🧊' : '❗';
        if (st.tier === 'luxury') statusIcon = '👑';
        else if (st.tier === 'makeshift') statusIcon = '🩹';

        tab.className = `shrink-0 px-2 py-1 rounded-lg text-[10px] font-black border transition-all cursor-pointer flex items-center gap-1 ${
          isSelected
            ? 'bg-amber-400 text-slate-950 border-yellow-100 shadow-md scale-105'
            : st.tier === 'luxury'
            ? 'bg-emerald-950/80 text-emerald-300 border-emerald-600/70'
            : st.tier === 'makeshift'
            ? 'bg-sky-950/80 text-sky-200 border-sky-500/70'
            : 'bg-slate-800 text-slate-200 border-slate-600 hover:border-amber-400'
        }`;
        tab.innerHTML = `<span>${statusIcon}</span><span>${def.name}</span>`;
        dom.hotspotTabs.appendChild(tab);
      });

      // 2. 當前選中破損描述
      const curId = state.selectedId;
      const curDef = HOTSPOT_LIBRARY[curId];
      const curState = state.hotspotStates[curId];
      if (!curDef || !curState) return;

      if (curState.iced) {
        dom.selectedHotspotDesc.textContent = curDef.icedDesc;
        dom.selectedHotspotLeak.textContent = '🧊 需先除冰';
        dom.selectedHotspotLeak.className = 'text-[10px] font-black px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-200 border border-cyan-400 shrink-0 animate-pulse';
      } else if (curState.tier === 'luxury') {
        dom.selectedHotspotDesc.textContent = curDef.luxuryDesc;
        dom.selectedHotspotLeak.textContent = '👑 豪宅級完成';
        dom.selectedHotspotLeak.className = 'text-[10px] font-black px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-500 shrink-0';
      } else if (curState.tier === 'makeshift') {
        dom.selectedHotspotDesc.textContent = curDef.makeshiftDesc;
        dom.selectedHotspotLeak.textContent = '🩹 可升級豪華版';
        dom.selectedHotspotLeak.className = 'text-[10px] font-black px-1.5 py-0.5 rounded bg-sky-950 text-sky-200 border border-sky-400 shrink-0';
      } else {
        dom.selectedHotspotDesc.textContent = curDef.brokenDesc;
        const snowIcons = '❄️'.repeat(curDef.coldLevel || 1);
        dom.selectedHotspotLeak.textContent = `${snowIcons} 漏風中`;
        dom.selectedHotspotLeak.className = 'text-[10px] font-black px-1.5 py-0.5 rounded bg-red-950 text-red-300 border border-red-500/70 shrink-0';
      }

      // 3. 道具卡片：每個破洞第一次打開時抽 3 張，之後維持同一組 (避免重開刷牌)
      const stage1 = Boolean(curState.iced);
      const hand = ensureHand(state, curId);
      dom.cardsContainer.innerHTML = '';
      hand.forEach((opt) => dom.cardsContainer.appendChild(buildToolCard(opt, curId, curState, stage1)));
      renderFallbackButton(curId, curState, stage1);
    }

    const BLOCK_TEXT = { budget: '材料不足', oos: '缺貨', maxed: '已豪華改造', used: '已使用' };
    const TRAIT_CHIP_CLASS = {
      windproof: 'bg-sky-200 text-sky-900',
      galefear: 'bg-rose-200 text-rose-900',
      warm: 'bg-orange-200 text-orange-900',
      damp: 'bg-slate-300 text-slate-800',
      dry: 'bg-emerald-200 text-emerald-900'
    };
    const CHIP_WARN = 'bg-red-600 text-white';

    function fmtSigned(v) {
      return `${v >= 0 ? '+' : ''}${v.toFixed(1)}`;
    }

    // 組一張道具卡：標籤、當前天氣下的實際數值 (有變動就標色)、成本、不可選原因
    function buildToolCard(opt, hsId, st, stage1) {
      const eff = effOf(state, hsId, opt, stage1);
      const reason = state.status !== 'playing' ? 'busy' : blockReason(state, hsId, opt);
      const card = document.createElement('button');
      card.type = 'button';
      card.disabled = Boolean(reason);
      card.className = 'tool-card rounded-2xl px-1 pt-1.5 pb-1 flex flex-col items-center justify-start text-center cursor-pointer';
      card.title = opt.say || '';

      // 標籤
      const chips = [];
      if (opt.tier === 'trap') {
        chips.push([CHIP_WARN, opt.tag || '陷阱']);
      } else {
        (opt.traits || []).forEach((t) => {
          let cls = TRAIT_CHIP_CLASS[t] || 'bg-amber-200 text-amber-900';
          if (t === 'damp' && eff.dampHit) cls = CHIP_WARN;
          if (t === 'galefear' && eff.blown) cls = CHIP_WARN;
          chips.push([cls, TRAIT_INFO[t] ? TRAIT_INFO[t].label : t]);
        });
        if (eff.blown && !hasTrait(opt, 'galefear')) chips.push([CHIP_WARN, '會被吹掉']);
        if (stage1 && !hasTrait(opt, 'dry')) chips.push(['bg-amber-300 text-amber-950', '留潮氣']);
        if (opt.cost <= 1 && opt.cost > 0 && chips.length < 3) chips.push(['bg-lime-200 text-lime-900', '便宜']);
      }
      const chipHtml = chips
        .map(([cls, txt]) => `<span class="px-1 rounded-full text-[9px] font-black leading-4 ${cls}">${txt}</span>`)
        .join('');

      // 實際效果數值
      let stats;
      if (opt.tier === 'trap') {
        stats = `<span class="text-red-700">${fmtSigned(opt.delta)}°C・失誤</span>`;
      } else if (stage1) {
        stats = `<span class="text-slate-900">${fmtSigned(eff.delta)}°C</span>`;
      } else {
        const dCls = eff.dampHit ? 'text-red-700' : 'text-slate-900';
        const arrow = eff.dampHit ? '▼' : '';
        stats = `<span class="${dCls}">${arrow}${fmtSigned(eff.delta)}°C</span> <span class="${eff.dampHit ? 'text-red-700' : 'text-slate-700'}">封${Math.round(eff.seal * 100)}%</span>`;
        if (eff.heat > 0) {
          const hCls = eff.warmUp ? 'text-emerald-700' : eff.dampHit ? 'text-red-700' : 'text-slate-700';
          stats += `<br><span class="${hCls}">${eff.warmUp ? '▲' : eff.dampHit ? '▼' : ''}暖 +${eff.heat.toFixed(2)}/s</span>`;
        }
      }

      const costText = opt.cost > 0 ? `🧰${opt.cost}` : '免費';
      const maxed = !stage1 && st.rank >= 2;
      const icon = maxed && opt.tier === 'luxury' ? '👑' : opt.icon;
      const reasonLine = BLOCK_TEXT[reason]
        ? `<div class="text-[10px] font-black text-red-700 leading-tight mt-0.5 pointer-events-none">${BLOCK_TEXT[reason]}</div>`
        : '';

      card.innerHTML = `
        <div class="absolute top-0.5 right-0.5 text-[9px] font-black px-1 rounded bg-amber-900 text-amber-100 pointer-events-none">${costText}</div>
        <div class="w-10 h-10 rounded-xl bg-amber-100 border-2 border-amber-400 flex items-center justify-center text-2xl shadow-inner mb-0.5 pointer-events-none">${icon}</div>
        <div class="text-[11px] font-black text-slate-900 leading-tight line-clamp-2 pointer-events-none">${opt.name}</div>
        <div class="flex flex-wrap justify-center gap-0.5 mt-0.5 pointer-events-none">${chipHtml}</div>
        <div class="text-[9.5px] font-black leading-tight mt-0.5 pointer-events-none">${stats}</div>
        ${reasonLine}
      `;

      card.addEventListener('click', (e) => handleChoiceClick(opt, e.currentTarget));
      return card;
    }

    // 免費保底：點數用完時的出路 (效果很小，但能撐住不卡死)
    function renderFallbackButton(hsId, st, stage1) {
      const box = dom.fallbackContainer;
      box.innerHTML = '';
      if (!stage1 && st.rank >= 0) return;
      const it = stage1 ? FALLBACK_DEICE : FALLBACK_REPAIR;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.disabled = state.status !== 'playing';
      btn.className = 'w-full rounded-xl border border-dashed border-slate-500 bg-slate-900 text-slate-200 text-[10px] font-black py-1 cursor-pointer disabled:opacity-40';
      btn.textContent = stage1
        ? '🧤 徒手摳冰：免費保底（只能鬆動冰面）'
        : '🧤 就地取材：免費保底（效果很小，點數用完時的出路）';
      btn.addEventListener('click', (e) => handleChoiceClick(it, e.currentTarget));
      box.appendChild(btn);
    }

    /**
     * ============================================================================
     * 9. 道具飛向破洞與結果結算 (雙結局 / 兩階段除冰 / 狂風吹飛)
     * ============================================================================
     */
    function handleChoiceClick(option, cardEl) {
      if (state.status !== 'playing') return;

      sound.init();
      sound.playClick();

      const hotspotId = state.selectedId;
      const def = HOTSPOT_LIBRARY[hotspotId];

      // 點數不足 / 缺貨 / 已使用：不能選
      const why = blockReason(state, hotspotId, option);
      if (why) {
        showToast('error', BLOCK_TEXT[why] || '這張卡現在不能用', why === 'budget' ? '材料點數不夠，改選便宜的卡，或用免費的「就地取材」。' : '換一張卡試試。');
        return;
      }

      state.status = 'animating';
      renderDecisionPanel();

      const cardRect = cardEl.getBoundingClientRect();
      const canvasRect = dom.canvas.getBoundingClientRect();
      const startX = cardRect.left + cardRect.width / 2 - canvasRect.left;
      const startY = cardRect.top + cardRect.height / 2 - canvasRect.top;
      const targetX = def.pos.x * canvasW;
      const targetY = def.pos.y * canvasH;

      state.flyingTool = {
        icon: option.icon,
        startX,
        startY,
        targetX,
        targetY,
        progress: 0,
        hotspotId,
        option
      };
    }

    function resolveChoiceImpact(hotspotId, option) {
      const def = HOTSPOT_LIBRARY[hotspotId];
      const tx = def.pos.x * canvasW;
      const ty = def.pos.y * canvasH;

      // 核心規則：扣點數、改溫度、改破洞狀態
      const res = applyChoice(state, hotspotId, option);
      if (!res.ok) {
        state.status = 'playing';
        renderDecisionPanel();
        return;
      }
      const dStr = `${fmtSigned(res.delta)}°C`;

      // 情況 A：選中陷阱！
      if (res.kind === 'trap') {
        sound.playFail();
        triggerScreenShake();
        triggerScreenFlash('bg-cyan-400/45');
        showToast('error', `${option.icon} ${option.fail}`, `室溫 ${dStr}，失誤 +1`);
        setBubble(option.say || '糟糕！選錯工具啦！', 'pain');
        addFloatingText(tx, ty - 18, dStr, '#f87171');
        spawnFxParticles(tx, ty, option.fx || 'ice_blast');
      }
      // 情況 B：結冰第一階段 -> 除冰成功
      else if (res.kind === 'deice') {
        const dry = hasTrait(option, 'dry');
        if (option.tier === 'luxury') {
          sound.playLuxurySuccess();
          triggerScreenFlash('bg-amber-300/30');
        } else {
          sound.playMakeshiftSuccess();
          triggerScreenFlash('bg-sky-300/25');
        }
        showToast('info', `${option.icon} 「${option.name}」除冰完成！`,
          `${option.say}${dry ? '' : '（破洞濕濕的，怕潮的材料會打折）'}`);
        setBubble(option.say || '冰塊清除了！快繼續把這裡修好！', 'happy');
        addFloatingText(tx, ty - 18, `🧊 除冰完成 ${dStr}`, '#38bdf8');
        spawnFxParticles(tx, ty, 'sparkles');
      }
      // 情況 C / D：修補 (湊合或豪華)
      else {
        const isLux = option.tier === 'luxury';
        if (isLux) {
          sound.playLuxurySuccess();
          triggerScreenFlash('bg-amber-300/35');
        } else {
          sound.playMakeshiftSuccess();
          triggerScreenFlash('bg-sky-400/25');
        }
        const notes = [];
        if (res.eff.dampHit) notes.push('受潮打折');
        if (res.eff.warmUp) notes.push('酷寒加倍保暖');
        if (res.eff.blown) notes.push('狂風來時會被吹掉');
        showToast(isLux ? 'success' : 'info', `${option.icon} 「${option.name}」${isLux ? '豪華完工！' : '補上了！'}`,
          `${option.say}（${dStr}${notes.length ? '，' + notes.join('、') : ''}）`);
        setBubble(option.say || (isLux ? '太豪華了！屋子變得又暖又漂亮！' : '勉強補上了！'), isLux ? 'happy' : 'cold');
        addFloatingText(tx, ty - 18, `${isLux ? '👑 ' : ''}${dStr}`, isLux ? '#fde047' : '#7dd3fc');
        spawnFxParticles(tx, ty, 'sparkles');
        autoSelectNextBroken();
      }

      // 依據剩餘破損調整風聲大小
      const openCount = state.currentLevel.hotspots.filter((h) => state.hotspotStates[h.id].tier === 'broken').length;
      sound.setWindIntensity(Math.max(0.008, 0.015 + openCount * 0.012), state.galePhase === 'gale');

      // 點數用完仍有破洞：提醒玩家還有免費保底
      if (state.budget <= 0 && openCount > 0 && !state.warnedBudget && res.kind !== 'trap') {
        state.warnedBudget = true;
        setTimeout(() => {
          if (state.status === 'playing') showToast('info', '🧰 材料點數用完了！', '剩下的破洞可以用免費的「就地取材」先頂著，溫度才撐得住。', 4200);
        }, 700);
      }

      updateHUD();

      setTimeout(() => {
        const verdict = endCheck(state);
        if (verdict === 'lose') {
          finishLevel(false);
          return;
        }
        if (verdict === 'win') {
          finishLevel(true);
          return;
        }
        state.status = 'playing';
        renderDecisionPanel();
      }, 620);
    }

    // 自動將遊標移往下一個尚未豪華升級的破洞，流暢度滿分！
    function autoSelectNextBroken() {
      const brokenNext = state.currentLevel.hotspots.find(
        (h) => state.hotspotStates[h.id].tier === 'broken' || state.hotspotStates[h.id].iced
      );
      if (brokenNext) {
        state.selectedId = brokenNext.id;
        return;
      }
      const makeshiftNext = state.currentLevel.hotspots.find((h) => state.hotspotStates[h.id].tier === 'makeshift');
      if (makeshiftNext) {
        state.selectedId = makeshiftNext.id;
      }
    }

    function showToast(type, title, desc, duration) {
      if (toastTimeout) clearTimeout(toastTimeout);
      dom.feedbackTitle.textContent = title;
      dom.feedbackDesc.textContent = desc;

      if (type === 'success') {
        dom.feedbackToastInner.className = 'px-3.5 py-2 rounded-2xl border-2 text-center shadow-2xl backdrop-blur-md pointer-events-none bg-emerald-950/92 border-emerald-400 text-emerald-100';
      } else if (type === 'info') {
        dom.feedbackToastInner.className = 'px-3.5 py-2 rounded-2xl border-2 text-center shadow-2xl backdrop-blur-md pointer-events-none bg-sky-950/92 border-sky-400 text-sky-100';
      } else {
        dom.feedbackToastInner.className = 'px-3.5 py-2 rounded-2xl border-2 text-center shadow-2xl backdrop-blur-md pointer-events-none bg-red-950/92 border-red-400 text-red-100';
      }

      dom.feedbackToast.classList.remove('opacity-0', '-translate-y-2');
      dom.feedbackToast.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(hideToast, duration || 2600);
    }

    function hideToast() {
      dom.feedbackToast.classList.add('opacity-0', '-translate-y-2');
      dom.feedbackToast.classList.remove('opacity-100', 'translate-y-0');
    }

    function triggerScreenFlash(colorClass) {
      dom.flashLayer.className = `absolute inset-0 z-10 pointer-events-none flash-anim ${colorClass}`;
      setTimeout(() => {
        dom.flashLayer.className = 'hidden pointer-events-none';
      }, 550);
    }

    function triggerScreenShake() {
      dom.shell.classList.remove('shake');
      void dom.shell.offsetWidth;
      dom.shell.classList.add('shake');
    }

    function setBubble(text, mood) {
      state.bubble.text = text;
      state.bubble.mood = mood;
    }

    function addFloatingText(x, y, text, color) {
      state.floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1.3 });
    }

    function spawnFxParticles(x, y, type) {
      for (let i = 0; i < 22; i++) {
        const angle = (Math.PI * 2 * i) / 22 + (Math.random() - 0.5) * 0.4;
        const speed = 1.6 + Math.random() * 4.0;
        let color = '#fde047';
        let char = null;

        if (type === 'sparkles') {
          color = i % 2 === 0 ? '#fde047' : '#34d399';
          char = i % 3 === 0 ? '✨' : null;
        } else if (type === 'snow_dump' || type === 'ice_blast') {
          color = '#bae6fd';
          char = i % 3 === 0 ? '❄️' : null;
        } else if (type === 'paper_fly') {
          color = '#e2e8f0';
          char = i % 3 === 0 ? '📄' : null;
        } else if (type === 'poison_cloud') {
          color = '#86efac';
          char = i % 3 === 0 ? '🌫️' : null;
        } else {
          color = '#fca5a5';
          char = i % 3 === 0 ? '💥' : null;
        }

        state.fxParticles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.1,
          size: 4 + Math.random() * 4,
          color, char, life: 1.0
        });
      }
    }

    /**
     * ============================================================================
     * 10. 雙結局結算 (1星勉強遮風屋 / 2星溫馨木屋 / 3星夢幻豪華別墅)
     * ============================================================================
     */
    function finishLevel(isVictory) {
      if (state.status === 'victory' || state.status === 'gameover') return;
      state.status = isVictory ? 'victory' : 'gameover';
      dom.frostLayer.style.opacity = '0';
      updateHUD();

      const lvl = state.currentLevel;
      const lux = getLuxuryProgress();

      if (isVictory) {
        sound.playVictory();
        const prevStars = saveData.stars[lvl.id] || 0;
        saveData.stars[lvl.id] = Math.max(prevStars, lux.stars);
        if (lvl.id < LEVELS.length && saveData.unlockedLevel <= lvl.id) {
          saveData.unlockedLevel = lvl.id + 1;
        }
        writeSaveData();

        dom.endStarsRow.textContent = [1, 2, 3].map((n) => (n <= lux.stars ? '⭐' : '☆')).join('');

        if (lux.stars === 3) {
          dom.endBadge.textContent = `👑 第 ${lvl.id} 關 夢幻豪宅完美結局！`;
          dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-amber-950 border-amber-400 text-amber-300';
          dom.endEmoji.textContent = '🏰';
          dom.endTitle.textContent = '破屋奇蹟蛻變為夢幻豪華別墅！';
          dom.endSubtitle.textContent = `在有限的材料點數下把全屋改造得又豪華又暖（豪華度 ${lux.pct}%，剩餘 ${state.budget} 點），母子三人換上新衣享用大餐！`;
        } else if (lux.stars === 2) {
          dom.endBadge.textContent = `🏡 第 ${lvl.id} 關 溫馨小木屋結局`;
          dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-emerald-950 border-emerald-400 text-emerald-300';
          dom.endEmoji.textContent = '🏡';
          dom.endTitle.textContent = '成功打造溫暖避風港！';
          dom.endSubtitle.textContent = `屋內暖呼呼的！剩餘 ${state.budget} 點。若點數允許，把湊合材料升級成豪華材料並少選錯，就能拿 3 星！`;
        } else {
          dom.endBadge.textContent = `🩹 第 ${lvl.id} 關 勉強遮風避雨結局`;
          dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-sky-950 border-sky-400 text-sky-300';
          dom.endEmoji.textContent = '🏚️';
          dom.endTitle.textContent = '勉強撐過暴風雪之夜…';
          dom.endSubtitle.textContent = `雖然保住了性命，但屋子只是勉強補上。重玩一次，看天氣挑對材料、多補幾個破洞衝擊更高星等吧！`;
        }

        dom.statFinalTemp.textContent = `${state.temp.toFixed(1)}°C`;
        dom.statFinalTemp.className = 'text-sm font-black text-emerald-400 mt-0.5';

        if (lvl.id < LEVELS.length) {
          dom.btnEndNext.textContent = `➡️ 挑戰第 ${lvl.id + 1} 關`;
          dom.btnEndNext.onclick = () => {
            sound.playClick();
            startLevel(lvl.id + 1);
          };
        } else {
          dom.btnEndNext.textContent = '🔄 重玩最終關';
          dom.btnEndNext.onclick = () => {
            sound.playClick();
            startLevel(lvl.id);
          };
        }
      } else {
        sound.playGameOver();
        dom.endBadge.textContent = `💀 第 ${lvl.id} 關 救援失敗`;
        dom.endBadge.className = 'px-4 py-1 rounded-full text-xs font-black tracking-widest mb-2 border bg-red-950 border-red-400 text-red-300';
        dom.endStarsRow.textContent = '☆☆☆';
        dom.endEmoji.textContent = '🥶';
        dom.endTitle.textContent = '室內降至 0°C，母子被暴雪凍僵！';
        dom.endSubtitle.textContent = state.budget <= 0
          ? '材料點數用完了！下次挑便宜又合天氣的卡，別把點數花在陷阱與會被吹掉的材料上。'
          : '提示：先補「❄️❄️❄️」最大的漏風口，再靠保暖材料與壁爐升溫；留意天氣標籤！';
        dom.statFinalTemp.textContent = '0.0°C';
        dom.statFinalTemp.className = 'text-sm font-black text-cyan-400 mt-0.5';

        dom.btnEndNext.textContent = '🔄 重新挑戰本關';
        dom.btnEndNext.onclick = () => {
          sound.playClick();
          startLevel(lvl.id);
        };
      }

      dom.statLuxuryPct.textContent = `${lux.pct}%`;
      dom.statMistakes.textContent = `${state.mistakes} 次`;
      dom.endOverlay.classList.remove('hidden', 'pointer-events-none');
      dom.endOverlay.classList.add('pointer-events-auto');
    }

    /**
     * ============================================================================
     * 11. HTML5 Canvas 2D 破屋變豪宅即時視覺繪圖引擎 + 場景直接點擊偵測
     * ============================================================================
     */
    const THEME_PALETTES = {
      cabin:      { coldTop: '#26354d', coldBot: '#3b4f6e', warmTop: '#92400e', warmBot: '#b45309', roof: '#5c2408' },
      barn:       { coldTop: '#3a3330', coldBot: '#57534e', warmTop: '#991b1b', warmBot: '#b91c1c', roof: '#571111' },
      train:      { coldTop: '#1e293b', coldBot: '#334155', warmTop: '#9a3412', warmBot: '#c2410c', roof: '#292524' },
      mansion:    { coldTop: '#293548', coldBot: '#475569', warmTop: '#92400e', warmBot: '#d97706', roof: '#4c1d95' },
      lighthouse: { coldTop: '#1e3a5f', coldBot: '#1d4ed8', warmTop: '#c2410c', warmBot: '#ea580c', roof: '#1e3a8a' },
      church:     { coldTop: '#29384e', coldBot: '#475569', warmTop: '#854d0e', warmBot: '#ca8a04', roof: '#1e1b4b' },
      glacier:    { coldTop: '#0e7490', coldBot: '#0284c7', warmTop: '#0369a1', warmBot: '#0ea5e9', roof: '#083344' },
      ship:       { coldTop: '#1e293b', coldBot: '#334155', warmTop: '#475569', warmBot: '#64748b', roof: '#0f172a' },
      station:    { coldTop: '#1e293b', coldBot: '#334155', warmTop: '#0284c7', warmBot: '#0ea5e9', roof: '#0c4a6e' },
      clocktower: { coldTop: '#2e2a6b', coldBot: '#4c1d95', warmTop: '#92400e', warmBot: '#d97706', roof: '#1e1b4b' },
      summit:     { coldTop: '#1e3a8a', coldBot: '#2563eb', warmTop: '#b45309', warmBot: '#d97706', roof: '#172554' },
      palace:     { coldTop: '#312e81', coldBot: '#4338ca', warmTop: '#6d28d9', warmBot: '#86198f', roof: '#1e1b4b' }
    };

    function drawRoundRect(x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function getHotspotState(id) {
      return state.hotspotStates[id] || { tier: 'luxury', iced: false };
    }

    function drawScene() {
      const w = Math.max(300, canvasW);
      const h = Math.max(220, canvasH);
      const pal = THEME_PALETTES[state.currentLevel.theme] || THEME_PALETTES.cabin;
      const lux = getLuxuryProgress();
      const isLuxuryRoom = lux.pct >= 55;

      // 1. 室內背景牆壁 (隨著豪華改造度從冷暗藍灰蛻變為溫暖蜂蜜金木牆)
      const wallGrad = ctx.createLinearGradient(0, 0, 0, h * 0.72);
      if (!isLuxuryRoom) {
        wallGrad.addColorStop(0, pal.coldTop);
        wallGrad.addColorStop(1, pal.coldBot);
      } else {
        wallGrad.addColorStop(0, pal.warmTop);
        wallGrad.addColorStop(1, pal.warmBot);
      }
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, w, h * 0.72);

      // 木牆水平紋理
      ctx.strokeStyle = isLuxuryRoom ? 'rgba(254, 243, 199, 0.25)' : 'rgba(148, 163, 184, 0.24)';
      ctx.lineWidth = 2;
      for (let y = 30; y < h * 0.72; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // 豪華度 >= 75% 時出現金色吊燈與節慶彩旗！
      if (lux.pct >= 75) {
        drawChandelierAndGarland(w, h);
      }

      // 2. 屋頂區域
      drawRoofVisual(w, h, pal, getHotspotState('roof'));

      // 3. 地板區域
      const floorY = h * 0.70;
      const floorSt = getHotspotState('floor');
      const floorGrad = ctx.createLinearGradient(0, floorY, 0, h);
      if (floorSt.tier === 'luxury' || isLuxuryRoom) {
        floorGrad.addColorStop(0, '#b45309');
        floorGrad.addColorStop(1, '#78350f');
      } else {
        floorGrad.addColorStop(0, '#475569');
        floorGrad.addColorStop(1, '#1e293b');
      }
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, floorY, w, h - floorY);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, floorY - 3, w, 6);

      // 地板狀態視覺：結冰 / 舊草蓆 / 豪華波斯紅絨地毯
      if (floorSt.tier === 'broken') {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.beginPath();
        ctx.ellipse(w * 0.48, h * 0.87, w * 0.35, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(224, 242, 254, 0.9)';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (floorSt.tier === 'makeshift') {
        ctx.fillStyle = '#a16207';
        drawRoundRect(w * 0.20, h * 0.81, w * 0.56, 26, 6);
        ctx.fill();
      } else if (floorSt.tier === 'luxury') {
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.ellipse(w * 0.48, h * 0.87, w * 0.38, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // 4. 窗戶區域
      drawWindowVisual(w * 0.08, h * 0.21, w * 0.23, h * 0.23, getHotspotState('window'));

      // 5. 東側牆壁破洞區域
      if (state.hotspotStates['wall']) {
        drawWallVisual(w * 0.67, h * 0.22, w * 0.25, h * 0.25, getHotspotState('wall'));
      }

      // 6. 大門區域
      if (state.hotspotStates['door']) {
        drawDoorVisual(w * 0.87, h * 0.44, w * 0.11, h * 0.26, getHotspotState('door'));
      }

      // 7. 壁爐區域
      drawFireplaceVisual(w * 0.72, h * 0.68, getHotspotState('fireplace'));

      // 8. 暖床區域
      drawBedVisual(w * 0.08, h * 0.63, w * 0.40, h * 0.22, getHotspotState('bed'));

      // 9. 母子三人角色與對話框
      drawFamilyVisual(w * 0.30, h * 0.73);

      // 10. 餐桌區域
      if (state.hotspotStates['feast']) {
        drawFeastVisual(w * 0.54, h * 0.77, getHotspotState('feast'));
      }

      // 11. 場景上所有可點擊破損的互動圓形徽章 (直接點擊提示)
      drawInteractiveHotspotPins(w, h);

      // 12. 壁爐點燃後的溫暖金光氛圍
      if (getHotspotState('fireplace').tier === 'luxury') {
        const glow = ctx.createRadialGradient(w * 0.72, h * 0.65, 12, w * 0.58, h * 0.56, w * 0.82);
        glow.addColorStop(0, 'rgba(251, 146, 60, 0.38)');
        glow.addColorStop(0.55, 'rgba(245, 158, 11, 0.15)');
        glow.addColorStop(1, 'rgba(245, 158, 11, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
      }
    }

    function drawChandelierAndGarland(w, h) {
      // 節慶彩帶
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.14);
      ctx.quadraticCurveTo(w * 0.25, h * 0.21, w * 0.5, h * 0.13);
      ctx.quadraticCurveTo(w * 0.75, h * 0.21, w, h * 0.14);
      ctx.stroke();

      // 金色吊燈
      const cx = w * 0.5;
      const cy = h * 0.18;
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(cx - 2, h * 0.08, 4, h * 0.10);
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0, Math.PI * 2);
      ctx.fill();

      const aura = ctx.createRadialGradient(cx, cy, 2, cx, cy, 65);
      aura.addColorStop(0, 'rgba(254, 240, 138, 0.65)');
      aura.addColorStop(1, 'rgba(254, 240, 138, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(cx, cy, 65, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawRoofVisual(w, h, pal, st) {
      ctx.fillStyle = pal.roof;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(w, 0);
      ctx.lineTo(w, h * 0.15);
      ctx.lineTo(w * 0.5, h * 0.05);
      ctx.lineTo(0, h * 0.15);
      ctx.closePath();
      ctx.fill();

      if (st.tier === 'broken') {
        ctx.fillStyle = '#0c4a6e';
        ctx.beginPath();
        ctx.ellipse(w * 0.50, h * 0.08, 46, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 2;
        ctx.stroke();
        drawWindStreaks(w * 0.50, h * 0.11, 0);
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#0284c7';
        drawRoundRect(w * 0.36, h * 0.04, w * 0.28, 18, 5);
        ctx.fill();
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else {
        ctx.fillStyle = '#d97706';
        drawRoundRect(w * 0.34, h * 0.035, w * 0.32, 20, 6);
        ctx.fill();
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function drawWindowVisual(x, y, w, h, st) {
      ctx.fillStyle = '#0c4a6e';
      drawRoundRect(x, y, w, h, 8);
      ctx.fill();

      if (st.tier === 'luxury') {
        ctx.fillStyle = 'rgba(254, 243, 199, 0.36)';
        drawRoundRect(x, y, w, h, 8);
        ctx.fill();

        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 5;
        drawRoundRect(x, y, w, h, 8);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + w / 2, y);
        ctx.lineTo(x + w / 2, y + h);
        ctx.moveTo(x, y + h / 2);
        ctx.lineTo(x + w, y + h / 2);
        ctx.stroke();

        // 紅絲絨窗簾
        ctx.fillStyle = '#dc2626';
        drawRoundRect(x - 6, y - 3, 14, h + 6, 4);
        ctx.fill();
        drawRoundRect(x + w - 8, y - 3, 14, h + 6, 4);
        ctx.fill();
      } else if (st.tier === 'makeshift') {
        // 舊報紙＋膠帶封窗
        ctx.fillStyle = '#cbd5e1';
        drawRoundRect(x + 3, y + 3, w - 6, h - 6, 4);
        ctx.fill();
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 6);
        ctx.lineTo(x + w - 6, y + h - 6);
        ctx.moveTo(x + w - 6, y + 6);
        ctx.lineTo(x + 6, y + h - 6);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 4;
        drawRoundRect(x, y, w, h, 6);
        ctx.stroke();

        ctx.fillStyle = 'rgba(186, 230, 253, 0.85)';
        ctx.beginPath();
        ctx.moveTo(x + 3, y + 3);
        ctx.lineTo(x + w * 0.42, y + 3);
        ctx.lineTo(x + w * 0.14, y + h * 0.35);
        ctx.closePath();
        ctx.fill();

        if (st.iced) {
          // 結冰冰柱視覺
          ctx.fillStyle = '#bae6fd';
          for (let i = 0; i < 4; i++) {
            const ix = x + 10 + i * (w * 0.22);
            ctx.beginPath();
            ctx.moveTo(ix, y);
            ctx.lineTo(ix + 10, y);
            ctx.lineTo(ix + 5, y + 24);
            ctx.closePath();
            ctx.fill();
          }
        }
        drawWindStreaks(x + w * 0.5, y + h * 0.5, -1);
      }
    }

    function drawWallVisual(x, y, w, h, st) {
      if (st.tier === 'luxury') {
        // 豪華木牆＋暖光壁燈
        ctx.fillStyle = '#d97706';
        drawRoundRect(x, y, w, h, 8);
        ctx.fill();
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, 9, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      ctx.fillStyle = '#0c4a6e';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.15, y);
      ctx.lineTo(x + w * 0.85, y + h * 0.08);
      ctx.lineTo(x + w, y + h * 0.55);
      ctx.lineTo(x + w * 0.82, y + h);
      ctx.lineTo(x + w * 0.1, y + h * 0.92);
      ctx.lineTo(x, y + h * 0.45);
      ctx.closePath();
      ctx.fill();

      if (st.tier === 'makeshift') {
        ctx.fillStyle = '#b45309';
        drawRoundRect(x + 2, y + 4, w - 4, h - 8, 5);
        ctx.fill();
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        drawWindStreaks(x + w * 0.45, y + h * 0.5, 1);
      }
    }

    function drawDoorVisual(x, y, w, h, st) {
      if (st.tier === 'luxury') {
        ctx.fillStyle = '#92400e';
        drawRoundRect(x, y, w, h, 6);
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        // 聖誕花圈
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h * 0.35, 10, 0, Math.PI * 2);
        ctx.stroke();
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#64748b';
        drawRoundRect(x, y, w, h, 4);
        ctx.fill();
      } else {
        ctx.fillStyle = '#0c4a6e';
        drawRoundRect(x, y, w, h, 4);
        ctx.fill();
        drawWindStreaks(x + w * 0.3, y + h * 0.5, 1);
      }
    }

    function drawFireplaceVisual(cx, cy, st) {
      ctx.fillStyle = st.iced ? '#38bdf8' : '#991b1b';
      ctx.fillRect(cx - 18, cy - 92, 36, 38);

      ctx.fillStyle = st.tier === 'luxury' ? '#b91c1c' : '#64748b';
      drawRoundRect(cx - 46, cy - 56, 92, 64, 10);
      ctx.fill();
      ctx.strokeStyle = st.tier === 'luxury' ? '#fbbf24' : '#cbd5e1';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      drawRoundRect(cx - 31, cy - 40, 62, 46, 8);
      ctx.fill();

      if (st.iced) {
        ctx.fillStyle = 'rgba(125, 211, 252, 0.85)';
        drawRoundRect(cx - 35, cy - 44, 70, 52, 10);
        ctx.fill();
        ctx.strokeStyle = '#f0f9ff';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (st.tier === 'luxury') {
        const flicker = Math.sin(state.time * 15) * 4.5;
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(cx - 21, cy - 5);
        ctx.quadraticCurveTo(cx - 24, cy - 32, cx + flicker, cy - 46);
        ctx.quadraticCurveTo(cx + 24, cy - 32, cx + 21, cy - 5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.moveTo(cx - 11, cy - 5);
        ctx.quadraticCurveTo(cx - 13, cy - 22, cx - flicker * 0.6, cy - 32);
        ctx.quadraticCurveTo(cx + 13, cy - 22, cx + 11, cy - 5);
        ctx.closePath();
        ctx.fill();

        ctx.font = '16px sans-serif';
        ctx.fillText('🎄', cx - 26, cy - 64);
        ctx.fillText('🧦', cx + 22, cy - 64);
      } else if (st.tier === 'makeshift') {
        // 微弱小火苗
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.arc(cx, cy - 12, 8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#78350f';
        drawRoundRect(cx - 18, cy - 12, 36, 8, 3);
        ctx.fill();
      }
    }

    function drawBedVisual(x, y, w, h, st) {
      if (st.tier === 'luxury') {
        ctx.fillStyle = '#92400e';
        drawRoundRect(x - 6, y - 14, w * 0.78, 50, 8);
        ctx.fill();

        ctx.fillStyle = '#fef3c7';
        drawRoundRect(x, y - 6, w * 0.70, 36, 10);
        ctx.fill();

        ctx.fillStyle = '#ef4444';
        drawRoundRect(x + w * 0.18, y - 6, w * 0.48, 36, 10);
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#64748b';
        drawRoundRect(x + 6, y + 14, w * 0.68, 22, 8);
        ctx.fill();
      } else {
        ctx.fillStyle = '#475569';
        drawRoundRect(x + 10, y + 18, w * 0.62, 16, 6);
        ctx.fill();
      }
    }

    function drawFeastVisual(cx, cy, st) {
      ctx.fillStyle = '#78350f';
      ctx.fillRect(cx - 5, cy + 4, 10, 22);

      if (st.tier === 'luxury') {
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 48, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🍗', cx - 14, cy - 5);
        ctx.fillText('☕', cx + 15, cy - 4);
      } else if (st.tier === 'makeshift') {
        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 38, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🥔', cx, cy - 4);
      } else {
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 34, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawFamilyVisual(baseX, baseY) {
      const isWarm = state.temp >= 17.5 || getHotspotState('fireplace').tier === 'luxury';
      const isLuxuryClothes = getHotspotState('bed').tier === 'luxury';
      const shiverAmp = isWarm ? 0 : Math.max(1.4, (18 - state.temp) * 0.24);
      const sx = Math.sin(state.time * 42) * shiverAmp;
      const sy = Math.cos(state.time * 36) * (shiverAmp * 0.4);

      ctx.save();
      ctx.translate(baseX + sx, baseY + sy);

      ctx.fillStyle = isLuxuryClothes ? '#ef4444' : '#64748b';
      ctx.beginPath();
      ctx.ellipse(0, 8, 50, 20, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      drawPerson({ x: 0, y: -25, headR: 16, hairColor: '#713f12', coatColor: isLuxuryClothes ? '#f59e0b' : '#64748b', isWarm });
      drawPerson({ x: -27, y: -11, headR: 12.5, hairColor: '#92400e', coatColor: isLuxuryClothes ? '#ec4899' : '#94a3b8', isWarm });
      drawPerson({ x: 27, y: -9, headR: 12, hairColor: '#451a03', coatColor: isLuxuryClothes ? '#3b82f6' : '#94a3b8', isWarm });

      ctx.restore();
      drawSpeechBubble(baseX + 16, baseY - 78, state.bubble.text, state.bubble.mood);
    }

    function drawPerson({ x, y, headR, hairColor, coatColor, isWarm }) {
      ctx.fillStyle = coatColor;
      ctx.beginPath();
      ctx.ellipse(x, y + headR + 13, headR * 1.15, headR * 1.25, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hairColor;
      ctx.beginPath();
      ctx.arc(x, y - 2, headR + 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isWarm ? '#fed7aa' : '#e2e8f0';
      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hairColor;
      ctx.beginPath();
      ctx.arc(x, y - 3, headR, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      const eyeOffset = headR * 0.36;
      ctx.beginPath();
      ctx.arc(x - eyeOffset, y + 1, 2, 0, Math.PI * 2);
      ctx.arc(x + eyeOffset, y + 1, 2, 0, Math.PI * 2);
      ctx.fill();

      if (isWarm) {
        ctx.strokeStyle = '#991b1b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y + 4, 4.2, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y + 8, 3.8, 1.15 * Math.PI, 1.85 * Math.PI);
        ctx.stroke();
      }
    }

    function drawSpeechBubble(x, y, text, mood) {
      ctx.save();
      ctx.font = 'bold 11px "Noto Sans TC", sans-serif';
      const textW = ctx.measureText(text).width;
      const boxW = Math.min(canvasW - 22, textW + 20);
      const boxH = 28;
      const bx = Math.max(11, Math.min(canvasW - boxW - 11, x - boxW * 0.42));
      const by = Math.max(10, y - boxH);

      ctx.fillStyle = mood === 'happy' ? '#fef3c7' : mood === 'pain' ? '#fee2e2' : '#f8fafc';
      ctx.strokeStyle = mood === 'happy' ? '#f59e0b' : mood === 'pain' ? '#ef4444' : '#38bdf8';
      ctx.lineWidth = 2;
      drawRoundRect(bx, by, boxW, boxH, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = mood === 'pain' ? '#991b1b' : '#0f172a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, bx + boxW / 2, by + boxH / 2 + 1, boxW - 10);
      ctx.restore();
    }

    function drawWindStreaks(cx, cy, dir) {
      ctx.save();
      ctx.strokeStyle = state.galePhase === 'gale' ? 'rgba(224, 242, 254, 0.95)' : 'rgba(186, 230, 253, 0.65)';
      ctx.lineWidth = state.galePhase === 'gale' ? 2.6 : 1.8;
      for (let i = 0; i < 3; i++) {
        const offset = ((state.time * 95 + i * 26) % 65);
        const startX = dir === 0 ? cx - 14 + i * 14 : cx - dir * offset;
        const startY = dir === 0 ? cy + offset : cy - 16 + i * 15;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(dir === 0 ? startX - 6 : startX - dir * 24, startY + 12);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 在畫布上直接繪製可點擊的破損圓形圖釘 (點擊畫布即可直接選中！)
    function drawInteractiveHotspotPins(w, h) {
      if (state.status !== 'playing') return;

      state.currentLevel.hotspots.forEach((hSpec) => {
        const def = HOTSPOT_LIBRARY[hSpec.id];
        const st = state.hotspotStates[hSpec.id];
        if (!def || !st) return;

        // 已經豪華完成且非當前選中的點位縮小顯示小皇冠即可
        const isSelected = state.selectedId === hSpec.id;
        if (st.tier === 'luxury' && !isSelected) return;

        const cx = def.pos.x * w;
        const cy = def.pos.y * h;
        const pulse = isSelected ? 21 + Math.sin(state.time * 7) * 3.5 : 16 + Math.sin(state.time * 4) * 2;

        ctx.save();
        // 外圈發光環
        ctx.beginPath();
        ctx.arc(cx, cy, pulse + 4, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? 'rgba(251, 191, 36, 0.35)' : 'rgba(15, 23, 42, 0.45)';
        ctx.fill();

        // 圓形徽章底色
        ctx.beginPath();
        ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
        if (isSelected) {
          ctx.fillStyle = '#f59e0b';
          ctx.strokeStyle = '#fef08a';
        } else if (st.iced) {
          ctx.fillStyle = '#0284c7';
          ctx.strokeStyle = '#bae6fd';
        } else if (st.tier === 'makeshift') {
          ctx.fillStyle = '#334155';
          ctx.strokeStyle = '#38bdf8';
        } else {
          ctx.fillStyle = '#991b1b';
          ctx.strokeStyle = '#fca5a5';
        }
        ctx.lineWidth = isSelected ? 3 : 2;
        ctx.fill();
        ctx.stroke();

        // 徽章圖示
        ctx.font = isSelected ? '18px sans-serif' : '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const badgeIcon = st.iced ? '🧊' : st.tier === 'luxury' ? '👑' : st.tier === 'makeshift' ? '🩹' : def.icon;
        ctx.fillText(badgeIcon, cx, cy);
        ctx.restore();
      });
    }

    /**
     * ============================================================================
     * 12. 畫布點擊互動偵測 (直接點破洞就能切換！)
     * ============================================================================
     */
    dom.canvas.addEventListener('click', (e) => {
      if (state.status !== 'playing') return;
      const rect = dom.canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      let closestId = null;
      let minDist = 52; // 寬鬆好點的觸控半徑

      state.currentLevel.hotspots.forEach((hSpec) => {
        const def = HOTSPOT_LIBRARY[hSpec.id];
        if (!def) return;
        const hx = def.pos.x * canvasW;
        const hy = def.pos.y * canvasH;
        const dist = Math.hypot(clickX - hx, clickY - hy);
        if (dist < minDist) {
          minDist = dist;
          closestId = hSpec.id;
        }
      });

      if (closestId) {
        selectHotspot(closestId);
      }
    });

    /**
     * ============================================================================
     * 13. 主遊戲迴圈與暴風雪狂風週期
     * ============================================================================
     */
    function resizeCanvas() {
      if (!dom.canvasWrapper || !dom.canvas) return;
      const rect = dom.canvasWrapper.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvasW = Math.max(300, rect.width || dom.shell.clientWidth || 420);
      canvasH = Math.max(240, rect.height || 440);
      dom.canvas.width = Math.floor(canvasW * dpr);
      dom.canvas.height = Math.floor(canvasH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initSnowParticles() {
      state.snowParticles = [];
      for (let i = 0; i < 110; i++) {
        state.snowParticles.push({
          x: Math.random() * Math.max(400, canvasW),
          y: Math.random() * Math.max(400, canvasH),
          r: 1.5 + Math.random() * 2.6,
          vx: -1.8 - Math.random() * 2.4,
          vy: 1.5 + Math.random() * 2.5,
          indoor: i < 38
        });
      }
    }

    // 處理核心規則回傳的狂風事件 (音效、提示、畫面)
    function handleGameEvents(events) {
      events.forEach((ev) => {
        if (ev.type === 'warning') {
          sound.playAlarm();
          showToast('error', '⚠️ 暴雪狂風即將來襲！', '不抗風的修補會被吹飛，標示「抗風」或高級材料才撐得住！');
        } else if (ev.type === 'gale') {
          sound.setWindIntensity(0.085, true);
          triggerScreenShake();
          if (ev.ripped.length > 0) {
            showToast('error', `🌪️ 狂風吹飛了 ${ev.ripped.length} 處修補！`, '修補被吹掉要重新花材料點數，下次挑「抗風」的材料。');
            setBubble('哇啊！有的修補被狂風整片吹走了！', 'pain');
            renderDecisionPanel();
          }
        } else if (ev.type === 'galeEnd') {
          sound.setWindIntensity(0.035, false);
        }
      });
    }

    function renderCanvasFrame(dt = 0.016) {
      try {
        if (dom.canvas.width === 0 || dom.canvas.height === 0) {
          resizeCanvas();
        }

        ctx.clearRect(0, 0, canvasW, canvasH);
        drawScene();

        const galeMult = state.galePhase === 'gale' ? 2.6 : 1.0;
        state.snowParticles.forEach((p) => {
          p.x += p.vx * galeMult;
          p.y += p.vy * galeMult;
          if (p.x < -10) p.x = canvasW + 10;
          if (p.y > canvasH + 10) {
            p.y = -10;
            p.x = Math.random() * canvasW;
          }
          ctx.fillStyle = p.indoor ? 'rgba(224, 242, 254, 0.65)' : 'rgba(255, 255, 255, 0.45)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });

        if (state.flyingTool) {
          const ft = state.flyingTool;
          ft.progress += dt * 2.9;
          const t = Math.min(1, ft.progress);
          const ease = 1 - Math.pow(1 - t, 3);
          const curX = ft.startX + (ft.targetX - ft.startX) * ease;
          const curY = ft.startY + (ft.targetY - ft.startY) * ease - Math.sin(t * Math.PI) * 65;
          const scale = 1 + Math.sin(t * Math.PI) * 0.5;

          ctx.save();
          ctx.translate(curX, curY);
          ctx.scale(scale, scale);
          ctx.rotate(Math.sin(t * Math.PI * 4) * 0.22);
          ctx.font = '42px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ft.icon, 0, 0);
          ctx.restore();

          if (ft.progress >= 1) {
            const { hotspotId, option } = ft;
            state.flyingTool = null;
            resolveChoiceImpact(hotspotId, option);
          }
        }

        for (let i = state.fxParticles.length - 1; i >= 0; i--) {
          const fp = state.fxParticles[i];
          fp.x += fp.vx;
          fp.y += fp.vy;
          fp.vy += 0.12;
          fp.life -= dt * 1.45;
          if (fp.life <= 0) {
            state.fxParticles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, fp.life);
          if (fp.char) {
            ctx.font = '18px sans-serif';
            ctx.fillText(fp.char, fp.x, fp.y);
          } else {
            ctx.fillStyle = fp.color;
            ctx.beginPath();
            ctx.arc(fp.x, fp.y, fp.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
          const ft = state.floatingTexts[i];
          ft.y += ft.vy;
          ft.alpha -= dt * 0.85;
          if (ft.alpha <= 0) {
            state.floatingTexts.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.font = '900 18px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#090d16';
          ctx.lineWidth = 4;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }
      } catch (err) {
        console.error('Canvas render recovered:', err);
      }
    }

    function gameLoop(timestamp) {
      if (!state.lastFrameTime) state.lastFrameTime = timestamp;
      const dt = Math.min((timestamp - state.lastFrameTime) / 1000, 0.1);
      state.lastFrameTime = timestamp;
      state.time += dt;

      if (state.status === 'playing') {
        handleGameEvents(stepGame(state, dt));
        updateHUD();

        const verdict = endCheck(state);
        if (verdict === 'lose') {
          finishLevel(false);
        } else if (verdict === 'win') {
          finishLevel(true);
        }
      }

      renderCanvasFrame(dt);
      requestAnimationFrame(gameLoop);
    }

    /**
     * ============================================================================
     * 14. 事件綁定與初始化啟動
     * ============================================================================
     */
    window.addEventListener('resize', () => {
      resizeCanvas();
      renderCanvasFrame();
    });

    dom.btnContinueLatest.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      startLevel(saveData.unlockedLevel);
    });

    dom.btnOpenMap.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      showMapOverlay();
    });

    dom.btnEndMap.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      showMapOverlay();
    });

    dom.btnQuickRestart.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      startLevel(state.currentLevel.id);
    });

    dom.btnSound.addEventListener('click', () => {
      sound.init();
      const isOn = sound.toggle();
      dom.btnSound.textContent = isOn ? '🔊' : '🔇';
    });

    dom.btnDevUnlock.addEventListener('click', () => {
      sound.init();
      sound.playVictory();
      saveData.unlockedLevel = LEVELS.length;
      writeSaveData();
      renderLevelMap();
    });

    dom.btnResetSave.addEventListener('click', () => {
      sound.init();
      sound.playClick();
      dom.confirmModal.classList.remove('hidden', 'pointer-events-none');
      dom.confirmModal.classList.add('pointer-events-auto');
    });

    dom.btnCancelReset.addEventListener('click', () => {
      sound.playClick();
      dom.confirmModal.classList.add('hidden', 'pointer-events-none');
      dom.confirmModal.classList.remove('pointer-events-auto');
    });

    dom.btnConfirmReset.addEventListener('click', () => {
      sound.playClick();
      saveData = { unlockedLevel: 1, stars: {} };
      writeSaveData();
      dom.confirmModal.classList.add('hidden', 'pointer-events-none');
      dom.confirmModal.classList.remove('pointer-events-auto');
      renderLevelMap();
    });

    window.onload = () => {
      loadSaveData();
      resizeCanvas();
      initSnowParticles();
      initLevel(state, LEVELS[0], Math.random);
      renderCanvasFrame();
      showMapOverlay();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
