<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>暴雪求生：20關破屋大改造</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    [hidden] { display: none !important; }

    /* 避免下拉重新整理／整頁回彈 */
    html, body { overscroll-behavior: none; }

    /* 通用按下回饋（放最前面，後面各自的 :active 規則會蓋過它） */
    :where(button):not(:disabled):active {
      filter: brightness(1.18);
      transform: scale(0.96);
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #060911 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-shell {
      width: 100%;
      max-width: 540px;
      height: 100dvh;
      max-height: 960px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      /* 瀏海／圓角／手勢列的安全區（配合 viewport-fit=cover） */
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.92), 0 0 0 2px rgba(251, 191, 36, 0.25);
    }

    @media (min-width: 560px) {
      #game-shell {
        height: 96dvh;
        border-radius: 28px;
      }
    }

    /* 立體三選一工具卡片 */
    .tool-card {
      background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 55%, #fde68a 100%);
      border: 3px solid #f59e0b;
      box-shadow: 0 5px 0 #b45309, 0 8px 16px rgba(0, 0, 0, 0.55);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
      position: relative;
      overflow: hidden;
      pointer-events: auto;
    }

    /* 只有真的有滑鼠 hover 的裝置才套用，避免手機點完卡片後一直停在「浮起」狀態 */
    @media (hover: hover) {
      .tool-card:hover:not(:disabled) {
        transform: translateY(-3px) scale(1.02);
        border-color: #fbbf24;
        box-shadow: 0 7px 0 #b45309, 0 0 20px rgba(251, 191, 36, 0.65);
      }
    }

    .tool-card:active:not(:disabled) {
      transform: translateY(3px) scale(0.96);
      box-shadow: 0 1px 0 #b45309;
    }

    .tool-card:disabled {
      opacity: 0.45;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 4px) rotate(-0.9deg); }
      40% { transform: translate(8px, -4px) rotate(0.9deg); }
      60% { transform: translate(-5px, -3px) rotate(-0.4deg); }
      80% { transform: translate(5px, 3px) rotate(0.4deg); }
    }

    .shake {
      animation: screenShake 0.42s ease-in-out;
    }

    @keyframes flashFade {
      0% { opacity: 0.72; }
      100% { opacity: 0; }
    }

    .flash-anim {
      pointer-events: none !important;
      animation: flashFade 0.55s ease-out forwards;
    }

    .frost-vignette {
      pointer-events: none !important;
      box-shadow: inset 0 0 54px 16px rgba(125, 211, 252, 0.78), inset 0 0 18px 6px rgba(255, 255, 255, 0.85);
      transition: opacity 0.35s ease;
    }

    .cta-btn {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      border: 2px solid #86efac;
      box-shadow: 0 4px 0 #14532d, 0 8px 18px rgba(0, 0, 0, 0.5);
    }
    .cta-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #14532d;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .map-scroll::-webkit-scrollbar { width: 5px; }
    .map-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .map-scroll::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.65); border-radius: 999px; }

    /* ==========================================================================
       手機觸控優化（bz- 前綴為自訂 class）
       Tailwind 是一次性產出的靜態 CSS，新 class 不會自動生成，所以尺寸一律寫在這裡。
       觸控目標至少 44px、相鄰間距至少 6px；遊戲中會讀的字最小 12px。
       ========================================================================== */

    /* --- 頂部 HUD --- */
    .bz-header { padding: 8px 12px 8px; }
    .bz-top-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
    .bz-map-btn { min-height: 44px; padding: 4px 10px; }
    .bz-lvname { max-width: 84px; }
    .bz-top-btns { display: flex; align-items: center; gap: 6px; }
    .bz-icon-btn { width: 44px; height: 44px; font-size: 18px; line-height: 1; padding: 0; }
    .bz-meter-row { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 6px; align-items: stretch; }
    .bz-meter { padding: 6px 10px; min-width: 0; }
    #leak-badge, #selected-hotspot-leak { white-space: nowrap; }
    .bz-info-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
    .bz-chip {
      position: relative; display: inline-flex; align-items: center; min-height: 30px;
      padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 800; line-height: 1.2; white-space: nowrap;
    }
    .bz-chip-btn { cursor: pointer; text-align: left; }
    /* 把可點範圍上下各擴 7px，達 44px（視覺高度仍是 30px） */
    .bz-chip-btn::after { content: ''; position: absolute; left: 0; right: 0; top: -7px; bottom: -7px; }

    /* --- 中央舞台：Canvas 絕對定位填滿，不影響 flex 版面計算 --- */
    .bz-stage { min-height: 200px; }
    #game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* --- 提示 toast：畫面底部、可點掉、不穿透 --- */
    .bz-toast {
      position: absolute; left: 50%; bottom: 8px; z-index: 20; width: 94%; max-width: 28rem;
      opacity: 0; transform: translate(-50%, 8px); transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }
    .bz-toast.bz-on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; cursor: pointer; }
    .bz-toast-inner { padding: 8px 14px; border-radius: 16px; border: 2px solid; text-align: center; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55); backdrop-filter: blur(6px); }
    .bz-toast-title { font-size: 13px; font-weight: 900; line-height: 1.3; }
    .bz-toast-desc { font-size: 12px; font-weight: 700; margin-top: 2px; line-height: 1.35; }
    .bz-t-success { background: rgba(2, 44, 34, 0.94); border-color: #34d399; color: #d1fae5; }
    .bz-t-info { background: rgba(8, 47, 73, 0.94); border-color: #38bdf8; color: #e0f2fe; }
    .bz-t-error { background: rgba(69, 10, 10, 0.94); border-color: #f87171; color: #fee2e2; }

    /* --- 底部操作面板 --- */
    .bz-panel { padding: 8px 10px 10px; }
    .bz-tabs-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .bz-tabs-label { font-size: 12px; font-weight: 900; color: #fbbf24; flex-shrink: 0; }
    .bz-tabs {
      --fade-l: 0px; --fade-r: 0px;
      position: relative; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
      overflow-x: auto; padding: 3px 2px; overscroll-behavior-x: contain;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
    }
    .bz-tab {
      flex-shrink: 0; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 12px; font-weight: 900;
      display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer;
    }
    .bz-tab-on { box-shadow: 0 0 0 2px rgba(254, 240, 138, 0.9); }
    .bz-desc-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px;
      padding: 4px 10px; margin-bottom: 8px; background: #0f172a; border: 1px solid rgba(51, 65, 85, 0.9); border-radius: 12px;
    }
    .bz-desc { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; line-height: 1.35; color: #f1f5f9; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bz-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .bz-fallback { margin-top: 6px; min-height: 44px; }
    .bz-fallback-btn {
      width: 100%; min-height: 44px; padding: 4px 8px; border-radius: 12px; border: 1px dashed #64748b;
      background: #0f172a; color: #e2e8f0; font-size: 12px; font-weight: 900; cursor: pointer;
    }
    .bz-fallback-btn:disabled { opacity: 0.4; }

    /* --- 道具卡內容 --- */
    .tool-card { padding: 6px 4px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; cursor: pointer; }
    .bz-card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; width: 100%; pointer-events: none; }
    .bz-card-cost { justify-self: start; padding: 0 3px; border-radius: 6px; background: #78350f; color: #fef3c7; font-size: 12px; font-weight: 900; line-height: 16px; white-space: nowrap; }
    .bz-card-warnico { justify-self: end; font-size: 14px; font-weight: 900; line-height: 16px; color: #b91c1c; }
    .bz-card-main { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: 4px; margin-top: 1px; pointer-events: none; }
    .bz-big { font-size: 15px; font-weight: 900; line-height: 18px; color: #0f172a; }
    .bz-seal { font-size: 12px; font-weight: 900; line-height: 18px; color: #334155; }
    .bz-card-sub { font-size: 12px; font-weight: 900; line-height: 14px; color: #334155; pointer-events: none; }
    .bz-bad { color: #b91c1c; }
    .bz-up { color: #047857; }
    .bz-card-icon { width: 38px; height: 38px; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; font-size: 22px; border-radius: 12px; background: #fef3c7; border: 2px solid #fbbf24; pointer-events: none; }
    .bz-card-name { font-size: 12px; font-weight: 900; line-height: 1.2; color: #0f172a; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none; }
    .bz-card-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin-top: 2px; pointer-events: none; }
    .bz-card-chip { padding: 0 5px; border-radius: 999px; font-size: 12px; font-weight: 900; line-height: 16px; }
    .bz-chip-warn { background: #b91c1c; color: #fff; }
    .bz-card-reason { margin-top: 2px; font-size: 12px; font-weight: 900; line-height: 1.2; color: #b91c1c; pointer-events: none; }

    /* --- 本關簡報、確認視窗、結算、地圖頁 --- */
    .bz-brief-overlay {
      position: absolute; inset: 0; z-index: 45; display: flex; flex-direction: column; padding: 16px;
      overflow-y: auto; background: rgba(2, 6, 23, 0.88); backdrop-filter: blur(4px);
    }
    .bz-brief { width: 100%; max-width: 360px; margin: auto; padding: 16px; background: #0f172a; border: 2px solid rgba(251, 191, 36, 0.7); border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); }
    .bz-brief-kicker { font-size: 12px; font-weight: 900; letter-spacing: 0.1em; color: #fbbf24; }
    .bz-brief h2 { margin: 2px 0 10px; font-size: 20px; font-weight: 900; line-height: 1.25; color: #fff; }
    .bz-brief-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; padding: 8px 10px; border-radius: 12px; background: #1e293b; color: #e2e8f0; font-size: 13px; font-weight: 700; line-height: 1.4; }
    .bz-brief-row .bz-brief-ico { flex-shrink: 0; font-size: 16px; line-height: 1.3; }
    .bz-brief-row b { display: block; font-size: 12px; font-weight: 900; color: #fde68a; }
    .bz-brief-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .bz-btn-big { width: 100%; min-height: 48px; border-radius: 16px; font-size: 16px; font-weight: 900; color: #fff; cursor: pointer; }
    .bz-btn-sub { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid #475569; background: transparent; color: #cbd5e1; font-size: 13px; font-weight: 800; cursor: pointer; }

    #end-overlay { justify-content: flex-start; overflow-y: auto; }
    #end-overlay > #end-badge { margin-top: auto; }
    #end-overlay > .bz-end-btns { margin-bottom: auto; }
    #end-overlay > *:not(.bz-end-fx) { position: relative; z-index: 1; }
    #btn-end-map, #btn-end-next { min-height: 48px; font-size: 14px; }
    #btn-cancel-reset, #btn-confirm-reset { min-height: 48px; font-size: 14px; }
    #confirm-desc { font-size: 13px; }

    #map-overlay { padding-top: env(safe-area-inset-top, 0px); }
    .bz-arcade-link { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 0; padding-right: 12px; font-size: 13px; font-weight: 700; color: #94a3b8; text-decoration: none; }
    #btn-continue-latest, #btn-dev-unlock, #btn-reset-save { min-height: 44px; }

    /* 其餘殘留的 9~10px 小字一律拉到 11px（純裝飾／次要註記的下限） */
    html body .text-\[9px\], html body .text-\[10px\] { font-size: 11px; }

    /* --- 矮螢幕（360×640、375×667 等）：把頭部壓緊、卡片縮小，讓整個遊戲留在一屏內 --- */
    @media (max-height: 700px) {
      .bz-header { padding: 4px 10px 4px; }
      .bz-top-row { margin-bottom: 4px; }
      .bz-meter { padding: 4px 8px; }
      .bz-info-row { margin-top: 4px; flex-wrap: nowrap; }
      .bz-chip { min-height: 28px; padding: 2px 6px; }
      .bz-chip-btn::after { top: -8px; bottom: -8px; }
      .bz-panel { padding: 6px 8px 8px; }
      .bz-tabs-label { display: none; }
      .bz-tabs-row { margin-bottom: 4px; }
      .bz-desc-bar { min-height: 28px; padding: 2px 8px; margin-bottom: 6px; }
      .bz-desc { display: block; white-space: nowrap; text-overflow: ellipsis; -webkit-line-clamp: unset; }
      .bz-card-icon { width: 30px; height: 30px; font-size: 18px; border-radius: 10px; }
      .bz-fallback { margin-top: 6px; }
      .bz-brief-overlay { padding: 10px; }
    }

    /* ==========================================================================
       畫面美化（天氣、溫度回饋、卡片、結算、地圖）。尊重 prefers-reduced-motion（見最後一段）
       ========================================================================== */
    @keyframes bzFade { from { opacity: 0; } to { opacity: 1; } }

    /* --- 天氣／預警覆蓋層（在 Canvas 之上、提示之下，不擋操作） --- */
    .bz-wx { position: absolute; inset: 0; z-index: 9; pointer-events: none; transition: background-color 0.6s ease, box-shadow 0.5s ease; }
    .bz-wx-wet { background-color: rgba(71, 98, 128, 0.2); }
    .bz-wx-cold { background-color: rgba(8, 20, 48, 0.14); box-shadow: inset 0 0 46px 10px rgba(147, 197, 253, 0.42), inset 0 0 14px 2px rgba(224, 242, 254, 0.3); }
    .bz-wx-gale { box-shadow: inset 0 0 34px 6px rgba(224, 242, 254, 0.32); }
    .bz-wx-warn { animation: bzWarnEdge 0.45s ease-in-out infinite alternate; }
    @keyframes bzWarnEdge {
      from { box-shadow: inset 0 0 20px 2px rgba(251, 191, 36, 0.15); }
      to { box-shadow: inset 0 0 46px 12px rgba(251, 191, 36, 0.8), inset 0 0 12px 3px rgba(254, 243, 199, 0.7); }
    }

    /* --- 頂列：狂風倒數（預警 3 秒變色＋跳動）、溫度危險、光澤、得星彈跳 --- */
    @keyframes bzJump { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.14); } }
    .bz-gt-warn { background: #f59e0b; color: #1c1917; animation: bzJump 0.4s ease-in-out infinite; }
    .bz-gt-gale { background: #dc2626; color: #fff; }
    @keyframes bzDangerPulse { 0%, 100% { transform: scale(1); text-shadow: 0 0 0 rgba(248, 113, 113, 0); } 50% { transform: scale(1.14); text-shadow: 0 0 8px rgba(248, 113, 113, 0.9); } }
    .bz-danger-val { color: #f87171; display: inline-block; animation: bzDangerPulse 0.7s ease-in-out infinite; }
    @keyframes bzDangerBar { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.45); } }
    .bz-danger-bar { animation: bzDangerBar 0.7s ease-in-out infinite; }
    .bz-shine { position: relative; overflow: hidden; }
    .bz-shine::after { content: ''; position: absolute; top: 0; bottom: 0; left: -45%; width: 45%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0)); animation: bzShine 1.5s linear infinite; }
    @keyframes bzShine { from { transform: translateX(0); } to { transform: translateX(340%); } }
    @keyframes bzPop { 0% { transform: scale(1); } 40% { transform: scale(1.55); } 70% { transform: scale(0.92); } 100% { transform: scale(1); } }
    .bz-pop { display: inline-block; animation: bzPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* --- 提示 toast：選中的破洞在下半部時改顯示在畫布上緣 --- */
    .bz-toast.bz-top { bottom: auto; top: 8px; transform: translate(-50%, -8px); }
    .bz-toast.bz-top.bz-on { transform: translate(-50%, 0); }

    /* --- 閃光：陷阱紅閃 --- */
    .bz-fl-red { background: rgba(239, 68, 68, 0.42); }

    /* --- 道具卡：新一手牌依序淡入上浮（總長 ≤250ms，卡片隨時可點）、被選中的卡飛出 --- */
    @keyframes bzCardIn { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: none; } }
    .bz-card-in { animation: bzCardIn 0.16s ease-out backwards; }
    .tool-card.bz-card-gone { opacity: 0.12; transform: scale(0.8) translateY(-14px); filter: none; }

    /* --- 結算：星星逐顆彈出、三星暖光與金色雪花、失敗結霜 --- */
    .bz-star { display: inline-block; }
    .bz-star-off { opacity: 0.5; }
    @keyframes bzStarPop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.5) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    .bz-star-on { animation: bzStarPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
    .bz-end-fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .bz-end-3 .bz-end-fx::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 36%, rgba(251, 191, 36, 0.34), rgba(251, 146, 60, 0.12) 42%, rgba(0, 0, 0, 0) 72%); animation: bzGlow 2.8s ease-in-out infinite alternate; }
    @keyframes bzGlow { from { opacity: 0.55; } to { opacity: 1; } }
    .bz-gold { position: absolute; top: -14px; border-radius: 50%; background: radial-gradient(circle, #fef3c7, #f59e0b); opacity: 0; animation: bzGoldFall linear infinite; }
    @keyframes bzGoldFall { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 8% { opacity: 0.95; } 100% { transform: translate3d(var(--dx, 24px), 760px, 0); opacity: 0.2; } }
    #end-overlay.bz-end-lose { box-shadow: inset 0 0 70px 24px rgba(125, 211, 252, 0.6), inset 0 0 18px 5px rgba(255, 255, 255, 0.7); background-image: radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 0) 38%, rgba(186, 230, 253, 0.22) 100%); animation: bzFade 0.8s ease-out; }

    /* --- 關卡地圖 --- */
    .bz-chap-stars { font-size: 12px; font-weight: 900; color: #fde047; white-space: nowrap; }
    .bz-chap-badge { padding: 0 4px; font-size: 12px; font-weight: 700; color: #94a3b8; }
    .bz-lvl-card { position: relative; }
    .bz-lvl-crown { position: absolute; top: -9px; right: 12px; font-size: 16px; line-height: 1; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7)); }
    @keyframes bzBreath { 0%, 100% { box-shadow: 0 0 6px rgba(245, 158, 11, 0.25); } 50% { box-shadow: 0 0 22px 3px rgba(251, 191, 36, 0.6); } }
    .bz-breath { animation: bzBreath 2.4s ease-in-out infinite; }
    .bz-locked { opacity: 1; cursor: not-allowed; background: rgba(15, 23, 42, 0.78); border: 1px solid #334155; }
    .bz-lk-name { font-size: 12px; font-weight: 900; color: #cbd5e1; }
    .bz-lk-sub { margin-top: 2px; font-size: 12px; color: #94a3b8; }
    .bz-lk-tag { font-size: 12px; font-weight: 700; color: #94a3b8; }
    .bz-lk-ico { filter: saturate(0.6); }

<body>
  <div id="game-shell">
    <!-- ========================================================================
         1. 頂部狀態儀表板 (室溫生命線 + 豪華改造度 + 狂風預警)
         ======================================================================== -->
    <header class="bz-header relative z-20 bg-slate-950 border-b border-slate-800 shrink-0">
      <div class="bz-top-row">
        <!-- 返回 20 關地圖按鈕 -->
        <button id="btn-open-map" type="button" aria-label="回關卡地圖" class="bz-map-btn bg-gradient-to-r from-amber-500 to-orange-600 border border-amber-200 rounded-xl flex items-center gap-1.5 shrink-0 shadow cursor-pointer">
          <span class="text-sm">🗺️</span>
          <div class="leading-none text-left">
            <div id="hud-level-badge" class="text-xs font-black text-amber-100">第 1 關</div>
            <div id="hud-level-name" class="text-xs font-black text-white bz-lvname truncate">漏風破木屋</div>
          </div>
        </button>

        <!-- 暴風雪狂風預警條 -->
        <div id="gale-hud" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1 flex items-center justify-between gap-1 min-w-0">
          <div class="flex items-center gap-1 min-w-0">
            <span id="gale-icon" class="text-xs shrink-0">🌨️</span>
            <span id="gale-label" class="text-xs font-black text-slate-300 truncate">平穩</span>
          </div>
          <span id="gale-timer" class="text-xs font-black px-1.5 py-0.5 rounded bg-slate-800 text-cyan-300 tabular-nums shrink-0">無狂風</span>
        </div>

        <!-- 音效與重來按鈕 -->
        <div class="bz-top-btns shrink-0">
          <button id="btn-sound" type="button" title="音效開關" aria-label="音效開關" class="bz-icon-btn rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 flex items-center justify-center text-white cursor-pointer">🔊</button>
          <button id="btn-quick-restart" type="button" title="重玩本關" aria-label="重玩本關" class="bz-icon-btn rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 flex items-center justify-center text-white cursor-pointer">🔄</button>
        </div>
      </div>

      <!-- 室溫生命線 & 豪華改造進度 -->
      <div class="bz-meter-row">
        <!-- 左側：室內溫度計 (降到 0°C 凍死，升到目標溫度過關) -->
        <div class="bz-meter bg-slate-900 border border-slate-700/90 rounded-2xl flex flex-col justify-between">
          <div class="flex items-center justify-between gap-1 mb-1">
            <div class="flex items-center gap-1">
              <span id="temp-emoji" class="text-base leading-none">🥶</span>
              <span id="temp-value" class="text-sm font-black text-cyan-300 tabular-nums">12.0°C</span>
            </div>
            <span id="leak-badge" class="text-xs font-black px-1.5 py-0.5 rounded-md bg-red-950 text-red-300 border border-red-500/70">
              冷風滲入中
            </span>
          </div>
          <div class="relative w-full h-2.5 bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-700">
            <div id="temp-bar" class="h-full rounded-full transition-all duration-100 bg-gradient-to-r from-cyan-500 to-sky-300" style="width: 45%;"></div>
            <div id="target-temp-marker" class="absolute top-0 bottom-0 w-0.5 bg-emerald-400 shadow-[0_0_6px_#34d399]" style="left: 78%;"></div>
          </div>
          <div class="flex justify-between text-xs font-bold text-slate-400 mt-0.5 gap-1">
            <span>0°C 凍僵</span>
            <span id="target-temp-text" class="text-emerald-400">目標 22°C</span>
          </div>
        </div>

        <!-- 右側：破屋變豪宅星級進度 -->
        <div class="bz-meter bg-slate-900 border border-slate-700/90 rounded-2xl flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-amber-300">豪宅改造度</span>
            <span id="luxury-stars-preview" class="text-xs tracking-tighter">☆☆☆</span>
          </div>
          <div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-700 my-0.5">
            <div id="luxury-bar" class="h-full rounded-full transition-all duration-200 bg-gradient-to-r from-amber-500 via-yellow-400 to-emerald-400" style="width: 0%;"></div>
          </div>
          <div class="flex items-center justify-between text-xs font-bold">
            <span class="text-slate-400">已修繕</span>
            <span id="repair-count-text" class="text-amber-300 font-black">0 / 6 處</span>
          </div>
        </div>
      </div>

      <!-- 材料點數 / 本關天氣 / 章節規則（天氣與規則點一下可再看完整說明） -->
      <div id="info-row" class="bz-info-row">
        <span id="budget-chip" class="bz-chip tabular-nums bg-amber-950 text-amber-200 border border-amber-500/70">🧰 材料 0 / 0</span>
        <button id="weather-chip" type="button" aria-label="查看本關天氣說明" class="bz-chip bz-chip-btn bg-slate-900 text-sky-200 border border-sky-600/60"></button>
        <button id="rule-chip" type="button" aria-label="查看章節規則說明" class="bz-chip bz-chip-btn hidden bg-slate-900 text-amber-200 border border-amber-600/50"></button>
      </div>
    </header>

    <!-- ========================================================================
         2. 中央 Canvas 互動舞台 (可直接點擊場景破洞 + 破屋變豪宅即時演變)
         ======================================================================== -->
    <main id="canvas-wrapper" class="bz-stage relative flex-1 w-full overflow-hidden bg-slate-800">
      <canvas id="game-canvas" class="cursor-pointer"></canvas>

      <!-- 天氣色調／冷暈／狂風預警邊緣閃光（純 CSS，不擋操作） -->
      <div id="wx-layer" class="bz-wx" aria-hidden="true"></div>

      <!-- 低於 5°C 結霜邊框 -->
      <div id="frost-layer" class="pointer-events-none absolute inset-0 z-10 frost-vignette opacity-0"></div>

      <!-- 浮動事件反饋提示：在畫面底部、不遮破洞；點一下可關掉（只關提示，不會穿透去點破洞） -->
      <div id="feedback-toast" class="bz-toast" role="status" aria-live="polite">
        <div id="feedback-toast-inner" class="bz-toast-inner bz-t-info">
          <div id="feedback-title" class="bz-toast-title"></div>
          <div id="feedback-desc" class="bz-toast-desc"></div>
        </div>
      </div>

      <!-- 閃光特效層 -->
      <div id="flash-layer" class="hidden pointer-events-none absolute inset-0 z-10"></div>
    </main>

    <!-- ========================================================================
         3. 底部「道具三選一」操作面板 (每個破洞抽 3 張，點數不足的卡變灰)
         ======================================================================== -->
    <section id="bottom-control-panel" class="bz-panel relative z-30 bg-slate-950 border-t-2 border-amber-500/40 shrink-0 pointer-events-auto">
      <!-- 快捷破損目標切換列 (與畫布點擊完全同步；項目多時可左右捲動，兩側淡出提示) -->
      <div class="bz-tabs-row">
        <span class="bz-tabs-label">👆 點破洞或選項目：</span>
        <div id="hotspot-tabs" class="bz-tabs no-scrollbar"></div>
      </div>

      <!-- 當前選中破洞的提示說明條 -->
      <div class="bz-desc-bar">
        <div id="selected-hotspot-desc" class="bz-desc">
          屋頂大破洞：寒風與暴雪正從頭頂灌入！
        </div>
        <span id="selected-hotspot-leak" class="text-xs font-black px-1.5 py-0.5 rounded bg-red-950 text-red-300 border border-red-500/60 shrink-0">
          ❄️❄️❄️ 極寒漏風
        </span>
      </div>

      <!-- 經典道具三選一大卡片 -->
      <div id="cards-container" class="bz-cards"></div>
      <!-- 免費保底道具：點數用完時的出路（容器固定保留高度，避免版面跳動） -->
      <div id="fallback-container" class="bz-fallback"></div>
    </section>

    <!-- ========================================================================
         4. 20 關地圖選擇覆蓋層
         ======================================================================== -->
    <div id="map-overlay" class="absolute inset-0 z-40 bg-slate-950/96 backdrop-blur-md flex flex-col">
      <div class="px-4 pt-2 pb-3 bg-gradient-to-b from-slate-900 to-slate-950 border-b border-slate-800 shrink-0">

  <script>
    /**
     * ============================================================================
     * 1. Web Audio API 合成音效引擎 (風雪聲 / 敲打修繕 / 豪華叮咚 / 搞笑失誤音)
     * ============================================================================
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.windGain = null;
        this.windFilter = null;
        this.currentWindLevel = 0.04;
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();
            this.startWindLoop();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {}
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.windGain && this.ctx) {
          this.windGain.gain.setTargetAtTime(this.enabled ? this.currentWindLevel : 0, this.ctx.currentTime, 0.1);
        }
        return this.enabled;
      }

      startWindLoop() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        this.windFilter = this.ctx.createBiquadFilter();
        this.windFilter.type = 'bandpass';
        this.windFilter.frequency.value = 390;
        this.windFilter.Q.value = 3.2;

        this.windGain = this.ctx.createGain();
        this.windGain.gain.value = this.enabled ? this.currentWindLevel : 0;

        noise.connect(this.windFilter);
        this.windFilter.connect(this.windGain);
        this.windGain.connect(this.ctx.destination);
        noise.start();
      }

      setWindIntensity(level, isGale = false) {
        this.currentWindLevel = level;
        if (this.windGain && this.ctx) {
          this.windGain.gain.setTargetAtTime(this.enabled ? level : 0, this.ctx.currentTime, 0.2);
          if (this.windFilter) {
            this.windFilter.frequency.setTargetAtTime(isGale ? 680 : 380, this.ctx.currentTime, 0.2);
          }
        }
      }

      playClick() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.065);
        } catch (e) {}
      }

      playLuxurySuccess() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          // 兩下木槌敲擊聲
          [0, 0.11].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, now + offset);
            osc.frequency.exponentialRampToValueAtTime(65, now + offset + 0.075);
            gain.gain.setValueAtTime(0.13, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.085);
          });

          // 華麗和弦叮咚
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const t = now + 0.20 + idx * 0.065;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.14, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.23);
          });
        } catch (e) {}
      }

      playMakeshiftSuccess() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.linearRampToValueAtTime(560, now + 0.14);
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        } catch (e) {}
      }

      playFail() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [0, 0.14, 0.28].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now + offset);
            osc.frequency.linearRampToValueAtTime(75, now + offset + 0.12);
            gain.gain.setValueAtTime(0.18, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.13);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.135);
          });
        } catch (e) {}
      }

      playAlarm() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [0, 0.18].forEach((offset) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(760, now + offset);
            osc.frequency.linearRampToValueAtTime(520, now + offset + 0.14);
            gain.gain.setValueAtTime(0.11, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.16);
          });
        } catch (e) {}
      }

      playVictory() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [
            { f: 523.25, t: 0.0, d: 0.12 },
            { f: 659.25, t: 0.13, d: 0.12 },
            { f: 783.99, t: 0.26, d: 0.12 },
            { f: 1046.5, t: 0.39, d: 0.38 }
          ].forEach((n) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, now + n.t);
            gain.gain.setValueAtTime(0.18, now + n.t);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.t);
            osc.stop(now + n.t + n.d + 0.02);
          });
        } catch (e) {}
      }

      playGameOver() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [392.0, 349.23, 311.13, 261.63].forEach((freq, idx) => {
            const t = now + idx * 0.22;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.16, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.28);
          });
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    /**

    // ==CORE-BEGIN== (以下到 CORE-END 為純資料與純邏輯，不碰 DOM，可在 node 下載入模擬)

    // 材料類別 (第四章「缺料」規則使用)

    // 本關天氣：所有數值都在這裡，方便日後調整

      cold:   { id: 'cold', name: '酷寒', icon: '🥶', leakMul: 1.35, baseMul: 1.35, dampMul: 1, warmMul: 2,
        desc: '酷寒：降溫更快，保暖材料的加溫加倍。' }

    // 結冰剛除掉的破洞是濕的：怕潮材料沿用濕雪的折扣

    // 道具建構小工具 (純資料)：陷阱 / 湊合 / 豪華

      ({ tier: 'trap', icon, name, tag, delta, fail, say, fx, cost: 0 });
    const MS = (icon, name, cost, delta, seal, traits, cat, say, heat) =>

          MS('⛺', '塑膠帆布蓋住', 1, 1.5, 0.75, [], 'soft', '暫時擋住雪了，不過帆布被風吹得啪啪響…'),
          LX('🧱', '紅瓦片+原木樑', 3, 3.5, 1, null, ['damp'], 'wood', '太棒了！屋頂變得又堅固又漂亮！'),

          DEICE('makeshift', '🫖', '潑溫水融冰', 1, 0.8, [], 'soft', '冰化掉了，快趁還沒結冰把窗戶修好！'),

    /**
     * ============================================================================
     * 3b. 核心規則 (純邏輯)：抽牌、情境效果、溫度變化、狂風、結算、星等
     *     所有函式只讀寫傳入的狀態物件 g，與畫面無關。
     * ============================================================================
     */
    function hasTrait(it, t) { return (it.traits || []).indexOf(t) >= 0; }
    function blownByGale(it) {
      return hasTrait(it, 'galefear') || (it.tier === 'makeshift' && !hasTrait(it, 'windproof'));
    }
    function levelWeather(lvl) { return WEATHERS[lvl.weather] || WEATHERS.normal; }
    function chapterRule(lvl) {
      const chap = CHAPTERS.find((c) => c.id === lvl.chapter);
      return (chap && chap.rule) || { type: 'none', text: '' };
    }
    function weatherText(lvl) { return levelWeather(lvl).desc.replace('{N}', String(lvl.galeCycle)); }
    function itemHeat(def, it) {
      const raw = it.heat != null ? it.heat : (it.tier === 'luxury' ? (def.heatPerSec || 0.12) : 0);
      return raw * ITEM_HEAT_SCALE;
    }

    function initLevel(g, lvl, rng) {
      g.level = lvl;
      g.rng = rng || Math.random;
      g.maxTemp = g.maxTemp || 28.0;
      g.temp = lvl.startTemp;
      g.mistakes = 0;
      g.budget = lvl.budget;
      g.spent = 0;
      g.playTime = 0;
      g.galePhase = 'calm';
      g.galeTimer = (lvl.weather === 'gale' ? lvl.galeCycle : 0) || 0;
      g.rule = chapterRule(lvl);
      g.shortageCat = null;
      if (g.rule.type === 'shortage' && g.rule.cats && g.rule.cats.length) {
        g.shortageCat = g.rule.cats[Math.floor(g.rng() * g.rule.cats.length)];
      }
      g.hotspotStates = {};
      lvl.hotspots.forEach((spec) => {
        if (!HOTSPOT_LIBRARY[spec.id]) return;
        g.hotspotStates[spec.id] = {
          id: spec.id, tier: 'broken', iced: Boolean(spec.iced), wet: false,
          item: null, seal: 0, heat: 0, pts: 0, rank: -1, brokenSecs: 0,
          hand: null, hand1: null
        };
      });
      return g;
    }

    // 道具在當前情境下的實際效果 (卡片顯示與結算共用)
    function effOf(g, hsId, it, stage1) {
      const def = HOTSPOT_LIBRARY[hsId];
      const st = g.hotspotStates[hsId];
      const w = levelWeather(g.level);
      const cost = it.cost || 0;
      const oos = Boolean(it.cat && g.shortageCat && it.cat === g.shortageCat);
      const base = { delta: it.delta || 0, seal: 0, heat: 0, dampHit: false, warmUp: false, blown: false, oos, cost, afford: cost <= g.budget };
      if (stage1 || it.tier === 'trap') return base;
      let delta = it.delta || 0;
      let seal = it.seal || 0;
      let heat = itemHeat(def, it);
      const dampHit = hasTrait(it, 'damp') && (g.level.weather === 'wet' || Boolean(st && st.wet));
      const warmUp = hasTrait(it, 'warm') && w.warmMul > 1;
      if (dampHit) {
        delta *= WET_HOTSPOT_DAMP_MUL;
        seal *= WET_HOTSPOT_DAMP_MUL;
        heat *= WET_HOTSPOT_DAMP_MUL;
      }
      if (warmUp) heat *= w.warmMul;
      const blown = g.level.weather === 'gale' && blownByGale(it);
      return { delta, seal, heat, dampHit, warmUp, blown, oos, cost, afford: cost <= g.budget };
    }

    // 「有效修補」：不是陷阱、沒缺貨、不會被狂風吹掉、不受潮氣打折
    function isGoodCard(g, hsId, it, stage1) {
      if (it.tier === 'trap') return false;
      const e = effOf(g, hsId, it, stage1);
      return !e.oos && !e.blown && !e.dampHit;
    }

    // 抽 3 張：至少 1 張有效修補、最多 1 張陷阱、不會三張全是豪華
    function drawHand(g, hsId, stage1) {
      const def = HOTSPOT_LIBRARY[hsId];
      const pool = stage1 ? def.stage1Choices : def.choices;
      const n = pool.length;
      const valid = (hand) => {
        const traps = hand.filter((c) => c.tier === 'trap').length;
        const lux = hand.filter((c) => c.tier === 'luxury').length;
        return traps <= 1 && lux < 3 && hand.some((c) => isGoodCard(g, hsId, c, stage1));
      };
      for (let tries = 0; tries < 400; tries++) {
        const idx = [];
        while (idx.length < 3) {
          const k = Math.floor(g.rng() * n);
          if (idx.indexOf(k) < 0) idx.push(k);
        }
        const hand = idx.map((k) => pool[k]);
        if (valid(hand)) return hand;
      }
      // 保底 (理論上不會走到)：強制放入一張有效修補
      const good = pool.find((c) => isGoodCard(g, hsId, c, stage1)) || pool[1];
      const rest = pool.filter((c) => c !== good && c.tier !== 'trap').slice(0, 2);
      return [good].concat(rest);
    }

    function ensureHand(g, hsId) {
      const st = g.hotspotStates[hsId];
      if (st.iced) {
        if (!st.hand1) st.hand1 = drawHand(g, hsId, true);
        return st.hand1;
      }
      if (!st.hand) st.hand = drawHand(g, hsId, false);
      return st.hand;
    }

    function expandMul(g, st) {
      const r = g.rule;
      if (!r || r.type !== 'expand' || st.tier !== 'broken') return 1;
      return Math.min(r.cap, 1 + r.rate * st.brokenSecs);
    }

    // 即時溫度變化速度 (每秒)
    function tempRate(g) {
      const lvl = g.level;
      const w = levelWeather(lvl);
      const sc = lvl.leakScale == null ? 1 : lvl.leakScale;
      const galeMul = g.galePhase === 'gale' ? (w.galeLeakMul || 2.1) : 1.0;
      let delta = -0.18 * sc * w.baseMul * galeMul;
      lvl.hotspots.forEach((h) => {
        const def = HOTSPOT_LIBRARY[h.id];
        const st = g.hotspotStates[h.id];
        if (!def || !st) return;
        const leak = (def.leakPerSec || 0.3) * sc * w.leakMul * galeMul;
        if (st.tier === 'broken') {
          delta -= leak * expandMul(g, st);
        } else {
          delta -= leak * (1 - st.seal);
          delta += st.heat;
        }
      });
      return delta;
    }

    // 狂風循環。回傳事件陣列：{type:'warning'|'gale'|'galeEnd', ripped:[破洞id]}
    function galeStep(g, dt, events) {
      const lvl = g.level;
      if (lvl.weather !== 'gale' || lvl.galeCycle <= 0) return;
      g.galeTimer -= dt;
      if (g.galePhase === 'calm' && g.galeTimer <= 3.0) {
        g.galePhase = 'warning';
        events.push({ type: 'warning' });
      } else if (g.galePhase === 'warning' && g.galeTimer <= 0) {
        g.galePhase = 'gale';
        g.galeTimer = 5.0;
        const ripped = [];
        lvl.hotspots.forEach((h) => {
          const st = g.hotspotStates[h.id];
          if (st && st.item && blownByGale(st.item)) {
            st.tier = 'broken'; st.item = null; st.seal = 0; st.heat = 0; st.pts = 0; st.rank = -1; st.brokenSecs = 0;
            ripped.push(h.id);
          }
        });
        events.push({ type: 'gale', ripped });
      } else if (g.galePhase === 'gale' && g.galeTimer <= 0) {
        g.galePhase = 'calm';
        g.galeTimer = lvl.galeCycle;
        events.push({ type: 'galeEnd' });
      }
    }

    // 時間流逝 dt 秒：狂風 -> 破洞擴大計時 -> 溫度
    function stepGame(g, dt) {
      const events = [];
      galeStep(g, dt, events);
      g.level.hotspots.forEach((h) => {
        const st = g.hotspotStates[h.id];
        if (st && st.tier === 'broken') st.brokenSecs += dt;
      });
      const rate = tempRate(g);
      g.temp = Math.max(0, Math.min(g.maxTemp, g.temp + rate * dt));
      g.playTime += dt;
      return events;
    }

    // 這張卡現在能不能選。回傳 null 代表可以，否則是原因
    function blockReason(g, hsId, it) {
      const st = g.hotspotStates[hsId];
      if (!st) return 'none';
      const stage1 = Boolean(st.iced);
      if (!stage1 && st.rank >= 2) return 'maxed';
      if (!stage1 && it.tier !== 'trap' && it.rank <= st.rank) return 'used';
      const e = effOf(g, hsId, it, stage1);
      if (e.oos) return 'oos';
      if (!e.afford) return 'budget';
      return null;
    }

    // 套用選擇。回傳事件 {ok, kind:'trap'|'deice'|'repair', delta, eff}
    function applyChoice(g, hsId, it) {
      const st = g.hotspotStates[hsId];
      const why = blockReason(g, hsId, it);
      if (why) return { ok: false, reason: why };
      const stage1 = Boolean(st.iced);
      const e = effOf(g, hsId, it, stage1);
      g.budget -= e.cost;
      g.spent += e.cost;
      if (it.tier === 'trap') {
        g.mistakes += 1;
        g.temp = Math.max(0, g.temp + it.delta);
        return { ok: true, kind: 'trap', delta: it.delta, eff: e };
      }
      if (stage1) {
        st.iced = false;
        st.wet = !hasTrait(it, 'dry');
        g.temp = Math.min(g.maxTemp, g.temp + it.delta);
        return { ok: true, kind: 'deice', delta: it.delta, eff: e };
      }
      st.tier = it.tier;
      st.item = it;
      st.seal = e.seal;
      st.heat = e.heat;
      st.pts = it.pts;
      st.rank = it.rank;
      st.brokenSecs = 0;
      g.temp = Math.min(g.maxTemp, g.temp + e.delta);
      return { ok: true, kind: 'repair', delta: e.delta, eff: e };
    }

    // 豪華改造度與星等
    function calcProgress(g) {
      const total = g.level.hotspots.length;
      let points = 0;
      let repairedCount = 0;
      g.level.hotspots.forEach((h) => {
        const st = g.hotspotStates[h.id];
        if (!st || st.tier === 'broken') return;
        points += st.pts || (st.tier === 'luxury' ? 1.0 : 0.45);
        repairedCount += 1;
      });
      const pct = Math.round((points / Math.max(1, total)) * 100);
      const th = g.level.stars || { two: 55, three: 85 };
      let stars = 1;
      if (pct >= th.three && g.mistakes <= 1) stars = 3;
      else if (pct >= th.two) stars = 2;
      return { pct, stars, repairedCount, total };
    }

    // 勝負判定：'win' | 'lose' | null
    function endCheck(g) {
      if (g.temp <= 0) return 'lose';
      const lvl = g.level;
      const allRepaired = lvl.hotspots.every((h) => {
        const st = g.hotspotStates[h.id];
        return st.tier !== 'broken' && !st.iced;
      });
      if (g.temp >= lvl.targetTemp || (allRepaired && g.temp >= lvl.targetTemp - 2.0)) return 'win';
      return null;
    }
    // ==CORE-END==

    /**
     * ============================================================================
     * 4. LocalStorage 存檔系統
     * ============================================================================
     */
    const STORAGE_KEY = 'blizzard_cabin_fix_v1';
    const LEGACY_STORAGE_KEY = 'gossip_harbor_ad_makeover_20_v5'; // 舊版進度：只讀取轉移，不刪除
    let saveData = {
      unlockedLevel: 1,
      stars: {}
    };

    function loadSaveData() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        let migrated = false;
        // 新 key 沒資料、舊 key 有資料：把舊的星等與解鎖進度轉過來
        if (!raw) {
          raw = localStorage.getItem(LEGACY_STORAGE_KEY);
          migrated = Boolean(raw);
        }
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed.unlockedLevel === 'number') {
            saveData.unlockedLevel = Math.min(LEVELS.length, Math.max(1, parsed.unlockedLevel));
            saveData.stars = parsed.stars || {};
            if (migrated) writeSaveData();
          }
        }
      } catch (e) {}
    }

    function writeSaveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
      } catch (e) {}
    }

    function getTotalStars() {
      return Object.values(saveData.stars).reduce((acc, s) => acc + (Number(s) || 0), 0);
    }

    const state = {
      status: 'map',
      currentLevel: LEVELS[0],

      // (欄位由核心規則 initLevel 建立；level / budget / spent / rule / shortageCat / playTime 也由核心維護)
      level: LEVELS[0],
      budget: LEVELS[0].budget,
      spent: 0,
      rule: null,
      shortageCat: null,
      playTime: 0,
      warnedBudget: false,
      hotspotStates: {},
      selectedId: 'roof',

      galeTimer: 0,
      bubble: {

    const ctx = dom.canvas.getContext('2d');
    let canvasW = 420;

    // ---- 手機觸控 / 節奏常數（集中在這裡，方便調整手感） ----
    const CHOICE_FLY_SPEED = 4.2;     // 道具飛行進度每秒（1 / 速度 = 飛行秒數，約 0.24 秒）
    const CHOICE_SETTLE_MS = 450;     // 道具命中後，到可以選下一張卡的等待（連同飛行共約 0.7 秒）

    const PIN_HIT_R = 52;             // 點擊命中半徑，取最近者
    const PIN_PRESS_SEC = 0.22;       // 按下當下圖釘放大回彈的時間
    const POINTER_CLICK_GUARD_MS = 600; // pointerdown 處理過後，這段時間內的 click 視為同一次點擊而略過
    const HAPTIC_OK = 12;             // 選卡成功輕震（毫秒）
    const HAPTIC_TRAP = [20, 40, 20]; // 陷阱卡震兩下
    let runToken = 0;                 // 每次開新局／回地圖就 +1，讓舊的延遲回呼失效
    let uiPaused = false;             // 確認視窗開著時暫停計時
    let pageHidden = false;           // 分頁在背景時暫停計時與動畫
    let lastPointerAt = -1e9;         // 最近一次由 pointerdown 處理的畫布點擊時間
    let pendingConfirm = null;        // 確認視窗按「確定」時要執行的動作

    // ---- 畫面美化：動態偏好、粒子上限、emoji 相容 ----
    // 使用者設定「減少動態」：關掉抖動／脈動／發抖／呼氣，粒子減量（執行中隨時可切換）
    let REDUCED = false;
    try {
      const rmq = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      if (rmq) {
        REDUCED = Boolean(rmq.matches);
        const onRmq = (e) => { REDUCED = Boolean(e.matches); initSnowParticles(); };
        if (rmq.addEventListener) rmq.addEventListener('change', onRmq);
        else if (rmq.addListener) rmq.addListener(onRmq);
      }
    } catch (e) {}

    // 各類粒子的數量上限（陣列只會在這些範圍內，不會無限成長）
    const SNOW_MAX = 110;     // 雪花
    const WIND_MAX = 40;      // 狂風吹進屋內的雪（物件池，重複使用）
    const STREAK_MAX = 16;    // 狂風橫向風痕（物件池）
    const FX_MAX = 150;       // 修補／陷阱的一次性粒子
    const RING_MAX = 8;       // 修補成功的擴散光環
    const DRIP_MAX = 6;       // 怕潮修補處的滴水
    const FLOAT_MAX = 12;     // 飄字
    const BUBBLE_SHOW_SEC = 2.6;   // 泡泡完整顯示秒數
    const BUBBLE_FADE_SEC = 0.6;   // 之後淡出秒數（合計約 3 秒）
    const BUBBLE_MIN_H = 260;      // Canvas 低於這個高度時，泡泡要避開圖釘

    // 新版 emoji（Emoji 12 以後，2019 年起）在舊手機會顯示成方塊「□」：顯示時換成更早期就有的
    // （道具資料在 CORE 區段不能改，所以統一在「顯示時」用 safeIcon／safeText 換）
    const SAFE_ICON = {
      '🪨': '⛰️', '🪵': '🌳', '🪟': '🏠', '🫖': '☕', '🪢': '➰', '🪣': '🚿',
      '🧊': '❄️', '🟫': '🔶', '🩹': '📎'
    };
    const SAFE_ICON_RE = new RegExp(Object.keys(SAFE_ICON).join('|'), 'g');
    function safeIcon(icon) { return SAFE_ICON[icon] || icon; }
    function safeText(s) { return String(s == null ? '' : s).replace(SAFE_ICON_RE, (m) => SAFE_ICON[m]); }

    // 小工具：值沒變就不寫 DOM（updateHUD 每幀都會跑）
    function setCls(el, cls) { if (el.className !== cls) el.className = cls; }
    function setTxt(el, s) { if (el.textContent !== s) el.textContent = s; }
    // 彈一下（重新觸發動畫）
    function popEl(el) {
      if (!el) return;
      el.classList.remove('bz-pop');
      void el.offsetWidth;
      el.classList.add('bz-pop');
      setTimeout(() => el.classList.remove('bz-pop'), 600);
    }

    /**
     * ============================================================================
     * 6. 20 關地圖渲染
     * ============================================================================
     */
    function renderLevelMap() {
      dom.totalStarsDisplay.textContent = `⭐ ${getTotalStars()} / ${LEVELS.length * 3}`;
      dom.mapListContainer.innerHTML = '';

      CHAPTERS.forEach((chap) => {
        const chapLevels = LEVELS.filter((l) => l.chapter === chap.id);
        const section = document.createElement('div');
        section.className = 'space-y-2.5';
        const chapGot = chapLevels.reduce((a, l) => a + (Number(saveData.stars[l.id]) || 0), 0);
        const chapTot = chapLevels.length * 3;

        const colorMap = {
          emerald: 'text-emerald-300 border-emerald-500/40 bg-emerald-950/60',
          sky: 'text-sky-300 border-sky-500/40 bg-sky-950/60',
          amber: 'text-amber-300 border-amber-500/40 bg-amber-950/60',
          rose: 'text-rose-300 border-rose-500/40 bg-rose-950/60'
        };

        section.innerHTML = `
          <div class="flex items-center justify-between px-3 py-1.5 rounded-xl border ${colorMap[chap.color]}">
            <span class="text-xs font-black tracking-wide">${chap.name}</span>
            <span class="bz-chap-stars" aria-label="本章星數">⭐ ${chapGot} / ${chapTot}</span>
          </div>
          <div class="bz-chap-badge">${chap.badge}</div>
          <div class="px-1 text-xs font-bold text-slate-300 leading-snug">📌 ${chap.rule.text}</div>
          <div class="grid grid-cols-1 gap-2" id="chap-grid-${chap.id}"></div>
        `;
        dom.mapListContainer.appendChild(section);

        const grid = section.querySelector(`#chap-grid-${chap.id}`);

        chapLevels.forEach((lvl) => {
          const isUnlocked = lvl.id <= saveData.unlockedLevel;
          const earnedStars = saveData.stars[lvl.id] || 0;
          const isCurrent = lvl.id === saveData.unlockedLevel;

          const card = document.createElement('button');
          card.type = 'button';
          card.disabled = !isUnlocked;

          if (!isUnlocked) {
            card.className = 'bz-locked w-full rounded-2xl p-3 flex items-center justify-between text-left';
            card.innerHTML = `
              <div class="flex items-center gap-3">
                <div class="bz-lk-ico w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-base">🔒</div>
                <div>
                  <div class="bz-lk-name">第 ${lvl.id} 關 • ${lvl.name}</div>
                  <div class="bz-lk-sub">通關上一關解鎖</div>
                </div>
              </div>
              <span class="bz-lk-tag">未解鎖</span>
            `;
          } else {
            card.className = `bz-lvl-card w-full rounded-2xl p-3 border-2 flex items-center justify-between text-left transition-transform active:scale-98 cursor-pointer ${
              isCurrent
                ? 'bz-breath bg-gradient-to-r from-amber-950/85 to-slate-900 border-amber-400'
                : 'bg-slate-900 hover:bg-slate-800 border-slate-700'
            }`;

            const starStr = [1, 2, 3].map((n) => (n <= earnedStars ? '⭐' : '☆')).join('');
            const wx = levelWeather(lvl);
            const tags = [
              `${wx.icon} ${wx.name}`,
              `初始 ${lvl.startTemp}°C`,
              `${lvl.hotspots.length} 處破損`,
              `🧰 材料 ${lvl.budget}`
            ];
            if (lvl.hotspots.some((h) => h.iced)) tags.push('結冰');
            const ruleType = chapterRule(lvl).type;
            if (ruleType === 'expand') tags.push('破洞擴大');
            if (ruleType === 'shortage') tags.push('缺料');

            card.innerHTML = `
              ${earnedStars >= 3 ? '<span class="bz-lvl-crown" title="三星">👑</span>' : ''}
              <div class="flex items-center gap-3 min-w-0 pr-2">
                <div class="w-10 h-10 rounded-xl ${isCurrent ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-amber-300'} font-black text-sm flex items-center justify-center shrink-0">
                  ${lvl.id}
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="text-sm font-black text-white truncate">${lvl.name}</span>
                    ${isCurrent ? '<span class="text-[9px] px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-black shrink-0">最新</span>' : ''}
                  </div>
                  <div class="text-xs text-slate-300 line-clamp-1 mt-0.5">${lvl.desc}</div>
                  <div class="flex flex-wrap gap-1 mt-1">
                    ${tags.map((t) => `<span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-amber-200 border border-slate-700">${t}</span>`).join('')}
                  </div>
                </div>
              </div>
              <div class="flex flex-col items-end shrink-0">
                <div class="text-xs tracking-tighter">${starStr}</div>
                <span class="mt-1 px-2.5 py-1 rounded-lg text-xs font-black ${isCurrent ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-white'}">
                  ${earnedStars > 0 ? '重玩' : '開始'}
                </span>
              </div>
            `;

            card.addEventListener('click', () => {
              sound.init();
              sound.playClick();
              startLevel(lvl.id);
            });
          }

          grid.appendChild(card);
        });
      });
    }

    function showMapOverlay() {
      state.status = 'map';
      runToken++;
      closeConfirm();
      dom.briefOverlay.hidden = true;
      hideToast();
      dom.endOverlay.classList.add('hidden', 'pointer-events-none');
      renderLevelMap();
      dom.mapOverlay.classList.remove('hidden', 'pointer-events-none');

      sound.setWindIntensity(0.02, false);
    }

    /**
     * ============================================================================
     * 7. 關卡初始化與熱量/豪宅改造度計算
     * ============================================================================
     */
    // 本關開場公告：天氣、章節規則、新機制提示
    function ruleLineOf(g) {
      const r = g.rule || { type: 'none' };
      if (r.type === 'shortage') {
        return g.shortageCat ? `缺料：本關「${CATEGORIES[g.shortageCat]}」缺貨，標示缺貨的卡不能用。` : r.text;
      }
      if (r.type === 'none') return '';
      return r.text;
    }

    // HUD 上的規則 chip 只放短名稱（完整說明點 chip 再看）
    function ruleShortOf(g) {
      const r = g.rule || { type: 'none' };
      if (r.type === 'none') return '';
      if (r.type === 'ice') return '結冰';
      if (r.type === 'expand') return '破洞擴大';
      if (r.type === 'shortage') return g.shortageCat ? `缺料：${CATEGORIES[g.shortageCat]}` : '缺料';
      return '章節規則';
    }

    function renderInfoRow() {
      const lvl = state.currentLevel;
      const wx = levelWeather(lvl);
      dom.weatherChip.textContent = `${wx.icon} ${wx.name} ⓘ`;
      const rs = ruleShortOf(state);
      if (rs) {
        dom.ruleChip.textContent = `📌 ${rs} ⓘ`;
        dom.ruleChip.classList.remove('hidden');
      } else {
        dom.ruleChip.classList.add('hidden');
      }
    }

    // 本關簡報：天氣、材料、章節規則、提示都放在一張卡上，按「開始修補」才開始計時
    function showBriefing(lvl) {
      const wx = levelWeather(lvl);
      dom.briefKicker.textContent = `第 ${lvl.id} 關・本關簡報`;
      dom.briefTitle.textContent = lvl.name;
      const rows = [
        ['🎯', '目標', `室溫升到 ${lvl.targetTemp.toFixed(0)}°C（起始 ${lvl.startTemp}°C），別讓室溫掉到 0°C。`],
        [wx.icon, `本關天氣：${wx.name}`, weatherText(lvl)],
        ['🧰', `材料點數：${lvl.budget} 點`, '每張卡會花掉標示的點數；點數用完還有免費的保底選項。']
      ];
      const rl = ruleLineOf(state);
      if (rl) rows.push(['📌', '章節規則', rl]);
      if (lvl.hint) rows.push(['💡', '提示', lvl.hint]);
      dom.briefRows.textContent = '';
      rows.forEach(([ico, label, text]) => {
        const row = document.createElement('div');
        row.className = 'bz-brief-row';
        const i = document.createElement('span');
        i.className = 'bz-brief-ico';
        i.textContent = ico;
        const d = document.createElement('div');
        const b = document.createElement('b');
        b.textContent = label;
        d.appendChild(b);
        d.appendChild(document.createTextNode(text));
        row.appendChild(i);
        row.appendChild(d);
        dom.briefRows.appendChild(row);
      });
      dom.briefOverlay.hidden = false;
      dom.briefOverlay.scrollTop = 0;
    }

    // 按下「開始修補」：這時才開始計時（簡報期間 status = 'briefing'，gameLoop 不會推進溫度）
    function beginPlaying() {
      if (state.status !== 'briefing') return;
      dom.briefOverlay.hidden = true;
      state.status = 'playing';
      state.lastFrameTime = 0;
      state.bubble.t = state.time; // 簡報期間不算，泡泡從開始修補才計 3 秒
      state.bubble.toasted = false;
      renderDecisionPanel();
      updateHUD();
    }

    function startLevel(levelId) {
      const lvl = LEVELS.find((l) => l.id === levelId) || LEVELS[0];
      state.currentLevel = lvl;
      state.status = 'briefing'; // 先看簡報，按「開始修補」才變 playing
      runToken++;
      uiPaused = false;
      state.pinPress = null;
      initLevel(state, lvl, Math.random); // 核心規則：溫度、點數、天氣、各破洞狀態都在這裡重置
      state.warnedBudget = false;

      state.flyingTool = null;
      state.fxParticles = [];
      state.floatingTexts = [];
      state.rings = [];
      state.drips = [];
      state.lastHandRef = null;
      state.pickedOpt = null;
      state.lastToastAt = -99;
      state.bubble.key = '';

      state.selectedId = lvl.hotspots[0].id;
      state.starsSeen = getLuxuryProgress().stars;

      dom.hudLevelBadge.textContent = `第 ${lvl.id} 關`;
      dom.hudLevelName.textContent = lvl.name;

      dom.mapOverlay.classList.add('hidden', 'pointer-events-none');
      dom.mapOverlay.classList.remove('pointer-events-auto');
      dom.endOverlay.classList.add('hidden', 'pointer-events-none');
      dom.endOverlay.classList.remove('pointer-events-auto');
      hideToast();

      resizeCanvas();
      initSnowParticles();

      const targetPct = Math.min(95, Math.max(10, (lvl.targetTemp / state.maxTemp) * 100));
      dom.targetTempMarker.style.left = `${targetPct}%`;
      dom.targetTempText.textContent = `目標 ${lvl.targetTemp.toFixed(0)}°C`;

      setBubble('好冷！先看天氣與卡片標籤，再選最合適的材料！', 'cold');
      sound.setWindIntensity(0.05, false);

      renderInfoRow();
      renderDecisionPanel();
      updateHUD();
      renderCanvasFrame();
      showBriefing(lvl);
    }

    // 豪華改造度與星等 (計算在核心規則 calcProgress)
    function getLuxuryProgress() {
      return calcProgress(state);
    }

    // 即時溫度變化速度 (核心規則 tempRate)
    function computeTempDeltaPerSec() {
      return tempRate(state);
    }

    /**
     * ============================================================================
     * 8. HUD 與底部「道具三選一」面板渲染
     * ============================================================================
     */
    function updateHUD() {
      const clampedTemp = Math.max(0, Math.min(state.maxTemp, state.temp));
      dom.tempValue.textContent = `${clampedTemp.toFixed(1)}°C`;

      const rate = computeTempDeltaPerSec();
      if (rate >= 0.35) {
        dom.leakBadge.textContent = '🔥 升溫中';
        dom.leakBadge.className = 'text-xs font-black px-1.5 py-0.5 rounded-md bg-emerald-950 text-emerald-300 border border-emerald-400';
      } else if (rate >= -0.25) {
        dom.leakBadge.textContent = '🌤️ 漸穩';
        dom.leakBadge.className = 'text-xs font-black px-1.5 py-0.5 rounded-md bg-amber-950 text-amber-300 border border-amber-400';
      } else if (rate > -1.2) {
        dom.leakBadge.textContent = '❄️ 漏風中';
        dom.leakBadge.className = 'text-xs font-black px-1.5 py-0.5 rounded-md bg-orange-950 text-orange-300 border border-orange-500';
      } else {
        dom.leakBadge.textContent = '🚨 寒流狂灌';
        dom.leakBadge.className = 'text-xs font-black px-1.5 py-0.5 rounded-md bg-red-950 text-red-300 border border-red-500 animate-pulse';
      }

      const pct = (clampedTemp / state.maxTemp) * 100;
      dom.tempBar.style.width = `${pct}%`;

      if (clampedTemp < 5.0 && state.status === 'playing') {
        dom.frostLayer.style.opacity = String(Math.min(1, (5.0 - clampedTemp) / 3.8));
      } else {
        dom.frostLayer.style.opacity = '0';
      }

      // 溫度：<5°C 危險（變紅＋脈動）、接近目標時溫度條有光澤流過
      const tgt = state.currentLevel.targetTemp;
      let tEmoji, tValCls, tBarCls;
      const BAR = 'h-full rounded-full transition-all duration-100 bg-gradient-to-r ';
      if (clampedTemp < 5.0) {
        tEmoji = '🥶';
        tValCls = 'text-sm font-black tabular-nums bz-danger-val';
        tBarCls = BAR + 'from-red-600 to-rose-400 bz-danger-bar';
      } else if (clampedTemp < tgt * 0.72) {
        tEmoji = '😨';
        tValCls = 'text-sm font-black text-cyan-300 tabular-nums';
        tBarCls = BAR + 'from-cyan-500 to-sky-300';
      } else if (clampedTemp < tgt) {
        tEmoji = '😊';
        tValCls = 'text-sm font-black text-amber-300 tabular-nums';
        tBarCls = BAR + 'from-amber-500 to-yellow-300';
      } else {
        tEmoji = '🥰';
        tValCls = 'text-sm font-black text-emerald-300 tabular-nums';
        tBarCls = BAR + 'from-emerald-500 to-lime-300';
      }
      if (clampedTemp >= 5.0 && clampedTemp >= tgt * 0.85) tBarCls += ' bz-shine';
      if (dom.tempEmoji.textContent !== tEmoji) {
        dom.tempEmoji.textContent = tEmoji;
        if (state.status === 'playing' || state.status === 'animating') popEl(dom.tempEmoji);
      }
      setCls(dom.tempValue, tValCls);
      setCls(dom.tempBar, tBarCls);

      // 材料點數
      dom.budgetChip.textContent = `🧰 材料 ${state.budget} / ${state.currentLevel.budget}`;
      dom.budgetChip.className = `bz-chip tabular-nums border ${
        state.budget <= 0
          ? 'bg-red-950 text-red-300 border-red-500'
          : state.budget <= 3
          ? 'bg-orange-950 text-orange-300 border-orange-500'
          : 'bg-amber-950 text-amber-200 border-amber-500/70'
      }`;

      // 豪華改造度更新
      const lux = getLuxuryProgress();
      dom.luxuryBar.style.width = `${lux.pct}%`;
      dom.repairCountText.textContent = `${lux.repairedCount} / ${lux.total} 處`;
      dom.luxuryStarsPreview.textContent = [1, 2, 3].map((n) => (n <= lux.stars ? '⭐' : '☆')).join('');
      if (lux.stars > state.starsSeen && (state.status === 'playing' || state.status === 'animating')) popEl(dom.luxuryStarsPreview);
      state.starsSeen = lux.stars;

      // 狂風預警條（標籤只留兩個字，360 寬也不會被截斷；預警 3 秒倒數變色跳動）
      const hudWeather = levelWeather(state.currentLevel);
      const GH = 'flex-1 border rounded-xl px-2 py-1 flex items-center justify-between gap-1 min-w-0 ';
      const GT = 'text-xs font-black px-1.5 py-0.5 rounded tabular-nums shrink-0 ';
      if (hudWeather.id !== 'gale') {
        setCls(dom.galeHud, GH + 'bg-slate-900 border-slate-700');
        setTxt(dom.galeIcon, hudWeather.icon);
        setTxt(dom.galeLabel, hudWeather.name);
        setCls(dom.galeLabel, 'text-xs font-black text-slate-300 truncate');
        setTxt(dom.galeTimer, '無狂風');
        setCls(dom.galeTimer, GT + 'bg-slate-800 text-cyan-300');
      } else if (state.galePhase === 'calm') {
        setCls(dom.galeHud, GH + 'bg-slate-900 border-slate-700');
        setTxt(dom.galeIcon, '🌨️');
        setTxt(dom.galeLabel, '下波');
        setCls(dom.galeLabel, 'text-xs font-black text-cyan-200 truncate');
        setTxt(dom.galeTimer, `${Math.ceil(state.galeTimer)}s`);
        setCls(dom.galeTimer, GT + 'bg-slate-800 text-cyan-300');
      } else if (state.galePhase === 'warning') {
        setCls(dom.galeHud, GH + 'bg-amber-950/90 border-amber-400');
        setTxt(dom.galeIcon, '⚠️');
        setTxt(dom.galeLabel, '預警');
        setCls(dom.galeLabel, 'text-xs font-black text-amber-200 truncate');
        setTxt(dom.galeTimer, `${Math.max(0, state.galeTimer).toFixed(1)}s`);
        setCls(dom.galeTimer, GT + 'bz-gt-warn');
      } else {
        setCls(dom.galeHud, GH + 'bg-red-950/95 border-red-400');
        setTxt(dom.galeIcon, '🌪️');
        setTxt(dom.galeLabel, '狂風');
        setCls(dom.galeLabel, 'text-xs font-black text-red-200 truncate');
        setTxt(dom.galeTimer, `${Math.max(0, state.galeTimer).toFixed(1)}s`);
        setCls(dom.galeTimer, GT + 'bz-gt-gale');
      }

      // 天氣覆蓋層：濕雪偏灰藍、酷寒冷暈、狂風預警邊緣閃光
      let wxCls = 'bz-wx';
      const wid = state.currentLevel.weather;
      if (wid === 'wet') wxCls += ' bz-wx-wet';
      else if (wid === 'cold') wxCls += ' bz-wx-cold';
      if (state.status !== 'victory' && state.status !== 'gameover') {
        if (state.galePhase === 'warning') wxCls += ' bz-wx-warn';
        else if (state.galePhase === 'gale') wxCls += ' bz-wx-gale';
      }
      setCls(dom.wxLayer, wxCls);
    }

    function selectHotspot(hotspotId) {
      if (state.status !== 'playing') return;
      sound.init();
      sound.playClick();
      state.selectedId = hotspotId;

      const def = HOTSPOT_LIBRARY[hotspotId];
      if (def) {
        const pp = pinPos(def);
        addFloatingText(pp.x, pp.y - 18, `👆 ${def.name}`, '#fde047');
      }
      renderDecisionPanel();
    }

    function renderDecisionPanel() {
      const hotspots = state.currentLevel.hotspots;

      // 1. 頂部快捷破損目標分頁（重畫前記住捲動位置，畫完再把選中的那顆捲到中間）
      const prevScroll = dom.hotspotTabs.scrollLeft;
      let selectedTab = null;
      dom.hotspotTabs.innerHTML = '';
      hotspots.forEach((hSpec) => {
        const def = HOTSPOT_LIBRARY[hSpec.id];
        const st = state.hotspotStates[hSpec.id];
        if (!def || !st) return;

        const isSelected = state.selectedId === hSpec.id;
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.addEventListener('click', () => selectHotspot(hSpec.id));

        let statusIcon = st.iced ? '❄️' : '❗';
        if (st.tier === 'luxury') statusIcon = '👑';
        else if (st.tier === 'makeshift') statusIcon = '📎';

        tab.className = `bz-tab border transition-all cursor-pointer ${
          isSelected
            ? 'bg-amber-400 text-slate-950 border-yellow-100 bz-tab-on'
            : st.tier === 'luxury'
            ? 'bg-emerald-950/80 text-emerald-300 border-emerald-600/70'
            : st.tier === 'makeshift'
            ? 'bg-sky-950/80 text-sky-200 border-sky-500/70'
            : 'bg-slate-800 text-slate-200 border-slate-600 hover:border-amber-400'
        }`;
        tab.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        tab.innerHTML = `<span>${statusIcon}</span><span>${def.name}</span>`;
        dom.hotspotTabs.appendChild(tab);
        if (isSelected) selectedTab = tab;
      });
      dom.hotspotTabs.scrollLeft = prevScroll;
      centerSelectedTab(selectedTab);
      updateTabFade();

      // 2. 當前選中破損描述
      const curId = state.selectedId;
      const curDef = HOTSPOT_LIBRARY[curId];
      const curState = state.hotspotStates[curId];
      if (!curDef || !curState) return;

      if (curState.iced) {
        dom.selectedHotspotDesc.textContent = curDef.icedDesc;
        dom.selectedHotspotLeak.textContent = '❄️ 需先除冰';
        dom.selectedHotspotLeak.className = 'text-xs font-black px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-200 border border-cyan-400 shrink-0 animate-pulse';
      } else if (curState.tier === 'luxury') {
        dom.selectedHotspotDesc.textContent = curDef.luxuryDesc;
        dom.selectedHotspotLeak.textContent = '👑 豪宅級完成';
        dom.selectedHotspotLeak.className = 'text-xs font-black px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-500 shrink-0';
      } else if (curState.tier === 'makeshift') {
        dom.selectedHotspotDesc.textContent = curDef.makeshiftDesc;
        dom.selectedHotspotLeak.textContent = '📎 可升級豪華版';
        dom.selectedHotspotLeak.className = 'text-xs font-black px-1.5 py-0.5 rounded bg-sky-950 text-sky-200 border border-sky-400 shrink-0';
      } else {
        dom.selectedHotspotDesc.textContent = curDef.brokenDesc;
        const snowIcons = '❄️'.repeat(curDef.coldLevel || 1);
        dom.selectedHotspotLeak.textContent = `${snowIcons} 漏風中`;
        dom.selectedHotspotLeak.className = 'text-xs font-black px-1.5 py-0.5 rounded bg-red-950 text-red-300 border border-red-500/70 shrink-0';
      }

      // 3. 道具卡片：每個破洞第一次打開時抽 3 張，之後維持同一組 (避免重開刷牌)
      const stage1 = Boolean(curState.iced);
      const hand = ensureHand(state, curId);
      dom.cardsContainer.innerHTML = '';
      // 新的一手牌出現（換破洞／除冰後換階段）：三張依序淡入上浮，總長 ≤250ms，不影響點擊
      const isNewHand = hand !== state.lastHandRef;
      state.lastHandRef = hand;
      hand.forEach((opt, i) => {
        const card = buildToolCard(opt, curId, curState, stage1);
        if (isNewHand) {
          card.classList.add('bz-card-in');
          card.style.animationDelay = `${i * 40}ms`;
        }
        dom.cardsContainer.appendChild(card);
      });
      renderFallbackButton(curId, curState, stage1);
    }

    // 左右邊緣淡出遮罩：左邊／右邊還有東西可捲時才淡出
    function updateTabFade() {
      const box = dom.hotspotTabs;
      const l = box.scrollLeft > 2 ? 22 : 0;
      const r = box.scrollLeft + box.clientWidth < box.scrollWidth - 2 ? 22 : 0;
      box.style.setProperty('--fade-l', `${l}px`);
      box.style.setProperty('--fade-r', `${r}px`);
    }

    // 把選中的按鈕捲到可見處（置中）；用容器自己的 scrollBy，不會牽動整個頁面
    function centerSelectedTab(tab) {
      if (!tab) return;
      requestAnimationFrame(() => {
        const box = dom.hotspotTabs;
        if (!tab.isConnected || !box.clientWidth) return;
        const bRect = box.getBoundingClientRect();
        const tRect = tab.getBoundingClientRect();
        const delta = tRect.left + tRect.width / 2 - (bRect.left + bRect.width / 2);
        if (Math.abs(delta) > 1) {
          if (box.scrollBy) box.scrollBy({ left: delta, behavior: 'smooth' });
          else box.scrollLeft += delta;
        }
        updateTabFade();
      });
    }

    const BLOCK_TEXT = { budget: '材料不足', oos: '缺貨', maxed: '已豪華改造', used: '已使用' };
    const TRAIT_CHIP_CLASS = {
      windproof: 'bg-sky-200 text-sky-900',
      galefear: 'bg-rose-200 text-rose-900',
      warm: 'bg-orange-200 text-orange-900',
      damp: 'bg-slate-300 text-slate-800',
      dry: 'bg-emerald-200 text-emerald-900'
    };
    const CHIP_WARN = 'bg-red-600 text-white';

    function fmtSigned(v) {
      return `${v >= 0 ? '+' : ''}${v.toFixed(1)}`;
    }

    // 組一張道具卡。資訊層次：效果數值最大 → 名稱 → 次要數值 → 特性標籤；
    // 當前天氣下的警示（會被吹掉／怕潮打折）統一用紅色警示標籤＋右上角 ⚠；成本在左上角，不壓圖示；
    // 三張卡底色一致（陷阱不靠顏色露餡，差異只在標籤與數值）
    function buildToolCard(opt, hsId, st, stage1) {
      const eff = effOf(state, hsId, opt, stage1);
      const reason = state.status !== 'playing' ? 'busy' : blockReason(state, hsId, opt);
      const card = document.createElement('button');
      card.type = 'button';
      card.disabled = Boolean(reason);
      card.className = 'tool-card';
      card.title = opt.say || '';
      if (state.pickedOpt === opt) card.classList.add('bz-card-gone');

      // 標籤：[樣式, 文字, 是否警示]
      const chips = [];
      let warn = false;
      if (opt.tier === 'trap') {
        chips.push(['bg-amber-200 text-amber-900', opt.tag || '特殊', false]);
      } else {
        (opt.traits || []).forEach((tr) => {
          let cls = TRAIT_CHIP_CLASS[tr] || 'bg-amber-200 text-amber-900';
          let w = false;
          if (tr === 'damp' && eff.dampHit) w = true;
          if (tr === 'galefear' && eff.blown) w = true;
          chips.push([cls, TRAIT_INFO[tr] ? TRAIT_INFO[tr].label : tr, w]);
        });
        if (eff.blown && !hasTrait(opt, 'galefear')) chips.push(['', '會被吹掉', true]);
        if (stage1 && !hasTrait(opt, 'dry')) chips.push(['bg-amber-300 text-amber-950', '留潮氣', false]);
        if (opt.cost <= 1 && opt.cost > 0 && chips.length < 2) chips.push(['bg-lime-200 text-lime-900', '便宜', false]);
      }
      chips.forEach((c) => { if (c[2]) warn = true; });
      const chipHtml = chips.slice(0, 3)
        .map(([cls, txt, w]) => `<span class="bz-card-chip ${w ? 'bz-chip-warn' : cls}">${txt}</span>`)
        .join('');

      // 數值：最醒目的是這張卡「現在」的升溫量
      let main;
      let sub = '';
      if (opt.tier === 'trap' || stage1) {
        main = `<span class="bz-big">${fmtSigned(opt.tier === 'trap' ? opt.delta : eff.delta)}°C</span>`;
      } else {
        main = `<span class="bz-big ${eff.dampHit ? 'bz-bad' : ''}">${eff.dampHit ? '▼' : ''}${fmtSigned(eff.delta)}°C</span>` +
          `<span class="bz-seal ${eff.dampHit ? 'bz-bad' : ''}">封${Math.round(eff.seal * 100)}%</span>`;
        if (eff.heat > 0) {
          const hCls = eff.warmUp ? 'bz-up' : eff.dampHit ? 'bz-bad' : '';
          sub = `<div class="bz-card-sub ${hCls}">${eff.warmUp ? '▲' : eff.dampHit ? '▼' : ''}暖 +${eff.heat.toFixed(2)}/s</div>`;
        }
      }

      const costText = opt.cost > 0 ? `🧰${opt.cost}` : '免費';
      const maxed = !stage1 && st.rank >= 2;
      const icon = safeIcon(maxed && opt.tier === 'luxury' ? '👑' : opt.icon);
      const reasonLine = BLOCK_TEXT[reason]
        ? `<div class="bz-card-reason">${BLOCK_TEXT[reason]}</div>`
        : '';

      card.innerHTML = `
        <div class="bz-card-top">
          <div class="bz-card-cost">${costText}</div>
          <div class="bz-card-icon">${icon}</div>
          <div class="bz-card-warnico">${warn ? '⚠' : ''}</div>
        </div>
        <div class="bz-card-name">${opt.name}</div>
        <div class="bz-card-main">${main}</div>
        ${sub}
        <div class="bz-card-chips">${chipHtml}</div>
        ${reasonLine}
      `;

      card.addEventListener('click', (e) => handleChoiceClick(opt, e.currentTarget));
      return card;
    }

    // 免費保底：點數用完時的出路 (效果很小，但能撐住不卡死)
    function renderFallbackButton(hsId, st, stage1) {
      const box = dom.fallbackContainer;
      box.innerHTML = '';
      if (!stage1 && st.rank >= 0) return;
      const it = stage1 ? FALLBACK_DEICE : FALLBACK_REPAIR;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.disabled = state.status !== 'playing';
      btn.className = 'bz-fallback-btn';
      btn.textContent = stage1
        ? '🧤 徒手摳冰：免費保底（只能鬆動冰面）'
        : '🧤 就地取材：免費保底（效果很小）';
      btn.addEventListener('click', (e) => handleChoiceClick(it, e.currentTarget));
      box.appendChild(btn);
    }

    /**
     * ============================================================================
     * 9. 道具飛向破洞與結果結算 (雙結局 / 兩階段除冰 / 狂風吹飛)
     * ============================================================================
     */
    function handleChoiceClick(option, cardEl) {
      if (state.status !== 'playing') return;

      sound.init();
      sound.playClick();

      const hotspotId = state.selectedId;
      const def = HOTSPOT_LIBRARY[hotspotId];

      // 點數不足 / 缺貨 / 已使用：不能選
      const why = blockReason(state, hotspotId, option);
      if (why) {
        showToast('error', BLOCK_TEXT[why] || '這張卡現在不能用', why === 'budget' ? '材料點數不夠，改選便宜的卡，或用免費的「就地取材」。' : '換一張卡試試。');
        return;
      }

      // 先量卡片位置再重畫面板（重畫會把這張卡從 DOM 移掉，量出來會是 0）
      const cardRect = cardEl.getBoundingClientRect();
      const canvasRect = dom.canvas.getBoundingClientRect();
      state.status = 'animating';
      state.pickedOpt = option; // 重畫後這張卡呈「已飛出」的淡出樣子
      renderDecisionPanel();

      const startX = cardRect.left + cardRect.width / 2 - canvasRect.left;
      const startY = cardRect.top + cardRect.height / 2 - canvasRect.top;
      const tp = pinPos(def);
      const targetX = tp.x;
      const targetY = tp.y;

      state.flyingTool = {
        icon: safeIcon(option.icon),
        startX,
        startY,
        targetX,
        targetY,
        progress: 0,
        hotspotId,
        option
      };
    }

    function resolveChoiceImpact(hotspotId, option) {
      const def = HOTSPOT_LIBRARY[hotspotId];
      const pp = pinPos(def);
      const tx = pp.x;
      const ty = pp.y;
      const token = runToken; // 延遲回呼執行時若已換局，就不要動狀態
      state.pickedOpt = null;

      // 核心規則：扣點數、改溫度、改破洞狀態
      const res = applyChoice(state, hotspotId, option);
      if (!res.ok) {
        state.status = 'playing';
        renderDecisionPanel();
        return;
      }
      haptic(res.kind === 'trap' ? HAPTIC_TRAP : HAPTIC_OK);
      const dStr = `${fmtSigned(res.delta)}°C`;

      // 情況 A：選中陷阱！
      if (res.kind === 'trap') {
        sound.playFail();
        triggerScreenShake();
        triggerScreenFlash('bz-fl-red');
        showToast('error', `${option.icon} ${option.fail}`, `室溫 ${dStr}，失誤 +1`);
        setBubble(option.say || '糟糕！選錯工具啦！', 'pain');
        addFloatingText(tx, ty - 18, dStr, '#f87171');
        spawnFxParticles(tx, ty, option.fx || 'ice_blast');
        spawnFxParticles(tx, ty, 'cold_wind');
        addRing(tx, ty, '#f87171');
      }
      // 情況 B：結冰第一階段 -> 除冰成功
      else if (res.kind === 'deice') {
        const dry = hasTrait(option, 'dry');
        if (option.tier === 'luxury') {
          sound.playLuxurySuccess();
          triggerScreenFlash('bg-amber-300/30');
        } else {
          sound.playMakeshiftSuccess();
          triggerScreenFlash('bg-sky-300/25');
        }
        showToast('info', `${option.icon} 「${option.name}」除冰完成！`,
          `${option.say}${dry ? '' : '（破洞濕濕的，怕潮的材料會打折）'}`);
